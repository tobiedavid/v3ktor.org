<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Trial Log</title>
<meta name="description" content="Find the food behind diarrhea: cut foods until your gut calms, then bring them back one at a time. Free and private: everything stays on your phone.">
<meta name="theme-color" content="#c8481f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#1c1b19;--muted:#6b665d;--line:#e6e0d4;--accent:#c8481f;--teal:#0f6b6b;--teal-soft:#e3f0ef;--warn:#b3261e;--warn-soft:#fbe9e7;--chip:#f1ede4;--chip-on:#1c1b19;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px -10px rgba(0,0,0,.15)}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--card:#1e2026;--ink:#ececea;--muted:#a19d95;--line:#2d3038;--accent:#e3633a;--teal:#5fb3b3;--teal-soft:#1c2c2c;--warn:#ff7b6e;--warn-soft:#3a1f1c;--chip:#2a2d35;--chip-on:#ececea;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px -10px rgba(0,0,0,.6)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
.wrap{max-width:600px;margin:0 auto;padding:14px 18px 24px}
h1,h2,h3{font-family:ui-serif,Georgia,'Times New Roman',serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:2.2rem;font-weight:800}
h1 .b{color:var(--accent)}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700;margin-top:0}
p{margin:.35em 0 .8em}
.muted{color:var(--muted)} .small{font-size:.9rem}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:0.875rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.card.fold{max-height:118px;overflow:hidden;position:relative;cursor:pointer;padding-bottom:34px}
.card.fold::after{content:'';position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(to bottom,transparent,var(--card) 60%);pointer-events:none}
.card.fold .fdbtn{position:absolute;right:14px;bottom:8px;z-index:1;font-size:.85rem;font-weight:700;color:var(--teal)}
.card.fold:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.fdclose{display:block;margin:10px 0 0 auto;background:none;border:0;padding:4px 0;font:inherit;font-size:.85rem;font-weight:700;color:var(--teal);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
.card.flag{border-color:var(--warn);background:var(--warn-soft)}
.card.soft{background:var(--teal-soft);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:.92rem;border-radius:11px;min-height:44px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px}
.topbar .sp{flex:1}
.tb{border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer;padding:8px 10px;border-radius:10px;font-weight:700;min-height:44px;min-width:44px}
.tb:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#menuBtn{font-size:1.25rem;line-height:1}
.tb.ttl{font-family:ui-serif,Georgia,'Times New Roman',serif;font-weight:800;font-size:1.1rem;padding:6px 4px;white-space:nowrap}
@media (max-width:360px){.tb.gls{padding:6px 8px;font-size:0.875rem}}
.tb.ttl .b{color:var(--accent)}
.tb.gls{font-size:0.875rem;border:1px solid var(--line)}
.menu{display:grid;gap:6px;margin-top:6px}
.menu button,.menu a{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.menu .danger{color:var(--warn)}
.gl{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 2px;font:inherit;cursor:pointer}
.gl .grade{margin:0;flex:none}
html.locked,html.locked body{overflow:hidden}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:0.875rem;font-weight:700;padding:6px 14px;cursor:pointer;min-height:44px;min-width:44px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:grid;gap:10px;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;font-size:1.02rem;line-height:1.3;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--bg);border-color:var(--chip-on)}
.chip.danger[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.prog{display:flex;gap:4px;flex:1;margin:0 12px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)}
.qn{font-size:0.875rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.t{color:var(--teal);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:pointer;font-weight:600;padding:.35em 0}
ul{padding-left:1.1em;margin:.3em 0 .6em} li{margin:.3em 0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .22s,visibility 0s linear .22s;z-index:50;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .22s,visibility 0s}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:1.25rem}
.grade{display:inline-block;font-size:0.875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:10px}
.grade.solid{background:#2e6b3a;color:#fff}.grade.likely{background:var(--teal);color:#fff}.grade.try{background:var(--chip);color:var(--muted)}details.more{margin:10px 0 0}details.more>summary{cursor:pointer;list-style:none;padding:12px 14px;border-radius:14px;background:var(--chip);font-weight:600;font-size:.95rem}details.more>summary::-webkit-details-marker{display:none}details.more>summary::after{content:' ▾';color:var(--muted)}details.more[open]>summary::after{content:' ▴'}details.more[open]>summary{margin-bottom:10px}
.tm details{border-top:1px solid var(--chip);padding:8px 0}.tm details:last-child{border-bottom:1px solid var(--chip)}.tm summary{cursor:pointer;line-height:1.35}.tm summary .muted{font-size:.88rem}.tm p{margin:6px 0 0;font-size:.95rem}
.grade.reason{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--muted)}
.ev{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:0.875rem;color:var(--muted);line-height:1.45}
.ev b{color:var(--ink)}
.ev .src{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.ev .src a{display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;padding:4px 12px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:0.875rem;font-weight:600;border:1px solid var(--line)}
.ev .src a:after{content:" ↗";opacity:.6}
.ev .rev{margin-top:10px;font-size:0.875rem;font-style:italic;opacity:.85}
.patch h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:0.875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--accent);padding:3px 8px;border-radius:999px}
.tag.teal{background:var(--teal)} .tag.ink{background:var(--ink);color:var(--bg)}
.cost{font-variant-numeric:tabular-nums;color:var(--muted);font-size:0.875rem;white-space:nowrap}
textarea.out{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
.hidden{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.checkin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip[aria-pressed="true"]::before{content:"✓ ";font-weight:700}
/* v1.2.25: checkbox for pick-several, circle for pick-one */
.pickall{margin:12px 0 -4px;font-weight:700;font-size:.95rem}
.chips.pickn .chip,.chips.pick1 .chip{display:flex;align-items:flex-start;gap:12px}
.chips.pickn .chip::before,.chips.pick1 .chip::before{content:"";flex:0 0 22px;width:22px;height:22px;margin-top:-1px;box-sizing:border-box;border:2px solid var(--muted);background:var(--card)}
.chips.pickn .chip::before{border-radius:6px}
.chips.pick1 .chip::before{border-radius:50%}
.chips.pickn .chip[aria-pressed="true"]::before{content:"✓";border-color:var(--bg);background:var(--bg);color:var(--chip-on);font-size:15px;font-weight:800;line-height:18px;text-align:center}
.chips.pick1 .chip[aria-pressed="true"]::before{content:"";border-color:var(--bg);background:radial-gradient(circle,var(--bg) 0 5px,transparent 6px)}
.chips.pickn .chip.danger[aria-pressed="true"]::before{color:var(--warn)}
.t:focus-visible,.chip:focus-visible,.btn:focus-visible,.ev .src a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.add-warn{display:block;margin-top:4px;color:var(--warn);font-size:.88rem;font-weight:600}
.hand{border:2px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:.95rem;line-height:1.45}
.hand div{margin:2px 0}
.chip.ack{width:100%;font-size:0.875rem;line-height:1.35;margin-top:12px;padding:10px 14px;opacity:.85}
.card.gate{border:2px solid var(--accent)}
.btn[aria-disabled="true"]{opacity:.45}
.doors{display:grid;gap:12px;margin-top:14px}
.door{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--accent);background:var(--card);color:var(--ink);border-radius:18px;padding:16px 18px;font:inherit;cursor:pointer;box-shadow:var(--shadow)}
.door.main{padding:20px 20px;border-left-width:7px}
.door.main .dt{font-size:1.45rem}
.doors.small{grid-template-columns:1fr;gap:8px;margin-top:8px}
.doors.small .door{padding:12px 14px}
.doors.small .door .dt{font-size:1.05rem;margin:0}
.doors.small .door .ds{font-size:0.875rem}
.or{margin:16px 0 0;font-size:0.875rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.one{border:2px solid var(--ink)}
.one .big{font-size:1.15rem;line-height:1.4;font-weight:600;margin:4px 0 6px}
.door.teal{border-left-color:var(--teal)} .door.ink{border-left-color:var(--ink)} .door.green{border-left-color:#2e6b3a}
.door .eyebrow{display:block;margin-bottom:2px}
.door .dt{display:block;font-family:ui-serif,Georgia,'Times New Roman',serif;font-weight:800;line-height:1.15;margin:2px 0 4px;font-size:1.2rem}
.door .ds{display:block;color:var(--muted);font-size:.95rem;line-height:1.4}
.door .status{display:inline-block;margin-top:8px;font-size:0.875rem;font-weight:700;color:var(--teal)}
.door[aria-disabled="true"]{opacity:.5}
.door:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.verdict h3{font-size:1.35rem;margin:6px 0 8px}
.grade.unclear{background:var(--chip);color:var(--muted)}
.also li{margin:.25em 0}
.intent{display:grid;gap:8px;margin:10px 0}
textarea.out.live{min-height:240px;font-size:0.875rem;line-height:1.4}
.pat{font-variant-numeric:tabular-nums}
.tk{display:grid;gap:8px}
.tk .r{display:grid;grid-template-columns:7.2em 1fr auto;gap:8px;align-items:center;font-size:.92rem}
.tk .r .nm{font-weight:600;line-height:1.2}
.tk .r .nm small{display:block;font-weight:400;color:var(--muted);font-size:0.875rem}
.tk .meter{height:12px;border-radius:6px;background:var(--chip);overflow:hidden;position:relative;border:1px solid var(--line)}
.tk .meter i{display:block;height:100%;border-radius:6px;background:#c99a1a;min-width:3px}
.tk .meter.empty i,.tk .meter.low i,.tk .meter.over i{background:#d23b2a} .tk .meter.ok i{background:#c99a1a} .tk .meter.full i{background:#1fa64a}
.tk .amt{font-size:0.875rem;color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.tk .amt b{color:var(--ink)}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0} /* v1.2.25: one column on phones; two side by side overflowed 360 px */
.food{position:relative;border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:52px;display:flex;min-width:0}
.food .add{flex:1;border:0;background:transparent;color:var(--ink);padding:10px 44px 10px 12px;font:inherit;font-size:.9rem;line-height:1.25;cursor:pointer;text-align:left;border-radius:12px;min-width:0;overflow-wrap:anywhere}
.food small{display:block;color:var(--muted);font-size:0.875rem;margin-top:2px}
.food[data-n]:not([data-n="0"]){border-color:var(--teal);background:var(--teal-soft)}
.food .cnt{font-weight:800;color:var(--teal)}
.food .plusmark{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:2px solid var(--teal);color:var(--teal);font-weight:800;font-size:1.1rem;line-height:24px;text-align:center;pointer-events:none}
.food[data-n]:not([data-n="0"]) .add{padding-right:84px}
.food .minus{position:absolute;top:50%;right:44px;transform:translateY(-50%);width:28px;height:28px;border:2px solid var(--muted);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:1.1rem;line-height:1;cursor:pointer;border-radius:50%;padding:0}
.food .minus::after{content:"";position:absolute;inset:-10px} /* v1.2.25: the circle stays 28 px; the tap area is 48 px */
.steps{display:grid;gap:8px}
.st{display:grid;grid-template-columns:1fr 44px auto 44px;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px;background:var(--card)}
.st.on{border-color:var(--teal);background:var(--teal-soft)}
.st .nm{font-size:.9rem;font-weight:600;line-height:1.2}
.st .val{min-width:76px;text-align:center;font-size:0.875rem;font-variant-numeric:tabular-nums}
.stp{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-size:1.4rem;font-weight:800;line-height:1;cursor:pointer;padding:0}
.stp.plus{background:var(--ink);color:var(--bg)}
.stp[disabled]{opacity:.3;cursor:default}
.stp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.food .add:focus-visible,.food .minus:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.gtabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:0.875rem;font-weight:600;cursor:pointer;min-height:44px}
.gtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fill li{margin:.35em 0}
.gtabs.seg{margin:6px 0 10px}
.stor{font-size:0.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 6px;vertical-align:middle}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhd .btn{min-width:44px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:0.75rem;font-weight:700;color:var(--muted);padding:2px 0}
.cd{position:relative;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:46px;font:inherit;font-size:0.875rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 0}
.cd[disabled]{opacity:.35;cursor:default}
.cd.today{border:2px solid var(--ink)}
.cd .zap{position:absolute;top:1px;right:3px;font-size:0.75rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.dot.none{background:transparent}
.dot.g{background:#1fa64a} .dot.y{background:#c99a1a} .dot.r{background:#d23b2a}
.dot.part{background:linear-gradient(90deg,var(--muted) 50%,transparent 50%);border:1px solid var(--muted);width:8px;height:8px}
.dot.hollow{border:2px solid var(--muted);width:6px;height:6px;background:transparent}
.rq{margin:12px 0 0}
.rq .lb{font-size:0.875rem;font-weight:700;margin:0 0 6px}
.rq .lb small{font-weight:400;color:var(--muted)}
.rr{display:flex;gap:6px;flex-wrap:wrap}
.rc{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;min-height:44px}
.rc[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rc small{font-size:.82em;font-weight:500}
.rc.e1[aria-pressed="true"],.rc.e2[aria-pressed="true"]{background:#d23b2a;border-color:#d23b2a;color:#fff}
.rc.e3[aria-pressed="true"]{background:#c99a1a;border-color:#c99a1a;color:#fff}
.rc.e4[aria-pressed="true"],.rc.e5[aria-pressed="true"]{background:#1fa64a;border-color:#1fa64a;color:#fff}

  ['tap','What do I report each day?','Report every stool, even a normal one. The quick buttons on the first screen are fastest. Use Meal or drink for anything you eat or drink that isn’t on your list. Use Symptom report for cramps, gas or an upset stomach. Foods on your list are counted automatically, so you don’t need to report them.'],
  ['good-day','What counts as a good day?','No mushy or watery stool, and no cramps, gas or upset stomach. Report every stool, even the good ones. A day with nothing reported doesn’t count, good or bad, so a busy day never counts against you.'],
  ['few','Why only the foods on my list, and nothing added?','Fewer foods means fewer things that could be upsetting you, and your gut gets a rest. Spices, oil, butter and sauces are extra things to rule out, so leave them out for now. How you cook counts too: boil, bake or grill, the same way each time. If your gut calms down, what you stopped eating was likely the cause.'],
  ['steady','Why keep every day the same?','A steady rhythm gives your gut less to react to, and you can only see what changed when little else did. Eat at the same times, in the same amounts. Take any pills or supplements at the same time every day, and don’t start new ones for now. Hungrier than yesterday? Eat bigger portions or add a meal, not a new food. Plain food doesn’t have to taste great. If your body turns away from a plain food, with disgust or nausea, report it as a symptom. It can be a signal, though once isn’t proof.'],
  ['hungry','I’m still hungry. What can I eat?','Eat more of the same: bigger portions or an extra meal of the foods on your list. Being hungry is not a reason to try something new, because a new food is what makes it hard to tell what upsets you. Water is always allowed.'],
  ['one','Why change only one thing at a time?','If you change two things and you feel better, you can’t tell which one did it. That’s why you stop one food at a time in step 1, and add one food a day in step 2.'],
  ['same','Why buy the same kind every time?','One name can cover foods that act differently on your gut. Beef: a lean cut or a fatty one, fresh or frozen, aged or not, cooked dry or in oil. Potatoes: a russet or a waxy yellow one. Fruit and vegetables: different varieties, a wax coating, pesticide on the skin, how ripe they are. Any of these could be the part that bothers you. So buy the same kind, the same way, and cook it the same way each time. If you switch kinds, treat it as a new food. If one kind upsets you, another kind of the same food may not.'],
  ['two','Why 2 good days before adding food?','One good day can be luck. Two in a row means your gut is settling. If adding a food goes wrong, you just go back to step 1.'],
  ['easy','What’s an easy food? Why one a day?','An easy food is a plain food with no ! mark, or just one: rice, oatmeal, carrots, chicken, white fish or potatoes. They upset a gut less often. You add only one a day, so if trouble comes, you know it’s the newest food.'],
  ['bad','What happens on a bad day?','A bad day is a mushy or watery stool, or cramps, gas or an upset stomach. In step 1, the app names one food on your list to stop: the one most likely to be the cause. You can pick another. In step 2, the newest food you added comes off your list and you go back to step 1. A bad day also restarts the count of 2 good days.'],
  ['sit','What is the “Foods that upset you” list?','Every food you stopped, or that upset you after you added it. It’s yours to show a doctor or a pharmacist. A bad day can be bad luck or a bug going around, so a food on the list isn’t proof. After 2 good days in step 2 you can try one again.'],
  ['three','Can I try a food again?','Yes. In step 2, after 2 good days in a row, tap Try again next to the food on The plan. Have it once a day for 3 days, then a day without. Some foods upset you within an hour, others the next day. Three days gives the food a fair chance to show itself, and the day without catches a late reaction.'],
  ['luck','What does “luck alone” mean?','Bad days happen even without the food. When you try a food again, the app looks at your own days before the test to see how often. If a food upsets you twice, luck becomes a lot less likely.'],
  ['kind','Can other foods in the same group be fine?','Often. Milk might upset you while hard cheese doesn’t: hard cheese has almost no lactose, the milk sugar many adults can’t digest. The app only takes off the one food that upset you, not the whole group. Others from that group can be added in step 2 like any new food, one at a time, if they’re easy ones.'],
  ['marks','What do the ! marks mean?','How often that kind of food upsets a gut: ! now and then, !!!! often. Coffee, alcohol and packaged food get !!!!. They decide what to stop first. They’re a starting guess, not a test result, and a dietitian hasn’t checked them yet.'],
  ['vitamins','Why does the app care about vitamins?','Eating only a few foods can leave you short, for example on calcium without dairy. The app adds up what your list gives you on a usual day and shows what’s low on The plan. Step 2 offers easy foods that fill the gaps. A few, like vitamin D, are hard to get from easy foods: when the app says so, ask a pharmacist.'],
  ['pill','Should I take a vitamin pill?','Ask a pharmacist first. You can ask at the counter, no appointment. Some pills loosen your stool, like magnesium or a lot of vitamin C, and some don’t mix with medicines.'],
  ['why-water','Why a rehydration drink, not just water?','Diarrhea takes out water and salts. Water puts back the water, not the salts. A rehydration drink from the pharmacy has the right mix.'],
  ['blood','Blood in the toilet: what do the colours mean?','Bright red on the paper or streaks on the stool usually comes from the very end of the gut, often a small tear or piles. Dark red, black, or blood mixed into the stool can come from higher up: get seen today. Red water, clots, or bleeding that won’t stop: call 911. Only an exam can say where blood comes from.'],
  ['doctor','When should I see a doctor?','Tap “Something’s wrong” at the top for the signs that mean 911 or today. Book a visit for diarrhea on and off for more than 4 weeks, waking at night to use the toilet, losing weight without trying, or blood that keeps coming. The app also pauses and tells you when it’s time: watery stool 3 days in a row, 3 bad days in a row on plain food only, or no 7 good days in a row in the first 2 weeks.'],
  ['what','Can the app tell me what’s wrong?','No. It’s a log that helps you find a food. It can’t find an infection, celiac disease or swelling in the gut, and it can’t tell a food from bad luck on its own. Its summary helps a doctor see what happened.'],
  ['private','Is my data private?','Everything stays on this phone, in this browser. Nothing is sent anywhere. Back it up from the menu. A lost phone or a cleared browser deletes it.']];

/* yesterday's meal closest to this time, within 3 hours either way; anything cut since and the food being tested are left out */
function sameYest(u){ const t0=atTime(u.day,u.at)-24*H, run=running(), si=D.si, base=D.fi?baseNow():null;
  const fs=S.ev.filter(e=>e.k==='food'&&Math.abs(e.t-t0)<=3*H); if(!fs.length) return null;
  const best=fs.reduce((a,e)=>Math.abs(e.t-t0)<Math.abs(a.t-t0)?e:a), mid=best.m||best.t, meal=fs.filter(e=>(e.m||e.t)===mid), out=[], items={};
  for(const e of meal){ if(run&&e.key===run.key) continue; const cut=(base&&S.cuts.some(c=>c.key===e.key&&c.at>e.t)&&!base.includes(e.key))||(si&&si.out.some(id=>inCut(id,e.key))); if(cut) out.push(e); else items[e.key]=(items[e.key]||0)+(e.q||1); }
  const ks=Object.keys(items); if(!ks.length) return null; const on=[...new Set(out.map(e=>food(e.key).n.toLowerCase()))];
  return {items,label:`Same as yesterday, ${hm(best.t)}: `+ks.map(k=>food(k).n+qx(items[k])).join(', ')+(on.length?` (without ${on.join(', ')}: you cut ${on.length>1?'them':'it'})`:'')}; }

function vSym(){ const u=V, af=afterText(atTime(u.day,u.at));

  <p class="small muted" style="margin:14px 0 6px">Warning signs. These need a doctor, and they won’t count as a reaction to a food:</p><div class="chips"><button type="button" class="chip alarm" data-act="safety"><span>Something more serious: swelling, trouble breathing, fainting, a fever, can’t keep fluids down, or bad belly pain →</span></button></div>${u.id?`<div class="row" style="margin-top:10px"><button type="button" class="btn ghost sm" data-act="delthis">Delete this</button></div>`:''}`; }
const dayTag=di=>di.bad?'<span class="tag">bad day</span>':di.calm?'<span class="tag teal">good day</span>':di.missing?'<span class="tag ink">not reported</span>':'';
function timeline(k){ const E=dayInfo(k).E; if(!E.length) return `<p class="small muted" style="margin:0 0 6px">Nothing reported yet.</p>`;
  const rows=[], seen=new Set(), base=D.fi?baseNow():null, tks=S.tests.filter(t=>k>=t.d1&&k<=(t.end||kAdd(t.d1,3))).map(t=>t.key), outs=D.si?D.si.out:[], sm=x=>x?`<small>${x}</small>`:'';

    else if(e.k==='food'){ const mid=e.m||e.t; if(seen.has(mid)) continue; seen.add(mid); const m=E.filter(x=>x.k==='food'&&(x.m||x.t)===mid), tp=m.some(x=>tks.includes(x.key)), off=base&&m.some(x=>!base.includes(x.key)&&!tks.includes(x.key)), hit=outs.filter(id=>m.some(x=>!tks.includes(x.key)&&inCut(id,x.key))); ic='🍽️'; act='editm';
      tx=esc(m.slice(0,3).map(x=>food(x.key).n+qx(x.q)).join(', ')+(m.length>3?` +${m.length-3}`:''))+sm([tp?'test portion':'',off?'not on your list':'',hit.length?'you cut '+esc(hit.map(cutLo).join(', ')):'',fl].filter(Boolean).join(' · ')); }

    const on=act&&editable(e); rows.push(`<li><${on?`button type="button" data-act="${act}" data-v="${e.id}"`:'div'} class="tlr"><span class="tt">${tm}</span><span class="ti" aria-hidden="true">${ic}</span><span class="tx">${tx}</span></${on?'button':'div'}></li>`); }

/* everything eaten on a day, highest mark first; today, the list counts too */
function byMark(k){ const ks=new Set(S.ev.filter(e=>e.k==='food'&&e.d===k).map(e=>e.key)), lst=new Set(D.fi&&k===today()?baseNow():[]); lst.forEach(x=>ks.add(x)); return {L:[...ks].map(food).sort((a,b)=>b.m-a.m||a.n.localeCompare(b.n)),lst}; }
function vDay(){ const k=V.k, di=dayInfo(k), bm=byMark(k);
  return `<div class="eyebrow">Your day</div><h2>${esc(cap(dLabel(k)))} ${dayTag(di)}</h2>${bm.L.length?`<div class="card"><h3>Everything on this day, highest mark first</h3><ul class="evs">${bm.L.map(x=>`<li>${NM(x)}${bm.lst.has(x.key)?' <span class="small muted">· your list</span>':''}</li>`).join('')}</ul></div>`:''}<div class="card"><h3>In order</h3>${timeline(k)}<div class="row"><button type="button" class="btn sm" data-act="stool" data-day="${k}">+ Stool</button><button type="button" class="btn ghost sm" data-act="meal" data-day="${k}">+ Meal or drink</button><button type="button" class="btn ghost sm" data-act="sym" data-day="${k}">+ Symptom</button>${!di.st.length&&!di.E.some(e=>e.k==='none')?`<button type="button" class="btn ghost sm" data-act="none" data-day="${k}">No stool that day</button>`:''}</div></div><p class="small muted">Tap an entry to change it. Entries lock 48 hours after you make them.</p>`; }

/* ---------- Report: the one thing to do, the three report buttons, today so far ---------- */
function tabs(on){ return `<div class="gtabs seg toptabs" role="tablist">${[['report','Today'],['plan','The plan'],['hist','History']].map(([k,l])=>`<button type="button" role="tab" data-act="tab" data-tab="${k}" aria-pressed="${on===k}">${l}</button>`).join('')}</div>`; }
function vMain(){ const t=S.tab||'report'; return (t==='report'?'':tabs(t))+(t==='plan'?vPlan():t==='hist'?vHist():vReport()); }
const one=(eb,big,body,cls)=>`<div class="card ${cls||'one'}"><div class="eyebrow">${eb}</div><p class="big">${big}</p>${body||''}</div>`;

const celiac=x=>x?`<p class="small note">Have your stools been loose for more than 4 weeks, or does celiac disease run in your family? Ask your doctor for a celiac blood test before you spend weeks without wheat. The test only works while you still eat gluten.</p>`:'';
function callLine(tier){ return tier==='911'?`<a class="btn primary" href="tel:911">Call 911</a><p class="small" style="margin:8px 0 0">Outside Canada and the US: your local emergency number. If you have a prescribed epinephrine auto-injector and these signs follow food, use it, then call.</p>`:`<p style="margin:0"><b>Urgent care or your doctor, today.</b></p><p class="small" style="margin:6px 0 0">In Alberta, <a href="tel:811">811 Health Link</a> can tell you where to go.</p>`; }
function pauseCard(){ const p=S.pause; if(!p) return ''; const why=p.sign?SIGNS[p.sign][1]:WHYP[p.why];
  return `<div class="card flag"><div class="eyebrow">Paused · ${esc(dLabel(p.d))}</div><h3>${p.tier==='911'?'Call 911 now':p.tier==='same'?'Get seen today':'Book a doctor’s visit'}</h3><p><b>${esc(why)}.</b></p>${p.tier!=='doc'?callLine(p.tier):'<p class="small">Show the doctor your summary: History → Summary for my doctor.</p>'}<p class="small">Keep eating only food from your list and keep reporting your stools. Don’t change any foods until you’ve been checked.</p><button type="button" class="btn ghost sm" data-act="checked">I’ve been checked</button><p class="small muted" style="margin:6px 0 0">Tap this once you’ve been seen. It’s your call, and the app saves it with the date.${p.tier==='same'?' After that, the app logs the same sign without pausing for 14 days.':p.tier==='doc'?' After that, this pause won’t come back for 14 days.':''}</p></div>`; }
function missingCard(){ const T=today(), y=kAdd(T,-1), first=S.ev.length?S.ev[0].d:T; if(y<first||dayInfo(y).logged) return '';
  return `<div class="card soft"><b>No stool reported yesterday.</b> Did you go?<div class="qs" style="margin:8px 0">${[[2,'Formed'],[3,'Mushy'],[4,'Watery'],[1,'Hard']].map(([i,l])=>`<button type="button" class="btn ghost sm" data-act="qsty" data-v="${i}" data-day="${y}">${l}</button>`).join('')}</div><div class="row"><button type="button" class="btn ghost sm" data-act="none" data-day="${y}">No stool yesterday</button><button type="button" class="lnk" data-act="stool" data-day="${y}">More detail</button></div></div>`; }
function thinCard(){ if(!S.route||S.route==='log'||S.pause) return ''; const T=today(), from=routeStart(S.route)||T; let miss=0, n=0; for(let i=2;i<=7;i++){ const k=kAdd(T,-i); if(k<from) break; n++; if(!dayInfo(k).logged) miss++; } return miss>=2?`<div class="card soft"><b>Some days are missing.</b> Only days you tap count. You can fill them in from History.</div>`:''; }
function testCard(t){ const x=food(t.key), i=kDiff(t.d1,today()), eb=t.route==='fast'?`Trying it again · day ${i+1} of 4`:`Bringing it back · day ${i+1} of 4`;
  return one(eb, i<3?`Have ${esc(x.n)} today: ${esc(t.por)}.`:`Today: no ${esc(x.n)}. Just watch.`, `${i<3?(ateOn(t,today())?'<p style="margin:0 0 8px">✓ Done for today.</p>':`<button type="button" class="btn primary" data-act="ate">I had it</button>`):''}<p class="small" style="margin:8px 0">Runs, cramps or gas? Stop eating it and tap a report. Don’t change anything else.</p><button type="button" class="btn ghost sm" data-act="stoptest">Stop this test</button>`,'soft'); }
function luckLine(t){ const c=t&&t.ch; return c&&t.res==='react'?` ${G('luck')} would do this ${pct(c.c)} of the time.`:''; }
function lastResult(){ const t=S.tests.filter(x=>x.res).slice(-1)[0]; if(!t) return ''; const x=food(t.key);
  return `<p class="small" style="margin:8px 0 0"><b>Last: ${esc(x.n)}.</b> ${t.res==='react'?`It upset you ${esc(dLabel(t.end))}, so it stays out.${luckLine(t)}`:t.res==='none'?'You had 4 good days, so it’s back on your list.':`It didn’t count: ${esc(t.why)}.`}</p>`; }

function sickNear(key){ const c=S.cuts.filter(x=>x.key===key).pop(); return !!c&&S.ev.some(e=>e.k==='chg'&&e.c==='ill'&&e.d>=kAdd(c.d,-3)); }
const and=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const HUNGRY='Still hungry? Eat more of the same foods: bigger portions or an extra meal, not a new food. Cook them the same way each time: boil, bake, grill, or use a non-stick pan with no oil. No butter, sauce or spices, and no cheating.';
/* foods reported in the last 3 days that aren't on the list and carry a mark of 3 or 4, highest mark first, not cut since. The list is plain, so these are the likely suspects. */
function offList(fi){ if(!fi) return []; const T=fi.T, from=kAdd(T,-2)<fi.F.start?fi.F.start:kAdd(T,-2), base=new Set(baseNow()), run=running(), seen=new Map();
  for(const e of S.ev){ if(e.k!=='food'||e.d<from||e.d>T||base.has(e.key)||(run&&e.key===run.key)) continue; const x=food(e.key); if(x.m<3) continue; const o=seen.get(e.key)||{key:e.key,x,q:0,at:0}; o.q+=e.q||1; o.at=Math.max(o.at,e.t); seen.set(e.key,o); }
  return [...seen.values()].filter(o=>!S.cuts.some(c=>c.key===o.key&&c.at>o.at)).sort((a,b)=>b.x.m-a.x.m||b.at-a.at); }
const HINT='<div class="card soft"><div class="eyebrow">That’s progress</div><p class="small" style="margin:0">A loose stool isn’t a failure. On a plain list it points toward the cause, and every report you make narrows it down.</p></div>';
const eggNote=(k,sw)=>k==='f130'?`<p class="small" style="margin:6px 0 0">Egg yolk and egg white are different foods, and you can react to one and not the other. ${sw?'Try the yolk alone: it’s under Eggs &amp; dairy.':'Once your gut is calm, you can try the yolk alone.'}</p>`:'';
function guideFast(fi){ const t=running(), top=fi.marked[0], list=fi.base.map(NM).join(' · ')||'nothing yet', EB=n=>`Step ${n} of 2 · ${STG[n-1]}`;

  if(fi.stage===2) return stage2Card(fi);
  const fell=S.cuts.filter(c=>c.why==='fall'&&c.d===fi.T);
  if(fell.length) return one(EB(1),'Back to step 1.',`<p style="margin:0 0 6px">Your stomach is upset. <b>${esc(food(fell[0].key).n)}</b> was the newest food you added, so it comes off your list.</p><p class="small" style="margin:0">It goes on your “Foods that upset you” list. Go back to eating only food from your list.</p>${eggNote(fell[0].key)}`);
  if(fi.day===1) return one(EB(1),'Today, only eat food from your list.',`<p style="margin:0 0 8px">${list}</p><p class="small" style="margin:0 0 6px">${HUNGRY}</p>${(ol=>ol.length?`<p class="small" style="margin:0 0 6px"><b>You reported ${and(ol.map(o=>esc(o.x.n)))}.</b> ${ol.length>1?'They aren’t':'It isn’t'} on your list, so leave ${ol.length>1?'them':'it'} out from now on.</p>`:'')(offList(fi))}<p class="small" style="margin:0 0 6px">For drinks, stick to water, the same kind every day. Tap water can change, so a jug of the same bottled or spring water takes that out. Don’t have energy drinks, cola or alcohol. Need caffeine? Have one plain coffee or tea, the same one every day.</p><details class="note"><summary>Keep your days steady</summary><p class="small" style="margin:0 0 6px">Eat at about the same times each day, in about the same amounts. Hungrier than yesterday? Eat bigger portions or add a meal. Don’t add a new food.</p><p class="small" style="margin:0 0 6px">Take any pills or supplements at the same time every day, with the same meal. Don’t start new ones for now. Don’t stop a medicine your doctor prescribed without asking.</p><p class="small" style="margin:0 0 6px">The food doesn’t have to taste great. But if your body turns away from a plain food, with disgust or nausea, report it as a symptom. That can be a signal.</p></details><details class="note"><summary>Cutting caffeine?</summary><p class="small" style="margin:0 0 6px">Many people get a headache or feel flat for the first few days. It usually passes. Have the same one coffee or tea each day.</p></details><p class="small" style="margin:0">While your stools are loose, a ${G('ors','rehydration drink')} from the pharmacy helps more than water.</p>`);
  const ol=fi.canCut?offList(fi):[]; if(ol.length) return one(EB(1),`Stop this first: ${NM(ol[0].x)}${qx(ol[0].q)}`,`<p class="small">Your list is plain, so this is the likeliest cause. It’s the food you reported that has the most ! marks.${ol.length>1?` Also reported: ${and(ol.slice(1).map(o=>esc(o.x.n)))}.`:''}</p><div class="row"><button type="button" class="btn primary" data-act="cut" data-v="${esc(ol[0].key)}">I’ll leave it out from today</button><button type="button" class="btn ghost sm" data-act="pickcut">Pick another</button></div>`);
  if(fi.suggest) return one(EB(1),`Stop eating: ${NM(top)}`,`<p class="small">Your gut is upset. It’s the food on your list most likely to be the cause.</p>${celiac(top.b.includes('gluten'))}${eggNote(top.key)}<div class="row"><button type="button" class="btn primary" data-act="cut" data-v="${esc(top.key)}">Stop it from today</button><button type="button" class="btn ghost sm" data-act="pickcut">Pick another</button></div>`);
  if(fi.swap) return one(EB(1),'Swap one food for another.',`<p class="small">Your gut is upset and every food on your list is plain, so the app can’t tell which one is the cause. Stop one food and eat a different plain one instead.</p><div class="row">${fi.base.map(x=>`<button type="button" class="btn sm" data-act="swap" data-v="${esc(x.key)}">Swap ${esc(x.n)}</button>`).join('')}</div><p class="small" style="margin:8px 0 0">An energy drink, coffee, alcohol or a snack that isn’t on your list? Report it with <b>Meal or drink</b>. The app checks those first.</p><p class="small" style="margin:8px 0 0">Did the kind, the brand or the way you cook a food change lately? Change it back first. Or switch your water for 2 days: bottled instead of tap, or the other way around.</p>`);
  if(fi.di.bad){ const c=fi.changed; return one(EB(1),c?`You stopped ${esc(food(c.key).n)} today. Give your gut a day to settle.`:'Eat only your list today.',''); }
  const lc=S.cuts.filter(c=>c.d>=fi.F.start&&c.why!=='roll'&&c.d<=fi.from).pop(), better=lc?`<p class="small" style="margin:8px 0 0">It got better after you stopped ${esc(food(lc.key).n)}.</p>`:'';
  if(fi.run>=1||fi.di.logged) return one(EB(1),'Eat the same foods today.',`${dots(Math.min(fi.run,2),2)}<p style="margin:8px 0 0">${fi.run>=1?'You’ve had 1 good day. One more and you move on to step 2.':'Good so far. After 2 good days in a row, you move on to step 2.'}</p><p class="small" style="margin:6px 0 0">${HUNGRY}</p>${better}`,'soft');

function stage2Card(fi){ const EB='Step 2 of 2 · '+STG[1], add=S.adds.filter(a=>a.why==='s2'&&a.d===fi.T).pop(), lr=S.tests.some(t=>t.route==='fast'&&t.res)?lastResult():'';
