<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Trial Log</title>
<meta name="description" content="Trouve l’aliment qui perturbe ton système digestif : mange quelques aliments simples, puis réintroduis-les un par jour. Gratuit et privé : tout reste sur ton téléphone.">
<meta name="theme-color" content="#c8481f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#1c1b19;--muted:#6b665d;--line:#e6e0d4;--accent:#c8481f;--teal:#0f6b6b;--teal-soft:#e3f0ef;--warn:#b3261e;--warn-soft:#fbe9e7;--chip:#f1ede4;--chip-on:#1c1b19;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px -10px rgba(0,0,0,.15)}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--card:#1e2026;--ink:#ececea;--muted:#a19d95;--line:#2d3038;--accent:#e3633a;--teal:#5fb3b3;--teal-soft:#1c2c2c;--warn:#ff7b6e;--warn-soft:#3a1f1c;--chip:#2a2d35;--chip-on:#ececea;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px -10px rgba(0,0,0,.6)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
.wrap{max-width:600px;margin:0 auto;padding:14px 18px 24px}
h1,h2,h3{font-family:ui-serif,Georgia,'Times New Roman',serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:2.2rem;font-weight:800}
h1 .b{color:var(--accent)}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700;margin-top:0}
p{margin:.35em 0 .8em}
.muted{color:var(--muted)} .small{font-size:.9rem}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:0.875rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.card.fold{max-height:118px;overflow:hidden;position:relative;cursor:pointer;padding-bottom:34px}
.card.fold::after{content:'';position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(to bottom,transparent,var(--card) 60%);pointer-events:none}
.card.fold .fdbtn{position:absolute;right:14px;bottom:8px;z-index:1;font-size:.85rem;font-weight:700;color:var(--teal)}
.card.fold:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.fdclose{display:block;margin:10px 0 0 auto;background:none;border:0;padding:4px 0;font:inherit;font-size:.85rem;font-weight:700;color:var(--teal);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
.card.flag{border-color:var(--warn);background:var(--warn-soft)}
.card.soft{background:var(--teal-soft);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:.92rem;border-radius:11px;min-height:44px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px}
.topbar .sp{flex:1}
.tb{border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer;padding:8px 10px;border-radius:10px;font-weight:700;min-height:44px;min-width:44px}
.tb:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#menuBtn{font-size:1.25rem;line-height:1}
.tb.ttl{font-family:ui-serif,Georgia,'Times New Roman',serif;font-weight:800;font-size:1.1rem;padding:6px 4px;white-space:nowrap}
@media (max-width:360px){.tb.gls{padding:6px 8px;font-size:0.875rem}}
.tb.ttl .b{color:var(--accent)}
.tb.gls{font-size:0.875rem;border:1px solid var(--line)}
.menu{display:grid;gap:6px;margin-top:6px}
.menu button,.menu a{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.menu .danger{color:var(--warn)}
.gl{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 2px;font:inherit;cursor:pointer}
.gl .grade{margin:0;flex:none}
html.locked,html.locked body{overflow:hidden}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:0.875rem;font-weight:700;padding:6px 14px;cursor:pointer;min-height:44px;min-width:44px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:grid;gap:10px;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;font-size:1.02rem;line-height:1.3;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--bg);border-color:var(--chip-on)}
.chip.danger[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.prog{display:flex;gap:4px;flex:1;margin:0 12px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)}
.qn{font-size:0.875rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.t{color:var(--teal);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:pointer;font-weight:600;padding:.35em 0}
ul{padding-left:1.1em;margin:.3em 0 .6em} li{margin:.3em 0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .22s,visibility 0s linear .22s;z-index:50;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .22s,visibility 0s}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:1.25rem}
.grade{display:inline-block;font-size:0.875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:10px}
.grade.solid{background:#2e6b3a;color:#fff}.grade.likely{background:var(--teal);color:#fff}.grade.try{background:var(--chip);color:var(--muted)}details.more{margin:10px 0 0}details.more>summary{cursor:pointer;list-style:none;padding:12px 14px;border-radius:14px;background:var(--chip);font-weight:600;font-size:.95rem}details.more>summary::-webkit-details-marker{display:none}details.more>summary::after{content:' ▾';color:var(--muted)}details.more[open]>summary::after{content:' ▴'}details.more[open]>summary{margin-bottom:10px}
.tm details{border-top:1px solid var(--chip);padding:8px 0}.tm details:last-child{border-bottom:1px solid var(--chip)}.tm summary{cursor:pointer;line-height:1.35}.tm summary .muted{font-size:.88rem}.tm p{margin:6px 0 0;font-size:.95rem}
.grade.reason{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--muted)}
.ev{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:0.875rem;color:var(--muted);line-height:1.45}
.ev b{color:var(--ink)}
.ev .src{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.ev .src a{display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;padding:4px 12px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:0.875rem;font-weight:600;border:1px solid var(--line)}
.ev .src a:after{content:" ↗";opacity:.6}
.ev .rev{margin-top:10px;font-size:0.875rem;font-style:italic;opacity:.85}
.patch h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:0.875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--accent);padding:3px 8px;border-radius:999px}
.tag.teal{background:var(--teal)} .tag.ink{background:var(--ink);color:var(--bg)}
.cost{font-variant-numeric:tabular-nums;color:var(--muted);font-size:0.875rem;white-space:nowrap}
textarea.out{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
.hidden{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.checkin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip[aria-pressed="true"]::before{content:"✓ ";font-weight:700}
/* v1.2.25: checkbox for pick-several, circle for pick-one */
.pickall{margin:12px 0 -4px;font-weight:700;font-size:.95rem}
.chips.pickn .chip,.chips.pick1 .chip{display:flex;align-items:flex-start;gap:12px}
.chips.pickn .chip::before,.chips.pick1 .chip::before{content:"";flex:0 0 22px;width:22px;height:22px;margin-top:-1px;box-sizing:border-box;border:2px solid var(--muted);background:var(--card)}
.chips.pickn .chip::before{border-radius:6px}
.chips.pick1 .chip::before{border-radius:50%}
.chips.pickn .chip[aria-pressed="true"]::before{content:"✓";border-color:var(--bg);background:var(--bg);color:var(--chip-on);font-size:15px;font-weight:800;line-height:18px;text-align:center}
.chips.pick1 .chip[aria-pressed="true"]::before{content:"";border-color:var(--bg);background:radial-gradient(circle,var(--bg) 0 5px,transparent 6px)}
.chips.pickn .chip.danger[aria-pressed="true"]::before{color:var(--warn)}
.t:focus-visible,.chip:focus-visible,.btn:focus-visible,.ev .src a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.add-warn{display:block;margin-top:4px;color:var(--warn);font-size:.88rem;font-weight:600}
.hand{border:2px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:.95rem;line-height:1.45}
.hand div{margin:2px 0}
.chip.ack{width:100%;font-size:0.875rem;line-height:1.35;margin-top:12px;padding:10px 14px;opacity:.85}
.card.gate{border:2px solid var(--accent)}
.btn[aria-disabled="true"]{opacity:.45}
.doors{display:grid;gap:12px;margin-top:14px}
.door{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--accent);background:var(--card);color:var(--ink);border-radius:18px;padding:16px 18px;font:inherit;cursor:pointer;box-shadow:var(--shadow)}
.door.main{padding:20px 20px;border-left-width:7px}
.door.main .dt{font-size:1.45rem}
.doors.small{grid-template-columns:1fr;gap:8px;margin-top:8px}
.doors.small .door{padding:12px 14px}
.doors.small .door .dt{font-size:1.05rem;margin:0}
.doors.small .door .ds{font-size:0.875rem}
.or{margin:16px 0 0;font-size:0.875rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.one{border:2px solid var(--ink)}
.one .big{font-size:1.15rem;line-height:1.4;font-weight:600;margin:4px 0 6px}
.door.teal{border-left-color:var(--teal)} .door.ink{border-left-color:var(--ink)} .door.green{border-left-color:#2e6b3a}
.door .eyebrow{display:block;margin-bottom:2px}
.door .dt{display:block;font-family:ui-serif,Georgia,'Times New Roman',serif;font-weight:800;line-height:1.15;margin:2px 0 4px;font-size:1.2rem}
.door .ds{display:block;color:var(--muted);font-size:.95rem;line-height:1.4}
.door .status{display:inline-block;margin-top:8px;font-size:0.875rem;font-weight:700;color:var(--teal)}
.door[aria-disabled="true"]{opacity:.5}
.door:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.verdict h3{font-size:1.35rem;margin:6px 0 8px}
.grade.unclear{background:var(--chip);color:var(--muted)}
.also li{margin:.25em 0}
.intent{display:grid;gap:8px;margin:10px 0}
textarea.out.live{min-height:240px;font-size:0.875rem;line-height:1.4}
.pat{font-variant-numeric:tabular-nums}
.tk{display:grid;gap:8px}
.tk .r{display:grid;grid-template-columns:7.2em 1fr auto;gap:8px;align-items:center;font-size:.92rem}
.tk .r .nm{font-weight:600;line-height:1.2}
.tk .r .nm small{display:block;font-weight:400;color:var(--muted);font-size:0.875rem}
.tk .meter{height:12px;border-radius:6px;background:var(--chip);overflow:hidden;position:relative;border:1px solid var(--line)}
.tk .meter i{display:block;height:100%;border-radius:6px;background:#c99a1a;min-width:3px}
.tk .meter.empty i,.tk .meter.low i,.tk .meter.over i{background:#d23b2a} .tk .meter.ok i{background:#c99a1a} .tk .meter.full i{background:#1fa64a}
.tk .amt{font-size:0.875rem;color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.tk .amt b{color:var(--ink)}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0} /* v1.2.25: one column on phones; two side by side overflowed 360 px */
.food{position:relative;border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:52px;display:flex;min-width:0}
.food .add{flex:1;border:0;background:transparent;color:var(--ink);padding:10px 44px 10px 12px;font:inherit;font-size:.9rem;line-height:1.25;cursor:pointer;text-align:left;border-radius:12px;min-width:0;overflow-wrap:anywhere}
.food small{display:block;color:var(--muted);font-size:0.875rem;margin-top:2px}
.food[data-n]:not([data-n="0"]){border-color:var(--teal);background:var(--teal-soft)}
.food .cnt{font-weight:800;color:var(--teal)}
.food .plusmark{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:2px solid var(--teal);color:var(--teal);font-weight:800;font-size:1.1rem;line-height:24px;text-align:center;pointer-events:none}
.food[data-n]:not([data-n="0"]) .add{padding-right:84px}
.food .minus{position:absolute;top:50%;right:44px;transform:translateY(-50%);width:28px;height:28px;border:2px solid var(--muted);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:1.1rem;line-height:1;cursor:pointer;border-radius:50%;padding:0}
.food .minus::after{content:"";position:absolute;inset:-10px} /* v1.2.25: the circle stays 28 px; the tap area is 48 px */
.steps{display:grid;gap:8px}
.st{display:grid;grid-template-columns:1fr 44px auto 44px;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px;background:var(--card)}
.st.on{border-color:var(--teal);background:var(--teal-soft)}
.st .nm{font-size:.9rem;font-weight:600;line-height:1.2}
.st .val{min-width:76px;text-align:center;font-size:0.875rem;font-variant-numeric:tabular-nums}
.stp{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-size:1.4rem;font-weight:800;line-height:1;cursor:pointer;padding:0}
.stp.plus{background:var(--ink);color:var(--bg)}
.stp[disabled]{opacity:.3;cursor:default}
.stp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.food .add:focus-visible,.food .minus:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.gtabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:0.875rem;font-weight:600;cursor:pointer;min-height:44px}
.gtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fill li{margin:.35em 0}
.gtabs.seg{margin:6px 0 10px}
.stor{font-size:0.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 6px;vertical-align:middle}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhd .btn{min-width:44px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:0.75rem;font-weight:700;color:var(--muted);padding:2px 0}
.cd{position:relative;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:46px;font:inherit;font-size:0.875rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 0}
.cd[disabled]{opacity:.35;cursor:default}
.cd.today{border:2px solid var(--ink)}
.cd .zap{position:absolute;top:1px;right:3px;font-size:0.75rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.dot.none{background:transparent}
.dot.g{background:#1fa64a} .dot.y{background:#c99a1a} .dot.r{background:#d23b2a}
.dot.part{background:linear-gradient(90deg,var(--muted) 50%,transparent 50%);border:1px solid var(--muted);width:8px;height:8px}
.dot.hollow{border:2px solid var(--muted);width:6px;height:6px;background:transparent}
.rq{margin:12px 0 0}
.rq .lb{font-size:0.875rem;font-weight:700;margin:0 0 6px}
.rq .lb small{font-weight:400;color:var(--muted)}
.rr{display:flex;gap:6px;flex-wrap:wrap}
.rc{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;min-height:44px}
.rc[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rc small{font-size:.82em;font-weight:500}
.rc.e1[aria-pressed="true"],.rc.e2[aria-pressed="true"]{background:#d23b2a;border-color:#d23b2a;color:#fff}
.rc.e3[aria-pressed="true"]{background:#c99a1a;border-color:#c99a1a;color:#fff}

const FAQ=[
  ['proof','Y a-t-il de la recherche derrière cela ?','Oui, pour la méthode. Dans une étude suédoise menée auprès de personnes souffrant de troubles intestinaux, 84 sur 100 ont déclaré qu’au moins un aliment déclenchait leurs symptômes. Dans un essai de 2024 portant sur 294 personnes, modifier l’alimentation a aidé 7 à 8 personnes sur 10. Les médicaments ont aidé environ 6 sur 10. La directive des gastro-entérologues britanniques indique que les conseils diététiques passent en premier. Le régime intestinal le mieux étudié fonctionne de la même manière que cette application : éliminer des aliments, puis les réintroduire pour trouver ses propres déclencheurs. Sources : Böhn et coll., American Journal of Gastroenterology, 2013. Nybacka et coll., The Lancet Gastroenterology & Hepatology, 2024. Directive de la British Society of Gastroenterology sur le syndrome du côlon irritable, 2021.'],
  ['how','Comment cela fonctionne-t-il ?','Deux étapes. Étape 1 : mange uniquement les aliments de ta liste, les mêmes chaque jour, jusqu’à ce que tu aies eu 2 bons jours consécutifs. C’est ennuyeux exprès. Étape 2 : ajoute un nouvel aliment par jour, en commençant par les plus faciles, jusqu’à ce que ta liste couvre les besoins de ton corps. Si un aliment t’incommode, il est retiré de ta liste et tu retournes à l’étape 1. Les aliments qui t’incommodent vont sur une liste que tu peux montrer à un médecin ou à un pharmacien. L’application te dit quoi faire chaque jour.'],
  ['tap','Que dois-je signaler chaque jour ?','Signale chaque selle, même normale. Utilise Repas ou boisson pour tout ce que tu manges ou bois et qui n’est pas sur ta liste. Utilise Rapport de symptôme pour les crampes, les gaz ou un estomac irrité. Les aliments de ta liste sont comptabilisés automatiquement, tu n’as donc pas besoin de les signaler.'],
  ['good-day','Qu’est-ce qui compte comme un bon jour ?','Pas de selles pâteuses ou aqueuses, et pas de crampes, de gaz ou d’estomac irrité. Signale chaque selle, même les bonnes. Un jour sans rien de signalé ne compte ni comme bon ni comme mauvais, donc une journée occupée ne se retourne jamais contre toi.'],
  ['few','Pourquoi seulement les aliments de ma liste, sans rien ajouter ?','Moins d’aliments signifie moins de choses susceptibles de t’incommoder, et ton intestin prend un répit. Les épices, l’huile, le beurre et les sauces sont des éléments supplémentaires à éliminer, alors laisse-les de côté pour l’instant. La façon de cuisiner compte aussi : bouillis, cuits au four ou grillés, de la même façon à chaque fois. Si ton intestin se calme, ce que tu as arrêté de manger en était probablement la cause.'],
  ['steady','Pourquoi garder chaque jour identique ?','Un rythme stable donne moins de choses à réagir à ton intestin, et tu ne peux voir ce qui a changé que lorsque peu de choses ont bougé. Mange aux mêmes heures, dans les mêmes quantités. Prends tes pilules ou suppléments à la même heure chaque jour, et ne commence pas de nouveaux suppléments pour l’instant. Plus faim qu’hier ? Prends de plus grosses portions ou ajoute un repas, pas un nouvel aliment. La nourriture simple n’a pas besoin d’être délicieuse. Si ton corps refuse un aliment simple, par dégoût ou nausée, signale-le comme symptôme. Cela peut être un signal, bien qu’une seule fois ne soit pas une preuve.'],
  ['hungry','J’ai encore faim. Que puis-je manger ?','Mange davantage de la même chose : de plus grosses portions ou un repas supplémentaire des aliments de ta liste. Avoir faim n’est pas une raison d’essayer quelque chose de nouveau, car c’est un nouvel aliment qui empêche de savoir ce qui t’incommode. L’eau est toujours permise.'],
  ['one','Pourquoi ne changer qu’une seule chose à la fois ?','Si tu changes deux choses et que tu te sens mieux, tu ne peux pas savoir laquelle a fonctionné. C’est pourquoi tu élimines un aliment à la fois à l’étape 1, et tu en ajoutes un par jour à l’étape 2.'],
  ['same','Pourquoi acheter le même type à chaque fois ?','Un même nom peut regrouper des aliments qui agissent différemment sur ton intestin. Bœuf : une coupe maigre ou grasse, frais ou congelé, affiné ou non, cuit à sec ou dans l’huile. Pommes de terre : une Russet ou une jaune cireuse. Fruits et légumes : différentes variétés, un enrobage de cire, des pesticides sur la peau, le degré de mûrissement. N’importe lequel de ces facteurs peut être celui qui te dérange. Achète donc le même type, de la même façon, et cuisine-le de la même manière à chaque fois. Si tu changes de type, traite-le comme un nouvel aliment. Si un type t’incommode, un autre type du même aliment pourrait très bien passer.'],
  ['two','Pourquoi 2 bons jours avant d’ajouter de la nourriture ?','Un bon jour peut être de la chance. Deux d’affilée signifient que ton intestin se stabilise. Si l’ajout d’un aliment tourne mal, tu retournes simplement à l’étape 1.'],
  ['easy','Qu’est-ce qu’un aliment facile ? Pourquoi un par jour ?','Un aliment facile est un aliment simple sans point d’exclamation !, ou avec un seul : riz, flocons d’avoine, carottes, poulet, poisson blanc ou pommes de terre. Ils incommodent moins souvent l’intestin. Tu n’en ajoutes qu’un par jour, donc si des problèmes surviennent, tu sais que c’est le nouvel aliment.'],
  ['bad','Que se passe-t-il un mauvais jour ?','Un mauvais jour correspond à des selles pâteuses ou aqueuses, ou à des crampes, des gaz ou un estomac irrité. À l’étape 1, l’application nomme un aliment de ta liste à arrêter : celui qui a le plus de chances d’être en cause. Tu peux en choisir un autre. À l’étape 2, le nouvel aliment que tu as ajouté est retiré de ta liste et tu retournes à l’étape 1. Un mauvais jour réinitialise également le décompte des 2 bons jours.'],
  ['sit','Qu’est-ce que la liste « Aliments qui t’incommodent » ?','Chaque aliment que tu as arrêté, ou qui t’a incommodé après son ajout. Elle t’appartient pour être montrée à un médecin ou à un pharmacien. Un mauvais jour peut être de la malchance ou un virus qui circule, un aliment sur cette liste n’est donc pas une preuve absolue. Après 2 bons jours à l’étape 2, tu peux en réessayer un.'],
  ['three','Puis-je réessayer un aliment ?','Oui. À l’étape 2, après 2 bons jours consécutifs, ouvre l’Historique et appuie sur Réessayer à côté de l’aliment. Mange-le une fois par jour pendant 3 jours, puis passe un jour sans en manger. Certains aliments t’incommodent en une heure, d’autres le lendemain. Trois jours donnent à l’aliment une chance équitable de se manifester, et le jour sans permet de détecter une réaction tardive.'],
  ['luck','Que signifie « le hasard seul » ?','Des mauvais jours surviennent même sans l’aliment. Lorsque tu réessaies un aliment, l’application examine tes propres jours avant le test pour voir la fréquence. Si un aliment t’incommode deux fois, le hasard devient beaucoup moins probable.'],
  ['kind','D’autres aliments du même groupe peuvent-ils être bien tolérés ?','Souvent. Le lait peut t’incommoder tandis que le fromage à pâte ferme ne le fait pas : ce dernier ne contient presque pas de lactose, le sucre du lait que beaucoup d’adultes ne digèrent pas. L’application ne supprime que l’aliment spécifique qui t’a incommodé, pas tout le groupe. D’autres aliments de ce groupe peuvent être ajoutés à l’étape 2 comme n’importe quel nouvel aliment, un à la fois, s’ils sont faciles.'],
  ['marks','Que signifient les points d’exclamation ! ?','La fréquence à laquelle ce type d’aliment perturbe un intestin : ! de temps en temps, !!!! souvent. Le café, l’alcool et les aliments emballés obtiennent !!!!. Ils déterminent ce qu’il faut arrêter en premier. C’est une estimation de départ, pas un résultat de test.'],
  ['vitamins','Pourquoi l’application s’intéresse-t-elle aux vitamines ?','Manger seulement quelques aliments peut entraîner des manques, par exemple en calcium sans produits laitiers. L’application additionne ce que ta liste t’apporte un jour type et montre ce qui manque sous Besoins quotidiens en nutriments. L’étape 2 propose des aliments faciles qui comblent les manques. Quelques-uns, comme la vitamine D, sont difficiles à obtenir avec des aliments faciles : lorsque l’application le mentionne, demande à un pharmacien.'],
  ['pill','Dois-je prendre une pilule de vitamines ?','Demande d’abord à un pharmacien. Tu peux demander au comptoir, sans rendez-vous. Certaines pilules ramollissent les selles, comme le magnésium ou une grande quantité de vitamine C, et certaines ne se mélangent pas bien avec les médicaments.'],
  ['why-water','Pourquoi une boisson de réhydratation et pas seulement de l’eau ?','La diarrhée élimine l’eau et les sels. L’eau remplace l’eau, mais pas les sels. Une boisson de réhydratation de la pharmacie possède le bon mélange.'],
  ['blood','Du sang dans la toilette : que signifient les couleurs ?','Du rouge vif sur le papier ou des traces sur les selles provient généralement de l’extrémité de l’intestin, souvent une petite fissure ou des hémorroïdes. Du rouge foncé, du noir ou du sang mélangé aux selles peut provenir de plus haut : consulte aujourd’hui. De l’eau rouge, des caillots ou un saignement persistant : appelle le 911. Seul un examen peut dire d’où vient le sang.'],
  ['doctor','Quand devrais-je voir un médecin ?','Appuie sur « Ça ne va pas » en haut pour voir les signes qui nécessitent le 911 ou une consultation aujourd’hui. Prends rendez-vous pour de la diarrhée intermittente pendant plus de 4 semaines, des réveils nocturnes pour aller aux toilettes, une perte de poids sans effort, ou du sang persistant. L’application fait également une pause et t’indique quand il est temps : selles aqueuses 3 jours d’affilée, 3 mauvais jours consécutifs avec de la nourriture simple seulement, ou aucun bloc de 7 bons jours d’affilée au cours des 2 premières semaines.'],
  ['work','Cela va-t-il trouver mon problème ?','Pas toujours. Les troubles intestinaux peuvent avoir plusieurs causes à la fois, et certaines n’ont rien à voir avec la nourriture : une infection, la maladie cœliaque, un médicament, une inflammation de l’intestin. Le type d’aliment, la façon de le cuisiner, le sommeil et le stress jouent tous un rôle, c’est pourquoi l’application garde ces éléments stables. Si la nourriture simple ne calme pas ton intestin, l’application s’arrête et te dit de consulter un médecin. C’est quand même une réponse : apporte ton journal avec toi.'],
  ['what','L’application peut-elle me dire ce qui ne va pas ?','Non. C’est un journal qui t’aide à trouver un aliment. Elle ne peut pas détecter une infection, la maladie cœliaque ou une inflammation intestinale, et elle ne peut pas distinguer un aliment de la malchance par elle-même. Son résumé aide un médecin à voir ce qui s’est passé.'],
  ['private','Mes données sont-elles privées ?','Tout reste sur ce téléphone, dans ce navigateur. Rien n’est envoyé nulle part. Fais-en une sauvegarde à partir du menu. Un téléphone perdu ou un navigateur effacé supprime tout.']];

/* ---------- entries ---------- */

/* ---------- foods ---------- */

const norm=x=>String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

/* ---------- fast route: the list, cuts, calm days, suspects ---------- */
function baseNow(){ const F=S.fast; if(!F) return []; const b=new Set(S.base0||[]), ops=[];
  for(const c of S.cuts) if(c.d>=F.start) ops.push({at:c.at,del:c.key});
  for(const a of S.adds) if(a.d>=F.start) ops.push({at:a.at,add:a.key});

/* stages, read from the reports. 1 Calm your gut: a bad day always brings you back here. 2 Add easy foods: after 2 good days with no bad day between

/* step 2 to step 1: on a bad day, the newest food added in step 2 (today's, or yesterday's if none today) comes off the list and goes on the "doesn't sit right" list. */
function fallBack(fi){ if(!fi||S.pause) return false; let ch=false;
  for(const B of fi.falls){ const y=kAdd(B,-1), a=S.adds.filter(a=>a.why==='s2'&&(a.d===B||a.d===y)&&!S.cuts.some(c=>c.key===a.key&&(c.at>a.at||(c.why==='fall'&&c.d===B)))).sort((p,q)=>q.at-p.at)[0];
    if(a){ S.cuts.push({key:a.key,d:B,at:Math.max(now(),a.at+1),why:'fall'}); ch=true; } }

/* foods that didn't sit right: stopped in step 1, taken off after a bad day in step 2, or reacted when tried again. A food that came back after a good test isn't here. */
function sitList(){ const F=S.fast; if(!F||S.route!=='fast') return []; const bn=baseNow(), m=new Map();
  for(const c of S.cuts.filter(c=>c.d>=F.start)) m.set(c.key,{key:c.key,d:c.d,why:c.why==='fall'?'t’a incommodé après son ajout':c.why==='swap'?'remplacé à l’étape 1':c.why==='roll'?'supprimé à nouveau après d’autres mauvais jours':'supprimé à l’étape 1'});
  for(const t of S.tests.filter(t=>t.route==='fast'&&t.res==='react'&&t.d1>=F.start)) m.set(t.key,{key:t.key,d:t.end,why:'t’a incommodé lors d’un nouvel essai'});

/* stage 2: easy foods are plain or ! (not packaged, not a drink, alcohol or a supplement), not on the list, not stopped in this trial, nothing over an upper limit

function s2Info(fi){ if(MEMO.s2) return MEMO.s2; const TG=targets(), N=nutri(), UL=TG.ul, base=new Set(baseNow()), out=new Set(S.cuts.filter(c=>c.d>=fi.F.start).map(c=>c.key));

/* stage 3: after a reaction, other foods from the same group, so only what upsets you is skipped */
function kindOf(){ const t=S.tests.filter(x=>x.route==='fast'&&x.res&&x.res!=='void').slice(-1)[0]; if(!t||t.res!=='react') return null; const x=food(t.key); if(!x.b||!x.b.length) return null;
  const b=[...x.b].filter(y=>BK[y]).sort((p,q)=>BK[q][0]-BK[p][0])[0]; return b?{key:t.key,b,l:BK[b][1]}:null; }
function candidates(){ const fi=fastInfo(); if(!fi) return []; const base=baseNow(), roll=S.cuts.filter(c=>c.why==='roll'&&c.d>=fi.F.start).map(c=>c.key);

/* in step 2 a food on the "doesn't sit right" list can be tried again once nothing is running, no food was added today, and 2 good days have passed since the last bad day or test that didn't count */
function fastCanTest(fi){ if(S.pause||!fi||fi.stage!==2||running()) return {ok:false};
  if(S.adds.some(a=>a.why==='s2'&&a.d===fi.T)) return {ok:false,wait:'Tu as ajouté un aliment aujourd’hui. Réessaie demain.'};
  const dn=S.tests.filter(t=>t.route==='fast'&&t.res&&t.res!=='none'&&t.d1>=fi.F.start).sort((a,b)=>a.endAt-b.endAt), last=dn[dn.length-1];

/* ---------- slow route: cut one food group, hold it, then prove it ---------- */

const isB=id=>!!BK[id], cutNm=id=>isB(id)?BK[id][1]:food(id).n, cutMk=id=>isB(id)?BK[id][0]:food(id).m, cutLo=id=>isB(id)?BK[id][1].toLowerCase():food(id).n, inCut=(id,key)=>isB(id)?food(key).b.includes(id):key===id;

function slowCanTest(si){ if(S.pause||!si||!si.cur||!['pass','out'].includes(si.cur.res)||running()) return {ok:false}; const ts=S.tests.filter(t=>t.ci===si.W.cuts.length-1&&t.route==='slow'&&t.res==='void'), v=ts[ts.length-1];

/* what to cut next: a food that came before most bad days and few calm ones goes first; then the groups, History's first, highest mark first; a cut that already failed goes last */

function slowNext(){ const W=S.slow, lb=lookback(), top=lb.rows.filter(r=>r.b).map(r=>r.b), skip=W.skip||[]; const dn=new Set(W.cuts.filter(c=>c.res!=='fail').map(c=>c.b)), failed=new Set(W.cuts.filter(c=>c.res==='fail').map(c=>c.b));

function routeStart(r){ return r==='slow'?(S.slow&&S.slow.start):(S.fast&&S.fast.start); }
/* the chance number: how often 4 days would hold a bad day by luck, from the person's own reported days on the same food, which start the day after the last cut */
function chanceFor(t){ let from=routeStart(t.route)||t.d1;
  if(t.route==='fast'){ const c=S.cuts.filter(x=>x.d<t.d1&&x.d>=from); if(c.length) from=kAdd(c[c.length-1].d,1); } else if(S.slow&&S.slow.cuts[t.ci]) from=kAdd(S.slow.cuts[t.ci].d,1);
  let bad=0,n=0; for(let k=from;k<t.d1;k=kAdd(k,1)){ if(inTest(k)) continue; const di=dayInfo(k); if(!di.logged) continue; n++; if(di.bad) bad++; }
  const p=(bad+.5)/(n+1); return {p,c:1-Math.pow(1-p,4),bad,n,from}; }
function firstPortion(t,k){ const ts=S.ev.filter(e=>e.k==='food'&&e.key===t.key&&e.d===k).map(e=>e.t); return ts.length?Math.min(...ts):kStart(k); }
function evalTest(t){ if(t.froz) return; const T=today(); let res=null,end=null,why='';
  for(let i=0;i<4;i++){ const k=kAdd(t.d1,i); if(k>T) break; const di=dayInfo(k);
    if(changeOn(k,t)){ res='void'; end=k; why='quelque chose d’autre a changé '+dLabel(k); break; }
    if(di.bad){ if(i===0){ const p0=firstPortion(t,k); if(!di.E.some(e=>((e.k==='st'&&e.sh>=3)||(e.k==='sym'&&gutSym(e)))&&e.t>=p0)){ res='void'; end=k; why='ton intestin n’était pas calme au début : des selles molles ou un symptôme sont survenus avant la première portion'; break; } } res='react'; end=k; break; }
    if(di.alarm){ res='void'; end=k; why='un signe d’alerte '+dLabel(k); break; }
    if(k<T){ if(!di.logged){ res='void'; end=k; why=dLabel(k)+' n’a pas été consigné'; break; } if(i<3&&!ateOn(t,k)){ res='void'; end=k; why='la portion n’a pas été consignée '+dLabel(k); break; } if(i===3){ res='none'; end=k; } } }
  if(t.stop){ res=t.stop.res; end=t.stop.d; why=t.stop.why; }
  if(res!==t.res||end!==t.end){ t.res=res; t.end=end; t.why=why; if(res){ t.endAt=now(); t.ch=chanceFor(t); } }
  if(t.res&&kDiff(t.end,T)>=2) t.froz=true; }
function verdict(key){ const ts=S.tests.filter(t=>t.key===key&&t.res), R=ts.filter(t=>t.res==='react'), N=ts.filter(t=>t.res==='none');
  if(ts.some(t=>t.allergy)) return {v:'allergy',l:'Signe d’allergie : non testé à nouveau ici'};
  if(R.length>=2){ const a=R[R.length-2], b=R[R.length-1], two=(a.ch?a.ch.c:1)*(b.ch?b.ch.c:1); return two<0.1?{v:'rep',l:'Répété',two,txt:'Déclencheur probable pour cette portion. Exclus-le et montre le résumé à ton médecin.'}:{v:'twice',l:'Deux fois, cela pourrait être le fruit du hasard',two,txt:'Tes bons jours ne sont pas assez réguliers pour écarter le hasard.'}; }
  if(R.length===1) return N.length&&N[N.length-1].endAt>R[0].endAt?{v:'mixed',l:'A réagi une fois, puis aucune réaction lors d’un nouveau test'}:{v:'once',l:'A réagi une fois',txt:'Ton choix : garde-le de côté, ou réintroduis-le plus tard pour être plus sûr.'};

/* ---------- stops: only reported days count, so a thin log alone never stops anything ---------- */
function watery3(){ const T=today(); for(let s=0;s<2;s++){ let ok=true; for(let i=0;i<3;i++) if(!dayInfo(kAdd(T,-(s+i))).watery){ ok=false; break; } if(ok) return true; } return false; }
function loggedSince(k){ let n=0; for(let d=k;d<today();d=kAdd(d,1)) if(dayInfo(d).logged) n++; return n; }
/* the last 3 reported days since k were all bad (today counts once it is bad) */
function bad3Since(k){ const T=today(), L=[]; for(let d=T;d>=k&&L.length<3;d=kAdd(d,-1)){ const i=dayInfo(d); if(d===T?i.bad:i.logged) L.push(i.bad); } return L.length===3&&L.every(Boolean); }

function checkStops(fi,si){ if(S.pause) return; const T=today(), z=k=>S.snooze[k]&&S.snooze[k]>=T; let why=null;
  if(watery3()&&!z('watery')) why='watery';
  if(!why&&fi){ if(fi.phase!=='test'&&fi.plainAt&&bad3Since(fi.plainAt)&&!z('fast3')) why='fast3'; else if(!fi.F.holdAt&&kDiff(fi.F.start,T)>=14&&loggedSince(fi.F.start)>=7&&!z('fast14')) why='fast14'; else { const r=rollInfo(fi); if(r&&r.bad>=3&&!r.adds.length&&!z('roll')) why='roll'; } }
  if(!why&&si&&si.fails>=3&&!z('slow3')) why='slow3';
  if(!why) why=bloodStop(z);
  if(why) setPause(why,'doc'); }
/* bright red blood books a doctor's visit when it comes a week after the stools went back to normal (no loose stool in the 7 days before, 4 or more of them reported),
   when there's more than on any day in the week before, or when it has come on and off for 3 weeks (gaps under 7 days) */
function bloodStop(z){ const T=today(), bm=k=>dayInfo(k).bl;
  for(const k of [T,kAdd(T,-1)]){ const b=bm(k); if(b<1||b>2) continue; let rep=0, loose=false, prev=0;
    for(let i=1;i<=7;i++){ const d=dayInfo(kAdd(k,-i)); if(d.logged) rep++; if(d.loose) loose=true; prev=Math.max(prev,d.bl); }
    if(!loose&&rep>=4&&!z('bweek')) return 'bweek';
    if(prev>=1&&b>prev&&!z('bmore')) return 'bmore'; }
  let L=null; for(let i=0;i<7&&!L;i++){ const k=kAdd(T,-i); if(bm(k)>=1) L=k; }
  if(L){ let s=L, gap=0; for(let k=kAdd(L,-1);gap<7&&kDiff(k,L)<=90;k=kAdd(k,-1)){ if(bm(k)>=1){ s=k; gap=0; } else gap++; } if(kDiff(s,L)>=21&&!z('b3wk')) return 'b3wk'; }
  return null; }
/* "I've been checked": doctor stops rest for 14 days; a get-seen-today sign is logged without pausing for 14 days when it comes back. 911 signs always pause. */
function checked(){ const p=S.pause; if(!p) return; S.checks.push({why:p.why,tier:p.tier,sign:p.sign,d:today(),at:now()}); if(p.tier==='doc') S.snooze[p.why]=kAdd(today(),14); else if(p.tier==='same'&&p.sign) S.snooze['sign:'+p.sign]=kAdd(today(),14); S.pause=null; save(); render(); toast(p.tier==='same'?'Noté. Pendant 14 jours, ce signe est consigné sans faire de pause.':'Noté, avec la date du jour'); }

/* ---------- history: what was reported in the 36 hours before each bad day, against calm days ---------- */
function lookback(){ if(MEMO.lb) return MEMO.lb; const T=today(), from=kAdd(T,-60), W={bad:[],calm:[]};
  for(const k of [...new Set(S.ev.map(e=>e.d))]){ if(k<from||k>T) continue; const di=dayInfo(k); if(di.bad) W.bad.push(Math.min(...di.E.filter(e=>(e.k==='st'&&e.sh>=3)||(e.k==='sym'&&gutSym(e))).map(e=>e.t))); else if(di.calm){ const st=di.st.map(e=>e.t); W.calm.push(st.length?Math.min(...st):kStart(k)+12*H); } }
  return MEMO.lb=lookRows(W); }
/* crashes against calm days without one, the same way */
function crashLook(){ if(MEMO.cl) return MEMO.cl; const T=today(), from=kAdd(T,-60), W={bad:S.ev.filter(e=>e.k==='sym'&&(e.ks||[]).includes('crash')&&e.d>=from).map(e=>e.t),calm:[]};
  for(const k of [...new Set(S.ev.map(e=>e.d))]){ if(k<from||k>T) continue; const di=dayInfo(k); if(di.calm&&!di.crash){ const st=di.st.map(e=>e.t); W.calm.push(st.length?Math.min(...st):kStart(k)+12*H); } }

function lookRows(W){
  /* on the fast route the list is eaten every day without being reported, and foods coming back are judged by their own test: both are left out */
  const skip=new Set(S.route==='fast'&&S.fast?[...(S.base0||[]),...S.adds.map(a=>a.key),...S.tests.filter(t=>t.route==='fast').map(t=>t.key)]:[]);
  const foods=S.ev.filter(e=>e.k==='food'&&!skip.has(e.key)), cnt={}, add=(id,b,kind)=>{ const c=cnt[id]||(cnt[id]={b,bad:0,calm:0}); c[kind]++; };
  for(const kind of ['bad','calm']) for(const t0 of W[kind]){ const fs=foods.filter(e=>e.t<t0&&e.t>=t0-36*H), bs=new Set(); fs.forEach(e=>food(e.key).b.forEach(b=>bs.add(b))); new Set(fs.map(e=>e.key)).forEach(k=>add(k,null,kind)); bs.forEach(b=>add('b:'+b,b,kind)); }

  rows=rows.filter(r=>{ if(!r.b) return true; const fs=Object.keys(cnt).filter(id=>!cnt[id].b&&food(id).b.includes(r.b)); return !(fs.length===1&&cnt[fs[0]].bad===r.bad&&cnt[fs[0]].calm===r.calm); });
  return {nb,nc,ok,rows}; }
function sinceMeal(t){ const fs=S.ev.filter(e=>e.k==='food'&&e.t<t&&t-e.t<=14*H); if(!fs.length) return null; const last=fs[fs.length-1], m=fs.filter(e=>e.t===last.t); return {min:Math.round((t-last.t)/6e4),at:hm(last.t),names:m.slice(0,2).map(e=>food(e.key).n).join(', ')+(m.length>2?'…':'')}; }
function dur(min){ if(min<60) return min+' min'; const h=Math.floor(min/60), mm=min%60; return mm>=5?`${h} h ${mm} min`:`${h} h`; }

function targets(){ const p=S.p, sex=p.sex||'hi', age=p.age||'a2', life=p.life||[]; const preg=life.includes('preg')&&sex!=='m', bf=life.includes('bf')&&sex!=='m'&&!preg, veg=life.includes('veg');
  const M={ca:age==='a4'?1200:1000,fe:8,mg:age==='a1'?400:420,k:3400,zn:11,c:90,b1:1.2,fol:400,b12:2.4,d:age==='a4'?800:600,vk:120,va:900,mn:2.3,cu:0.9,fib:(age==='a3'||age==='a4')?30:38,e:15,b2:1.3,b3:16,b6:(age==='a3'||age==='a4')?1.7:1.3,se:55};

  T.e=Math.round(T.e*1.49*10)/10; if(veg){ if(!preg) T.fe=Math.round(T.fe*1.8); T.zn=Math.round(T.zn*1.5); }
  T.prot=preg||bf?71:sex==='f'?46:56; T.ul={d:4000,fe:45,zn:40,c:2000,ca:(age==='a3'||age==='a4')?2000:2500,mn:11,cu:10,b6:100,se:400}; return T; }
function outBuckets(){ const si=slowInfo(); if(si) return si.out.filter(isB); const fi=fastInfo(); if(!fi) return []; const inb=new Set(fi.base.flatMap(x=>x.b)); return Object.keys(BK).filter(b=>!inb.has(b)); }
/* the food groups that carry the most of each one, best first; meat, fish and eggs are plain foods, so they aren't groups */
const SRC={prot:['dairy','legume','nuts'],fib:['fibre','legume','veg','fruit'],fe:['legume','gluten'],mg:['nuts','legume','fibre'],k:['veg','fruit','legume','dairy'],b1:['gluten','legume','nuts'],b2:['dairy','gluten'],b3:['gluten','nuts'],b6:['legume','fruit','veg'],b12:['dairy'],fol:['legume','veg','gluten'],zn:['dairy','nuts','legume'],se:['nuts','gluten'],cu:['nuts','legume'],ca:['dairy'],c:['fruit','veg'],e:['nuts'],d:['dairy'],va:['veg','dairy'],mn:['fibre','nuts','legume'],vk:['veg']};
const SRCN={dairy:'dairy',legume:'haricots et lentilles',nuts:'noix et graines',fibre:'grains entiers et son',veg:'vegetables',fruit:'fruit',gluten:'blé (farine enrichie)'};
/* fast route: a day on the list, each food once unless more was reported. Otherwise: the average of the days with meals reported, last 7 days. */
function nutri(){ if(MEMO.nu) return MEMO.nu; const T=today(), from=kAdd(T,-6), tot={}, lack=new Set(), fi=fastInfo(); let n=0, typed=0;
  const addF=(x,q)=>{ if(!x.f){ typed++; return; } for(const k of NK) tot[k]=(tot[k]||0)+x.f.v[k]*q; x.f.lack.forEach(k=>lack.add(k)); };
  /* fast route: each list food at its usual amount a day; a day with it in a meal report counts what was reported instead */
  if(fi){ n=fi.base.length?1:0; const lo=fi.F.start>from?fi.F.start:from, days=kDiff(lo,T)+1;
    for(const x of fi.base){ const u=amtOf(x.key); let tq=0; for(let k=lo;k<=T;k=kAdd(k,1)){ const q=S.ev.filter(e=>e.k==='food'&&e.key===x.key&&e.d===k).reduce((a,e)=>a+(e.q||1),0); tq+=q||u; } addF(x,tq/days); } }
  else { const days=new Set(); for(const e of S.ev){ if(e.k!=='food'||e.d<from||e.d>T) continue; days.add(e.d); addF(food(e.key),e.q||1); } n=days.size; }

    const src=band==='low'||band==='empty'?(SRC[k]||[]).filter(b=>out.includes(b)).slice(0,2):[];
    return {k,l,u,dc,w,v,t,pc,band,over,src,lack:lack.has(k)}; });

function pickKeys(){ const m=V.mode, g=V.grp, q=norm((V.q||'').trim()), fi=D.fi, si=D.si, base=fi?baseNow():[], all=m==='add'&&fi?s2Info(fi).pool:FOODS.filter(usable), only=m==='back'&&si&&si.cur?si.cur.b:null;

  if(q){ const also=q.length>=3?Object.keys(ALIAS).filter(a=>a.startsWith(q)).flatMap(a=>ALIAS[a]):[], rank=f=>{ const n=norm(f.n), i=n.indexOf(q); return i<0?(also.some(w=>n.includes(w))?2:9):(i===0||/[^a-z0-9]/.test(n[i-1]))?0:1; };

  else if(g==='cut') keys=only?(isB(only)?srt(all.filter(f=>f.b.includes(only))):[only]):[...new Set([...candidates(),...S.cuts.filter(c=>fi&&c.d>=fi.F.start).map(c=>c.key).reverse()])];

/* yesterday's meal closest to this time, within 3 hours either way; anything cut since and the food being tested are left out */
function sameYest(u){ const t0=atTime(u.day,u.at)-24*H, run=running(), si=D.si, base=D.fi?baseNow():null;
  const fs=S.ev.filter(e=>e.k==='food'&&Math.abs(e.t-t0)<=3*H); if(!fs.length) return null;
  const best=fs.reduce((a,e)=>Math.abs(e.t-t0)<Math.abs(a.t-t0)?e:a), mid=best.m||best.t, meal=fs.filter(e=>(e.m||e.t)===mid), out=[], items={};
  for(const e of meal){ if(run&&e.key===run.key) continue; const cut=(base&&S.cuts.some(c=>c.key===e.key&&c.at>e.t)&&!base.includes(e.key))||(si&&si.out.some(id=>inCut(id,e.key))); if(cut) out.push(e); else items[e.key]=(items[e.key]||0)+(e.q||1); }
  const ks=Object.keys(items); if(!ks.length) return null; const on=[...new Set(out.map(e=>food(e.key).n.toLowerCase()))];
  return {items,label:`Pareil qu’hier, ${hm(best.t)} : `+ks.map(k=>food(k).n+qx(items[k])).join(', ')+(on.length?` (sans ${on.join(', ')} : tu as éliminé ${on.length>1?'them':'it'})`:'')}; }

const HINT='<div class="card soft"><div class="eyebrow">C’est un progrès</div><p class="small" style="margin:0">Des selles molles ne sont pas un échec. Sur une liste simple, cela pointe vers la cause, et chaque rapport que tu fais affine la recherche.</p></div>';

function guideFast(fi){ const t=running(), top=fi.marked[0], list=fi.base.map(NM).join(' · ')||'rien pour l’instant', EB=n=>STG[n-1];

  return one(EB(1),'Signale tes premières selles de la journée.',`<p class="small" style="margin:0">Si elles sont pâteuses ou aqueuses, l’application te dit quoi arrêter. Si elles sont moulées, ne change rien.</p>`); }

function resultLine(t){ const x=food(t.key), c=t.ch, lab=t.res==='react'?'<span class="tag">reaction</span>':t.res==='none'?'<span class="tag teal">aucune réaction</span>':'<span class="tag ink">non comptabilisé</span>';

function vNut(){ const p=S.p, N=nutri(), seg=(k,o)=>`<div class="gtabs" style="margin:4px 0 8px">${o.map(([v,l])=>`<button type="button" data-act="np" data-k="${k}" data-v="${v}" aria-pressed="${p[k]===v}">${l}</button>`).join('')}</div>`;

  install:()=>{ const go=()=>{ const e=window.INSTALL; closeSheet(); e.prompt(); e.userChoice.finally(()=>{ window.INSTALL=null; }); };

document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!sheet.classList.contains('on')&&(!V||V.v==='day'||V.v==='nut')) render(true); });

{ let raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){ STORE='none'; }
