  if(minor){
    P.addNote = L('Nothing to buy. At your age, food and the ferritin test do the work — supplements only with a parent and a pharmacist.','Rien à acheter. À ton âge, la nourriture et le test de ferritine font le travail — des suppléments seulement avec un parent et un pharmacien.')
      + (SF.vegan ? L(' One exception: on a vegan diet B12 isn’t optional at any age — enriched soy milk every day, or a B12 pill with a parent and a pharmacist.',' Une exception : quand on est végane, la B12 n’est pas optionnelle, peu importe l’âge — de la boisson de soya enrichie chaque jour, ou un comprimé de B12 avec un parent et un pharmacien.') : '');
  } else {
    if(needSalt) addItem('salt',L('Salt','Sel'),L('A quarter teaspoon in water mid-afternoon. Free.','Un quart de cuillère à thé dans l’eau en milieu d’après-midi. Gratuit.')+`<span class="add-warn">${L('Not if you have high blood pressure, heart or kidney disease, take lithium, or were told to limit salt.','Pas si tu fais de l’hypertension, as un problème de cœur ou de reins, prends du lithium, ou si on t’a dit de limiter le sel.')}</span>`,0);
    const pharm = (preg||SF.bf) ? L(' Pharmacist’s yes first.',' Le feu vert du pharmacien d’abord.') : '';
    const wants=[];
    if(drinksDaily||DI.shaky||(DI.unknown&&any('keep','beer','wine','spirits'))) wants.push({k:'thiamine',cost:5,label:L('Thiamine (B1)','Thiamine (B1)'),why:(DI.shaky?L('You get shaky when you skip a drink. Thiamine protects against the nerve and brain damage heavy drinking can cause — and don’t stop suddenly on your own; a doctor or pharmacist can make that safe.','Tu trembles quand tu sautes un verre. La thiamine protège contre les dommages aux nerfs et au cerveau que l’alcool en grande quantité peut causer — et n’arrête pas d’un coup par toi-même; un médecin ou un pharmacien peut rendre ça sécuritaire.'):drinksDaily?L('You drink most days. Thiamine protects against the nerve and brain damage regular drinking can cause.','Tu bois la plupart des jours. La thiamine protège contre les dommages aux nerfs et au cerveau que l’alcool régulier peut causer.'):L('If you drink most days, thiamine protects against the nerve and brain damage regular drinking can cause.','Si tu bois la plupart des jours, la thiamine protège contre les dommages aux nerfs et au cerveau que l’alcool régulier peut causer.'))+pharm,
      dLabel:L('Thiamine (B1) — when you have $5','Thiamine (B1) — quand tu auras 5 $'),dWhy:L('Non-negotiable if you drink most days. Buy this one before anything else.','Non négociable si tu bois presque tous les jours. Achète celui-là avant tout le reste.')});
    if(SF.veg) wants.push({k:'b12',cost:8,label:L('Vitamin B12','Vitamine B12'),why:L('One a day at the label dose — the cheapest works. Vegan: not optional. Vegetarian: unless enriched milk, eggs and dairy cover it.','Une par jour à la dose de l’étiquette — la moins chère fait l’affaire. Végane : pas optionnel. Végétarien ou végétarienne : sauf si la boisson enrichie, les œufs et les produits laitiers la couvrent.')+pharm,

    if(needPsy) wants.push({k:'psyllium',cost:8,label:L('Psyllium husk, plain','Psyllium nature'),why:L((has('stool','hard')?'Label dose, 1–2 tsp, in a FULL glass of water, morning — and one more glass of water later in the day. Softens hard stools within a few days.':'Label dose, 1–2 tsp, in a FULL glass of water, morning. Firms the gut in days, stops the burn.')+((has('fuel','coffee')||has('fuel','energy')||drinks)?' If coffee, energy drinks or beer are most of what you drink, add a glass of plain water with it — psyllium needs water in the gut to work.':''),(has('stool','hard')?'Dose de l’étiquette, 1–2 c. à thé, dans un GRAND verre d’eau, le matin — et un autre verre d’eau plus tard dans la journée. Ramollit les selles dures en quelques jours.':'Dose de l’étiquette, 1–2 c. à thé, dans un GRAND verre d’eau, le matin. Raffermit en quelques jours, arrête la brûlure.')+((has('fuel','coffee')||has('fuel','energy')||drinks)?' Si le café, les boissons énergisantes ou la bière sont presque tout ce que tu bois, ajoute un verre d’eau nature avec — le psyllium a besoin d’eau dans l’intestin pour agir.':''))+(pharm||((kidney||has('meds','thinner'))?L(' Pharmacist’s yes first — kidney disease or a blood thinner, and if you’re on a fluid limit, the full glass matters.',' Le feu vert du pharmacien d’abord — maladie des reins ou anticoagulant, et si tu as une limite de liquides, le grand verre compte.'):'')),

    if(needMag) wants.push({k:'magnesium',cost:10,label:L('Magnesium glycinate','Magnésium glycinate'),why:L('Label dose, 200–350 mg, evening — 350 is the daily ceiling from pills. Better sleep on the hours you have.','Dose de l’étiquette, 200 à 350 mg, le soir — 350, c’est le plafond quotidien en pilules. Un meilleur sommeil sur les heures que tu as.')+pharm,

      dLabel:L('Creatine — next time you have $12','Créatine — la prochaine fois que tu auras 12 $'),dWhy:L('Worth it, but after the ones above.','Ça vaut la peine, mais après ceux plus haut.')});

  }

  if(has('meds','stim')) P.timing.push(L(`Eat before the stimulant. If it’s Vyvanse, Adderall or Dexedrine: juice is fine, but ask your pharmacist before taking ${T('vitc','high-dose vitamin C pills')} on the same days.`, `Mange avant le stimulant. Si c’est Vyvanse, Adderall ou Dexedrine : le jus, c’est correct, mais demande au pharmacien avant de prendre des ${T('vitc','comprimés de vitamine C à haute dose','comprimés de vitamine C à haute dose')} les mêmes jours.`));
  if(needPsy&&(a.meds||[]).some(m=>m!=='none')) P.timing.push(L(`${T('psyllium','Psyllium')} two hours away from every medication — it binds them.`, `${T('psyllium','Le psyllium','Le psyllium')} à deux heures de chaque médicament — il nuit à leur absorption.`));
  if(has('meds','ppi')) P.timing.push(L(`${T('acidblocker','Acid blockers')} drain iron, B12 and magnesium over years. Don’t stop it; do get all three checked.`, `${T('acidblocker','Les bloqueurs d’acide','Les bloqueurs d’acide')} vident le fer, la B12 et le magnésium avec les années. N’arrête pas; fais vérifier les trois.`));
  if(has('meds','metformin')) P.timing.push(L(`Metformin lowers ${T('b12','B12')} over time. Add B12 to the blood test — and if your feet tingle, burn or go numb, say so even if the number comes back “normal”.`, `La metformine baisse la ${T('b12','B12','B12')} avec le temps. Ajoute la B12 à la prise de sang — et si tes pieds picotent, brûlent ou s’engourdissent, dis-le même si le chiffre revient « normal ».`));
  if(has('meds','antidep')) P.timing.push(L(`${T('antidep','Loose stools can be a side effect')} of the antidepressant. Not a reason to stop. A reason to mention it, with your ferritin number in hand. And if you’re having thoughts of ending your life, that’s 9-8-8 (Canada) or 988 (US), call or text, today — not a nutrition fix.`, `${T('antidep','Les selles molles peuvent être un effet secondaire','Les selles molles peuvent être un effet secondaire')} de l’antidépresseur. Ce n’est pas une raison d’arrêter — c’est une raison d’en parler au prescripteur, avec ton résultat de ferritine en main. Et si tu as des idées de mettre fin à tes jours, c’est le 9-8-8 (Canada) ou le 988 (É.-U.), appel ou texto, aujourd’hui — pas une question de nutrition.`));

  if(sedative) P.timing.push(L(`${T('sedhang','The morning after a sleeping pill')} lasts longer than it feels: for zopiclone, Health Canada says no driving for 12 hours after a dose. Count back from when you have to be on the road — that gap is the pharmacist conversation.${drinks?'':' And alcohol stays off pill nights; the two together can slow breathing to a stop.'}`, `${T('sedhang','Le lendemain du somnifère','Le lendemain du somnifère')} dure plus longtemps qu’il paraît : pour la zopiclone, Santé Canada dit pas de volant pendant 12 heures après une dose. Compte à rebours à partir de l’heure où tu dois prendre la route — cet écart-là, c’est la conversation à avoir avec le pharmacien.${drinks?'':' Et l’alcool reste hors des soirées avec pilule; les deux ensemble peuvent ralentir la respiration jusqu’à l’arrêt.'}`));
  if(has('meds','lithium')) P.timing.push(L(`${T('lithium','On lithium')}: don’t change your salt or water habits without your prescriber — lithium tracks sodium, and a big shift either way moves your level. Salt water is off your card. Diarrhea or heavy sweating on lithium is a call to the pharmacist the same day. Same for caffeine: cutting a lot of coffee or energy drinks at once can push your lithium level up — move it earlier rather than cut it, and tell your prescriber before a big change.`, `${T('lithium','Sous lithium','Sous lithium')} : ne change pas tes habitudes de sel ou d’eau sans ton prescripteur — le lithium suit le sodium, et un gros changement dans un sens ou l’autre fait bouger ton taux. On retire l’eau salée de ta carte. Diarrhée ou grosse sueur sous lithium, c’est un appel au pharmacien le jour même. Pareil pour la caféine : couper beaucoup de café ou de boissons énergisantes d’un coup peut faire monter ton lithium — déplace-la plus tôt plutôt que de la couper, et avise ton prescripteur avant un gros changement.`));

      `<b>Selles dures, peu fréquentes :</b> de l’eau et des fibres d’abord — le ${T('psyllium')} compte, les fèves et les lentilles aussi.${tshOn?(SF.pp?' Après un accouchement, de la constipation avec de la fatigue, une prise de poids ou le moral bas, ça fait partie des signes d’une thyroïde au ralenti — c’est pour ça que la '+T('tsh','TSH','TSH')+' est sur ta liste.':' Avec une fatigue qui ne lâche pas, la constipation fait partie des signes d’une thyroïde au ralenti — c’est pour ça que la '+T('tsh','TSH','TSH')+' est sur ta liste.'):''}`)); }
  if(any('sleep','5','6','broken')) P.leak.push(L(`<b>We can’t give you more hours of sleep.</b> ${T('sleepq','Protect the ones you have')} — most of the ${T('sleepstages','deep, repairing sleep')} comes in the first half of the night: caffeine stops eight hours before bed, no alcohol inside three hours of it, magnesium, screen off. ${drinks?'Alcohol in the last three hours before bed is one reason six hours can feel like three.':''}`, `<b>On ne peut pas te donner plus d’heures de sommeil.</b> ${T('sleepq','Protège celles que tu as','Protège celles que tu as')} — la plus grande partie du ${T('sleepstages','sommeil profond, celui qui répare','sommeil profond, celui qui répare')}, arrive dans la première moitié de la nuit : caféine finie huit heures avant le coucher, pas d’alcool dans les trois heures avant, magnésium, écran fermé. ${drinks?'L’alcool dans les trois dernières heures avant le coucher, c’est une des raisons pour lesquelles six heures peuvent en paraître trois.':''}`));

    : L(`<b>Seven hours and still tired: the hours aren’t the first suspect.</b> Low ${T('iron')}, ${T('b12','B12')} or ${T('tsh','thyroid')} are common causes the blood test on your list can rule in or out. If it comes back normal, sleep quality, mood and medication are next.`, `<b>Sept heures et encore à plat : les heures ne sont pas le premier suspect.</b> Un manque de ${T('iron','fer','fer')}, de ${T('b12','B12','B12')} ou un problème de ${T('tsh','thyroïde','thyroïde')} sont des causes courantes que la prise de sang sur ta liste peut confirmer ou écarter. Si elle revient normale, la qualité du sommeil, le moral et les médicaments viennent ensuite.`));
  if(snore) P.leak.push(L(`<b>Snoring hard, or stopping breathing in your sleep, is a leak no supplement plugs.</b> That picture is ${T('apnea','sleep apnea')} until a test says otherwise. It raises blood pressure, wrecks whatever deep sleep you do get, and the fix works fast. Ask for a home sleep test — one night, a small device.`, `<b>Ronfler fort, ou arrêter de respirer en dormant, c’est une fuite qu’aucun supplément ne colmate.</b> Ce portrait, c’est de l’${T('apnea','apnée du sommeil','apnée du sommeil')} jusqu’à preuve du contraire. Ça fait monter la pression, ça détruit le peu de sommeil profond que tu as, et la solution agit vite. Demande un test de sommeil à la maison — une nuit, un petit appareil.`));
  if(has('crash','random')) P.leak.push(L(`<b>${T('random','Random crashes')} usually mean two or three causes that change day to day.</b> Usual suspects: uneven sleep, drinking nights, late caffeine, skipped meals, aged cheese or leftovers, sugar-free drinks (artificial sweetener), the pill’s timing, the cycle. Stop the day from changing: same breakfast and lunch every day for a week, then one change at a time, three days each. Note bed and wake times, or wear any tracker — trust its hours, not its “deep sleep”. Log each crash in “Why did I crash?”; after three, it reads the pattern.`, `<b>Des ${T('random','crashs aléatoires','crashs aléatoires')}, c’est généralement deux ou trois causes qui changent d’un jour à l’autre.</b> Suspects habituels : sommeil inégal, soirées à boire, caféine tardive, repas sautés, fromage vieilli ou restants, boissons sans sucre (édulcorant artificiel), l’heure de la pilule, le cycle. Empêche la journée de changer : même déjeuner et même dîner tous les jours pendant une semaine, puis un changement à la fois, trois jours chacun. Note tes heures de coucher et de lever, ou porte n’importe quel traqueur — fie-toi à ses heures, pas à son « sommeil profond ». Mets chaque crash au journal dans « Pourquoi j’ai crashé? »; après trois, l’app dégage la tendance.`));

  if(SF.pp) P.notes.push(L(`<b>“It’s postpartum” says when, not why.</b> Broken sleep with a baby is real — and three causes hide behind it, each one blood test: ${T('iron')} drained by pregnancy and delivery, a ${T('pp','thyroid that swings after the birth')} (about 1 in 14 women, most often 4 to 8 months after), and ${T('b12','B12')} if you don’t eat meat or fish. Ferritin, TSH and B12 are on your blood-test list. And mood: in Canada nearly 1 in 4 new mothers has feelings that fit postpartum depression or anxiety, and it often looks like plain exhaustion. Ask your doctor or public-health nurse for the EPDS — 10 questions, 5 minutes.`, `<b>« C’est post-partum », ça dit quand, pas pourquoi.</b> Le sommeil coupé avec un bébé, c’est une vraie fatigue — et trois causes se cachent derrière, chacune une prise de sang : le ${T('iron','fer','fer')} vidé par la grossesse et l’accouchement, une ${T('pp','thyroïde qui se dérègle après la naissance','thyroïde qui se dérègle après la naissance')} (environ 1 femme sur 14, le plus souvent de 4 à 8 mois après), et la ${T('b12','B12','B12')} si tu ne manges ni viande ni poisson. Ferritine, TSH et B12 sont sur ta liste d’analyses. Et le moral : au Canada, près d’une nouvelle mère sur 4 a des sentiments correspondant à une dépression ou à de l’anxiété post-partum, et ça ressemble souvent à de la simple fatigue. Demande l’EPDS à ton médecin ou à l’infirmière de santé publique — 10 questions, 5 minutes.`));
  if(SF.pp) P.always.push(L('<b>Any thought of harming yourself or the baby: 9-8-8 or 911, now.</b>','<b>Une pensée de te faire du mal ou d’en faire au bébé : 9-8-8 ou 911, tout de suite.</b>'));
  if(SF.veg) P.notes.push(L(`<b>No meat or fish: ${T('veg','B12 and iron need a plan')}.</b> B12 comes only from animal and fortified foods; plant iron absorbs less, so your iron target is nearly double. Neither shows up for months — then it’s fatigue with no obvious reason.`, `<b>Sans viande ni poisson : ${T('veg','la B12 et le fer demandent un plan','la B12 et le fer demandent un plan')}.</b> La B12 vient seulement des aliments animaux et enrichis; le fer des plantes s’absorbe moins bien, donc ta cible de fer est presque doublée. Ni l’un ni l’autre ne paraît pendant des mois — puis c’est de la fatigue sans raison évidente.`));
  if(!P.leak.length) P.leak.push(L(`No obvious leak from your answers. ${T('loop','The loop','La boucle')} may be most of it — swap the fuel, keep the rest, and see.`, `Pas de fuite évidente dans tes réponses. La ${T('loop','boucle','boucle')} explique peut-être l’essentiel — change le carburant, garde le reste, et regarde.`));

    : L(`${T('iron')} — not without a ferritin number, ever`, `${T('iron','fer','fer')} — jamais sans un chiffre de ferritine`));

  } else {
    if(!onCard('salt')) P.off.push(noSalt ? L(`${T('salt','salt water')} — not with blood pressure, heart or kidney trouble, lithium, or in pregnancy`, `${T('salt','l’eau salée','l’eau salée')} — pas avec la pression, le cœur, les reins, le lithium ou la grossesse`) : L(`${T('salt','salt water')} — nothing in your answers says you’re losing salt; sweating at work is the exception`, `${T('salt','l’eau salée','l’eau salée')} — rien dans tes réponses ne dit que tu perds du sel; suer au travail, c’est l’exception`));

  const line988 = L(' If “low” is bigger than a bad day — if ending it has crossed your mind — that’s 9-8-8 in Canada, 988 in the US, tonight, call or text.',' Si « down » est plus gros qu’une mauvaise journée — si l’idée d’en finir t’a traversé l’esprit — c’est le 9-8-8 au Canada, le 988 aux États-Unis, ce soir, appel ou texto.');
  const dayItems=['travel','stress','long','sick','period','newfood'].filter(diff);
  const dayWords={travel:['a long drive or a hotel night','une longue route ou une nuit à l’hôtel'],stress:['a fight, bad news or money stress','une chicane, une mauvaise nouvelle ou du stress d’argent'],long:['a much longer day than usual','une journée bien plus longue que d’habitude'],sick:['something coming on','un début de maladie'],period:['a period starting or due','des règles qui commencent ou qui s’en viennent'],newfood:['a food or drink you don’t usually have','un aliment ou une boisson que tu ne prends pas d’habitude']};
  return {
    night:{t:['The night itself','La nuit elle-même'],
      why:()=>{
        if(alc==='high' && (sleep==='none'||sleep==='lt4')) return L(`Six or more drinks and ${sleep==='none'?'no sleep':'under four hours'}. That isn’t a crash with a mystery, it’s a crash with a schedule — nothing on the food list comes close. ${T('sleepq','The only fix is tonight')}: bed before the next round, water, and if this is most nights, ${T('thiamine','B1')} before anything else.${feel('mood')?line988:''}`, `Six verres ou plus et ${sleep==='none'?'pas de sommeil':'moins de quatre heures'}. Ce n’est pas un crash mystérieux, c’est un crash à l’horaire — rien sur la liste de bouffe n’arrive proche. ${T('sleepq','La seule solution, c’est ce soir','La seule solution, c’est ce soir')} : le lit avant la prochaine tournée, de l’eau, et si c’est presque tous les soirs, la ${T('thiamine','B1','B1')} avant tout le reste.${feel('mood')?line988:''}`);
        if(alc==='high') return L(`Six or more drinks. The crash is the hangover, the broken sleep under it, and a body that spent the night processing alcohol instead of resting. Food can’t outrun that. ${T('sleepq','Tonight is the fix')}; if this is most nights, ${T('thiamine','B1')} is the one thing to buy.${wineProfile?' Red wine adds a '+T('histamine')+' load on top.':''}${feel('mood')?line988:''}`, `Six verres ou plus. Le crash, c’est le lendemain de veille, le sommeil cassé en dessous, et un corps qui a passé la nuit à traiter de l’alcool au lieu de se reposer. La bouffe ne peut pas rattraper ça. ${T('sleepq','Ce soir, c’est la solution','Ce soir, c’est la solution')}; si c’est presque tous les soirs, la ${T('thiamine','B1','B1')} est la seule chose à acheter.${wineProfile?' Le vin rouge ajoute une dose d’'+T('histamine')+' par-dessus.':''}${feel('mood')?line988:''}`);
        return L(`${sleep==='none'?'You didn’t sleep.':'Under four hours.'} Below that line nothing else on this list matters — not the chips, not the coffee, not the cheese. Everything you felt today is what a brain does on no sleep, and it would have done it on a perfect diet. ${T('sleepq','Tonight is the whole fix.')}${when==='night'?' If the night was work, the read is still right: the crash is the debt, and the debt gets paid in bed, not at the counter.':''}`, `${sleep==='none'?'Tu n’as pas dormi.':'Moins de quatre heures.'} Sous cette ligne-là, rien d’autre sur cette liste ne compte — ni les chips, ni le café, ni le fromage. Tout ce que tu as senti aujourd’hui, c’est ce qu’un cerveau fait sans sommeil, et il l’aurait fait avec une alimentation parfaite. ${T('sleepq','Ce soir, c’est toute la solution.','Ce soir, c’est toute la solution.')}${when==='night'?' Si la nuit, c’était le travail, la lecture tient quand même : le crash, c’est la dette, et la dette se paie dans le lit, pas au comptoir.':''}`);
      },
      move:['Tonight: bed before anything else. Caffeine done eight hours before, no drink inside three hours, phone face down. One night won’t pay the whole debt. It starts.','Ce soir : le lit avant tout. Caféine finie huit heures avant, pas de verre dans les trois heures, téléphone à l’envers. Une nuit ne paie pas toute la dette. Ça commence.'],
      test:['There is no one-variable test for a night like that. Sleep, then read the next crash.','Il n’y a pas de test à une variable pour une nuit comme ça. Dors, puis lis le prochain crash.'],
      fp:['A no-sleep crash feels like everything at once — heavy, foggy, snappy, cold. If the next one feels like that and you slept, it’s something else on this list.','Un crash sans sommeil, ça ressemble à tout en même temps — lourd, brumeux, à pic, frileux. Si le prochain ressemble à ça et que tu as dormi, c’est autre chose sur cette liste.']},
    gap:{t:['Empty tank','Réservoir vide'],
      why:()=>L(`Nothing in you for four hours before it hit${stim&&stim!=='none'&&stim!=='skip'?' — and a stimulant that erases appetite, so “not hungry” wasn’t information':''}. ${feel('sugar')?'Shaky, sweaty, starving and better after eating is your body’s hunger alarm going off — the clearest fingerprint on this list.':'A body with nothing to burn pulls the plug; that’s the flat, foggy drop.'} ${any('morning','nothing','coffee')?'Your patch already says it: ':''}${T('protein','protein in the first hours awake')} is the floor that stops the fall.`, `Rien dans le corps pendant les quatre heures avant que ça frappe${stim&&stim!=='none'&&stim!=='skip'?' — et un stimulant qui efface l’appétit, alors « pas faim », ce n’était pas une information':''}. ${feel('sugar')?'Tremblements, sueurs, faim et mieux après avoir mangé, c’est l’alarme de la faim qui sonne — l’empreinte la plus claire de cette liste.':'Un corps qui n’a rien à brûler tire la plogue; c’est la chute à plat, dans la brume.'} ${any('morning','nothing','coffee')?'Ta patch le dit déjà : ':''}${T('protein','des protéines dans les premières heures debout','des protéines dans les premières heures debout')}, c’est le plancher qui arrête la chute.`),
      move:[`Tomorrow: something with protein within an hour of getting up — ${protEx()[0].replace(/^./,c=>c.toLowerCase())}. Same everything else.`,`Demain : des protéines dans l’heure après le lever — ${protEx()[1].replace(/^./,c=>c.toLowerCase())}. Tout le reste pareil.`],
      test:['Three days. Only the breakfast changes. If the crash moves or shrinks, that points to it.','Trois jours. Seul le déjeuner change. Si le crash se déplace ou rétrécit, ça pointe vers ça.'],
      fp:['Empty-tank crashes come with a hunger you may not feel — and lift within 20 minutes of real food. If food doesn’t touch it, look elsewhere.','Un crash de réservoir vide vient avec une faim que tu ne sens pas toujours — et il passe en 20 minutes avec de la vraie nourriture. Si manger n’y change rien, cherche ailleurs.']},
    sugar:{t:['The sugar swing','La montagne russe du sucre'],
      why:()=>L(`${food('refined')&&food('sweet')?'Refined carbs and sugar':food('refined')?'Chips, bread, crackers or rice cakes':'Something sweet'} on ${food('protein')?'top of a meal':'an otherwise empty stomach'}: blood sugar spikes, insulin overshoots, and one to three hours later you land below where you started. ${feel('sugar')?'Shaky and starving afterwards is the classic shape of it.':''}${feel('sleepy')?' Heavy eyelids after a starchy lunch is the same curve.':''} It’s not the chips — it’s the chips alone.`, `${food('refined')&&food('sweet')?'Des féculents raffinés et du sucre':food('refined')?'Des chips, du pain, des craquelins ou des galettes de riz':'Quelque chose de sucré'} ${food('protein')?'par-dessus un repas':'sur un estomac autrement vide'} : la glycémie monte en flèche, l’insuline surcompense, et une à trois heures plus tard tu atterris plus bas que ton point de départ. ${feel('sugar')?'Tremblant et affamé après, c’est la forme classique.':''}${feel('sleepy')?' Les paupières lourdes après un dîner de féculents, c’est la même courbe.':''} Ce n’est pas les chips — c’est les chips tout seuls.`),
      move:['Tomorrow: same food if you want it, but never alone — protein or fat with it, and not as the whole meal. Cheese and crackers beats crackers.','Demain : la même chose si tu la veux, mais jamais seule — des protéines ou du gras avec, et pas comme repas complet. Fromage et craquelins bat craquelins.'],
      test:['Three days: keep the carb, add the protein beside it. If the 2 p.m. drop softens, that points to it.','Trois jours : garde le féculent, ajoute la protéine à côté. Si la baisse de 14 h s’adoucit, ça pointe vers ça.'],
      fp:['A sugar crash keeps a clock — one to three hours after the carb — and has a hunger edge. A histamine crash has a hot face and a headache instead.','Un crash de sucre a une horloge — une à trois heures après le féculent — et un bord de faim. Un crash d’histamine a plutôt le visage chaud et le mal de tête.']},
    hist:{t:['The histamine bucket','Le seau d’histamine'],
      why:()=>L(`${food('hist')?'Aged cheese, cured meat, canned fish, leftovers':(histOnDay()>=2&&!(wineProfile&&alc&&alc!=='0'))?'What you logged earlier that day':'Red wine'}${wineProfile&&alc&&alc!=='0'&&food('hist')?' plus the wine':''} — all of it pours into the same ${T('histamine')} bucket, and when it overflows you get ${feel('hist')?'exactly what you ticked — hot face, stuffy nose, itch or gut cramps —':'a headache, a hot face, a stuffy nose,'} and a flat crash one to four hours later that food doesn’t fix. The evidence here is “likely”, not proven — but it’s the pattern that fits ${feel('hist')?'best':food('hist')?'the food you named':'what you logged'}.${histOnDay()>=2?` That day’s food log has ${histOnDay()} high-histamine servings — the bucket fills across the whole day, not just the last four hours.`:''}`, `${food('hist')?'Fromage vieilli, charcuterie, poisson en canne, restants':(histOnDay()>=2&&!(wineProfile&&alc&&alc!=='0'))?'Ce que tu as noté plus tôt ce jour-là':'Le vin rouge'}${wineProfile&&alc&&alc!=='0'&&food('hist')?' plus le vin':''} — tout ça se verse dans le même seau d’${T('histamine')}, et quand il déborde tu as ${feel('hist')?'exactement ce que tu as coché — visage chaud, nez bouché, démangeaisons ou crampes —':'un mal de tête, le visage chaud, le nez bouché,'} et un crash à plat une à quatre heures plus tard que la bouffe ne règle pas. Les preuves ici sont « probables », pas établies — mais c’est l’explication qui colle ${feel('hist')?'le mieux':food('hist')?'à ce que tu as nommé':'à ce que tu as noté'}.${histOnDay()>=2?` Le journal de cette journée compte ${histOnDay()} portions riches en histamine — le seau se remplit toute la journée, pas seulement dans les quatre dernières heures.`:''}`),
      move:['Tomorrow: fresh over aged, cooked-today over leftovers, and one histamine food in the day, not three. Fresh meat, eggs, rice, potatoes are safe ground.','Demain : frais plutôt que vieilli, cuit aujourd’hui plutôt que restants, et un seul aliment riche en histamine dans la journée, pas trois. Viande fraîche, œufs, riz, patates, c’est du terrain sûr.'],
      test:['A week without the top three — aged cheese, cured meat, canned fish. Then add one back for a day and watch. It’s the only practical test for this one.','Une semaine sans les trois principaux — fromage vieilli, charcuterie, poisson en canne. Puis remets-en un pour une journée et observe. C’est le seul test qui existe pour celui-là.'],
      fp:['Histamine shows on the skin and in the nose before it shows in your energy. If the next crash has no hot face and no headache, it probably isn’t this.','L’histamine se montre sur la peau et dans le nez avant de se montrer dans ton énergie. Si le prochain crash n’a ni visage chaud ni mal de tête, ce n’est probablement pas ça.']},
    stim:{t:['The stimulant leaving','Le stimulant qui lâche'],
      why:()=>{
        if(stim==='skip') return L(`You skipped it or ran out. The crash is the missing dose — ${T('stimwear','the drop')}, plus everything the pill was holding up. That’s not food and it’s not willpower; it’s a prescriber or pharmacist conversation about the gap, especially if “ran out” happens more than once.`, `Tu l’as sauté ou tu n’en avais plus. Le crash, c’est la dose manquante — ${T('stimwear','la chute','la chute')}, plus tout ce que la pilule tenait debout. Ce n’est ni la bouffe ni la volonté; c’est une conversation avec le prescripteur ou le pharmacien sur le trou, surtout si « plus de pilules » arrive plus d’une fois.`);
        if(stim==='more') return L(`More than usual, then a wall. ${T('stimwear','The higher the dose, the harder the drop')} — and a bigger dose erases appetite harder, so the wall lands on an emptier tank. Tell the prescriber the dose you actually took; they can’t fix a number they don’t have.`, `Plus que d’habitude, puis un mur. ${T('stimwear','Plus la dose est haute, plus la chute est dure','Plus la dose est haute, plus la chute est dure')} — et une plus grosse dose efface l’appétit plus fort, alors le mur tombe sur un réservoir plus vide. Dis au prescripteur la dose que tu as vraiment prise; il ne peut pas corriger un chiffre qu’il n’a pas.`);
        if(stim==='late') return L(`Taken late: today’s crash probably isn’t the pill, but tonight’s sleep is already shorter — ${T('stimwear','the label says six hours before bed')}, minimum. Expect tomorrow to be the real crash.`, `Pris tard : le crash d’aujourd’hui n’est probablement pas la pilule, mais le sommeil de ce soir est déjà plus court — ${T('stimwear','la monographie dit six heures avant le coucher','la monographie dit six heures avant le coucher')}, minimum. Attends-toi à ce que demain soit le vrai crash.`);
        return L(`Taken early, and the wall came ${when==='mid'?'four to seven hours later — the short-acting window':'eight hours or more later — the long-acting window'}. ${T('stimwear','That’s the pill leaving')}, and it left you on ${food('nothing')?'an empty stomach, because it killed your appetite first':'whatever was underneath'}. If the wall comes at the same hour every day, that sentence — “it wears off at three” — is the most useful thing a prescriber can hear.`, `Pris tôt, et le mur est arrivé ${when==='mid'?'quatre à sept heures plus tard — la fenêtre à action courte':'huit heures ou plus plus tard — la fenêtre à action longue'}. ${T('stimwear','C’est la pilule qui lâche','C’est la pilule qui lâche')}, et elle t’a laissé sur ${food('nothing')?'un estomac vide, parce qu’elle a tué ton appétit avant':'ce qu’il y avait en dessous'}. Si le mur arrive à la même heure chaque jour, cette phrase-là — « ça lâche à 15 h » — est la chose la plus utile qu’un prescripteur peut entendre.`);
      },
      move:[`Tomorrow: eat before the pill — ${protShort()[0]} at the same time you take it — so the drop has a floor. Note the hour the wall hits.`,`Demain : mange avant la pilule — ${protShort()[1]} au moment où tu la prends — pour que la chute ait un plancher. Note l’heure où le mur arrive.`],
      test:['Three days, write down the hour it hits. Same hour each day = the pill’s clock; bring that to the prescriber. Different hours = look at food and sleep.','Trois jours, note l’heure où ça frappe. Même heure chaque jour = l’horloge de la pilule; apporte ça au prescripteur. Heures différentes = regarde la bouffe et le sommeil.'],
      fp:['A wear-off crash is flat and irritable more than hungry, and it keeps time. A sugar crash is shaky and lifts with food.','Un crash de fin d’effet est à plat et irritable plus qu’affamé, et il est ponctuel. Un crash de sucre est tremblant et passe avec la bouffe.']},
    caf:{t:['Caffeine — too much, too late, or the drop','Caféine — trop, trop tard, ou la chute'],
      why:()=>{
        if(caf==='0') return L(`You run on ${has('fuel','energy')&&!has('fuel','coffee')?'energy drinks':'coffee'} most days and had none. ${feel('headache')?'The headache is the tell: ':''}${T('cafclock','that’s withdrawal')} — fog and a headache that lift the moment you drink one. It feels like “I need coffee” because, right now, your brain is wired to expect it. Not a food problem; a schedule problem.`, `Tu roules ${has('fuel','energy')&&!has('fuel','coffee')?'aux boissons énergisantes':'au café'} presque tous les jours et tu n’en as pas pris. ${feel('headache')?'Le mal de tête, c’est le signe : ':''}${T('cafclock','c’est du sevrage','c’est du sevrage')} — brouillard et mal de tête qui partent dès que tu en bois un. Ça ressemble à « j’ai besoin de café » parce que, en ce moment, ton cerveau est câblé pour l’attendre. Pas un problème de bouffe; un problème d’horaire.`);
        if(caf==='high') return L(`More than four coffees’ worth. ${T('cafclock','Tolerance hides the jitters, not the sleep debt')}: half of a 2 p.m. can is still in you at 7, a quarter at midnight, and that steals the deep sleep you crash from the next day. ${feel('racing')?'A racing heart on that much is the dose talking. ':''}${cafl==='eve'?'Last one late — tonight is already shorter.':''}`, `Plus que l’équivalent de quatre cafés. ${T('cafclock','La tolérance cache les tremblements, pas la dette de sommeil','La tolérance cache les tremblements, pas la dette de sommeil')} : la moitié d’une canette de 14 h est encore en toi à 19 h, le quart à minuit, et ça vole le sommeil profond qui te fait crasher le lendemain. ${feel('racing')?'Le cœur qui s’emballe avec autant, c’est la dose qui parle. ':''}${cafl==='eve'?'La dernière tard — ce soir est déjà plus court.':''}`);
        return L(`Last caffeine late in the day. ${T('cafclock','Half of it is still working five hours later')}; it isn’t today’s crash so much as tomorrow’s, already booked.`, `La dernière caféine tard dans la journée. ${T('cafclock','La moitié agit encore cinq heures plus tard','La moitié agit encore cinq heures plus tard')}; ce n’est pas tant le crash d’aujourd’hui que celui de demain, déjà réservé.`);
      },
      move:['Tomorrow: same total if you want it, all of it earlier. Last one eight hours before bed. Don’t cut — move.','Demain : même total si tu le veux, tout plus tôt. Le dernier huit heures avant le coucher. Ne coupe pas — déplace.'],
      test:['Three days: move the last one two hours earlier, change nothing else. Judge it by the morning, not the afternoon.','Trois jours : avance le dernier de deux heures, ne change rien d’autre. Juge-le au matin, pas à l’après-midi.'],
      fp:['A caffeine drop is a headache behind the eyes with no hunger. Too much shows as a pounding heart and a bad night, not a daytime crash.','Une chute de caféine, c’est un mal de tête derrière les yeux sans faim. Trop de caféine se montre par un cœur qui cogne et une mauvaise nuit, pas par un crash de jour.']},
    alc:{t:['Last night’s drinks','Les verres d’hier soir'],
      why:()=>L(`${alc==='mid'?'Three to five':'A couple of'} drinks${alcl==='late'?', the last one within three hours of bed':alcl==='cont'?', and no real stop':''}. Alcohol near bed puts you under fast and then breaks the second half of the night into pieces — the sleep you got wasn’t the sleep you needed. ${feel('headache')?'The headache is dehydration and the drop, ':'The flat, foggy day is the bill, '}and it arrives whether or not you felt drunk.${wineProfile?' Red wine adds a '+T('histamine')+' load on top.':''}`, `${alc==='mid'?'Trois à cinq':'Un ou deux'} verres${alcl==='late'?', le dernier dans les trois heures avant le coucher':alcl==='cont'?', et pas de vrai arrêt':''}. L’alcool proche du lit t’assomme vite, puis casse la deuxième moitié de la nuit en morceaux — le sommeil que tu as eu n’était pas celui dont tu avais besoin. ${feel('headache')?'Le mal de tête, c’est la déshydratation et la chute, ':'La journée à plat, dans la brume, c’est la facture, '}et la facture rentre, que tu te sois senti chaud ou pas.${wineProfile?' Le vin rouge ajoute une dose d’'+T('histamine')+' par-dessus.':''}`),
      move:SF.noAlcoholTune?['Pregnant or under 18: there’s no amount of alcohol to fine-tune, so this isn’t a timing tweak. Talk it through with your doctor or the 811 nurse line.','Enceinte ou moins de 18 ans : il n’y a pas de quantité d’alcool à ajuster, alors ce n’est pas une question d’heure. Parles-en à ton médecin ou à la ligne 811.']:SF.shaky?['Tomorrow: don’t stop suddenly on your own — shaky or sweaty when you skip is withdrawal, and stopping cold can be dangerous. Same number if you need it, last one three hours before bed, and call your doctor or pharmacist this week.','Demain : n’arrête pas d’un coup par toi-même — trembler ou suer quand tu sautes un verre, c’est du sevrage, et arrêter net peut être dangereux. Le même nombre si tu en as besoin, le dernier trois heures avant le coucher, et appelle ton médecin ou ton pharmacien cette semaine.']:has('meds','sedative')?['Tomorrow: not on a pill night — that’s the red card, and it comes first. On a night without the pill, same number if you want it, last one three hours before bed, water beside it.','Demain : pas un soir de pilule — c’est la carte rouge, et elle passe en premier. Un soir sans la pilule, le même nombre si tu le veux, le dernier trois heures avant le coucher, de l’eau à côté.']:['Tomorrow: same number if you want it, but the last one three hours before bed, with water beside it. The count matters less than the clock.','Demain : le même nombre si tu le veux, mais le dernier trois heures avant le coucher, avec de l’eau à côté. Le nombre compte moins que l’heure.'],
      test:SF.noAlcoholTune?['No home test for this one.','Pas de test à faire seul pour celle-là.']:has('meds','sedative')?['Three nights without the pill-and-drink overlap, last drink three hours before bed. If the mornings change, that points to it.','Trois soirs sans le chevauchement pilule-verre, dernier verre trois heures avant le coucher. Si les matins changent, ça pointe vers ça.']:['Three nights: same drinks, last one three hours earlier. If the mornings change, that points to it.','Trois soirs : mêmes verres, le dernier trois heures plus tôt. Si les matins changent, ça pointe vers ça.'],
      fp:['A drink crash is a morning that never quite starts and a 3 p.m. wall, with a dry mouth. It doesn’t lift with food.','Un crash d’alcool, c’est un matin qui ne démarre jamais vraiment et un mur à 15 h, avec la bouche sèche. Ça ne passe pas avec la bouffe.']},
    sedhang:{t:['The pill’s morning after','Le lendemain de la pilule'],
      why:()=>L(`A sleeping or anxiety pill, and the crash hit in your first hours up. ${T('sedhang','That’s the pill still working')} — Health Canada cut the zopiclone dose over exactly this, and says the fog can be there even when you feel awake.${alc&&alc!=='0'?' Alcohol the same night makes it heavier — and that combination is the red card above.':''} Not food. Not weakness. Dose and timing, which is a pharmacist conversation.`, `Un somnifère ou une pilule pour l’anxiété, et le crash a frappé dans tes premières heures debout. ${T('sedhang','C’est la pilule qui agit encore','C’est la pilule qui agit encore')} — Santé Canada a baissé la dose de zopiclone exactement pour ça, et dit que le brouillard peut être là même quand tu te sens réveillé.${alc&&alc!=='0'?' L’alcool la même soirée l’alourdit — et cette combinaison, c’est la carte rouge plus haut.':''} Pas la bouffe. Pas un manque de volonté. La dose et l’heure, et ça, c’est une conversation avec le pharmacien.`),
      move:['Tomorrow: nothing to change on your own. Write down what time you took it and what time you had to be up, and bring that gap to the pharmacist this week.','Demain : rien à changer de ton côté. Note l’heure où tu l’as prise et l’heure où tu devais être debout, et apporte cet écart au pharmacien cette semaine.'],
      test:['There isn’t a safe self-test for this one — don’t move the dose yourself. The pharmacist does the adjusting.','Il n’y a pas de test sécuritaire à faire seul ici — ne déplace pas la dose toi-même. C’est le pharmacien qui ajuste.'],
      fp:['A pill morning is heavy and slow from the first minute and lifts by late morning. If the crash starts later in the day, it isn’t this.','Un lendemain de pilule est lourd et lent dès la première minute et passe vers la fin de l’avant-midi. Si le crash commence plus tard dans la journée, ce n’est pas ça.']},
    sleep:{t:['A short night','Une nuit courte'],
      why:()=>L(`Four to six hours. Not the override — but it lowers the floor, so everything else on this list hits harder than it would have. ${T('sleepq','Protect the hours you have')}: caffeine done eight hours before bed, no drink inside three.`, `Quatre à six heures. Pas de quoi tout expliquer — mais ça baisse le plancher, alors tout le reste sur cette liste frappe plus fort qu’il l’aurait fait. ${T('sleepq','Protège les heures que tu as','Protège les heures que tu as')} : caféine finie huit heures avant le coucher, pas de verre dans les trois heures.`),
      move:['Tonight: the hours you have, protected — caffeine done eight hours before, no drink inside three, screen off. Same bedtime as last night; just cleaner.','Ce soir : les heures que tu as, protégées — caféine finie huit heures avant, pas de verre dans les trois heures, écran fermé. Même heure de coucher qu’hier; juste plus propre.'],
      test:['Three nights of the same hours, cleaner. If you wake up different on the same six hours, the hours weren’t the problem — what was in them was.','Trois nuits des mêmes heures, plus propres. Si tu te réveilles différent sur les mêmes six heures, le problème n’était pas les heures — c’était ce qu’il y avait dedans.'],
      fp:['Short-sleep crashes are heavy-lidded and come in waves, worst mid-afternoon. They don’t care what you ate.','Un crash de nuit courte a les paupières lourdes et vient par vagues, pire en milieu d’après-midi. Il se fiche de ce que tu as mangé.']},
    heat:{t:['Salt and water','Sel et eau'],
      why:()=>L(`Hot, sweating, not much water. Sweat is salt leaving, and ${feel('headache')?'the headache, ':''}${feel('racing')?'the racing heart, ':''}the flat drop are what low salt and low water feel like. ${noSaltC?'Water is the fix for you — salt is off your card for the reasons on your patch.':T('salt','A quarter teaspoon of salt in a big glass of water')+' fixes it in twenty minutes if this is it.'}`, `Chaud, en sueur, pas beaucoup d’eau. La sueur, c’est du sel qui part, et ${feel('headache')?'le mal de tête, ':''}${feel('racing')?'le cœur qui s’emballe, ':''}la chute à plat, c’est ça que ça fait de manquer de sel et d’eau. ${noSaltC?'Pour toi, la solution, c’est l’eau — le sel n’est pas sur ta carte, pour les raisons écrites sur ta patch.':T('salt','Un quart de cuillère à thé de sel dans un grand verre d’eau','Un quart de cuillère à thé de sel dans un grand verre d’eau')+' règle ça en vingt minutes si c’est ça.'}`),

function buildCrash(){
  const c=S.c; const sc={}; const add=(k,n)=>{sc[k]=(sc[k]||0)+n;};
  const feel=v=>hc('cfeel',v), food=v=>hc('cfood',v), diff=v=>hc('cdiff',v);
  const when=c.cwhen, sleep=c.cwhen==='night'?'none':c.csleep, caf=c.ccaf, cafl=c.ccafl, alc=c.calc, alcl=c.calcl, stim=c.cstim;
  const profile=Object.keys(S.a).length>0; const cafProfile=any('fuel','coffee','energy'); const wineProfile=has('fuel','wine'); const sedative=has('meds','sedative');
  const R={danger:false, hard:null, night:false, top:null, second:null, conf:'unclear', tie:false, combo:false, manyDiff:false, also:[], sc, profile, mech:MECH()};
  if(feel('danger')){ R.danger=true; return R; }
  if(sedative && alc && alc!=='0') R.hard = L(`<b>Before anything about the crash: a drink and ${T('sedative','a sleeping or anxiety pill')} on the same night can stop your breathing.</b> That is the label talking, not us. Tonight they don’t share a night. If you can’t picture an evening without both, that sentence goes to the pharmacist this week.`, `<b>Avant toute lecture du crash : un verre et ${T('sedative','un somnifère ou une pilule pour l’anxiété','un somnifère ou une pilule pour l’anxiété')} la même soirée peuvent arrêter ta respiration.</b> C’est la monographie qui parle, pas nous. Ce soir, ils ne partagent pas une soirée. Si tu n’arrives pas à imaginer une soirée sans les deux, cette phrase-là va au pharmacien cette semaine.`);
  /* scores */
  const carb=food('refined')||food('sweet'); const stimTaken=stim&&stim!=='none'&&stim!=='skip';
  if(food('nothing')) add('gap',3);
  if(stimTaken && food('nothing')) add('gap',1);
  if(feel('sugar') && !food('protein')) add('gap',2);
  if(!food('nothing') && !food('protein') && any('morning','nothing','coffee') && (when==='mid'||when==='late')) add('gap',1);
  if(carb) add('sugar',2);
  if(carb && feel('sugar')) add('sugar',2);
  if(carb && feel('sleepy') && (when==='mid'||when==='late')) add('sugar',1);
  if(carb && food('protein')) add('sugar',-1);
  const hDay=histOnDay(); if(hDay>=3) add('hist',2); else if(hDay>=2) add('hist',1);
  if(food('hist')) add('hist',2);
  if(feel('hist')) add('hist',2);
  if(food('hist') && feel('headache')) add('hist',1);
  if(wineProfile && alc && alc!=='0') add('hist',1);
  if(food('big')) add('meal',2); if(food('big')&&feel('sleepy')) add('meal',1);
  if(food('sweetener')) add('sweet',1); if(food('sweetener')&&feel('hist')) add('sweet',2);
  if(stim==='am' && (when==='mid'||when==='late')) add('stim',2);
  if(stim==='am' && (when==='mid'||when==='late') && (feel('flat')||feel('mood'))) add('stim',1);
  if(stim==='late') add('stim',1);
  if(stim==='skip') add('stim',4);
  if(stim==='more') add('stim',3);
  if(caf==='high') add('caf',2);
  if(caf==='high' && feel('racing')) add('caf',1);
  if(caf==='0' && cafProfile) add('caf',3);
  if(caf==='0' && cafProfile && feel('headache')) add('caf',1);
  if(cafl==='eve') add('caf',1);
  if(alc==='low' && alcl==='late') add('alc',1);
  if(alc==='mid') add('alc',2);
  if((alcl==='late'||alcl==='cont') && alc!=='high') add('alc',2);
  if(alc&&alc!=='0'&&alc!=='high'&&feel('headache')) add('alc',1);
  if(sedative && when==='early' && (feel('flat')||feel('sleepy')||feel('headache'))) add('sedhang',3);
  if(sedative && alc && alc!=='0' && when==='early') add('sedhang',1);
  if(sleep==='4to6') add('sleep',2);
  if(sleep==='4to6' && feel('sleepy')) add('sleep',1);
  if(diff('heat')) add('heat',2); if(diff('heat')&&(feel('headache')||feel('flat')||feel('racing'))) add('heat',1);
  const dayItems=['travel','stress','long','sick','period'].filter(diff); dayItems.forEach(()=>add('day',2)); if(diff('newfood')) add('day',1);
  /* ties: the cause whose own fingerprint (how the crash felt) matches wins; only a true tie stays "can't tell" */
  const FP={sleep:['sleepy'],meal:['sleepy'],sugar:['sugar'],gap:['sugar'],hist:['hist','headache'],caf:['racing','headache'],alc:['headache'],stim:['flat','mood'],sedhang:['flat','sleepy'],heat:['headache','flat']};
  const fp=k=>(FP[k]||[]).some(feel)?1:0;
  const order=Object.entries(sc).filter(([k,v])=>v>0).sort((a,b)=>(b[1]-a[1])||(fp(b[0])-fp(a[0])));
  R.night = sleep==='lt4'||sleep==='none'||alc==='high';
  if(R.night){ R.top='night'; R.conf='likely'; R.also=order.filter(([k])=>k!=='sleep'&&k!=='alc').slice(0,3).map(([k])=>k); return R; }
  if(!order.length){ return R; }
  const [k1,s1]=order[0]; const [k2,s2]=order[1]||[null,0];
  R.top=k1; R.second=k2;
  if(k2 && s1===s2 && s1>=2 && fp(k1)===fp(k2)){ R.tie=true; R.conf='unclear'; }
  else if(k2 && s1===s2 && s1>=2){ R.conf='possible'; }
  else if(s1>=4 && s1-s2>=2) R.conf='likely';
  else if(s1>=3) R.conf='possible';
  else R.conf='unclear';
  R.combo = !!k2 && ((k1==='gap'&&k2==='stim')||(k1==='stim'&&k2==='gap'));
  if(k1==='day' && dayItems.length>=2){ R.manyDiff=true; R.conf='unclear'; }
  R.also=order.slice(R.tie?2:1).filter(([k,v])=>v>=2).slice(0,3).map(([k])=>k);
  return R;
}
function confLabel(R){
  if(!R.top) return L('No clear cause from this day','Pas de cause claire pour cette journée');
  if(R.tie) return L('Can’t tell — two things changed at once','Impossible à trancher — deux choses ont changé en même temps');
  if(R.manyDiff) return L('Too many things changed at once','Trop de choses ont changé en même temps');
  return {likely:L('The biggest thing that changed today','Le plus gros changement d’aujourd’hui'), possible:L('Likely contributor','Contributeur probable'), unclear:L('A guess, not a read','Une hypothèse, pas une lecture')}[R.conf];
}
/* the floor: what the tank says has been running low underneath (today's log if there is one, else the normal day). Triggers hit harder on a low floor. */
function crashFloor(){
  if(typeof tankReady!=='function' || !tankReady()) return null;
  const k=(S.c&&S.c._day)||dayKey(); const tm=tlog()[k]; const useDay=!!(tm&&mapCount(tm)>0&&isClosed(k)); const map=useDay?tm:S.tank.day; if(!mapCount(map)) return null;
  const R=buildTank({map}); return {low:R.low, today:useDay, partial:partialDay(k)};
}
function floorLine(F){
  const lc=s=>s.toLowerCase().replace(/vitamin(e)? ([a-z])/g,(m,e,x)=>'vitamin'+(e||'')+' '+x.toUpperCase()).replace(/\bb(1|12)\b/g,'B$1');
  if(!F) return L('Crashes rarely have one cause. This is the biggest thing that changed today; what’s been running low underneath sets how hard it hits. Fill the tank (one normal day) to see that part.','Un crash a rarement une seule cause. Ceci est le plus gros changement d’aujourd’hui; ce qui manque en dessous décide à quel point ça frappe. Remplis le réservoir (une journée normale) pour voir cette partie-là.');
  if(!F.low.length) return L(`Crashes rarely have one cause — but your tank (${F.today?'today’s log':'your normal day'}) shows nothing running low, so today’s change carries more of this one.`,`Un crash a rarement une seule cause — mais ton réservoir (${F.today?'ta journée notée':'ta journée normale'}) ne montre rien de bas, alors le changement d’aujourd’hui pèse plus lourd cette fois.`);
  const names=F.low.slice(0,5).map(r=>lc(P2(r.l))).join(', ');
  return L(`Crashes rarely have one cause. Underneath the trigger, ${F.today?'that day’s food log':'your normal day'} comes in low on ${names}${F.low.length>5?' and more':''}${F.partial?' (that day’s log isn’t marked complete, so this uses your normal day)':''}. A low floor can be part of why an ordinary day knocks you flat — the trigger is the push, the floor is how far you fall. Both count.`,`Un crash a rarement une seule cause. Sous le déclencheur, ${F.today?'le journal alimentaire de cette journée':'ta journée normale'} est bas en ${names}${F.low.length>5?' et plus':''}${F.partial?' (le journal de cette journée n’est pas marqué complet, alors ça utilise ta journée normale)':''}. Un plancher bas peut expliquer en partie pourquoi une journée ordinaire te met à terre — le déclencheur, c’est la poussée; le plancher, c’est jusqu’où tu tombes. Les deux comptent.`);
}
const CONF={likely:['Likely','Probable'],possible:['Possible','Possible'],unclear:['Unclear','Incertain']};
function crashAnswersPlain(){

  one('cwhen',L('WHEN','QUAND')); one('cfeel',L('FELT LIKE','RESSENTI')); if(c.cwhen!=='night') one('csleep',L('NIGHT BEFORE','NUIT D’AVANT')); else o.push(L('NIGHT BEFORE','NUIT D’AVANT')+L(': ',' : ')+L('none — up all night','aucune — debout toute la nuit'));

function crashText(){

  t+=L('THE TEST','LE TEST')+L(': ',' : ')+P2(top.test)+'\n';

function crashPattern(){
  const n=S.crashes.length; if(n<3) return null;
  const M=MECH(); const cnt={}; const whenCnt={};
  for(const x of S.crashes){ if(x.top&&M[x.top]){ cnt[x.top]=(cnt[x.top]||0)+1; } if(x.when){ whenCnt[x.when]=(whenCnt[x.when]||0)+1; } }
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]; const w=Object.entries(whenCnt).sort((a,b)=>b[1]-a[1])[0];
  const out=[];
  if(top && top[1]>=2 && top[1]/n>=0.5) out.push(L(`<b>${top[1]} of your last ${n} crashes read as “${P2(M[top[0]].t)}”.</b> That’s a recurring association — yours, not the population’s. It doesn’t prove the mechanism; it’s enough to run that move for a week instead of a day and see.`, `<b>${top[1]} de tes ${n} derniers crashs se lisent comme « ${P2(M[top[0]].t)} ».</b> C’est une association qui revient — la tienne, pas celle de la population. Ça ne prouve pas le mécanisme; c’est assez pour faire ce geste-là une semaine au lieu d’une journée, et voir.`));
  if(w && w[1]>=3 && w[0]!=='all' && w[0]!=='night') out.push(L(`<b>Same time of day, ${w[1]} times.</b> That’s a clock, and clocks have owners — the pill, the coffee, the lunch. Look at what happens at the same hour each day.`, `<b>Même moment de la journée, ${w[1]} fois.</b> C’est une horloge, et les horloges ont des propriétaires — la pilule, le café, le dîner. Regarde ce qui arrive à la même heure chaque jour.`));
  if((whenCnt.all||0)>=2 || (n>=4 && (top&&top[1]>=3))) out.push(L(`<b>If it’s most days, it may be your baseline rather than a crash.</b> That’s what the weekly card and the ferritin number are for.`, `<b>Si c’est presque tous les jours, c’est peut-être ta ligne de base plutôt qu’un crash.</b> C’est à ça que servent la carte de la semaine et le chiffre de ferritine.`));
  return out.length?out:[L(`<b>${n} logged, no single pattern yet.</b> Different causes on different days is a real answer too — it means the one move changes with the day.`, `<b>${n} au journal, pas encore de tendance claire.</b> Des causes différentes selon les journées, c’est aussi une vraie réponse — ça veut dire que le geste change avec la journée.`)];
}

const EDIDS=TF.filter(f=>f.grp==='energy').map(f=>f.id);

/* backups: inside Claude the page can't download directly — it asks the platform (the viewer confirms). Opened as a plain file, a normal download works. Last resort: copy the text. */
async function backupData(){
  const data=JSON.stringify({app:'the-patch',ver:VER,saved:new Date().toISOString(),state:S});
  const filename='the-patch-backup-'+new Date().toISOString().slice(0,10)+'.json';

    catch(e){ if(e&&e.code==='declined'){ toast(L('Not saved','Pas enregistré')); return; } if(e&&e.code==='rate_limited'){ toast(L('Try again in a moment','Réessaie dans un instant')); return; } } }
  /* Outside Claude, a direct file download can crash some in-app browsers (Acode hands blob: links to Android's DownloadManager, which only takes http/https). So ask first: copy is the safe default, the file is opt-in. */
  if(!window.claude){ showSheet(`<div class="handle"></div><h3 id="sheetTitle">${L('Save a backup','Faire une sauvegarde')}</h3><p class="small">${L('Copy the backup and paste it into a note or an email to yourself. To restore, paste it back under “Restore from a backup”.','Copie la sauvegarde et colle-la dans une note ou un courriel à toi-même. Pour restaurer, colle-la dans « Restaurer une sauvegarde ».')}</p><div class="row"><button class="btn primary sm" id="bkCopy">${L('Copy the backup','Copier la sauvegarde')}</button><button class="btn ghost sm" id="bkFile">${L('Download a file','Télécharger un fichier')}</button></div><p class="small muted" style="margin:8px 0 0">${L('Some apps can’t handle file downloads and may close — code editors like Acode, for one. Copying always works.','Certaines apps ne gèrent pas les téléchargements et peuvent se fermer — les éditeurs de code comme Acode, entre autres. Copier marche toujours.')}</p>`, null);
    document.getElementById('bkCopy').onclick=async()=>{ let ok=false; try{ await navigator.clipboard.writeText(data); ok=true; }catch(_){ try{ const t=document.createElement('textarea'); t.value=data; document.body.appendChild(t); t.select(); ok=document.execCommand('copy'); t.remove(); }catch(__){} } closeSheet(true); toast(ok?L('Backup copied — paste it into a note','Sauvegarde copiée — colle-la dans une note'):L('Couldn’t copy','Impossible de copier')); };
    document.getElementById('bkFile').onclick=()=>{ try{ const blob=new Blob([data],{type:'application/json'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); },500); closeSheet(true); toast(L('Backup saved to your downloads','Sauvegarde enregistrée dans tes téléchargements')); }catch(_){ toast(L('Download failed — use Copy','Le téléchargement a échoué — utilise Copier')); } };
    return; }
  try{ await navigator.clipboard.writeText(data); toast(L('Couldn’t save a file — the backup is copied; paste it into a note','Impossible d’enregistrer un fichier — la sauvegarde est copiée; colle-la dans une note')); }catch(_){ toast(L('Backup failed','La sauvegarde a échoué')); }
}
function openRestore(){

function readBackup(file){ const r=new FileReader(); r.onload=()=>parseBackup(r.result); r.readAsText(file); }
function parseBackup(text){
  { let o; try{ o=JSON.parse(text); }catch(e){ toast(L('That file isn’t a Patch backup','Ce fichier n’est pas une sauvegarde de la Patch')); return; }
    if(!o||o.app!=='the-patch'||!o.state||typeof o.state!=='object'){ toast(L('That file isn’t a Patch backup','Ce fichier n’est pas une sauvegarde de la Patch')); return; }

  }

function eraseAll(){ const l=S.lang, ack=S.ack; try{ localStorage.removeItem(KEY); localStorage.removeItem('patch'); }catch(e){} S={a:{},step:0,started:null,checkins:[],lang:l,done:false,ack,mode:'home',c:{},cstep:0,crashes:[],intent:null,madeAt:null,tank:{p:{},day:{},log:{},rate:{},closed:{},closedMig:true,roll:4,view:'normal'},tstep:0}; save(); render(); toast(L('Erased','Effacé')); }
/* tappable terms: real buttons for keyboard and screen readers, not bare spans */
/* v1.2.22: underline each glossary word once per screen — its first appearance; later mentions are plain text */
function onceTerms(root){ const seen=new Set(); const all=[...root.querySelectorAll('.t[data-t]')];

  const folded=el=>{ const d=el.closest('details:not([open])'); return !!d && !(el.closest('summary') && el.closest('summary').parentElement===d); };
  [...all.filter(e=>!folded(e)),...all.filter(folded)].forEach(el=>{ const k=el.dataset.t; if(seen.has(k)) el.replaceWith(document.createTextNode(el.textContent)); else seen.add(k); }); }
function wireTerms(root){
