  : SF.veg?['Eggs, tofu or a bowl of lentils','Des œufs, du tofu ou un bol de lentilles']:['Three eggs, plain meat or fish from the freezer','Trois œufs, de la viande nature ou du poisson congelé']; }
/* drinking: asked, not inferred. 'd3' most days 3+, 'd12' most days 1–2, 'wk' a few days a week, 'we' weekends or less */
function drinkInfo(){ const any_=any('fuel','beer','wine','spirits'); const f=any_?(S.a&&S.a.drinkfreq):null; return {freq:f||null, daily:f==='d3'||f==='d12', heavy:f==='d3', unknown:any_&&!f, shaky:has('flags','shaky')}; }
/* ===================== v1.2.43 (7 Nov 2026): GOALS FIRST =====================
   Tobie: ask what people want — several goals allowed — and what they'd cut back on for it, instead of what they can't do
   without. The keep question promised "untouched, maybe not ever", and since v1.2.41 the path names a kept drink anyway when the
   person's own numbers point at it. Asking for reasons to stay the same is also the talk that predicts not changing
   (motivational-interviewing meta-analyses: Magill 2014, Pace 2017, Magill 2018). Goals give each step its reason and break
   ties between suspects of about the same strength; they never hide one.
   Weight loss (Tobie's rules): it only works if you're not hungry (a binge undoes the week), daily needs stay met, the food is
   picked to keep you full. Two roads — mostly meat, eggs, cheese and fish / whole food — a 3-week clean start without the
   measured histamine and lactose foods, then one group back a week; "hungry between meals?" in the check-in; an optional number
   for the month, steered by a weekly weigh-in. Rails: under 18, pregnancy, an eating-disorder history; no low-carb road while
   breastfeeding or in the year after a baby, with kidney disease, or on insulin or a diabetes pill other than metformin. */
const GOALS=[
  {id:'energy', l:['More energy, fewer crashes','Plus d’énergie, moins de crashs'], t:['energy','énergie']},
  {id:'sleep', l:['Sleep better','Mieux dormir'], t:['sleep','sommeil']},
  {id:'weight', l:['Lose weight','Perdre du poids'], t:['weight','poids']},
  {id:'muscle', l:['Build muscle','Prendre du muscle'], t:['muscle','muscle']},
  {id:'stress', l:['Less stress','Moins de stress'], t:['stress','stress']},
  {id:'gut', l:['A calmer gut','Un ventre plus calme'], t:['gut','ventre']}
];
/* which goals cutting back on each thing serves — only the person's own goals are shown */
const CUTG={coffee:['sleep','energy','stress','gut'], energy:['sleep','energy','stress'], sugar:['weight','energy'], beer:['sleep','weight','muscle','energy','stress','gut'], wine:['sleep','weight','muscle','energy','stress','gut'], spirits:['sleep','weight','muscle','energy','stress','gut'], smoke:['sleep','stress'], snacks:['weight','energy']};
const CUTX={snacks:['Chips, fast food, snack cakes','Chips, fast-food, gâteaux emballés']};
function myGoals(){ const g=S.a&&S.a.goals; return Array.isArray(g)?GOALS.map(x=>x.id).filter(id=>g.includes(id)):[]; }
function goalOn(id){ return myGoals().includes(id); }
function goalName(id){ const g=GOALS.find(x=>x.id===id); return g?P2(g.l):id; }
function goalTag(id){ const g=GOALS.find(x=>x.id===id); return g?P2(g.t):id; }
function cutLabel(v){ return P2(FUEL[v]||CUTX[v]||[v,v]); }
function cutHelps(v){ const g=myGoals(); return (CUTG[v]||[]).filter(x=>g.includes(x)); }
function cutOpts(){ const f=((S.a&&S.a.fuel)||[]).filter(x=>x!=='none'); const o=f.map(v=>({v,l:FUEL[v]||[v,v]})); if(goalOn('weight')||goalOn('energy')||has('cut','snacks')) o.push({v:'snacks',l:CUTX.snacks}); return o; }
function helpsTag(v){ const h=cutHelps(v); return h.length?[` <small>· helps: ${h.map(x=>GOALS.find(y=>y.id===x).t[0]).join(', ')}</small>`,` <small>· aide : ${h.map(x=>GOALS.find(y=>y.id===x).t[1]).join(', ')}</small>`]:['','']; }
function cutQOpts(){ const co=cutOpts(); if(!co.length) return [{l:['Nothing to cut — next','Rien à diminuer — suivant'],v:'none',none:true}];
  const o=co.map(x=>{ const t=helpsTag(x.v); return {l:[x.l[0]+t[0],x.l[1]+t[1]],v:x.v}; }); o.push({l:['Nothing for now','Rien pour l’instant'],v:'none',none:true}); return o; }
/* the keep list the rest of the app reads is what's left: everything in "What keeps you going?" that isn't cut back */
function syncKeep(){ const a=S.a; if(!a) return; const f=(a.fuel||[]).filter(x=>x!=='none');
  if(Array.isArray(a.cut)){ a.cut=a.cut.filter(x=>x==='none'||x==='snacks'||f.includes(x)); if(!a.cut.length) delete a.cut; }
  const c=Array.isArray(a.cut)?a.cut:[]; a.keep=f.filter(x=>!c.includes(x)); }
function goalFor(ids){ const g=myGoals().filter(x=>ids.includes(x)); return g.length?`<p class="small muted goalfor" style="margin:0 0 6px">${L('For your goals:','Pour tes objectifs :')} ${g.map(goalTag).join(' · ')}</p>`:''; }
/* the goals a suspect family stands in the way of, and the "What keeps you going?" items it is */
const FAMG={alcohol3:['sleep','weight','muscle','energy','stress','gut'], alcohol6:['sleep','weight','muscle','energy','stress','gut'], edrinks:['sleep','energy','stress'], sweets:['weight','energy','gut'], latecoffee:['sleep','energy'], cheese:['energy','gut'], cured:['energy','gut'], eggs:['energy','gut'], lactose:['gut'], fructose:['gut'], shakes:['gut','energy'], hist:['energy','gut']};
function famGoals(f){ return FAMG[f&&f.id]||['energy']; }
function famFuel(f){ const id=f&&f.id; return (id==='alcohol3'||id==='alcohol6')?['beer','wine','spirits']:id==='edrinks'?['energy']:id==='sweets'?['sugar']:id==='latecoffee'?['coffee']:[]; }
function famWilling(f){ const c=(S.a&&S.a.cut)||[]; return famFuel(f).some(x=>c.includes(x)); }
/* suspects in the path's order: real leads first, strongest first — and between two of about the same strength (within 0.1),
   the one the person said they'd cut back on goes first. "Stays for now" never moves anything down past a stronger suspect. */
function pathSus(){ const w=s=>s.score+(famWilling(s.f)?0.1:0); return suspects().map((s,i)=>({s,i})).sort((a,b)=>((a.s.kind==='daily')-(b.s.kind==='daily'))||(w(b.s)-w(a.s))||(a.i-b.i)).map(x=>x.s); }
function staysLine(f){ const fu=famFuel(f).filter(x=>has('fuel',x)); if(!fu.length) return ''; const c=(S.a&&S.a.cut)||[]; if(fu.some(x=>c.includes(x))||!Array.isArray(S.a.cut)) return '';
  const names=fu.map(x=>cutLabel(x).replace(/^./,ch=>ch.toLowerCase())); const w=[...new Set(fu.flatMap(cutHelps))];
  return `<p class="small" style="margin:0 0 6px">${L(`On your list, ${names.join(' and ')} “stays for now”. It’s still your strongest suspect${w.length?' — and it gets in the way of your goals: '+w.map(goalTag).join(', '):''}. Your call.`,`Dans ta liste, « ${names.join(' et ')} » reste pour l’instant. C’est quand même ton suspect le plus fort${w.length?' — et ça nuit à tes objectifs : '+w.map(goalTag).join(', '):''}. C’est toi qui décides.`)}</p>`; }

/* ---------- Home: the goals, one tap to change them (Tobie, 7 Nov) ---------- */
function goalCard(){ if(!S.done) return ''; const g=myGoals();
  return `<button type="button" class="card goalbar" data-goals><span class="eyebrow">${L('Your goals','Tes objectifs')}</span><span class="gbl">${g.length?g.map(x=>`<span class="gchip">${esc(goalName(x))}</span>`).join(''):`<span class="small">${L('What do you want out of this? Pick your goals →','Qu’est-ce que tu veux que ça change? Choisis tes objectifs →')}</span>`}</span>${g.length?`<span class="gch">${L('Change','Changer')}</span>`:''}</button>`; }
function goalSheetHTML(){ const g=myGoals(), co=cutOpts(), c=(S.a.cut||[]);
  return `<div class="handle"></div><h3 id="sheetTitle">${L('Your goals','Tes objectifs')}</h3><p class="small">${L('Pick as many as you want. The app uses them for the reasons it gives and for what comes first — never to hide a suspect.','Choisis-en autant que tu veux. L’app s’en sert pour les raisons qu’elle donne et pour l’ordre des étapes — jamais pour cacher un suspect.')} ${T('goalsq',L('Why goals','Pourquoi des objectifs'),L('Pourquoi des objectifs','Pourquoi des objectifs'))}</p>
  <div class="chips pickn">${GOALS.map(x=>`<button type="button" class="chip" data-gset="${x.id}" aria-pressed="${g.includes(x.id)}"><span>${P2(x.l)}</span></button>`).join('')}</div>
  ${co.length?`<h3 style="margin-top:16px">${L('What you’d cut back on','Ce que tu diminuerais')}</h3><p class="small">${L('Cut back, not quit. What you don’t pick stays for now.','Diminuer, pas arrêter. Ce que tu ne choisis pas reste pour l’instant.')}</p><div class="chips pickn">${co.map(o=>`<button type="button" class="chip" data-cset="${o.v}" aria-pressed="${c.includes(o.v)}"><span>${P2(o.l)}${P2(helpsTag(o.v))}</span></button>`).join('')}</div>`:''}
  <div class="row" style="margin-top:14px"><button type="button" class="btn" id="closeSheet">${L('Done','Terminé')}</button></div>`; }
function openGoals(opener){ showSheet(goalSheetHTML(), opener); wireGoals(); }
function refreshGoals(sel){ if(!sheet.classList.contains('on')) return; sheet.innerHTML=goalSheetHTML(); wireTerms(sheet); const c=document.getElementById('closeSheet'); if(c) c.onclick=closeSheet; wireGoals(); const el=sheet.querySelector(sel); if(el){ try{ el.focus({preventScroll:true}); }catch(e){} } }
function wireGoals(){
  sheet.querySelectorAll('[data-gset]').forEach(b=>{ b.onclick=()=>{ const v=b.dataset.gset; let a=myGoals(); a=a.includes(v)?a.filter(x=>x!==v):a.concat(v); S.a.goals=a.length?a:['none']; save(); render(true); refreshGoals(`[data-gset="${v}"]`); }; });
  sheet.querySelectorAll('[data-cset]').forEach(b=>{ b.onclick=()=>{ const v=b.dataset.cset; let a=(S.a.cut||[]).filter(x=>x!=='none'); a=a.includes(v)?a.filter(x=>x!==v):a.concat(v); S.a.cut=a.length?a:['none']; syncKeep(); save(); render(true); refreshGoals(`[data-cset="${v}"]`); }; }); }

/* ---------- the weekly plan: what each goal asks of you ---------- */
function goalsPlanCard(){ const g=myGoals(); if(!g.length) return ''; const SF=SAFE(); const kg=+((S.tank&&S.tank.p&&S.tank.p.wt)||70);
  const R={energy:L('<b>More energy:</b> your path, above — the basics, then blood work, then your strongest suspect, one at a time.','<b>Plus d’énergie :</b> ton chemin, plus haut — la base, puis la prise de sang, puis ton suspect le plus fort, un à la fois.'),
    sleep:L('<b>Sleep better:</b> caffeine done early in your day, the last drink 3 hours or more before bed — your check-in keeps count.','<b>Mieux dormir :</b> la caféine finie tôt dans ta journée, le dernier verre 3 heures ou plus avant le coucher — ton bilan tient le compte.'),
    weight:wlStop()?L('<b>Lose weight:</b> not here — the note above says why.','<b>Perdre du poids :</b> pas ici — la note plus haut dit pourquoi.'):L('<b>Lose weight:</b> your weight plan is above.','<b>Perdre du poids :</b> ton plan pour le poids est plus haut.'),
    muscle:SF.kidney?L('<b>Build muscle:</b> with kidney disease, extra protein and creatine are your doctor’s call. No drinks on training nights.','<b>Prendre du muscle :</b> avec une maladie des reins, plus de protéines et la créatine, c’est à ton médecin de décider. Pas d’alcool les soirs d’entraînement.')
      :L(`<b>Build muscle:</b> ${T('muscle','protein toward 1.6 g per kg a day')} — about ${Math.round(1.6*kg)} g for you, and the tank’s target is raised to match${(SF.minor||SF.preg||SF.bf)?'':'; creatine, 3–5 g a day'}; no drinks on training nights — a big night after training cuts muscle building by about a quarter, even with protein.`,`<b>Prendre du muscle :</b> ${T('muscle','des protéines vers 1,6 g par kg par jour','des protéines vers 1,6 g par kg par jour')} — environ ${Math.round(1.6*kg)} g pour toi, et la cible du réservoir monte en conséquence${(SF.minor||SF.preg||SF.bf)?'':'; de la créatine, 3 à 5 g par jour'}; pas d’alcool les soirs d’entraînement — une grosse soirée après l’entraînement coupe la construction du muscle d’environ le quart, même avec des protéines.`),
    stress:L('<b>Less stress:</b> caffeine done by noon and drinks kept low — both feed anxiety — and sleep is the biggest lever. If it’s more than you can carry: 811 or your doctor; in a crisis, call or text 9-8-8.','<b>Moins de stress :</b> la caféine finie à midi et l’alcool au minimum — les deux nourrissent l’anxiété — et le sommeil, c’est le plus gros levier. Si c’est plus que tu peux porter : le 811 ou ton médecin; en crise, appelle ou texte le 9-8-8.'),
    gut:L('<b>A calmer gut:</b> your stools answer, the check-in’s “what felt off”, and the lactose, sweetener and histamine tests when your days point at them.','<b>Un ventre plus calme :</b> ta réponse sur les selles, le « qu’est-ce qui clochait » du bilan, et les tests du lactose, des édulcorants et de l’histamine quand tes journées pointent vers eux.')};
  return `<div class="card patch"><h3><span class="tag teal">${L('For your goals','Pour tes objectifs')}</span></h3><ul>${g.map(x=>`<li>${R[x]}</li>`).join('')}</ul><div class="row"><button type="button" class="btn ghost sm" data-goals>${L('Change your goals','Changer tes objectifs')}</button></div></div>`; }

/* ---------- the weight plan ---------- */
function wl(){ if(!S.wl||typeof S.wl!=='object') S.wl={}; return S.wl; }
function wlDay(){ const W=wl(); return W.start?daysFrom(W.start,dayKey())+1:0; }
function wlStop(){ const SF=SAFE(); return SF.minor?'minor':SF.preg?'preg':null; }
function wlSlow(){ const SF=SAFE(); return SF.bf||SF.pp; }
function wlMeatNo(){ const SF=SAFE(), W=wl(); return (SF.bf||SF.pp)?'bf':(SF.vegan||SF.veg)?'veg':SF.kidney?'kidney':W.dm?'dm':null; }
function wlOn(){ const W=wl(); return goalOn('weight')&&!wlStop()&&W.ed===false&&!!W.road&&!!W.start; }
/* the low-carb road's first two weeks ("keto flu") don't count in patterns: they'd look like crashes from whatever was eaten */
function wlAdapt(k){ const W=wl(); return !!(wlOn()&&W.road==='meat'&&!wlMeatNo()&&k>=W.start&&k<keyAdd(W.start,14)); }
function wlClean(k){ const W=wl(); k=k||dayKey(); return !!(wlOn()&&W.clean!==false&&k>=W.start&&k<keyAdd(W.start,21)); }
/* v1.2.46: what the clean start leaves out — measured histamine (aged cheese, cured meat, canned or smoked fish, leftovers),
   fermented foods (sauerkraut, soy sauce, kefir, tempeh) and lactose (milk, yogurt, ice cream) — so the week card and the
   gauge stop suggesting them during it */
const WL_FERM=[2201,3403,6291,3321];
function wlOut(f){ return !!f&&((f.tags||[]).includes('hist')||WL_FERM.includes(f.id)||((f.n&&f.n.lact)||0)>=2); }
function wlMeatRoad(){ return wlOn()&&wl().road==='meat'; }
const WLBACK=[{id:'lac',l:['Milk, ice cream and yogurt','Le lait, la crème glacée et le yogourt']},{id:'chz',l:['Aged cheese','Les fromages vieillis']},{id:'cur',l:['Cured meat, canned or smoked fish, day-old leftovers','La charcuterie, le poisson en conserve ou fumé, les restants de la veille']},{id:'ferm',l:['Fermented foods — sauerkraut, soy sauce, kefir','Les aliments fermentés — choucroute, sauce soya, kéfir']}];
function wlNeed(){ return tankReady()?(tankTargets().kcal||0):0; }
function wlFloor(){ const need=wlNeed(), sex=(S.tank.p||{}).sex; return Math.max(sex==='m'?1500:1200, Math.round(0.7*need)); }
function wlMaxLb(){ const need=wlNeed(); if(!need) return 0; return Math.floor(Math.max(0,need-wlFloor())*30.4/3500); }
function wlTarget(){ const W=wl(), need=wlNeed(); const want=Math.round(W.lb*3500/30.4/50)*50; const kc=Math.max(need-want, wlFloor()); return {need, kc:Math.round(kc/10)*10, def:Math.round((need-kc)/10)*10}; }
function wlW(kg){ const u=wl().unit||'lb'; return u==='kg'?L(`${fmt(kg,1)} kg`,`${fmt(kg,1)} kg`):L(`${fmt(kg*2.2046,1)} lb`,`${fmt(kg*2.2046,1)} lb`); }
function wlPace(){ const W=wl(); const all=(W.w||[]).slice().sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:0); const last=all[all.length-1];
  const pts=all.filter(x=>x.day>=keyAdd(W.start,14)); let m='';
  if(pts.length>=2){ const b=pts[pts.length-1]; const a=pts.filter(x=>x.day<=keyAdd(b.day,-13)).pop();
    if(a){ const wks=daysFrom(a.day,b.day)/7, lbw=(a.kg-b.kg)*2.2046/wks;
      const meat=W.road==='meat', tgt=W.lb?W.lb*12/52:0, pb=pathBasics(), under=pb.tn>=2&&pb.low*2>=pb.tn;
      m=lbw>2?L(`<b>More than 2 lb a week — too fast.</b> Eat more: ${meat?'a bigger plate of meat, eggs or fish at supper':'a fist of potatoes or beans at supper'}, protein at every meal.`,`<b>Plus de 2 lb par semaine — trop vite.</b> Mange plus : ${meat?'une plus grosse assiette de viande, d’œufs ou de poisson au souper':'un poing de patates ou de fèves au souper'}, des protéines à chaque repas.`)
        :lbw<0.25?(under?L('<b>Flat for two weeks</b> — but your logged days are under 60% of your need. Eat your needs first; the scale can wait.','<b>Pas de changement depuis deux semaines</b> — mais tes journées notées sont sous 60 % de ton besoin. Comble tes besoins d’abord; la balance peut attendre.'):L('<b>Flat for two weeks.</b> Trim one thing — a snack, or the calories you drink — not a meal.','<b>Pas de changement depuis deux semaines.</b> Enlève une chose — une collation, ou les calories que tu bois — pas un repas.'))
        :(tgt&&lbw<tgt*0.6)?L(`<b>Slower than your number:</b> about ${fmt(lbw,1)} lb a week, against about ${fmt(tgt,1)} for ${W.lb} lb a month. Slower is fine if you’re eating enough and feel well — your need is a guess too.`,`<b>Plus lent que ton chiffre :</b> environ ${fmt(lbw,1)} lb par semaine, contre environ ${fmt(tgt,1)} pour ${W.lb} lb par mois. Plus lent, c’est correct si tu manges assez et que tu te sens bien — ton besoin est une estimation, lui aussi.`)
        :L(`<b>On pace:</b> about ${fmt(lbw,1)} lb a week.`,`<b>Dans le rythme :</b> environ ${fmt(lbw,1)} lb par semaine.`); } }
  if(!m) m=L('Weigh once a week, same day and time. Weeks 1 and 2 don’t count — that’s water.','Pèse-toi une fois par semaine, même jour, même heure. Les semaines 1 et 2 ne comptent pas — c’est de l’eau.');
  return `<p class="small" style="margin:0 0 8px">${last?L(`Last weigh-in: ${wlW(last.kg)}, ${pDate(last.day)}. `,`Dernière pesée : ${wlW(last.kg)}, ${pDate(last.day)}. `):''}${m}</p>`; }
function wlNoWhy(no){ if(!no) return ''; return {bf:L('Not while breastfeeding or in the year after a baby — strict low-carb has sent breastfeeding mothers to hospital with ketoacidosis.','Pas pendant l’allaitement ni dans l’année après un bébé — un régime très faible en glucides a envoyé des mères qui allaitaient à l’hôpital pour une acidocétose.'),
      veg:L('This road leans on meat and fish — the whole-food road fits a vegetarian plate.','Ce chemin repose sur la viande et le poisson — le chemin « aliments entiers » convient à une assiette végétarienne.'),
      kidney:L('Kidney disease: this road is high in protein — that’s your doctor’s call.','Maladie des reins : ce chemin est riche en protéines — c’est à ton médecin de décider.'),
      dm:L('Insulin or a diabetes pill other than metformin: this road can tip into ketoacidosis — that’s your doctor’s call.','Insuline ou une pilule pour le diabète autre que la metformine : ce chemin peut mener à une acidocétose — c’est à ton médecin de décider.')}[no]; }
function wlCard(){ if(!S.done||!goalOn('weight')) return ''; const W=wl(), SF=SAFE(), today=dayKey();
  const eye=t=>`<div class="eyebrow">${L('Your weight plan','Ton plan pour le poids')}${t?' · '+t:''}</div>`;
  const stop=wlStop();
  if(stop) return `<div class="card soft" data-wl="stop">${eye('')}<p class="small" style="margin:0">${stop==='minor'?L('Under 18, the app doesn’t run a weight plan — on purpose. In teens, dieting is the strongest predictor of an eating disorder. Eat enough, steadily; if your weight worries you, talk to a doctor or a parent.','Avant 18 ans, l’app ne fait pas de plan pour le poids — exprès. Chez les ados, la diète est le plus fort prédicteur d’un trouble alimentaire. Mange assez, régulièrement; si ton poids t’inquiète, parles-en à un médecin ou à un parent.'):L('Pregnant: no weight plan here. Weight in pregnancy is your midwife’s or doctor’s call.','Enceinte : pas de plan pour le poids ici. Le poids pendant la grossesse, c’est à ta sage-femme ou à ton médecin de décider.')}</p></div>`;
  if(W.ed==null) return `<div class="card" data-wl="intro">${eye('')}<ul class="small" style="margin:0 0 8px;padding-left:18px"><li>${L('<b>It only works if you’re not hungry.</b> Hunger leads to a binge, and a binge undoes the week — so the food is picked to keep you full.','<b>Ça marche seulement si tu n’as pas faim.</b> La faim mène aux excès, et un gros excès défait la semaine — alors les aliments sont choisis pour couper la faim.')}</li><li>${L('<b>Your daily needs stay met</b> — protein, vitamins, minerals — even on fewer calories. The tank shows it.','<b>Tes besoins de chaque jour restent comblés</b> — protéines, vitamines, minéraux — même avec moins de calories. Le réservoir le montre.')}</li><li>${L('<b>The first 1–2 weeks, the scale drops fast.</b> That’s mostly water. After that, about a pound a week is a good pace.','<b>Les 1 à 2 premières semaines, la balance descend vite.</b> C’est surtout de l’eau. Après, environ une livre par semaine, c’est un bon rythme.')}</li></ul><p style="margin:0 0 8px"><b>${L('One question first: have you ever had trouble with eating — restricting, bingeing or purging?','Une question d’abord : as-tu déjà eu de la difficulté avec la nourriture — te priver, manger sans pouvoir t’arrêter, ou te faire vomir?')}</b></p><div class="row"><button type="button" class="btn ghost sm" data-wled="n">${L('No','Non')}</button><button type="button" class="btn ghost sm" data-wled="y">${L('Yes','Oui')}</button></div><p class="small muted" style="margin:8px 0 0">${T('wlplan',L('How the plan works','Comment le plan marche'),L('Comment le plan marche','Comment le plan marche'))}</p></div>`;
  if(W.ed===true) return `<div class="card soft" data-wl="ed">${eye('')}<p class="small" style="margin:0 0 8px">${L('Then the app won’t run a weight plan with you — on purpose. Counting and cutting can feed that. The plan here is eating enough, steadily, and the rest of your patch.','Alors l’app ne fera pas de plan pour le poids avec toi — exprès. Compter et couper peut nourrir ça. Ici, le plan, c’est manger assez, régulièrement, avec le reste de ta patch.')}</p><p class="small" style="margin:0 0 8px">${L('If food or weight is on your mind a lot, NEDIC’s free line is 1-866-633-4220 (English and French), or talk to your doctor.','Si la nourriture ou le poids te trotte beaucoup dans la tête, la ligne gratuite de NEDIC est le 1-866-633-4220 (en français et en anglais), ou parles-en à ton médecin.')}</p><div class="row"><button type="button" class="btn ghost sm" data-wled="reset">${L('Change my answer','Changer ma réponse')}</button></div></div>`;
  if(!W.road){ const no=wlMeatNo(); const why=wlNoWhy(no);
    return `<div class="card" data-wl="road">${eye(L('pick a road','choisis ton chemin'))}<p class="small" style="margin:0 0 10px">${L('Both work when you’re not hungry. At a year, low-carb and low-fat end up about the same — the one you can keep is the one that works.','Les deux marchent quand tu n’as pas faim. Après un an, faible en glucides et faible en gras finissent à peu près pareil — celui que tu peux garder, c’est celui qui marche.')} ${T('wlplan',L('More','Plus'),L('Plus','Plus'))}</p>
      <div class="wlroad"><p style="margin:0 0 4px"><b>${L('Mostly meat, eggs, cheese and fish','Surtout de la viande, des œufs, du fromage et du poisson')}</b></p><p class="small" style="margin:0 0 6px">${L('Low-carb. The first week can feel like the flu — headache, tired, foggy — then it fades, and hunger often drops a little.','Faible en glucides. La première semaine peut ressembler à une grippe — mal de tête, fatigue, brouillard — puis ça passe, et la faim baisse souvent un peu.')}${SF.bp?' '+L('High blood pressure or heart disease: ask your doctor first — LDL cholesterol can go up on this road.','Hypertension ou maladie du cœur : demande à ton médecin d’abord — le cholestérol LDL peut monter sur ce chemin.'):''}</p>${no?`<p class="small muted" style="margin:0 0 6px">${why}</p>`:`<div class="row"><button type="button" class="btn sm" data-wlroad="meat">${L('This one','Celui-là')}</button></div>`}</div>
      <div class="wlroad"><p style="margin:0 0 4px"><b>${L('Whole food, all of it','Des aliments entiers, de tout')}</b></p><p class="small" style="margin:0 0 6px">${L('Protein at every meal; potatoes, beans and vegetables to fill up; no calories in your glass; fewer chips and fast food.','Des protéines à chaque repas; des patates, des fèves et des légumes pour remplir; pas de calories dans ton verre; moins de chips et de fast-food.')}${wlSlow()?' '+L('After a baby: slowly — your body is still doing a lot.','Après un bébé : lentement — ton corps en fait encore beaucoup.'):''}</p><div class="row"><button type="button" class="btn sm" data-wlroad="whole">${L('This one','Celui-là')}</button></div></div>
      <div class="row"><button type="button" class="btn ghost sm" data-wled="reset">${L('Back','Retour')}</button></div></div>`; }
  const day=wlDay(), meat=W.road==='meat'&&!wlMeatNo();
  const road=W.road==='meat'?L('mostly meat, eggs, cheese and fish','surtout de la viande, des œufs, du fromage et du poisson'):L('whole food, all of it','des aliments entiers, de tout');
  let h=`<p class="small" style="margin:0 0 8px">${L(`Road: ${road}.`,`Chemin : ${road}.`)}</p>`;
  if(W.road==='meat'&&wlMeatNo()) h+=`<p class="small" style="margin:0 0 8px"><b>${L('Your answers changed — the low-carb road is off.','Tes réponses ont changé — le chemin faible en glucides n’est plus offert.')}</b> ${wlNoWhy(wlMeatNo())}</p><div class="row"><button type="button" class="btn sm" data-wlroad="whole">${L('Switch to whole food','Passer aux aliments entiers')}</button></div>`;
  if(W.clean!==false){
    if(day<=21) h+=`<div class="wlbox"><p style="margin:0 0 4px"><b>${L(`Clean start: day ${day} of 21`,`Sans les suspects habituels : jour ${day} sur 21`)}</b></p><p class="small" style="margin:0 0 6px">${L('Out for now: aged cheese, cured meat, canned or smoked fish, fermented foods, leftovers past a day — and milk, ice cream and yogurt.','De côté pour l’instant : les fromages vieillis, la charcuterie, le poisson en conserve ou fumé, les aliments fermentés, les restants de plus d’une journée — et le lait, la crème glacée et le yogourt.')}${meat?' '+L('On this road: mozzarella instead of aged cheese, frozen fish instead of canned.','Sur ce chemin : de la mozzarella au lieu du fromage vieilli, du poisson congelé au lieu de la conserve.'):''}</p><div class="row"><button type="button" class="btn ghost sm" data-wlwhy>${L('What’s out and why','Ce qui est de côté, et pourquoi')}</button><button type="button" class="btn ghost sm" data-wlskip>${L('Skip the clean start','Sauter les trois semaines')}</button></div></div>`;
    else { const back=W.back||[], last=back[back.length-1], left=WLBACK.filter(g=>!back.some(b=>b.id===g.id)); const nm=id=>P2((WLBACK.find(g=>g.id===id)||{l:[id,id]}).l);
      if(last&&daysFrom(last.day,today)<7) h+=`<div class="wlbox"><p style="margin:0 0 4px"><b>${L(`This week: ${nm(last.id).replace(/^./,c=>c.toLowerCase())} — back on the menu.`,`Cette semaine : ${nm(last.id).replace(/^./,c=>c.toLowerCase())} — de retour au menu.`)}</b></p><p class="small" style="margin:0">${L('Eat it like you normally would. If the bad days come back, History and your path will show it.','Manges-en comme d’habitude. Si les mauvaises journées reviennent, l’Historique et ton chemin vont le montrer.')}</p></div>`;
      else if(left.length) h+=`<div class="wlbox"><p style="margin:0 0 6px"><b>${back.length?L('Next group back — which do you miss most?','Le prochain groupe qui revient — lequel te manque le plus?'):L('Clean start done. Bring one group back this week — which do you miss most?','Les trois semaines sont finies. Ramène un groupe cette semaine — lequel te manque le plus?')}</b></p><div class="row">${left.map(g=>`<button type="button" class="btn ghost sm" data-wlback="${g.id}">${P2(g.l)}</button>`).join('')}</div></div>`;
      else h+=`<p class="small muted" style="margin:0 0 8px">${L('Everything’s back. If one group brought the bad days back, History and your path will show it.','Tout est revenu. Si un groupe a ramené les mauvaises journées, l’Historique et ton chemin vont le montrer.')}</p>`; } }
  if(meat&&day<=14) h+=`<p class="small" style="margin:0 0 8px">${L('Weeks 1 and 2 on this road: headache, tiredness, fog or nausea are common, and they fade.','Semaines 1 et 2 sur ce chemin : mal de tête, fatigue, brouillard ou nausée, c’est courant, et ça passe.')} ${SF.noSalt?L('Water helps. Salt helps too, but you’ve been told to watch it — ask your pharmacist first.','L’eau aide. Le sel aide aussi, mais on t’a dit de le surveiller — demande à ton pharmacien d’abord.'):L('Water and a little salt help.','L’eau et un peu de sel aident.')} ${L('These days don’t count in your patterns.','Ces journées ne comptent pas dans tes tendances.')}</p>`;
  const hk=[...Array(7)].map((_,i)=>keyAdd(today,-1-i)).filter(k=>{ const r=rates()[k]; return r&&r.fin&&r.hg!=null; }), hy=hk.filter(k=>rates()[k].hg==='y').length;
  /* v1.2.46: on a stimulant, "not hungry" is the pill, not the plan — and nobody gets "that's the plan working" while the fuel line
     says they're under 60% of their need. The "add food" advice follows the road. */
  const stim=has('meds','stim'), pb=pathBasics(), under=pb.tn>=2&&pb.low*2>=pb.tn;
  const addF=meat?L('protein at breakfast, and a bigger plate of meat, eggs or fish at supper','des protéines au déjeuner, et une plus grosse assiette de viande, d’œufs ou de poisson au souper'):L('protein at breakfast, and potatoes or beans at supper','des protéines au déjeuner, et des patates ou des fèves au souper');
  const clock=L('Eat on the clock: before the pill, at noon and at supper.','Mange à l’heure : avant la pilule, au dîner et au souper.');
  if(hk.length>=3&&hy>=3) h+=`<p class="small" style="margin:0 0 8px"><b>${L(`Hungry on ${hy} of your last ${hk.length} days.`,`Faim ${hy} de tes ${hk.length} derniers jours.`)}</b> ${L('The plan is too tight — add food, don’t cut:','Le plan est trop serré — ajoute de la nourriture, ne coupe pas :')} ${addF}.</p>`;
  else if(under) h+=`<p class="small" style="margin:0 0 8px"><b>${L(`Under 60% of your need on ${pb.low} of your last ${pb.tn} complete days.`,`Sous 60 % de ton besoin dans ${pb.low} de tes ${pb.tn} dernières journées complètes.`)}</b> ${stim?L('On a stimulant, the pill takes the hunger, so it can’t tell you when to eat — the clock can.','Sur un stimulant, la pilule coupe la faim, alors elle ne peut pas te dire quand manger — l’horloge, oui.')+' '+clock:L('Not being hungry isn’t enough — the plan only works with your needs met.','Ne pas avoir faim, ça ne suffit pas — le plan marche seulement si tes besoins sont comblés.')} ${L('Add food:','Ajoute de la nourriture :')} ${addF}.</p>`;
  else if(stim) h+=`<p class="small" style="margin:0 0 8px">${L('On a stimulant, “not hungry” doesn’t tell you much — ','Sur un stimulant, « pas faim », ça ne dit pas grand-chose — ')}${T('stimwear','the pill takes the appetite','la pilule coupe l’appétit')}. ${clock} ${L('Hunger that hits at night is often the pill wearing off, not a lack of willpower.','La faim qui arrive le soir, c’est souvent la pilule qui lâche, pas un manque de volonté.')}</p>`;
  else if(hk.length>=4&&hy<=1) h+=`<p class="small muted" style="margin:0 0 8px">${L('Not hungry most days — that’s the plan working.','Pas faim la plupart des jours — c’est le plan qui marche.')}</p>`;
  else if(!hk.length) h+=`<p class="small muted" style="margin:0 0 8px">${L('Your check-in now asks if you were hungry between meals. That’s the scoreboard.','Ton bilan demande maintenant si tu as eu faim entre les repas. C’est ça, le tableau de pointage.')}</p>`;
  if(W.lb&&wlNeed()){ const t=wlTarget(); h+=`<p class="small" style="margin:0 0 6px">${L(`Your number: ${W.lb} lb a month — about ${fmt(t.def,0)} calories a day under your need, so about ${fmt(t.kc,0)} instead of ${fmt(t.need,0)}. Your need is a guess; the scale steers.`,`Ton chiffre : ${W.lb} lb par mois — environ ${fmt(t.def,0)} calories par jour sous ton besoin, donc environ ${fmt(t.kc,0)} au lieu de ${fmt(t.need,0)}. Ton besoin est une estimation; c’est la balance qui guide.`)}</p>${wlPace()}`; }
  else if((W.w||[]).length) h+=wlPace();
  h+=`<div class="row"><button type="button" class="btn ghost sm" data-wlnum>${W.lb?L('Change the number','Changer le chiffre'):L('Set a number for the month','Fixer un chiffre pour le mois')}</button>${(W.lb||(W.w||[]).length)?`<button type="button" class="btn ghost sm" data-wlwt>${L('Add a weigh-in','Ajouter une pesée')}</button>`:''}<button type="button" class="btn ghost sm" data-wlroad="reset">${L('Change road','Changer de chemin')}</button></div>`;
  return `<div class="card" data-wl="run">${eye(L(`day ${day}`,`jour ${day}`))}${h}</div>`; }
function wlFuelLine(){ if(!wlOn()) return ''; const W=wl();

function wlStart(road){ const W=wl(); W.road=road; W.start=dayKey(); delete W.back; delete W.clean; save(); render(true); }
function wlDmSheet(opener){ showSheet(`<div class="handle"></div><h3 id="sheetTitle">${L('One check first','Une vérification d’abord')}</h3><p class="small">${L('Do you take insulin, or a diabetes pill other than metformin?','Prends-tu de l’insuline, ou une pilule pour le diabète autre que la metformine?')}</p><div class="row"><button type="button" class="btn" data-wldm="n">${L('No — start this road','Non — commencer ce chemin')}</button><button type="button" class="btn ghost" data-wldm="y">${L('Yes','Oui')}</button><button type="button" class="btn ghost" id="closeSheet">${L('Cancel','Annuler')}</button></div>`, opener);
  sheet.querySelectorAll('[data-wldm]').forEach(b=>{ b.onclick=()=>{ const W=wl(); W.dm=b.dataset.wldm==='y'; closeSheet(true); if(!W.dm) wlStart('meat'); else { save(); render(true); } }; }); }
function wlWhySheet(opener){ const drinks=!!(S.a.keep||[]).some(x=>x==='beer'||x==='wine');
  showSheet(`<div class="handle"></div><h3 id="sheetTitle">${L('Your first 3 weeks: without the usual suspects','Tes trois premières semaines : sans les suspects habituels')}</h3>
  <p class="small">${L('For 3 weeks, we leave out the foods most likely to cause bad days on their own:','Pendant trois semaines, on laisse de côté les aliments les plus susceptibles de causer des mauvaises journées à eux seuls :')}</p>
  <ul class="small" style="padding-left:18px"><li>${L(`Aged cheese, cured meat, canned or smoked fish, fermented foods, and leftovers kept past a day. They carry ${T('histamine','histamine')}, which can bring headaches, itch, flushing or loose stools.`,`Les fromages vieillis, la charcuterie, le poisson en conserve ou fumé, les aliments fermentés, et les restants gardés plus d’une journée. Ils contiennent de l’${T('histamine','histamine','histamine')}, qui peut donner des maux de tête, des démangeaisons, des rougeurs ou des selles molles.`)}</li><li>${L(`Milk, ice cream and yogurt. They carry ${T('lactose','lactose')}, which can bring gas, cramps and loose stools. Lactose-free milk, butter and mozzarella are fine.`,`Le lait, la crème glacée et le yogourt. Ils contiennent du ${T('lactose','lactose','lactose')}, qui peut donner des gaz, des crampes et des selles molles. Le lait sans lactose, le beurre et la mozzarella, ça va.`)}</li></ul>
  <p class="small">${L('If you feel off during these weeks, it isn’t them. After that, they come back one at a time, a week each. If one brings the bad days back, you’ll see it; if not, it stays. Nothing here is gone for good.','Si tu ne te sens pas bien pendant ces semaines-là, ce n’est pas eux. Ensuite, ils reviennent un à la fois, une semaine chacun. Si un ramène les mauvaises journées, tu vas le voir; sinon, il reste. Rien ici n’est enlevé pour de bon.')}</p>
  <p class="small"><b>${L('Still in:','Ça reste :')}</b> ${L('eggs, fresh meat, frozen fish and shrimp, liver (not pâté), mozzarella, butter, lactose-free milk, beans, lentils, tofu, and every fruit and vegetable.','les œufs, la viande fraîche, le poisson et les crevettes congelés, le foie (pas le pâté), la mozzarella, le beurre, le lait sans lactose, les fèves, les lentilles, le tofu, et tous les fruits et légumes.')}</p>
  <p class="small">${L('Beef is fine — aging barely adds histamine; curing is what does. Cook or freeze meat the day you buy it, and freeze cooked portions right away. Chicken: plain chicken is one ingredient, so it has no ingredient list — if the package lists ingredients, it’s been pumped with salt water.','Le bœuf, ça va — le vieillissement ajoute très peu d’histamine; c’est la salaison qui en ajoute. Cuis ou congèle la viande le jour où tu l’achètes, et congèle les portions cuites tout de suite. Le poulet : un poulet nature, c’est un seul ingrédient, alors il n’a pas de liste d’ingrédients — si l’emballage en a une, il a été injecté d’eau salée.')} ${T('cleanstart',L('The evidence','Les preuves'),L('Les preuves','Les preuves'))}</p>
  ${drinks?`<p class="small">${L('Beer and wine carry histamine too. They stay because you said so — but then histamine isn’t fully out.','La bière et le vin contiennent aussi de l’histamine. Ils restent parce que tu l’as dit — mais alors l’histamine n’est pas complètement de côté.')}</p>`:''}
  <div class="row"><button type="button" class="btn ghost" id="closeSheet">${L('Close','Fermer')}</button></div>`, opener); }
function wlNumSheet(opener){ const max=wlMaxLb(), need=wlNeed(); const opts=[2,4,5,8].filter(x=>x<=max&&(!wlSlow()||x<=4)); const W=wl();
  showSheet(`<div class="handle"></div><h3 id="sheetTitle">${L('A number for the month','Un chiffre pour le mois')}</h3><p class="small">${L('About a pound a week is a good pace. Each pound is roughly 3,500 calories, spread over the month.','Environ une livre par semaine, c’est un bon rythme. Chaque livre, c’est à peu près 3 500 calories, réparties sur le mois.')}${wlSlow()?' '+L('After a baby, the app keeps it to 4 lb a month or less.','Après un bébé, l’app s’en tient à 4 lb par mois ou moins.'):''}</p>${!need?`<p class="small">${L('Set the fuel gauge first — the number needs your weight and your work.','Règle d’abord la jauge — le chiffre a besoin de ton poids et de ton travail.')}</p>`:opts.length?`<div class="chips pick1">${opts.map(x=>`<button type="button" class="chip" data-wllb="${x}" aria-pressed="${W.lb===x}"><span>${L(`${x} lb a month`,`${x} lb par mois`)}</span></button>`).join('')}</div>`:`<p class="small">${L('Your need is already low, so the app won’t set a number — eat to full, protein first, and let the scale tell you.','Ton besoin est déjà bas, alors l’app ne fixera pas de chiffre — mange à ta faim, les protéines d’abord, et laisse la balance te le dire.')}</p>`}<div class="row" style="margin-top:12px">${W.lb?`<button type="button" class="btn ghost" data-wllb="0">${L('No number — eat to full','Pas de chiffre — manger à ma faim')}</button>`:''}<button type="button" class="btn ghost" id="closeSheet">${L('Close','Fermer')}</button></div>`, opener);
  sheet.querySelectorAll('[data-wllb]').forEach(b=>{ b.onclick=()=>{ const v=+b.dataset.wllb; if(v) W.lb=v; else delete W.lb; save(); closeSheet(); render(true); }; }); }
function wlWtSheet(opener){ const W=wl();
  showSheet(`<div class="handle"></div><h3 id="sheetTitle">${L('Weigh-in','Pesée')}</h3><p class="small">${L('Once a week, same day, same time — first thing in the morning is easiest.','Une fois par semaine, même jour, même heure — le matin en te levant, c’est le plus simple.')}</p><label class="small" for="wlw">${L('Weight','Poids')}</label><div class="row" style="align-items:center"><input id="wlw" type="number" inputmode="decimal" step="any" min="0" class="sel" style="max-width:8em"><div class="chips pick1" style="margin:0">${['lb','kg'].map(u=>`<button type="button" class="chip" data-wlu="${u}" aria-pressed="${(W.unit||'lb')===u}"><span>${u}</span></button>`).join('')}</div></div><div class="row" style="margin-top:12px"><button type="button" class="btn" id="wlwSave">${L('Save','Enregistrer')}</button><button type="button" class="btn ghost" id="closeSheet">${L('Cancel','Annuler')}</button></div>`, opener);
  sheet.querySelectorAll('[data-wlu]').forEach(b=>{ b.onclick=()=>{ W.unit=b.dataset.wlu; save(); sheet.querySelectorAll('[data-wlu]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.wlu===W.unit))); }; });
  document.getElementById('wlwSave').onclick=()=>{ const v=parseFloat(String(document.getElementById('wlw').value).replace(',','.')); const kg=(W.unit||'lb')==='lb'?v/2.2046:v;
    if(!(kg>=20&&kg<=320)){ toast(L('That doesn’t look like a weight — check the number and the unit.','Ça ne ressemble pas à un poids — vérifie le chiffre et l’unité.')); return; }
    W.w=(W.w||[]).filter(x=>x.day!==dayKey()); W.w.push({day:dayKey(),kg:Math.round(kg*10)/10}); save(); closeSheet(); render(true); toast(L('Saved','Enregistré')); }; }

function stimTaps(r,k){ if(!has('meds','stim')) return ''; const q=L('ADHD pill today?','Pilule pour le TDAH aujourd’hui?');
  return `<div class="rq" role="group" aria-label="${esc(q)}"><p class="lb">${q} <small>· ${L('on pill days, a crash isn’t held against a food','les jours de pilule, un crash ne compte pas contre un aliment')}</small></p><div class="rr">${PILLQ.map(([v,l])=>`<button type="button" class="rc" data-rk="${k}" data-rq="pill" data-rv="${v}" aria-pressed="${r.pill===v}">${P2(l)}</button>`).join('')}</div></div>`; }
function pillLab(v){ const p=PILLQ.find(x=>x[0]===v); return p?P2(p[1]):''; }
function goalTaps(r,k){ if(!wlOn()) return ''; const q=L('Hungry between meals?','Faim entre les repas?');
  return `<div class="rq" role="group" aria-label="${esc(q)}"><p class="lb">${q} <small>· ${L('your weight plan’s scoreboard','le tableau de pointage de ton plan pour le poids')}</small></p><div class="rr">${[['n',L('no','non')],['y',L('yes','oui')]].map(([v,l])=>`<button type="button" class="rc" data-rk="${k}" data-rq="hg" data-rv="${v}" aria-pressed="${r.hg===v}">${l}</button>`).join('')}</div></div>`; }
function wlText(){ if(!goalOn('weight')) return ''; const W=wl(); const o=[L('== MY WEIGHT PLAN ==','== MON PLAN POUR LE POIDS ==')];
  if(wlStop()) o.push(L('None — the app doesn’t run one for me (under 18 or pregnant).','Aucun — l’app n’en fait pas pour moi (moins de 18 ans ou enceinte).'));
  else if(W.ed===true) o.push(L('None — I said I’ve had trouble with eating, so the plan is eating enough, steadily.','Aucun — j’ai dit avoir déjà eu de la difficulté avec la nourriture, alors le plan, c’est manger assez, régulièrement.'));
  else if(!wlOn()) o.push(L('Not started yet.','Pas encore commencé.'));
  else { o.push(L(`Road: ${W.road==='meat'&&!wlMeatNo()?'mostly meat, eggs, cheese and fish (low-carb)':'whole food'}; day ${wlDay()}.`,`Chemin : ${W.road==='meat'&&!wlMeatNo()?'surtout viande, œufs, fromage et poisson (faible en glucides)':'aliments entiers'}; jour ${wlDay()}.`));
    if(W.clean!==false) o.push(wlClean()?L('Clean start (no aged cheese, cured meat, canned or smoked fish, fermented foods, day-old leftovers, milk, ice cream or yogurt) until day 21.','Sans les suspects habituels (pas de fromages vieillis, charcuterie, poisson en conserve ou fumé, aliments fermentés, restants de la veille, lait, crème glacée ni yogourt) jusqu’au jour 21.'):L(`Groups brought back: ${(W.back||[]).map(b=>P2((WLBACK.find(g=>g.id===b.id)||{l:[b.id,b.id]}).l)+' ('+b.day+')').join('; ')||'none yet'}.`,`Groupes ramenés : ${(W.back||[]).map(b=>P2((WLBACK.find(g=>g.id===b.id)||{l:[b.id,b.id]}).l)+' ('+b.day+')').join('; ')||'aucun encore'}.`));
    if(W.lb) o.push(L(`Number: ${W.lb} lb a month.`,`Chiffre : ${W.lb} lb par mois.`));
    if((W.w||[]).length) o.push(L('Weigh-ins: ','Pesées : ')+(W.w||[]).slice(-6).map(x=>`${x.day} ${wlW(x.kg)}`).join('; '));
    const hk=[...Array(14)].map((_,i)=>keyAdd(dayKey(),-1-i)).filter(k=>{ const r=rates()[k]; return r&&r.fin&&r.hg!=null; }); if(hk.length) o.push(L(`Hungry between meals: ${hk.filter(k=>rates()[k].hg==='y').length} of my last ${hk.length} answered days.`,`Faim entre les repas : ${hk.filter(k=>rates()[k].hg==='y').length} de mes ${hk.length} dernières journées répondues.`)); }
  return o.join('\n'); }
function bindGoals(){
  document.querySelectorAll('[data-goals]').forEach(b=>{ b.onclick=()=>openGoals(b); });
  document.querySelectorAll('[data-wled]').forEach(b=>{ b.onclick=()=>{ const W=wl(), v=b.dataset.wled; if(v==='reset'){ delete W.ed; delete W.road; delete W.start; } else W.ed=(v==='y'); save(); render(true); const c=document.querySelector('[data-wl]'); if(c){ const f=c.querySelector('button'); if(f) try{ f.focus({preventScroll:true}); }catch(e){} } }; });
  document.querySelectorAll('[data-wlroad]').forEach(b=>{ b.onclick=()=>{ const W=wl(), v=b.dataset.wlroad; if(v==='reset'){ delete W.road; delete W.start; delete W.back; delete W.clean; save(); render(true); return; } if(v==='meat'&&W.dm==null){ wlDmSheet(b); return; } wlStart(v); }; });
  document.querySelectorAll('[data-wlwhy]').forEach(b=>{ b.onclick=()=>wlWhySheet(b); });
  document.querySelectorAll('[data-wlskip]').forEach(b=>{ b.onclick=()=>{ wl().clean=false; save(); render(true); }; });
  document.querySelectorAll('[data-wlback]').forEach(b=>{ b.onclick=()=>{ const W=wl(); W.back=(W.back||[]).concat({id:b.dataset.wlback,day:dayKey()}); save(); render(true); }; });
  document.querySelectorAll('[data-wlnum]').forEach(b=>{ b.onclick=()=>wlNumSheet(b); });
  document.querySelectorAll('[data-wlwt]').forEach(b=>{ b.onclick=()=>wlWtSheet(b); }); }

function QL(){ return Q.filter(q=>!q.skip||!q.skip()); }

function buildPatch(){
  const a=S.a; const budget=a.budget_b||'15'; const cook=a.budget_c||'some';
  const DI=drinkInfo(); const drinksDaily = DI.daily; const drinks = any('fuel','beer','wine','spirits');
  const keep=(a.keep||[]).filter(k=>k!=='any');
  const SF=SAFE(); const preg=SF.preg, bp=SF.bp, kidney=SF.kidney, minor=SF.minor, snore=SF.snore;
  const noSalt = SF.noSalt;
  const P={keep:[],keepShort:[],swap:[],swapShort:[],add:[],eat:[],timing:[],leak:[],number:[],plain:[],always:[],stops:[],notes:[],cost:0,addNote:'',deferred:0};

  /* safety answers: not emergencies, but they rewrite the card */
  if(minor) P.notes.push(L(`<b>Under 18: this wasn’t built for you.</b> The doses and the alcohol advice are for adults, so the Add card is empty on purpose. What still holds: protein before noon, caffeine done by noon, and if you’re tired all the time, ask a parent, school nurse or doctor for a ferritin test — low iron is very common at your age and it looks exactly like “lazy”.`,
    `<b>Moins de 18 ans : ça n’a pas été bâti pour toi.</b> Les doses et les conseils sur l’alcool sont pour des adultes, alors la carte Ajouter est vide exprès. Ce qui s’applique quand même : des protéines avant midi, la caféine finie à midi, et si tu es toujours à plat, demande à un parent, à l’infirmière de l’école ou à un médecin un test de ferritine — manquer de fer est très fréquent à ton âge, et de l’extérieur, ça passe pour de la paresse.`));
  const BF=SF.bf;
  if(preg) P.notes.push(L(`<b>Pregnant: the patch changes for you.</b> No liver, no creatine, no salt water. Caffeine: 300 mg a day at most — about a mug and a half of drip coffee.${drinks?' Alcohol: no amount is known to be safe in pregnancy; if stopping is hard, that’s a pharmacist or prenatal-clinic conversation this week, not a swap.':''} Every supplement below gets a yes from the pharmacist first — ${T('prenatal','a prenatal vitamin with 16–20 mg of iron')} is the base (Health Canada). Ferritin matters more for you, not less: the iron target goes up by half in pregnancy, from 18 to 27 mg. Ask at your next visit.`,
    `<b>Enceinte : la patch change pour toi.</b> Pas de foie, pas de créatine, pas d’eau salée. Caféine : 300 mg par jour maximum — environ une tasse et demie de café filtre.${drinks?' Alcool : aucune quantité n’est reconnue sécuritaire pendant la grossesse; si arrêter est difficile, c’est une conversation avec un pharmacien ou la clinique prénatale cette semaine, pas un remplacement.':''} Chaque supplément ci-dessous passe d’abord par le feu vert du pharmacien — ${T('prenatal','une vitamine prénatale avec 16 à 20 mg de fer','une vitamine prénatale avec 16 à 20 mg de fer')} est la base (Santé Canada). La ferritine est encore plus importante pour toi : la cible de fer monte de moitié pendant la grossesse, de 18 à 27 mg. Demande-la à ta prochaine visite.`));
  else if(BF) P.notes.push(L(`<b>Breastfeeding: a few things change.</b> Caffeine: 300 mg a day at most — about a mug and a half of drip coffee. No creatine — there’s no safety data while breastfeeding. Every supplement below gets the pharmacist’s yes first. ${T('prenatal','Keep taking your prenatal')}: Health Canada recommends a multivitamin with 0.4 mg folic acid every day while breastfeeding. Many also carry B12, which matters if you don’t eat meat or fish.${drinks?' Alcohol: not drinking is safest while breastfeeding (Canada’s guidance). If you do have one, feed first and wait about two hours per drink before the next feed.':''} Your iron target drops back after the birth, but pregnancy and delivery can leave the stores empty — that’s what the ferritin test shows. You need more protein now, not less: about 1.3 g per kg a day.`,
    `<b>Allaitement : quelques affaires changent.</b> Caféine : 300 mg par jour maximum — environ une tasse et demie de café filtre. Pas de créatine — il n’y a pas de données de sécurité pendant l’allaitement. Chaque supplément ci-dessous passe d’abord par le feu vert du pharmacien. ${T('prenatal','Continue ta vitamine prénatale','Continue ta vitamine prénatale')} : Santé Canada recommande une multivitamine avec 0,4 mg d’acide folique chaque jour pendant l’allaitement. Plusieurs contiennent aussi de la B12, ce qui compte si tu ne manges ni viande ni poisson.${drinks?' Alcool : ne pas boire, c’est le plus sûr pendant l’allaitement (repères canadiens). Si tu en prends un, allaite d’abord et attends environ deux heures par verre avant la prochaine tétée.':''} Ta cible de fer redescend après l’accouchement, mais la grossesse et l’accouchement peuvent vider les réserves — c’est ce que le test de ferritine montre. Tu as besoin de plus de protéines maintenant, pas moins : environ 1,3 g par kg par jour.`));
  if(kidney) P.notes.push(L(`<b>Kidney disease changes the supplement list.</b> Kidneys clear magnesium, potassium and what creatine breaks down into, so: no magnesium pills, no creatine, no salt water, and ask your kidney team before changing how much potato, salt or potassium you eat. Ask your pharmacist whether plain psyllium (it needs a full glass of water every time — that matters if you’re on a fluid limit) and B1 fit your plan. Ferritin still matters — kidney disease and low iron travel together.`,
    `<b>Maladie des reins : ça change la liste des suppléments.</b> Les reins éliminent le magnésium, le potassium et les résidus de la créatine, alors : pas de comprimés de magnésium, pas de créatine, pas d’eau salée, et demande à ton néphrologue ou à ta clinique rénale avant de changer ta quantité de patates, de sel ou de potassium. Demande à ton pharmacien si le psyllium nature (ça prend un grand verre d’eau chaque fois — c’est important si tu as une restriction de liquides) et la B1 cadrent avec ton plan. La ferritine compte quand même — maladie des reins et manque de fer vont souvent ensemble.`));
  else if(bp) P.notes.push(L(`<b>High blood pressure or heart disease:</b> salt water is off your card. Everything else stands. If you take a blood-pressure pill or a water pill, ask the pharmacist before adding magnesium or piling on potassium-rich food like potatoes and fish — some of those pills hold potassium in, and the combination needs a blood check.`,
    `<b>Hypertension ou maladie du cœur :</b> on retire l’eau salée de ta carte. Le reste tient. Si tu prends une pilule pour la pression ou un diurétique, demande au pharmacien avant d’ajouter du magnésium ou de te bourrer d’aliments riches en potassium comme les patates et le poisson — certaines de ces pilules retiennent le potassium, et la combinaison demande une prise de sang.`));

  P.urgent = any('flags','chest','faint','black');
  if(any('flags','chest','faint')) P.stops.push(
    L(`<b>Call 911 or get to an emergency department now.</b> ${has('flags','chest')?'Chest pain is not a diet problem and not a walk-in problem. ':''}${has('flags','faint')?'Fainting or a racing heart with bleeding means you’ve lost too much blood. ':''}The patch can wait. This can’t.`,
      `<b>Appelle le 911 ou va à l’urgence maintenant.</b> ${has('flags','chest')?'Une douleur à la poitrine, ce n’est ni un problème d’alimentation ni un problème de clinique sans rendez-vous. ':''}${has('flags','faint')?'S’évanouir ou avoir le cœur qui s’emballe avec des saignements, c’est avoir perdu trop de sang. ':''}La patch peut attendre. Pas ça.`));
  else if(has('flags','black')) P.stops.push(
    L(`<b>Emergency department today — not a walk-in, not 811.</b> Black or tarry stool means bleeding higher up in the gut. It needs to be seen today, and the patch waits until it has been.`,
      `<b>À l’urgence aujourd’hui — pas une clinique sans rendez-vous, pas le 811.</b> Des selles noires ou comme du goudron, c’est un saignement plus haut dans le tube digestif. Ça doit être vu aujourd’hui, et la patch attendra que ce soit fait.`));
  if(has('flags','weight')) P.stops.push(
    L(`<b>Losing weight without knowing why needs a doctor this week.</b> Not an emergency. Not optional either. The rest of the patch applies in the meantime.`,
      `<b>Perdre du poids sans savoir pourquoi, ça demande de voir un médecin cette semaine.</b> Ce n’est pas une urgence, mais ce n’est pas optionnel non plus. Le reste de la patch s’applique en attendant.`));
  if(has('flags','shaky') && minor) P.stops.push(
    L(`<b>Shaky or sweaty when you skip a drink means your body has started depending on it — tell an adult today.</b> A parent, a school nurse, or 811. Don’t stop all at once on your own: ${T('withdrawal','stopping suddenly')} can be dangerous, and a doctor can make it safe. A seizure, confusion, or seeing things that aren’t there: 911.`,
      `<b>Trembler ou suer quand tu sautes un verre, ça veut dire que ton corps a commencé à en dépendre — parles-en à un adulte aujourd’hui.</b> Un parent, l’infirmière de l’école, ou le 811. N’arrête pas tout d’un coup par toi-même : ${T('withdrawal','arrêter brusquement','arrêter brusquement')} peut être dangereux, et un médecin peut rendre ça sécuritaire. Une convulsion, de la confusion, ou voir des choses qui ne sont pas là : 911.`));
  else if(has('flags','shaky')) P.stops.push(
    L(`<b>Don’t stop drinking cold.</b> Shaky or sweaty when you skip means your body is dependent, and ${T('withdrawal','stopping suddenly')} can be dangerous. Start ${T('thiamine')} today, keep drinking at your usual level for now, and get a pharmacist or doctor to help you taper. The patch below assumes you keep drinking this week.`,
      `<b>N’arrête pas de boire d’un coup.</b> Trembler ou suer quand tu sautes un verre, ça veut dire que ton corps est dépendant, et ${T('withdrawal','arrêter brusquement','arrêter brusquement')} peut être dangereux. Commence la ${T('thiamine')} aujourd’hui, garde ta consommation habituelle pour l’instant, et fais-toi aider par un pharmacien ou un médecin pour diminuer graduellement. La patch ci-dessous suppose que tu continues à boire cette semaine.`));

      L(`<b>A drink and a sleeping or anxiety pill on the same night can stop your breathing — and you also shake when you skip a drink.</b> Being dependent on both is exactly what a doctor or pharmacist has to manage with you, this week — not a card in an app. Neither one gets stopped cold. Say this sentence, word for word: “I drink every day and I take ${T('sedative','a sleeping pill')}.”`,
        `<b>Un verre et un somnifère ou une pilule pour l’anxiété dans la même soirée peuvent arrêter ta respiration — et tu trembles aussi quand tu sautes un verre.</b> Une dépendance aux deux, c’est exactement ce qu’un médecin ou un pharmacien doit gérer avec toi, cette semaine — pas une fiche dans une app. Ni l’un ni l’autre ne s’arrête d’un coup. Dis cette phrase, mot pour mot : « Je bois tous les jours et je prends ${T('sedative','un somnifère','un somnifère')}. »`));
    else P.stops.push(

        `<b>Un verre et ${T('sedative','un somnifère ou une pilule pour l’anxiété','un somnifère ou une pilule pour l’anxiété')} dans la même soirée peuvent arrêter ta respiration.</b> Les deux appuient sur le même frein. Les mots de la monographie : « ne buvez pas d’alcool avec ce médicament ». Alors ce n’est pas un remplacement, c’est une règle — ne prends pas le verre et la pilule le même soir. Si tu n’arrives pas à imaginer une soirée sans les deux, dis exactement ça au pharmacien cette semaine. Il a déjà entendu ça.`));
  }

  const alcoholKeys=['beer','wine','spirits'];
  const keepShown = (preg||minor) ? keep.filter(k=>!alcoholKeys.includes(k)) : keep;

  if(keepShown.length) P.keep = keepShown.map(k=>P2(FUEL[k])).filter(Boolean);
  else if(alcoholDropped) P.keep=[L('Nothing else to protect this week.','Rien d’autre à protéger cette semaine.')];

  if(has('fuel','energy') && minor) P.swap.push(L(`Energy drinks aren’t recommended under 14 — it says so on the can — and under 18, caffeine is capped by your weight: 2.5 mg per kg a day, about 125 mg at 50 kg. Many single cans are over that. The 3 p.m. crash it “fixes” is mostly the breakfast you skipped: eat that, drink water, and see how the afternoon goes without the can.`, `Les boissons énergisantes ne sont pas recommandées avant 14 ans — c’est écrit sur la canette — et avant 18 ans, la caféine est limitée selon ton poids : 2,5 mg par kilo par jour, environ 125 mg à 50 kg. Bien des canettes à elles seules dépassent ça. Le crash de 15 h qu’elle « règle », c’est surtout le déjeuner que tu as sauté : mange-le, bois de l’eau, et regarde comment va ton après-midi sans la canette.`));
  else if(has('fuel','energy')) P.swap.push(has('keep','energy')
    ? L(`Keep the energy drink, but 30 minutes before it: ${saltyA} and something with protein. Make it the last ${T('caffeine')} of the day.`, `Garde la boisson énergisante, mais 30 minutes avant : ${saltyA} et des protéines. Que ce soit la dernière ${T('caffeine')} de la journée.`)
    : L(`The mid-shift energy drink → ${saltyB}, a protein snack (jerky, cheese, boiled eggs), five minutes outside. It was doing a job — ${saltOn?'low salt, ':''}no protein since morning — and this does the same job without the ${T('sweeteners')} and the midnight caffeine.`, `La boisson énergisante du milieu de quart → ${saltyB}, une collation protéinée (jerky, fromage, œufs cuits durs), cinq minutes dehors. Elle comblait un besoin — ${saltOn?'manque de sel, ':''}pas de protéines depuis le matin — et ça fait la même job sans les ${T('sweeteners')} ni la caféine à minuit.`));
  if(has('fuel','coffee')) P.swap.push(L(`${T('caffeine','Coffee')} stays. One rule: nothing after noon — on shifts, nothing in the 8 hours before you sleep. ${any('sleep','5','6','broken')?'On short sleep this is the single biggest free change you can make.':''}${(preg||SF.bf)?' And 300 mg a day at most — about a mug and a half of drip coffee.':''}`, `Le ${T('caffeine','café','café')} reste. Une règle : rien après midi — sur les quarts, rien dans les 8 heures avant de dormir. ${any('sleep','5','6','broken')?'Quand le sommeil manque, c’est le plus gros changement gratuit qui existe.':''}${(preg||SF.bf)?' Et 300 mg par jour maximum — environ une tasse et demie de café filtre.':''}`));

  if(alcoholSwaps && has('fuel','wine')) P.swap.push(L(`One glass, with food, then water. Red wine carries the most ${T('histamine')} — if headaches or itch follow it, that’s your body’s signal.`, `Un verre, en mangeant, puis de l’eau. Le vin rouge est le plus chargé en ${T('histamine')} — si des maux de tête ou des démangeaisons suivent, c’est le signal de ton corps.`));

    : has('keep','energy') ? L(`energy drink — ${saltOn?'salted water':'water'} and protein first, and the last caffeine of the day`,`boisson énergisante — ${saltOn?'de l’eau salée':'de l’eau'} et des protéines avant, et la dernière caféine de la journée`)
