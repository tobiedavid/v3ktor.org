       'Le guide américain de médecine des dépendances (2020) et le NICE britannique (CG100) : les gros buveurs quotidiens peuvent faire des convulsions en arrêtant d’un coup et ont besoin d’un sevrage supervisé; thiamine pour tous ceux à risque. C’est le point le plus établi de toute l’application.']},
  tsh:{src:['chaker'],
    e:['Standard medicine. A 2017 Lancet review covers how common an underactive thyroid is (more in women), its symptoms, and TSH as the screening test.',
       'Médecine courante. Une revue du Lancet (2017) couvre la fréquence de l’hypothyroïdie (plus courante chez les femmes), ses symptômes et la TSH comme test de dépistage.']},
  vitd:{src:['webb','endo24','hcVit'],
    e:['“No useful winter sun” comes from a 1988 measurement study: in Edmonton, skin made no vitamin D from October through March; in Boston, November through February. The Endocrine Society guideline (2024) suggests against routine vitamin D blood tests and against taking more than the daily need for healthy adults under 75; it suggests more for people over 75, in pregnancy, with prediabetes, and under 18. The 600/800 IU need and the 4,000 IU ceiling are Health Canada’s.',
       '« Pas de soleil utile l’hiver » vient d’une étude de mesure de 1988 : à Edmonton, la peau ne produisait aucune vitamine D d’octobre à mars; à Boston, de novembre à février. Le guide de l’Endocrine Society (2024) suggère de ne pas faire de prise de sang de routine pour la vitamine D, et de ne pas dépasser le besoin quotidien chez les adultes en santé de moins de 75 ans; il en suggère plus après 75 ans, pendant la grossesse, avec un prédiabète et avant 18 ans. Le besoin de 600/800 UI et le plafond de 4 000 UI viennent de Santé Canada.']},
  crp:{src:['thurnham','who2020','bsg2021'],
    e:['A pooled analysis of 32 studies (8,796 people): inflammation raised ferritin by about 30% and hid iron deficiency in roughly 1 case in 7. The WHO (2020) and UK (2021) guidelines both say to read ferritin together with an inflammation marker.',
       'Analyse groupée de 32 études (8 796 personnes) : l’inflammation faisait monter la ferritine d’environ 30 % et cachait un vrai manque de fer dans environ 1 cas sur 7. Les guides de l’OMS (2020) et britannique (2021) disent tous deux de lire la ferritine avec un marqueur d’inflammation.']},
  barrier:{src:['ascrs','beeckman'],
    e:['The colorectal-surgery guideline (2023): fibre, fluids and warm sitz baths are first-line for anal fissures and heal about half of them. For barrier creams, a Cochrane review (2016) found only low-quality evidence — they are standard nursing practice for skin exposed to loose stool, not trial-proven. “Likely”, and still the cheapest first move.',
       'Le guide de chirurgie colorectale (2023) : fibres, liquides et bains de siège tièdes sont le premier traitement des fissures anales et en guérissent environ la moitié. Pour les crèmes barrières, une revue Cochrane (2016) n’a trouvé que des preuves de faible qualité — c’est la pratique infirmière courante pour la peau exposée aux selles molles, pas quelque chose de prouvé par essai. « Probable », et quand même le premier geste à poser, et le moins cher.']},
  loop:{src:['drake','ebrahim','statcan','narula'],
    e:['The pieces are each measured: caffeine six hours before bed still cuts sleep (trial, 2013); alcohol fragments the second half of the night (27 studies, 2013); ultra-processed food was 46% of Canadians’ calories in 2015 (Statistics Canada), and a 2021 study of 116,000 people linked heavy intake to bowel inflammation. The “loop” is our way of connecting them — the connection is an argument, not a study.',
       'Chaque maillon est mesuré séparément : la caféine six heures avant le coucher coupe encore le sommeil (essai, 2013); l’alcool fragmente la deuxième moitié de la nuit (27 études, 2013); l’ultra-transformé représentait 46 % des calories des Canadiens en 2015 (Statistique Canada), et une étude de 2021 sur 116 000 personnes relie une forte consommation à l’inflammation de l’intestin. « La boucle », c’est notre façon de relier tout ça — le lien est un raisonnement, pas une étude.']},
  liver:{src:['nihA'],
    e:['Nutrient content and the vitamin A ceiling come from the US National Institutes of Health fact sheet: a 3-ounce serving of beef liver carries about 6,500 mcg of vitamin A; the daily safe ceiling is 3,000 mcg. That is the arithmetic behind “once a week, not daily” and behind “not in pregnancy”.',
       'Les valeurs nutritionnelles et le plafond de vitamine A viennent de la fiche des National Institutes of Health (É.-U.) : une portion de 85 g de foie de bœuf contient environ 6 500 mcg de vitamine A; le plafond quotidien sécuritaire est de 3 000 mcg. C’est le calcul derrière « une fois par semaine, pas tous les jours » et derrière « pas pendant la grossesse ».']},
  sweeteners:{src:['lenhart','suez'],
    e:['A 2017 review covers how sugar alcohols pull water into the gut and ferment, with diarrhea rising with the dose in feeding studies. A 2022 randomized trial (120 people): sucralose and saccharin changed gut bacteria and blood-sugar responses — not diarrhea. So: solid for sugar alcohols, thin for sucralose. “Read the label, test a week” is the practical conclusion.',
       'Une revue de 2017 décrit comment les alcools de sucre attirent l’eau dans l’intestin et fermentent, avec une diarrhée qui augmente avec la dose dans les études d’alimentation. Un essai randomisé de 2022 (120 personnes) : le sucralose et la saccharine modifiaient les bactéries intestinales et la réponse glycémique — pas de diarrhée. Donc : solide pour les alcools de sucre, mince pour le sucralose. « Lis l’étiquette, teste une semaine », c’est la conclusion pratique.']},
  apnea:{src:['aasm','stop'],
    e:['The American Academy of Sleep Medicine guideline (2017) describes exactly this picture — unrested, fatigued, sleepy — and says loud snoring, witnessed pauses or gasping, and high blood pressure mark the people who need testing; a home sleep test is accepted for most adults. The snoring/tired/observed/pressure questions come from a validated screening tool (2,467 patients, 2008). Questionnaires can’t diagnose it — the test can.',
       'Le guide de l’American Academy of Sleep Medicine (2017) décrit exactement ce tableau — réveil non reposé, fatigue, somnolence — et dit que ronflement fort, pauses ou suffocations observées et hypertension désignent ceux qui doivent passer le test; le test de sommeil à la maison est accepté pour la plupart des adultes. Les quatre questions (ronflement, fatigue, pauses observées, pression) viennent d’un outil de dépistage validé (2 467 patients, 2008). Un questionnaire ne peut pas poser le diagnostic — le test, oui.']},
  pill:{src:['nhsPill'],
    e:['NHS patient guidance for the combined pill: diarrhoea over 24 hours or vomiting within 3 hours can stop it being absorbed; extra contraception until 7 days after. The psyllium-spacing rule is the general one for bulk fibre and medications. Not a trial — a national health service’s standing advice.',
       'Conseils du NHS pour la pilule combinée : une diarrhée de plus de 24 heures ou un vomissement dans les 3 heures peut empêcher l’absorption; contraception supplémentaire jusqu’à 7 jours après. La règle d’espacement du psyllium est la règle générale entre fibres et médicaments. Ce n’est pas un essai clinique — c’est la consigne officielle d’un système de santé public.']},
  lithium:{src:['lithiumLabel','lithCaf'],
    e:['Straight from the FDA prescribing information for lithium: dehydration from sweating or diarrhea and sodium depletion raise lithium toxicity risk; patients are told to keep a normal salt diet and stay hydrated, and sodium restriction is to be avoided. Label-level evidence — about as settled as drug information gets. Caffeine: a small study (11 patients, Mester 1995) found lithium levels rose about 24% when caffeine was stopped, and case reports since — the most recent in 2024 — describe toxic levels after a sudden cut. Small numbers, consistent direction.',
       'Tiré directement de la monographie FDA du lithium : la déshydratation par la sueur ou la diarrhée et le manque de sodium augmentent le risque de toxicité; on dit aux patients de garder une alimentation normale en sel, de rester hydratés et d’éviter de restreindre le sodium. Une preuve de niveau monographie — difficile de faire plus établi pour un médicament. Caféine : une petite étude (11 patients, Mester 1995) a trouvé que le lithium montait d’environ 24 % à l’arrêt de la caféine, et des cas rapportés depuis — le plus récent en 2024 — décrivent des taux toxiques après une coupure soudaine. Peu de monde, mais toujours dans le même sens.']},
  nicotine:{src:['nicoretteLabel'],
    e:['The hiccups-heartburn-nausea list is on the FDA label for nicotine gum (use one piece after another and “this may cause you hiccups, heartburn, nausea”); product monographs add stomach discomfort and say swallowed nicotine is the cause. Pouches and chew deliver the same nicotine; nobody has trialled the “after food, spit” rule, so: likely.',
       'La liste hoquet–brûlures–nausées est sur l’étiquette FDA de la gomme de nicotine (prendre une gomme après l’autre « peut causer hoquet, brûlures d’estomac, nausées »); les monographies ajoutent l’estomac dérangé et mettent en cause la nicotine avalée. Les sachets et la chique libèrent la même nicotine; personne n’a testé la règle « après le repas, crache », donc : probable.']},
  sedative:{src:['fdaBenzo','imovanePMI'],
    e:['The FDA’s 2020 Drug Safety Communication, which updated the boxed warning on every benzodiazepine, warns of severe respiratory depression and death with other CNS depressants and tells patients: “do not drink alcohol with benzodiazepines.” The Health Canada–approved patient sheet for Imovane (zopiclone) lists alcohol among the combinations that can lead to overdose or death and tells patients not to drink while taking it. Regulator and label level — as settled as drug information gets.',
       'La communication de sécurité de la FDA de 2020, qui a mis à jour l’avertissement encadré de toutes les benzodiazépines, prévient d’une dépression respiratoire grave et de décès avec d’autres dépresseurs du système nerveux et dit aux patients de ne pas boire d’alcool avec ces médicaments. La feuille d’information patient d’Imovane (zopiclone) approuvée par Santé Canada place l’alcool parmi les combinaisons qui peuvent mener à une surdose ou à la mort et dit de ne pas boire pendant le traitement. Niveau régulateur et monographie — difficile de faire plus établi.']},
  sedhang:{src:['hcZop','imovanePMI'],
    e:['Health Canada’s November 2014 safety letter (with Sanofi) cut the recommended zopiclone starting dose to 3.75 mg, capped it at 5 mg for older adults, said next-day impairment can be present even when the person feels fully awake, and told patients to wait at least 12 hours after a dose before driving. The current patient sheet adds alcohol and other sedatives as things that make it worse. Regulator level.',
       'La lettre de sécurité de Santé Canada de novembre 2014 (avec Sanofi) a réduit la dose de départ recommandée de zopiclone à 3,75 mg, l’a plafonnée à 5 mg chez les aînés, a précisé que les effets du lendemain peuvent être présents même quand la personne se sent tout à fait réveillée, et a dit d’attendre au moins 12 heures après une dose avant de conduire. La feuille patient actuelle ajoute l’alcool et les autres sédatifs comme facteurs aggravants. Niveau régulateur.']},
  stimwear:{src:['dexPI','pdrDex','vyvanse'],
    e:['Timings are label-level: the Dexedrine prescribing information reports a plasma half-life of about 12 hours and a Spansule peak around 8 hours; the PDR dosing summary gives 4-to-6-hour intervals for the tablets, about 8 for the capsules, and a last dose at least 6 hours before bedtime; the Vyvanse label measured effect up to 13–14 hours. “Eat before the pill” is the labels’ appetite-loss warning turned into a habit, not a trial result.',
       'Les durées viennent des monographies : le feuillet de Dexedrine rapporte une demi-vie d’environ 12 heures et un pic de la Spansule vers 8 heures; le résumé posologique du PDR donne des intervalles de 4 à 6 heures pour les comprimés, environ 8 pour les capsules, et une dernière dose au moins 6 heures avant le coucher; la monographie du Vyvanse a mesuré l’effet jusqu’à 13–14 heures. « Manger avant la pilule », c’est l’avertissement de perte d’appétit des monographies transformé en habitude, pas un résultat d’essai.']},
  cafclock:{src:['efsa','drake','hcCaf'],
    e:['The European food-safety authority’s 2015 opinion gives caffeine’s adult half-life range (it varies a lot between people, roughly 2 to 8 hours) and the 400 mg/day ceiling; a 2013 randomized study found 400 mg taken six hours before bed still cut measured sleep by more than an hour; Health Canada sets the same 400 mg adult limit. Withdrawal headache after a missed dose is a recognized syndrome. “Same total, earlier” hasn’t been trialled — it’s the half-life applied.',
       'L’avis 2015 de l’autorité européenne de sécurité des aliments donne la plage de demi-vie de la caféine chez l’adulte (ça varie beaucoup d’une personne à l’autre, environ 2 à 8 heures) et le plafond de 400 mg par jour; une étude randomisée de 2013 a trouvé que 400 mg pris six heures avant le coucher coupaient encore le sommeil mesuré de plus d’une heure; Santé Canada fixe la même limite adulte de 400 mg. Le mal de tête de sevrage après une dose manquée est un syndrome reconnu. « Même total, plus tôt » n’a pas été testé — c’est la demi-vie appliquée.']},
  rectal:{src:['nice12','bsg2021'],
    e:['NICE guideline NG12 (suspected cancer: recognition and referral, updated 2023): a two-week suspected-cancer referral at 50 and over with unexplained rectal bleeding, and consider one under 50 when bleeding comes with abdominal pain, a change in bowel habit, weight loss or iron-deficiency anaemia. The British iron-deficiency guideline (2021) treats blood loss as the first cause to rule out. “Usually curable when caught early” is the standard survival picture for early-stage bowel cancer, not a figure from one trial.',
       'Guide NICE NG12 (cancer suspecté : reconnaissance et référence, mis à jour en 2023) : référence urgente pour suspicion de cancer, en moins de deux semaines, à 50 ans et plus avec un saignement rectal inexpliqué, et à envisager sous 50 ans quand le saignement vient avec des douleurs abdominales, un changement dans la façon d’aller à la selle, une perte de poids ou une anémie ferriprive. Le guide britannique sur le manque de fer (2021) traite la perte de sang comme la première cause à écarter. « Se guérit généralement quand c’est attrapé tôt », c’est le portrait standard de survie du cancer de l’intestin à un stade précoce, pas un chiffre tiré d’un seul essai.']},
  drinks:{src:['ccsa'],
    e:['Canada’s Guidance on Alcohol and Health (Canadian Centre on Substance Use and Addiction, 2023): the standard drink, the weekly risk zones and the 2-a-day line. It replaced the 2011 low-risk guidelines (10 a week for women, 15 for men). The zones are population risk estimates, not a personal prediction.',
       'Repères canadiens sur l’alcool et la santé (Centre canadien sur les dépendances et l’usage de substances, 2023) : la consommation standard, les zones de risque par semaine et la ligne de 2 par jour. Ils remplacent les directives de 2011 (10 par semaine pour les femmes, 15 pour les hommes). Les zones sont des estimations de risque dans la population, pas une prédiction personnelle.']},
  copper:{src:['nihCu','hcEl','cnf'],
    e:['Needs (900 mcg; 1,000 in pregnancy, 1,300 breastfeeding) and the 10 mg ceiling are Health Canada’s DRI values. The NIH fact sheet covers sources — beef liver about 12 mg per 3 oz — and the zinc–copper interaction: high zinc intakes reduce copper absorption and have caused deficiency with anemia and nerve damage.',
       'Les besoins (900 mcg; 1 000 durant la grossesse, 1 300 durant l’allaitement) et le plafond de 10 mg viennent des ANREF de Santé Canada. La fiche des NIH couvre les sources — environ 12 mg dans 3 oz de foie de bœuf — et l’interaction zinc–cuivre : un apport élevé en zinc réduit l’absorption du cuivre et a causé des manques avec anémie et atteinte des nerfs.']},
  lactose:{src:['efsaLact','nihLact'],
    e:['The European Food Safety Authority’s 2010 review found that most people with lactose maldigestion tolerate about 12 g of lactose in a single dose with no or minor symptoms, and more when it’s spread across the day — 20 to 24 g in the studies it reviewed. 24 g at once usually brings symptoms, and some people react to less than 6 g. The lactose check in your patterns uses those lines: 12 g in one serving or over 24 g in a day, against days under 6 g. Typical lactose amounts are used where the Canadian Nutrient File has none (ice cream, chocolate milk, cream, whey); aged cheese and butter are near zero.',
       'La revue de 2010 de l’Autorité européenne de sécurité des aliments a trouvé que la plupart des gens qui digèrent mal le lactose tolèrent environ 12 g en une seule dose, avec peu ou pas de symptômes, et plus si c’est réparti dans la journée — de 20 à 24 g dans les études qu’elle a examinées. 24 g d’un coup donnent habituellement des symptômes, et certaines personnes réagissent à moins de 6 g. La vérification du lactose dans tes tendances utilise ces seuils : 12 g dans une portion ou plus de 24 g dans la journée, contre les jours à moins de 6 g. Des quantités typiques sont utilisées là où le Fichier canadien n’en a pas (crème glacée, lait au chocolat, crème, lactosérum); le fromage vieilli et le beurre sont près de zéro.']},
  gluten:{src:['celiacCan'],
    e:['Celiac Canada and gastroenterology guidance: test (tTG-IgA with total IgA) before any gluten-free trial, because a gluten-free diet can make the blood test and the biopsy falsely negative.',
       'Cœliaque Canada et les guides de gastro-entérologie : faire le test (tTG-IgA avec IgA totales) avant tout essai sans gluten, parce qu’une diète sans gluten peut rendre la prise de sang et la biopsie faussement négatives.']},
  stores:{src:['nihB12','nihFol','nihB1','nihZn','nihC','nihK','nihA'],
    e:['Amounts and timescales come from the NIH Office of Dietary Supplements fact sheets: B12 stores of about 1–5 mg can last years after intake stops; folate stores of 15–30 mg, about half in the liver; thiamine is stored only in small amounts and turns over in weeks; there is no specialized zinc store; vitamin C deficiency signs can appear within a month of very low intake; vitamin K has small, fast-turning stores. Exact durations depend on starting stores, absorption and losses — so these are ranges, not countdowns.',
       'Les quantités et les délais viennent des fiches de l’Office of Dietary Supplements des NIH : les réserves de B12, environ 1 à 5 mg, peuvent durer des années après l’arrêt de l’apport; les réserves de folate, 15 à 30 mg, dont environ la moitié dans le foie; la thiamine n’est stockée qu’en petite quantité et se renouvelle en quelques semaines; il n’y a pas de réserve spécialisée de zinc; les signes de manque de vitamine C peuvent apparaître en un mois d’apport très bas; la vitamine K a de petites réserves qui se renouvellent vite. Les durées exactes dépendent des réserves de départ, de l’absorption et des pertes — ce sont des fourchettes, pas des comptes à rebours.']},
  tank:{src:['hcEl','hcVit','cnf','usdaSR','morck','sportsProt'],
    e:['Reference values: Health Canada’s DRI tables for elements (calcium, iron, magnesium, zinc, potassium, sodium — the 2019 potassium/sodium update is noted on the page) and vitamins (C with the +35 mg smoker footnote, thiamin, folate, B12, D). Food values: the Canadian Nutrient File 2015 CSV release, per 100 g, scaled to our servings. Blanks: the USDA National Nutrient Database for Standard Reference, release 28 — the database the Canadian file copied many entries from — for the same food where it has the number, else the same food prepared another way, else the closest food; 68 numbers in 31 foods. One USDA number was replaced: the plain bagel’s 7.46 mg of vitamin E per 100 g, impossible with 1.3 g of fat; its twin entry gives 0.12. Left blank: protein bars, sugar-free candy and ready-to-drink shakes (the label decides), and the selenium in hemp hearts (it depends on the soil). The coffee note is the 1983 dual-isotope trial (coffee −39%, tea −64%, no effect an hour before the meal). The protein range above the floor is the 2016 joint position of Dietitians of Canada, the Academy of Nutrition and Dietetics and the ACSM (1.2–2.0 g/kg for athletes). The bands and the calorie factors are ours.',
       'Valeurs de référence : les tables d’ANREF de Santé Canada pour les éléments (calcium, fer, magnésium, zinc, potassium, sodium — la mise à jour 2019 potassium/sodium est notée sur la page) et les vitamines (C avec la note +35 mg pour fumeurs, thiamine, folate, B12, D). Valeurs des aliments : la version CSV 2015 du Fichier canadien sur les éléments nutritifs, par 100 g, ramenée à nos portions. Données manquantes : la base de données de référence de l’USDA (SR, version 28) — d’où le fichier canadien a copié bien des entrées — pour le même aliment quand elle a le chiffre, sinon le même aliment préparé autrement, sinon l’aliment le plus proche; 68 chiffres dans 31 aliments. Un chiffre de l’USDA a été remplacé : les 7,46 mg de vitamine E par 100 g du bagel nature, impossibles avec 1,3 g de gras; l’entrée jumelle donne 0,12. Restent sans valeur : les barres protéinées, les bonbons sans sucre et les shakes prêts à boire (c’est l’étiquette qui fait foi), et le sélénium des cœurs de chanvre (ça dépend du sol). La note sur le café vient de l’essai à double isotope de 1983 (café −39 %, thé −64 %, aucun effet une heure avant le repas). La fourchette de protéines au-dessus du plancher vient de la position conjointe 2016 des Diététistes du Canada, de l’Academy of Nutrition and Dietetics et de l’ACSM (1,2–2,0 g/kg pour les athlètes). Les bandes et les facteurs de calories sont les nôtres.']},
  manganese:{src:['nihMn','hcEl','cnf'],
    e:['Roles, needs (adequate intake 2.3 mg men, 1.8 mg women, 2.0 mg pregnancy), the 11 mg upper limit, rarity of deficiency, and toxicity from inhalation and well water: the US NIH manganese fact sheet, matching Health Canada’s DRI table. Food values: the Canadian Nutrient File.',
       'Rôles, besoins (apport suffisant 2,3 mg hommes, 1,8 mg femmes, 2,0 mg grossesse), la limite supérieure de 11 mg, la rareté du manque, et la toxicité par inhalation et eau de puits : la fiche manganèse des NIH (É.-U.), concordante avec la table des ANREF de Santé Canada. Valeurs des aliments : le Fichier canadien sur les éléments nutritifs.']},
  vitamina:{src:['nihA','hcVit','feskanich'],
    e:['Symptoms, the preformed-only ceiling, pregnancy risk and beta-carotene’s harmlessness: the US NIH vitamin A fact sheet and Health Canada’s DRI table (UL 3,000 mcg, “as preformed vitamin A only”). Hip fractures: the Nurses’ Health Study (72,337 women, 18 years, JAMA 2002) — the highest retinol intakes had about 1.9 times the hip-fracture risk; that’s an association in one cohort, not proof, and beta-carotene showed no clear effect.',
       'Symptômes, plafond pour la forme préformée seulement, risque pendant la grossesse et innocuité du bêta-carotène : la fiche vitamine A des NIH (É.-U.) et la table des ANREF de Santé Canada (AMT 3 000 mcg, « vitamine A préformée seulement »). Fractures de la hanche : la Nurses’ Health Study (72 337 femmes, 18 ans, JAMA 2002) — les apports de rétinol les plus élevés avaient environ 1,9 fois le risque de fracture de la hanche; c’est une association dans une cohorte, pas une preuve, et le bêta-carotène n’a pas montré d’effet clair.']},
  veg:{src:['nihB12','nihFe','nihZn','nihI','nihO3'],
    e:['All from the US National Institutes of Health fact sheets, which use the same reference intakes as Health Canada. B12: naturally only in animal foods; vegans need fortified foods or supplements, and babies breastfed by vegan mothers can run out within months of birth. Iron: the recommended intake for vegetarians is 1.8 times higher, because plant iron absorbs less. Zinc: vegetarians may need as much as 50% more. Iodine: people who avoid dairy, seafood and eggs and don’t use iodized salt are at risk. Omega-3: the body converts only a small share of plant ALA to EPA and DHA. The app doesn’t raise the iron target in pregnancy — that number is already high, and prescribed iron is the usual answer there.',
       'Tout vient des fiches des National Institutes of Health (É.-U.), qui utilisent les mêmes apports de référence que Santé Canada. B12 : naturellement seulement dans les aliments animaux; les véganes ont besoin d’aliments enrichis ou de suppléments, et les bébés allaités par une mère végane peuvent en manquer quelques mois après la naissance. Fer : l’apport recommandé pour les végétariens est 1,8 fois plus élevé, parce que le fer des plantes s’absorbe moins bien. Zinc : les végétariens peuvent avoir besoin de jusqu’à 50 % de plus. Iode : les gens qui évitent les produits laitiers, les fruits de mer et les œufs et n’utilisent pas de sel iodé sont à risque. Oméga-3 : le corps ne convertit qu’une petite part de l’ALA des plantes en EPA et DHA. L’app ne monte pas la cible de fer pendant la grossesse — ce chiffre est déjà haut, et le fer prescrit est la réponse habituelle.']},
  pp:{src:['ataPPT','milmanPPA','smh2019','wisner2013'],
    e:['Thyroid: the American Thyroid Association — the slow phase usually comes 4 to 8 months after delivery and can last up to a year; about 20% who go slow stay slow. Reviews put postpartum thyroiditis at about 7% of births on average (studies range from 1 to 17%). Iron: a 2011 review — one week after a normal delivery, 14% of women who took iron in pregnancy were anemic, and 24% of those who didn’t; in European series about half are anemic 48 hours after delivery. The “1 in 14” is that 7% average, not a promise for any one person. Mood: Statistics Canada’s 2018–19 Survey on Maternal Health found 23% of mothers reported feelings consistent with postpartum depression, an anxiety disorder or both, 5 to 13 months after the birth. A US screening of 10,000 mothers (2013) found 14% screened positive on the EPDS at 4–6 weeks. Screens, not diagnoses — which is why the next step is a person.',
       'Thyroïde : l’American Thyroid Association — la phase lente arrive habituellement de 4 à 8 mois après l’accouchement et peut durer jusqu’à un an; environ 20 % de celles qui ralentissent restent au ralenti. Les revues situent la thyroïdite post-partum autour de 7 % des naissances en moyenne (les études vont de 1 à 17 %). Fer : une revue de 2011 — une semaine après un accouchement normal, 14 % des femmes qui avaient pris du fer pendant la grossesse étaient anémiques, et 24 % de celles qui n’en avaient pas pris; dans des séries européennes, environ la moitié le sont 48 heures après l’accouchement. Le « 1 sur 14 », c’est cette moyenne de 7 %, pas une promesse pour une personne en particulier. Le moral : l’Enquête sur la santé maternelle 2018–2019 de Statistique Canada a trouvé que 23 % des mères avaient des sentiments correspondant à une dépression post-partum, à un trouble anxieux ou aux deux, de 5 à 13 mois après l’accouchement. Un dépistage de 10 000 mères aux É.-U. (2013) : 14 % positives à l’EPDS à 4–6 semaines. Des dépistages, pas des diagnostics — c’est pour ça que la prochaine étape, c’est une personne.']},
  prenatal:{src:['phacFolic','fgSupp','phacPreg','phacNTD','ahsGummy'],
    e:['Health Canada and the Public Health Agency of Canada: a daily multivitamin with 0.4 mg folic acid for anyone who could become pregnant, is pregnant or is breastfeeding, and 16–20 mg of iron in pregnancy; no more than 1 mg of folic acid a day unless a doctor advises it. Folic acid’s protection against neural tube defects is among the best-established findings in nutrition — Canada has fortified white flour since 1998, and the rate of these defects fell. Alberta Health Services: most gummy multivitamins don’t have enough iron. Checked 5 Nov 2026.',
       'Santé Canada et l’Agence de la santé publique du Canada : une multivitamine avec 0,4 mg d’acide folique chaque jour pour toute personne qui pourrait tomber enceinte, qui est enceinte ou qui allaite, et de 16 à 20 mg de fer pendant la grossesse; pas plus de 1 mg d’acide folique par jour sans l’avis d’un médecin. La protection de l’acide folique contre les anomalies du tube neural est un des résultats les mieux établis en nutrition — le Canada enrichit la farine blanche depuis 1998, et le taux de ces anomalies a baissé. Alberta Health Services : la plupart des multivitamines en jujubes n’ont pas assez de fer. Vérifié le 5 nov. 2026.']},
  toomuch:{src:['nihA','nihE','nihC','nihB3','nihB6','efsaB6','nihFol','nihFe','nihZn','nihCu','nihSe','nihMn','nihI','hcEl','hcVit','hcCaf','julianoCaf'],
    e:['Ceilings are Health Canada’s DRI upper limits (Europe’s 2023 B6 limit is named where it differs). The signs of excess come from the US National Institutes of Health fact sheets for each nutrient; magnesium, calcium and potassium signs are the standard ones in those same sheets and drug labels. Caffeine: Health Canada’s limits, and a 2004 review of 66 studies for withdrawal timing (onset 12–24 h, lasting 2–9 days). These are population limits — a few people react below them, and a clinician can prescribe above them on purpose.',
       'Les plafonds sont les apports maximaux tolérables des ANREF de Santé Canada (la limite européenne de 2023 pour la B6 est nommée là où elle diffère). Les signes d’excès viennent des fiches des National Institutes of Health (É.-U.) pour chaque nutriment; ceux du magnésium, du calcium et du potassium sont les signes standards de ces mêmes fiches et des monographies. Caféine : les limites de Santé Canada, et une revue de 66 études (2004) pour le moment du sevrage (début 12–24 h, durée 2–9 jours). Ce sont des limites pour la population — quelques personnes réagissent en dessous, et un clinicien peut prescrire au-dessus exprès.']},
  edrink:{src:['hcCED','hcMix','efsaTau','hcCaf','julianoCaf'],
    e:['Health Canada: the 180 mg-per-serving cap, the mandatory “do not drink more than X per day” line, and limits on added taurine, vitamins and minerals; a 2018 advisory on not mixing caffeinated drinks with alcohol. Sugar and vitamin amounts: Canadian labels in the app’s food list. Taurine and glucuronolactone: EFSA 2009 found no safety concern at regular energy-drink intake, while noting that acute problems reported with large amounts were more likely the caffeine. Withdrawal timing: the 2004 review. US cans such as Celsius list 200 mg or more.',
       'Santé Canada : le plafond de 180 mg par portion, la ligne obligatoire « ne pas boire plus de X par jour », et des limites sur la taurine, les vitamines et les minéraux ajoutés; un avis de 2018 sur le mélange des boissons caféinées avec l’alcool. Quantités de sucre et de vitamines : les étiquettes canadiennes de la liste d’aliments de l’app. Taurine et glucuronolactone : l’EFSA (2009) n’a trouvé aucun problème de sécurité à la consommation régulière, en notant que les problèmes aigus rapportés avec de grosses quantités venaient plus probablement de la caféine. Moment du sevrage : la revue de 2004. Les canettes américaines comme Celsius affichent 200 mg ou plus.']},
  fibre:{src:['hcMac','cnf'],
    e:['The adequate intakes (38/25 g, 30/21 after 50; 28 in pregnancy, 29 breastfeeding) are Health Canada’s, set at 14 g per 1,000 kcal. Food values are from the Canadian Nutrient File. The gas warning is practical experience, not a trial.',
       'Les apports suffisants (38/25 g, 30/21 après 50 ans; 28 durant la grossesse, 29 durant l’allaitement) sont ceux de Santé Canada, fixés à 14 g par 1 000 kcal. Les valeurs des aliments viennent du Fichier canadien sur les éléments nutritifs. L’avertissement sur les gaz, c’est de l’expérience pratique, pas un essai.']},
  bvits:{src:['nihB2','nihB3','hcVit'],
    e:['Needs and the niacin ceiling (35 mg, from supplements and fortified foods; set on flushing from nicotinic acid) are Health Canada’s DRI values; the NIH fact sheets cover sources, the tryptophan conversion, and that niacinamide doesn’t cause flushing. Energy-drink amounts are from Canadian labels.',
       'Les besoins et le plafond de la niacine (35 mg, des suppléments et aliments enrichis; fixé d’après les rougeurs causées par l’acide nicotinique) sont les ANREF de Santé Canada; les fiches des NIH couvrent les sources, la conversion du tryptophane, et le fait que la niacinamide ne fait pas rougir. Les quantités des boissons énergisantes viennent des étiquettes canadiennes.']},
  b6:{src:['nihB6','efsaB6','hcVit'],
    e:['Canada’s 100 mg ceiling is the 1998 DRI value. In 2023 the European Food Safety Authority set 12 mg for adults, including pregnancy, from a review of nerve-damage reports — the reports cluster at long-term supplement use, often at doses well under 100 mg. Two agencies, two numbers: the app shows Canada’s as the bar and mentions Europe’s when pills and drinks pass 12.',
       'Le plafond canadien de 100 mg est la valeur ANREF de 1998. En 2023, l’Autorité européenne de sécurité des aliments a fixé 12 mg pour les adultes, grossesse comprise, après une revue des cas d’atteinte des nerfs — ces cas se regroupent autour de suppléments pris longtemps, souvent à des doses bien sous 100 mg. Deux agences, deux chiffres : l’app montre celui du Canada comme barre et mentionne celui de l’Europe quand pilules et boissons dépassent 12.']},
  selenium:{src:['nihSe','hcEl','cnf'],
    e:['Needs (55 mcg; 60 in pregnancy, 70 breastfeeding) and the 400 mcg ceiling are Health Canada’s. The NIH fact sheet gives Brazil nuts at 68–91 mcg each and lists the signs of excess; the Canadian file puts one nut near 95.',
       'Les besoins (55 mcg; 60 durant la grossesse, 70 durant l’allaitement) et le plafond de 400 mcg sont ceux de Santé Canada. La fiche des NIH donne 68 à 91 mcg par noix du Brésil et décrit les signes d’excès; le fichier canadien met une noix près de 95.']},
  vite:{src:['nihE','hcVit'],
    e:['The NIH fact sheet summarizes the trials: no benefit for heart disease or cancer prevention, and the SELECT trial (35,000 men) found 400 IU a day of synthetic vitamin E raised prostate cancer risk by 17%. It also covers the bleeding interaction with anticoagulants. The 15 mg need and the 1,000 mg supplement ceiling are Health Canada’s. In IU (NIH): food E is the natural form, 1 mg = 1.49 IU, so the need is 22 IU (28 breastfeeding); the ceiling is 1,500 IU of natural E or 1,100 IU of synthetic.',
       'La fiche des NIH résume les essais : aucun bénéfice pour prévenir les maladies du cœur ou le cancer, et l’essai SELECT (35 000 hommes) a trouvé que 400 UI par jour de vitamine E synthétique augmentaient le risque de cancer de la prostate de 17 %. Elle couvre aussi l’interaction avec les anticoagulants. Le besoin de 15 mg et le plafond de 1 000 mg en supplément sont ceux de Santé Canada. En UI (NIH) : la E des aliments est la forme naturelle, 1 mg = 1,49 UI, donc le besoin est de 22 UI (28 en allaitant); le plafond est de 1 500 UI de E naturelle ou de 1 100 UI de E synthétique.']},
  coq10:{src:['nccihQ10','tsaiQ10','quQ10','banachQ10'],
    e:['Fatigue: a 2022 meta-analysis of 13 trials (1,126 people) found a small-to-moderate reduction overall; the healthy-people subgroup didn’t reach significance. Statin muscle pain: a 2018 meta-analysis of 12 trials found benefit, a 2015 one of 6 trials didn’t, and the US National Center for Complementary and Integrative Health reads the overall evidence as not supportive. It also flags the warfarin interaction. Hence “worth a try”, not more.',
       'Fatigue : une méta-analyse de 13 essais (1 126 personnes, 2022) a trouvé une baisse petite à modérée dans l’ensemble; le sous-groupe des gens en santé n’était pas significatif. Douleurs des statines : une méta-analyse de 12 essais (2018) a trouvé un bénéfice, une de 6 essais (2015) non, et le centre américain des médecines complémentaires (NCCIH) juge que l’ensemble ne l’appuie pas. Il signale aussi l’interaction avec la warfarine. D’où « ça vaut l’essai », pas plus.']},
  iodine:{src:['nihI','hcEl'],
    e:['Needs: Health Canada’s DRI table — 150 mcg/day for adults, 220 in pregnancy, upper limit 1,100. Sources and risks: the US National Institutes of Health fact sheet — seaweed, fish, dairy, eggs and iodized salt; processed foods almost always use non-iodized salt; sea, kosher and Himalayan salt usually aren’t iodized; people who avoid dairy, seafood, eggs or iodized salt are at risk; both too little and too much can cause thyroid problems. About 78 mcg per quarter teaspoon of iodized salt is the US figure; Canadian salt is iodized at a similar level.',
       'Besoins : la table des ANREF de Santé Canada — 150 mcg/jour pour les adultes, 220 pendant la grossesse, limite supérieure 1 100. Sources et risques : la fiche des National Institutes of Health (É.-U.) — algues, poisson, produits laitiers, œufs et sel iodé; la bouffe transformée utilise presque toujours du sel non iodé; le sel de mer, casher et de l’Himalaya n’est généralement pas iodé; ceux qui évitent les produits laitiers, les fruits de mer, les œufs ou le sel iodé sont à risque; trop peu comme trop peut causer des problèmes de thyroïde. Environ 78 mcg par quart de cuillère à thé de sel iodé, c’est le chiffre américain; le sel canadien est iodé à un niveau semblable.']},
  vitamink:{src:['nihK','hcVit','cnf'],
    e:['The US National Institutes of Health fact sheet: adequate intake 120 mcg/day for men and 90 mcg/day for women (the same values as Health Canada’s table); matrix Gla protein and osteocalcin are vitamin-K-dependent; observational studies link more K2 with less arterial calcification, but trials are inconclusive — one 3-year trial in older adults found no overall difference in coronary calcification; for bone, the big benefits came from very high-dose Japanese MK-4 trials and later trials were mixed or null. Warfarin users are told to keep intake consistent. Food values are the Canadian Nutrient File, which reports vitamin K mostly as K1.',
       'La fiche des National Institutes of Health (É.-U.) : apport suffisant de 120 mcg/jour pour les hommes et 90 mcg/jour pour les femmes (les mêmes valeurs que la table de Santé Canada); la protéine Gla matricielle et l’ostéocalcine dépendent de la vitamine K; des études d’observation associent plus de K2 à moins de calcification des artères, mais les essais ne tranchent pas — un essai de 3 ans chez des aînés n’a trouvé aucune différence globale de calcification coronaire; pour l’os, les gros bénéfices venaient d’essais japonais à très forte dose de MK-4, et les essais suivants étaient partagés ou nuls. On dit aux gens sous warfarine de garder un apport constant. Les valeurs des aliments viennent du Fichier canadien sur les éléments nutritifs, qui rapporte surtout la vitamine K1.']},
  sleepstages:{src:['ninds','vancauter','ebrahim','drake','chinoy'],
    e:['The stage descriptions and the 90-minute cycle are the US National Institute of Neurological Disorders and Stroke’s standard summary. Growth hormone and deep sleep: a JAMA study of healthy men aged 16 to 83 (2000) found deep sleep fell from 18.9% to 3.4% of the night between early adulthood and midlife, with growth hormone falling alongside it and tracking deep sleep at every age. Alcohol: a review of 27 studies (2013) — faster sleep onset, more disrupted second half, less REM. Caffeine: a 2013 randomized study. Calling deep sleep “repair” is a simplification — growth hormone release is measured; the brain “cleaning” idea comes from mouse work and is still argued over, so it isn’t claimed here.',
       'Les descriptions des stades et le cycle de 90 minutes viennent du résumé standard de l’Institut national américain des troubles neurologiques (NINDS). Hormone de croissance et sommeil profond : une étude du JAMA chez des hommes en santé de 16 à 83 ans (2000) a trouvé que le sommeil profond tombait de 18,9 % à 3,4 % de la nuit entre le début de l’âge adulte et le milieu de la vie, l’hormone de croissance baissant en parallèle et suivant le sommeil profond à tous les âges. Alcool : une revue de 27 études (2013) — endormissement plus rapide, deuxième moitié plus perturbée, moins de REM. Caféine : une étude randomisée de 2013. Appeler le sommeil profond « réparation », c’est une simplification — la libération d’hormone de croissance est mesurée; l’idée du cerveau qui « fait le ménage » vient de travaux chez la souris et est encore débattue, alors on ne l’affirme pas ici.']},
  random:{src:['chinoy'],
    e:['There’s no trial of “random crashes” — this is the standard one-variable-at-a-time method (the same logic as an elimination diet), applied to energy. The tracker advice comes from a 2021 study of seven consumer sleep trackers against a sleep lab: most detected sleep well and matched research-grade wrist devices, but their sleep-stage numbers were inconsistent. Hence: trust the hours, not the “deep sleep”.',
       'Il n’existe pas d’essai sur les « crashs aléatoires » — c’est la méthode standard d’une variable à la fois (la même logique qu’une diète d’élimination), appliquée à l’énergie. Le conseil sur le traqueur vient d’une étude de 2021 sur sept traqueurs de sommeil grand public comparés à un laboratoire du sommeil : la plupart détectaient bien le sommeil, au niveau des appareils de recherche portés au poignet, mais leurs chiffres de stades de sommeil étaient incohérents. D’où : fie-toi aux heures, pas au « sommeil profond ».']},
  leak:{src:['bsg2021','ebrahim'],
    e:['A framing, backed piece by piece: blood loss is the leading cause of iron deficiency (UK guideline 2021); loose stools lose minerals (basic physiology); alcohol near bedtime fragments sleep (27 studies, 2013). The order “plug first, add second” is common sense, not a trial.',
       'Un principe, appuyé pièce par pièce : la perte de sang est la première cause de manque de fer (guide britannique 2021); les selles molles font perdre des minéraux (physiologie de base); l’alcool proche du coucher fragmente le sommeil (27 études, 2013). L’ordre « colmater d’abord, ajouter ensuite », c’est du gros bon sens, pas un essai.']},
  selftest:{src:[],
    e:['Changing one thing in one person, with a before, a during and a return, is the logic of an N-of-1 trial. A real N-of-1 trial adds blinding and repeats; this one can’t, so expectation and everything else that changes in two weeks can fool it. The odds come from a simple binomial model of bad days.',
       'Changer une seule chose chez une seule personne, avec un avant, un pendant et un retour, c’est la logique d’un essai N-de-1. Un vrai essai N-de-1 se fait à l’insu et se répète; celui-ci ne peut pas, alors les attentes et tout ce qui change en deux semaines peuvent le fausser. Les chances viennent d’un simple modèle binomial des mauvaises journées.']},
  goalsq:{src:['magill14','pace17','magill18'],
    e:['In motivational-interviewing research, what people say for staying the same (“sustain talk”) predicts worse outcomes: r = −0.24 across studies in the first meta-analysis (Magill 2014), confirmed in two more (Pace 2017, Magill 2018). What people say for changing, on its own, didn’t reliably predict better outcomes; the share of change talk did (Magill 2018). Those were counselling sessions, mostly about drinking and drugs, not a question in an app — so asking goals first is a reasoned bet, not a tested one.',
       'Dans la recherche sur l’entretien motivationnel, ce que les gens disent pour rester pareils (le « discours de maintien ») prédit de moins bons résultats : r = −0,24 dans la première méta-analyse (Magill 2014), confirmé dans deux autres (Pace 2017, Magill 2018). Ce que les gens disent pour changer, à lui seul, n’a pas prédit de façon fiable de meilleurs résultats; la proportion de discours de changement, oui (Magill 2018). C’étaient des séances de counseling, surtout sur l’alcool et la drogue, pas une question dans une app — alors demander les objectifs d’abord, c’est un pari raisonné, pas testé.']},
  wlplan:{src:['dietfits','gibson15','hall21','bostock20','geijer15','mistry21','golden16','levinson17','hahn21'],
    e:['Low-carb or low-fat: at 12 months, a healthy low-fat diet lost 5.3 kg and a healthy low-carb diet 6.0 kg — no real difference, with people in both groups ranging from 30 kg lost to 10 kg gained (DIETFITS, 609 adults). Ketogenic diets lowered hunger a little and stopped it rising during weight loss (Gibson 2015, meta-analysis). But when 20 people ate as much as they wanted for two weeks each, they ate about 690 calories a day more on an animal-based keto diet than on a low-fat plant diet, with similar hunger (Hall 2021) — so whole food and protein are the common thread, not ketosis itself. The low-carb road’s first weeks: in reports from 101 people, flu-like symptoms, headache, fatigue, nausea and fog peaked in week 1 and faded by week 4 (Bostock 2020). Rails: strict low-carb while breastfeeding has caused ketoacidosis in case reports (von Geijer 2015, one of about ten), and with SGLT2 diabetes pills (Mistry 2021); in teens, dieting is the strongest predictor of an eating disorder (AAP, Golden 2016); 73% of people with an eating disorder who used a calorie tracker felt it contributed (Levinson 2017), while a month of tracking did no harm to 200 women without one (Hahn 2021, randomized). The calorie floor (1,200 / 1,500, or 70% of need) and “3,500 calories a pound” are rules of thumb, not trial results — the weekly weigh-in is what corrects them.',
       'Faible en glucides ou faible en gras : après 12 mois, une alimentation saine faible en gras a fait perdre 5,3 kg et une saine faible en glucides, 6,0 kg — pas de vraie différence, et dans les deux groupes, ça allait de 30 kg perdus à 10 kg gagnés (DIETFITS, 609 adultes). Les diètes cétogènes ont baissé un peu la faim et l’ont empêchée de monter pendant la perte de poids (Gibson 2015, méta-analyse). Mais quand 20 personnes ont mangé autant qu’elles voulaient pendant deux semaines chacune, elles ont mangé environ 690 calories de plus par jour avec une diète céto à base animale qu’avec une diète végétale faible en gras, avec une faim semblable (Hall 2021) — alors le fil commun, ce sont les aliments entiers et les protéines, pas la cétose elle-même. Les premières semaines du chemin faible en glucides : dans les témoignages de 101 personnes, des symptômes de grippe, des maux de tête, de la fatigue, de la nausée et du brouillard culminaient la première semaine et disparaissaient vers la quatrième (Bostock 2020). Les garde-fous : un régime très faible en glucides pendant l’allaitement a causé des acidocétoses dans des rapports de cas (von Geijer 2015, un d’une dizaine), et avec les pilules pour le diabète de la famille des SGLT2 (Mistry 2021); chez les ados, la diète est le plus fort prédicteur d’un trouble alimentaire (AAP, Golden 2016); 73 % des personnes avec un trouble alimentaire qui utilisaient un compteur de calories trouvaient qu’il y contribuait (Levinson 2017), alors qu’un mois de suivi n’a fait aucun tort à 200 femmes sans trouble (Hahn 2021, essai randomisé). Le plancher de calories (1 200 / 1 500, ou 70 % du besoin) et « 3 500 calories par livre » sont des règles approximatives, pas des résultats d’essais — c’est la pesée de chaque semaine qui les corrige.']},
  cleanstart:{src:['sanchez21','ribeiro26','michalski21','kaniou01','cfia14'],
    e:['Low-histamine diets disagree: across ten published lists, only fermented foods were excluded by all of them, and only 32% of the excluded foods had high measured histamine (Sánchez-Pérez 2021). So the clean start cuts the foods with measured histamine — aged cheese, cured meat, canned or smoked fish, fermented foods, leftovers — and lactose, and leaves the rest. Meat: beef dry-aged 60 days kept histamine under 5 mg/kg inside the meat (Ribeiro 2026), while long-ripened cured meats ran up to 346 mg/kg (dry ham; Michalski 2021); vacuum-packed beef reached 19 mg/kg at 35 days (Kaniou 2001). Pumped chicken: Canadian rules exempt single-ingredient raw meat from an ingredient list, but not meat with phosphates or water added (CFIA). Why bring foods back one at a time: in the app’s own simulation, a 7-day bring-back caught a trigger 68% of the time when bad days were rare (5%), and 15% of the time when they were common (20%).',
       'Les diètes faibles en histamine ne s’entendent pas : sur dix listes publiées, seuls les aliments fermentés étaient exclus par toutes, et seulement 32 % des aliments exclus avaient beaucoup d’histamine mesurée (Sánchez-Pérez 2021). Alors, pendant les trois semaines sans les suspects habituels, on coupe les aliments avec de l’histamine mesurée — fromages vieillis, charcuterie, poisson en conserve ou fumé, aliments fermentés, restants — et le lactose, et on garde le reste. La viande : du bœuf vieilli à sec 60 jours a gardé moins de 5 mg/kg d’histamine à l’intérieur de la viande (Ribeiro 2026), alors que des charcuteries à maturation longue montaient jusqu’à 346 mg/kg (jambon sec; Michalski 2021); du bœuf sous vide a atteint 19 mg/kg à 35 jours (Kaniou 2001). Le poulet injecté : les règles canadiennes dispensent la viande crue à un seul ingrédient d’une liste d’ingrédients, mais pas la viande avec des phosphates ou de l’eau ajoutés (ACIA). Pourquoi ramener les aliments un à la fois : dans la simulation de l’app, une semaine de retour a repéré un déclencheur 68 % du temps quand les mauvaises journées étaient rares (5 %), et 15 % du temps quand elles étaient fréquentes (20 %).']},
  muscle:{src:['morton18','burke03','parr14'],
    e:['Protein: in 49 trials (1,863 people), protein beyond about 1.6 g per kg a day added no more muscle from training (Morton 2018). Creatine: in an 8-week training trial, vegetarians — who start with less creatine in their muscles — gained more muscle creatine and lean tissue than meat-eaters (Burke 2003). Alcohol: after training, about 12 drinks with protein cut muscle protein building by 24%, and by 37% with carbohydrate instead of protein (Parr 2014, 8 men) — that was a big night; nobody has measured two beers.',
       'Les protéines : dans 49 essais (1 863 personnes), au-delà d’environ 1,6 g par kg par jour, les protéines n’ajoutaient plus de muscle avec l’entraînement (Morton 2018). La créatine : dans un essai d’entraînement de 8 semaines, les végétariens — qui ont moins de créatine dans leurs muscles au départ — ont gagné plus de créatine musculaire et de masse maigre que ceux qui mangent de la viande (Burke 2003). L’alcool : après l’entraînement, environ 12 verres avec des protéines ont coupé la construction des protéines musculaires de 24 %, et de 37 % avec des glucides au lieu des protéines (Parr 2014, 8 hommes) — c’était une grosse soirée; personne n’a mesuré deux bières.']},
  path:{src:['ahsCeliac','celiacCan','bsg2021','whitfield','maintz'],
    e:['The celiac blood test (tTG-IgA) is only accurate while gluten is in the diet (AHS celiac pathway; Celiac Canada). Iron: hemoglobin recovers within weeks of treatment, but refilling the stores takes about three more months (BSG 2021). Regular drinking raises ferritin, beer more than wine or spirits (Whitfield 2001, 3,375 Australian twins) — so for a daily beer drinker low iron is the less likely answer, and a high ferritin is its own question. Alcohol releases histamine and blocks DAO, the enzyme that breaks down histamine from food (Maintz & Novak 2007) — so cutting histamine foods while keeping the drinks leaves the blocker in place. The order itself is reasoning, not a trial. On 27 runs of ten made-up people over 12 weeks, in the real app: no drink or energy drink was named by the app before the basics and the blood work. The woman whose bad days came from a skipped lunch, coffee after 3 p.m. and one huge dinner was never sent for blood work, and nothing got blamed (3 of 3). The woman with low iron had her weekend beers left alone while the iron was treated (3 of 3). The daily beer drinker was offered the drinks first at step 3 in 5 of 5 runs; the energy-drink drinker who rarely logged her cans got the energy drinks in 3 of 3, from the check-in count. The two whose drinks changed nothing were never offered them (4 of 4).',
       'Le test sanguin de la maladie cœliaque (tTG-IgA) est fiable seulement si l’alimentation contient du gluten (trajectoire cœliaque d’AHS; Cœliaque Canada). Le fer : l’hémoglobine remonte en quelques semaines de traitement, mais remplir les réserves prend environ trois mois de plus (BSG 2021). Boire régulièrement fait monter la ferritine, la bière plus que le vin ou les spiritueux (Whitfield 2001, 3 375 jumeaux australiens) — alors chez quelqu’un qui boit de la bière tous les jours, un manque de fer est la réponse la moins probable, et une ferritine élevée est une question en soi. L’alcool libère de l’histamine et bloque la DAO, l’enzyme qui défait l’histamine des aliments (Maintz & Novak 2007) — alors couper les aliments riches en histamine en gardant l’alcool laisse le bloqueur en place. L’ordre lui-même est un raisonnement, pas un essai. Sur 27 essais de dix personnes inventées pendant 12 semaines, dans la vraie app : aucun verre ni aucune boisson énergisante n’a été nommé par l’app avant la base et la prise de sang. La femme dont les mauvaises journées venaient d’un dîner sauté, du café après 15 h et d’un énorme souper n’a jamais été envoyée en prise de sang, et rien n’a été blâmé (3 sur 3). La femme qui manquait de fer a gardé ses bières de fin de semaine pendant qu’on traitait le fer (3 sur 3). Le buveur de bière quotidien s’est fait proposer l’alcool en premier à l’étape 3 dans 5 essais sur 5; la buveuse de boissons énergisantes qui notait rarement ses canettes a eu les boissons énergisantes dans 3 sur 3, grâce au compte du bilan. Les deux dont l’alcool ou les boissons ne changeaient rien ne se les sont jamais fait proposer (4 sur 4).']},
  hours:{src:['nihLact','ebert2016','maintz'],
    e:['The windows: lactose symptoms come 30 minutes to 2 hours after (NIDDK); unabsorbed fructose causes symptoms once it reaches the large bowel and ferments (Ebert 2016); histamine reactions come within minutes to a few hours (Maintz & Novak 2007). The 4-hour crash window is the one the crash report already uses. The lead rule is the suspects’ rule; on simulated people with no food effect, 4% got a lead from the hours (4% from the day counts). With afternoon crashes coming only after sweets at lunch, and sweets at breakfast most days too, the hours found it for 48% of people by six weeks; the day counts, which can’t see the time, for 1%.',
       'Les fenêtres : les symptômes du lactose arrivent de 30 minutes à 2 heures après (NIDDK); le fructose non absorbé cause des symptômes quand il atteint le gros intestin et fermente (Ebert 2016); les réactions à l’histamine arrivent de quelques minutes à quelques heures après (Maintz & Novak 2007). La fenêtre de 4 heures pour les crashs est celle que le rapport de crash utilise déjà. La règle est celle des suspects; sur des personnes simulées sans aucun effet des aliments, 4 % ont eu une piste par les heures (4 % par les journées). Avec des crashs d’après-midi qui suivent seulement les sucreries au dîner, et des sucreries au déjeuner presque tous les jours aussi, l’analyse par heure l’a trouvé chez 48 % des gens en six semaines; l’analyse par journée, qui ne voit pas l’heure, chez 1 %.']},
  sugarloop:{src:['hall2019','difeli2018','brake2013'],
    e:['An inpatient trial (Hall 2019, 20 adults): on ultra-processed food, people ate about 500 kcal a day more and gained weight within two weeks. A brain-imaging study (DiFeliceantonio 2018): people paid more for snacks with fat and carbohydrate together than for snacks with only one, at the same calories. A review (2013): nutrients that reach the end of the small intestine slow the stomach and add fullness — the “ileal brake”. The loop itself, sugar to quick hunger to more sugar, is our reading of these, not a trial.',
       'Un essai en milieu hospitalier (Hall 2019, 20 adultes) : avec de la nourriture ultra-transformée, les gens ont mangé environ 500 kcal de plus par jour et pris du poids en deux semaines. Une étude d’imagerie du cerveau (DiFeliceantonio 2018) : les gens payaient plus pour des collations avec du gras et des glucides ensemble que pour des collations avec un seul des deux, à calories égales. Une revue (2013) : les nutriments qui atteignent la fin de l’intestin grêle ralentissent l’estomac et donnent le sentiment d’être plein — le « frein iléal ». La boucle elle-même, du sucre à la faim rapide à encore du sucre, c’est notre lecture de ces études, pas un essai.']},
  fructose:{src:['ebert2016','latulippe2011'],
    e:['A review (Ebert 2016): fructose is absorbed through a low-capacity transporter, the part that isn’t absorbed ferments in the colon, and the same dose with an equal amount of glucose is usually absorbed without symptoms. An apple carries about 7 g of fructose to 2.3 g of glucose. A food-composition review (Latulippe 2011) uses fructose minus glucose — “net fructose” — as the amount that matters.',
       'Une revue (Ebert 2016) : le fructose est absorbé par un transporteur de faible capacité, la partie non absorbée fermente dans le côlon, et la même dose prise avec autant de glucose passe d’habitude sans symptômes. Une pomme contient environ 7 g de fructose pour 2,3 g de glucose. Une revue sur la composition des aliments (Latulippe 2011) utilise le fructose moins le glucose — le « fructose net » — comme la quantité qui compte.']},
  warn:{src:['nhsrb','nice12','bsg2021'],
    e:['The NHS: black or dark red stool and bloody diarrhea are for an urgent appointment or the phone line the same day; bleeding that won’t stop, or a lot of blood, is for the emergency department. The UK referral guideline for suspected cancer (NICE NG12) and the British iron-deficiency guideline (2021): rectal bleeding at 50 or over, or with other signs, gets looked at. In Canada, 811 reaches a nurse.',
       'Le NHS : des selles noires ou rouge foncé et de la diarrhée avec du sang, c’est un rendez-vous urgent ou la ligne téléphonique le jour même; un saignement qui n’arrête pas, ou beaucoup de sang, c’est l’urgence. Le guide britannique de référence pour un cancer soupçonné (NICE NG12) et le guide britannique sur le manque de fer (2021) : un saignement rectal à 50 ans ou plus, ou avec d’autres signes, se fait examiner. Au Canada, le 811 te met en contact avec une infirmière.']},
  labs:{src:['who2020','bsg2021','vaucher','walters73','who2024hb','nice239','statcanD','iomAssess'],
    e:['Ferritin cut-offs: WHO 2020 and the UK guideline (2021); the fatigue trial treated people under 50. Storage iron: in healthy adults each µg/L of ferritin is about 8 to 10 mg of stored iron (phlebotomy studies, Walters 1973). Hemoglobin: WHO 2024. B12: NICE 2024. Vitamin D: the Institute of Medicine’s 2011 cut-offs, used by Statistics Canada. “On paper” uses the Institute of Medicine’s rule for one person: below the EAR, intake is likely short; at or above the RDA, it very likely isn’t. What it can’t see — what you absorb, what you lose — is why only a second test answers the question.',
       'Seuils de ferritine : OMS 2020 et le guide britannique (2021); l’essai sur la fatigue traitait les gens sous 50. Fer en réserve : chez l’adulte en santé, chaque µg/L de ferritine représente environ 8 à 10 mg de fer stocké (études par saignées, Walters 1973). Hémoglobine : OMS 2024. B12 : NICE 2024. Vitamine D : les seuils de l’Institute of Medicine (2011), utilisés par Statistique Canada. « Sur papier » suit la règle de l’Institute of Medicine pour une personne : sous le BME, l’apport est probablement insuffisant; au niveau de l’ANR ou plus, il ne l’est très probablement pas. Ce que ça ne voit pas — ce que tu absorbes, ce que tu perds — c’est pour ça que seul un deuxième test répond à la question.']},
  coffeeiron:{src:['morck83'],
    e:['Morck 1983 (dual-isotope study, adults without iron deficiency): a cup of coffee with a hamburger meal reduced iron absorption by 39%, tea by 64%. With a test meal, drip coffee cut absorption from 5.9% to 1.6% and instant to 1.0%; instant at double strength, to 0.5%. No reduction when the coffee came an hour before the meal; the same reduction an hour after. The study measured non-heme iron — the kind in plant foods and pills.',
       'Morck 1983 (étude aux isotopes, adultes sans carence en fer) : une tasse de café avec un repas de hamburger a réduit l’absorption du fer de 39 %, le thé de 64 %. Avec un repas test, le café filtre l’a fait passer de 5,9 % à 1,6 %, le café instantané à 1,0 %, et l’instantané deux fois plus fort à 0,5 %. Aucune baisse quand le café venait une heure avant le repas; la même baisse une heure après. L’étude mesurait le fer non héminique — celui des végétaux et des comprimés.']}
};

/* ===================== SAFETY — one profile for every route =====================
   Reconciles the weekly card's answers with the tank setup. Unknown stays unknown: if the safety question
   was never answered, anything that depends on it (salt) takes the cautious branch. */
function SAFE(){ const tp=(S.tank&&S.tank.p)||{}; const life=Array.isArray(tp.life)?tp.life:[]; const sa=S.a&&S.a.safety;
  const known=Array.isArray(sa)&&sa.length>0;
  const s={known, preg:has('safety','preg')||life.includes('preg'), bf:(has('safety','bf')||life.includes('bf'))&&!(has('safety','preg')||life.includes('preg')), minor:has('safety','minor')||tp.age==='minor',
    kidney:has('safety','kidney'), bp:has('safety','bp'), lithium:has('meds','lithium'), sedative:has('meds','sedative'), shaky:has('flags','shaky'), snore:has('safety','snore'),
    veg:any('safety','veg','vegan')||life.includes('veg')||life.includes('vegan'), vegan:has('safety','vegan')||life.includes('vegan'), pp:has('safety','pp')};
  s.noSalt = s.bp||s.kidney||s.preg||s.lithium||!known;
  s.noAlcoholTune = s.preg||s.minor;
  return s; }
/* protein examples that fit what the person eats */

function protEx0(){ const SF=SAFE(); return SF.vegan ? ['Tofu, tempeh, lentils, edamame or a big glass of soy milk','Du tofu, du tempeh, des lentilles, des edamames ou un grand verre de boisson de soya']
