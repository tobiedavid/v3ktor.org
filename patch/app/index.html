    e:['A randomized trial of 198 women: on iron, fatigue dropped by nearly half, versus under a third on placebo, when ferritin was under 50. Large US surveys link low iron to depressive symptoms — a link, not proof of cause, and weaker once other factors are counted. Restless legs: the international guideline treats with iron when ferritin is 75 or under. The “don’t start blind” warning: about 1 in 200 white North Americans carry the iron-overload gene pair (large screening study).',
       'Un essai randomisé auprès de 198 femmes : avec du fer, la fatigue a baissé de près de moitié, contre moins du tiers sous placebo, quand la ferritine était sous 50. De vastes enquêtes américaines relient le manque de fer aux symptômes dépressifs — un lien, pas une preuve de cause, et plus faible une fois les autres facteurs pris en compte. Jambes sans repos : le guide international recommande le fer quand la ferritine est à 75 ou moins. Pourquoi « jamais de fer à l’aveugle » : environ 1 Nord-Américain blanc sur 200 porte les deux gènes de la surcharge en fer (grande étude de dépistage).']},
  psyllium:{src:['acg','moayyedi','jovanovski','psylcase'],
    e:['The American College of Gastroenterology (2021) strongly recommends soluble fibre for IBS. A pooled analysis of 14 trials: one extra person in 7 improves compared with placebo. 28 trials show a small drop in LDL cholesterol. Blockage case reports exist — every one involved too little water or an already-narrowed bowel.',
       'Le Collège américain de gastro-entérologie (2021) recommande fortement les fibres solubles pour le côlon irritable. Analyse groupée de 14 essais : une personne de plus sur 7 va mieux par rapport au placebo. 28 essais montrent une petite baisse du cholestérol LDL. Des cas de blocage ont été rapportés — chaque fois avec trop peu d’eau ou sur un intestin déjà rétréci.']},
  magnesium:{src:['abbasi','kynast'],
    e:['One small randomized trial (46 older adults, 500 mg of magnesium oxide for 8 weeks) improved sleep measures; no trial ties the glycinate form to sleep. That cells need magnesium to make energy is basic biochemistry; alcohol and loose stools draining it is well described. Caffeine: a two-day metabolic-ward study (17 adults) measured a net extra loss of 0.16 mmol — about 4 mg — over 24 hours; real, but too small to justify a supplement on its own. No trial shows stimulant medication drains it. Blood tests being a poor marker is accepted — but it also means the benefit is hard to prove. Honest grade: likely, not solid.',
       'Un petit essai randomisé (46 personnes âgées, 500 mg d’oxyde de magnésium pendant 8 semaines) a amélioré plusieurs indicateurs du sommeil; aucun essai ne relie la forme glycinate au sommeil. Que les cellules aient besoin de magnésium pour produire de l’énergie, c’est de la biochimie de base; que l’alcool et les selles molles le vident est bien documenté. Caféine : une étude de deux jours en unité métabolique (17 adultes) a mesuré une perte nette de 0,16 mmol — environ 4 mg — sur 24 heures; c’est réel, mais trop peu pour justifier un supplément à lui seul. Aucun essai ne montre que les stimulants le vident. Que la prise de sang reflète mal les réserves est reconnu — mais ça rend aussi le bénéfice difficile à prouver. Cote honnête : probable, pas solide.']},
  creatine:{src:['roschel','candow','mcm06','mcm07'],
    e:['Two reviews of trials (2021, 2022) support creatine for brain performance, with the clearest effect when sleep-deprived or stressed; two small sleep-deprivation trials showed less mental fatigue. Most trials are short and in healthy adults, not exhausted shift workers — hence “likely”.',
       'Deux revues d’essais (2021, 2022) appuient la créatine pour les performances cognitives, avec l’effet le plus net en manque de sommeil ou sous stress; deux petits essais en privation de sommeil ont montré moins de fatigue mentale. La plupart des essais sont courts et menés sur des adultes en santé, pas sur des travailleurs de quarts épuisés — d’où « probable ».']},
  thiamine:{src:['efns','asam','nice100'],
    e:['The European neurology guideline (2010), the American addiction-medicine guideline (2020) and UK NICE all say the same thing: anyone drinking heavily should get thiamine, because deficiency causes Wernicke’s brain injury and prevention costs almost nothing. Doses: the American guideline uses 100 mg a day by mouth for people treated outside hospital; UK practice for prevention is often 200–300 mg a day. 100 mg is the floor the app uses — less than that is below every guideline cited here.',
       'Le guide européen de neurologie (2010), le guide américain de médecine des dépendances (2020) et le NICE britannique disent la même chose : quiconque boit beaucoup devrait prendre de la thiamine, parce que la carence cause l’encéphalopathie de Wernicke et que la prévention ne coûte presque rien. Doses : le guide américain utilise 100 mg par jour par la bouche pour les gens traités hors de l’hôpital; au Royaume-Uni, la prévention se fait souvent à 200–300 mg par jour. L’app prend 100 mg comme plancher — moins que ça, c’est sous tous les guides cités ici.']},
  salt:{src:['acsm','lithiumLabel'],
    e:['The sports-medicine position stand (2007) supports replacing sodium in people who sweat a lot. For everyone else, “salt water fixes the afternoon” has not been tested in a trial — it rests on what low sodium feels like and on standard advice for dizziness on standing. So: likely for sweaty work, a try for the rest. Not for anyone told to limit salt, on lithium (sodium shifts move lithium levels — FDA label), or with high blood pressure, heart or kidney disease.',
       'La prise de position en médecine du sport (2007) appuie le remplacement du sodium chez ceux qui suent beaucoup. Pour les autres, « l’eau salée règle le creux de l’après-midi » n’a jamais été testé dans un essai — ça repose sur les symptômes du manque de sodium et sur les conseils habituels contre les étourdissements en se levant. Donc : probable si tu sues au travail, à essayer pour les autres. Pas pour ceux qui doivent limiter le sel, qui prennent du lithium (le sodium fait varier le taux de lithium — monographie FDA), ou qui font de l’hypertension ou une maladie du cœur ou des reins.']},
  protein:{src:['leidy','vyvanse'],
    e:['A small crossover trial (20 teenage girls) found a high-protein breakfast cut evening snacking and steadied appetite signals; larger reviews point the same way, but the “afternoon crash” itself has not been measured directly. That stimulants kill appetite is on the drug label — one of the most common side effects.',
       'Un petit essai croisé (20 adolescentes) : un déjeuner riche en protéines réduisait le grignotage du soir et stabilisait les signaux de faim; des revues plus larges vont dans le même sens, mais le « crash de l’après-midi » lui-même n’a pas été mesuré directement. Que les stimulants coupent l’appétit, c’est écrit sur la monographie du médicament — un des effets secondaires les plus fréquents.']},
  vitc:{src:['vyvanse'],
    e:['Straight from the FDA label for lisdexamfetamine (Vyvanse): agents that change urine pH change amphetamine blood levels — acidifying agents such as vitamin C lower them. The same label lets the capsule contents be mixed with yogurt, water or orange juice, so ordinary juice is not the concern. How much a given vitamin C pill matters has not been measured in a trial — hence “likely”. Methylphenidate (Ritalin, Concerta) has no such warning.',
       'Tiré directement de la monographie FDA de la lisdexamfétamine (Vyvanse) : les agents qui changent le pH de l’urine changent le taux d’amphétamine dans le sang — les acidifiants comme la vitamine C le font baisser. La même monographie permet de mélanger le contenu de la capsule avec du yogourt, de l’eau ou du jus d’orange, alors le jus ordinaire n’est pas en cause. L’effet d’un comprimé de vitamine C donné n’a pas été mesuré dans un essai — d’où « probable ». Le méthylphénidate (Ritalin, Concerta) n’a pas cet avertissement.']},
  b12:{src:['lam','dejager','ada','didangelos'],
    e:['A large case-control study (2013): acid blockers for two years or more raised the odds of B12 deficiency by about 65%. A randomized trial (2010): metformin lowered B12 by 19% over four years. The American Diabetes Association standards recommend periodic B12 checks for anyone on metformin. And a one-year randomized trial (90 people on metformin with nerve damage, B12 under 400 pmol/L — not all clearly deficient) found 1,000 µg a day improved nerve tests, pain and quality of life: a borderline number plus nerve symptoms is worth raising.',
       'Une grande étude cas-témoins (2013) : les bloqueurs d’acide pris deux ans ou plus augmentaient d’environ 65 % le risque de manquer de B12. Un essai randomisé (2010) : la metformine a fait baisser la B12 de 19 % sur quatre ans. Les normes de l’American Diabetes Association recommandent de vérifier la B12 périodiquement chez tous ceux qui prennent de la metformine. Et un essai randomisé d’un an (90 personnes sous metformine avec atteinte des nerfs, B12 sous 400 pmol/L — pas toutes clairement en manque) a trouvé que 1 000 µg par jour amélioraient les tests neurologiques, la douleur et la qualité de vie : un chiffre limite avec des symptômes aux nerfs, ça vaut la peine d’en parler.']},
  acidblocker:{src:['lam','fdappi'],
    e:['B12: large 2013 case-control study. Magnesium: in 2011 the FDA added a low-magnesium warning to every prescription acid blocker, mostly after a year of use; in about a quarter of the cases it reviewed, magnesium supplements alone didn’t correct it and the acid blocker had to be stopped. Iron: the link is real but comes from observational data — the weakest of the three. “Don’t stop on your own” is standard advice; rebound acid is common.',
       'B12 : grande étude cas-témoins de 2013. Magnésium : en 2011, la FDA a ajouté un avertissement de manque de magnésium à tous les bloqueurs d’acide sur ordonnance, surtout après un an d’utilisation; dans environ le quart des cas examinés, les suppléments de magnésium seuls n’ont pas corrigé le problème et il a fallu arrêter le bloqueur d’acide. Fer : le lien est réel, mais il vient de données d’observation — c’est le plus faible des trois. « N’arrête pas par toi-même », c’est le conseil de base; le rebond d’acidité est fréquent.']},
  antidep:{src:['ferguson','ssriMeta','nhanesDep','papakostas'],
    e:['A review of SSRI side effects (2001) and a 2022 analysis of 30 randomized trials (5,004 people) both put nausea and diarrhea among the most common effects, mostly in the first weeks. “Low iron looks like depression” rests on survey data showing a link, not a cause — which is exactly why the advice is to test, not to stop the pill. L-methylfolate: two randomized trials in people helped only partly by an SSRI (2012). At 7.5 then 15 mg (148 people), no benefit; at 15 mg throughout (75 people), about one extra responder for every six treated. A treatment for selected patients under a prescriber, not a reason for everyone on an SSRI to take folate.',
       'Une revue des effets secondaires des ISRS (2001) et une analyse de 2022 portant sur 30 essais randomisés (5 004 personnes) classent les nausées et la diarrhée parmi les effets les plus fréquents, surtout les premières semaines. « Le manque de fer ressemble à une dépression » repose sur des enquêtes qui montrent un lien, pas une cause — c’est justement pourquoi le conseil est de faire tester, pas d’arrêter la pilule. L-méthylfolate : deux essais randomisés chez des gens aidés en partie seulement par un ISRS (2012). À 7,5 puis 15 mg (148 personnes), aucun bénéfice; à 15 mg du début à la fin (75 personnes), environ une réponse positive de plus pour six personnes traitées. Un traitement pour des patients choisis, suivi par un prescripteur — pas une raison pour que tous ceux sous ISRS prennent du folate.']},
  caffeine:{src:['efsa','drake','rao','hcCaf','hcCafKids'],
    e:['A half-life of roughly five hours is standard pharmacology (European food-safety review, 2015). A randomized trial (2013): 400 mg taken six hours before bed still cut measured sleep by about an hour. A 1998 trial: coffee stimulates colon activity within minutes. Health Canada’s ceiling is 400 mg a day for adults (300 in pregnancy or while breastfeeding, 2.5 mg/kg under 18), and 180 mg per can of energy drink. Its own table puts an 8 oz (237 ml) filter coffee at 179 mg — higher than the Canadian Nutrient File average — so the app uses Health Canada’s figure. Brand energy drinks use the Canadian label.',
       'Une demi-vie d’environ cinq heures, c’est de la pharmacologie de base (revue européenne de sécurité alimentaire, 2015). Un essai randomisé (2013) : 400 mg pris six heures avant le coucher réduisaient encore d’environ une heure le temps de sommeil mesuré. Un essai de 1998 : le café stimule l’activité du côlon en quelques minutes. Le plafond de Santé Canada est de 400 mg par jour pour les adultes (300 enceinte ou en allaitant, 2,5 mg/kg avant 18 ans), et de 180 mg par canette de boisson énergisante. Son propre tableau met un café filtre de 8 oz (237 ml) à 179 mg — plus que la moyenne du Fichier canadien sur les éléments nutritifs — alors l’app utilise le chiffre de Santé Canada. Les boissons énergisantes de marque utilisent l’étiquette canadienne.']},
  beer:{src:['maintz','comas','rohsenow','ccsa'],
    e:['Beer’s histamine and fermentable carbohydrates are documented in food-chemistry reviews (2007, 2020). A 2010 trial (95 heavy drinkers, bourbon vs vodka): more congeners meant a worse hangover, but sleep and next-day performance were equally bad — alcohol itself did that. No trial has compared beer with spirits for gut symptoms specifically — hence “likely”. The “least bad” ranking is reasoning from ingredients, not a study. For the record: Canada’s 2023 guidance puts low risk at 2 drinks a week or less and “increasingly high” at 7 or more. This card is harm reduction above that line, not a recommendation to drink.',
       'L’histamine et les glucides fermentescibles de la bière sont documentés dans des revues de chimie alimentaire (2007, 2020). Un essai de 2010 (95 gros buveurs, bourbon contre vodka) : plus de congénères, pire lendemain de veille — mais le sommeil et le rendement du lendemain étaient aussi mauvais dans les deux cas; c’est l’alcool lui-même qui fait ça. Aucun essai n’a comparé directement bière et spiritueux pour les symptômes digestifs — d’où « probable ». Le classement « moins pire » est un raisonnement à partir des ingrédients, pas une étude. Pour l’heure juste : les repères canadiens de 2023 situent le risque faible à 2 verres par semaine ou moins, et le risque « de plus en plus élevé » à 7 verres et plus. Cette carte, c’est de la réduction des méfaits au-dessus de cette ligne, pas une invitation à boire.']},
  vodkasoda:{src:['maintz','rohsenow','ccsa'],
    e:['Clear spirits carry almost no histamine, sugar or congeners (food-chemistry review 2007). In a 2010 trial, vodka gave a milder hangover than bourbon — but wrecked sleep just as much. That alcohol itself blocks the enzyme that clears histamine comes from the 2007 review. This is harm-reduction reasoning, not a trial showing vodka-soda is safe — alcohol is still alcohol, and Canada’s 2023 guidance calls 7 or more drinks a week increasingly high risk whatever is in the glass.',
       'Les spiritueux clairs ne contiennent pratiquement ni histamine, ni sucre, ni congénères (revue de chimie alimentaire 2007). Dans un essai de 2010, la vodka donnait un lendemain de veille moins rude que le bourbon — mais nuisait tout autant au sommeil. Que l’alcool lui-même bloque l’enzyme qui élimine l’histamine vient de la revue de 2007. C’est un raisonnement de réduction des méfaits, pas un essai prouvant que la vodka-soda est sécuritaire — l’alcool reste de l’alcool, et les repères canadiens de 2023 classent 7 verres et plus par semaine comme un risque de plus en plus élevé, peu importe ce qu’il y a dans le verre.']},
  histamine:{src:['maintz','comas'],
    e:['Two reviews (2007, 2020) describe the mechanism, the foods, and the enzyme that alcohol blocks. But: there is no validated test, the blood DAO test is unreliable, trials are small, and how many people are truly affected is unknown. “Likely” is generous. The diet is safe to test for two weeks — that is why it stays.',
       'Deux revues (2007, 2020) décrivent le mécanisme, les aliments en cause et l’enzyme que l’alcool bloque. Mais : aucun test validé, le dosage sanguin de la DAO n’est pas fiable, les essais sont petits et on ne sait pas combien de personnes sont vraiment touchées. « Probable » est généreux. La diète ne présente aucun danger à essayer deux semaines — c’est pour ça qu’elle reste.']},
  bile:{src:['wedlake','bsg2018','camilleri'],
    e:['A 2009 pooled analysis found bile-acid diarrhea in roughly 1 in 3 to 1 in 4 people labelled “IBS with diarrhea”. The British gastroenterology guideline (2018) and a 2015 review cover diagnosis and treatment. That bulking fibre binds some bile acid is accepted; the prescription binders have the stronger evidence.',
       'Une analyse groupée de 2009 : diarrhée aux acides biliaires chez environ une personne sur trois ou quatre étiquetée « côlon irritable avec diarrhée ». Le guide britannique de gastro-entérologie (2018) et une revue de 2015 couvrent le diagnostic et le traitement. Que les fibres épongent une partie des acides biliaires est admis; les liants sur ordonnance ont les preuves les plus solides.']},
  sleepq:{src:['drake','ebrahim','abbasi'],
    e:['Caffeine cut-off: randomized trial, 2013. Alcohol wrecking the second half of the night: a 2013 review of 27 studies. Magnesium: one small trial. Screens: evidence is mixed and modest. Each piece has a study behind it; the bundle as a whole has not been tested — “likely”.',
       'Couper la caféine tôt : essai randomisé, 2013. L’alcool qui bousille la deuxième moitié de la nuit : revue de 27 études, 2013. Magnésium : un petit essai. Écrans : données mitigées et effet modeste. Chaque élément s’appuie sur une étude; l’ensemble n’a pas été testé d’un bloc — « probable ».']},
  withdrawal:{src:['asam','nice100','efns'],
    e:['The American addiction-medicine guideline (2020) and UK NICE (CG100): heavy daily drinkers can have seizures when they stop suddenly and need a supervised taper; thiamine for everyone at risk. This is the most settled item in the app.',
       'Le guide américain de médecine des dépendances (2020) et le NICE britannique (CG100) : les gros buveurs quotidiens peuvent faire des convulsions en arrêtant d’un coup et ont besoin d’un sevrage supervisé; thiamine pour tous ceux à risque. C’est le point le plus établi de toute l’application.']},
  tsh:{src:['chaker'],
    e:['Standard medicine. A 2017 Lancet review covers how common an underactive thyroid is (more in women), its symptoms, and TSH as the screening test.',
       'Médecine courante. Une revue du Lancet (2017) couvre la fréquence de l’hypothyroïdie (plus courante chez les femmes), ses symptômes et la TSH comme test de dépistage.']},
  vitd:{src:['webb','endo24','hcVit'],
    e:['“No useful winter sun” comes from a 1988 measurement study: in Edmonton, skin made no vitamin D from October through March; in Boston, November through February. The Endocrine Society guideline (2024) suggests against routine vitamin D blood tests and against taking more than the daily need for healthy adults under 75; it suggests more for people over 75, in pregnancy, with prediabetes, and under 18. The 600/800 IU need and the 4,000 IU ceiling are Health Canada’s.',
       '« Pas de soleil utile l’hiver » vient d’une étude de mesure de 1988 : à Edmonton, la peau ne produisait aucune vitamine D d’octobre à mars; à Boston, de novembre à février. Le guide de l’Endocrine Society (2024) suggère de ne pas faire de prise de sang de routine pour la vitamine D, et de ne pas dépasser le besoin quotidien chez les adultes en santé de moins de 75 ans; il en suggère plus après 75 ans, pendant la grossesse, avec un prédiabète et avant 18 ans. Le besoin de 600/800 UI et le plafond de 4 000 UI viennent de Santé Canada.']},
  crp:{src:['thurnham','who2020','bsg2021'],
    e:['A pooled analysis of 32 studies (8,796 people): inflammation raised ferritin by about 30% and hid iron deficiency in roughly 1 case in 7. The WHO (2020) and UK (2021) guidelines both say to read ferritin together with an inflammation marker.',
       'Analyse groupée de 32 études (8 796 personnes) : l’inflammation faisait monter la ferritine d’environ 30 % et cachait un vrai manque de fer dans environ 1 cas sur 7. Les guides de l’OMS (2020) et britannique (2021) disent tous deux de lire la ferritine avec un marqueur d’inflammation.']},
  barrier:{src:['ascrs','beeckman'],
    e:['The colorectal-surgery guideline (2023): fibre, fluids and warm sitz baths are first-line for anal fissures and heal about half of them. For barrier creams, a Cochrane review (2016) found only low-quality evidence — they are standard nursing practice for skin exposed to loose stool, not trial-proven. “Likely”, and still the cheapest first move.',
       'Le guide de chirurgie colorectale (2023) : fibres, liquides et bains de siège tièdes sont le premier traitement des fissures anales et en guérissent environ la moitié. Pour les crèmes barrières, une revue Cochrane (2016) n’a trouvé que des preuves de faible qualité — c’est la pratique infirmière courante pour la peau exposée aux selles molles, pas quelque chose de prouvé par essai. « Probable », et quand même le premier geste à poser, et le moins cher.']},
  loop:{src:['drake','ebrahim','statcan','narula'],
    e:['The pieces are each measured: caffeine six hours before bed still cuts sleep (trial, 2013); alcohol fragments the second half of the night (27 studies, 2013); ultra-processed food was 46% of Canadians’ calories in 2015 (Statistics Canada), and a 2021 study of 116,000 people linked heavy intake to bowel inflammation. The “loop” is our way of connecting them — the connection is an argument, not a study.',
       'Chaque maillon est mesuré séparément : la caféine six heures avant le coucher coupe encore le sommeil (essai, 2013); l’alcool fragmente la deuxième moitié de la nuit (27 études, 2013); l’ultra-transformé représentait 46 % des calories des Canadiens en 2015 (Statistique Canada), et une étude de 2021 sur 116 000 personnes relie une forte consommation à l’inflammation de l’intestin. « La boucle », c’est notre façon de relier tout ça — le lien est un raisonnement, pas une étude.']},
  liver:{src:['nihA'],
    e:['Nutrient content and the vitamin A ceiling come from the US National Institutes of Health fact sheet: a 3-ounce serving of beef liver carries about 6,500 mcg of vitamin A; the daily safe ceiling is 3,000 mcg. That is the arithmetic behind “once a week, not daily” and behind “not in pregnancy”.',
       'Les valeurs nutritionnelles et le plafond de vitamine A viennent de la fiche des National Institutes of Health (É.-U.) : une portion de 85 g de foie de bœuf contient environ 6 500 mcg de vitamine A; le plafond quotidien sécuritaire est de 3 000 mcg. C’est le calcul derrière « une fois par semaine, pas tous les jours » et derrière « pas pendant la grossesse ».']},
  sweeteners:{src:['lenhart','suez'],
    e:['A 2017 review covers how sugar alcohols pull water into the gut and ferment, with diarrhea rising with the dose in feeding studies. A 2022 randomized trial (120 people): sucralose and saccharin changed gut bacteria and blood-sugar responses — not diarrhea. So: solid for sugar alcohols, thin for sucralose. “Read the label, test a week” is the practical conclusion.',
       'Une revue de 2017 décrit comment les alcools de sucre attirent l’eau dans l’intestin et fermentent, avec une diarrhée qui augmente avec la dose dans les études d’alimentation. Un essai randomisé de 2022 (120 personnes) : le sucralose et la saccharine modifiaient les bactéries intestinales et la réponse glycémique — pas de diarrhée. Donc : solide pour les alcools de sucre, mince pour le sucralose. « Lis l’étiquette, teste une semaine », c’est la conclusion pratique.']},
  apnea:{src:['aasm','stop'],
    e:['The American Academy of Sleep Medicine guideline (2017) describes exactly this picture — unrested, fatigued, sleepy — and says loud snoring, witnessed pauses or gasping, and high blood pressure mark the people who need testing; a home sleep test is accepted for most adults. The snoring/tired/observed/pressure questions come from a validated screening tool (2,467 patients, 2008). Questionnaires can’t diagnose it — the test can.',
       'Le guide de l’American Academy of Sleep Medicine (2017) décrit exactement ce tableau — réveil non reposé, fatigue, somnolence — et dit que ronflement fort, pauses ou suffocations observées et hypertension désignent ceux qui doivent passer le test; le test de sommeil à la maison est accepté pour la plupart des adultes. Les quatre questions (ronflement, fatigue, pauses observées, pression) viennent d’un outil de dépistage validé (2 467 patients, 2008). Un questionnaire ne peut pas poser le diagnostic — le test, oui.']},
  pill:{src:['nhsPill'],
    e:['NHS patient guidance for the combined pill: diarrhoea over 24 hours or vomiting within 3 hours can stop it being absorbed; extra contraception until 7 days after. The psyllium-spacing rule is the general one for bulk fibre and medications. Not a trial — a national health service’s standing advice.',
       'Conseils du NHS pour la pilule combinée : une diarrhée de plus de 24 heures ou un vomissement dans les 3 heures peut empêcher l’absorption; contraception supplémentaire jusqu’à 7 jours après. La règle d’espacement du psyllium est la règle générale entre fibres et médicaments. Ce n’est pas un essai clinique — c’est la consigne officielle d’un système de santé public.']},
  lithium:{src:['lithiumLabel','lithCaf'],
    e:['Straight from the FDA prescribing information for lithium: dehydration from sweating or diarrhea and sodium depletion raise lithium toxicity risk; patients are told to keep a normal salt diet and stay hydrated, and sodium restriction is to be avoided. Label-level evidence — about as settled as drug information gets. Caffeine: a small study (11 patients, Mester 1995) found lithium levels rose about 24% when caffeine was stopped, and case reports since — the most recent in 2024 — describe toxic levels after a sudden cut. Small numbers, consistent direction.',
       'Tiré directement de la monographie FDA du lithium : la déshydratation par la sueur ou la diarrhée et le manque de sodium augmentent le risque de toxicité; on dit aux patients de garder une alimentation normale en sel, de rester hydratés et d’éviter de restreindre le sodium. Une preuve de niveau monographie — difficile de faire plus établi pour un médicament. Caféine : une petite étude (11 patients, Mester 1995) a trouvé que le lithium montait d’environ 24 % à l’arrêt de la caféine, et des cas rapportés depuis — le plus récent en 2024 — décrivent des taux toxiques après une coupure soudaine. Peu de monde, mais toujours dans le même sens.']},
  nicotine:{src:['nicoretteLabel'],
    e:['The hiccups-heartburn-nausea list is on the FDA label for nicotine gum (use one piece after another and “this may cause you hiccups, heartburn, nausea”); product monographs add stomach discomfort and say swallowed nicotine is the cause. Pouches and chew deliver the same nicotine; nobody has trialled the “after food, spit” rule, so: likely.',
       'La liste hoquet–brûlures–nausées est sur l’étiquette FDA de la gomme de nicotine (prendre une gomme après l’autre « peut causer hoquet, brûlures d’estomac, nausées »); les monographies ajoutent l’estomac dérangé et mettent en cause la nicotine avalée. Les sachets et la chique libèrent la même nicotine; personne n’a testé la règle « après le repas, crache », donc : probable.']},
  sedative:{src:['fdaBenzo','imovanePMI'],
    e:['The FDA’s 2020 Drug Safety Communication, which updated the boxed warning on every benzodiazepine, warns of severe respiratory depression and death with other CNS depressants and tells patients: “do not drink alcohol with benzodiazepines.” The Health Canada–approved patient sheet for Imovane (zopiclone) lists alcohol among the combinations that can lead to overdose or death and tells patients not to drink while taking it. Regulator and label level — as settled as drug information gets.',
       'La communication de sécurité de la FDA de 2020, qui a mis à jour l’avertissement encadré de toutes les benzodiazépines, prévient d’une dépression respiratoire grave et de décès avec d’autres dépresseurs du système nerveux et dit aux patients de ne pas boire d’alcool avec. La feuille d’information patient d’Imovane (zopiclone) approuvée par Santé Canada place l’alcool parmi les combinaisons qui peuvent mener à une surdose ou à la mort et dit de ne pas boire pendant le traitement. Niveau régulateur et monographie — difficile de faire plus établi.']},
  sedhang:{src:['hcZop','imovanePMI'],
    e:['Health Canada’s November 2014 safety letter (with Sanofi) cut the recommended zopiclone starting dose to 3.75 mg, capped it at 5 mg for older adults, said next-day impairment can be present even when the person feels fully awake, and told patients to wait at least 12 hours after a dose before driving. The current patient sheet adds alcohol and other sedatives as things that make it worse. Regulator level.',
       'La lettre de sécurité de Santé Canada de novembre 2014 (avec Sanofi) a réduit la dose de départ recommandée de zopiclone à 3,75 mg, l’a plafonnée à 5 mg chez les aînés, a précisé que les effets du lendemain peuvent être présents même quand la personne se sent tout à fait réveillée, et a dit d’attendre au moins 12 heures après une dose avant de conduire. La feuille patient actuelle ajoute l’alcool et les autres sédatifs comme facteurs aggravants. Niveau régulateur.']},
  stimwear:{src:['dexPI','pdrDex','vyvanse'],
    e:['Timings are label-level: the Dexedrine prescribing information reports a plasma half-life of about 12 hours and a Spansule peak around 8 hours; the PDR dosing summary gives 4-to-6-hour intervals for the tablets, about 8 for the capsules, and a last dose at least 6 hours before bedtime; the Vyvanse label measured effect up to 13–14 hours. “Eat before the pill” is the labels’ appetite-loss warning turned into a habit, not a trial result.',
       'Les durées viennent des monographies : la notice de Dexedrine rapporte une demi-vie d’environ 12 heures et un pic de la Spansule vers 8 heures; le résumé posologique du PDR donne des intervalles de 4 à 6 heures pour les comprimés, environ 8 pour les capsules, et une dernière dose au moins 6 heures avant le coucher; la monographie du Vyvanse a mesuré l’effet jusqu’à 13–14 heures. « Manger avant la pilule », c’est l’avertissement de perte d’appétit des monographies transformé en habitude, pas un résultat d’essai.']},
  cafclock:{src:['efsa','drake','hcCaf'],
    e:['The European food-safety authority’s 2015 opinion gives caffeine’s adult half-life range (it varies a lot between people, roughly 2 to 8 hours) and the 400 mg/day ceiling; a 2013 randomized study found 400 mg taken six hours before bed still cut measured sleep by more than an hour; Health Canada sets the same 400 mg adult limit. Withdrawal headache after a missed dose is a recognized syndrome. “Same total, earlier” hasn’t been trialled — it’s the half-life applied.',
       'L’avis 2015 de l’autorité européenne de sécurité des aliments donne la plage de demi-vie de la caféine chez l’adulte (ça varie beaucoup d’une personne à l’autre, environ 2 à 8 heures) et le plafond de 400 mg par jour; une étude randomisée de 2013 a trouvé que 400 mg pris six heures avant le coucher coupaient encore le sommeil mesuré de plus d’une heure; Santé Canada fixe la même limite adulte de 400 mg. Le mal de tête de sevrage après une dose manquée est un syndrome reconnu. « Même total, plus tôt » n’a pas été testé — c’est la demi-vie appliquée.']},
  rectal:{src:['nice12','bsg2021'],
    e:['NICE guideline NG12 (suspected cancer: recognition and referral, updated 2023): a two-week suspected-cancer referral at 50 and over with unexplained rectal bleeding, and consider one under 50 when bleeding comes with abdominal pain, a change in bowel habit, weight loss or iron-deficiency anaemia. The British iron-deficiency guideline (2021) treats blood loss as the first cause to rule out. “Usually curable when caught early” is the standard survival picture for early-stage bowel cancer, not a figure from one trial.',
       'Guide NICE NG12 (cancer suspecté : reconnaissance et référence, mis à jour en 2023) : référence urgente pour suspicion de cancer, en moins de deux semaines, à 50 ans et plus avec un saignement rectal inexpliqué, et à envisager sous 50 ans quand le saignement vient avec des douleurs abdominales, un changement du transit, une perte de poids ou une anémie ferriprive. Le guide britannique sur le manque de fer (2021) traite la perte de sang comme la première cause à écarter. « Se guérit généralement quand c’est attrapé tôt », c’est le portrait standard de survie du cancer de l’intestin à un stade précoce, pas un chiffre tiré d’un seul essai.']},
  drinks:{src:['ccsa'],
    e:['Canada’s Guidance on Alcohol and Health (Canadian Centre on Substance Use and Addiction, 2023): the standard drink, the weekly risk zones and the 2-a-day line. It replaced the 2011 low-risk guidelines (10 a week for women, 15 for men). The zones are population risk estimates, not a personal prediction.',
       'Repères canadiens sur l’alcool et la santé (Centre canadien sur les dépendances et l’usage de substances, 2023) : la consommation standard, les zones de risque par semaine et la ligne de 2 par jour. Ils remplacent les directives de 2011 (10 par semaine pour les femmes, 15 pour les hommes). Les zones sont des estimations de risque dans la population, pas une prédiction personnelle.']},
  copper:{src:['nihCu','hcEl','cnf'],
    e:['Needs (900 µg; 1,000 in pregnancy, 1,300 breastfeeding) and the 10 mg ceiling are Health Canada’s DRI values. The NIH fact sheet covers sources — beef liver about 12 mg per 3 oz — and the zinc–copper interaction: high zinc intakes reduce copper absorption and have caused deficiency with anemia and nerve damage.',
       'Les besoins (900 µg; 1 000 durant la grossesse, 1 300 durant l’allaitement) et le plafond de 10 mg viennent des ANREF de Santé Canada. La fiche des NIH couvre les sources — environ 12 mg dans 3 oz de foie de bœuf — et l’interaction zinc–cuivre : un apport élevé en zinc réduit l’absorption du cuivre et a causé des manques avec anémie et atteinte des nerfs.']},
  lactose:{src:['efsaLact','nihLact'],
    e:['The European Food Safety Authority’s 2010 review found that most people with lactose maldigestion tolerate about 12 g of lactose in a single dose with no or minor symptoms, and more when it’s spread across the day — 20 to 24 g in the studies it reviewed. 24 g at once usually brings symptoms, and some people react to less than 6 g. The lactose check in your patterns uses those lines: 12 g in one serving or over 24 g in a day, against days under 6 g. Typical lactose amounts are used where the Canadian Nutrient File has none (ice cream, chocolate milk, cream, whey); aged cheese and butter are near zero.',
       'La revue de 2010 de l’Autorité européenne de sécurité des aliments a trouvé que la plupart des gens qui digèrent mal le lactose tolèrent environ 12 g en une seule dose, avec peu ou pas de symptômes, et plus si c’est réparti dans la journée — de 20 à 24 g dans les études qu’elle a examinées. 24 g d’un coup donnent habituellement des symptômes, et certaines personnes réagissent à moins de 6 g. La vérification du lactose dans tes tendances utilise ces seuils : 12 g dans une portion ou plus de 24 g dans la journée, contre les jours à moins de 6 g. Des quantités typiques sont utilisées là où le Fichier canadien n’en a pas (crème glacée, lait au chocolat, crème, lactosérum); le fromage vieilli et le beurre sont près de zéro.']},
  gluten:{src:['celiacCan'],
    e:['Celiac Canada and gastroenterology guidance: test (tTG-IgA with total IgA) before any gluten-free trial, because a gluten-free diet can make the blood test and the biopsy falsely negative.',
       'Cœliaque Canada et les guides de gastro-entérologie : faire le test (tTG-IgA avec IgA totales) avant tout essai sans gluten, parce qu’une diète sans gluten peut rendre la prise de sang et la biopsie faussement négatives.']},
  stores:{src:['nihB12','nihFol','nihB1','nihZn','nihC','nihK','nihA'],
    e:['Amounts and timescales come from the NIH Office of Dietary Supplements fact sheets: B12 stores of about 1–5 mg can last years after intake stops; folate stores of 15–30 mg, about half in the liver; thiamine is stored only in small amounts and turns over in weeks; there is no specialized zinc store; vitamin C deficiency signs can appear within a month of very low intake; vitamin K has small, fast-turning stores. Exact durations depend on starting stores, absorption and losses — so these are ranges, not countdowns.',
       'Les quantités et les délais viennent des fiches de l’Office of Dietary Supplements des NIH : les réserves de B12, environ 1 à 5 mg, peuvent durer des années après l’arrêt de l’apport; les réserves de folate, 15 à 30 mg, dont environ la moitié dans le foie; la thiamine n’est stockée qu’en petite quantité et se renouvelle en quelques semaines; il n’y a pas de réserve spécialisée de zinc; les signes de manque de vitamine C peuvent apparaître en un mois d’apport très bas; la vitamine K a de petites réserves qui se renouvellent vite. Les durées exactes dépendent des réserves de départ, de l’absorption et des pertes — ce sont des fourchettes, pas des comptes à rebours.']},
  tank:{src:['hcEl','hcVit','cnf','morck','sportsProt'],
    e:['Reference values: Health Canada’s DRI tables for elements (calcium, iron, magnesium, zinc, potassium, sodium — the 2019 potassium/sodium update is noted on the page) and vitamins (C with the +35 mg smoker footnote, thiamin, folate, B12, D). Food values: the Canadian Nutrient File 2015 CSV release, per 100 g, scaled to our servings. The coffee note is the 1983 dual-isotope trial (coffee −39%, tea −64%, no effect an hour before the meal). The protein range above the floor is the 2016 joint position of Dietitians of Canada, the Academy of Nutrition and Dietetics and the ACSM (1.2–2.0 g/kg for athletes). The bands and the calorie factors are ours.',
       'Valeurs de référence : les tables d’ANREF de Santé Canada pour les éléments (calcium, fer, magnésium, zinc, potassium, sodium — la mise à jour 2019 potassium/sodium est notée sur la page) et les vitamines (C avec la note +35 mg pour fumeurs, thiamine, folate, B12, D). Valeurs des aliments : la version CSV 2015 du Fichier canadien sur les éléments nutritifs, par 100 g, ramenée à nos portions. La note sur le café vient de l’essai à double isotope de 1983 (café −39 %, thé −64 %, aucun effet une heure avant le repas). La fourchette de protéines au-dessus du plancher vient de la position conjointe 2016 des Diététistes du Canada, de l’Academy of Nutrition and Dietetics et de l’ACSM (1,2–2,0 g/kg pour les athlètes). Les bandes et les facteurs de calories sont les nôtres.']},
  manganese:{src:['nihMn','hcEl','cnf'],
    e:['Roles, needs (adequate intake 2.3 mg men, 1.8 mg women, 2.0 mg pregnancy), the 11 mg upper limit, rarity of deficiency, and toxicity from inhalation and well water: the US NIH manganese fact sheet, matching Health Canada’s DRI table. Food values: the Canadian Nutrient File.',
       'Rôles, besoins (apport suffisant 2,3 mg hommes, 1,8 mg femmes, 2,0 mg grossesse), la limite supérieure de 11 mg, la rareté du manque, et la toxicité par inhalation et eau de puits : la fiche manganèse des NIH (É.-U.), concordante avec la table des ANREF de Santé Canada. Valeurs des aliments : le Fichier canadien sur les éléments nutritifs.']},
  vitamina:{src:['nihA','hcVit','feskanich'],
    e:['Symptoms, the preformed-only ceiling, pregnancy risk and beta-carotene’s harmlessness: the US NIH vitamin A fact sheet and Health Canada’s DRI table (UL 3,000 µg, “as preformed vitamin A only”). Hip fractures: the Nurses’ Health Study (72,337 women, 18 years, JAMA 2002) — the highest retinol intakes had about 1.9 times the hip-fracture risk; that’s an association in one cohort, not proof, and beta-carotene showed no clear effect.',
       'Symptômes, plafond pour la forme préformée seulement, risque pendant la grossesse et innocuité du bêta-carotène : la fiche vitamine A des NIH (É.-U.) et la table des ANREF de Santé Canada (AMT 3 000 µg, « vitamine A préformée seulement »). Fractures de la hanche : la Nurses’ Health Study (72 337 femmes, 18 ans, JAMA 2002) — les apports de rétinol les plus élevés avaient environ 1,9 fois le risque de fracture de la hanche; c’est une association dans une cohorte, pas une preuve, et le bêta-carotène n’a pas montré d’effet clair.']},
  veg:{src:['nihB12','nihFe','nihZn','nihI','nihO3'],
    e:['All from the US National Institutes of Health fact sheets, which use the same reference intakes as Health Canada. B12: naturally only in animal foods; vegans need fortified foods or supplements, and babies breastfed by vegan mothers can run out within months of birth. Iron: the recommended intake for vegetarians is 1.8 times higher, because plant iron absorbs less. Zinc: vegetarians may need as much as 50% more. Iodine: people who avoid dairy, seafood and eggs and don’t use iodized salt are at risk. Omega-3: the body converts only a small share of plant ALA to EPA and DHA. The app doesn’t raise the iron target in pregnancy — that number is already high, and prescribed iron is the usual answer there.',
       'Tout vient des fiches des National Institutes of Health (É.-U.), qui utilisent les mêmes apports de référence que Santé Canada. B12 : naturellement seulement dans les aliments animaux; les véganes ont besoin d’aliments enrichis ou de suppléments, et les bébés allaités par une mère végane peuvent en manquer quelques mois après la naissance. Fer : l’apport recommandé pour les végétariens est 1,8 fois plus élevé, parce que le fer des plantes s’absorbe moins bien. Zinc : les végétariens peuvent avoir besoin de jusqu’à 50 % de plus. Iode : les gens qui évitent les produits laitiers, les fruits de mer et les œufs et n’utilisent pas de sel iodé sont à risque. Oméga-3 : le corps ne convertit qu’une petite part de l’ALA des plantes en EPA et DHA. L’app ne monte pas la cible de fer pendant la grossesse — ce chiffre est déjà haut, et le fer prescrit est la réponse habituelle.']},
  pp:{src:['ataPPT','milmanPPA','smh2019','wisner2013'],
    e:['Thyroid: the American Thyroid Association — the slow phase usually comes 4 to 8 months after delivery and can last up to a year; about 20% who go slow stay slow. Reviews put postpartum thyroiditis at about 7% of births on average (studies range from 1 to 17%). Iron: a 2011 review — one week after a normal delivery, 14% of women who took iron in pregnancy were anemic, and 24% of those who didn’t; in European series about half are anemic 48 hours after delivery. The “1 in 14” is that 7% average, not a promise for any one person. Mood: Statistics Canada’s 2018–19 Survey on Maternal Health found 23% of mothers reported feelings consistent with postpartum depression, an anxiety disorder or both, 5 to 13 months after the birth. A US screening of 10,000 mothers (2013) found 14% screened positive on the EPDS at 4–6 weeks. Screens, not diagnoses — which is why the next step is a person.',
       'Thyroïde : l’American Thyroid Association — la phase lente arrive habituellement de 4 à 8 mois après l’accouchement et peut durer jusqu’à un an; environ 20 % de celles qui ralentissent restent au ralenti. Les revues situent la thyroïdite post-partum autour de 7 % des naissances en moyenne (les études vont de 1 à 17 %). Fer : une revue de 2011 — une semaine après un accouchement normal, 14 % des femmes qui avaient pris du fer pendant la grossesse étaient anémiques, et 24 % de celles qui n’en avaient pas pris; dans des séries européennes, environ la moitié le sont 48 heures après l’accouchement. Le « 1 sur 14 », c’est cette moyenne de 7 %, pas une promesse pour une personne en particulier. Le moral : l’Enquête sur la santé maternelle 2018–2019 de Statistique Canada a trouvé que 23 % des mères avaient des sentiments correspondant à une dépression post-partum, à un trouble anxieux ou aux deux, de 5 à 13 mois après l’accouchement. Un dépistage de 10 000 mères aux É.-U. (2013) : 14 % positives à l’EPDS à 4–6 semaines. Des dépistages, pas des diagnostics — c’est pour ça que la prochaine étape, c’est une personne.']},
  prenatal:{src:['phacFolic','fgSupp','phacPreg','phacNTD','ahsGummy'],
    e:['Health Canada and the Public Health Agency of Canada: a daily multivitamin with 0.4 mg folic acid for anyone who could become pregnant, is pregnant or is breastfeeding, and 16–20 mg of iron in pregnancy; no more than 1 mg of folic acid a day unless a doctor advises it. Folic acid’s protection against neural tube defects is among the best-established findings in nutrition — Canada has fortified white flour since 1998, and the rate of these defects fell. Alberta Health Services: most gummy multivitamins don’t have enough iron. Checked 5 Nov 2026.',
       'Santé Canada et l’Agence de la santé publique du Canada : une multivitamine avec 0,4 mg d’acide folique chaque jour pour toute personne qui pourrait tomber enceinte, qui est enceinte ou qui allaite, et de 16 à 20 mg de fer pendant la grossesse; pas plus de 1 mg d’acide folique par jour sans l’avis d’un médecin. La protection de l’acide folique contre les anomalies du tube neural est un des résultats les mieux établis en nutrition — le Canada enrichit la farine blanche depuis 1998, et le taux de ces anomalies a baissé. Alberta Health Services : la plupart des multivitamines en jujubes n’ont pas assez de fer. Vérifié le 5 nov. 2026.']},
  toomuch:{src:['nihA','nihE','nihC','nihB3','nihB6','efsaB6','nihFol','nihFe','nihZn','nihCu','nihSe','nihMn','nihI','hcEl','hcVit','hcCaf','julianoCaf'],
    e:['Ceilings are Health Canada’s DRI upper limits (Europe’s 2023 B6 limit is named where it differs). The signs of excess come from the US National Institutes of Health fact sheets for each nutrient; magnesium, calcium and potassium signs are the standard ones in those same sheets and drug labels. Caffeine: Health Canada’s limits, and a 2004 review of 66 studies for withdrawal timing (onset 12–24 h, lasting 2–9 days). These are population limits — a few people react below them, and a clinician can prescribe above them on purpose.',
       'Les plafonds sont les apports maximaux tolérables des ANREF de Santé Canada (la limite européenne de 2023 pour la B6 est nommée là où elle diffère). Les signes d’excès viennent des fiches des National Institutes of Health (É.-U.) pour chaque nutriment; ceux du magnésium, du calcium et du potassium sont les signes standards de ces mêmes fiches et des monographies. Caféine : les limites de Santé Canada, et une revue de 66 études (2004) pour le moment du sevrage (début 12–24 h, durée 2–9 jours). Ce sont des limites pour la population — quelques personnes réagissent en dessous, et un clinicien peut prescrire au-dessus exprès.']},
  edrink:{src:['hcCED','hcMix','efsaTau','hcCaf','julianoCaf'],
    e:['Health Canada: the 180 mg-per-serving cap, the mandatory “do not drink more than X per day” line, and limits on added taurine, vitamins and minerals; a 2018 advisory on not mixing caffeinated drinks with alcohol. Sugar and vitamin amounts: Canadian labels in the app’s food list. Taurine and glucuronolactone: EFSA 2009 found no safety concern at regular energy-drink intake, while noting that acute problems reported with large amounts were more likely the caffeine. Withdrawal timing: the 2004 review. US cans such as Celsius list 200 mg or more.',
       'Santé Canada : le plafond de 180 mg par portion, la ligne obligatoire « ne pas boire plus de X par jour », et des limites sur la taurine, les vitamines et les minéraux ajoutés; un avis de 2018 sur le mélange des boissons caféinées avec l’alcool. Quantités de sucre et de vitamines : les étiquettes canadiennes de la liste d’aliments de l’app. Taurine et glucuronolactone : l’EFSA (2009) n’a trouvé aucun problème de sécurité à la consommation régulière, en notant que les problèmes aigus rapportés avec de grosses quantités venaient plus probablement de la caféine. Moment du sevrage : la revue de 2004. Les canettes américaines comme Celsius affichent 200 mg ou plus.']},
  fibre:{src:['hcMac','cnf'],
    e:['The adequate intakes (38/25 g, 30/21 after 50; 28 in pregnancy, 29 breastfeeding) are Health Canada’s, set at 14 g per 1,000 kcal. Food values are from the Canadian Nutrient File. The gas warning is practical experience, not a trial.',
       'Les apports suffisants (38/25 g, 30/21 après 50 ans; 28 durant la grossesse, 29 durant l’allaitement) sont ceux de Santé Canada, fixés à 14 g par 1 000 kcal. Les valeurs des aliments viennent du Fichier canadien sur les éléments nutritifs. L’avertissement sur les gaz, c’est de l’expérience pratique, pas un essai.']},
  bvits:{src:['nihB2','nihB3','hcVit'],
    e:['Needs and the niacin ceiling (35 mg, from supplements and fortified foods; set on flushing from nicotinic acid) are Health Canada’s DRI values; the NIH fact sheets cover sources, the tryptophan conversion, and that niacinamide doesn’t cause flushing. Energy-drink amounts are from Canadian labels.',
       'Les besoins et le plafond de la niacine (35 mg, des suppléments et aliments enrichis; fixé d’après le rougissement de l’acide nicotinique) sont les ANREF de Santé Canada; les fiches des NIH couvrent les sources, la conversion du tryptophane, et le fait que la niacinamide ne fait pas rougir. Les quantités des boissons énergisantes viennent des étiquettes canadiennes.']},
  b6:{src:['nihB6','efsaB6','hcVit'],
    e:['Canada’s 100 mg ceiling is the 1998 DRI value. In 2023 the European Food Safety Authority set 12 mg for adults, including pregnancy, from a review of nerve-damage reports — the reports cluster at long-term supplement use, often at doses well under 100 mg. Two agencies, two numbers: the app shows Canada’s as the bar and mentions Europe’s when pills and drinks pass 12.',
       'Le plafond canadien de 100 mg est la valeur ANREF de 1998. En 2023, l’Autorité européenne de sécurité des aliments a fixé 12 mg pour les adultes, grossesse comprise, après une revue des cas d’atteinte des nerfs — ces cas se regroupent autour de suppléments pris longtemps, souvent à des doses bien sous 100 mg. Deux agences, deux chiffres : l’app montre celui du Canada comme barre et mentionne celui de l’Europe quand pilules et boissons dépassent 12.']},
  selenium:{src:['nihSe','hcEl','cnf'],
    e:['Needs (55 µg; 60 in pregnancy, 70 breastfeeding) and the 400 µg ceiling are Health Canada’s. The NIH fact sheet gives Brazil nuts at 68–91 µg each and lists the signs of excess; the Canadian file puts one nut near 95.',
       'Les besoins (55 µg; 60 durant la grossesse, 70 durant l’allaitement) et le plafond de 400 µg sont ceux de Santé Canada. La fiche des NIH donne 68 à 91 µg par noix du Brésil et décrit les signes d’excès; le fichier canadien met une noix près de 95.']},
  vite:{src:['nihE','hcVit'],
    e:['The NIH fact sheet summarizes the trials: no benefit for heart disease or cancer prevention, and the SELECT trial (35,000 men) found 400 IU a day of synthetic vitamin E raised prostate cancer risk by 17%. It also covers the bleeding interaction with anticoagulants. The 15 mg need and the 1,000 mg supplement ceiling are Health Canada’s.',
       'La fiche des NIH résume les essais : aucun bénéfice pour prévenir les maladies du cœur ou le cancer, et l’essai SELECT (35 000 hommes) a trouvé que 400 UI par jour de vitamine E synthétique augmentaient le risque de cancer de la prostate de 17 %. Elle couvre aussi l’interaction avec les anticoagulants. Le besoin de 15 mg et le plafond de 1 000 mg en supplément sont ceux de Santé Canada.']},
  coq10:{src:['nccihQ10','tsaiQ10','quQ10','banachQ10'],
    e:['Fatigue: a 2022 meta-analysis of 13 trials (1,126 people) found a small-to-moderate reduction overall; the healthy-people subgroup didn’t reach significance. Statin muscle pain: a 2018 meta-analysis of 12 trials found benefit, a 2015 one of 6 trials didn’t, and the US National Center for Complementary and Integrative Health reads the overall evidence as not supportive. It also flags the warfarin interaction. Hence “worth a try”, not more.',
       'Fatigue : une méta-analyse de 13 essais (1 126 personnes, 2022) a trouvé une baisse petite à modérée dans l’ensemble; le sous-groupe des gens en santé n’était pas significatif. Douleurs des statines : une méta-analyse de 12 essais (2018) a trouvé un bénéfice, une de 6 essais (2015) non, et le centre américain des médecines complémentaires (NCCIH) juge que l’ensemble ne l’appuie pas. Il signale aussi l’interaction avec la warfarine. D’où « ça vaut l’essai », pas plus.']},
  iodine:{src:['nihI','hcEl'],
    e:['Needs: Health Canada’s DRI table — 150 µg/day for adults, 220 in pregnancy, upper limit 1,100. Sources and risks: the US National Institutes of Health fact sheet — seaweed, fish, dairy, eggs and iodized salt; processed foods almost always use non-iodized salt; sea, kosher and Himalayan salt usually aren’t iodized; people who avoid dairy, seafood, eggs or iodized salt are at risk; both too little and too much can cause thyroid problems. About 78 µg per quarter teaspoon of iodized salt is the US figure; Canadian salt is iodized at a similar level.',
       'Besoins : la table des ANREF de Santé Canada — 150 µg/jour pour les adultes, 220 pendant la grossesse, limite supérieure 1 100. Sources et risques : la fiche des National Institutes of Health (É.-U.) — algues, poisson, produits laitiers, œufs et sel iodé; la bouffe transformée utilise presque toujours du sel non iodé; le sel de mer, casher et de l’Himalaya n’est généralement pas iodé; ceux qui évitent les produits laitiers, les fruits de mer, les œufs ou le sel iodé sont à risque; trop peu comme trop peut causer des problèmes de thyroïde. Environ 78 µg par quart de cuillère à thé de sel iodé, c’est le chiffre américain; le sel canadien est iodé à un niveau semblable.']},
  vitamink:{src:['nihK','hcVit','cnf'],
    e:['The US National Institutes of Health fact sheet: adequate intake 120 µg/day for men and 90 µg/day for women (the same values as Health Canada’s table); matrix Gla protein and osteocalcin are vitamin-K-dependent; observational studies link more K2 with less arterial calcification, but trials are inconclusive — one 3-year trial in older adults found no overall difference in coronary calcification; for bone, the big benefits came from very high-dose Japanese MK-4 trials and later trials were mixed or null. Warfarin users are told to keep intake consistent. Food values are the Canadian Nutrient File, which reports vitamin K mostly as K1.',
       'La fiche des National Institutes of Health (É.-U.) : apport suffisant de 120 µg/jour pour les hommes et 90 µg/jour pour les femmes (les mêmes valeurs que la table de Santé Canada); la protéine Gla matricielle et l’ostéocalcine dépendent de la vitamine K; des études d’observation associent plus de K2 à moins de calcification des artères, mais les essais ne tranchent pas — un essai de 3 ans chez des aînés n’a trouvé aucune différence globale de calcification coronaire; pour l’os, les gros bénéfices venaient d’essais japonais à très forte dose de MK-4, et les essais suivants étaient partagés ou nuls. On dit aux gens sous warfarine de garder un apport constant. Les valeurs des aliments viennent du Fichier canadien sur les éléments nutritifs, qui rapporte surtout la vitamine K1.']},
  sleepstages:{src:['ninds','vancauter','ebrahim','drake','chinoy'],
    e:['The stage descriptions and the 90-minute cycle are the US National Institute of Neurological Disorders and Stroke’s standard summary. Growth hormone and deep sleep: a JAMA study of healthy men aged 16 to 83 (2000) found deep sleep fell from 18.9% to 3.4% of the night between early adulthood and midlife, with growth hormone falling alongside it and tracking deep sleep at every age. Alcohol: a review of 27 studies (2013) — faster sleep onset, more disrupted second half, less REM. Caffeine: a 2013 randomized study. Calling deep sleep “repair” is a simplification — growth hormone release is measured; the brain “cleaning” idea comes from mouse work and is still argued over, so it isn’t claimed here.',
       'Les descriptions des stades et le cycle de 90 minutes viennent du résumé standard de l’Institut national américain des troubles neurologiques (NINDS). Hormone de croissance et sommeil profond : une étude du JAMA chez des hommes en santé de 16 à 83 ans (2000) a trouvé que le sommeil profond tombait de 18,9 % à 3,4 % de la nuit entre le début de l’âge adulte et le milieu de la vie, l’hormone de croissance baissant en parallèle et suivant le sommeil profond à tous les âges. Alcool : une revue de 27 études (2013) — endormissement plus rapide, deuxième moitié plus perturbée, moins de REM. Caféine : une étude randomisée de 2013. Appeler le sommeil profond « réparation », c’est une simplification — la libération d’hormone de croissance est mesurée; l’idée du cerveau qui « fait le ménage » vient de travaux chez la souris et est encore débattue, alors on ne l’affirme pas ici.']},
  random:{src:['chinoy'],
    e:['There’s no trial of “random crashes” — this is the standard one-variable-at-a-time method (the same logic as an elimination diet), applied to energy. The tracker advice comes from a 2021 study of seven consumer sleep trackers against a sleep lab: most detected sleep well and matched research-grade wrist devices, but their sleep-stage numbers were inconsistent. Hence: trust the hours, not the “deep sleep”.',
       'Il n’existe pas d’essai sur les « crashs aléatoires » — c’est la méthode standard d’une variable à la fois (la même logique qu’une diète d’élimination), appliquée à l’énergie. Le conseil sur le traqueur vient d’une étude de 2021 sur sept traqueurs de sommeil grand public comparés à un laboratoire du sommeil : la plupart détectaient bien le sommeil, au niveau des appareils de recherche portés au poignet, mais leurs chiffres de stades de sommeil étaient incohérents. D’où : fie-toi aux heures, pas au « sommeil profond ».']},
  leak:{src:['bsg2021','ebrahim'],
    e:['A framing, backed piece by piece: blood loss is the leading cause of iron deficiency (UK guideline 2021); loose stools lose minerals (basic physiology); alcohol near bedtime fragments sleep (27 studies, 2013). The order “plug first, add second” is common sense, not a trial.',
       'Un principe, appuyé pièce par pièce : la perte de sang est la première cause de manque de fer (guide britannique 2021); les selles molles font perdre des minéraux (physiologie de base); l’alcool proche du coucher fragmente le sommeil (27 études, 2013). L’ordre « colmater d’abord, ajouter ensuite », c’est du gros bon sens, pas un essai.']},
  selftest:{src:[],
    e:['Changing one thing in one person, with a before, a during and a return, is the logic of an N-of-1 trial. A real N-of-1 trial adds blinding and repeats; this one can’t, so expectation and everything else that changes in two weeks can fool it. The odds come from a simple binomial model of bad days.',
       'Changer une seule chose chez une seule personne, avec un avant, un pendant et un retour, c’est la logique d’un essai N-de-1. Un vrai essai N-de-1 se fait à l’insu et se répète; celui-ci ne peut pas, alors les attentes et tout ce qui change en deux semaines peuvent le fausser. Les chances viennent d’un simple modèle binomial des mauvaises journées.']},
  coffeeiron:{src:['morck83'],
    e:['Morck 1983 (dual-isotope study, adults without iron deficiency): a cup of coffee with a hamburger meal reduced iron absorption by 39%, tea by 64%. With a test meal, drip coffee cut absorption from 5.9% to 1.6% and instant to 1.0%; instant at double strength, to 0.5%. No reduction when the coffee came an hour before the meal; the same reduction an hour after. The study measured non-heme iron — the kind in plant foods and pills.',
       'Morck 1983 (étude aux isotopes, adultes sans carence en fer) : une tasse de café avec un repas de hamburger a réduit l’absorption du fer de 39 %, le thé de 64 %. Avec un repas test, le café filtre l’a fait passer de 5,9 % à 1,6 %, le café instantané à 1,0 %, et l’instantané deux fois plus fort à 0,5 %. Aucune baisse quand le café venait une heure avant le repas; la même baisse une heure après. L’étude mesurait le fer non héminique — celui des végétaux et des comprimés.']}
};

  s.noSalt = s.bp||s.kidney||s.preg||s.lithium||!known;

function buildPatch(){

  if(minor) P.notes.push(L(`<b>Under 18: this wasn’t built for you.</b> The doses and the alcohol advice are for adults, so the Add card is empty on purpose. What still holds: protein before noon, caffeine done by noon, and if you’re tired all the time, ask a parent, school nurse or doctor for a ferritin test — low iron is very common at your age and it looks exactly like “lazy”.`,
    `<b>Moins de 18 ans : ça n’a pas été bâti pour toi.</b> Les doses et les conseils sur l’alcool sont pour des adultes, alors la carte Ajouter est vide exprès. Ce qui s’applique quand même : des protéines avant midi, la caféine finie à midi, et si tu es toujours à plat, demande à un parent, à l’infirmière de l’école ou à un médecin un test de ferritine — manquer de fer est très fréquent à ton âge, et de l’extérieur, ça passe pour de la paresse.`));

    `<b>Enceinte : la patch change pour toi.</b> Pas de foie, pas de créatine, pas d’eau salée. Caféine : 300 mg par jour maximum — environ une tasse et demie de café filtre.${drinks?' Alcool : aucune quantité n’est reconnue sécuritaire pendant la grossesse; si arrêter est difficile, c’est une conversation avec un pharmacien ou la clinique prénatale cette semaine, pas un remplacement.':''} Chaque supplément ci-dessous passe d’abord par le feu vert du pharmacien — ${T('prenatal','une vitamine prénatale avec 16 à 20 mg de fer','une vitamine prénatale avec 16 à 20 mg de fer')} est la base (Santé Canada). La ferritine est encore plus importante pour toi : la cible de fer monte de moitié pendant la grossesse, de 18 à 27 mg. Demande-la à ta prochaine visite.`));
  else if(BF) P.notes.push(L(`<b>Breastfeeding: a few things change.</b> Caffeine: 300 mg a day at most — about a mug and a half of drip coffee. No creatine — there’s no safety data while breastfeeding. Every supplement below gets the pharmacist’s yes first. ${T('prenatal','Keep taking your prenatal')}: Health Canada recommends a multivitamin with 0.4 mg folic acid every day while breastfeeding. Many also carry B12, which matters if you don’t eat meat or fish.${drinks?' Alcohol: not drinking is safest while breastfeeding (Canada’s guidance). If you do have one, feed first and wait about two hours per drink before the next feed.':''} Your iron target drops back after the birth, but pregnancy and delivery can leave the stores empty — that’s what the ferritin test shows. You need more protein now, not less: about 1.3 g per kg a day.`,
    `<b>Allaitement : quelques affaires changent.</b> Caféine : 300 mg par jour maximum — environ une tasse et demie de café filtre. Pas de créatine — il n’y a pas de données de sécurité pendant l’allaitement. Chaque supplément ci-dessous passe d’abord par le feu vert du pharmacien. ${T('prenatal','Continue ta vitamine prénatale','Continue ta vitamine prénatale')} : Santé Canada recommande une multivitamine avec 0,4 mg d’acide folique chaque jour pendant l’allaitement. Plusieurs contiennent aussi de la B12, ce qui compte si tu ne manges ni viande ni poisson.${drinks?' Alcool : ne pas boire, c’est le plus sûr pendant l’allaitement (repères canadiens). Si tu en prends un, allaite d’abord et attends environ deux heures par verre avant la prochaine tétée.':''} Ta cible de fer redescend après l’accouchement, mais la grossesse et l’accouchement peuvent vider les réserves — c’est ce que le test de ferritine montre. Tu as besoin de plus de protéines maintenant, pas moins : environ 1,3 g par kg par jour.`));

    `<b>Maladie des reins : ça change la liste des suppléments.</b> Les reins éliminent le magnésium, le potassium et les résidus de la créatine, alors : pas de comprimés de magnésium, pas de créatine, pas d’eau salée, et demande à ton néphrologue ou à ta clinique rénale avant de changer ta quantité de patates, de sel ou de potassium. Demande à ton pharmacien si le psyllium nature (ça prend un grand verre d’eau chaque fois — c’est important si tu as une restriction de liquides) et la B1 cadrent avec ton plan. La ferritine compte quand même — maladie des reins et manque de fer vont souvent ensemble.`));
  else if(bp) P.notes.push(L(`<b>High blood pressure or heart disease:</b> salt water is off your card. Everything else stands. If you take a blood-pressure pill or a water pill, ask the pharmacist before adding magnesium or piling on potassium-rich food like potatoes and fish — some of those pills hold potassium in, and the combination needs a blood check.`,
    `<b>Hypertension ou maladie du cœur :</b> on retire l’eau salée de ta carte. Le reste tient. Si tu prends une pilule pour la pression ou un diurétique, demande au pharmacien avant d’ajouter du magnésium ou de te bourrer d’aliments riches en potassium comme les patates et le poisson — certaines de ces pilules retiennent le potassium, et la combinaison demande une prise de sang.`));

  if(any('flags','chest','faint')) P.stops.push(
    L(`<b>Call 911 or get to an emergency department now.</b> ${has('flags','chest')?'Chest pain is not a diet problem and not a walk-in problem. ':''}${has('flags','faint')?'Fainting or a racing heart with bleeding means you’ve lost too much blood. ':''}The patch can wait. This can’t.`,
      `<b>Appelle le 911 ou va à l’urgence maintenant.</b> ${has('flags','chest')?'Une douleur à la poitrine, ce n’est ni un problème d’alimentation ni un problème de clinique sans rendez-vous. ':''}${has('flags','faint')?'S’évanouir ou avoir le cœur qui s’emballe avec des saignements, c’est avoir perdu trop de sang. ':''}La patch peut attendre. Pas ça.`));
  else if(has('flags','black')) P.stops.push(

      `<b>À l’urgence aujourd’hui — pas une clinique sans rendez-vous, pas le 811.</b> Des selles noires ou goudronneuses, c’est un saignement plus haut dans l’intestin. Ça doit être vu aujourd’hui, et la patch attend que ce soit fait.`));
  if(has('flags','weight')) P.stops.push(

  if(has('flags','shaky') && minor) P.stops.push(
    L(`<b>Shaky or sweaty when you skip a drink means your body has started depending on it — tell an adult today.</b> A parent, a school nurse, or 811. Don’t stop all at once on your own: ${T('withdrawal','stopping suddenly')} can be dangerous, and a doctor can make it safe. A seizure, confusion, or seeing things that aren’t there: 911.`,
      `<b>Trembler ou suer quand tu sautes un verre, ça veut dire que ton corps a commencé à en dépendre — parles-en à un adulte aujourd’hui.</b> Un parent, l’infirmière de l’école, ou le 811. N’arrête pas tout d’un coup par toi-même : ${T('withdrawal','arrêter brusquement','arrêter brusquement')} peut être dangereux, et un médecin peut rendre ça sécuritaire. Une convulsion, de la confusion, ou voir des choses qui ne sont pas là : 911.`));
  else if(has('flags','shaky')) P.stops.push(
    L(`<b>Don’t stop drinking cold.</b> Shaky or sweaty when you skip means your body is dependent, and ${T('withdrawal','stopping suddenly')} can be dangerous. Start ${T('thiamine')} today, keep drinking at your usual level for now, and get a pharmacist or doctor to help you taper. The patch below assumes you keep drinking this week.`,
      `<b>N’arrête pas de boire d’un coup.</b> Trembler ou suer quand tu sautes un verre, ça veut dire que ton corps est dépendant, et ${T('withdrawal','arrêter brusquement','arrêter brusquement')} peut être dangereux. Commence la ${T('thiamine')} aujourd’hui, garde ta consommation habituelle pour l’instant, et fais-toi aider par un pharmacien ou un médecin pour diminuer graduellement. La patch ci-dessous suppose que tu continues à boire cette semaine.`));

  /* sleeping / anxiety pill + alcohol: the one combination on the card that can stop breathing. A rule, not a swap. */

  if(sedative && drinks){
    if(has('flags','shaky')) P.stops.push(
      L(`<b>A drink and a sleeping or anxiety pill on the same night can stop your breathing — and you also shake when you skip a drink.</b> Dependent on both is exactly what a doctor or pharmacist has to manage with you, this week, not a card. Neither one gets stopped cold. Say this sentence, word for word: “I drink every day and I take ${T('sedative','a sleeping pill')}.”`,
        `<b>Un verre et un somnifère ou une pilule pour l’anxiété la même soirée peuvent arrêter ta respiration — et tu trembles aussi quand tu sautes un verre.</b> Dépendant des deux, c’est exactement ce qu’un médecin ou un pharmacien doit gérer avec toi, cette semaine, pas une carte. Ni l’un ni l’autre ne s’arrête d’un coup. Dis cette phrase, mot pour mot : « Je bois tous les jours et je prends ${T('sedative','un somnifère','un somnifère')}. »`));
    else P.stops.push(
      L(`<b>A drink and ${T('sedative','a sleeping or anxiety pill')} on the same night is the one combination on this card that can stop your breathing.</b> Both press the same brake. The label’s words: do not drink alcohol with it. So this isn’t a swap, it’s a rule — the drink and the pill don’t share a night. If you can’t picture an evening without both, say exactly that to the pharmacist this week. They’ve heard it before.`,
        `<b>Un verre et ${T('sedative','un somnifère ou une pilule pour l’anxiété','un somnifère ou une pilule pour l’anxiété')} la même soirée, c’est la seule combinaison sur cette carte qui peut arrêter ta respiration.</b> Les deux appuient sur le même frein. Les mots de la monographie : ne buvez pas d’alcool avec. Alors ce n’est pas un remplacement, c’est une règle — le verre et la pilule ne partagent pas une soirée. Si tu n’arrives pas à imaginer une soirée sans les deux, dis exactement ça au pharmacien cette semaine. Il a déjà entendu ça.`));
  }

  const alcoholKeys=['beer','wine','spirits'];
  const keepShown = (preg||minor) ? keep.filter(k=>!alcoholKeys.includes(k)) : keep;
  const alcoholDropped = keepShown.length!==keep.length;
  P.keepNote = L('Untouched. Not this week, maybe not ever. The patch works around them.','On n’y touche pas. Pas cette semaine, peut-être jamais. La patch s’adapte autour.');

  else P.keep=[L('Nothing to keep — you’re not running on any of the usual fuels. The patch is about what’s missing, not what to cut.','Rien à garder — tu ne roules à aucun des carburants habituels. La patch porte sur ce qui manque, pas sur quoi couper.')];
  P.keepShort = keepShown.length ? P.keep.slice() : [];

  const sweat = !!(S.tank&&S.tank.p&&S.tank.p.work==='heavy'); const saltOn = !noSalt && sweat;
  const saltyA = !saltOn ? L('a big glass of water','un grand verre d’eau') : L(T('salt','a glass of salted water'), T('salt','un verre d’eau salée','un verre d’eau salée'));
  const saltyB = !saltOn ? L('water','de l’eau') : L(T('salt','salted water'), T('salt','de l’eau salée','de l’eau salée'));
  if(has('fuel','energy') && minor) P.swap.push(L(`Energy drinks aren’t made for under-18s — it says so on the can. If you’re keeping it this week: one small can — a 250 ml Red Bull is 80 mg; a Monster or Celsius alone is over your daily limit — before 2 p.m., never on an empty stomach, and water with it. The 3 p.m. crash it “fixes” is mostly the breakfast you skipped.`, `Les boissons énergisantes ne sont pas faites pour les moins de 18 ans — c’est écrit sur la canette. Si tu la gardes cette semaine : une petite canette — un Red Bull de 250 ml, c’est 80 mg; un Monster ou un Celsius à lui seul dépasse ta limite quotidienne — avant 14 h, jamais à jeun, et de l’eau avec. Le crash de 15 h qu’elle « règle », c’est surtout le déjeuner que tu as sauté.`));
  else if(has('fuel','energy')) P.swap.push(has('keep','energy')

    : L(`The mid-shift energy drink → ${saltyB}, a protein snack (jerky, cheese, boiled eggs), five minutes outside. It was doing a job — ${saltOn?'low salt, ':''}no protein since morning — and this does the same job without the ${T('sweeteners')} and the midnight caffeine.`, `La boisson énergisante du milieu de quart → ${saltyB}, une collation protéinée (jerky, fromage, œufs cuits durs), cinq minutes dehors. Elle comblait un besoin — ${saltOn?'manque de sel, ':''}pas de protéines depuis le matin — et ça fait la même job sans les ${T('sweeteners')} ni la caféine à minuit.`));
  if(has('fuel','coffee')) P.swap.push(L(`${T('caffeine','Coffee')} stays. One rule: nothing after noon — on shifts, nothing in the 8 hours before you sleep. ${any('sleep','5','6','broken')?'On short sleep this is the single biggest free change you can make.':''}${(preg||SF.bf)?' And 300 mg a day at most — about a mug and a half of drip coffee.':''}`, `Le ${T('caffeine','café','café')} reste. Une règle : rien après midi — sur les quarts, rien dans les 8 heures avant de dormir. ${any('sleep','5','6','broken')?'Quand le sommeil manque, c’est le plus gros changement gratuit qui existe.':''}${(preg||SF.bf)?' Et 300 mg par jour maximum — environ une tasse et demie de café filtre.':''}`));

  if(alcoholSwaps && has('fuel','wine')) P.swap.push(L(`Dry white over red — red is the ${T('histamine')} champion. One glass with food. Or ${T('vodkasoda')}.`, `Blanc sec plutôt que rouge — le rouge est le pire côté ${T('histamine')}. Un verre en mangeant. Ou ${T('vodkasoda')}.`));

    : L(`${T('protein','Something with protein in your first hours awake.')} ${protEx()[0]}. That alone moves the afternoon crash.`, `${T('protein','Des protéines dans tes premières heures debout.','Des protéines dans tes premières heures debout.')} ${protEx()[1]}. Juste ça, ça repousse le crash de l’après-midi.`));
  const noExtraSalt = kidney||bp||has('meds','lithium');
  const potatoes = noExtraSalt ? L('Potatoes','Des patates') : L('Potatoes with salt','Des patates salées');
  if(SF.veg){
    if(cook==='no') P.eat.push(L(`No stove needed: boiled eggs, Greek yogurt and cheese if you eat them, hummus, rinsed canned lentils or chickpeas, enriched soy milk, and a potato microwaved for five minutes${noExtraSalt?'':', with salt'}. Cheap, and it covers iron, potassium and magnesium — B12 needs the enriched milk or a pill.`, `Pas besoin de poêle : des œufs cuits durs, du yogourt grec et du fromage si tu en manges, du houmous, des lentilles ou des pois chiches en canne rincés, de la boisson de soya enrichie, et une patate cinq minutes au micro-ondes${noExtraSalt?'':', avec du sel'}. Pas cher, et ça couvre le fer, le potassium et le magnésium — la B12 demande la boisson enrichie ou une pilule.`));
    else P.eat.push(L(`${potatoes}, lentils, beans or tofu most days, eggs or dairy if you eat them, and enriched soy milk. Cheap, and it covers iron, potassium and magnesium — B12 needs the enriched milk or a pill. Something with vitamin C in the same meal helps the iron in.${kidney?' Potassium and salt amounts: your kidney team’s call.':''}`, `${potatoes}, des lentilles, des fèves ou du tofu la plupart des jours, des œufs ou des produits laitiers si tu en manges, et de la boisson de soya enrichie. Pas cher, et ça couvre le fer, le potassium et le magnésium — la B12 demande la boisson enrichie ou une pilule. Quelque chose avec de la vitamine C dans le même repas aide le fer à passer.${kidney?' Quantités de potassium et de sel : c’est ton néphrologue qui décide.':''}`));
  } else {
  if(cook==='no') P.eat.push(L(`No stove needed: rotisserie chicken, boiled eggs from the deli case, Greek yogurt tubs, cheese, canned sardines or salmon, and a potato poked with a fork and microwaved for five minutes${noExtraSalt?'':', with salt'}. Cheap, and it covers iron, potassium, B12 and magnesium.${kidney?' Potassium and salt amounts: your kidney team’s call.':''}`, `Pas besoin de poêle : un poulet rôti de l’épicerie, des œufs cuits durs déjà faits, des pots de yogourt grec, du fromage, des sardines ou du saumon en canne, et une patate piquée à la fourchette, cinq minutes au micro-ondes${noExtraSalt?'':', avec du sel'}. Pas cher, et ça couvre le fer, le potassium, la B12 et le magnésium.${kidney?' Quantités de potassium et de sel : c’est ton néphrologue qui décide.':''}`));
  else P.eat.push(L(`${potatoes}, a tin of sardines or salmon a few times a week, beef when you can. Cheap, and it covers iron, potassium, B12 and magnesium.${kidney?' Potassium and salt amounts: your kidney team’s call.':''}`, `${potatoes}, une canne de sardines ou de saumon quelques fois par semaine, du bœuf quand tu peux. Pas cher, et ça couvre le fer, le potassium, la B12 et le magnésium.${kidney?' Quantités de potassium et de sel : c’est ton néphrologue qui décide.':''}`));

  const needCre = any('crash','pm','all','am') && !kidney && !preg && !SF.bf;
