    s:['The bars show what went in, not what your body holds. Some nutrients have real backup: vitamin A and B12 (months to years, in the liver), folate (a few months), iron (depends on blood loss), vitamin D (weeks to months). For those, one low day means little — the week matters. Others have little spare: thiamine (B1) runs down in weeks, vitamin C in about a month, and zinc, vitamin K and potassium have no dedicated store, so steady intake matters. Calcium and magnesium sit mostly in bone: a lot is in the body, but drawing on it costs bone, so it isn’t a spare tank. The app never calculates what’s left in your stores — food entries can’t tell it that.',
       'Les barres montrent ce qui est entré, pas ce que ton corps garde. Certains nutriments ont une vraie réserve : la vitamine A et la B12 (des mois à des années, dans le foie), le folate (quelques mois), le fer (selon les pertes de sang), la vitamine D (des semaines à des mois). Pour eux, une journée basse compte peu — c’est la semaine qui importe. D’autres ont peu de réserve : la thiamine (B1) s’épuise en quelques semaines, la vitamine C en environ un mois, et le zinc, la vitamine K et le potassium n’ont pas de réserve dédiée, alors l’apport régulier compte. Le calcium et le magnésium sont surtout dans les os : il y en a beaucoup dans le corps, mais y puiser coûte de l’os, alors ce n’est pas un réservoir de secours. L’app ne calcule jamais ce qui reste dans tes réserves — tes entrées alimentaires ne peuvent pas le lui dire.']},
  manganese:{g:'solid', t:['Manganese','Manganèse'],
    s:['A trace mineral the body uses as a switch for enzymes: building bone and cartilage, handling blood sugar and protein, making cholesterol, one of the main antioxidant enzymes inside your cells, and — with vitamin K — clotting. You need very little: about 2.3 mg a day for men, 1.8 for women, 2 in pregnancy. Shortage is rare; mussels, oysters, whole grains, nuts, legumes, tea and coffee carry plenty. The risk runs the other way: the upper limit is 11 mg a day, and too much over time affects the nervous system — tremor, unsteadiness, mood and memory changes, and in bad cases movement problems like Parkinson’s. That has come from welding fumes, mining dust and well water high in manganese more than from food. Low iron makes the body absorb more, and liver disease clears it slower. So: food is plenty for nearly everyone; a stand-alone pill (5–20 mg) is the way to overshoot.',
       'Un oligo-élément que le corps utilise comme interrupteur pour des enzymes : bâtir les os et le cartilage, gérer la glycémie et les protéines, fabriquer le cholestérol, une des principales enzymes antioxydantes dans tes cellules, et — avec la vitamine K — la coagulation. Il en faut très peu : environ 2,3 mg par jour pour les hommes, 1,8 pour les femmes, 2 pendant la grossesse. Le manque est rare; les moules, les huîtres, les grains entiers, les noix, les légumineuses, le thé et le café en fournissent beaucoup. Le risque est plutôt dans l’autre sens : la limite supérieure est de 11 mg par jour, et trop, à la longue, touche le système nerveux — tremblements, déséquilibre, changements d’humeur et de mémoire, et dans les cas graves des troubles du mouvement semblables au Parkinson. C’est venu des fumées de soudure, de la poussière des mines et de l’eau de puits riche en manganèse plus que de la bouffe. Un manque de fer fait absorber davantage, et une maladie du foie l’élimine plus lentement. Donc : la bouffe suffit pour presque tout le monde; un comprimé seul (5–20 mg), c’est la façon de dépasser.']},
  vitamina:{g:'solid', t:['Vitamin A: signs of too much','Vitamine A : les signes d’un excès'],
    s:['The 3,000 mcg ceiling is for every day, over months — it counts only the preformed kind, from liver, fish-liver oil and supplements. Beta-carotene from carrots and sweet potato doesn’t count: the body converts only what it needs, and too much just tints the skin orange, harmlessly. Liver once a week averages out fine. Too much, most days, for weeks to months: headaches (often worse in the morning, sometimes with blurred vision), dry or peeling skin, cracked lip corners, sore muscles and joints, tiredness, low mood, and liver blood tests that come back off. A large cohort study also linked long-term high retinol intake to more hip fractures. In pregnancy, too much can cause birth defects — no liver, and no retinol supplements above the ceiling. All at once (a bottle of pills, or polar bear or seal liver): severe headache, vomiting, drowsiness, blurred vision within days — that’s an emergency. Daily drinking makes it worse: the same liver is storing the vitamin A and clearing the alcohol. None of these signs proves anything on its own; liver most days plus morning headaches and peeling skin is worth saying out loud to a doctor.',
       'Le plafond de 3 000 mcg, c’est pour chaque jour, sur des mois — il compte seulement la forme préformée, celle du foie, de l’huile de foie de poisson et des suppléments. Le bêta-carotène des carottes et des patates douces ne compte pas : le corps convertit seulement ce dont il a besoin, et l’excès colore juste la peau en orangé, sans danger. Du foie une fois par semaine, ça s’équilibre. Trop, presque tous les jours, pendant des semaines ou des mois : maux de tête (souvent pires le matin, parfois avec la vue brouillée), peau sèche ou qui pèle, coins des lèvres fendillés, muscles et articulations douloureux, fatigue, moral bas, et des prises de sang du foie qui reviennent anormales. Une grande étude de cohorte a aussi relié un apport élevé de rétinol à long terme à plus de fractures de la hanche. Pendant la grossesse, trop peut causer des malformations — pas de foie, et pas de suppléments de rétinol au-dessus du plafond. Tout d’un coup (une bouteille de pilules, ou du foie d’ours polaire ou de phoque) : mal de tête sévère, vomissements, somnolence, vue brouillée en quelques jours — c’est une urgence. Boire tous les jours aggrave les choses : le même foie stocke la vitamine A et élimine l’alcool. Aucun de ces signes ne prouve quoi que ce soit à lui seul; du foie presque tous les jours avec des maux de tête le matin et la peau qui pèle, ça vaut la peine d’en parler à un médecin.']},
  veg:{g:'solid', t:['No meat or fish','Sans viande ni poisson'],
    s:['Vegetarians and vegans can cover everything — four things just need a plan. B12 comes only from animal foods and fortified ones (enriched soy or almond milk, some veggie burgers, nutritional yeast if the label lists B12), so a vegan needs a fortified food or a pill every day. Iron and zinc from plants absorb less, so the targets are set higher: 1.8 times for iron, 1.5 times for zinc. Vitamin C in the same meal helps iron in; tea or coffee with the meal holds it back. Iodine: without dairy, fish or eggs, iodized table salt is the main source. Omega-3: flax, chia, hemp and walnuts give ALA, and the body turns only a little of it into the DHA in fish — algae oil is the plant source of DHA.',
       'Les végétariens et les véganes peuvent tout couvrir — quatre choses demandent juste un plan. La B12 vient seulement des aliments animaux et des aliments enrichis (boisson de soya ou d’amande enrichie, certaines galettes végé, la levure alimentaire si l’étiquette indique de la B12) : une personne végane a besoin d’un aliment enrichi ou d’une pilule chaque jour. Le fer et le zinc des plantes s’absorbent moins bien, donc les cibles sont plus hautes : 1,8 fois pour le fer, 1,5 fois pour le zinc. De la vitamine C dans le même repas aide le fer à passer; le thé ou le café avec le repas le bloque. L’iode : sans produits laitiers, poisson ni œufs, le sel de table iodé est la source principale. Les oméga-3 : le lin, le chia, le chanvre et les noix donnent de l’ALA, et le corps n’en transforme qu’un peu en DHA, celui du poisson — l’huile d’algues est la source végétale de DHA.']},
  pp:{g:'solid', t:['Tired in the year after a birth','Fatigue dans l’année après un accouchement'],
    s:['“It’s postpartum” says when, not why. Broken sleep with a baby is real fatigue — and three other causes hide behind it, each one blood test. Iron: pregnancy and delivery drain it, and anemia after birth is common even in rich countries. Thyroid: in about 1 in 14 women it swings after a birth — often a few weeks fast, then slow, most often 4 to 8 months after the baby — with tiredness, weight gain, constipation and low mood that get blamed on the baby. Most recover within a year or so; some stay slow and need a pill. B12: worth adding if you don’t eat meat or fish, or are breastfeeding on a vegan diet. Ask for ferritin, TSH and B12 together. And mood, which no blood test catches: postpartum depression and anxiety are more common than any of the three, and they often look like plain exhaustion. The EPDS is the standard 10-question screen — your doctor or public-health nurse has it. Any thought of harming yourself or the baby: 9-8-8 or 911, now.',
       '« C’est post-partum », ça dit quand, pas pourquoi. Le sommeil coupé avec un bébé, c’est une vraie fatigue — et trois autres causes se cachent derrière, chacune une prise de sang. Le fer : la grossesse et l’accouchement le vident, et l’anémie après l’accouchement est fréquente même dans les pays riches. La thyroïde : chez environ 1 femme sur 14, elle se dérègle après un accouchement — souvent quelques semaines trop vite, puis trop lente, le plus souvent de 4 à 8 mois après le bébé — avec une fatigue, une prise de poids, de la constipation et un moral bas qu’on met sur le dos du bébé. La plupart s’en remettent en un an environ; certaines restent au ralenti et ont besoin d’une pilule. La B12 : à ajouter si tu ne manges ni viande ni poisson, ou si tu allaites en étant végane. Demande la ferritine, la TSH et la B12 ensemble. Et le moral, qu’aucune prise de sang n’attrape : la dépression et l’anxiété post-partum sont plus fréquentes que les trois autres, et elles ressemblent souvent à de la simple fatigue. L’EPDS est le questionnaire standard de 10 questions — ton médecin ou l’infirmière de santé publique l’a. Une pensée de te faire du mal ou d’en faire au bébé : 9-8-8 ou 911, tout de suite.']},
  prenatal:{g:'solid', t:['Prenatal vitamin','Vitamine prénatale'],
    s:['A multivitamin made for pregnancy and the months around it. Health Canada recommends a daily multivitamin with 0.4 mg of folic acid for anyone who could become pregnant, is pregnant or is breastfeeding: folic acid protects a baby’s spine and brain in the first weeks, often before anyone knows there is a baby. In pregnancy it should also carry 16–20 mg of iron — the one iron dose you take without a ferritin test first. Many also carry B12; check the label if you don’t eat meat or fish. More than 1 mg of folic acid a day only on a doctor’s advice. Most gummy multivitamins don’t have enough iron.',
       'Une multivitamine faite pour la grossesse et les mois autour. Santé Canada recommande une multivitamine avec 0,4 mg d’acide folique chaque jour à toute personne qui pourrait tomber enceinte, qui est enceinte ou qui allaite : l’acide folique protège la colonne et le cerveau du bébé dans les premières semaines, souvent avant que quiconque sache qu’il y a un bébé. Pendant la grossesse, elle devrait aussi contenir de 16 à 20 mg de fer — la seule dose de fer qu’on prend sans test de ferritine d’abord. Plusieurs contiennent aussi de la B12; vérifie l’étiquette si tu ne manges ni viande ni poisson. Plus de 1 mg d’acide folique par jour seulement sur l’avis d’un médecin. La plupart des multivitamines en jujubes n’ont pas assez de fer.']},
  toomuch:{g:'solid', t:['Too much: ceilings and warning signs','Trop : plafonds et signaux d’alarme'],
    s:['A ceiling is the most you can take every day for months without expecting harm — not a target, and not a line where trouble starts the next morning. Food alone rarely gets there; the exceptions are liver (vitamin A, copper) and Brazil nuts (selenium). Most overload is stacking: a multivitamin, a B-complex, two energy drinks, a protein bar and a fortified cereal can each look small. The fat-soluble ones (A, D, E, K) build up in the body; most of the B vitamins and C leave in urine — except B6 and niacin, which can still do harm. If you notice any of the signs below and you take supplements, stop the newest one and tell the pharmacist. Chest pain, fainting, seizures or confusion: 911.',
       'Un plafond, c’est le maximum qu’on peut prendre chaque jour pendant des mois sans s’attendre à des dommages — pas une cible, et pas une ligne où les problèmes commencent le lendemain matin. La bouffe seule y arrive rarement; les exceptions sont le foie (vitamine A, cuivre) et les noix du Brésil (sélénium). La plupart des excès viennent de produits qui s’additionnent : une multivitamine, un complexe B, deux boissons énergisantes, une barre protéinée et une céréale enrichie peuvent chacun avoir l’air de pas grand-chose. Les vitamines liposolubles (A, D, E, K) s’accumulent dans le corps; la plupart des vitamines B et la C sortent dans l’urine — sauf la B6 et la niacine, qui peuvent quand même faire du tort. Si tu remarques un des signes plus bas et que tu prends des suppléments, arrête le plus récent et parles-en au pharmacien. Douleur à la poitrine, évanouissement, convulsions ou confusion : 911.'],
    rows:[[["Vitamin A (retinol — liver, cod liver oil, pills)", "Vitamine A (rétinol — foie, huile de foie de morue, pilules)"], ["3,000 mcg a day", "3 000 mcg par jour"], ["After a very large dose: headache, nausea, dizziness, blurred vision.", "Après une très grosse dose : mal de tête, nausée, étourdissements, vision brouillée."], ["Months over the ceiling: liver damage, thinning bones and fractures, bone and joint pain, dry skin, hair loss. In pregnancy, birth defects. Beta-carotene from vegetables doesn’t count.", "Des mois au-dessus du plafond : dommages au foie, os plus minces et fractures, douleurs aux os et aux articulations, peau sèche, perte de cheveux. Pendant la grossesse, des malformations. Le bêta-carotène des légumes ne compte pas."]], [["Vitamin D", "Vitamine D"], ["4,000 IU a day", "4 000 UI par jour"], ["Usually nothing — trouble comes from months of high doses, typically 10,000 IU or more a day.", "Habituellement rien — le problème vient de mois à hautes doses, typiquement 10 000 UI ou plus par jour."], ["Too much calcium in the blood: nausea, vomiting, thirst, peeing a lot, constipation, confusion, kidney stones, heart-rhythm problems.", "Trop de calcium dans le sang : nausée, vomissements, soif, uriner souvent, constipation, confusion, pierres aux reins, troubles du rythme du cœur."]], [["Vitamin E (pills)", "Vitamine E (pilules)"], ["1,100 IU a day (1,500 if the label says d-alpha)", "1 100 UI par jour (1 500 si l’étiquette dit d-alpha)"], ["Rarely anything you’d feel.", "Rarement quelque chose qu’on sent."], ["Bleeding risk, including bleeding in the brain — worse with blood thinners. In one large trial, 400 IU a day raised prostate cancer risk.", "Risque de saignement, y compris dans le cerveau — pire avec un anticoagulant. Dans un grand essai, 400 UI par jour ont augmenté le risque de cancer de la prostate."]], [["Vitamin C", "Vitamine C"], ["2,000 mg a day", "2 000 mg par jour"], ["Diarrhea, cramps, nausea.", "Diarrhée, crampes, nausée."], ["Kidney stones in people prone to them. With the iron-overload gene, it pulls in more iron.", "Pierres aux reins chez ceux qui y sont portés. Avec le gène de la surcharge en fer, elle fait absorber plus de fer."]], [["Niacin (B3) — pills, fortified foods, energy drinks", "Niacine (B3) — pilules, aliments enrichis, boissons énergisantes"], ["35 mg a day", "35 mg par jour"], ["The flush: hot, red, itchy skin 15–30 minutes after the nicotinic-acid form. Niacinamide, the form in drinks and most B-complexes, doesn’t flush.", "Les rougeurs : peau chaude, rouge, qui pique 15–30 minutes après avoir pris la forme acide nicotinique. La niacinamide, celle des boissons et de la plupart des complexes B, ne fait pas rougir."], ["At gram doses (prescribed for cholesterol): liver damage, high blood sugar, gout, stomach upset.", "À des doses de l’ordre du gramme (prescrites pour le cholestérol) : dommages au foie, glycémie élevée, goutte, maux d’estomac."]], [["Vitamin B6", "Vitamine B6"], ["100 mg a day in Canada; 12 mg in Europe since 2023", "100 mg par jour au Canada; 12 mg en Europe depuis 2023"], ["Nothing you’d notice.", "Rien qu’on remarque."], ["Nerve damage: numb or tingling hands and feet, burning pain, unsteady walking. Usually fades over months after stopping.", "Atteinte des nerfs : engourdissements ou picotements aux mains et aux pieds, douleur qui brûle, démarche instable. Disparaît habituellement en quelques mois après l’arrêt."]], [["Folic acid (pills, fortified foods)", "Acide folique (pilules, aliments enrichis)"], ["1,000 mcg a day", "1 000 mcg par jour"], ["Nothing.", "Rien."], ["It can hide a B12 shortage on a blood test while the nerve damage from that shortage keeps going.", "Il peut cacher un manque de B12 dans une prise de sang pendant que l’atteinte des nerfs causée par ce manque continue."]], [["Iron", "Fer"], ["45 mg a day", "45 mg par jour"], ["Stomach pain, nausea, constipation, dark stools. A handful of iron pills can kill a small child — keep them locked away; poison centre or 911.", "Douleur à l’estomac, nausée, constipation, selles foncées. Une poignée de pilules de fer peut tuer un jeune enfant — garde-les sous clé; centre antipoison ou 911."], ["With the iron-overload gene: liver damage, diabetes, heart problems, joint pain, darker skin. That’s why iron pills need a ferritin number first.", "Avec le gène de la surcharge en fer : dommages au foie, diabète, problèmes de cœur, douleurs aux articulations, peau plus foncée. C’est pour ça que le fer en pilules demande d’abord un chiffre de ferritine."]], [["Zinc", "Zinc"], ["40 mg a day", "40 mg par jour"], ["Nausea, vomiting, cramps, diarrhea, headache, a metallic taste.", "Nausée, vomissements, crampes, diarrhée, mal de tête, goût de métal."], ["Weeks over the ceiling push copper down: anemia, low white cells, nerve damage. HDL (“good”) cholesterol drops.", "Des semaines au-dessus du plafond font baisser le cuivre : anémie, baisse des globules blancs, atteinte des nerfs. Le « bon » cholestérol (HDL) baisse."]], [["Copper", "Cuivre"], ["10 mg a day", "10 mg par jour"], ["Nausea, vomiting, belly pain, diarrhea.", "Nausée, vomissements, douleur au ventre, diarrhée."], ["Liver damage.", "Dommages au foie."]], [["Selenium", "Sélénium"], ["400 mcg a day", "400 mcg par jour"], ["Garlic breath, a metallic taste.", "Haleine d’ail, goût de métal."], ["Brittle nails, hair loss, skin rash, tiredness, irritability, nerve problems.", "Ongles cassants, perte de cheveux, éruptions sur la peau, fatigue, irritabilité, problèmes de nerfs."]], [["Magnesium (pills)", "Magnésium (pilules)"], ["350 mg a day from pills", "350 mg par jour en pilules"], ["Diarrhea, nausea, cramps.", "Diarrhée, nausée, crampes."], ["With kidney disease it builds up: weakness, low blood pressure, slow or irregular heartbeat.", "Avec une maladie des reins, il s’accumule : faiblesse, pression basse, cœur lent ou irrégulier."]], [["Calcium", "Calcium"], ["2,500 mg a day (2,000 after 50)", "2 500 mg par jour (2 000 après 50 ans)"], ["Constipation, bloating.", "Constipation, ballonnements."], ["Kidney stones; too much calcium in the blood when stacked with high-dose vitamin D.", "Pierres aux reins; trop de calcium dans le sang quand on le combine avec de la vitamine D à haute dose."]], [["Manganese", "Manganèse"], ["11 mg a day", "11 mg par jour"], ["Nothing you’d notice.", "Rien qu’on remarque."], ["Nervous-system effects: tremor, stiffness, mood and memory changes. Low iron makes the body absorb more.", "Effets sur le système nerveux : tremblements, raideur, changements d’humeur et de mémoire. Un manque de fer en fait absorber plus."]], [["Iodine", "Iode"], ["1,100 mcg a day", "1 100 mcg par jour"], ["Very large doses: burning mouth and throat, stomach upset.", "Très grosses doses : brûlure dans la bouche et la gorge, maux d’estomac."], ["The thyroid goes off in either direction — too slow or too fast — or swells (goiter). Kelp and seaweed pills are the usual way to get there.", "La thyroïde se dérègle dans un sens ou dans l’autre — trop lente ou trop rapide — ou elle enfle (goitre). Les pilules de varech et d’algues, c’est la façon habituelle d’y arriver."]], [["Potassium (pills, salt substitutes)", "Potassium (pilules, substituts de sel)"], ["no ceiling set for healthy kidneys", "pas de plafond fixé quand les reins vont bien"], ["Stomach upset.", "Maux d’estomac."], ["With kidney disease, or on some blood-pressure pills (ACE inhibitors, some water pills), it builds up: weakness and a dangerous heart rhythm. Salt substitutes are mostly potassium — ask the pharmacist first.", "Avec une maladie des reins, ou certaines pilules pour la pression (IECA, certains diurétiques), il s’accumule : faiblesse et rythme du cœur dangereux. Les substituts de sel, c’est surtout du potassium — demande au pharmacien d’abord."]], [["Caffeine", "Caféine"], ["400 mg a day (300 pregnant or breastfeeding; 2.5 mg/kg under 18)", "400 mg par jour (300 enceinte ou en allaitant; 2,5 mg/kg avant 18 ans)"], ["Jittery, racing heart, anxiety, upset stomach, can’t sleep. Very high doses — pills or powders, well over 1,000 mg — can cause vomiting, chest pain and seizures: 911.", "Nervosité, cœur qui s’emballe, anxiété, maux d’estomac, incapable de dormir. Les très grosses doses — pilules ou poudres, bien au-delà de 1 000 mg — peuvent causer vomissements, douleur à la poitrine et convulsions : 911."], ["Shorter, lighter sleep, anxiety, higher blood pressure. Dependence: skip it and a headache arrives 12–24 hours later and can last 2–9 days.", "Sommeil plus court et plus léger, anxiété, pression plus haute. Dépendance : saute-la et un mal de tête arrive 12–24 heures plus tard et peut durer de 2 à 9 jours."]]]},
  edrink:{g:'solid', t:['What’s in an energy drink','Ce qu’il y a dans une boisson énergisante'],
    s:['Caffeine: 80–180 mg a can. Canada caps caffeinated energy drinks at 180 mg a serving (US cans like Celsius carry 200 or more), and every can must say how many a day is the most — read that line. Sugar: a regular 473 ml Monster or Rockstar carries 54–61 g, about 13–15 teaspoons; sugar-free versions swap in sweeteners. B vitamins: niacin 20–40 mg, B6 2–10 mg, B12 many times your need. If you aren’t short, the extra does nothing for energy — and on top of a B-complex it passes ceilings. Taurine and glucuronolactone: Europe’s food-safety agency found no safety concern at energy-drink amounts. Guarana is more caffeine. The danger is the stack: several cans plus coffee, pre-workout or pills; mixing with alcohol, where caffeine hides how drunk you are; or a hard effort in the heat. Long run: worse sleep, anxiety, higher blood pressure and heart rate, palpitations — and daily use builds dependence: a headache 12–24 hours after the last can is withdrawal.',
       'Caféine : 80 à 180 mg par canette. Le Canada plafonne les boissons énergisantes caféinées à 180 mg par portion (les canettes américaines comme Celsius en ont 200 ou plus), et chaque canette doit dire combien par jour au maximum — lis cette ligne-là. Sucre : un Monster ou un Rockstar ordinaire de 473 ml en contient de 54 à 61 g, environ 13 à 15 cuillères à thé; les versions sans sucre le remplacent par des édulcorants. Vitamines B : niacine 20 à 40 mg, B6 2 à 10 mg, B12 plusieurs fois le besoin. Si tu n’en manques pas, le surplus ne donne pas d’énergie — et par-dessus un complexe B, ça dépasse les plafonds. Taurine et glucuronolactone : l’agence européenne de sécurité des aliments n’a trouvé aucun problème de sécurité aux quantités des boissons énergisantes. Le guarana, c’est encore de la caféine. Le danger, c’est l’accumulation : plusieurs canettes plus du café, un pre-workout ou des pilules; le mélange avec l’alcool, où la caféine cache à quel point l’alcool fait effet; ou un gros effort dans la chaleur. À la longue : sommeil moins bon, anxiété, pression et pouls plus hauts, palpitations — et l’usage quotidien crée une dépendance : un mal de tête 12 à 24 heures après la dernière canette, c’est du sevrage.']},
  fibre:{g:'solid', t:['Fibre','Fibres'],
    s:['The part of plants you don’t digest. It feeds the gut bacteria, keeps you full longer, and evens out stools in both directions. The adequate intake is 38 g a day for men and 25 for women under 51 (30 and 21 after) — most Canadians get about half. Beans, lentils, oats, whole grains, vegetables, fruit with the skin, nuts and seeds. Psyllium counts: a teaspoon of Metamucil is about 3 g. Go up slowly, with water — a big jump means gas for a week.',
       'La partie des plantes que tu ne digères pas. Elle nourrit les bactéries de l’intestin, coupe la faim plus longtemps et régularise les selles dans les deux sens. L’apport suffisant, c’est 38 g par jour pour les hommes et 25 pour les femmes avant 51 ans (30 et 21 après) — la plupart des Canadiens en ont environ la moitié. Fèves, lentilles, avoine, grains entiers, légumes, fruits avec la pelure, noix et graines. Le psyllium compte : une cuillère à thé de Metamucil, c’est environ 3 g. Monte doucement, avec de l’eau — un gros saut, c’est des gaz pour une semaine.']},
  bvits:{g:'solid', t:['Riboflavin and niacin (B2, B3)','Riboflavine et niacine (B2, B3)'],
    s:['Two of the B vitamins that turn food into energy. Real shortages are rare in people who eat meat, dairy, eggs or enriched grains; heavy drinking is the usual way in. The niacin bar counts what your body makes from protein too (60 mg of tryptophan makes 1 mg), so protein eaters rarely run low. Bright yellow urine after a B-complex is riboflavin leaving — harmless. Niacin’s 35 mg ceiling applies to pills, fortified foods and energy drinks, not to food.',
       'Deux des vitamines B qui transforment la nourriture en énergie. Les vrais manques sont rares chez ceux qui mangent viande, produits laitiers, œufs ou céréales enrichies; boire beaucoup, c’est la porte d’entrée habituelle. La barre de niacine compte aussi ce que ton corps fabrique à partir des protéines (60 mg de tryptophane donnent 1 mg), alors ceux qui mangent des protéines en manquent rarement. Une urine jaune fluo après un complexe B, c’est la riboflavine qui sort — sans danger. Le plafond de 35 mg de la niacine vise les pilules, les aliments enrichis et les boissons énergisantes, pas la nourriture.']},
  b6:{g:'solid', t:['Vitamin B6 — too much can hurt','Vitamine B6 — trop peut nuire'],
    s:['Needed to handle protein, make blood and keep nerves working. Food almost never gives too much. Pills can: B6 taken for months causes nerve damage — numb or tingling hands and feet, unsteady walking — that usually fades after stopping. Canada’s ceiling is 100 mg a day; Europe cut its ceiling to 12 mg in 2023 after reports of damage at lower doses. A B-50 complex is 50 mg; energy drinks add 2–10 mg a can. If you have tingling and take any of these, stop them first and tell your doctor.',
       'Nécessaire pour gérer les protéines, fabriquer le sang et garder les nerfs en état. La bouffe n’en donne presque jamais trop. Les pilules, oui : de la B6 prise pendant des mois cause une atteinte des nerfs — engourdissements ou picotements aux mains et aux pieds, démarche instable — qui disparaît habituellement à l’arrêt. Le plafond canadien est de 100 mg par jour; l’Europe a baissé le sien à 12 mg en 2023 après des cas à des doses plus basses. Un complexe B-50, c’est 50 mg; les boissons énergisantes ajoutent 2 à 10 mg par canette. Si tu as des picotements et que tu prends un de ceux-là, arrête-les d’abord et parles-en à ton médecin.']},
  selenium:{g:'solid', t:['Selenium — too much can hurt','Sélénium — trop peut nuire'],
    s:['A trace mineral the thyroid and the body’s antioxidant enzymes depend on. You need about 55 mcg a day; fish, seafood, meat, eggs and bread cover it. Brazil nuts are the outlier: one nut is around 95 mcg. The ceiling is 400 mcg a day — four Brazil nuts most days, or nuts plus a pill, gets there. Too much shows as garlic breath, a metallic taste, brittle nails and hair loss.',
       'Un oligo-élément dont dépendent la thyroïde et les enzymes antioxydantes du corps. Il en faut environ 55 mcg par jour; poisson, fruits de mer, viande, œufs et pain le couvrent. Les noix du Brésil sont l’exception : une noix, c’est environ 95 mcg. Le plafond est de 400 mcg par jour — quatre noix du Brésil presque tous les jours, ou des noix plus une pilule, y arrivent. L’excès se voit à l’haleine d’ail, à un goût de métal, aux ongles cassants et à la perte de cheveux.']},
  vite:{g:'solid', t:['Vitamin E','Vitamine E'],
    s:['An antioxidant that sits in fats and cell walls. Real shortage is very rare — it mostly happens with conditions that block fat absorption. Nuts, seeds, vegetable oils and greens cover the 22 IU a day. Pills don’t add much: trials haven’t shown they prevent heart disease or cancer, and in one large trial 400 IU a day raised prostate cancer risk by 17%. On a blood thinner, E adds to the bleeding risk. The ceiling counts pills only: 1,100 IU a day when the label says dl-alpha (synthetic), 1,500 IU when it says d-alpha (natural). The app uses 1,100, safe either way.',
       'Un antioxydant qui se loge dans les gras et les membranes des cellules. Le vrai manque est très rare — surtout avec des problèmes qui bloquent l’absorption des gras. Noix, graines, huiles végétales et légumes verts couvrent les 22 UI par jour. Les pilules n’ajoutent pas grand-chose : les essais n’ont pas montré qu’elles préviennent les maladies du cœur ou le cancer, et dans un grand essai, 400 UI par jour ont augmenté le risque de cancer de la prostate de 17 %. Sous anticoagulant, la E ajoute au risque de saignement. Le plafond compte seulement les pilules : 1 100 UI par jour quand l’étiquette dit dl-alpha (synthétique), 1 500 UI quand elle dit d-alpha (naturelle). L’app prend 1 100 : c’est sécuritaire dans les deux cas.']},
  coq10:{g:'try', t:['CoQ10','CoQ10'],
    s:['A compound every cell uses to make energy. It isn’t a vitamin: your body makes it, so there’s no daily need and no bar. Statins lower it, which is why it’s sold for statin muscle pain — but the trials disagree on whether it helps. For tiredness, a 2022 review of 13 trials found a small effect, clearer in people with a fatigue-related illness than in healthy people. Usual doses are 100–300 mg with food. Safe for most people; on warfarin it can change the dose you need, so tell the pharmacist.',
       'Un composé que chaque cellule utilise pour produire de l’énergie. Ce n’est pas une vitamine : ton corps en fabrique, alors il n’y a pas de besoin quotidien ni de barre. Les statines le font baisser, c’est pour ça qu’on le vend contre les douleurs musculaires des statines — mais les essais ne s’entendent pas sur l’effet. Pour la fatigue, une revue de 13 essais (2022) a trouvé un petit effet, plus clair chez les gens avec une maladie qui cause de la fatigue que chez les gens en santé. Les doses habituelles vont de 100 à 300 mg avec un repas. Sécuritaire pour la plupart; sous warfarine, ça peut changer la dose dont tu as besoin, alors dis-le au pharmacien.']},
  iodine:{g:'solid', t:['Iodine and the thyroid','L’iode et la thyroïde'],
    s:['The thyroid needs iodine to make the hormone that sets how fast you burn energy. Too little, and the thyroid slows down — that’s one of the things the TSH blood test catches. Too much does it too, so this isn’t one to stack supplements on. The daily need is 150 mcg (220 in pregnancy, 290 while breastfeeding). In Canada, table salt is iodized: about a quarter teaspoon covers half the day. Milk, eggs, fish and seaweed carry it too. The people who come up short: anyone who switched to sea salt, kosher or pink salt, skips dairy and fish, or eats mostly processed food (it’s salted with plain salt). If that’s you and you’re tired, ask for TSH with the rest of the bloodwork before buying anything.',
       'La thyroïde a besoin d’iode pour fabriquer l’hormone qui règle la vitesse à laquelle tu brûles ton énergie. Trop peu, et la thyroïde ralentit — c’est une des choses que la prise de sang de TSH détecte. Trop, ça le fait aussi, alors ce n’est pas un supplément à accumuler. Le besoin quotidien est de 150 mcg (220 pendant la grossesse, 290 pendant l’allaitement). Au Canada, le sel de table est iodé : environ un quart de cuillère à thé couvre la moitié de la journée. Le lait, les œufs, le poisson et les algues en contiennent aussi. Ceux qui en manquent : ceux qui sont passés au sel de mer, casher ou rose, qui sautent le lait et le poisson, ou qui mangent surtout transformé (salé au sel ordinaire). Si c’est toi et que tu es fatigué, demande la TSH avec le reste des analyses avant d’acheter quoi que ce soit.']},
  vitamink:{g:'likely', t:['Vitamin K and where calcium goes','La vitamine K et où va le calcium'],
    s:['Vitamin K switches on the proteins that clot blood, and two that handle calcium: osteocalcin, which builds calcium into bone, and matrix Gla protein, which helps keep it out of artery walls. That part is solid biology. What isn’t proven yet is that taking more vitamin K than food gives you keeps calcium out of arteries or prevents fractures — the trials so far are mixed. So: get the daily amount from food, and treat the “routing calcium” idea as likely, not settled. K1 comes from greens: a cup of cooked kale is ten times the day’s need, a cup of broccoli twice it, two cups of romaine almost all of it. K2 comes from fermented and animal foods — aged cheese, egg yolks, meat — and the Canadian file barely measures it, so the bar undercounts people who eat those. On warfarin (Coumadin), vitamin K works against the pill: don’t avoid greens, keep them steady.',
       'La vitamine K active les protéines qui font coaguler le sang, et deux qui s’occupent du calcium : l’ostéocalcine, qui fixe le calcium dans l’os, et la protéine Gla matricielle, qui aide à le garder hors des parois des artères. Ça, c’est de la biologie solide. Ce qui n’est pas encore prouvé, c’est que prendre plus de vitamine K que ce que la bouffe donne garde le calcium hors des artères ou prévient les fractures — les essais jusqu’ici sont partagés. Alors : va chercher la quantité du jour dans la bouffe, et prends l’idée du « calcium bien dirigé » comme probable, pas réglée. La K1 vient des légumes verts : une tasse de chou frisé cuit, c’est dix fois le besoin du jour, une tasse de brocoli deux fois, deux tasses de romaine presque tout. La K2 vient des aliments fermentés et animaux — fromage vieilli, jaunes d’œuf, viande — et le fichier canadien la mesure à peine, alors la barre sous-estime ceux qui en mangent. Sous warfarine (Coumadin), la vitamine K agit contre la pilule : n’évite pas les légumes verts, garde-les stables.']},
  sleepstages:{g:'likely', t:['Sleep stages — where the repair happens','Les stades du sommeil — où se fait la réparation'],
    s:['Sleep runs in cycles of about 90 minutes, four or five a night. Light sleep (stages 1 and 2) is about half the night: heart and breathing slow, temperature drops, and stage 2 helps lock in memory. Deep sleep (stage 3, “slow-wave”) is the repair shift: heart and breathing reach their lowest, you’re hardest to wake, and most of the day’s growth hormone — the body’s rebuild signal — is released then. Most deep sleep comes in the first half of the night. REM is the dreaming stage: the brain is nearly as active as awake, the body is held still, and it works on memory and emotion; REM periods get longer toward morning. What that means for you: alcohol puts you under fast, then breaks up the second half — the REM half. Afternoon caffeine makes deep sleep shallower. A short night cuts mostly REM, because REM is back-loaded. And deep sleep shrinks with age: in one study, men went from about 19% of the night in their early twenties to under 4% by midlife — so the deep sleep you have left is worth protecting. Trackers count your hours well but only guess at stages.',
       'Le sommeil roule par cycles d’environ 90 minutes, quatre ou cinq par nuit. Le sommeil léger (stades 1 et 2) fait environ la moitié de la nuit : le cœur et la respiration ralentissent, la température baisse, et le stade 2 aide à fixer la mémoire. Le sommeil profond (stade 3, « lent ») est le quart de réparation : le cœur et la respiration sont au plus bas, c’est là que tu es le plus dur à réveiller, et la plus grande partie de l’hormone de croissance de la journée — le signal de reconstruction du corps — est libérée à ce moment-là. La plupart du sommeil profond arrive dans la première moitié de la nuit. Le sommeil paradoxal (REM), c’est le stade des rêves : le cerveau est presque aussi actif qu’éveillé, le corps est immobilisé, et il travaille la mémoire et les émotions; ses périodes s’allongent vers le matin. Ce que ça veut dire pour toi : l’alcool t’assomme vite, puis brise la deuxième moitié de la nuit — celle du REM. La caféine de l’après-midi rend le sommeil profond moins profond. Une nuit courte coupe surtout le REM, parce qu’il est concentré à la fin. Et le sommeil profond diminue avec l’âge : dans une étude, les hommes passaient d’environ 19 % de la nuit au début de la vingtaine à moins de 4 % au milieu de la vie — alors celui qui te reste vaut la peine d’être protégé. Les traqueurs comptent bien tes heures mais devinent seulement les stades.']},
  random:{g:'try', t:['When the crash looks random','Quand le crash a l’air aléatoire'],
    s:['Random almost never means no cause. It usually means two or three causes that change from day to day, so no single one lines up. The usual suspects: sleep that varies (a short night, a drinking night, a late caffeine night), food that varies (a skipped meal, a big carb lunch, aged cheese or leftovers, a sugar-free drink made with artificial sweetener), a stimulant taken at different times, and the menstrual cycle. The way to find it is to stop the day from changing: same breakfast and same lunch every day for a week, then change one thing and keep it for three days before adding the next. Write down your bedtime and wake time, or wear a tracker — any watch, ring or phone app counts hours well; ignore its “deep sleep” numbers, those are rough. Log each crash with “Crash report”. After a week, crashes that follow bad nights are sleep; crashes that follow one food are that food.',
       'Aléatoire, ça ne veut presque jamais dire sans cause. Ça veut généralement dire deux ou trois causes qui changent d’une journée à l’autre, alors aucune ne s’aligne. Les suspects habituels : le sommeil qui varie (une nuit courte, une soirée à boire, une caféine tardive), la bouffe qui varie (un repas sauté, un gros dîner de féculents, du fromage vieilli ou des restants, une boisson sans sucre faite avec un édulcorant artificiel), un stimulant pris à des heures différentes, et le cycle menstruel. Pour trouver, il faut que la journée arrête de changer : même déjeuner et même dîner tous les jours pendant une semaine, puis change une seule chose et garde-la trois jours avant d’ajouter la suivante. Note ton heure de coucher et de lever, ou porte un traqueur — n’importe quelle montre, bague ou app de téléphone compte bien les heures; ignore ses chiffres de « sommeil profond », ils sont approximatifs. Mets chaque crash au journal avec « Noter un crash ». Après une semaine, les crashs qui suivent les mauvaises nuits, c’est le sommeil; ceux qui suivent un aliment, c’est cet aliment.']},
  leak:{g:'reason', t:['Stop the leak','Colmater la fuite'],
    s:['Before adding anything, find where you’re losing more than you take in. Blood in the toilet is iron leaving. Loose stools are minerals leaving. Alcohol in the three hours before bed is sleep leaving. A morning with nothing in it gets paid for at 3 p.m. Plug the biggest leak first; everything you add afterwards actually stays.',
       'Avant d’ajouter quoi que ce soit, trouve par où tu te vides. Du sang dans la toilette, c’est du fer qui part. Des selles molles, ce sont des minéraux qui partent. L’alcool dans les trois heures avant le coucher, c’est du sommeil qui part. Une matinée sans rien manger, ça se paie à 15 h. Colmate la plus grosse fuite d’abord; tout ce que tu ajoutes ensuite va enfin rester.']},
  selftest:{g:'reason', t:['Your own test','Ton propre test'],
    s:['A food becomes a lead only when bad days come with it so often that luck would do that less than 1 time in 50 — and even then, it’s just a reason to test. One change, two weeks, then back to how it was. Two weeks because bad days come and go: at three crashes a week, one quiet week happens by luck about 1 time in 5; two quiet weeks, rarely. It’s compared with the four weeks before, not two: a lead tends to show up right after a bad stretch, and next to that stretch anything looks better. Two weeks only catch a big difference, so “no clear change” doesn’t rule a food out — and when it looks better but can’t tell yet, you can keep going two more weeks. The swap keeps the protein the same so it can’t cause its own crash, and coffee and sleep stay put so the answer is about one thing. A slipped day just drops out. If the crashes come back when the food does — and they aren’t on most of your days anyway — that’s the clearest answer one person can get. Drinks are the exception: no days back, the two weeks are the answer. The odds shown assume your days are otherwise alike — they never quite are, so read them as rough.',
       'Un aliment devient une piste seulement quand les mauvaises journées l’accompagnent si souvent que le hasard ferait ça moins d’une fois sur 50 — et même là, c’est juste une raison de tester. Un seul changement, deux semaines, puis retour comme avant. Deux semaines parce que les mauvaises journées vont et viennent : à trois crashs par semaine, une semaine calme arrive par hasard environ 1 fois sur 5; deux semaines calmes, rarement. On compare avec les quatre semaines d’avant, pas deux : une piste apparaît souvent juste après une mauvaise passe, et à côté de cette passe, n’importe quoi paraît mieux. Deux semaines ne voient qu’une grosse différence, alors « pas de changement clair » n’écarte pas un aliment — et quand ça semble mieux sans pouvoir trancher, tu peux continuer deux semaines de plus. Le remplacement garde autant de protéines pour ne pas causer son propre crash, et le café et le sommeil restent pareils pour que la réponse porte sur une seule chose. Une journée d’écart est simplement retirée. Si les crashs reviennent quand l’aliment revient — et qu’ils ne sont pas là la plupart de tes journées de toute façon — c’est la réponse la plus claire qu’une personne puisse avoir. L’alcool fait exception : pas de jours de retour, les deux semaines sont la réponse. Les chances affichées supposent que tes journées se ressemblent autrement — ce n’est jamais tout à fait vrai, alors prends-les comme un ordre de grandeur.']},
  goalsq:{g:'reason', t:['Goals, and what you’d cut back on','Les objectifs, et ce que tu diminuerais'],
    s:['The app asks what you want — more energy, sleep, weight, muscle, less stress, a calmer gut — and what you’d cut back on to get there, instead of what you can’t do without. Your goals give each step its reason and decide what comes first between two suspects of about the same strength. They never hide one: if your own numbers point at something you said stays, the app says so plainly, and you decide. Change them any time with “Change your goals” in the plan.',
       'L’app te demande ce que tu veux — plus d’énergie, mieux dormir, le poids, le muscle, moins de stress, un ventre plus calme — et ce que tu diminuerais pour y arriver, au lieu de ce dont tu ne peux pas te passer. Tes objectifs donnent à chaque étape sa raison et décident ce qui passe en premier entre deux suspects à peu près aussi forts. Ils n’en cachent jamais un : si tes propres chiffres pointent vers une chose que tu as dit garder, l’app te le dit clairement, et c’est toi qui décides. Change-les n’importe quand avec « Changer tes objectifs », dans le plan.']},
  wlplan:{g:'likely', t:['Your weight plan','Ton plan pour le poids'],
    s:['Three rules. It only works if you’re not hungry — hunger leads to a binge, and a binge undoes the week — so the food is picked to keep you full. Your daily needs stay met even on fewer calories; the tank shows it. And the first 1–2 weeks drop fast, mostly water; after that, about a pound a week is a good pace. Two roads: mostly meat, eggs, cheese and fish (low-carb), or whole food — both work when you’re not hungry. The low-carb road isn’t offered while breastfeeding or in the year after a baby, with kidney disease, to vegetarians, or on insulin or a diabetes pill other than metformin; with high blood pressure or heart disease, ask your doctor first. No weight plan under 18, in pregnancy, or after trouble with eating. A number for the month is optional: the app turns it into calories a day under your need — never below 1,200 (1,500 for men) or 70% of your need — and a weekly weigh-in steers it.',
       'Trois règles. Ça marche seulement si tu n’as pas faim — la faim mène aux excès, et un gros excès défait la semaine — alors les aliments sont choisis pour couper la faim. Tes besoins de chaque jour restent comblés même avec moins de calories; le réservoir le montre. Et les 1 à 2 premières semaines descendent vite, surtout de l’eau; après, environ une livre par semaine, c’est un bon rythme. Deux chemins : surtout de la viande, des œufs, du fromage et du poisson (faible en glucides), ou des aliments entiers — les deux marchent quand tu n’as pas faim. Le chemin faible en glucides n’est pas offert pendant l’allaitement ni dans l’année après un bébé, avec une maladie des reins, aux végétariens, ni avec de l’insuline ou une pilule pour le diabète autre que la metformine; avec de l’hypertension ou une maladie du cœur, demande à ton médecin d’abord. Pas de plan pour le poids avant 18 ans, pendant la grossesse, ni si tu as déjà eu de la difficulté avec la nourriture. Un chiffre pour le mois, c’est optionnel : l’app le transforme en calories par jour sous ton besoin — jamais sous 1 200 (1 500 pour les hommes) ni sous 70 % de ton besoin — et une pesée par semaine le guide.']},
  cleanstart:{g:'likely', t:['The clean start','Les trois semaines sans les suspects habituels'],
    s:['The first 3 weeks of a weight plan leave out the foods with the most histamine or lactose — aged cheese, cured meat, canned or smoked fish, fermented foods, leftovers past a day, milk, ice cream and yogurt — so that if you feel off, it isn’t them. Then they come back one group a week. On a calm background, a food that brings the bad days back is far easier to see. Only foods with measured histamine or lactose are cut: tomatoes, spinach, citrus, bananas and chocolate stay, because the lists that ban them disagree with each other and with the lab numbers.',
       'Les trois premières semaines d’un plan pour le poids laissent de côté les aliments qui ont le plus d’histamine ou de lactose — fromages vieillis, charcuterie, poisson en conserve ou fumé, aliments fermentés, restants de plus d’une journée, lait, crème glacée et yogourt — pour que, si tu ne te sens pas bien, ce ne soit pas eux. Ensuite, ils reviennent un groupe par semaine. Quand le fond est calme, un aliment qui ramène les mauvaises journées se voit beaucoup plus facilement. Seuls les aliments avec de l’histamine ou du lactose mesurés sont coupés : les tomates, les épinards, les agrumes, les bananes et le chocolat restent, parce que les listes qui les interdisent ne s’entendent ni entre elles ni avec les chiffres du labo.']},
  muscle:{g:'solid', t:['Protein and muscle','Les protéines et le muscle'],
    s:['To build muscle you train, and you eat enough protein: gains level off around 1.6 g per kg of body weight a day, so that’s the target the app uses when muscle is one of your goals (not with kidney disease — that’s your doctor’s call). Creatine, 3–5 g a day, adds strength and size with training; vegetarians start with less in their muscles and gain the most. Alcohol works against it: a big night after training cut muscle building by about a quarter, even with protein.',
       'Pour prendre du muscle, tu t’entraînes, et tu manges assez de protéines : les gains plafonnent autour de 1,6 g par kg de poids par jour, alors c’est la cible que l’app prend quand le muscle est un de tes objectifs (pas avec une maladie des reins — c’est à ton médecin de décider). La créatine, 3 à 5 g par jour, ajoute de la force et du volume avec l’entraînement; les végétariens en ont moins dans leurs muscles au départ et en gagnent le plus. L’alcool va contre ça : une grosse soirée après l’entraînement a coupé la construction du muscle d’environ le quart, même avec des protéines.']},
  path:{g:'reason', t:['Your path','Ton chemin'],
    s:['The order the app asks for changes. First the basics: enough fuel through the day without one huge meal, caffeine done 8 hours before bed, the last drink 3 hours before bed. They’re free, they fix a lot, and a bad day from an empty tank or a wrecked night feels exactly like a bad day from a food or a drink. If the bad days stay with the basics in place (10 of 14 days), blood work: a blood count, ferritin with CRP, B12, TSH and the celiac test — before cutting any food, because the celiac test needs gluten in the diet, and because cutting a drink won’t fix low iron. Then the suspects, strongest first, one two-week test at a time. Every step has “I can’t”: the app moves to the next-best option instead of stopping, and anything skipped can be brought back. “Remind me” brings the card back on the day it says, when you open the app — it can’t ping your phone. The counting never stops: suspects are counted from day one and listed in History; the path only decides what the app asks of you.',
       'L’ordre dans lequel l’app te demande des changements. D’abord la base : assez de carburant dans ta journée sans un énorme repas, la caféine finie 8 heures avant le coucher, le dernier verre 3 heures avant le coucher. Ça ne coûte rien, ça règle beaucoup de choses, et une mauvaise journée qui vient d’un réservoir vide ou d’une nuit maganée ressemble exactement à une mauvaise journée qui vient d’un aliment ou d’un verre. Si les mauvaises journées restent avec la base en place (10 jours sur 14), la prise de sang : une formule sanguine, la ferritine avec la CRP, la B12, la TSH et le test cœliaque — avant de couper un aliment, parce que le test cœliaque a besoin de gluten dans l’alimentation, et parce que couper un verre ne réglera pas un manque de fer. Ensuite les suspects, le plus fort d’abord, un test de deux semaines à la fois. Chaque étape a « Je ne peux pas » : l’app passe à la meilleure option suivante au lieu d’arrêter, et ce qui a été sauté peut revenir. « Rappelle-moi » ramène la carte le jour indiqué, quand tu ouvres l’app — elle ne peut pas t’envoyer de notification. Le compte ne s’arrête jamais : les suspects sont comptés dès le premier jour et listés dans l’Historique; le chemin décide seulement de ce que l’app te demande.']},
  hours:{g:'likely', t:['The hours before','Les heures d’avant'],
    s:['Some reactions come within hours, so the time matters, not just the day. For each crash, headache or itch you note with a time, the app looks at the meals you logged in the 4 hours before; for loose stools or bloating, the 6 hours before. Then, for each one, it looks at the same clock hours on days without it — days with a finished check-in that say it didn’t happen. So a 9 a.m. headache is compared with mornings and a 4 p.m. crash with afternoons, and a food you usually have at breakfast can’t look guilty just because some problems happen in the morning. A lead needs the same bar as the other suspects: at least 3 times with the food, a gap of 30 points, and a split luck would give less than 1 time in 50. Only meals with a time count, and a “no” only counts on days marked complete. Why those windows: a crash after a meal usually comes within a few hours; lactose shows up 30 minutes to 2 hours later; what ferments in the large bowel takes a few hours more. A lead is a reason to test, not proof.',
       'Certaines réactions arrivent en quelques heures, alors l’heure compte, pas juste la journée. Pour chaque crash, mal de tête ou démangeaison que tu notes avec l’heure, l’app regarde les repas notés dans les 4 heures avant; pour les selles molles ou les ballonnements, les 6 heures avant. Ensuite, pour chacun, elle regarde les mêmes heures les jours sans — des journées avec un bilan terminé qui dit que ça n’est pas arrivé. Un mal de tête à 9 h est donc comparé aux matins, un crash à 16 h aux après-midis, et un aliment que tu prends d’habitude au déjeuner ne peut pas avoir l’air coupable juste parce que certains problèmes arrivent le matin. Une piste demande le même seuil que les autres suspects : au moins 3 fois avec l’aliment, un écart de 30 points, et une répartition que le hasard donnerait moins d’une fois sur 50. Seuls les repas avec l’heure comptent, et un « non » compte seulement les jours marqués complets. Pourquoi ces fenêtres : un crash après un repas arrive d’habitude en quelques heures; le lactose se fait sentir de 30 minutes à 2 heures après; ce qui fermente dans le gros intestin prend quelques heures de plus. Une piste, c’est une raison de tester, pas une preuve.']},
  sugarloop:{g:'likely', t:['The sugar loop','La boucle du sucre'],
    s:['Sugar on its own is absorbed in the first stretch of the gut. The signals that say “full” fire further down, when protein, fat and fibre get there — so after sugar alone, hunger comes back sooner, and the fastest fix for hunger is more sugar. Fat with it slows the sugar, but makes the mix the body stores best and the brain wants most. The way out isn’t no sugar: it’s sugar after protein, not instead of it.',
       'Le sucre seul est absorbé dans le premier bout de l’intestin. Les signaux qui disent « plein » partent plus loin, quand les protéines, le gras et les fibres y arrivent — alors après du sucre seul, la faim revient plus vite, et le moyen le plus rapide de la calmer, c’est encore du sucre. Du gras avec ça ralentit le sucre, mais ça donne le mélange que le corps stocke le mieux et que le cerveau veut le plus. La sortie, ce n’est pas zéro sucre : c’est du sucre après les protéines, pas à leur place.']},
  fructose:{g:'likely', t:['Fructose','Fructose'],
    s:['Fruit sugar. It gets in through a slow, small door in the gut, and glucose alongside helps it through. When a food has more fructose than glucose — apples, pears, mango, watermelon, honey, apple juice — the extra can reach the colon, pull water in and ferment: gas, bloating, loose stools. It depends on the dose and the person, which is why it’s a test, not a rule. Berries, citrus, kiwi and banana usually go down easier.',
       'Le sucre des fruits. Il passe par une petite porte lente dans l’intestin, et le glucose qui l’accompagne l’aide à passer. Quand un aliment a plus de fructose que de glucose — pommes, poires, mangue, melon d’eau, miel, jus de pomme — le surplus peut se rendre au côlon, y attirer de l’eau et fermenter : gaz, ballonnements, selles molles. Ça dépend de la dose et de la personne, et c’est pour ça que c’est un test, pas une règle. Les petits fruits, les agrumes, le kiwi et la banane passent d’habitude mieux.']},
  warn:{g:'solid', t:['Warning signs: a doctor, not the app','Signes d’alarme : un médecin, pas l’app'],
    s:['Some things aren’t for a two-week test. Blood in the toilet or on the paper, black or tar-like stool, diarrhea with blood, losing weight without knowing why, diarrhea that wakes you at night, or a fever with it: these go to a doctor. Most turn out to be something small — the visit is how you find out. In Canada, 811 is the nurse line; a lot of blood or feeling faint is 911.',
       'Certaines affaires ne se règlent pas avec un test de deux semaines. Du sang dans la toilette ou sur le papier, des selles noires comme du goudron, de la diarrhée avec du sang, une perte de poids sans raison, de la diarrhée qui te réveille la nuit, ou de la fièvre avec ça : ça va chez le médecin. La plupart du temps, c’est quelque chose de petit — la visite, c’est comme ça qu’on le sait. Au Canada, le 811, c’est la ligne infirmière; beaucoup de sang ou un malaise, c’est le 911.']},
  labs:{g:'likely', t:['How the app reads blood results','Comment l’app lit tes résultats'],
    s:['Ferritin: under 15 is empty and under 30 low; under 70 still counts as low when CRP is over 5, because inflammation pushes ferritin up. Each point is roughly 8 to 10 mg of iron in storage. Hemoglobin: anemia is under 130 g/L for men, 120 for women, 110 in pregnancy. B12: under 133 pmol/L is a shortage, 133 to 258 a grey zone. Vitamin D: under 30 nmol/L is low, 50 or more is enough for almost everyone. “On paper” compares the iron you logged with what most people need and what almost everyone needs. It can’t see what you absorb or lose — only a second test can. Your lab’s range and your doctor have the last word.',
       'Ferritine : sous 15, c’est vide, et sous 30, bas; sous 70, ça compte encore comme bas quand la CRP dépasse 5, parce que l’inflammation gonfle la ferritine. Chaque point, c’est environ 8 à 10 mg de fer en réserve. Hémoglobine : l’anémie, c’est sous 130 g/L chez les hommes, 120 chez les femmes, 110 pendant la grossesse. B12 : sous 133 pmol/L, c’est un manque; de 133 à 258, une zone grise. Vitamine D : sous 30 nmol/L, c’est bas; 50 ou plus, c’est assez pour presque tout le monde. « Sur papier » compare le fer que tu as noté avec ce dont la plupart des gens ont besoin et ce dont presque tout le monde a besoin. Ça ne voit pas ce que tu absorbes ou perds — seul un deuxième test le peut. Les valeurs de ton labo et ton médecin ont le dernier mot.']},
  coffeeiron:{g:'solid', t:['Coffee and iron','Café et fer'],
    s:['Coffee or tea with a meal blocks part of the iron in plant foods and iron pills. In a controlled study a cup of coffee with a meal cut iron absorption by about 40%, tea by about 60%, and stronger coffee blocked more. Coffee an hour before the meal didn’t block it; an hour after, it still did. Meat’s iron is far less affected. So: coffee before meals, not with them or right after, and away from iron pills — no need to give it up. Coffee alone rarely explains low iron; periods, blood loss and low intake are the usual causes, so the question of why it’s low stays open.',
       'Le café ou le thé pris avec un repas bloque une partie du fer des végétaux et des comprimés de fer. Dans une étude contrôlée, une tasse de café avec le repas a réduit l’absorption du fer d’environ 40 %, le thé d’environ 60 %, et un café plus fort bloquait davantage. Le café pris une heure avant le repas ne bloquait rien; une heure après, oui. Le fer de la viande est beaucoup moins touché. Donc : le café avant les repas, pas pendant ni juste après, et loin des comprimés de fer — pas besoin de l’abandonner. Le café seul explique rarement un fer bas; les règles, une perte de sang et un apport faible sont les causes habituelles, alors la question de pourquoi il est bas reste ouverte.']}
};

const EV = {
  crcfam:{src:['ahscrc','cag18'],
    e:['Alberta’s screening guide: one parent, brother, sister or child with colorectal cancer at 60 or older — start at 40; under 60, or two of them — a colonoscopy every 5 years from 40, or 10 years before the youngest diagnosis. The Canadian Association of Gastroenterology’s 2018 consensus suggests starting at 40 to 50, or 10 years before the relative’s age at diagnosis, with a colonoscopy every 5 to 10 years or a stool test every 1 to 2 years. Pooled studies put the risk at about 2 times with one affected first-degree relative.',
       'Le guide de dépistage de l’Alberta : un parent, un frère, une sœur ou un enfant avec un cancer colorectal à 60 ans ou plus — commencer à 40 ans; avant 60 ans, ou deux proches — une coloscopie tous les 5 ans à partir de 40 ans, ou 10 ans avant le plus jeune diagnostic. Le consensus 2018 de l’Association canadienne de gastroentérologie suggère de commencer entre 40 et 50 ans, ou 10 ans avant l’âge du proche au diagnostic, avec une coloscopie tous les 5 à 10 ans ou un test de selles tous les 1 à 2 ans. Selon les études regroupées, le risque est environ 2 fois plus élevé avec un proche du premier degré atteint.']},
  setaside:{src:['bernstein14'],
    e:['In a Winnipeg survey of 156 healthy women, 73% had at least one gut symptom in the 5 days before or during their period — diarrhea in about a quarter (24% before, 28% during) — and about half had fatigue (Bernstein 2014). Those are the bad days the app reads: loose stools, crashes, low energy. It was a one-time survey, not a daily log — hence “likely”.',
       'Dans un sondage fait à Winnipeg auprès de 156 femmes en santé, 73 % avaient au moins un symptôme digestif dans les 5 jours avant leurs règles ou pendant — la diarrhée chez environ une sur quatre (24 % avant, 28 % pendant) — et environ la moitié, de la fatigue (Bernstein 2014). Ce sont justement les mauvaises journées que l’app lit : selles molles, crashs, énergie basse. C’était un sondage fait une seule fois, pas un journal quotidien — d’où « probable ».']},
  ferritin:{src:['bsg2021','who2020','thurnham','vaucher','gapqc'],
    e:['Two guidelines (UK gastroenterology 2021, WHO 2020) set the ferritin cut-offs and say to read it alongside an inflammation marker. A pooled analysis of 32 studies found inflammation pushes ferritin up by about 30%. One randomized trial of 198 women: iron helped fatigue when ferritin was under 50, even without anemia. Prices and pharmacist rules were checked in Nov 2026 and will change.',
       'Deux guides cliniques (gastro-entérologie britannique 2021, OMS 2020) fixent les seuils de ferritine et recommandent de la lire avec un marqueur d’inflammation. Une analyse groupée de 32 études : l’inflammation gonfle la ferritine d’environ 30 %. Un essai randomisé auprès de 198 femmes : le fer a soulagé la fatigue quand la ferritine était sous 50, même sans anémie. Les prix et les règles des pharmaciens ont été vérifiés en nov. 2026 — ça va changer.']},
  iron:{src:['vaucher','nhanesDep','irlssg','heirs'],
    e:['A randomized trial of 198 women: on iron, fatigue dropped by nearly half, versus under a third on placebo, when ferritin was under 50. Large US surveys link low iron to depressive symptoms — a link, not proof of cause, and weaker once other factors are counted. Restless legs: the international guideline treats with iron when ferritin is 75 or under. The “don’t start blind” warning: about 1 in 200 white North Americans carry the iron-overload gene pair (large screening study).',
       'Un essai randomisé auprès de 198 femmes : avec du fer, la fatigue a baissé de près de moitié, contre moins du tiers sous placebo, quand la ferritine était sous 50. De vastes enquêtes américaines relient le manque de fer aux symptômes dépressifs — un lien, pas une preuve de cause, et plus faible une fois les autres facteurs pris en compte. Jambes sans repos : le guide international recommande le fer quand la ferritine est à 75 ou moins. Pourquoi « jamais de fer à l’aveugle » : environ 1 Nord-Américain blanc sur 200 porte les deux gènes de la surcharge en fer (grande étude de dépistage).']},
  psyllium:{src:['acg','moayyedi','jovanovski','psylcase'],
    e:['The American College of Gastroenterology (2021) strongly recommends soluble fibre for IBS. A pooled analysis of 14 trials: one extra person in 7 improves compared with placebo. 28 trials show a small drop in LDL cholesterol. Blockage case reports exist — every one involved too little water or an already-narrowed bowel.',
       'Le Collège américain de gastro-entérologie (2021) recommande fortement les fibres solubles pour le côlon irritable. Analyse groupée de 14 essais : une personne de plus sur 7 va mieux par rapport au placebo. 28 essais montrent une petite baisse du cholestérol LDL. Des cas de blocage ont été rapportés — chaque fois avec trop peu d’eau ou sur un intestin déjà rétréci.']},
  magnesium:{src:['abbasi','kynast'],
    e:['One small randomized trial (46 older adults, 500 mg of magnesium oxide for 8 weeks) improved sleep measures; no trial ties the glycinate form to sleep. That cells need magnesium to make energy is basic biochemistry; alcohol and loose stools draining it is well described. Caffeine: a two-day metabolic-ward study (17 adults) measured a net extra loss of 0.16 mmol — about 4 mg — over 24 hours; real, but too small to justify a supplement on its own. No trial shows stimulant medication drains it. Blood tests being a poor marker is accepted — but it also means the benefit is hard to prove. Honest grade: likely, not solid.',
       'Un petit essai randomisé (46 personnes âgées, 500 mg d’oxyde de magnésium pendant 8 semaines) a amélioré plusieurs indicateurs du sommeil; aucun essai ne relie la forme glycinate au sommeil. Que les cellules aient besoin de magnésium pour produire de l’énergie, c’est de la biochimie de base; que l’alcool et les selles molles le vident est bien documenté. Caféine : une étude de deux jours en unité métabolique (17 adultes) a mesuré une perte nette de 0,16 mmol — environ 4 mg — sur 24 heures; c’est réel, mais trop peu pour justifier un supplément à lui seul. Aucun essai ne montre que les stimulants le vident. Que la prise de sang reflète mal les réserves est reconnu — mais ça rend aussi le bénéfice difficile à prouver. Cote honnête : probable, pas solide.']},
  creatine:{src:['roschel','candow','mcm06','mcm07'],
    e:['Two reviews of trials (2021, 2022) support creatine for brain performance, with the clearest effect when sleep-deprived or stressed; two small sleep-deprivation trials showed less mental fatigue. Most trials are short and in healthy adults, not exhausted shift workers — hence “likely”.',
       'Deux revues d’essais (2021, 2022) appuient la créatine pour les performances cognitives, avec l’effet le plus net en manque de sommeil ou sous stress; deux petits essais en privation de sommeil ont montré moins de fatigue mentale. La plupart des essais sont courts et menés sur des adultes en santé, pas sur des travailleurs de quarts épuisés — d’où « probable ».']},
  thiamine:{src:['efns','asam','nice100'],
    e:['The European neurology guideline (2010), the American addiction-medicine guideline (2020) and UK NICE all say the same thing: anyone drinking heavily should get thiamine, because deficiency causes Wernicke’s brain injury and prevention costs almost nothing. Doses: the American guideline uses 100 mg a day by mouth for people treated outside hospital; UK practice for prevention is often 200–300 mg a day. 100 mg is the floor the app uses — less than that is below every guideline cited here.',
       'Le guide européen de neurologie (2010), le guide américain de médecine des dépendances (2020) et le NICE britannique disent la même chose : quiconque boit beaucoup devrait prendre de la thiamine, parce que la carence cause l’encéphalopathie de Wernicke et que la prévention ne coûte presque rien. Doses : le guide américain utilise 100 mg par jour par la bouche pour les gens traités hors de l’hôpital; au Royaume-Uni, la prévention se fait souvent à 200–300 mg par jour. L’app prend 100 mg comme plancher — moins que ça, c’est sous tous les guides cités ici.']},
  salt:{src:['acsm','lithiumLabel'],
    e:['The sports-medicine position stand (2007) supports replacing sodium in people who sweat a lot. For everyone else, “salt water fixes the afternoon” has not been tested in a trial — it rests on what low sodium feels like and on standard advice for dizziness on standing. So: likely for sweaty work, a try for the rest. Not for anyone told to limit salt, on lithium (sodium shifts move lithium levels — FDA label), or with high blood pressure, heart or kidney disease.',
       'La prise de position en médecine du sport (2007) appuie le remplacement du sodium chez ceux qui suent beaucoup. Pour les autres, « l’eau salée règle le creux de l’après-midi » n’a jamais été testé dans un essai — ça repose sur les symptômes du manque de sodium et sur les conseils habituels contre les étourdissements en se levant. Donc : probable si tu sues au travail, à essayer pour les autres. Pas pour ceux qui doivent limiter le sel, qui prennent du lithium (le sodium fait varier le taux de lithium — monographie FDA), ou qui font de l’hypertension ou une maladie du cœur ou des reins.']},
  protein:{src:['leidy','vyvanse'],
    e:['A small crossover trial (20 teenage girls) found a high-protein breakfast cut evening snacking and steadied appetite signals; larger reviews point the same way, but the “afternoon crash” itself has not been measured directly. That stimulants kill appetite is on the drug label — one of the most common side effects.',
       'Un petit essai croisé (20 adolescentes) : un déjeuner riche en protéines réduisait le grignotage du soir et stabilisait les signaux de faim; des revues plus larges vont dans le même sens, mais le « crash de l’après-midi » lui-même n’a pas été mesuré directement. Que les stimulants coupent l’appétit, c’est écrit sur la monographie du médicament — un des effets secondaires les plus fréquents.']},
  vitc:{src:['vyvanse'],
    e:['Straight from the FDA label for lisdexamfetamine (Vyvanse): agents that change urine pH change amphetamine blood levels — acidifying agents such as vitamin C lower them. The same label lets the capsule contents be mixed with yogurt, water or orange juice, so ordinary juice is not the concern. How much a given vitamin C pill matters has not been measured in a trial — hence “likely”. Methylphenidate (Ritalin, Concerta) has no such warning.',
       'Tiré directement de la monographie FDA de la lisdexamfétamine (Vyvanse) : les agents qui changent le pH de l’urine changent le taux d’amphétamine dans le sang — les acidifiants comme la vitamine C le font baisser. La même monographie permet de mélanger le contenu de la capsule avec du yogourt, de l’eau ou du jus d’orange, alors le jus ordinaire n’est pas en cause. L’effet d’un comprimé de vitamine C donné n’a pas été mesuré dans un essai — d’où « probable ». Le méthylphénidate (Ritalin, Concerta) n’a pas cet avertissement.']},
  b12:{src:['lam','dejager','ada','didangelos'],
    e:['A large case-control study (2013): acid blockers for two years or more raised the odds of B12 deficiency by about 65%. A randomized trial (2010): metformin lowered B12 by 19% over four years. The American Diabetes Association standards recommend periodic B12 checks for anyone on metformin. And a one-year randomized trial (90 people on metformin with nerve damage, B12 under 400 pmol/L — not all clearly deficient) found 1,000 mcg a day improved nerve tests, pain and quality of life: a borderline number plus nerve symptoms is worth raising.',
       'Une grande étude cas-témoins (2013) : les bloqueurs d’acide pris deux ans ou plus augmentaient d’environ 65 % le risque de manquer de B12. Un essai randomisé (2010) : la metformine a fait baisser la B12 de 19 % sur quatre ans. Les normes de l’American Diabetes Association recommandent de vérifier la B12 périodiquement chez tous ceux qui prennent de la metformine. Et un essai randomisé d’un an (90 personnes sous metformine avec atteinte des nerfs, B12 sous 400 pmol/L — pas toutes clairement en manque) a trouvé que 1 000 mcg par jour amélioraient les tests neurologiques, la douleur et la qualité de vie : un chiffre limite avec des symptômes aux nerfs, ça vaut la peine d’en parler.']},
  acidblocker:{src:['lam','fdappi'],
    e:['B12: large 2013 case-control study. Magnesium: in 2011 the FDA added a low-magnesium warning to every prescription acid blocker, mostly after a year of use; in about a quarter of the cases it reviewed, magnesium supplements alone didn’t correct it and the acid blocker had to be stopped. Iron: the link is real but comes from observational data — the weakest of the three. “Don’t stop on your own” is standard advice; rebound acid is common.',
       'B12 : grande étude cas-témoins de 2013. Magnésium : en 2011, la FDA a ajouté un avertissement de manque de magnésium à tous les bloqueurs d’acide sur ordonnance, surtout après un an d’utilisation; dans environ le quart des cas examinés, les suppléments de magnésium seuls n’ont pas corrigé le problème et il a fallu arrêter le bloqueur d’acide. Fer : le lien est réel, mais il vient de données d’observation — c’est le plus faible des trois. « N’arrête pas par toi-même », c’est le conseil de base; le rebond d’acidité est fréquent.']},
  antidep:{src:['ferguson','ssriMeta','nhanesDep','papakostas'],
    e:['A review of SSRI side effects (2001) and a 2022 analysis of 30 randomized trials (5,004 people) both put nausea and diarrhea among the most common effects, mostly in the first weeks. “Low iron looks like depression” rests on survey data showing a link, not a cause — which is exactly why the advice is to test, not to stop the pill. L-methylfolate: two randomized trials in people helped only partly by an SSRI (2012). At 7.5 then 15 mg (148 people), no benefit; at 15 mg throughout (75 people), about one extra responder for every six treated. A treatment for selected patients under a prescriber, not a reason for everyone on an SSRI to take folate.',
       'Une revue des effets secondaires des ISRS (2001) et une analyse de 2022 portant sur 30 essais randomisés (5 004 personnes) classent les nausées et la diarrhée parmi les effets les plus fréquents, surtout les premières semaines. « Le manque de fer ressemble à une dépression » repose sur des enquêtes qui montrent un lien, pas une cause — c’est justement pourquoi le conseil est de faire tester, pas d’arrêter la pilule. L-méthylfolate : deux essais randomisés chez des gens aidés en partie seulement par un ISRS (2012). À 7,5 puis 15 mg (148 personnes), aucun bénéfice; à 15 mg du début à la fin (75 personnes), environ une réponse positive de plus pour six personnes traitées. Un traitement pour des patients choisis, suivi par un prescripteur — pas une raison pour que tous ceux sous ISRS prennent du folate.']},
  caffeine:{src:['efsa','drake','rao','hcCaf','hcCafKids'],
    e:['A half-life of roughly five hours is standard pharmacology (European food-safety review, 2015). A randomized trial (2013): 400 mg taken six hours before bed still cut measured sleep by about an hour. A 1998 trial: coffee stimulates colon activity within minutes. Health Canada’s ceiling is 400 mg a day for adults (300 in pregnancy or while breastfeeding, 2.5 mg/kg under 18), and 180 mg per can of energy drink. Its own table puts an 8 oz (237 ml) filter coffee at 179 mg — higher than the Canadian Nutrient File average — so the app uses Health Canada’s figure. Brand energy drinks use the Canadian label.',
       'Une demi-vie d’environ cinq heures, c’est de la pharmacologie de base (revue européenne de sécurité alimentaire, 2015). Un essai randomisé (2013) : 400 mg pris six heures avant le coucher réduisaient encore d’environ une heure le temps de sommeil mesuré. Un essai de 1998 : le café stimule l’activité du côlon en quelques minutes. Le plafond de Santé Canada est de 400 mg par jour pour les adultes (300 enceinte ou en allaitant, 2,5 mg/kg avant 18 ans), et de 180 mg par canette de boisson énergisante. Son propre tableau met un café filtre de 8 oz (237 ml) à 179 mg — plus que la moyenne du Fichier canadien sur les éléments nutritifs — alors l’app utilise le chiffre de Santé Canada. Les boissons énergisantes de marque utilisent l’étiquette canadienne.']},
  beer:{src:['maintz','comas','rohsenow','ccsa'],
    e:['Beer’s histamine and fermentable carbohydrates are documented in food-chemistry reviews (2007, 2020). A 2010 trial (95 heavy drinkers, bourbon vs vodka): more congeners meant a worse hangover, but sleep and next-day performance were equally bad — alcohol itself did that. No trial has compared beer with spirits for gut symptoms specifically — hence “likely”. For the record: Canada’s 2023 guidance puts low risk at 2 drinks a week or less and “increasingly high” at 7 or more. This card is harm reduction above that line, not a recommendation to drink.',
       'L’histamine et les glucides fermentescibles de la bière sont documentés dans des revues de chimie alimentaire (2007, 2020). Un essai de 2010 (95 gros buveurs, bourbon contre vodka) : plus de congénères, pire lendemain de veille — mais le sommeil et le rendement du lendemain étaient aussi mauvais dans les deux cas; c’est l’alcool lui-même qui fait ça. Aucun essai n’a comparé directement bière et spiritueux pour les symptômes digestifs — d’où « probable ». Pour l’heure juste : les repères canadiens de 2023 situent le risque faible à 2 verres par semaine ou moins, et le risque « de plus en plus élevé » à 7 verres et plus. Cette carte, c’est de la réduction des méfaits au-dessus de cette ligne, pas une invitation à boire.']},
  histamine:{src:['maintz','comas'],
    e:['Two reviews (2007, 2020) describe the mechanism, the foods, and the enzyme that alcohol blocks. But: there is no validated test, the blood DAO test is unreliable, trials are small, and how many people are truly affected is unknown. “Likely” is generous. The diet is safe to test for two weeks — that is why it stays.',
       'Deux revues (2007, 2020) décrivent le mécanisme, les aliments en cause et l’enzyme que l’alcool bloque. Mais : aucun test validé, le dosage sanguin de la DAO n’est pas fiable, les essais sont petits et on ne sait pas combien de personnes sont vraiment touchées. « Probable » est généreux. La diète ne présente aucun danger à essayer deux semaines — c’est pour ça qu’elle reste.']},
  bile:{src:['wedlake','bsg2018','camilleri'],
    e:['A 2009 pooled analysis found bile-acid diarrhea in roughly 1 in 3 to 1 in 4 people labelled “IBS with diarrhea”. The British gastroenterology guideline (2018) and a 2015 review cover diagnosis and treatment. That bulking fibre binds some bile acid is accepted; the prescription binders have the stronger evidence.',
       'Une analyse groupée de 2009 : diarrhée aux acides biliaires chez environ une personne sur trois ou quatre étiquetée « côlon irritable avec diarrhée ». Le guide britannique de gastro-entérologie (2018) et une revue de 2015 couvrent le diagnostic et le traitement. Que les fibres épongent une partie des acides biliaires est admis; les liants sur ordonnance ont les preuves les plus solides.']},
  sleepq:{src:['drake','ebrahim','abbasi'],
    e:['Caffeine cut-off: randomized trial, 2013. Alcohol wrecking the second half of the night: a 2013 review of 27 studies. Magnesium: one small trial. Screens: evidence is mixed and modest. Each piece has a study behind it; the bundle as a whole has not been tested — “likely”.',
       'Couper la caféine tôt : essai randomisé, 2013. L’alcool qui bousille la deuxième moitié de la nuit : revue de 27 études, 2013. Magnésium : un petit essai. Écrans : données mitigées et effet modeste. Chaque élément s’appuie sur une étude; l’ensemble n’a pas été testé d’un bloc — « probable ».']},
  withdrawal:{src:['asam','nice100','efns'],
    e:['The American addiction-medicine guideline (2020) and UK NICE (CG100): heavy daily drinkers can have seizures when they stop suddenly and need a supervised taper; thiamine for everyone at risk. This is the most settled item in the app.',
