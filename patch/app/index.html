  const fl=x&&['empty','low'].includes(ferRead(x).band);
  if(!fl) return t+' '+L('Anemia without low iron has other causes — B12, folate, kidneys — that’s a doctor question.','Une anémie sans manque de fer a d’autres causes — B12, folate, reins — c’est une question pour ton médecin.');
  if(life.preg) return t+' '+L('With low ferritin, that’s iron-deficiency anemia — one for your next prenatal visit, where iron is the usual answer.','Avec une ferritine basse, c’est une anémie par manque de fer — à apporter à ta prochaine visite de grossesse, où le fer est la réponse habituelle.');
  if(life.bf||has('safety','pp')) return t+' '+L('With low ferritin, that’s iron-deficiency anemia. Pregnancy and birth often leave the stores empty — bring it to your doctor.','Avec une ferritine basse, c’est une anémie par manque de fer. La grossesse et l’accouchement vident souvent les réserves — apporte-le à ton médecin.');
  if(premeno()) return t+' '+L('With low ferritin, that’s iron-deficiency anemia. Heavy periods are the usual cause — it’s still a doctor visit.','Avec une ferritine basse, c’est une anémie par manque de fer. Les règles abondantes en sont la cause habituelle — ça reste une visite chez le médecin.');
  return t+' '+L('With low ferritin, that’s iron-deficiency anemia. In men and after menopause, guidelines treat it as blood loss from the gut until a scope shows otherwise — this one goes to your doctor.','Avec une ferritine basse, c’est une anémie par manque de fer. Chez les hommes et après la ménopause, les guides la traitent comme une perte de sang par l’intestin jusqu’à preuve du contraire par un examen — ça, c’est pour ton médecin.'); }
function b12Read(v){ if(v<133) return L('low — a shortage by the NICE cut-off (133)','basse — un manque selon le seuil de NICE (133)'); if(v<=258) return L('in the grey zone — between 133 and 258 a follow-up test (methylmalonic acid, MMA) or your doctor decides','en zone grise — entre 133 et 258, un test de suivi (acide méthylmalonique) ou ton médecin tranche'); return L('fine — a shortage is unlikely','correcte — un manque est peu probable'); }
function b12Paper(b){ const pp=paperAvg('b12',b.day); if(!pp) return ''; const n=b12Need();
  const v=pp.avg<n.ear?L('below what most people need — the stores run down slowly, over years','sous ce dont la plupart des gens ont besoin — les réserves baissent lentement, sur des années'):pp.avg<n.rda?L('enough for many, not all','assez pour bien des gens, pas pour tous'):L('covered','couvert');
  return ' '+L(`On paper since: about ${fmt(pp.avg,1)} mcg a day against ${fmt(n.rda,1)} — ${v}.`,`Sur papier depuis : environ ${fmt(pp.avg,1)} mcg par jour, pour un besoin de ${fmt(n.rda,1)} — ${v}.`); }
function dRead(v,day){ let t=v<30?L('low — at risk of deficiency','basse — à risque de carence'):v<50?L('maybe not enough — between 30 and 50 some people are short','peut-être pas assez — entre 30 et 50, certaines personnes en manquent'):v<=125?L('enough for almost everyone','assez pour presque tout le monde'):L('high — above 125 nothing is gained, and pills can be eased off','élevée — au-dessus de 125, on ne gagne rien, et on peut réduire les pilules');
  const mo=+String(day).slice(5,7); if(v>=30&&mo>=5&&mo<=10) t+=L('. A summer number drops by spring: from October to March, the skin makes almost none in Canada','. Un chiffre d’été baisse d’ici le printemps : d’octobre à mars, la peau n’en fabrique presque pas au Canada'); return t; }
function recheckLine(){ const x=lastWith('fer'), h=lastWith('hb'), tr=ferTrend(); let low=false;
  if(x&&['empty','low','lownormal','unclear'].includes(ferRead(x).band)) low=true; if(h&&h.hb<hbCut()) low=true; if(tr&&tr.kind==='fall') low=true;
  let t=low?L('Recheck in about 3 months, once a change has had time to work.','Refais le test dans environ 3 mois, le temps qu’un changement fasse effet.'):L('No rush: once a year, or sooner if the old tiredness comes back.','Pas pressé : une fois par année, ou plus tôt si la vieille fatigue revient.');
  if(x&&x.crp==null) t+=' '+L('Next time, ask for CRP on the same draw.','La prochaine fois, demande la CRP sur la même prise de sang.'); return t; }
function labReadCard(){ const x=lastWith('fer'), h=lastWith('hb'), b=lastWith('b12'), dv=lastWith('d'); const out=[];
  if(x){ const r=ferRead(x); let t=L(`<b>Ferritin ${fmt(x.fer,0)}</b> (${esc(labDate(x.day))}): ${r.t}.`,`<b>Ferritine ${fmt(x.fer,0)}</b> (${esc(labDate(x.day))}) : ${r.t}.`);
    if(!inflamed(x)&&r.band!=='empty') t+=' '+storesText(x);
    if(x.inf) t+=' '+L('An iron infusion before this test makes ferritin read high for weeks after it.','Une perfusion de fer avant ce test gonfle la ferritine pendant des semaines.');
    out.push(t); const tr=ferTrend(); if(tr) out.push(trendText(tr));

  if(b) out.push(L(`<b>B12 ${fmt(b.b12,0)}</b> (${esc(labDate(b.day))}): ${b12Read(b.b12)}.`,`<b>B12 ${fmt(b.b12,0)}</b> (${esc(labDate(b.day))}) : ${b12Read(b.b12)}.`)+b12Paper(b));
  if(dv) out.push(L(`<b>Vitamin D ${fmt(dv.d,0)}</b> (${esc(labDate(dv.day))}): ${dRead(dv.d,dv.day)}.`,`<b>Vitamine D ${fmt(dv.d,0)}</b> (${esc(labDate(dv.day))}) : ${dRead(dv.d,dv.day)}.`));
  { const tx=lastWith('tsh'), cx=lastWith('cel');
    if(tx) out.push(tx.tsh==='ok'?L(`<b>TSH</b> (${esc(labDate(tx.day))}): in the lab’s range.`,`<b>TSH</b> (${esc(labDate(tx.day))}) : dans les normes du labo.`):L(`<b>TSH</b> (${esc(labDate(tx.day))}): flagged by the lab. That’s a doctor question — a thyroid that’s off can explain tiredness, weight and gut changes on its own.`,`<b>TSH</b> (${esc(labDate(tx.day))}) : signalée par le labo. C’est une question pour ton médecin — une thyroïde déréglée peut expliquer à elle seule la fatigue, le poids et des changements au ventre.`));
    if(cx) out.push(cx.cel==='neg'?L(`<b>Celiac test</b> (${esc(labDate(cx.day))}): negative — if you were eating gluten before the draw, celiac is unlikely.`,`<b>Test cœliaque</b> (${esc(labDate(cx.day))}) : négatif — si tu mangeais du gluten avant la prise de sang, la maladie cœliaque est peu probable.`):L(`<b>Celiac test</b> (${esc(labDate(cx.day))}): positive. That needs your doctor, usually to confirm with a biopsy — keep eating gluten until they say otherwise, or the next test can read falsely normal.`,`<b>Test cœliaque</b> (${esc(labDate(cx.day))}) : positif. Ça prend ton médecin, habituellement pour confirmer par une biopsie — continue de manger du gluten jusqu’à ce qu’on te dise le contraire, sinon le prochain test peut revenir faussement normal.`)); }
  out.push(`<span class="muted">${recheckLine()}</span>`);
  return `<div class="card"><div class="eyebrow">${L('What the numbers say','Ce que les chiffres disent')}</div>${out.map(t=>`<p class="small" style="margin:0 0 8px">${t}</p>`).join('')}</div>`; }
function labLine(x){ const p=LABF.filter(([k])=>x[k]!=null).map(([k,l,u])=>`${P2(LABN[k])} ${fmt(x[k],k==='crp'?1:0)}${k==='crp'?'':' '+u}`);
  if(x.tsh) p.push('TSH '+(x.tsh==='ok'?L('in range','dans les normes'):L('flagged','signalée'))); if(x.cel) p.push(L('celiac test ','test cœliaque ')+(x.cel==='pos'?L('positive','positif'):L('negative','négatif')));
  return p.join(' · ')+(x.inf?L(' · after an iron infusion',' · après une perfusion de fer'):'')+(x.don?L(' · after giving blood',' · après un don de sang'):''); }

function labReadInputs(){ const E=S.labEdit; if(!E) return; for(const [k] of LABF){ const el=document.getElementById('lab_'+k); if(!el) continue; const v=String(el.value).replace(',','.').trim(); E[k]=v===''?null:(isFinite(+v)?+v:null); } }
function labCheck(E){ if(!E.day) return L('Pick the date of the blood draw.','Choisis la date de la prise de sang.');
  if(E.day>dayKey()) return L('That date is in the future.','Cette date est dans le futur.');
  if(!LABF.some(([k])=>E[k]!=null)&&!E.tsh&&!E.cel) return L('Type at least one number, or tap a result.','Entre au moins un chiffre, ou choisis un résultat.');
  if(E.hb!=null&&E.hb>0&&E.hb<25){ E.hb=Math.round(E.hb*10); E._conv=true; }
  const R={fer:[1,5000],crp:[0,500],hb:[30,250],b12:[20,5000],d:[5,500]};
  for(const [k,l] of LABF){ if(E[k]==null) continue; const [lo,hi]=R[k]; if(E[k]<lo||E[k]>hi) return L(`${P2(l)} looks off — check the number and the unit.`,`${P2(l)} semble bizarre — vérifie le chiffre et l’unité.`); }
  return ''; }

/* ===================== v1.2.31: vitamin E in IU; mcg for micrograms ===================== */
/* Vitamin E is counted in IU, the number on Canadian bottles. Food vitamin E is the natural form (RRR, "d-alpha"):
   1 mg = 1.49 IU (NIH ODS, from IOM 2000). The need, 15 mg, is 22 IU; 19 mg while breastfeeding is 28 IU. The supplement
   ceiling, 1,000 mg, is 1,500 IU of natural E or 1,100 IU of synthetic ("dl-alpha"); the app uses 1,100 for every pill,
   which is safe whatever the label says. Pills are entered as the label's IU.
   Pills saved before this version were in mg: ×1.49, rounded to 50 IU, once per state (S.tank.eIU marks it done).
   Literal 1.49 everywhere: migrateE runs from the top of the script, before this block's consts exist. */
function migrateE(){ try{ if(!S.tank||typeof S.tank!=='object'||S.tank.eIU) return;
  const fix=m=>{ if(m&&typeof m==='object'&&m.x_e>0) m.x_e=Math.max(50,Math.round(m.x_e*1.49/50)*50); };
  fix(S.tank.day); for(const k of Object.keys(S.tank.log||{})) fix(S.tank.log[k]);
  if(Array.isArray(S.tank.meals)) for(const m of S.tank.meals) fix(m&&m.items);
  S.tank.eIU=true; }catch(e){} }
/* ===================== v1.2.32: the blanks, filled; the ? explains itself ===================== */
/* Where the Canadian Nutrient File has a blank, the food list now carries the USDA value (SR28, the database the Canadian file
   copied many entries from): the same food where USDA has it, else the same food prepared another way, else the closest food
   ('fill' on each food says which). What's left blank shows a ? on the gauge; tapping it names the foods and says why. */
let lackNow={};
const LABELF=new Set([509001,509002,502444]); /* protein bar, sugar-free candy, ready-to-drink protein shake: the label decides */
function low1(s){ return s&&s.length>1&&s[1]===s[1].toLowerCase()&&s[1]!==s[1].toUpperCase()?s[0].toLowerCase()+s.slice(1):s; }
function openLack(k, opener){ const n=TN.find(x=>x.k===k); if(!n) return;
  const fs=[...(lackNow[k]||[])].map(id=>TF.find(f=>f.id==id)).filter(Boolean); if(!fs.length) return;
  const nm=low1(P2(n.l)), one=fs.length===1;
  const head=L(`${one?'This food has':'These foods have'} no ${nm} number, so ${one?'it counts':'they count'} as 0 — the real total is at least what’s shown.`,
    `${one?'Cet aliment n’a':'Ces aliments n’ont'} pas de chiffre de ${nm}, alors ${one?'il compte':'ils comptent'} pour 0 — le vrai total est au moins ce qui est affiché.`);
  const why=f=>LABELF.has(f.id)?L('brands vary too much to guess; the label has the number','les marques varient trop pour deviner; le chiffre est sur l’étiquette')
    :L('no close match in the Canadian file or the USDA one','aucun aliment proche dans le fichier canadien ni dans celui des États-Unis');
  showSheet(`<div class="handle"></div><h3 id="sheetTitle">${L('What the ? means','Ce que veut dire le « ? »')}</h3><p>${head}</p><ul class="wk">${fs.map(f=>`<li><b>${esc(P2(f.l))}</b> — ${why(f)}</li>`).join('')}</ul><p class="small">${T('tank',L('Where the numbers come from','D’où viennent les chiffres'),L('Where the numbers come from','D’où viennent les chiffres'))}</p><div class="row"><button type="button" class="btn sm" id="closeSheet">${L('Got it','Compris')}</button></div>`, opener); }
function bind132(){ document.querySelectorAll('[data-lack]').forEach(b=>{ b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); openLack(b.dataset.lack, b); }; }); }
/* ===================== v1.2.33: the hours before ===================== */
/* Some reactions come within hours, so the time matters, not just the day. For each crash, headache or itch with a time, the
   meals logged in the 4 hours before; for loose stools or bloating, the 6 hours before (lactose: 30 minutes to 2 hours; what
   ferments in the large bowel comes later). Compared with the same hours on days without it: the event's usual time of day,
   on days with a finished check-in that say it didn't happen. The bar is the suspects' bar (3 times with it, a 30-point gap,
   a split luck gives less than 1 time in 50), checked again for this version on simulated people (see HOURS_P).
   Exposure is known only from meals with a time: "yes" if a meal in the window had the food; "no" only if every day the
   window touches is marked complete and has no untimed meal. A food a test already answered counts only after the test. */
const HRS={crash:4, gut:6, hs:4};
const HOUT={gut:['loose','bloat'], hs:['head','skin']};
const HOURS_P=0.02;
const HOUTB={crash:['crashes','crashs'], gut:['times you noted loose stools or bloating','fois où tu as noté des selles molles ou des ballonnements'], hs:['headaches or itch you noted','maux de tête ou démangeaisons notés']};
const HOF={crash:['of your','de tes'], gut:['of the','des'], hs:['of the','des']};
function dayStart(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d,S.tank.roll||0,0).getTime(); }
function clk(min){ min=((Math.round(min)%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }
function hFams(){ return FAMS.filter(f=>(f.ids&&!f.ci&&!f.logOnly)||f.id==='bigmeal'); }

  if(v==='tq'){
    const list=tqList(); const i=S.tstep-1; const q=list[i]; const answered=q.multi?(Array.isArray(S.tank.p[q.id])&&S.tank.p[q.id].length>0):S.tank.p[q.id]!=null;
    bar.innerHTML=`<div class="in"><button class="btn ghost sm" id="back" aria-label="${L('Back','Retour')}">←</button><div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="${list.length}" aria-valuenow="${i+1}">${list.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div><button class="btn primary sm" id="next" data-none="${(!answered&&q.multi)?q.id:''}" data-nonev="none">${answered?(i===list.length-1?(S.tqHome?L('Done','Terminé'):L('Fuel tank','Réservoir')):L('Next','Suivant')):(q.multi?L('None of these','Aucun de ces choix'):L('Skip','Passer'))} →</button></div>`;

    document.getElementById('doRestore').onclick=()=>{ const lang=S.lang; S=Object.assign({a:{},step:0,started:null,checkins:[],lang,mode:'home',c:{},cstep:0,crashes:[],intent:null,tank:{p:{},day:{},log:{},rate:{},roll:4,view:'normal'},tstep:0}, o.state); if(!S.tank||typeof S.tank!=='object') S.tank={p:{},day:{}}; if(!S.tank.log) S.tank.log={}; if(!S.tank.rate) S.tank.rate={}; if(!S.tank.closed){ S.tank.closed={}; for(const k of Object.keys(S.tank.log)) if(Object.keys(S.tank.log[k]||{}).length) S.tank.closed[k]=true; } S.mode='home'; try{ for(const r of Object.values(S.tank.rate||{})){ if(r&&r.fin&&r.at&&!r.firstAt) r.firstAt=r.at; } }catch(e){} const dropped=cleanState(); migrateSup(); try{ migrateMeals(); migrateE(); syncMeals(); }catch(e){} save(); closeSheet(true); render(); toast(dropped?L(`Restored — ${dropped} broken entr${dropped===1?'y':'ies'} skipped`,`Restauré — ${dropped} entrée${dropped>1?'s':''} invalide${dropped>1?'s':''} ignorée${dropped>1?'s':''}`):L('Restored','Restauré')); };
  }
}
function eraseAll(){ const l=S.lang, ack=S.ack; try{ localStorage.removeItem(KEY); localStorage.removeItem('patch'); localStorage.removeItem(SEEN); }catch(e){} S={a:{},step:0,started:null,checkins:[],lang:l,done:false,ack,mode:'home',c:{},cstep:0,crashes:[],intent:null,madeAt:null,tank:{p:{},day:{},log:{},rate:{},closed:{},closedMig:true,eIU:true,roll:4,view:'normal'},tstep:0}; save(); render(); toast(L('Erased','Effacé')); }
/* tappable terms: real buttons for keyboard and screen readers, not bare spans */
/* v1.2.22: underline each glossary word once per screen — its first appearance; later mentions are plain text */
function onceTerms(root){ const seen=new Set(); const all=[...root.querySelectorAll('.t[data-t]')];
  /* v1.2.25: visible words first, so a folded section can't take the only underline */
  const folded=el=>{ const d=el.closest('details:not([open])'); return !!d && !(el.closest('summary') && el.closest('summary').parentElement===d); };
  [...all.filter(e=>!folded(e)),...all.filter(folded)].forEach(el=>{ const k=el.dataset.t; if(seen.has(k)) el.replaceWith(document.createTextNode(el.textContent)); else seen.add(k); }); }
function wireTerms(root){
  root.querySelectorAll('.t[data-t]').forEach(el=>{
    el.setAttribute('role','button'); el.tabIndex=0; el.setAttribute('aria-haspopup','dialog');
    el.onclick=(e)=>{ e.preventDefault(); openSheet(el.dataset.t, el); };
    el.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openSheet(el.dataset.t, el); } };
  });
}
/* ===================== SHEET ===================== */
const sheet=document.getElementById('sheet'), sheetBg=document.getElementById('sheetBg');
const LINKS={en:{ferritin:'ferritin',psyllium:'psyllium',histamine:'histamine',thiamine:'thiamine',magnesium:'magnesium',creatine:'creatine',CRP:'crp',B12:'b12'}, fr:{ferritine:'ferritin',psyllium:'psyllium',histamine:'histamine',thiamine:'thiamine',magnésium:'magnesium',créatine:'creatine',CRP:'crp',B12:'b12'}};
let sheetOpener=null;
function showSheet(html, opener){
  if(!sheet.classList.contains('on')) sheetOpener = opener || document.activeElement;
  sheet.innerHTML=html;
  sheet.classList.add('on'); sheetBg.classList.add('on'); sheet.setAttribute('aria-hidden','false');
  document.documentElement.classList.add('locked');
  wireTerms(sheet);
  const c=document.getElementById('closeSheet'); if(c) c.onclick=closeSheet;
  sheet.scrollTop=0; try{ sheet.focus({preventScroll:true}); }catch(e){ sheet.focus(); }
}
let fromGloss=false;
function openGlossary(opener){
  fromGloss=true;
  const keys=Object.keys(G).sort((a,b)=>P2(G[a].t).localeCompare(P2(G[b].t),S.lang==='fr'?'fr':'en'));
  showSheet(`<div class="handle"></div><h3 id="sheetTitle">${L('Glossary','Lexique')}</h3><p class="small muted" style="margin-top:0">${L('Every term in the app, what it means, how sure we are, and the sources.','Chaque terme de l’app, ce qu’il veut dire, à quel point on en est sûr, et les sources.')}</p><div>${keys.map(k=>`<button type="button" class="gl" data-gl="${k}"><span>${P2(G[k].t)}</span><span class="grade ${G[k].g}">${P2(GRADE[G[k].g]).split(' — ')[0]}</span></button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn sm" id="closeSheet">${L('Close','Fermer')}</button></div>`, opener);
  sheet.querySelectorAll('[data-gl]').forEach(b=>{ b.onclick=()=>openSheet(b.dataset.gl, null, true); });
}
function openMenu(opener){
  fromGloss=false;
  const done=!!S.done||S.step>QL().length;
  const items=[
    ['home',L('Report','Noter')],
    ['patch',done?L('The plan','Le plan'):L(`The Patch · ${QL().length} questions`,`La Patch · ${QL().length} questions`)],
    ['crash',L('Crash report','Noter un crash')],
    ['meal',L('Meal report','Noter un repas')],
    ['sym',L('Symptom report','Noter un symptôme')],
    ['pat',L('History','Historique')],
    ['tank',L('Fuel tank','Réservoir')],
    ['labs',L('Blood results','Résultats de prise de sang')],
    ['ai',L('Ask an AI','Demander à une IA')],
    ['gloss',L('Glossary','Lexique')],
    ['tobie',L('Tell Tobie','Dis-le à Tobie')],
    ['about',L('About & privacy','À propos et confidentialité')]
  ];
  const any=Object.keys(S.a).length||S.crashes.length||S.cstep||S.tstep;
  showSheet(`<div class="handle"></div><h3 id="sheetTitle">${L('Menu','Menu')}</h3><div class="menu">${items.map(([k,l])=>`<button type="button" data-mn="${k}">${l}</button>`).join('')}<button type="button" id="mnBackup">${L('Back up my data (a file)','Sauvegarder mes données (un fichier)')}</button><button type="button" id="mnRestore">${L('Restore from a backup','Restaurer une sauvegarde')}</button>${any?`<button type="button" class="danger" id="mnErase">${L('Erase my answers','Effacer mes réponses')}</button>`:''}</div><p class="small muted" style="margin:12px 0 0">v${VER} · ${L('sources checked','sources vérifiées le')} ${P2(CHECKED)} · ${L('pharmacist review: not yet','révision par un pharmacien : pas encore')}</p><div class="row" style="margin-top:12px"><button class="btn sm" id="closeSheet">${L('Close','Fermer')}</button></div>`, opener);
  sheet.querySelectorAll('[data-mn]').forEach(b=>{ b.onclick=()=>{ const k=b.dataset.mn;
    if(k==='gloss'){ openGlossary(null); return; }
    if(k==='about'){ openAbout(); return; }
    closeSheet(true);
    if(k==='home'){ S.mode='home'; save(); render(); return; }
    if(!S.ack){ S.mode='home'; save(); render(); toast(L('Tap “I understand” first','Appuie sur « Je comprends » d’abord')); return; }
    if(NAV[k]) NAV[k]();
  }; });
  document.getElementById('mnBackup').onclick=backupData;
  document.getElementById('mnRestore').onclick=openRestore;
  const er=document.getElementById('mnErase'); if(er) er.onclick=()=>{ if(er.dataset.sure){ closeSheet(true); eraseAll(); return; } er.dataset.sure='1'; er.textContent=L('Tap again to erase everything','Appuie encore pour tout effacer'); };
}
function openSheet(k, opener, viaGloss){ const g=G[k]; if(!g) return;
  if(!viaGloss) fromGloss=false;
  const lk=LINKS[S.lang]; const re=new RegExp('\\b('+Object.keys(lk).join('|')+')\\b','g');
  const body=P2(g.s).replace(re,m=>{ const key=lk[m]; return key&&key!==k?`<span class="t" data-t="${key}">${m}</span>`:m; });
  const ev=EV[k]; let evh='';
  if(ev){
    const links=(ev.src||[]).map(id=>SRC[id]).filter(Boolean).map(s=>`<a href="${s.u}" target="_blank" rel="noopener noreferrer">${P2(s.l)}</a>`).join('');
    evh=`<div class="ev"><b>${L('Evidence:','Preuves :')}</b> ${P2(ev.e)}<div class="src">${links}</div><div class="rev">${P2(REVIEW)}</div></div>`;
  }
  const rowsH = g.rows ? `<div class="tm">${g.rows.map(r=>`<details><summary><b>${P2(r[0])}</b> <span class="muted">· ${L('ceiling','plafond')} ${P2(r[1])}</span></summary><p><b>${L('Short term:','À court terme :')}</b> ${P2(r[2])}</p><p><b>${L('Long term:','À long terme :')}</b> ${P2(r[3])}</p></details>`).join('')}</div>` : '';
  showSheet(`<div class="handle"></div><span class="grade ${g.g}">${P2(GRADE[g.g])}</span><h3 id="sheetTitle">${P2(g.t)}</h3><p>${body}</p>${rowsH}${evh}<div class="row" style="margin-top:12px"><button class="btn sm" id="closeSheet">${L('Got it','Compris')}</button>${fromGloss?`<button class="btn ghost sm" id="allTerms">← ${L('All terms','Tous les termes')}</button>`:''}</div>`, opener);
  const at=document.getElementById('allTerms'); if(at) at.onclick=()=>openGlossary(null);
}
function closeSheet(noFocus){
  if(!sheet.classList.contains('on')) return;
  sheet.classList.remove('on','full'); sheetBg.classList.remove('on'); sheet.setAttribute('aria-hidden','true');
  document.documentElement.classList.remove('locked'); fromGloss=false;
  const o=sheetOpener; sheetOpener=null;
  if(noFocus!==true && o && document.body.contains(o)){ try{ o.focus({preventScroll:true}); }catch(e){} }
}
/* the dimmed background never scrolls the page behind it */
sheetBg.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
sheetBg.onclick=closeSheet;
/* keyboard: Escape closes; Tab stays inside the open sheet */
document.addEventListener('keydown',e=>{
  if(!sheet.classList.contains('on')) return;
  if(e.key==='Escape'){ e.preventDefault(); closeSheet(); return; }
  if(e.key==='Tab'){
    const f=[...sheet.querySelectorAll('a[href],button:not([disabled]),[tabindex="0"]')].filter(x=>!x.hidden && x.offsetParent!==null);
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey && (document.activeElement===first || document.activeElement===sheet)){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
bootView();
render();
</script>
