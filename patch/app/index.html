<head>

<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#1c1b19;--muted:#6b665d;--line:#e6e0d4;--accent:#c8481f;--teal:#0f6b6b;--teal-soft:#e3f0ef;--warn:#b3261e;--warn-soft:#fbe9e7;--chip:#f1ede4;--chip-on:#1c1b19;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px -10px rgba(0,0,0,.15)}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--card:#1e2026;--ink:#ececea;--muted:#a19d95;--line:#2d3038;--accent:#e3633a;--teal:#5fb3b3;--teal-soft:#1c2c2c;--warn:#ff7b6e;--warn-soft:#3a1f1c;--chip:#2a2d35;--chip-on:#ececea;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px -10px rgba(0,0,0,.6)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
.wrap{max-width:600px;margin:0 auto;padding:14px 18px 24px}
h1,h2,h3{font-family:ui-serif,Georgia,'Times New Roman',serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:2.2rem;font-weight:800}
h1 .b{color:var(--accent)}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700;margin-top:0}
p{margin:.35em 0 .8em}
.muted{color:var(--muted)} .small{font-size:.9rem}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:0.875rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
.card.flag{border-color:var(--warn);background:var(--warn-soft)}
.card.soft{background:var(--teal-soft);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:.92rem;border-radius:11px;min-height:44px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px}
.topbar .sp{flex:1}
.tb{border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer;padding:8px 10px;border-radius:10px;font-weight:700;min-height:44px;min-width:44px}
.tb:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#menuBtn{font-size:1.25rem;line-height:1}
.tb.ttl{font-family:ui-serif,Georgia,'Times New Roman',serif;font-weight:800;font-size:1.1rem;padding:6px 4px;white-space:nowrap}
@media (max-width:360px){.tb.gls{padding:6px 8px;font-size:0.875rem}}
.tb.ttl .b{color:var(--accent)}
.tb.gls{font-size:0.875rem;border:1px solid var(--line)}
.menu{display:grid;gap:6px;margin-top:6px}
.menu button,.menu a{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.menu .danger{color:var(--warn)}
.gl{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 2px;font:inherit;cursor:pointer}
.gl .grade{margin:0;flex:none}
html.locked,html.locked body{overflow:hidden}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:0.875rem;font-weight:700;padding:6px 14px;cursor:pointer;min-height:44px;min-width:44px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:grid;gap:10px;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;font-size:1.02rem;line-height:1.3;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--bg);border-color:var(--chip-on)}
.chip.danger[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.prog{display:flex;gap:4px;flex:1;margin:0 12px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)}
.qn{font-size:0.875rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.t{color:var(--teal);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:pointer;font-weight:600;padding:.35em 0}
ul{padding-left:1.1em;margin:.3em 0 .6em} li{margin:.3em 0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .22s,visibility 0s linear .22s;z-index:50;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .22s,visibility 0s}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:1.25rem}
.grade{display:inline-block;font-size:0.875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:10px}
.grade.solid{background:#2e6b3a;color:#fff}.grade.likely{background:var(--teal);color:#fff}.grade.try{background:var(--chip);color:var(--muted)}details.more{margin:10px 0 0}details.more>summary{cursor:pointer;list-style:none;padding:12px 14px;border-radius:14px;background:var(--chip);font-weight:600;font-size:.95rem}details.more>summary::-webkit-details-marker{display:none}details.more>summary::after{content:' ▾';color:var(--muted)}details.more[open]>summary::after{content:' ▴'}details.more[open]>summary{margin-bottom:10px}
.tm details{border-top:1px solid var(--chip);padding:8px 0}.tm details:last-child{border-bottom:1px solid var(--chip)}.tm summary{cursor:pointer;line-height:1.35}.tm summary .muted{font-size:.88rem}.tm p{margin:6px 0 0;font-size:.95rem}
.grade.reason{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--muted)}
.ev{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:0.875rem;color:var(--muted);line-height:1.45}
.ev b{color:var(--ink)}
.ev .src{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.ev .src a{display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;padding:4px 12px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:0.875rem;font-weight:600;border:1px solid var(--line)}
.ev .src a:after{content:" ↗";opacity:.6}
.ev .rev{margin-top:10px;font-size:0.875rem;font-style:italic;opacity:.85}
.patch h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:0.875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--accent);padding:3px 8px;border-radius:999px}
.tag.teal{background:var(--teal)} .tag.ink{background:var(--ink);color:var(--bg)}
.cost{font-variant-numeric:tabular-nums;color:var(--muted);font-size:0.875rem;white-space:nowrap}
textarea.out{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
.hidden{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.checkin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip[aria-pressed="true"]::before{content:"✓ ";font-weight:700}
/* v1.2.25: checkbox for pick-several, circle for pick-one */
.pickall{margin:12px 0 -4px;font-weight:700;font-size:.95rem}
.chips.pickn .chip,.chips.pick1 .chip{display:flex;align-items:flex-start;gap:12px}
.chips.pickn .chip::before,.chips.pick1 .chip::before{content:"";flex:0 0 22px;width:22px;height:22px;margin-top:-1px;box-sizing:border-box;border:2px solid var(--muted);background:var(--card)}
.chips.pickn .chip::before{border-radius:6px}
.chips.pick1 .chip::before{border-radius:50%}
.chips.pickn .chip[aria-pressed="true"]::before{content:"✓";border-color:var(--bg);background:var(--bg);color:var(--chip-on);font-size:15px;font-weight:800;line-height:18px;text-align:center}
.chips.pick1 .chip[aria-pressed="true"]::before{content:"";border-color:var(--bg);background:radial-gradient(circle,var(--bg) 0 5px,transparent 6px)}
.chips.pickn .chip.danger[aria-pressed="true"]::before{color:var(--warn)}
.t:focus-visible,.chip:focus-visible,.btn:focus-visible,.ev .src a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.add-warn{display:block;margin-top:4px;color:var(--warn);font-size:.88rem;font-weight:600}
.hand{border:2px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:.95rem;line-height:1.45}
.hand div{margin:2px 0}
.chip.ack{width:100%;font-size:0.875rem;line-height:1.35;margin-top:12px;padding:10px 14px;opacity:.85}
.card.gate{border:2px solid var(--accent)}
.btn[aria-disabled="true"]{opacity:.45}
.doors{display:grid;gap:12px;margin-top:14px}
.door{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--accent);background:var(--card);color:var(--ink);border-radius:18px;padding:16px 18px;font:inherit;cursor:pointer;box-shadow:var(--shadow)}
.door.main{padding:20px 20px;border-left-width:7px}
.door.main .dt{font-size:1.45rem}
.doors.small{grid-template-columns:1fr;gap:8px;margin-top:8px}
.doors.small .door{padding:12px 14px}
.doors.small .door .dt{font-size:1.05rem;margin:0}
.doors.small .door .ds{font-size:0.875rem}
.or{margin:16px 0 0;font-size:0.875rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.one{border:2px solid var(--ink)}
.one .big{font-size:1.15rem;line-height:1.4;font-weight:600;margin:4px 0 6px}
.door.teal{border-left-color:var(--teal)} .door.ink{border-left-color:var(--ink)} .door.green{border-left-color:#2e6b3a}
.door .eyebrow{display:block;margin-bottom:2px}
.door .dt{display:block;font-family:ui-serif,Georgia,'Times New Roman',serif;font-weight:800;line-height:1.15;margin:2px 0 4px;font-size:1.2rem}
.door .ds{display:block;color:var(--muted);font-size:.95rem;line-height:1.4}
.door .status{display:inline-block;margin-top:8px;font-size:0.875rem;font-weight:700;color:var(--teal)}
.door[aria-disabled="true"]{opacity:.5}
.door:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.verdict h3{font-size:1.35rem;margin:6px 0 8px}
.grade.unclear{background:var(--chip);color:var(--muted)}
.also li{margin:.25em 0}
.intent{display:grid;gap:8px;margin:10px 0}
textarea.out.live{min-height:240px;font-size:0.875rem;line-height:1.4}
.pat{font-variant-numeric:tabular-nums}
.tk{display:grid;gap:8px}
.tk .r{display:grid;grid-template-columns:7.2em 1fr auto;gap:8px;align-items:center;font-size:.92rem}
.tk .r .nm{font-weight:600;line-height:1.2}
.tk .r .nm small{display:block;font-weight:400;color:var(--muted);font-size:0.875rem}
.tk .meter{height:12px;border-radius:6px;background:var(--chip);overflow:hidden;position:relative;border:1px solid var(--line)}
.tk .meter i{display:block;height:100%;border-radius:6px;background:#c99a1a;min-width:3px}
.tk .meter.empty i,.tk .meter.low i,.tk .meter.over i{background:#d23b2a} .tk .meter.ok i{background:#c99a1a} .tk .meter.full i{background:#1fa64a}
.tk .amt{font-size:0.875rem;color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.tk .amt b{color:var(--ink)}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0} /* v1.2.25: one column on phones; two side by side overflowed 360 px */
.food{position:relative;border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:52px;display:flex;min-width:0}
.food .add{flex:1;border:0;background:transparent;color:var(--ink);padding:10px 44px 10px 12px;font:inherit;font-size:.9rem;line-height:1.25;cursor:pointer;text-align:left;border-radius:12px;min-width:0;overflow-wrap:anywhere}
.food small{display:block;color:var(--muted);font-size:0.875rem;margin-top:2px}
.food[data-n]:not([data-n="0"]){border-color:var(--teal);background:var(--teal-soft)}
.food .cnt{font-weight:800;color:var(--teal)}
.food .plusmark{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:2px solid var(--teal);color:var(--teal);font-weight:800;font-size:1.1rem;line-height:24px;text-align:center;pointer-events:none}
.food[data-n]:not([data-n="0"]) .add{padding-right:84px}
.food .minus{position:absolute;top:50%;right:44px;transform:translateY(-50%);width:28px;height:28px;border:2px solid var(--muted);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:1.1rem;line-height:1;cursor:pointer;border-radius:50%;padding:0}
.food .minus::after{content:"";position:absolute;inset:-10px} /* v1.2.25: the circle stays 28 px; the tap area is 48 px */
.steps{display:grid;gap:8px}
.st{display:grid;grid-template-columns:1fr 44px auto 44px;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px;background:var(--card)}
.st.on{border-color:var(--teal);background:var(--teal-soft)}
.st .nm{font-size:.9rem;font-weight:600;line-height:1.2}
.st .val{min-width:76px;text-align:center;font-size:0.875rem;font-variant-numeric:tabular-nums}
.stp{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-size:1.4rem;font-weight:800;line-height:1;cursor:pointer;padding:0}
.stp.plus{background:var(--ink);color:var(--bg)}
.stp[disabled]{opacity:.3;cursor:default}
.stp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.food .add:focus-visible,.food .minus:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.gtabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:0.875rem;font-weight:600;cursor:pointer;min-height:44px}
.gtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fill li{margin:.35em 0}
.gtabs.seg{margin:6px 0 10px}
.stor{font-size:0.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 6px;vertical-align:middle}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhd .btn{min-width:44px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:0.75rem;font-weight:700;color:var(--muted);padding:2px 0}
.cd{position:relative;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:46px;font:inherit;font-size:0.875rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 0}
.cd[disabled]{opacity:.35;cursor:default}
.cd.today{border:2px solid var(--ink)}
.cd .zap{position:absolute;top:1px;right:3px;font-size:0.75rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.dot.none{background:transparent}
.dot.g{background:#1fa64a} .dot.y{background:#c99a1a} .dot.r{background:#d23b2a}
.dot.part{background:linear-gradient(90deg,var(--muted) 50%,transparent 50%);border:1px solid var(--muted);width:8px;height:8px}
.dot.hollow{border:2px solid var(--muted);width:6px;height:6px;background:transparent}
.rq{margin:12px 0 0}
.rq .lb{font-size:0.875rem;font-weight:700;margin:0 0 6px}
.rq .lb small{font-weight:400;color:var(--muted)}
.rr{display:flex;gap:6px;flex-wrap:wrap}
.rc{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;min-height:44px}
.rc[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rc small{font-size:.82em;font-weight:500}
.rc.e1[aria-pressed="true"],.rc.e2[aria-pressed="true"]{background:#d23b2a;border-color:#d23b2a;color:#fff}
.rc.e3[aria-pressed="true"]{background:#c99a1a;border-color:#c99a1a;color:#fff}
.rc.e4[aria-pressed="true"],.rc.e5[aria-pressed="true"]{background:#1fa64a;border-color:#1fa64a;color:#fff}
.rsum{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cd .en{position:absolute;top:1px;left:4px;font-size:0.75rem;font-weight:800;color:var(--muted)}
.strip{display:grid;grid-template-columns:auto repeat(14,minmax(0,1fr));gap:3px 2px;align-items:center;font-size:0.75rem}
.strip .sl{color:var(--muted);font-weight:700;padding-right:4px;white-space:nowrap;font-size:0.875rem}
.strip .sc{text-align:center;min-width:0;line-height:1.1}

   counted for energy, sleep, caffeine and alcohol, against what the check-in says; lactose by dose (one serving of 12 g or more, or over
   24 g in a day, against days under 6 g — EFSA 2010) instead of "12 g in the day"; "a clue, not proof" for the one-change test;
   plain Bristol words on the loose/hard chips; days the patterns can't use yet are drawn pale on the strip. */
/* v1.2.24 (6 Nov 2026): optional "When?" on loose stools — after a meal or drink / on waking. A loose stool on waking counts with the

/* v1.2.25 (6 Nov 2026): pick-several questions say "Pick all that apply" and show checkboxes (pick-one show circles); the food grid is one
   column on phones and no longer scrolls sideways at 360 px, with a 44 px hit area on "−"; the crash result leads with the read and
   tomorrow's move and folds the rest; the returning home shows the week's one thing; logging a crash ticks ⚡ on that day's check-in;
   bottom sheets are capped at 640 px on wide screens; glossary words get their one underline where they're visible first. */
/* v1.2.26 (6 Nov 2026): suspects (what came before bad days, counted against days without it; a lead only when luck would
   make that split less than 1 time in 50 — and still a lead, not proof); your own
   two-week test of one suspect, with a swap that keeps protein, three days back to how it was, and the numbers before, during and
   after; earned hints on the home screen; protein bar, sugar-free chocolate and a leftovers marker in the food list; glossary
   entries for the test and for coffee and iron (Morck 1983). No diagnosis anywhere. */
/* v1.2.27 (6 Nov 2026): one questionnaire (the tank's sex, age, weight and work joined it); home is the week's one line, the
   test if one is running, the fuel gauge (fuel and protein today, last meal, what's low this week) and three buttons — Crash
   report, Meal report, History. Meals carry a time; the day log is rebuilt from them. Closing the day leads into the check-in.
   The crash report fills in the 4 hours before from timed meals, and sleep and caffeine from the check-in, and skips those
   questions. History opens on what was found: test, suspects, patterns, then the days, the crash log and the rest. */
/* v1.2.28 (6 Nov 2026): for the person with five minutes — see what's wrong, what to swap in, keep going. Symptoms carry a time
   (bloating, loose or hard stools, headache, itch or flushing, low mood) and fill the check-in's day flags; a loose stool before
   the day's first meal counts with the day before, worked out instead of asked. Home: Today | History, the week's one line, fuel
   and protein rings, Crash · Meal · Symptom, today in order with the time since the last meal. First open: their own day said
   back to them, a one-minute normal day that fills the gauge, and what they'll see and when. Crash tip from hours since the
   last meal, once three recent crashes agree. */
/* v1.2.29 (6 Nov 2026): opening the app starts on home (a refresh, or the browser bringing a sleeping page back, within 15

   list stays under the thumb: the tank's editor, "Same as" and "More foods" no longer move it. Typing hides the food groups,
   not "Your usual". A crash report left half done on an earlier day no longer comes back as today's. */
/* v1.2.30 (6 Nov 2026): the purpose on the first screen — find the foods that work for you, with everything your body needs.

   Blood results: where the stores are, whether the iron logged since holds them, and what changed between two tests. A month
   in: one thing learned. Tell Tobie. The gauge says why a nutrient matters. The sugar loop, named; fructose as a gut suspect. */
/* v1.2.31 (6 Nov 2026): vitamin E in IU, the number on the bottle (food counted as the natural form, 1 mg = 1.49 IU; the pill
   ceiling 1,100 IU, safe for either form). Micrograms are written mcg, as Canadian pharmacy labels do. Lab results keep the
   unit printed on the lab sheet. */

   with no number and says why. */
/* v1.2.33 (6 Nov 2026): the hours before. For each crash, headache or itch with a time, the meals logged in the 4 hours

/* v1.2.34 (6 Nov 2026): small screens — the History strip's sleep and date labels no longer run together under 400 px,

   A restored backup is checked first: malformed days, times and symptom kinds are dropped.

   move the day's start; a year of meals, symptoms and crash reports is kept (was 90 days and 30 reports); the hours before

   is compared with the same clock hours on days without it. */

   the same hours in pieces (not "five beat seven"); a drink and a sedative can stop your breathing (not "the only one"). */
/* v1.2.36 (6 Nov 2026): French typography — a non-breaking space before every colon, inside « », before % and $, inside

   wrong both ways: a lead appears right after an unlucky stretch, and comparing with the two weeks just before made an
   innocent food come out "fewer" about 1 time in 5; a real cause got "probably not this one" more often than not. Now: the four
   weeks before, a two-sample exact test, "too close to call" with two more weeks offered, no ruling out on a short test, and
   the bring-back days read whatever the test said (2 of them for "the clearest sign"). Also: fields at 16px on iPhone (no
   zoom), and inside a Claude chat the backup falls back to copy, then to the text itself. */
/* v1.2.38 (6 Nov 2026): ice cream, cookies, donuts and dark chocolate count as sweets (a binge of them couldn't be named before);
   lactose "at one time" is a sitting's total, not the largest single serving. */
/* v1.2.39 (7 Nov 2026): six made-up people, 19 runs of 70 days in the real app. The bring-back says "clearest sign" only when luck
   at the person's own rate rarely brings the bad days back; lactose becomes a suspect with a test; calm first when the outcome is on
   most days; alcohol in four steps with a dose ladder, "not cleared" instead of vanishing, and a no-6-or-more test for daily drinkers

   logging is said on Home. */
/* v1.2.40 (7 Nov 2026): say it straight, no swaps. A swap to another drink that feels better can end in more of it, so the app
   never swaps one alcohol or energy drink for another; when someone's own days point at drinks or energy drinks, Home says so in
   their numbers. Teens get no energy-drink allowance. Alcohol tests show drinks per week. */
/* v1.2.41 (7 Nov 2026): ease people in. Your path on Home: the basics first (fuel, caffeine and drinks kept away from sleep),
   blood work if the bad days stay, then the suspects. Every step has "I'll do it — remind me" and "I can't — next"; the app picks
   the next course of action from the answer. The check-in asks the last drink's time and the day's energy drinks (optional). */
/* v1.2.42 (7 Nov 2026): plain words. Read as a newcomer who knows nothing about nutrition or biology: plain words where a newcomer
   couldn't act (sex question, warning signs, stools, the gauge, the blood page, the crash report, the glossary's hardest lines),
   and two places that contradicted the path ("what you'll see, and when"; a drinks test with days back). */
/* v1.2.43 (7 Nov 2026): goals first. A goals question replaces "what are you keeping", the goals sit on Home (tap to change), and
   a weight plan follows Tobie's rules — see the GOALS block above the questions. */
/* v1.2.44 (7 Nov 2026): in French the clean start is "les trois semaines sans les suspects habituels" (Argon: "Départ…" read translated). */
/* v1.2.45 (7 Nov 2026): "Something was different" sets the day aside — no patterns, tests, days back or path; drinks and slips still count.

/* v1.2.46 (7 Nov 2026): from three simulated people's runs — the weight plan knows about stimulants and the road, the week card
   follows the clean start, and the path's "no suspect" card names what History already shows. */
/* v1.2.47 (7 Nov 2026): the ADHD pill in the check-in. On a pill day a crash isn't held against a food; when crashes sit on
   pill days, the path's first step is the prescriber, not a food test. */
/* v1.2.48 (7 Nov 2026): three tabs — Report, The plan, History. Report is the day; the plan is the path, the weight plan and
   the one-week patch. Report points at the plan when the plan is waiting on you. */
/* v1.2.49 (7 Nov 2026): fibre as a suspect for loose stools, with a two-week plain-food test; colon cancer in the family. */
/* v1.2.50 (7 Nov 2026): open source under the GNU AGPL-3.0 or later — the notice at the top of the file, and in About. */
/* v1.2.51 (7 Nov 2026): the install file's screenshots exist again; on Samsung's browser the install pill points to Chrome. */
/* v1.2.52 (7 Nov 2026): About shows the copyright and who made it, with where the free version is; the notice at the top adds two terms

const G = {
  crcfam:{g:'solid', t:['Colon cancer in the family','Cancer du côlon dans la famille'],
    s:['A parent, brother, sister or child with colon cancer about doubles your own risk — partly shared genes, partly shared habits — so screening starts earlier: by 40 instead of 50, or 10 years younger than your relative was when it was found, if that comes first. Usually a colonoscopy, every 5 to 10 years (every 5 if they were under 60, or if two of them had it); a stool test every 1 to 2 years is the other option. Grandparents, aunts and uncles alone don’t change it. Blood in the toilet, or iron that keeps running low, is a reason to ask now, at any age.',
       'Un parent, un frère, une sœur ou un enfant qui a eu un cancer du côlon, ça double à peu près ton propre risque — en partie les gènes, en partie les habitudes partagées — alors le dépistage commence plus tôt : à 40 ans au lieu de 50, ou 10 ans plus tôt que l’âge de ton proche au diagnostic, si ça arrive avant. Habituellement une coloscopie, tous les 5 à 10 ans (tous les 5 ans si ton proche avait moins de 60 ans, ou si deux proches l’ont eu); un test de selles tous les 1 à 2 ans est l’autre option. Des grands-parents, des oncles ou des tantes seulement, ça ne change rien. Du sang dans la toilette, ou du fer qui reste bas, c’est une raison d’en parler maintenant, peu importe l’âge.']},
  setaside:{g:'likely', t:['Days set aside','Les journées mises de côté'],
    s:['Tap “Something was different” on a day that wasn’t your normal — sick, travelling, your period, a rough stretch of stress — and that day is set aside: it doesn’t count in your patterns, your tests or your path. Its drinks still count in your weekly total. Why: one unusual day can look exactly like a food reaction. If your days back land on a stomach bug or your period, two bad days in a row would read as the clearest sign — against a food that did nothing. Setting a day aside costs one day of data; a wrong answer costs a food you never needed to give up.',
       'Appuie sur « Quelque chose était différent » une journée qui n’était pas comme d’habitude — malade, en voyage, tes règles, une grosse passe de stress — et cette journée est mise de côté : elle ne compte pas dans tes tendances, tes tests ni ton chemin. Ses verres comptent quand même dans ton total de la semaine. Pourquoi : une journée inhabituelle peut ressembler exactement à une réaction à un aliment. Si tes jours de retour tombent sur une gastro ou sur tes règles, deux mauvaises journées de suite auraient l’air du signe le plus clair — contre un aliment qui n’y était pour rien. Mettre une journée de côté coûte une journée de données; une mauvaise réponse coûte un aliment que tu n’avais jamais besoin d’abandonner.']},
  ferritin:{g:'solid', t:['Ferritin','Ferritine'],
    s:['The blood test for your iron stores. Under 30 is low by the UK gastroenterology guideline; the WHO uses under 15 for healthy adults, under 70 with inflammation. The trial that eased fatigue treated people under 50; above that, nobody has shown a benefit, and a high number is its own question — inflammation, liver, the iron-overload gene — not something to push higher. Ask for CRP on the same draw — inflammation pushes ferritin up and can hide a real shortage. In the US you can order it yourself for $15–60; in Alberta many pharmacists can order it; in Quebec without a family doctor, call 811, option 3; elsewhere a walk-in clinic can.',
       'La prise de sang qui mesure tes réserves de fer. Sous 30, c’est bas selon le guide britannique de gastro-entérologie; l’OMS utilise sous 15 chez l’adulte en santé, sous 70 s’il y a de l’inflammation. L’essai qui a soulagé la fatigue traitait des gens sous 50; au-dessus, personne n’a démontré de bénéfice, et un chiffre élevé est une question en soi — inflammation, foie, le gène de la surcharge en fer — pas quelque chose à pousser plus haut. Demande la CRP sur la même demande d’analyse — l’inflammation fait monter la ferritine et peut cacher une vraie carence. Aux États-Unis, tu peux la commander toi-même (15–60 $); en Alberta, bien des pharmaciens peuvent la prescrire; au Québec, sans médecin de famille, compose le 811, option 3; ailleurs, passe par une clinique sans rendez-vous.']},
  iron:{g:'solid', t:['Iron','Fer'],
    s:['Carries oxygen and helps make the brain chemicals for drive and focus. Low iron feels like: tired no matter how much you sleep, short of breath on stairs, cold hands, restless legs, hair shedding, low mood, poor focus. It looks exactly like depression on a questionnaire. Don’t start iron pills without a ferritin number — some people have too much and pills would hurt them. And if the low mood includes thoughts of not wanting to be here, that is a call or text to 9-8-8 (Canada) or 988 (US) today — not a ferritin test first.',
       'Transporte l’oxygène et aide à fabriquer les neurotransmetteurs de la motivation et de la concentration. Manquer de fer, ça donne ça : à plat peu importe combien tu dors, le souffle court dans les escaliers, mains froides, jambes sans repos, cheveux qui tombent, moral à plat, difficulté à te concentrer. Sur un questionnaire médical, ça sort exactement comme une dépression. Ne commence pas de fer en comprimés sans connaître ton taux de ferritine — certaines personnes en ont déjà trop et les comprimés leur nuiraient. Et si le moral bas s’accompagne d’idées de ne plus vouloir être là, appelle ou texte le 9-8-8 (Canada) ou le 988 (É.-U.) dès aujourd’hui — ça passe bien avant un test de ferritine.']},
  psyllium:{g:'solid', t:['Psyllium husk','Psyllium'],
    s:['A plant fibre that turns to gel in water. It firms loose stools and softens hard ones, soaks up irritating bile acids, and steadies blood sugar a little. The label’s one to two teaspoons a day, in a FULL glass of water — never dry. Buy the plain, unflavoured tub; the flavoured sugar-free kind is sweetened with the stuff we’re removing. Take it 2 hours away from medications and iron. Don’t use it if you have a known bowel narrowing or trouble swallowing.',
       'Une fibre végétale qui se transforme en gel dans l’eau. Elle raffermit les selles molles, ramollit les selles dures, éponge les acides biliaires qui irritent et stabilise un peu la glycémie. La dose de l’étiquette : une à deux cuillères à thé par jour dans un GRAND verre d’eau — jamais à sec. Achète le pot nature, sans saveur; la version aromatisée « sans sucre » contient justement les édulcorants qu’on essaie d’éliminer. Espace-le de 2 heures de tes médicaments et du fer. N’en prends pas si tu as un rétrécissement intestinal connu ou de la difficulté à avaler.']},
  magnesium:{g:'likely', t:['Magnesium glycinate','Bisglycinate de magnésium'],
    s:['Every unit of energy your cells make needs magnesium attached to it. Alcohol, heavy sweating and loose stools are the real drains. Caffeine does push some out in urine — about 4 mg a day in a metabolic-ward study, small next to food. Label doses run 200–400 mg; 350 is the daily upper limit from supplements, so stay at or under it. The glycinate (or bisglycinate) form, in the evening, is the gentle one on the gut; the one sleep trial used the oxide form, so the form is about your stomach, not about sleep. Avoid oxide and citrate if your stools are already loose — they’re laxatives. The usual blood test only sees the one percent in your blood, not what’s in your cells, so a normal result doesn’t rule it out. Whether your sleep changes is the practical test — and if nothing changes in two weeks, stop buying it.',
       'Chaque unité d’énergie que tes cellules produisent a besoin de magnésium qui s’y attache. L’alcool, la forte transpiration et les selles molles sont les vraies fuites. La caféine en fait sortir un peu dans l’urine — environ 4 mg par jour dans une étude en unité métabolique, peu à côté de la nourriture. Les doses d’étiquette vont de 200 à 400 mg; 350, c’est la limite supérieure quotidienne en supplément, alors reste à 350 ou moins. La forme glycinate (ou bisglycinate), prise le soir, est la plus douce pour l’intestin; le seul essai sur le sommeil a utilisé l’oxyde, alors la forme, c’est pour ton estomac, pas pour le sommeil. Évite l’oxyde et le citrate si tes selles sont déjà molles — ce sont des laxatifs. La prise de sang habituelle voit seulement le un pour cent qui est dans ton sang, pas ce qui est dans tes cellules, alors un résultat normal n’exclut rien. Le test pratique, c’est de voir si ton sommeil change — et si rien ne change en deux semaines, arrête d’en acheter.']},
  creatine:{g:'likely', t:['Creatine','Créatine'],
    s:['A natural compound that refills quick energy in your muscles and brain in the first seconds of any effort. The studied amount — 3–5 g a day of plain creatine monohydrate, about thirty cents — has trial evidence for mental and physical fatigue — strongest in people who eat little red meat or sleep badly. Mix it in anything. Nothing to feel on day one; a few weeks in, afternoons are less heavy.',
       'Un composé naturel qui recharge l’énergie rapide des muscles et du cerveau dès les premières secondes d’un effort. La quantité étudiée — 3 à 5 g par jour de créatine monohydrate nature, une trentaine de sous — a fait ses preuves en essais contre la fatigue mentale et physique, surtout chez ceux qui mangent peu de viande rouge ou qui dorment mal. Mélange-la dans n’importe quoi. Tu ne sentiras rien le premier jour; après quelques semaines, les après-midis pèsent moins lourd.']},
  thiamine:{g:'solid', t:['Thiamine (vitamin B1)','Thiamine (vitamine B1)'],
    s:['The vitamin alcohol burns through fastest. Running short causes fatigue, brain fog, and — if it goes on — permanent brain damage that is completely preventable. The guidelines say anyone drinking heavily needs it, and at most days it’s cheap insurance; the guideline dose outside hospital is 100 mg a day, and the over-the-counter bottles come as 50 or 100 mg — the 100 matches it. A few dollars. Alcohol drains folate and magnesium the same way, so they’re worth having too.',
       'La vitamine que l’alcool épuise le plus vite. En manquer cause de la fatigue, du brouillard mental et — à la longue — des lésions permanentes au cerveau, pourtant 100 % évitables. Les guides sont clairs : quiconque boit beaucoup en a besoin, et presque tous les jours, c’est une assurance pas chère. La dose des guides hors de l’hôpital, c’est 100 mg par jour, et les pots sans ordonnance viennent en 50 ou 100 mg — le 100 correspond. Quelques dollars. L’alcool vide aussi le folate et le magnésium, alors ça vaut la peine d’en avoir aussi.']},
  salt:{g:'try', t:['Salt water','Eau salée'],
    s:['If you sweat at work, eat little processed food, or feel dizzy standing up, you may be short on sodium — and low sodium feels exactly like low energy. A quarter teaspoon of salt in a glass of water, especially mid-afternoon, is the cheapest energy fix there is to try — if it’s salt you were short on, you’ll know the same afternoon. Skip it if a doctor has told you to restrict salt, if you have high blood pressure, heart or kidney disease, or if you take lithium — lithium tracks sodium.',
       'Si tu sues à la job, que tu manges peu d’aliments transformés ou que la tête te tourne quand tu te lèves, tu manques peut-être de sodium — et un manque de sodium, ça se ressent exactement comme une panne d’énergie. Un quart de cuillère à thé de sel dans un verre d’eau, surtout en milieu d’après-midi, c’est le coup de pouce le moins cher à essayer — si c’est le sel qui manquait, tu vas le sentir dans l’après-midi. Passe ton tour si un médecin t’a dit de couper le sel, si tu fais de l’hypertension ou une maladie du cœur ou des reins, ou si tu prends du lithium — le lithium suit le sodium.']},
  protein:{g:'try', t:['Protein in your first hours awake','Des protéines dès le réveil'],
    s:['The afternoon crash usually starts with a morning that had nothing in it but coffee. Three eggs, a tin of fish, leftover meat, or Greek yogurt in the first hours awake — before noon, for day people — keeps you fuller and takes the edge off the 3 p.m. reach for sugar or an energy drink. No meat or fish? Eggs, cottage cheese, tofu, tempeh, lentils or a big glass of soy milk do the same job. If you take a stimulant, eat BEFORE the pill, because it will take your appetite for the day.',
       'Le crash de l’après-midi commence souvent par une matinée passée juste au café. Trois œufs, une canne de poisson, un restant de viande ou du yogourt grec dans tes premières heures debout — avant midi, si tu travailles de jour — soutiennent plus longtemps et coupent la rage de sucre ou de boisson énergisante à 15 h. Pas de viande ni de poisson? Des œufs, du fromage cottage, du tofu, du tempeh, des lentilles ou un grand verre de boisson de soya font la même job. Si tu prends un stimulant, mange AVANT la pilule, sinon elle va te couper l’appétit pour le reste de la journée.']},
  vitc:{g:'likely', t:['Vitamin C and stimulants','Vitamine C et stimulants'],
    s:['This is about amphetamine-type stimulants — Vyvanse, Adderall, Dexedrine — not Ritalin or Concerta. Their labels say acidifying agents like vitamin C lower the drug’s level in the blood, by changing how fast the urine carries it out. Food amounts aren’t the problem: Vyvanse’s own label lets you mix the capsule into orange juice. What’s worth asking your pharmacist about is high-dose vitamin C — 500 mg pills, fizzy tablets — on the days you take it.',
       'Ça concerne les stimulants de type amphétamine — Vyvanse, Adderall, Dexedrine — pas Ritalin ni Concerta. Leurs monographies disent que les agents acidifiants comme la vitamine C font baisser le taux du médicament dans le sang, en changeant la vitesse à laquelle l’urine l’élimine. Les quantités dans la nourriture ne sont pas le problème : la monographie de Vyvanse permet même de mélanger la capsule dans du jus d’orange. Ce qui vaut la peine d’être demandé au pharmacien, c’est la vitamine C à haute dose — comprimés de 500 mg, comprimés effervescents — les jours où tu le prends.']},
  b12:{g:'solid', t:['Vitamin B12','Vitamine B12'],
    s:['Needed for red blood cells and nerves. Acid-blocking stomach pills (omeprazole, pantoprazole, etc.) and metformin both reduce absorption, so people on them run low over years. Low B12 feels like fatigue, tingling hands or feet, memory slips, low mood. It’s a cheap blood test and a cheap fix — ask for it alongside ferritin.',
       'Essentielle aux globules rouges et aux nerfs. Les bloqueurs d’acide (oméprazole, pantoprazole, etc.) et la metformine nuisent à son absorption; après quelques années, les réserves baissent. Manquer de B12 donne de la fatigue, des fourmillements dans les mains ou les pieds, des trous de mémoire et le moral bas. La prise de sang et le supplément coûtent très peu — demande le test en même temps que la ferritine.']},
  acidblocker:{g:'solid', t:['Acid blockers','Bloqueurs d’acide (IPP)'],
    s:['Omeprazole, pantoprazole, esomeprazole and the like switch off stomach acid — which you also need to absorb iron, B12 and magnesium. Years on them quietly drain all three. Don’t stop them on your own, but do get ferritin, B12 and magnesium checked, and tell whoever prescribed them how long you’ve been on it. If magnesium comes back low, pills don’t always fix it — sometimes the acid blocker itself needs a second look. That’s the prescriber’s call.',
       'L’oméprazole, le pantoprazole, l’ésoméprazole et les médicaments semblables bloquent l’acide de l’estomac — dont tu as pourtant besoin pour absorber le fer, la B12 et le magnésium. En prendre pendant des années épuise tranquillement les trois. N’arrête pas par toi-même, mais fais vérifier ta ferritine, ta B12 et ton magnésium, et rappelle au prescripteur depuis combien de temps tu en prends. Si le magnésium revient bas, les comprimés ne règlent pas toujours le problème — parfois, c’est le bloqueur d’acide lui-même qu’il faut revoir. Ça, c’est la décision du prescripteur.']},
  antidep:{g:'likely', t:['Antidepressants and the gut','Antidépresseurs et intestin'],
    s:['Loose stools, nausea and appetite changes are common side effects of SSRIs, especially early on. That is not a reason to stop — stopping suddenly is its own problem. It is a reason to mention it to the prescriber, and to get ferritin, B12 and thyroid checked, because low iron looks exactly like depression and no pill fills an empty tank. If it helps only partly, ask about add-ons: one with trial evidence is L-methylfolate, a prescription-strength folate — not the same as a folic acid pill, and the prescriber’s call. If you are having thoughts of ending your life, that is 9-8-8 (Canada) or 988 (US), call or text, today.',
       'Les selles molles, les nausées et les changements d’appétit sont des effets secondaires fréquents des ISRS, surtout au début. Ce n’est pas une raison d’arrêter — couper ça d’un coup amène son propre lot de problèmes. Parles-en plutôt à ton prescripteur et fais vérifier ta ferritine, ta B12 et ta thyroïde, parce qu’une carence en fer imite parfaitement la dépression et qu’aucune pilule ne remplit un réservoir à sec. Si ça aide seulement en partie, demande s’il existe des ajouts : un qui a des preuves d’essais, c’est le L-méthylfolate, un folate à dose d’ordonnance — pas la même chose qu’un comprimé d’acide folique, et c’est la décision du prescripteur. Si tu penses à mettre fin à tes jours, appelle ou texte le 9-8-8 (Canada) ou le 988 (É.-U.) dès aujourd’hui.']},
  caffeine:{g:'solid', t:['Caffeine','Caféine'],
    s:['Half of it is still in you five hours later. A 2 p.m. coffee is a quarter-coffee at midnight. It also speeds up the colon and raises stomach acid. Keep it; stop at noon — or, on shifts, eight hours before you sleep. Energy drinks add sugar or sweeteners and up to 180 mg per can in Canada (the legal cap; US cans like Celsius carry 200, some 300), which is why they loosen the gut and wreck sleep worse than coffee. The daily limit (Health Canada): 400 mg for adults, 300 when pregnant or breastfeeding, 2.5 mg per kg of body weight under 18. A mug of drip coffee is about 190 mg, so two mugs and a Monster is already over.',
       'La moitié de la dose est encore dans ton système cinq heures plus tard. Un café à 14 h, c’est un quart de café qui circule encore à minuit. Ça accélère aussi le côlon et augmente l’acidité de l’estomac. Garde ton café, mais coupe-le à midi — ou, sur les quarts, huit heures avant de dormir. Les boissons énergisantes y ajoutent du sucre ou des édulcorants et jusqu’à 180 mg de caféine par canette au Canada (le plafond légal; les canettes américaines comme Celsius en ont 200, certaines 300), ce qui dérange l’intestin et sabote le sommeil bien pire que le café. La limite quotidienne (Santé Canada) : 400 mg pour un adulte, 300 enceinte ou en allaitant, 2,5 mg par kilo de poids corporel avant 18 ans. Une tasse de café filtre, c’est environ 190 mg, alors deux tasses et un Monster, c’est déjà au-dessus.']},
  beer:{g:'reason', t:['Beer','Bière'],
    s:['Carbonation, volume, barley sugars that ferment in the gut, and some histamine. The worst drink for bloating and loose stools. The first one does the job — switching off the day. The second and third are the first one not working anymore.',
       'Du gaz, du volume, des sucres de malt qui fermentent dans l’intestin et un peu d’histamine : c’est la pire boisson pour les ballonnements et les selles molles. La première fait la job — décrocher de la journée. La deuxième et la troisième, c’est juste la première qui ne fait plus effet.']},
  histamine:{g:'likely', t:['Histamine','Histamine'],
    s:['A compound high in aged, fermented, cured, canned foods, leftovers, wine and beer. Fresh cheese — mozzarella, cottage, cream cheese — and freshly cooked meat are low. Your gut normally clears it. Alcohol and an irritated gut lining both reduce that clearing, so it builds through the day like water in a bucket — and when the bucket tips you crash: tired, foggy, headache, loose stools. That’s why the same food is fine one day and flattens you the next. There is no good blood test; your own log is the test.',
       'Une substance présente en grande quantité dans les aliments vieillis, fermentés, fumés ou en conserve, les restants, le vin et la bière. Le fromage frais — mozzarella, cottage, fromage à la crème — et la viande fraîchement cuite en contiennent peu. Normalement, ton intestin l’élimine. L’alcool et une paroi intestinale irritée ralentissent ce nettoyage; l’histamine s’accumule alors toute la journée comme de l’eau dans une chaudière — et quand ça déborde, tu plantes : fatigue, brouillard mental, mal de tête, selles molles. C’est pour ça qu’un même aliment passe bien un jour et t’assomme le lendemain. Il n’existe pas de prise de sang fiable pour ça; ton propre suivi, c’est le meilleur test.']},
  bile:{g:'solid', t:['Bile acids','Acides biliaires'],
    s:['Your body makes bile to digest fat. Normally it gets reabsorbed before the end of your gut. When too much gets through, it acts like soap on the colon lining — urgent, burning, often yellow or watery stools, worst after fatty meals and in the morning. The burning irritates the skin, and in someone with loose stools that is a common source of blood on the paper — common, not the only one, so the bleeding rule (“When bleeding needs a doctor”) still applies. Psyllium soaks some of it up; a doctor can prescribe a stronger binder.',
       'Ton corps produit de la bile pour digérer le gras. Normalement, elle est réabsorbée avant d’arriver au côlon. Quand il en passe trop, elle agit comme du savon sur la paroi intestinale : selles pressantes, brûlantes, souvent jaunes ou liquides, surtout le matin ou après un repas gras. La brûlure irrite la peau, et chez quelqu’un qui a les selles molles, c’est une source fréquente de sang sur le papier — fréquente, pas la seule, alors la règle du saignement (« Quand un saignement demande un médecin ») s’applique quand même. Le psyllium en éponge une partie; un médecin peut prescrire un chélateur plus puissant.']},
  sleepq:{g:'likely', t:['Sleep quality on short hours','Qualité du sommeil quand les heures manquent'],
    s:['If you can’t get more hours, protect the ones you have. Caffeine stops eight hours before bed — noon, for day people. No alcohol within three hours of bed — it knocks you out and then wrecks the second half of the night. Magnesium glycinate in the evening. Screen off for the last twenty minutes. Unbroken sleep does more than the same hours in pieces, and none of this costs anything.',
       'Si tu ne peux pas dormir plus longtemps, protège les heures que tu as. Caféine : finie huit heures avant le coucher — midi, si tu travailles de jour. Pas d’alcool dans les trois heures avant de te coucher — ça t’endort vite, mais ça bousille la deuxième moitié de la nuit. Bisglycinate de magnésium en soirée. Écrans fermés les vingt dernières minutes. Dormir d’une traite fait plus que les mêmes heures en morceaux, et rien de ça ne coûte une cenne.']},
  withdrawal:{g:'solid', t:['Alcohol withdrawal','Sevrage d’alcool'],
    s:['If you drink every day and get shaky, sweaty or anxious when you skip, do NOT stop cold. Withdrawal from heavy daily drinking can cause seizures. That means cutting down slowly, over days — with a doctor, or at least a pharmacist. Take thiamine (B1) starting today regardless. This is the one place on the no-doctor path with a hard stop.',
       'Si tu bois tous les jours et que tu trembles, sues ou deviens anxieux dès que tu sautes un verre, n’arrête PAS d’un coup sec. Le sevrage brutal après une forte consommation quotidienne peut provoquer des convulsions. Il faut diminuer graduellement, encadré par un médecin ou au moins un pharmacien. Commence la thiamine (B1) dès aujourd’hui, peu importe. C’est la seule situation ici où tu ne dois absolument pas gérer ça sans aide.']},
  tsh:{g:'solid', t:['Thyroid (TSH)','Thyroïde (TSH)'],
    s:['A slow thyroid causes fatigue, cold intolerance, weight gain, dry skin, slow thinking. It’s common, especially in women, and it’s one blood test. If you sleep seven hours and still wake tired, this belongs on the list with ferritin.',
       'Une thyroïde au ralenti cause de la fatigue, de la frilosité, une prise de poids, la peau sèche et l’esprit lent. C’est fréquent, surtout chez les femmes, et ça se vérifie en une seule prise de sang. Si tu dors sept heures et que tu te réveilles sans énergie, ajoute ça sur la demande d’analyse avec la ferritine.']},
  vitd:{g:'solid', t:['Vitamin D','Vitamine D'],
    s:['In Canada and the northern US, skin makes almost no vitamin D from October to March. Real deficiency shows up as bone aches and weak muscles; links to mood and colds are weaker. The daily need is 600 IU (800 over 70), from fatty fish, fortified milk, eggs — or a small daily pill if you eat little of those. The 2024 guideline says healthy adults under 75 don’t need a blood test for it, and more than the daily need hasn’t helped them in trials. The safe ceiling is 4,000 IU. Take it with a meal that has fat.',
       'Au Canada et dans le nord des États-Unis, la peau ne fabrique presque pas de vitamine D d’octobre à mars. Un vrai manque donne des douleurs aux os et des muscles faibles; les liens avec le moral et les rhumes sont moins solides. Le besoin quotidien est de 600 UI (800 après 70 ans), tiré du poisson gras, du lait enrichi, des œufs — ou un petit comprimé par jour si tu en manges peu. Le guide de 2024 dit que les adultes en santé de moins de 75 ans n’ont pas besoin de prise de sang pour ça, et que plus que le besoin quotidien ne les a pas aidés dans les essais. Le plafond sécuritaire est de 4 000 UI. Prends-la avec un repas qui contient du gras.']},
  crp:{g:'solid', t:['CRP','CRP'],
    s:['A general inflammation marker. On the same blood draw as ferritin it tells you whether inflammation is pushing ferritin up and hiding a real iron shortage. Cheap, and worth asking for every time.',
       'Un marqueur général d’inflammation. Sur la même prise de sang que la ferritine, elle indique si de l’inflammation gonfle artificiellement ton chiffre et cache une vraie carence en fer. Ça ne coûte presque rien — demande-la chaque fois.']},
  barrier:{g:'likely', t:['Barrier cream','Crème barrière'],
    s:['Zinc oxide cream (the diaper-rash tub) after each wipe while stools are loose protects the skin from bile and helps break the tear-and-bleed cycle. Pat, don’t rub. A warm sitz bath — sitting in a few inches of warm water — if it’s already torn. Cheap, and worth trying alongside the bleeding rule, never instead of it: over 50, or with belly pain, a change in how you go, weight loss or low iron, the appointment gets booked whether or not the cream works. Under 50 with none of those: bleeding past two weeks, or blood mixed into the stool rather than on the paper, needs a doctor.',
       'Appliquer de la crème à l’oxyde de zinc (la crème de zinc pour bébé, genre Zincofax) chaque fois que tu t’essuies tant que les selles sont molles protège la peau contre la bile et casse le cycle fissure-saignement. Tapote avec le papier sans frotter. Prends un bain de siège tiède — t’asseoir dans quelques pouces d’eau tiède — si c’est déjà fissuré. Ça coûte quelques dollars et ça vaut la peine en même temps que la règle du saignement, jamais à sa place : 50 ans ou plus, ou avec des douleurs au ventre, un changement dans ta façon d’aller à la selle, une perte de poids ou un manque de fer, le rendez-vous se prend que la crème marche ou pas. Sous 50 ans sans rien de ça : un saignement qui dure plus de deux semaines, ou du sang mêlé aux selles plutôt que sur le papier, fais voir ça par un médecin.']},
  loop:{g:'reason', t:['The loop','La boucle'],
    s:['Caffeine → bad sleep → more caffeine. Sugar → crash → sugar. Alcohol → bad sleep → caffeine → loose gut → “something quick” → processed. Each symptom gets explained by the last purchase, so the circuit stays invisible. When half of everyone’s calories come from it, it looks normal. It isn’t, and it can be interrupted at one point without taking everything away.',
       'Caféine → mauvais sommeil → plus de caféine. Sucre → crash → sucre. Alcool → sommeil haché → caféine → intestin dérangé → « un repas sur le pouce » → ultra-transformé. Chaque symptôme semble réglé par le prochain achat, si bien que le cercle vicieux reste invisible. Quand la moitié des calories de tout le monde vient de là, ça finit par paraître normal. Ça ne l’est pas, et tu peux briser le cycle à un seul endroit sans tout te retirer d’un coup.']},
  liver:{g:'solid', t:['Liver once a week','Du foie une fois par semaine'],
    s:['Beef or chicken liver carries every B vitamin, iron, copper and vitamin A in one cheap serving. Once a week is enough — daily is too much vitamin A. Skip it entirely if you’re pregnant or could be; too much vitamin A can harm the baby. Pan-fry with onions, or hide it in ground beef. If you won’t eat it, beef and canned fish cover most of the same ground more slowly.',
       'Une seule portion pas chère de foie de bœuf ou de poulet fournit toutes les vitamines B, du fer, du cuivre et de la vitamine A. Une fois par semaine suffit amplement — en manger tous les jours apporte trop de vitamine A. Évite-le complètement si tu es enceinte ou pourrais l’être, car l’excès de vitamine A est dangereux pour le fœtus. Poêlé avec des oignons, ou haché finement dans du bœuf haché. Si tu n’es pas capable d’en manger, le bœuf et le poisson en canne font presque la même job, juste moins vite.']},
  sweeteners:{g:'solid', t:['Sweeteners','Édulcorants'],
    s:['Sugar alcohols (anything ending in -ol: sorbitol, xylitol, erythritol, maltitol) and sucralose, found in sugar-free gum, sugar-free drinks (the ones made with artificial sweetener), protein shakes and keto bars. The -ols pull water into the gut and feed gas: loose stools and bloating a few hours later, worse the more you have — that part is solid. Sucralose is different: it doesn’t pull water in, and the evidence is that it changes gut bacteria, not that it causes diarrhea. Some people still react; the test week tells you. Read the label; one week without them tells you.',
       'Les alcools de sucre (tout ce qui finit en -ol : sorbitol, xylitol, érythritol, maltitol) et le sucralose — cachés dans la gomme sans sucre, les boissons sans sucre (celles faites avec un édulcorant artificiel), les shakes protéinés et les barres kéto. Les -ol attirent l’eau dans l’intestin et fermentent : ballonnements et selles molles quelques heures plus tard, proportionnels à la dose — ça, c’est solide. Le sucralose, c’est différent : il n’attire pas l’eau, et les données montrent qu’il change les bactéries intestinales, pas qu’il cause la diarrhée. Certaines personnes réagissent quand même; la semaine de test te le dit. Vérifie les ingrédients; coupe-les une semaine et tu vas vite avoir ta réponse.']},
  apnea:{g:'solid', t:['Sleep apnea','Apnée du sommeil'],
    s:['Your airway closes over and over while you sleep, so you never get the deep part of the night — and you wake up having “slept” seven hours as tired as if you’d had four. The signs: loud snoring, someone has seen or heard you stop breathing or gasp, morning headaches, falling asleep when you sit still. It pushes blood pressure up and drives the afternoon caffeine. No supplement touches it. The test is one night with a small home device; the usual fix is a mask that most people feel within a week. Ask for a home sleep test by name.',
       'Ta gorge se referme à répétition pendant que tu dors, ce qui t’empêche d’atteindre le sommeil profond — tu te réveilles après sept heures dans le lit aussi brûlé que si tu en avais dormi quatre. Les signes classiques : ronflements forts, quelqu’un t’a vu ou entendu arrêter de respirer ou chercher ton air, mal de tête au réveil, cogner des clous dès que tu t’assois tranquille. Ça fait monter la pression et ça explique le besoin de caféine l’après-midi. Aucun supplément ne règle ça. Le dépistage se fait en une nuit chez toi avec un petit appareil; le traitement habituel est un appareil respiratoire dont on sent souvent l’effet dès la première semaine. Demande un test d’apnée du sommeil à domicile.']},
  pill:{g:'solid', t:['The pill and the gut','La pilule et l’intestin'],
    s:['The pill is absorbed through the gut, so a gut that empties too fast can let it through unused. The rule from the NHS: watery diarrhea for 24 hours or more counts as missed pills — keep taking it and use condoms until 7 days after it stops; vomiting within 3 hours of a pill means take another. Psyllium can bind medications taken at the same time, so keep it two hours away. None of this means stop the pill.',
       'La pilule est absorbée dans l’intestin, alors un intestin qui se vide trop vite peut la laisser passer sans qu’elle agisse. La règle du NHS : une diarrhée liquide qui dure 24 heures ou plus compte comme des pilules oubliées — continue de la prendre et utilise des condoms jusqu’à 7 jours après la fin de la diarrhée; si tu vomis dans les 3 heures après l’avoir prise, prends-en une autre. Le psyllium peut retenir les médicaments pris en même temps, alors garde deux heures d’écart. Rien de ça ne veut dire d’arrêter la pilule.']},
  lithium:{g:'solid', t:['Lithium, salt and caffeine','Lithium, sel et caféine'],
    s:['Your kidneys handle lithium the way they handle sodium. Lose salt or water — sweating, diarrhea, a low-salt kick — and lithium climbs toward toxic. Suddenly add a lot of salt and it drops, and the mood protection with it. The label says it plainly: keep a normal salt diet, stay hydrated, don’t restrict sodium. So nothing on this card changes your salt, and diarrhea on lithium is a same-day pharmacist call. Caffeine works the same way in reverse: it speeds lithium out, so cutting a lot of it suddenly can raise your level — in a small study, by about a quarter.',
       'Tes reins traitent le lithium comme le sodium. Perds du sel ou de l’eau — sueur, diarrhée, une passe sans sel — et le lithium grimpe vers la zone toxique. Ajoute beaucoup de sel d’un coup et il descend, et la protection de ton humeur avec. La monographie le dit clairement : garde une alimentation normale en sel, reste hydraté, ne coupe pas le sodium. Donc rien sur cette carte ne touche à ton sel, et une diarrhée sous lithium, c’est un appel au pharmacien le jour même. La caféine joue à l’inverse : elle fait sortir le lithium plus vite, alors en couper beaucoup d’un coup peut faire monter ton taux — d’environ un quart dans une petite étude.']},
  nicotine:{g:'likely', t:['Pouches, chew and the stomach','Sachets, chique et l’estomac'],
    s:['We’re not touching the nicotine this week. One thing though: nicotine that gets swallowed — pouch juice, chew spit, gum chewed too hard — lands in the stomach, and the gum label itself lists what that does: hiccups, heartburn, nausea, stomach upset. On an empty stomach with the morning coffee, that is a lot of “bad gut” that has nothing to do with food. Keep the pouch; put it in after you’ve eaten, and spit, don’t swallow.',
       'On ne touche pas à la nicotine cette semaine. Une chose, par contre : la nicotine avalée — le jus du sachet, la salive de chique, la gomme mâchée trop fort — descend dans l’estomac, et l’étiquette de la gomme elle-même dit ce que ça donne : hoquet, brûlures d’estomac, nausées, estomac dérangé. À jeun avec le café du matin, ça fait pas mal de « problèmes d’intestin » qui n’ont rien à voir avec la nourriture. Garde ton sachet; mets-le après avoir mangé, et crache, n’avale pas.']},
  sedative:{g:'solid', t:['Sleeping pills, anxiety pills and alcohol','Somnifères, anxiolytiques et alcool'],
    s:['Zopiclone (Imovane), zolpidem (Ambien) and the benzodiazepines — lorazepam (Ativan), alprazolam (Xanax), clonazepam, diazepam — press the same brake in the brain that alcohol presses. Two feet on one brake: breathing slows, and in the wrong combination it stops. The US regulator put its strongest warning on the benzodiazepines in 2020 and says it in plain words: do not drink alcohol with them. The Canadian zopiclone patient sheet says the same thing. The rule is about the same night, not the same life — a glass at supper and a pill at midnight is still the same night. If you can’t picture an evening without both, that sentence is the most useful thing you can bring a pharmacist.',
       'La zopiclone (Imovane), le zolpidem (Ambien) et les benzodiazépines — lorazépam (Ativan), alprazolam (Xanax), clonazépam, diazépam — appuient sur le même frein dans le cerveau que l’alcool. Deux pieds sur le même frein : la respiration ralentit, et dans la mauvaise combinaison, elle s’arrête. Le régulateur américain a mis son avertissement le plus fort sur les benzodiazépines en 2020 et le dit en mots simples : « ne buvez pas d’alcool avec ces médicaments ». La feuille d’information canadienne de la zopiclone dit la même chose. La règle, c’est la même soirée, pas la même vie — un verre au souper et une pilule à minuit, c’est encore la même soirée. Si tu n’arrives pas à imaginer une soirée sans les deux, cette phrase-là est la chose la plus utile que tu peux apporter à un pharmacien.']},
  sedhang:{g:'solid', t:['The morning after a sleeping pill','Le lendemain du somnifère'],
    s:['Zopiclone and the benzodiazepines don’t switch off when the alarm goes. In 2014 Health Canada cut the recommended starting dose of zopiclone in half because of next-day impairment — slower, foggier, worse behind the wheel — and said the impairment can be there even when you feel fully awake. Its letter says to wait at least 12 hours after a dose before driving. Count back from when you have to be on the road: that gap is a pharmacist conversation about dose and timing, not a reason to stop. Two things make the morning heavier: taking it late, and alcohol the same night. A foggy first three hours after a pill night isn’t a food problem and isn’t weakness. It’s the pill, still working.',
       'La zopiclone et les benzodiazépines ne s’éteignent pas quand le cadran sonne. En 2014, Santé Canada a coupé de moitié la dose de départ recommandée de zopiclone à cause des effets du lendemain — plus lent, plus brumeux, moins bon au volant — en précisant que l’effet peut être là même quand tu te sens parfaitement réveillé. Sa lettre dit d’attendre au moins 12 heures après une dose avant de conduire. Compte à rebours à partir de l’heure où tu dois prendre la route : cet écart-là, c’est une conversation avec le pharmacien sur la dose et l’heure, pas une raison d’arrêter. Deux choses alourdissent le matin : la prendre tard, et l’alcool la même soirée. Trois premières heures dans le brouillard après une soirée avec la pilule, ce n’est ni la bouffe ni un manque de volonté. C’est la pilule, qui agit encore.']},
  stimwear:{g:'solid', t:['When the stimulant leaves','Quand le stimulant lâche'],
    s:['Short-acting dextroamphetamine (Dexedrine tablets, Adderall) is dosed every 4 to 6 hours — that’s how long it holds. The Spansule capsule, about 8. Vyvanse, 13 to 14 in its trials. The crash lands when the level drops, and it drops onto whatever is underneath — which, because the pill killed your appetite at noon, is usually nothing. Two fixes, neither of them food alone: eat before the pill, so there’s a floor under you; and if the wall comes at the same hour every day, tell the prescriber that exact sentence — “it wears off at three” is the most useful thing they can hear. Timing, formulation or a booster is their call, not yours and not ours. Last dose at least six hours before bed, per the label. On days you tick the pill in your check-in, the app doesn’t hold a crash against a food — the wear-off looks exactly the same.',
       'La dextroamphétamine à courte durée d’action (comprimés Dexedrine, Adderall) se prend toutes les 4 à 6 heures — c’est le temps qu’elle tient. La capsule Spansule, environ 8. Le Vyvanse, 13 à 14 dans ses essais. Le crash arrive quand le taux descend, et il descend sur ce qu’il y a en dessous — et comme la pilule t’a coupé l’appétit à midi, c’est souvent rien. Deux solutions, et aucune n’est juste de la bouffe : manger avant la pilule, pour qu’il y ait un plancher sous toi; et si le mur arrive à la même heure chaque jour, dis cette phrase exacte au prescripteur — « ça lâche à 15 h », c’est la chose la plus utile qu’il puisse entendre. L’heure, la forme ou une dose d’appoint, c’est sa décision, pas la tienne ni la nôtre. Dernière dose au moins six heures avant le coucher, selon la monographie. Les jours où tu coches la pilule dans ton bilan, l’app ne met pas un crash sur le dos d’un aliment — impossible de le distinguer de la pilule qui lâche.']},
  cafclock:{g:'solid', t:['Caffeine’s clock','L’horloge de la caféine'],
    s:['Caffeine clears with a half-life of roughly five hours in most adults — anywhere from two to eight. A 2 p.m. can is half there at 7 and a quarter there at midnight. That is why it steals deep sleep hours after you stopped feeling it, and why tolerance doesn’t protect you: it hides the jitters, it doesn’t give the sleep back. The other side of the clock is the drop. Skip or delay your usual dose and the headache and fog that follow — lifting the moment you drink one — are withdrawal, the loudest fake “I need coffee” signal there is. Same total, earlier: last one eight hours before bed.',
       'La caféine s’élimine avec une demi-vie d’environ cinq heures chez la plupart des adultes — entre deux et huit selon la personne. Une canette à 14 h est encore là à moitié à 19 h et au quart à minuit. C’est pour ça qu’elle vole du sommeil profond des heures après que tu as cessé de la sentir, et pourquoi la tolérance ne te protège pas : elle cache les tremblements, elle ne redonne pas le sommeil. L’autre côté de l’horloge, c’est la chute. Saute ou retarde ta dose habituelle, et le mal de tête et le brouillard qui suivent — et qui partent dès que tu en bois un — c’est du sevrage, le plus gros faux signal « j’ai besoin de café » qui existe. Même total, plus tôt : le dernier huit heures avant le coucher.']},
  rectal:{g:'solid', t:['When bleeding needs a doctor','Quand un saignement demande un médecin'],
    s:['Most of the time, blood on the paper is a fissure or hemorrhoids, and the first treatment is soft stools that pass without straining. But an app can’t tell that from something more serious, and neither can you. The UK referral rule is blunt: 50 or over with rectal bleeding that has no obvious cause gets a specialist appointment within two weeks; under 50, the same when the bleeding comes with belly pain, a change in how you go, weight loss or low iron. Bowel cancer caught at that stage is usually curable; caught late it often isn’t. So: psyllium and the cream this week, and the appointment booked this week too, whether or not the bleeding stops. Say “rectal bleeding” at the front desk — it moves you up the list.',
       'La plupart du temps, du sang sur le papier, c’est une fissure ou des hémorroïdes, et le premier traitement, c’est des selles souples, qui sortent sans forcer. Mais une app ne peut pas faire la différence avec quelque chose de plus grave, et toi non plus. La règle britannique de référence est directe : 50 ans ou plus avec un saignement rectal sans cause évidente, c’est un rendez-vous en spécialité dans les deux semaines; sous 50 ans, pareil quand le saignement vient avec des douleurs au ventre, un changement dans ta façon d’aller à la selle, une perte de poids ou un manque de fer. Un cancer de l’intestin attrapé à ce stade-là se guérit généralement; attrapé tard, souvent pas. Alors : psyllium et crème cette semaine, et le rendez-vous pris cette semaine aussi, que le saignement arrête ou pas. Dis « saignement rectal » à l’accueil — ça te fait monter dans la liste.']},
  tank:{g:'likely', t:['The tank: where the numbers come from','Le réservoir : d’où viennent les chiffres'],
    s:['In plain words: the targets are what Health Canada says someone of your sex and age needs each day, the food numbers come from Health Canada’s food database, and the bars are a rough guide — empty, low, okay, full. The details: the targets are Health Canada’s Dietary Reference Intakes — the same tables dietitians use — by sex and age band, with the pregnancy or breastfeeding column when it applies, the smoker’s +35 mg of vitamin C, vitamin K, the vitamin A ceiling (3,000 mcg of the preformed kind — the liver kind), and the 2019 sodium and potassium values. Protein is the 0.8 g/kg reference floor; calories are a rough weight-times-work guess, not a DRI. The food values are Health Canada’s Canadian Nutrient File, pulled by food ID; the serving sizes are ours. Why bands instead of decimals: the file can’t see how much you absorbed (coffee with the meal, plant iron versus meat iron, a gut that empties too fast), a “medium potato” is a guess, and some numbers are borrowed: where the Canadian file has a blank, the app uses the USDA number for the same food or the closest one, and shows a ? where nothing is close. Empty, low, okay, full is as precise as this gets — and it’s precise enough to show a day that’s all fuel and no parts.',
       'En clair : les cibles, c’est ce que Santé Canada dit qu’il faut chaque jour à quelqu’un de ton sexe et de ton âge, les valeurs des aliments viennent de la base de données de Santé Canada, et les barres sont un guide approximatif — vide, bas, correct, plein. Le détail : les cibles sont les Apports nutritionnels de référence de Santé Canada — les mêmes tables que les diététistes utilisent — par sexe et tranche d’âge, avec la colonne grossesse ou allaitement quand elle s’applique, les +35 mg de vitamine C du fumeur, la vitamine K, le plafond de vitamine A (3 000 mcg de la forme préformée — celle du foie), et les valeurs 2019 de sodium et de potassium. Les protéines, c’est le plancher de référence de 0,8 g/kg; les calories, une estimation grossière poids × travail, pas un ANREF. Les valeurs des aliments viennent du Fichier canadien sur les éléments nutritifs de Santé Canada, tirées par numéro d’aliment; les portions sont les nôtres. Pourquoi des bandes plutôt que des décimales : le fichier ne voit pas ce que tu as absorbé (le café avec le repas, le fer végétal contre le fer de la viande, un intestin qui se vide trop vite), une « patate moyenne » est une estimation, et certains chiffres sont empruntés : quand le fichier canadien a un blanc, l’app prend le chiffre américain (USDA) du même aliment ou du plus proche, et affiche un ? quand rien n’est proche. Vide, bas, correct, plein, c’est aussi précis que ça peut l’être — et c’est assez précis pour montrer une journée qui est tout carburant et aucune pièce.']},
  drinks:{g:'solid', t:['Standard drinks','Consommations standard'],
    s:['A standard drink in Canada is 13.45 g of pure alcohol: a 341 ml bottle of 5% beer, a 142 ml (5 oz) glass of 12% wine, or a 43 ml (1.5 oz) shot of 40% spirits. Tallboys, big pours and strong beer count as more than one. Canada’s 2023 guidance puts the risk on a line: 2 or fewer a week is low risk, 3 to 6 is moderate (several cancers go up), 7 or more is increasingly high (heart disease and stroke), and each drink past that raises it further. On any one day, no more than 2. Pregnant, breastfeeding or under 18: none is safest. The app shows where you are on that line — it doesn’t tell you to stop.',
       'Une consommation standard au Canada, c’est 13,45 g d’alcool pur : une bouteille de bière de 341 ml à 5 %, un verre de vin de 142 ml (5 oz) à 12 %, ou un shooter de 43 ml (1,5 oz) à 40 %. Les grosses canettes, les verres généreux et la bière forte comptent pour plus d’une. Le repère canadien de 2023 place le risque sur une ligne : 2 ou moins par semaine, faible risque; 3 à 6, risque modéré (plusieurs cancers augmentent); 7 ou plus, risque de plus en plus élevé (maladies du cœur et AVC), et chaque verre de plus l’augmente encore. Dans une même journée, pas plus de 2. Enceinte, en allaitant ou avant 18 ans : le plus sûr, c’est zéro. L’app montre où tu te situes sur cette ligne — elle ne te dit pas d’arrêter.']},
  copper:{g:'solid', t:['Copper','Cuivre'],
    s:['Copper is the partner that moves iron out of storage and into blood, helps the cells make energy, and keeps nerves and connective tissue sound. You need about 0.9 mg a day. Liver, oysters, crab, lobster, cashews, dark chocolate and mushrooms carry the most — one serving of beef liver has about 14 mg, past the 10 mg daily ceiling, which is one more reason liver is a once-a-week food. Real deficiency is uncommon and usually comes from high-dose zinc pills taken for weeks, or weight-loss surgery; it looks like anemia that iron doesn’t fix, low white cells, and numb or unsteady feet.',
       'Le cuivre est le partenaire qui sort le fer des réserves pour l’amener dans le sang, aide les cellules à produire de l’énergie et garde les nerfs et les tissus conjonctifs solides. Il en faut environ 0,9 mg par jour. Le foie, les huîtres, le crabe, le homard, les noix de cajou, le chocolat noir et les champignons en ont le plus — une portion de foie de bœuf en contient environ 14 mg, au-delà du plafond de 10 mg par jour, une raison de plus pour garder le foie à une fois par semaine. Un vrai manque est rare et vient surtout du zinc à haute dose pris pendant des semaines, ou d’une chirurgie bariatrique; ça ressemble à une anémie que le fer ne règle pas, une baisse des globules blancs, et des pieds engourdis ou instables.']},
  lactose:{g:'solid', t:['Lactose','Lactose'],
    s:['The sugar in milk. Most adults make less of the enzyme that splits it, so undigested lactose ferments: gas, bloating, loose stools from 30 minutes to a few hours later. Most people who don’t digest it well still handle about 12 g at one time — roughly a cup of milk — with little trouble; it’s the second and third dose that tips it. Milk, ice cream, soft cheese and whey shakes carry the most (whey isolate far less than whey concentrate). Aged hard cheese and butter carry almost none — if those bother you too, look at histamine instead. Quick check: a lactase pill from any pharmacy before a dairy meal that usually bothers you. Values for a few dairy foods here are typical amounts, not from the Canadian file.',
       'Le sucre du lait. La plupart des adultes produisent moins de l’enzyme qui le coupe, alors le lactose non digéré fermente : gaz, ballonnements, selles molles de 30 minutes à quelques heures plus tard. La plupart des gens qui le digèrent mal tolèrent quand même environ 12 g d’un coup — à peu près une tasse de lait — sans grand problème; c’est la deuxième et la troisième dose qui font déborder la tasse. Le lait, la crème glacée, les fromages frais et les shakes au lactosérum en ont le plus (l’isolat de lactosérum beaucoup moins que le concentré). Les fromages vieillis à pâte dure et le beurre n’en ont presque pas — si ceux-là te dérangent aussi, regarde plutôt l’histamine. Vérification rapide : un comprimé de lactase de n’importe quelle pharmacie avant un repas laitier qui te dérange d’habitude. Pour quelques produits laitiers, les valeurs ici sont des quantités typiques, pas tirées du fichier canadien.']},
  gluten:{g:'solid', t:['Gluten','Gluten'],
    s:['The protein in wheat, barley and rye: bread, pasta, crackers, breading, most beer, regular soy sauce. For people with celiac disease it damages the gut lining and blocks iron and other nutrients — and celiac often shows up as tiredness and iron that won’t climb, not as gut trouble. One rule matters more than anything else here: don’t cut gluten to see what happens before you’ve had the celiac blood test (tTG-IgA). The test only works while you’re still eating it; cut it first and the result can come back falsely normal. The app counts servings so your days can be compared — it never suggests going gluten-free on your own.',
       'La protéine du blé, de l’orge et du seigle : pain, pâtes, craquelins, panure, la plupart des bières, la sauce soya ordinaire. Chez les gens qui ont la maladie cœliaque, il abîme la paroi de l’intestin et bloque le fer et d’autres nutriments — et la maladie cœliaque se montre souvent par de la fatigue et un fer qui ne remonte pas, pas par des problèmes de ventre. Une règle compte plus que tout ici : ne coupe pas le gluten pour voir avant d’avoir fait la prise de sang pour la maladie cœliaque (tTG-IgA). Le test fonctionne seulement si tu en manges encore; coupe-le avant, et le résultat peut revenir faussement normal. L’app compte les portions pour comparer tes journées — elle ne suggère jamais d’arrêter le gluten par toi-même.']},
  stores:{g:'solid', t:['What the body stores','Ce que le corps garde en réserve'],
