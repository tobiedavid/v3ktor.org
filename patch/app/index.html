  if(has('fuel','sugar')) P.swapShort.push(L('sugar — after a real meal, not instead of one','sucre — après un vrai repas, pas à la place'));
  if(has('fuel','smoke')) P.swapShort.push(L('nicotine — left alone this week','nicotine — on n’y touche pas cette semaine'));

  if(any('morning','nothing','coffee','carbs')) P.eat.push(has('meds','stim')
    ? L(`${T('protein','Eat before the pill.')} ${protShort()[0].replace(/^./,c=>c.toUpperCase())} at the same time you take the stimulant — after it kicks in, appetite is often gone for the day, and a 4 p.m. crash is likely.`, `${T('protein','Mange avant la pilule.','Mange avant la pilule.')} ${protShort()[1].replace(/^./,c=>c.toUpperCase())} au moment où tu prends le stimulant — une fois qu’il fait effet, l’appétit est souvent parti pour la journée, et un crash vers 16 h est probable.`)
    : L(`${T('protein','Something with protein in your first hours awake.')} ${protEx()[0]}. That alone moves the afternoon crash.`, `${T('protein','Des protéines dans tes premières heures debout.','Des protéines dans tes premières heures debout.')} ${protEx()[1]}. Juste ça, ça repousse le crash de l’après-midi.`));
  const noExtraSalt = kidney||bp||has('meds','lithium');
  const potatoes = noExtraSalt ? L('Potatoes','Des patates') : L('Potatoes with salt','Des patates salées');
  /* v1.2.46: the weight plan's clean start and road reach the Eat card */
  const wlC=wlClean(), wlM=wlMeatRoad(); const potatoes2 = wlM ? L('Frozen spinach','Des épinards congelés') : potatoes;
  if(SF.veg){
    if(cook==='no') P.eat.push(L(`No stove needed: boiled eggs, ${wlC?'mozzarella if you eat it':'Greek yogurt and cheese if you eat them'}, hummus, rinsed canned lentils or chickpeas, enriched soy milk, and a potato microwaved for five minutes${noExtraSalt?'':', with salt'}. Cheap, and it covers iron, potassium and magnesium — B12 needs the enriched milk or a pill.`, `Pas besoin de poêle : des œufs cuits durs, ${wlC?'de la mozzarella si tu en manges':'du yogourt grec et du fromage si tu en manges'}, du houmous, des lentilles ou des pois chiches en canne rincés, de la boisson de soya enrichie, et une patate cinq minutes au micro-ondes${noExtraSalt?'':', avec du sel'}. Pas cher, et ça couvre le fer, le potassium et le magnésium — la B12 demande la boisson enrichie ou une pilule.`));
    else P.eat.push(L(`${potatoes}, lentils, beans or tofu most days, ${wlC?'eggs or mozzarella':'eggs or dairy'} if you eat them, and enriched soy milk. Cheap, and it covers iron, potassium and magnesium — B12 needs the enriched milk or a pill. Something with vitamin C in the same meal helps the iron in.${kidney?' Potassium and salt amounts: your kidney team’s call.':''}`, `${potatoes}, des lentilles, des fèves ou du tofu la plupart des jours, ${wlC?'des œufs ou de la mozzarella':'des œufs ou des produits laitiers'} si tu en manges, et de la boisson de soya enrichie. Pas cher, et ça couvre le fer, le potassium et le magnésium — la B12 demande la boisson enrichie ou une pilule. Quelque chose avec de la vitamine C dans le même repas aide le fer à passer.${kidney?' Quantités de potassium et de sel : c’est ton néphrologue qui décide.':''}`));
  } else {
  if(cook==='no') P.eat.push(L(`No stove needed: rotisserie chicken${wlC?' (eat it the day you buy it)':''}, boiled eggs from the deli case, ${wlC?'mozzarella or cheese strings':'Greek yogurt tubs, cheese, canned sardines or salmon'}${wlM?'':`, and a potato poked with a fork and microwaved for five minutes${noExtraSalt?'':', with salt'}`}. Cheap, and it covers iron, potassium, B12 and magnesium.${kidney?' Potassium and salt amounts: your kidney team’s call.':''}`, `Pas besoin de poêle : un poulet rôti de l’épicerie${wlC?' (à manger le jour même)':''}, des œufs cuits durs déjà faits, ${wlC?'de la mozzarella ou des bâtonnets de fromage':'des pots de yogourt grec, du fromage, des sardines ou du saumon en canne'}${wlM?'':`, et une patate piquée à la fourchette, cinq minutes au micro-ondes${noExtraSalt?'':', avec du sel'}`}. Pas cher, et ça couvre le fer, le potassium, la B12 et le magnésium.${kidney?' Quantités de potassium et de sel : c’est ton néphrologue qui décide.':''}`));
  else P.eat.push(L(`${potatoes2}, ${wlC?'salmon from the freezer':'a tin of sardines or salmon'} a few times a week, beef when you can. Cheap, and it covers iron, potassium, B12 and magnesium.${kidney?' Potassium and salt amounts: your kidney team’s call.':''}`, `${potatoes2}, ${wlC?'du saumon congelé':'une canne de sardines ou de saumon'} quelques fois par semaine, du bœuf quand tu peux. Pas cher, et ça couvre le fer, le potassium, la B12 et le magnésium.${kidney?' Quantités de potassium et de sel : c’est ton néphrologue qui décide.':''}`));
  }
  if(cook!=='no' && !preg && !SF.veg) P.eat.push(L(`${T('liver','Liver once a week')} if you can stand it. If not, skip it — beef and ${wlC?'frozen fish':'tinned fish'} get there slower.`, `${T('liver','Du foie une fois par semaine','Du foie une fois par semaine')} si tu es capable. Sinon, laisse faire — le bœuf et le poisson ${wlC?'congelé':'en canne'} font le même travail, juste moins vite.`));

  /* ADD — ranked by priority, capped at the budget the person actually gave us; the rest is deferred, not hidden */
  const addItem=(k,label,why,cost)=>{P.add.push({k,label,why,cost});P.cost+=cost;};
  const needPsy = any('stool','loose','mixed','hard')||has('bleed','rectal');
  const needMag = (any('sleep','5','6','broken','7tired')||any('crash','pm','all')) && !kidney; /* v1.2.4: no longer triggered by stimulants or energy drinks — the 'drain' isn't supported (Astra) */
  const needCre = (any('crash','pm','all','am')||goalOn('muscle')) && !kidney && !preg && !SF.bf;
  const needSalt = has('fuel','energy') && saltOn; /* v0.7.3: an afternoon crash alone doesn't say you're losing salt; the energy-drink swap is the one place the card already pairs salted water */
  const cap = budget==='0'?0:(budget==='40'?40:15);
  if(minor){
    P.addNote = L('Nothing to buy. At your age, food and the ferritin test do the work — supplements only with a parent and a pharmacist.','Rien à acheter. À ton âge, la nourriture et le test de ferritine font le travail — des suppléments seulement avec un parent et un pharmacien.')
      + (SF.vegan ? L(' One exception: on a vegan diet B12 isn’t optional at any age — enriched soy milk every day, or a B12 pill with a parent and a pharmacist.',' Une exception : quand on est végane, la B12 n’est pas optionnelle, peu importe l’âge — de la boisson de soya enrichie chaque jour, ou un comprimé de B12 avec un parent et un pharmacien.') : '');
  } else {
    if(needSalt) addItem('salt',L('Salt','Sel'),L('A quarter teaspoon in water mid-afternoon. Free.','Un quart de cuillère à thé dans l’eau en milieu d’après-midi. Gratuit.')+`<span class="add-warn">${L('Not if you have high blood pressure, heart or kidney disease, take lithium, or were told to limit salt.','Pas si tu fais de l’hypertension, as un problème de cœur ou de reins, prends du lithium, ou si on t’a dit de limiter le sel.')}</span>`,0);
    const pharm = (preg||SF.bf) ? L(' Pharmacist’s yes first.',' Le feu vert du pharmacien d’abord.') : '';
    const wants=[];
    if(drinksDaily||DI.shaky||(DI.unknown&&any('keep','beer','wine','spirits'))) wants.push({k:'thiamine',cost:5,label:L('Thiamine (B1)','Thiamine (B1)'),why:(DI.shaky?L('You get shaky when you skip a drink. Thiamine protects against the nerve and brain damage heavy drinking can cause — and don’t stop suddenly on your own; a doctor or pharmacist can make that safe.','Tu trembles quand tu sautes un verre. La thiamine protège contre les dommages aux nerfs et au cerveau que l’alcool en grande quantité peut causer — et n’arrête pas d’un coup par toi-même; un médecin ou un pharmacien peut rendre ça sécuritaire.'):drinksDaily?L('You drink most days. Thiamine protects against the nerve and brain damage regular drinking can cause.','Tu bois la plupart des jours. La thiamine protège contre les dommages aux nerfs et au cerveau que l’alcool régulier peut causer.'):L('If you drink most days, thiamine protects against the nerve and brain damage regular drinking can cause.','Si tu bois la plupart des jours, la thiamine protège contre les dommages aux nerfs et au cerveau que l’alcool régulier peut causer.'))+pharm,
      dLabel:L('Thiamine (B1) — when you have $5','Thiamine (B1) — quand tu auras 5 $'),dWhy:L('Non-negotiable if you drink most days. Buy this one before anything else.','Non négociable si tu bois presque tous les jours. Achète celui-là avant tout le reste.')});
    if(SF.veg) wants.push({k:'b12',cost:8,label:L('Vitamin B12','Vitamine B12'),why:L('One a day at the label dose — the cheapest works. Vegan: not optional. Vegetarian: unless enriched milk, eggs and dairy cover it.','Une par jour à la dose de l’étiquette — la moins chère fait l’affaire. Végane : pas optionnel. Végétarien ou végétarienne : sauf si la boisson enrichie, les œufs et les produits laitiers la couvrent.')+pharm,
      dLabel:L('Vitamin B12 — when you have $8','Vitamine B12 — quand tu auras 8 $'),dWhy:L('If you eat no animal foods, this one before anything else on the list.','Si tu ne manges aucun aliment animal, celle-là avant tout le reste de la liste.')});
    if(needPsy) wants.push({k:'psyllium',cost:8,label:L('Psyllium husk, plain','Psyllium nature'),why:L((has('stool','hard')?'Label dose, 1–2 tsp, in a FULL glass of water, morning — and one more glass of water later in the day. Softens hard stools within a few days.':'Label dose, 1–2 tsp, in a FULL glass of water, morning. Firms loose stools in days and eases the burning.')+((has('fuel','coffee')||has('fuel','energy')||drinks)?' If coffee, energy drinks or beer are most of what you drink, add a glass of plain water with it — psyllium needs water in the gut to work.':''),(has('stool','hard')?'Dose de l’étiquette, 1–2 c. à thé, dans un GRAND verre d’eau, le matin — et un autre verre d’eau plus tard dans la journée. Ramollit les selles dures en quelques jours.':'Dose de l’étiquette, 1–2 c. à thé, dans un GRAND verre d’eau, le matin. Raffermit les selles en quelques jours et calme la brûlure.')+((has('fuel','coffee')||has('fuel','energy')||drinks)?' Si le café, les boissons énergisantes ou la bière sont presque tout ce que tu bois, ajoute un verre d’eau nature avec — le psyllium a besoin d’eau dans l’intestin pour agir.':''))+(pharm||((kidney||has('meds','thinner'))?L(' Pharmacist’s yes first — kidney disease or a blood thinner, and if you’re on a fluid limit, the full glass matters.',' Le feu vert du pharmacien d’abord — maladie des reins ou anticoagulant, et si tu as une limite de liquides, le grand verre compte.'):'')),
      dLabel:L('Psyllium — when you have $8','Psyllium — quand tu as 8 $'),dWhy:L('Plain tub, not flavoured.','Pot nature, pas aromatisé.')});
    if(needMag) wants.push({k:'magnesium',cost:10,label:L('Magnesium glycinate','Bisglycinate de magnésium'),why:L('Label dose, 200–350 mg, evening — 350 is the daily ceiling from pills. Better sleep on the hours you have.','Dose de l’étiquette, 200 à 350 mg, le soir — 350, c’est le plafond quotidien en pilules. Un meilleur sommeil sur les heures que tu as.')+pharm,
      dLabel:L('Magnesium glycinate — next week, $10','Bisglycinate de magnésium — la semaine prochaine, 10 $'),dWhy:L('After the ones above. Whether you sleep better is the test.','Après ceux plus haut. Fie-toi à ton sommeil.')});
    if(needCre) wants.push({k:'creatine',cost:12,label:L('Creatine monohydrate','Monohydrate de créatine'),why:goalOn('muscle')?L('The studied 3–5 g a day. With training it adds strength and muscle — vegetarians, who start lower, gain the most. Afternoons get lighter too.','La dose étudiée, 3 à 5 g par jour. Avec l’entraînement, ça ajoute de la force et du muscle — les végétariens, qui partent plus bas, en gagnent le plus. Les après-midis pèsent moins lourd aussi.'):L('The studied 3–5 g, in the morning coffee. Afternoons get lighter after a few weeks.','La dose étudiée (3 à 5 g), dans le café du matin. Les après-midis pèsent moins lourd après quelques semaines.'),
      dLabel:L('Creatine — next time you have $12','Créatine — la prochaine fois que tu auras 12 $'),dWhy:L('Worth it, but after the ones above.','Ça vaut la peine, mais après ceux plus haut.')});
    let deferred=0;
    for(const w of wants){
      if(P.cost+w.cost<=cap) addItem(w.k,w.label,w.why,w.cost);
      else if(cap>0 || deferred<2){ P.add.push({k:w.k,label:w.dLabel,why:w.dWhy,cost:0}); deferred++; }
    }
    P.deferred=deferred;
    if(!P.add.length) P.addNote = L('Nothing to add this week. Your answers don’t call for a supplement — the Eat and Swap cards are the whole patch.','Rien à ajouter cette semaine. Tes réponses ne demandent pas de supplément — les cartes Manger et Remplacer, c’est toute la patch.');
  }

  if(has('meds','stim')) P.timing.push(L(`Eat before the stimulant. If it’s Vyvanse, Adderall or Dexedrine: juice is fine, but ask your pharmacist before taking ${T('vitc','high-dose vitamin C pills')} on the same days.`, `Mange avant le stimulant. Si c’est Vyvanse, Adderall ou Dexedrine : le jus, c’est correct, mais demande au pharmacien avant de prendre des ${T('vitc','comprimés de vitamine C à haute dose','comprimés de vitamine C à haute dose')} les mêmes jours.`));
  if(needPsy&&(a.meds||[]).some(m=>m!=='none')) P.timing.push(L(`${T('psyllium','Psyllium')} two hours away from every medication — it binds them.`, `${T('psyllium','Le psyllium','Le psyllium')} à deux heures de chaque médicament — il nuit à leur absorption.`));
  if(has('meds','ppi')) P.timing.push(L(`${T('acidblocker','Acid blockers')} drain iron, B12 and magnesium over years. Don’t stop it; do get all three checked.`, `${T('acidblocker','Les bloqueurs d’acide','Les bloqueurs d’acide')} vident le fer, la B12 et le magnésium avec les années. N’arrête pas; fais vérifier les trois.`));
  if(has('meds','metformin')) P.timing.push(L(`Metformin lowers ${T('b12','B12')} over time. Add B12 to the blood test — and if your feet tingle, burn or go numb, say so even if the number comes back “normal”.`, `La metformine baisse la ${T('b12','B12','B12')} avec le temps. Ajoute la B12 à la prise de sang — et si tes pieds picotent, brûlent ou s’engourdissent, dis-le même si le chiffre revient « normal ».`));
  if(has('meds','antidep')) P.timing.push(L(`${T('antidep','Loose stools can be a side effect')} of the antidepressant. Not a reason to stop. A reason to mention it, with your ferritin number in hand. And if you’re having thoughts of ending your life, that’s 9-8-8 (Canada) or 988 (US), call or text, today — not a nutrition fix.`, `${T('antidep','Les selles molles peuvent être un effet secondaire','Les selles molles peuvent être un effet secondaire')} de l’antidépresseur. Ce n’est pas une raison d’arrêter — c’est une raison d’en parler au prescripteur, avec ton résultat de ferritine en main. Et si tu as des idées de mettre fin à tes jours, c’est le 9-8-8 (Canada) ou le 988 (É.-U.), appel ou texto, aujourd’hui — pas une question de nutrition.`));
  if(has('meds','thinner')) P.timing.push(L(`On a blood thinner: don’t change how many greens you eat, and ask the pharmacist before adding any supplement — psyllium included; two hours apart is the usual rule, but it’s their call.`, `Sous anticoagulant : ne change pas ta quantité de légumes verts, et demande au pharmacien avant d’ajouter un supplément — psyllium compris; deux heures d’écart est la règle habituelle, mais c’est à lui de trancher.`));
  if(has('meds','bc')) P.timing.push(L(`${T('pill','On the pill')}: watery diarrhea for 24 hours or more can stop it working — keep taking it, and use condoms until 7 days after the diarrhea ends. Throw up within 3 hours of taking it? Take another. Psyllium two hours away from it, like every pill.`, `${T('pill','Sous contraceptif oral','Sous contraceptif oral')} : une diarrhée liquide de 24 heures ou plus peut l’empêcher de faire effet — continue de la prendre, et utilise des condoms jusqu’à 7 jours après la fin de la diarrhée. Tu vomis dans les 3 heures après l’avoir prise? Prends-en une autre. Psyllium à deux heures d’écart, comme pour toute pilule.`));
  if(sedative) P.timing.push(L(`${T('sedhang','The morning after a sleeping pill')} lasts longer than it feels: for zopiclone, Health Canada says no driving for 12 hours after a dose. Count back from when you have to be on the road — that gap is the pharmacist conversation.${drinks?'':' And alcohol stays off pill nights; the two together can slow breathing to a stop.'}`, `${T('sedhang','Le lendemain du somnifère','Le lendemain du somnifère')} dure plus longtemps qu’il paraît : pour la zopiclone, Santé Canada dit pas de volant pendant 12 heures après une dose. Compte à rebours à partir de l’heure où tu dois prendre la route — cet écart-là, c’est la conversation à avoir avec le pharmacien.${drinks?'':' Et l’alcool reste hors des soirées avec pilule; les deux ensemble peuvent ralentir la respiration jusqu’à l’arrêt.'}`));
  if(has('meds','lithium')) P.timing.push(L(`${T('lithium','On lithium')}: don’t change your salt or water habits without your prescriber — lithium tracks sodium, and a big shift either way moves your level. Salt water is off your card. Diarrhea or heavy sweating on lithium is a call to the pharmacist the same day. Same for caffeine: cutting a lot of coffee or energy drinks at once can push your lithium level up — move it earlier rather than cut it, and tell your prescriber before a big change.`, `${T('lithium','Sous lithium','Sous lithium')} : ne change pas tes habitudes de sel ou d’eau sans ton prescripteur — le lithium suit le sodium, et un gros changement dans un sens ou l’autre fait bouger ton taux. On retire l’eau salée de ta carte. Diarrhée ou grosse sueur sous lithium, c’est un appel au pharmacien le jour même. Pareil pour la caféine : couper beaucoup de café ou de boissons énergisantes d’un coup peut faire monter ton lithium — déplace-la plus tôt plutôt que de la couper, et avise ton prescripteur avant un gros changement.`));

  if(has('bleed','rectal')) P.leak.push(L(`<b>Blood in the toilet is iron leaving.</b> Soft stools that pass without straining (${T('psyllium')}, with plenty of water) and ${T('barrier')} are the first fix — but an app can’t tell a fissure from something more serious, and neither can you. ${T('rectal','Over 50, or with belly pain, a change in how you go, weight loss or low iron')}: the appointment gets booked this week whether or not it stops. Under 50 with none of those: if it still bleeds after two weeks, it needs a look — not optional.`, `<b>Du sang dans la toilette, c’est du fer qui part.</b> Des selles souples, qui sortent sans forcer (${T('psyllium')}, avec beaucoup d’eau), et une ${T('barrier','crème barrière','crème barrière')}, c’est le premier geste — mais une app ne fait pas la différence entre une fissure et quelque chose de plus grave, et toi non plus. ${T('rectal','50 ans ou plus, ou avec des douleurs au ventre, un changement dans ta façon d’aller à la selle, une perte de poids ou un manque de fer','50 ans ou plus, ou avec des douleurs au ventre, un changement dans ta façon d’aller à la selle, une perte de poids ou un manque de fer')} : prends rendez-vous cette semaine, que ça arrête ou pas. Sous 50 ans sans rien de ça : si ça saigne encore après deux semaines, ça prend un examen — pas optionnel.`));
  if(has('bleed','periods')) P.leak.push(L(`<b>Heavy periods are the most common iron leak there is.</b> Ferritin is the number, and if it’s under 30 the tiredness has a cause with a name.`, `<b>Des règles abondantes, c’est la fuite de fer la plus fréquente qui existe.</b> C’est la ferritine qu’il faut vérifier : sous 30, ta fatigue a une cause identifiée, et elle se traite.`));
  if(any('stool','loose','mixed')) P.leak.push(L(`<b>Loose stools are minerals leaving</b> — magnesium and potassium out the back, iron never absorbed in the first place. ${(any('fuel','coffee','energy')||DI.daily)?`${[any('fuel','coffee','energy')?'Coffee and energy drinks speed up the gut':'',DI.daily?'alcohol most days irritates the gut lining':''].filter(Boolean).join(', and ')} — start there. ${T('bile','Bile acids')} and ${T('sweeteners')} come after.`:`${T('bile','Bile acids')} and ${T('sweeteners')} are the usual drivers.`} Psyllium plugs most of it.`, `<b>Des selles molles, ce sont des minéraux qui partent</b> — magnésium et potassium qui sortent, fer qui n’est jamais absorbé. ${(any('fuel','coffee','energy')||DI.daily)?`${[any('fuel','coffee','energy')?'Le café et les boissons énergisantes accélèrent l’intestin':'',DI.daily?'l’alcool presque tous les jours irrite la paroi de l’intestin':''].filter(Boolean).join(', et ')} — commence par là. Les ${T('bile','acides biliaires','acides biliaires')} et les ${T('sweeteners')} viennent après.`:`Les ${T('bile','acides biliaires','acides biliaires')} et les ${T('sweeteners')} sont les causes habituelles.`} Le psyllium colmate presque tout.`));
  /* v1.2.21: hard stools had no leak line at all; after a birth they're also one of the slow-thyroid signs (see 'pp') */
  if(has('stool','hard')){ const tshOn=has('sleep','7tired')||any('crash','all')||SF.pp;
    P.leak.push(L(`<b>Hard, infrequent stools:</b> water and fibre first — ${T('psyllium')} counts, beans and lentils count.${tshOn?(SF.pp?' After a birth, constipation with tiredness, weight gain or low mood is one of the slow-thyroid signs — that’s why '+T('tsh','TSH','TSH')+' is on your list.':' With tiredness that won’t lift, constipation is one of the slow-thyroid signs — that’s why '+T('tsh','TSH','TSH')+' is on your list.'):''}`,
      `<b>Selles dures, peu fréquentes :</b> de l’eau et des fibres d’abord — le ${T('psyllium')} compte, les fèves et les lentilles aussi.${tshOn?(SF.pp?' Après un accouchement, de la constipation avec de la fatigue, une prise de poids ou le moral bas, ça fait partie des signes d’une thyroïde au ralenti — c’est pour ça que la '+T('tsh','TSH','TSH')+' est sur ta liste.':' Avec une fatigue qui ne lâche pas, la constipation fait partie des signes d’une thyroïde au ralenti — c’est pour ça que la '+T('tsh','TSH','TSH')+' est sur ta liste.'):''}`)); }
  if(any('sleep','5','6','broken')) P.leak.push(L(`<b>We can’t give you more hours of sleep.</b> ${T('sleepq','Protect the ones you have')} — most of the ${T('sleepstages','deep, repairing sleep')} comes in the first half of the night: caffeine stops eight hours before bed, no alcohol inside three hours of it, magnesium, screen off. ${drinks?'Alcohol in the last three hours before bed is one reason six hours can feel like three.':''}`, `<b>On ne peut pas te donner plus d’heures de sommeil.</b> ${T('sleepq','Protège celles que tu as','Protège celles que tu as')} — la plus grande partie du ${T('sleepstages','sommeil profond, celui qui répare','sommeil profond, celui qui répare')}, arrive dans la première moitié de la nuit : caféine finie huit heures avant le coucher, pas d’alcool dans les trois heures avant, magnésium, écran fermé. ${drinks?'L’alcool dans les trois dernières heures avant le coucher, c’est une des raisons pour lesquelles six heures peuvent en paraître trois.':''}`));
  if(has('sleep','7tired')) P.leak.push(snore
    ? L(`<b>Seven hours and still tired, plus snoring: that’s a breathing problem first.</b> ${T('apnea','Sleep apnea')} is the first suspect, then ${T('iron')}, ${T('b12','B12')}, ${T('vitd','vitamin D')} and ${T('tsh','thyroid')}. Both tests are on your list.`, `<b>Sept heures et encore fatigué, plus du ronflement : c’est d’abord un problème de respiration.</b> L’${T('apnea','apnée du sommeil','apnée du sommeil')} est le premier suspect, puis le ${T('iron','fer','fer')}, la ${T('b12','B12','B12')}, la ${T('vitd','vitamine D','vitamine D')} et la ${T('tsh','thyroïde','thyroïde')}. Les deux tests sont sur ta liste.`)
    : L(`<b>Seven hours and still tired: the hours aren’t the first suspect.</b> Low ${T('iron')}, ${T('b12','B12')} or ${T('tsh','thyroid')} are common causes the blood test on your list can rule in or out. If it comes back normal, sleep quality, mood and medication are next.`, `<b>Sept heures et encore à plat : les heures ne sont pas le premier suspect.</b> Un manque de ${T('iron','fer','fer')}, de ${T('b12','B12','B12')} ou un problème de ${T('tsh','thyroïde','thyroïde')} sont des causes courantes que la prise de sang sur ta liste peut confirmer ou écarter. Si elle revient normale, la qualité du sommeil, le moral et les médicaments viennent ensuite.`));

  { const SF=SAFE(); if(SF.preg) ctx.push(L('pregnant','enceinte')); else if(SF.bf) ctx.push(L('breastfeeding','allaite')); if(SF.pp) ctx.push(L('had a baby in the last year','a accouché dans la dernière année')); if(SF.vegan) ctx.push(L('vegan diet','alimentation végane')); else if(SF.veg) ctx.push(L('vegetarian diet','alimentation végétarienne')); } if(has('safety','bp')) ctx.push(L('high blood pressure / heart disease','hypertension / maladie du cœur')); if(has('safety','kidney')) ctx.push(L('kidney disease','maladie des reins')); if(has('safety','minor')) ctx.push(L('under 18','moins de 18 ans'));
  { const DF={d3:['most days, 3 or more','la plupart des jours, 3 ou plus'],d12:['most days, 1 or 2','la plupart des jours, 1 ou 2'],wk:['a few days a week','quelques jours par semaine'],we:['weekends or less','les fins de semaine ou moins']}[any('fuel','beer','wine','spirits')?a.drinkfreq:null]; if(DF) ctx.push(L('alcohol: ','alcool : ')+P2(DF)); }
  const f=(a.fuel||[]).filter(x=>x!=='none'&&x!=='coffee'&&!(a.drinkfreq&&['beer','wine','spirits'].includes(x))); if(f.length) ctx.push(L('uses regularly (how often wasn’t asked): ','consomme régulièrement (la fréquence n’a pas été demandée) : ')+f.map(k=>P2(FUEL[k]).toLowerCase()).join(', '));
  const labs=[L('ferritin with CRP','ferritine avec CRP'), L('CBC','FSC (formule sanguine)')];
  if(any('meds','ppi','metformin')||any('crash','all')||has('sleep','7tired')||SAFE().veg||SAFE().pp) labs.push(L('vitamin B12','vitamine B12'));
  if(has('sleep','7tired')||any('crash','all')||SAFE().pp) labs.push('TSH');
  const other=[]; if(has('safety','snore')) other.push(L('a referral for a home sleep test','une référence pour un test de sommeil à la maison'));

    other.push(L('colon screening for the family history','un dépistage du côlon à cause des antécédents familiaux')); }
  return {sym:sym.length?sym:[L('none picked in the app — I’ll describe them','aucun choisi dans l’app — je vais les décrire')], meds:meds.length?meds:[L('none','aucun')], ctx, labs, other};
}
function handoverPlain(){ const h=handoverText(); return [L('SYMPTOMS: ','SYMPTÔMES : ')+h.sym.join('; '), L('MEDICATIONS: ','MÉDICAMENTS : ')+h.meds.join(', '), h.ctx.length?L('ALSO: ','AUSSI : ')+h.ctx.join('; '):null, L('REQUESTING BLOODWORK FOR: ','ANALYSES SANGUINES DEMANDÉES : ')+h.labs.join(', '), h.other.length?L('ALSO ASKING FOR: ','AUSSI DEMANDÉ : ')+h.other.join(', '):null].filter(Boolean).join('\n'); }
function patchText(){
  const P=buildPatch(); const strip=s=>s.replace(/<[^>]+>/g,'');
  let t=L('MY PATCH — one week','MA PATCH — une semaine')+'\n\n';
  if(P.stops.length) t+=L('FIRST','D’ABORD')+L(':\n',' :\n')+P.stops.map(s=>' ! '+strip(s)).join('\n')+'\n\n';
  t+=L('ONE THING THIS WEEK','UNE SEULE CHOSE CETTE SEMAINE')+L(': ',' : ')+strip(oneThing(P).t)+'\n\n';
  if(P.notes.length||P.always.length) t+=L('FOR ME','POUR MOI')+L(':\n',' :\n')+[...P.notes,...P.always].map(s=>' - '+strip(s)).join('\n')+'\n\n';
  { const ck=(S.checkins||[]).filter(c=>c.k); if(ck.length){ const nm=k=>k==='all'?L('energy overall','énergie en général'):plainName((P.add.find(x=>x.k===k)||{}).label||k); const vv={better:L('better','mieux'),same:L('same','pareil'),worse:L('worse','pire')}; t+=L('DAY-4 CHECK','VÉRIFICATION DU JOUR 4')+L(': ',' : ')+ck.map(c=>nm(c.k)+' — '+(vv[c.v]||c.v)).join('; ')+'\n\n'; } }
  t+=L('KEEP','GARDER')+L(': ',' : ')+P.keep.map(strip).join('; ')+'\n';
  if(P.swap.length) t+='\n'+L('SWAP','REMPLACER')+L(':\n',' :\n')+P.swap.map(s=>' - '+strip(s)).join('\n')+'\n';
  t+='\n'+L('EAT','MANGER')+L(':\n',' :\n')+P.eat.map(s=>' - '+strip(s)).join('\n')+'\n';
  t+='\n'+L('ADD','AJOUTER')+' ('+L('about $'+P.cost,'environ '+P.cost+' $')+' '+L('this week','cette semaine')+'):\n'+(P.add.length?P.add.map(x=>' - '+x.label+': '+strip(x.why.replace(/<span class="add-warn">/g,' — '))).join('\n'):' - '+P.addNote)+'\n';
  if(P.timing.length) t+='\n'+L('TIMING','HORAIRE')+L(':\n',' :\n')+P.timing.map(s=>' - '+strip(s)).join('\n')+'\n';
  t+='\n'+L('STOP THE LEAK','COLMATER LA FUITE')+L(':\n',' :\n')+P.leak.map(s=>' - '+strip(s)).join('\n')+'\n';
  t+='\n'+L('THE NUMBER TO GET','LE CHIFFRE À OBTENIR')+L(': ',' : ')+P.number.map(strip).join(', ')+'\n';
  t+='\n'+L('SHOW YOUR DOCTOR OR PHARMACIST','À MONTRER À TON MÉDECIN OU PHARMACIEN')+L(':\n',' :\n')+handoverPlain()+'\n';
  t+='\n'+L('Day 4: better / same / worse. Four weeks: do this again.','Jour 4 : mieux / pareil / pire. Quatre semaines : refais le test.')+'\n';
  return t;
}

      fp:['A sugar crash keeps a clock — one to three hours after the carb — and has a hunger edge. A histamine crash has a hot face and a headache instead.','Un crash de sucre a une horloge — une à trois heures après le féculent — et vient avec la faim. Un crash d’histamine donne plutôt le visage chaud et mal à la tête.']},
    hist:{t:['The histamine bucket','Le seau d’histamine'],
      why:()=>L(`${food('hist')?'Aged cheese, cured meat, canned fish, leftovers':(histOnDay()>=2&&!(wineProfile&&alc&&alc!=='0'))?'What you logged earlier that day':'Red wine'}${wineProfile&&alc&&alc!=='0'&&food('hist')?' plus the wine':''} — all of it pours into the same ${T('histamine')} bucket, and when it overflows you get ${feel('hist')?'exactly what you ticked — hot face, stuffy nose, itch or gut cramps —':'a headache, a hot face, a stuffy nose,'} and a flat crash one to four hours later that food doesn’t fix. The evidence here is “likely”, not proven — but it’s the pattern that fits ${feel('hist')?'best':food('hist')?'the food you named':'what you logged'}.${histOnDay()>=2?` That day’s food log has ${histOnDay()} high-histamine servings — the bucket fills across the whole day, not just the last four hours.`:''}`, `${food('hist')?'Fromage vieilli, charcuterie, poisson en canne, restants':(histOnDay()>=2&&!(wineProfile&&alc&&alc!=='0'))?'Ce que tu as noté plus tôt ce jour-là':'Le vin rouge'}${wineProfile&&alc&&alc!=='0'&&food('hist')?' plus le vin':''} — tout ça se verse dans le même seau d’${T('histamine')}, et quand il déborde tu as ${feel('hist')?'exactement ce que tu as coché — visage chaud, nez bouché, démangeaisons ou crampes —':'un mal de tête, le visage chaud, le nez bouché,'} et un crash à plat une à quatre heures plus tard que la bouffe ne règle pas. Les preuves ici sont « probables », pas établies — mais c’est l’explication qui colle ${feel('hist')?'le mieux':food('hist')?'à ce que tu as nommé':'à ce que tu as noté'}.${histOnDay()>=2?` Le journal de cette journée compte ${histOnDay()} portions riches en histamine — le seau se remplit toute la journée, pas seulement dans les quatre dernières heures.`:''}`),
      move:['Tomorrow: fresh over aged, cooked-today over leftovers, and one histamine food in the day, not three. Fresh meat, eggs, rice, potatoes are safe ground.','Demain : frais plutôt que vieilli, cuit aujourd’hui plutôt que restants, et un seul aliment riche en histamine dans la journée, pas trois. Viande fraîche, œufs, riz, patates, c’est du terrain sûr.'],
      test:['A week without the top three — aged cheese, cured meat, canned fish. Then add one back for a day and watch. It’s the only practical test for this one.','Une semaine sans les trois principaux — fromage vieilli, charcuterie, poisson en canne. Puis remets-en un pour une journée et observe. C’est le seul test qui existe pour celui-là.'],
      fp:['Histamine shows on the skin and in the nose before it shows in your energy. If the next crash has no hot face and no headache, it probably isn’t this.','L’histamine se montre sur la peau et dans le nez avant de se montrer dans ton énergie. Si le prochain crash n’a ni visage chaud ni mal de tête, ce n’est probablement pas ça.']},
    stim:{t:['The stimulant leaving','Le stimulant qui lâche'],
      why:()=>{
        if(stim==='skip') return L(`You skipped it or ran out. The crash is the missing dose — ${T('stimwear','the drop')}, plus everything the pill was holding up. That’s not food and it’s not willpower; it’s a prescriber or pharmacist conversation about the gap, especially if “ran out” happens more than once.`, `Tu l’as sauté ou tu n’en avais plus. Le crash, c’est la dose manquante — ${T('stimwear','la chute','la chute')}, plus tout ce que la pilule tenait debout. Ce n’est ni la bouffe ni la volonté; c’est une conversation à avoir avec le prescripteur ou le pharmacien à propos de ce manque, surtout si tu tombes à court plus d’une fois.`);
        if(stim==='more') return L(`More than usual, then a wall. ${T('stimwear','The higher the dose, the harder the drop')} — and a bigger dose erases appetite harder, so the wall lands on an emptier tank. Tell the prescriber the dose you actually took; they can’t fix a number they don’t have.`, `Plus que d’habitude, puis un mur. ${T('stimwear','Plus la dose est haute, plus la chute est dure','Plus la dose est haute, plus la chute est dure')} — et une plus grosse dose efface l’appétit plus fort, alors le mur tombe sur un réservoir plus vide. Dis au prescripteur la dose que tu as vraiment prise; il ne peut pas corriger un chiffre qu’il n’a pas.`);
        if(stim==='late') return L(`Taken late: today’s crash probably isn’t the pill, but tonight’s sleep is already shorter — ${T('stimwear','the label says six hours before bed')}, minimum. Expect tomorrow to be the real crash.`, `Pris tard : le crash d’aujourd’hui n’est probablement pas la pilule, mais le sommeil de ce soir est déjà plus court — ${T('stimwear','la monographie dit six heures avant le coucher','la monographie dit six heures avant le coucher')}, minimum. Attends-toi à ce que demain soit le vrai crash.`);
        return L(`Taken early, and the wall came ${when==='mid'?'four to seven hours later — the short-acting window':'eight hours or more later — the long-acting window'}. ${T('stimwear','That’s the pill leaving')}, and it left you on ${food('nothing')?'an empty stomach, because it killed your appetite first':'whatever was underneath'}. If the wall comes at the same hour every day, that sentence — “it wears off at three” — is the most useful thing a prescriber can hear.`, `Pris tôt, et le mur est arrivé ${when==='mid'?'quatre à sept heures plus tard — la fenêtre à courte durée d’action':'huit heures ou plus après — la fenêtre à longue durée d’action'}. ${T('stimwear','C’est la pilule qui lâche','C’est la pilule qui lâche')}, et elle t’a laissé sur ${food('nothing')?'un estomac vide, parce qu’elle avait coupé ton appétit avant':'ce qu’il y avait en dessous'}. Si le mur arrive à la même heure chaque jour, cette phrase-là — « ça lâche à 15 h » — est la chose la plus utile qu’un prescripteur puisse entendre.`);
      },
      move:[`Tomorrow: eat before the pill — ${protShort()[0]} at the same time you take it — so the drop has a floor. Note the hour the wall hits.`,`Demain : mange avant la pilule — ${protShort()[1]} au moment où tu la prends — pour que la chute ait un plancher. Note l’heure où le mur arrive.`],
      test:['Three days, write down the hour it hits. Same hour each day = the pill’s clock; bring that to the prescriber. Different hours = look at food and sleep.','Trois jours, note l’heure où ça frappe. Même heure chaque jour = l’horloge de la pilule; apporte ça au prescripteur. Heures différentes = regarde la bouffe et le sommeil.'],
      fp:['A wear-off crash is flat and irritable more than hungry, and it keeps time. A sugar crash is shaky and lifts with food.','Un crash de fin d’effet est à plat et irritable plus qu’affamé, et il est ponctuel. Un crash de sucre est tremblant et passe avec la bouffe.']},
    caf:{t:['Caffeine — too much, too late, or the drop','Caféine — trop, trop tard, ou la chute'],
      why:()=>{
        if(caf==='0') return L(`You run on ${has('fuel','energy')&&!has('fuel','coffee')?'energy drinks':'coffee'} most days and had none. ${feel('headache')?'The headache is the tell: ':''}${T('cafclock','that’s withdrawal')} — fog and a headache that lift the moment you drink one. It feels like “I need coffee” because, right now, your brain is wired to expect it. Not a food problem; a schedule problem.`, `Tu roules ${has('fuel','energy')&&!has('fuel','coffee')?'aux boissons énergisantes':'au café'} presque tous les jours et tu n’en as pas pris. ${feel('headache')?'Le mal de tête, c’est le signe : ':''}${T('cafclock','c’est du sevrage','c’est du sevrage')} — brouillard et mal de tête qui partent dès que tu en bois un. Ça ressemble à « j’ai besoin de café » parce que, en ce moment, ton cerveau est câblé pour l’attendre. Pas un problème de bouffe; un problème d’horaire.`);
        if(caf==='high') return L(`More than four coffees’ worth. ${T('cafclock','Tolerance hides the jitters, not the sleep debt')}: half of a 2 p.m. can is still in you at 7, a quarter at midnight, and that steals the deep sleep you crash from the next day. ${feel('racing')?'A racing heart on that much is the dose talking. ':''}${cafl==='eve'?'Last one late — tonight is already shorter.':''}`, `Plus que l’équivalent de quatre cafés. ${T('cafclock','La tolérance cache les tremblements, pas la dette de sommeil','La tolérance cache les tremblements, pas la dette de sommeil')} : la moitié d’une canette de 14 h est encore en toi à 19 h, le quart à minuit, et ça vole le sommeil profond qui te fait crasher le lendemain. ${feel('racing')?'Le cœur qui s’emballe avec autant, c’est la dose qui parle. ':''}${cafl==='eve'?'La dernière tard — ce soir est déjà plus court.':''}`);
        return L(`Last caffeine late in the day. ${T('cafclock','Half of it is still working five hours later')}; it isn’t today’s crash so much as tomorrow’s, already booked.`, `La dernière caféine tard dans la journée. ${T('cafclock','La moitié agit encore cinq heures plus tard','La moitié agit encore cinq heures plus tard')}; ce n’est pas tant le crash d’aujourd’hui que celui de demain, déjà réservé.`);
      },
      move:['Tomorrow: same total if you want it, all of it earlier. Last one eight hours before bed. Don’t cut — move.','Demain : même total si tu le veux, mais tout plus tôt. Le dernier huit heures avant le coucher. Ne coupe pas — décale.'],
      test:['Three days: move the last one two hours earlier, change nothing else. Judge it by the morning, not the afternoon.','Trois jours : avance le dernier de deux heures, ne change rien d’autre. Juge-le au matin, pas à l’après-midi.'],
      fp:['A caffeine drop is a headache behind the eyes with no hunger. Too much shows as a pounding heart and a bad night, not a daytime crash.','Une chute de caféine, c’est un mal de tête derrière les yeux sans faim. Trop de caféine se montre par un cœur qui cogne et une mauvaise nuit, pas par un crash de jour.']},
    alc:{t:['Last night’s drinks','Les verres d’hier soir'],
      why:()=>L(`${alc==='mid'?'Three to five':'A couple of'} drinks${alcl==='late'?', the last one within three hours of bed':alcl==='cont'?', and no real stop':''}. Alcohol near bed puts you under fast and then breaks the second half of the night into pieces — the sleep you got wasn’t the sleep you needed. ${feel('headache')?'The headache is dehydration and the drop, ':'The flat, foggy day is the bill, '}and it arrives whether or not you felt drunk.${wineProfile?' Red wine adds a '+T('histamine')+' load on top.':''}`, `${alc==='mid'?'Trois à cinq':'Un ou deux'} verres${alcl==='late'?', le dernier dans les trois heures avant le coucher':alcl==='cont'?', et pas de vrai arrêt':''}. L’alcool proche du lit t’assomme vite, puis casse la deuxième moitié de la nuit en morceaux — le sommeil que tu as eu n’était pas celui dont tu avais besoin. ${feel('headache')?'Le mal de tête, c’est la déshydratation et la chute, ':'La journée à plat, dans la brume, c’est la facture, '}et la facture rentre, que tu te sois senti chaud ou pas.${wineProfile?' Le vin rouge ajoute une dose d’'+T('histamine')+' par-dessus.':''}`),
      move:SF.noAlcoholTune?['Pregnant or under 18: there’s no amount of alcohol to fine-tune, so this isn’t a timing tweak. Talk it through with your doctor or the 811 nurse line.','Enceinte ou moins de 18 ans : il n’y a pas de quantité d’alcool à ajuster, alors ce n’est pas une question d’heure. Parles-en à ton médecin ou à la ligne 811.']:SF.shaky?['Tomorrow: don’t stop suddenly on your own — shaky or sweaty when you skip is withdrawal, and stopping cold can be dangerous. Same number if you need it, last one three hours before bed, and call your doctor or pharmacist this week.','Demain : n’arrête pas d’un coup par toi-même — trembler ou suer quand tu sautes un verre, c’est du sevrage, et arrêter net peut être dangereux. Le même nombre si tu en as besoin, le dernier trois heures avant le coucher, et appelle ton médecin ou ton pharmacien cette semaine.']:has('meds','sedative')?['Tomorrow: not on a pill night — that’s the red card, and it comes first. On a night without the pill, same number if you want it, last one three hours before bed, water beside it.','Demain : pas un soir de pilule — c’est l’encadré rouge, et il passe en premier. Un soir sans la pilule, le même nombre si tu le veux, le dernier trois heures avant le coucher, de l’eau à côté.']:['Tomorrow: same number if you want it, but the last one three hours before bed, with water beside it. The count matters less than the clock.','Demain : le même nombre si tu le veux, mais le dernier trois heures avant le coucher, avec de l’eau à côté. Le nombre compte moins que l’heure.'],
      test:SF.noAlcoholTune?['No home test for this one.','Pas de test à faire seul pour celle-là.']:has('meds','sedative')?['Three nights without the pill-and-drink overlap, last drink three hours before bed. If the mornings change, that points to it.','Trois soirs sans le chevauchement pilule-verre, dernier verre trois heures avant le coucher. Si les matins changent, ça pointe vers ça.']:['Three nights: same drinks, last one three hours earlier. If the mornings change, that points to it.','Trois soirs : mêmes verres, le dernier trois heures plus tôt. Si les matins changent, ça pointe vers ça.'],
      fp:['A drink crash is a morning that never quite starts and a 3 p.m. wall, with a dry mouth. It doesn’t lift with food.','Un crash d’alcool, c’est un matin qui ne démarre jamais vraiment et un mur à 15 h, avec la bouche sèche. Ça ne passe pas avec la bouffe.']},
    sedhang:{t:['The pill’s morning after','Le lendemain de la pilule'],
      why:()=>L(`A sleeping or anxiety pill, and the crash hit in your first hours up. ${T('sedhang','That’s the pill still working')} — Health Canada cut the zopiclone dose over exactly this, and says the fog can be there even when you feel awake.${alc&&alc!=='0'?' Alcohol the same night makes it heavier — and that combination is the red card above.':''} Not food. Not weakness. Dose and timing, which is a pharmacist conversation.`, `Un somnifère ou une pilule pour l’anxiété, et le crash a frappé dans tes premières heures debout. ${T('sedhang','C’est la pilule qui agit encore','C’est la pilule qui agit encore')} — Santé Canada a baissé la dose de zopiclone exactement pour ça, et dit que le brouillard peut être là même quand tu te sens réveillé.${alc&&alc!=='0'?' L’alcool la même soirée l’alourdit — et cette combinaison, c’est l’encadré rouge plus haut.':''} Pas la bouffe. Pas un manque de volonté. La dose et l’heure, et ça, c’est une conversation avec le pharmacien.`),
      move:['Tomorrow: nothing to change on your own. Write down what time you took it and what time you had to be up, and bring that gap to the pharmacist this week.','Demain : rien à changer de ton côté. Note l’heure où tu l’as prise et l’heure où tu devais être debout, et apporte cet écart au pharmacien cette semaine.'],
      test:['There isn’t a safe self-test for this one — don’t move the dose yourself. The pharmacist does the adjusting.','Il n’y a pas de test sécuritaire à faire seul ici — ne déplace pas la dose toi-même. C’est le pharmacien qui ajuste.'],
      fp:['A pill morning is heavy and slow from the first minute and lifts by late morning. If the crash starts later in the day, it isn’t this.','Un lendemain de pilule est lourd et lent dès la première minute et passe vers la fin de l’avant-midi. Si le crash commence plus tard dans la journée, ce n’est pas ça.']},
    sleep:{t:['A short night','Une nuit courte'],
      why:()=>L(`Four to six hours. Not the override — but it lowers the floor, so everything else on this list hits harder than it would have. ${T('sleepq','Protect the hours you have')}: caffeine done eight hours before bed, no drink inside three.`, `Quatre à six heures. Pas de quoi tout expliquer — mais ça baisse le plancher, alors tout le reste sur cette liste frappe plus fort qu’il l’aurait fait. ${T('sleepq','Protège les heures que tu as','Protège les heures que tu as')} : caféine finie huit heures avant le coucher, pas de verre dans les trois heures.`),
      move:['Tonight: the hours you have, protected — caffeine done eight hours before, no drink inside three, screen off. Same bedtime as last night; just cleaner.','Ce soir : les heures que tu as, protégées — caféine finie huit heures avant, pas de verre dans les trois heures, écran fermé. Même heure de coucher qu’hier; juste plus propre.'],
      test:['Three nights of the same hours, cleaner. If you wake up different on the same six hours, the hours weren’t the problem — what was in them was.','Trois nuits du même nombre d’heures, mais plus propres. Si tu te réveilles autrement après les mêmes six heures, le problème n’était pas la durée — c’était ce qu’il y avait dedans.'],
      fp:['Short-sleep crashes are heavy-lidded and come in waves, worst mid-afternoon. They don’t care what you ate.','Un crash de nuit courte a les paupières lourdes et vient par vagues, pire en milieu d’après-midi. Il se fiche de ce que tu as mangé.']},
    heat:{t:['Salt and water','Sel et eau'],
      why:()=>L(`Hot, sweating, not much water. Sweat is salt leaving, and ${feel('headache')?'the headache, ':''}${feel('racing')?'the racing heart, ':''}the flat drop are what low salt and low water feel like. ${noSaltC?'Water is the fix for you — salt is off your card for the reasons on your patch.':T('salt','A quarter teaspoon of salt in a big glass of water')+' fixes it in twenty minutes if this is it.'}`, `Chaud, en sueur, pas beaucoup d’eau. La sueur, c’est du sel qui part, et ${feel('headache')?'le mal de tête, ':''}${feel('racing')?'le cœur qui s’emballe, ':''}la chute à plat, c’est ça que ça fait de manquer de sel et d’eau. ${noSaltC?'Pour toi, la solution, c’est l’eau — le sel n’est pas sur ta carte, pour les raisons écrites sur ta patch.':T('salt','Un quart de cuillère à thé de sel dans un grand verre d’eau','Un quart de cuillère à thé de sel dans un grand verre d’eau')+' règle ça en vingt minutes si c’est ça.'}`),
      move:noSaltC?['Tomorrow, if it’s hot again: water on a schedule, not on thirst — a glass every hour you’re sweating.','Demain, s’il fait encore chaud : de l’eau à l’horaire, pas à la soif — un verre chaque heure où tu sues.']:['Tomorrow, if it’s hot again: a glass of salted water mid-shift, before the crash, not after.','Demain, s’il fait encore chaud : un verre d’eau salée au milieu du quart, avant le crash, pas après.'],
      test:['One hot day with the fix in place. If the crash doesn’t come, that’s a strong sign — try it twice before you trust it.','Une journée chaude avec la solution en place. Si le crash ne vient pas, c’est un bon signe — essaie deux fois avant de t’y fier.'],
      fp:['A salt-and-water crash comes with a headache, cramps or a pounding heart and lifts fast with the fix. A sugar crash lifts with food instead.','Un crash de sel et d’eau vient avec un mal de tête, des crampes ou un cœur qui cogne et passe vite avec la solution. Un crash de sucre passe plutôt avec la bouffe.']},
    day:{t:['The day itself','La journée elle-même'],
      why:()=>{
        const words=dayItems.map(k=>P2(dayWords[k])); const list=words.length>1?words.slice(0,-1).join(', ')+L(' and ',' et ')+words[words.length-1]:words[0];
        const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
        return L(`${cap(list)}. ${dayItems.length>=2?'A day that was different in '+dayItems.length+' ways at once — don’t rewrite your diet over it.':'That alone can explain a crash, and it has nothing to do with the plate.'}${diff('period')?' A period starting or due is also an iron day: if this crash comes back monthly, '+T('ferritin','ferritin')+' is the number.':''}${diff('sick')?' Coming down with something means today isn’t data.':''}${diff('newfood')?' A new food or drink: write down what it was. If it happens again with the same thing, that’s your answer — not today.':''}${diff('travel')?' Travel days are short sleep, bad food and no water in one package.':''}${diff('stress')?' Stress burns the same fuel a double shift does.':''}`, `${cap(list)}. ${dayItems.length>=2?'Une journée différente de '+dayItems.length+' façons en même temps — ne réécris pas ton alimentation pour ça.':'Ça seul peut expliquer un crash, et ça n’a rien à voir avec l’assiette.'}${diff('period')?' Des règles qui commencent ou qui s’en viennent, ça tire aussi sur les réserves de fer : si ce crash revient chaque mois, la '+T('ferritin','ferritine','ferritine')+', c’est le chiffre.':''}${diff('sick')?' Un début de maladie, ça veut dire qu’aujourd’hui n’est pas une donnée.':''}${diff('newfood')?' Un nouvel aliment ou une nouvelle boisson : écris ce que c’était. Si ça revient avec la même chose, c’est ta réponse — pas aujourd’hui.':''}${diff('travel')?' Les journées de route, c’est du sommeil court, de la mauvaise bouffe et pas d’eau dans un seul paquet.':''}${diff('stress')?' Le stress brûle le même carburant qu’un double.':''}`);
      },
      move:['Tomorrow: nothing to change — a different day explains itself. Watch the next ordinary day instead.','Demain : rien à changer — une journée différente s’explique toute seule. Regarde plutôt la prochaine journée ordinaire.'],
      test:['No test. The next crash on a normal day is the one worth reading.','Pas de test. Le prochain crash dans une journée normale, c’est celui qui vaut la peine d’être lu.'],
      fp:['If the crash only shows up on the odd days — the drive, the double, the fight — it’s the day. If it shows up on the ordinary ones too, it’s something on this list.','Si le crash arrive seulement les journées bizarres — la route, le double, la chicane — c’est la journée. S’il arrive aussi les journées ordinaires, c’est quelque chose sur cette liste.']},
    meal:{t:['The big-meal dip','Le creux du gros repas'],
      why:()=>L(`A big meal, then heavy eyelids: blood goes to the gut, and a big carb load on short sleep makes the dip deeper. Normal physiology, amplified.`, `Un gros repas, puis les paupières lourdes : le sang descend vers l’intestin, et une grosse charge de féculents sur peu de sommeil creuse le creux. De la physiologie normale, amplifiée.`),
      move:['Tomorrow: half the plate at lunch, protein first, ten minutes walking after. The other half later.','Demain : la moitié de l’assiette au dîner, les protéines d’abord, dix minutes de marche après. L’autre moitié plus tard.'],
      test:['Three lunches, half size. If the 2 p.m. dip shrinks, that points to it.','Trois dîners, demi-portion. Si le creux de 14 h rétrécit, ça pointe vers ça.'],
      fp:['A meal dip comes within two hours of eating and passes within one. It never comes with hunger.','Un creux de repas arrive dans les deux heures après avoir mangé et passe en une heure. Il ne vient jamais avec de la faim.']},
    sweet:{t:['Sweeteners in the gut','Les édulcorants dans l’intestin'],
      why:()=>L(`A sugar-free drink made with artificial sweetener, sugar-free gum or a protein bar: ${T('sweeteners','sugar alcohols')} (the -ol sweeteners) pull water into the gut and ferment — ${feel('hist')?'the cramps you ticked':'bloating and loose stools'} a few hours later, and a day that drags with them. Sucralose is a weaker suspect. Minor on its own; it stacks.`, `Une boisson sans sucre faite avec un édulcorant artificiel, de la gomme sans sucre ou une barre protéinée : ${T('sweeteners','les alcools de sucre','les alcools de sucre')} (les édulcorants en -ol) attirent l’eau dans l’intestin et fermentent — ${feel('hist')?'les crampes que tu as cochées':'ballonnements et selles molles'} quelques heures plus tard, et une journée qui traîne de la patte. Le sucralose est un suspect plus faible. Mineur tout seul; ça s’accumule.`),
      move:['Tomorrow: read the label on the sugar-free thing. One day without -ol sweeteners costs nothing; drop sucralose too if you want a clean test.','Demain : lis l’étiquette du produit sans sucre. Une journée sans édulcorants en -ol ni sucralose, ça ne coûte rien.'],
      test:['A week without them is the test — the gut usually answers faster than the energy does.','Une semaine sans eux, c’est le test — l’intestin répond souvent plus vite que l’énergie.'],
      fp:['Sweeteners show in the gut first — gas, cramps, loose stools. If the gut was fine, it wasn’t this.','Les édulcorants se montrent d’abord dans l’intestin — gaz, crampes, selles molles. Si l’intestin allait bien, ce n’était pas ça.']}
  };
}
function buildCrash(){
  const c=S.c; const sc={}; const add=(k,n)=>{sc[k]=(sc[k]||0)+n;};
  const feel=v=>hc('cfeel',v), food=v=>hc('cfood',v), diff=v=>hc('cdiff',v);
  const when=c.cwhen, sleep=c.cwhen==='night'?'none':c.csleep, caf=c.ccaf, cafl=c.ccafl, alc=c.calc, alcl=c.calcl, stim=c.cstim;
  const profile=Object.keys(S.a).length>0; const cafProfile=any('fuel','coffee','energy'); const wineProfile=has('fuel','wine'); const sedative=has('meds','sedative');
  const R={danger:false, hard:null, night:false, top:null, second:null, conf:'unclear', tie:false, combo:false, manyDiff:false, also:[], sc, profile, mech:MECH()};
  if(feel('danger')){ R.danger=true; return R; }

function confLabel(R){

function shakeSignal(){ const f=famById('shakes'); const today=dayKey(); for(let i=0;i<60;i++){ const k=keyAdd(today,-i); if(famExpo(f,k)===true&&gutAfter(k)===1) return true; }
  return (S.crashes||[]).some(x=>{ const c=x.answers&&x.answers.cfood; return Array.isArray(c)&&c.includes('sweetener'); }); }
function agedSignal(){ const today=dayKey(); const cu=famById('cured'); let n=0;
  for(let i=0;i<60;i++){ const k=keyAdd(today,-i); if(!(agedOn(k)||famExpo(cu,k)===true)) continue; if(crashFood(k)===true||outOn('hs',k)===true||gutAfter(k)===1) n++; }

/* ===================== v1.2.27: ONE PROFILE, THREE BUTTONS, MEALS WITH A TIME =====================
   Meals carry a time (S.tank.meals). S.tank.log[day] is rebuilt from them on every save, so the patterns, suspects, tests, crash
   reads and the tank read what they always read. Days logged before v1.2.27 became one meal with no time. Home: the week's one
   line, the test if one is running, the fuel gauge, then Crash report · Meal report · History. */
function migrateMeals(){ if(!S.tank) return; if(!Array.isArray(S.tank.meals)) S.tank.meals=[];
  if(!S.tank.mealsMig){ for(const [k,m] of Object.entries(tlog())){ if(m&&mapCount(m)) S.tank.meals.push({id:'d'+k.replace(/-/g,''), day:k, at:null, items:JSON.parse(JSON.stringify(m))}); } S.tank.mealsMig=true; } }
function meals(){ if(!S.tank.mealsMig||!Array.isArray(S.tank.meals)) migrateMeals(); return S.tank.meals; }
/* the day totals every other part of the app reads; days without a meal drop out */
function syncMeals(){ try{ if(!S.tank||!S.tank.mealsMig||!Array.isArray(S.tank.meals)) return; const by={};
  for(const m of S.tank.meals){ if(!m||!m.day||!m.items) continue; const t=by[m.day]||(by[m.day]={}); for(const [id,n] of Object.entries(m.items)){ if(!(n>0)) continue; t[id]=Math.round(((t[id]||0)+n)*100)/100; } }
  const lg=tlog(); for(const k of Object.keys(lg)) if(!by[k]||!mapCount(by[k])) delete lg[k]; for(const [k,t] of Object.entries(by)) if(mapCount(t)) lg[k]=t; }catch(e){} syncEv(); }
function pruneMeals(){ const cut=keyAdd(dayKey(),-365); S.tank.meals=meals().filter(m=>m&&m.day&&m.day>=cut&&m.items&&mapCount(m.items)>0); }
function curMeal(){ return (S.meal&&S.tank&&Array.isArray(S.tank.meals))?(S.tank.meals.find(m=>m&&m.id===S.meal)||null):null; }
migrateMeals(); pruneMeals(); syncMeals();
if(S.mode==='meal'&&!curMeal()) S.mode='home';
if(S.tank.view==='cal'||S.tank.view==='day') S.tank.view='today';
/* the clock: a meal's day is the app's day (it rolls over at S.tank.roll); before the rollover hour the clock is on the next calendar day */
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function atMs(day,at){ const [y,mo,d]=day.split('-').map(Number); const [h,mi]=String(at).split(':').map(Number); return new Date(y,mo-1,d+((h||0)<(S.tank.roll||0)?1:0),h||0,mi||0).getTime(); }
function dayMeals(k){ return meals().filter(m=>m.day===k&&(mapCount(m.items)>0||m.id===S.meal)).sort((a,b)=>(a.at?atMs(a.day,a.at):-1)-(b.at?atMs(b.day,b.at):-1)); }
function newMeal(k,from){ const today=dayKey(); const m={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), day:k||today, at:(!k||k===today)?nowHM():null, items:{}}; meals().push(m); S.meal=m.id; S.mealFrom=from||'home'; S.mode='meal'; foodQ=''; return m; }
function dropEmptyMeal(){ const m=curMeal(); if(m&&!mapCount(m.items)) S.tank.meals=S.tank.meals.filter(x=>x!==m); }
function mealNames(items,max){ const out=[];
  for(const [id,n] of Object.entries(items||{})){ if(!(n>0)) continue;
    if(String(id).startsWith('x_')){ const x=SUPN.find(z=>'x_'+z.k===id); if(x) out.push(P2(x.l).replace(/ —.*$/,'').replace(/ \(.*\)$/,'')); continue; }
    const f=TF.find(z=>z.id==id); if(f) out.push((n>1?fmt(n,1)+'× ':'')+P2(f.l)); }
  const k=max||3; return out.length>k?out.slice(0,k).join(', ')+L(` and ${out.length-k} more`,` et ${out.length-k} autres`):out.join(', '); }
function lastAteMin(){ const now=Date.now(); let best=null;
  for(const m of meals()){ if(!m.at||!mapCount(m.items)) continue; const t=atMs(m.day,m.at); if(t<=now+5*60000&&now-t<18*3600000&&(best==null||t>best)) best=t; }
  return best==null?null:Math.max(0,Math.round((Date.now()-best)/60000)); }
function agoText(min){ if(min<60) return L(`${min} min ago`,`il y a ${min} min`); const h=Math.floor(min/60), m=min%60; return m>=5?L(`${h} h ${m} min ago`,`il y a ${h} h ${String(m).padStart(2,'0')}`):L(`${h} h ago`,`il y a ${h} h`); }

function lowWeekNames(){ const ws=weekSrc(); if(!ws.days||(ws.nReal<3&&!mapCount(S.tank.day))) return null; const R=buildTank(ws);
  const lc=s=>s.toLowerCase().replace(/vitamin(e)? ([a-z])/g,(m,e,x)=>'vitamin'+(e||'')+' '+x.toUpperCase()).replace(/\bb(1|12)\b/g,'B$1');
  return R.low.slice(0,3).map(r=>lc(P2(r.l))); }

function foodPicker(map){ if(!TGRP.some(t=>t[0]===S.tank.grp)) S.tank.grp='fruit'; const grp=S.tank.grp;
  return `<div class="fsearch"><input type="search" id="foodQ" class="sel" placeholder="${L('Search — egg, beer, Monster…','Chercher — œuf, bière, Monster…')}" aria-label="${L('Search all foods','Chercher tous les aliments')}" value="${esc(foodQ)}" autocomplete="off"></div><div class="gtabs fgrp" ${foodQ.trim()?'hidden':''}>${TGRP.map(([g,l])=>`<button type="button" data-grp="${g}" aria-pressed="${grp===g}">${P2(l)}</button>`).join('')}</div>${grp==='sup'&&!foodQ.trim()?supSteppers(map):''}<div class="foods" id="foodList">${foodsHTML(map,grp)}</div>`; }
/* the fast path for the same breakfast every day: the last few different meals, and the foods logged most this month */
function recentMeals(exclude){ const seen=new Set(), out=[]; const ms=meals().filter(m=>m.id!==exclude&&mapCount(m.items)).sort((a,b)=>(b.day+(b.at||'')).localeCompare(a.day+(a.at||'')));
  for(const m of ms){ const key=JSON.stringify(Object.entries(m.items).sort()); if(seen.has(key)) continue; seen.add(key); out.push(m); if(out.length>=3) break; } return out; }
function usualFoods(exclude){ const cnt={}, cut=keyAdd(dayKey(),-30);
  for(const m of meals()){ if(m.day<cut||m.id===exclude) continue; for(const id of Object.keys(m.items)){ if(String(id).startsWith('x_')||!(m.items[id]>0)) continue; cnt[id]=(cnt[id]||0)+1; } }
  return Object.entries(cnt).filter(([,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([id])=>TF.find(f=>f.id==id)).filter(Boolean); }
function vMeal(){ const m=curMeal(); if(!m) return ''; const t=dayKey(), y=keyAdd(t,-1); const tt=tankTotals(m.items).tot; const n=mapCount(m.items);
  let h=`<div class="eyebrow">${L('Meal report','Noter un repas')}</div><div class="card mealhd"><div class="row" style="gap:8px"><div class="gtabs seg" role="tablist" style="margin:0"><button type="button" role="tab" data-mday="${t}" aria-pressed="${m.day===t}">${L('Today','Aujourd’hui')}</button><button type="button" role="tab" data-mday="${y}" aria-pressed="${m.day===y}">${L('Yesterday','Hier')}</button>${m.day!==t&&m.day!==y?`<button type="button" role="tab" aria-pressed="true">${dayLabel(m.day)}</button>`:''}</div><label class="small" for="mealAt">${L('at','à')}</label><input type="time" id="mealAt" class="sel tm" value="${m.at||''}"><button type="button" class="btn ghost sm" id="mealNow">${L('Now','Maintenant')}</button></div>`;

  h+=`<div class="card">${foodPicker(m.items)}</div>`;
  if(n) h+=`<div class="row" style="margin-top:4px"><button type="button" class="btn ghost sm" id="mealDel">${L('Delete this meal','Supprimer ce repas')}</button></div>`;
  return h; }
/* for "Ask an AI": the last three days of meals with their times, so the timing is there to read */
function mealsText(){ const today=dayKey(), lines=[];

    lines.push(`${k}${isClosed(k)?'':L(' (not marked complete)',' (pas marquée complète)')}${L(': ',' : ')}`+ms.map(m=>`${m.at||L('no time','sans heure')} ${mealNames(m.items,8)}`).join(' · ')); }

/* ---------- crash report: the 4 hours before, from meals with a time ---------- */
function crashMealPrefill(){ const k=S.c._day||dayKey(); delete S.c._preSure; if(S.c.cfood&&!S.c._pre) return;
  if(!S.c._at||!meals().some(m=>m.at&&(m.day===k||m.day===keyAdd(k,-1)))) return;
  const t=atMs(k,S.c._at), from=t-4*3600000;
  const inW=meals().filter(m=>m.at&&(m.day===k||m.day===keyAdd(k,-1))&&atMs(m.day,m.at)<=t&&atMs(m.day,m.at)>=from);
  const items={}; for(const m of inW) for(const [id,n] of Object.entries(m.items)) items[id]=(items[id]||0)+n;
  const cats=logCats(items); const big=Math.min(1000,tankReady()?0.4*tankTargets().kcal:1000);
  if(inW.some(m=>(tankTotals(m.items).tot.kcal||0)>=big)) cats.push('big');
  const sure=winMeals(from,t).sure;
  if(cats.length){ S.c.cfood=cats; S.c._pre='meal'; S.c._preSure=sure; }
  else if(!inW.length){ S.c.cfood=['nothing']; S.c._pre='meal'; S.c._preSure=sure; }
  else { delete S.c.cfood; delete S.c._pre; } }
/* asked only if the logs can't answer: sleep and caffeine from that day's check-in, food from meals in the 4 hours before */
function crashSkipped(){ if(!S.c||S.c._noskip) return []; const s=(S.c._preC||[]).filter(id=>S.c[id]!=null); if(S.c._pre==='meal'&&S.c._preSure&&S.c.cfood) s.push('cfood'); return s; }
const CQSHORT={csleep:['Sleep the night before','Sommeil la nuit d’avant'],ccaf:['Caffeine that day','Caféine ce jour-là'],ccafl:['Last caffeine','Dernière caféine'],cfood:['The 4 hours before','Les 4 heures avant']};
function crashPrefillNote(){ const sk=crashSkipped(); if(!sk.length) return '';
  const parts=sk.map(id=>{ const q=CQ.find(x=>x.id===id); if(!q) return ''; const v=S.c[id]; const lab=w=>{ const o=q.opts.find(o=>o.v===w); return o?P2(o.l):''; }; return `${P2(CQSHORT[id])}${L(': ',' : ')}${Array.isArray(v)?v.map(lab).join(', '):lab(v)}`; }).filter(Boolean);

  return `<p class="small muted" style="margin:14px 0 6px">${L('Warning signs — these go to a doctor, not into a test:','Signes d’alarme — ça va chez le médecin, pas dans un test :')}</p><div class="chips pickn">${ALARMK.map(v=>`<button type="button" class="chip alarm" data-symk="${v}" aria-pressed="${d.ks.includes(v)}"><span>${esc(cap1(P2(ALARML[v])))}</span></button>`).join('')}</div>${on.map(k=>`<div class="card flag" style="margin-top:8px"><p class="small" style="margin:0">${alarmText(k)}</p></div>`).join('')}`; }
function alarmCard(){ const ok=+S.alarmOk||0; const cut=keyAdd(dayKey(),-14);
  const list=evs().filter(e=>e&&isAlarm(e.k)&&e.day>=cut&&(+e.t||0)>ok).sort((a,b)=>(+b.t||0)-(+a.t||0)); if(!list.length) return ''; const e=list[0];

/* ---------- blood results: where the stores are, and whether they're holding from that point ---------- */
/* S.labs=[{id, day, fer, crp, hb, b12, d, inf, don}] — inf/don: an iron infusion or a blood donation since the test before.
   Ferritin: WHO 2020 (under 15 empty, under 70 low with inflammation, over 150/200 a question), UK 2021 (under 30 low), the
   fatigue trial (under 50). About 8–10 mg of stored iron per µg/L. Haemoglobin: WHO 2024 cut-offs. B12: NICE 2024
   (under 133 pmol/L confirmed, 133–258 possible). Vitamin D: IOM 2011 / Health Canada (under 30 low, 50+ enough, over 125 high).
   "On paper": the iron logged since the test against the EAR (most people's need) and the RDA (nearly everyone's) — the IOM's
   rule for one person's intake. Only a second test says what actually happened. */
const LABF=[['fer',['Ferritin','Ferritine'],'µg/L'],['crp',['CRP','CRP'],'mg/L'],['hb',['Hemoglobin','Hémoglobine'],'g/L'],['b12',['Vitamin B12','Vitamine B12'],'pmol/L'],['d',['Vitamin D (25-OH)','Vitamine D (25-OH)'],'nmol/L']];
const LABC=[['tsh',['TSH (thyroid)','TSH (thyroïde)'],[['ok',['in range','dans les normes']],['off',['flagged (H or L)','signalée (H ou L)']]]],['cel',['Celiac test (tTG-IgA)','Test cœliaque (tTG-IgA)'],[['neg',['negative','négatif']],['pos',['positive','positif']]]]];
const LABH={fer:['iron stores','réserves de fer'],crp:['inflammation','inflammation'],hb:['on the CBC (blood count)','sur la FSC (formule sanguine)']};
const LABN={fer:['ferritin','ferritine'],crp:['CRP','CRP'],hb:['hemoglobin','hémoglobine'],b12:['B12','B12'],d:['vitamin D','vitamine D']};
function labs(){ if(!Array.isArray(S.labs)) S.labs=[]; return S.labs; }
function labsSorted(){ return labs().filter(x=>x&&x.day).slice().sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:0); }
function lastWith(k){ const A=labsSorted().filter(x=>x[k]!=null); return A.length?A[A.length-1]:null; }
function labDate(k){ const [y,m,d]=String(k).split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(S.lang==='fr'?'fr-CA':'en-CA',{month:'short',day:'numeric',year:'numeric'}); }
function inflamed(x){ return !!(x&&x.crp!=null&&x.crp>5); }
function premeno(){ const p=S.tank.p||{}; return p.sex==='f'&&(p.age==='a1'||p.age==='a2'||p.age==='minor'); }
function ferHi(){ return premeno()&&!tankLife().preg?150:200; }
function hbCut(){ const p=S.tank.p||{}; if(tankLife().preg) return 110; return p.sex==='m'?130:120; }
function ironNeed(){ const p=S.tank.p||{}, life=tankLife(); const rda=tankTargets().fe; let ear;
  if(life.preg) ear=22; else if(life.bf) ear=6.5; else if(p.sex==='m') ear=6; else if(p.sex==='f') ear=(p.age==='a3'||p.age==='a4')?5:8.1; else ear=(p.age==='a3'||p.age==='a4')?6:8.1;
  if(life.veg&&!life.preg) ear=Math.round(ear*18)/10; return {ear, rda}; }
function b12Need(){ const life=tankLife(); return {ear:life.preg?2.2:life.bf?2.4:2.0, rda:tankTargets().b12}; }
/* average daily intake of one nutrient on the days after `from` (to `to`, or today), the last 90 days at most:
   days logged in full count as logged, other days as the normal day; at least 7 such days or nothing */
function paperAvg(key,from,to){ const today=dayKey(); const end=to&&to<today?to:today; let k=keyAdd(from,1); const cut=keyAdd(today,-89); if(k<cut) k=cut;
  let n=0,nReal=0,nAss=0,sum=0;
  for(let i=0; k<=end&&i<400; k=keyAdd(k,1),i++){ let m=tlog()[k]; if(m&&mapCount(m)&&isClosed(k)) nReal++; else if(mapCount(S.tank.day)){ m=S.tank.day; nAss++; } else continue; n++; sum+=tankTotals(m).tot[key]||0; }
  return n>=7?{avg:sum/n,n,nReal,nAss}:null; }
function ferRead(x){ const F=x.fer; const hi=ferHi();
  if(inflamed(x)) return F<70?{band:'low', t:L('low — your CRP is over 5, a sign of inflammation, and then under 70 counts as low (WHO)','basse — ta CRP est au-dessus de 5, un signe d’inflammation, et là, sous 70 compte comme bas (OMS)')}:{band:'unclear', t:L('can’t be read right now: CRP is up, and that pushes ferritin up. Retest once you’re well','pas lisible pour l’instant : la CRP est élevée, et ça gonfle la ferritine. Refais le test quand tu vas bien')};
  if(F<15) return {band:'empty', t:L('empty — iron deficiency by every guideline','vide — un manque de fer selon tous les guides')};
  if(F<30) return {band:'low', t:L('low — under 30 is low by the UK guideline','basse — sous 30, c’est bas selon le guide britannique')};
  if(F<50) return {band:'lownormal', t:L('low-normal — the trial that eased tiredness treated people under 50','normale-basse — l’essai qui a soulagé la fatigue traitait les gens sous 50')};
  if(F<=hi) return {band:'ok', t:L('in range — above 50, more iron hasn’t shown a benefit','dans la zone — au-dessus de 50, plus de fer n’a pas montré d’avantage')};
  return {band:'high', t:L(`high — over ${hi} is a question in itself: inflammation, liver, or the iron-overload gene. Don’t push it higher; ask about it`,`élevée — au-dessus de ${hi}, c’est une question en soi : inflammation, foie ou gène de la surcharge en fer. Ne la fais pas monter davantage; parles-en à ton médecin`)}; }
function r10(v){ return Math.round(v/10)*10; }
function storesText(x){ return L(`About ${fmt(r10(x.fer*8),0)}–${fmt(r10(x.fer*10),0)} mg of iron in storage (8 to 10 mg per point).`,`Environ ${fmt(r10(x.fer*8),0)} à ${fmt(r10(x.fer*10),0)} mg de fer en réserve (8 à 10 mg par point).`); }
function paperVerdict(a,need){ return a<need.ear?L('below what most people need — on paper, the stores are being drawn down','sous ce dont la plupart des gens ont besoin — sur papier, tu puises dans tes réserves'):a<need.rda?L('enough for many people, not for all — the next test decides','assez pour bien des gens, pas pour tous — le prochain test va trancher'):L('enough to hold the stores for almost everyone','assez pour maintenir les réserves de presque tout le monde'); }
function paperShort(a,need){ return a<need.ear?L('drawing down on paper','en baisse sur papier'):a<need.rda?L('the next test decides','le prochain test va trancher'):L('holding on paper','stable sur papier'); }
function paperN(pp){ const a=pp.nReal, b=pp.nAss;
  return a&&b?L(`${a} day${a===1?'':'s'} in full, ${b} counted as your normal day`,`${a} jour${a>1?'s':''} au complet, ${b} compté${b>1?'s':''} comme ta journée normale`)
    :a?L(`${a} complete day${a===1?'':'s'}`,`${a} jour${a>1?'s':''} au complet`)
    :L(`your normal day, counted for ${b} day${b===1?'':'s'}`,`ta journée normale, comptée pour ${b} jour${b>1?'s':''}`); }
function paperText(pp,need){ return L(`<b>Since that test, on paper:</b> about ${fmt(pp.avg,1)} mg of iron a day in what you logged (${paperN(pp)}), against a need of ${fmt(need.ear,1)} to ${fmt(need.rda,0)} mg — ${paperVerdict(pp.avg,need)}. Paper can’t see what you absorb, or what leaves (periods, blood loss); the next test can.`,
  `<b>Depuis ce test, sur papier :</b> environ ${fmt(pp.avg,1)} mg de fer par jour dans ce que tu as noté (${paperN(pp)}), pour un besoin de ${fmt(need.ear,1)} à ${fmt(need.rda,0)} mg — ${paperVerdict(pp.avg,need)}. Le papier ne voit pas ce que tu absorbes, ni ce qui sort (règles, pertes de sang); le prochain test, oui.`); }
function ferTrend(){ const F=labsSorted().filter(x=>x.fer!=null); if(F.length<2) return null; const b=F[F.length-1], a=F[F.length-2];
  const rd=Math.round((new Date(b.day)-new Date(a.day))/86400000), days=Math.max(1,rd); const res={a,b,days,rd,mo:days/30.44}; if(rd<28){ res.kind='close'; return res; }
  if(b.inf||b.don){ res.kind='event'; return res; } if(inflamed(a)||inflamed(b)){ res.kind='inflamed'; return res; }
  const d=b.fer-a.fer; res.per=d/res.mo; res.kind=Math.abs(d)<=Math.max(5,0.1*a.fer)?'hold':d<0?'fall':'rise'; if(a.inf) res.afterInf=true;
  res.paper=paperAvg('fe',a.day,b.day); return res; }
function trendText(tr){ const rd=tr.rd!=null?tr.rd:tr.days, w=Math.max(1,Math.round(rd/7));
  const span=rd<=0?L('on the same day','le même jour'):rd<14?L(`in ${rd} day${rd===1?'':'s'}`,`en ${rd} jour${rd>1?'s':''}`):rd<60?L(`in ${w} week${w===1?'':'s'}`,`en ${w} semaine${w>1?'s':''}`):L(`in ${Math.round(tr.mo)} months`,`en ${Math.round(tr.mo)} mois`);
  const head=L(`<b>Measured:</b> ferritin ${fmt(tr.a.fer,0)} → ${fmt(tr.b.fer,0)} ${span}`,`<b>Mesuré :</b> ferritine ${fmt(tr.a.fer,0)} → ${fmt(tr.b.fer,0)} ${span}`);
  if(tr.kind==='close') return head+L(' — under 4 weeks apart, too close to read: ferritin moves slowly, and it varies a little from one draw to the next.',' — moins de 4 semaines d’écart, trop rapproché pour lire : la ferritine bouge lentement, et elle varie un peu d’une prise à l’autre.');
  if(tr.kind==='event') return head+L(' — an iron infusion or a blood donation in between, so the change isn’t a read on food.',' — une perfusion de fer ou un don de sang entre les deux, alors le changement ne dit rien sur la nourriture.');
  if(tr.kind==='inflamed') return head+L(' — CRP was up on one of the two draws, so the change can’t be read.',' — la CRP était élevée sur une des deux prises, alors le changement n’est pas lisible.');
  if(tr.kind==='hold') return head+L(' — holding.',' — stable.');
  const per=Math.abs(tr.per), p1=Math.max(1,Math.round(per)), lo=Math.max(5,Math.round(per*8/5)*5), hi=Math.max(5,Math.round(per*10/5)*5);
  if(tr.kind==='rise') return head+L(` — rising about ${p1} a month. The stores are filling.`,` — en hausse d’environ ${p1} par mois. Les réserves se remplissent.`);
  let t=head+L(` — falling about ${p1} a month, roughly ${lo} to ${hi} mg of iron a month out of the stores.`,` — en baisse d’environ ${p1} par mois, à peu près ${lo} à ${hi} mg de fer par mois qui sortent des réserves.`);
  if(tr.afterInf) return t+' '+L('The first draw came after an iron infusion, and ferritin reads high for weeks after one — so part of this drop is the number settling. If it keeps falling between the next two tests, that part is loss.','La première prise suivait une perfusion de fer, et la ferritine sort trop haute pendant des semaines après — alors une partie de la baisse, c’est le chiffre qui se replace. Si ça continue de baisser entre les deux prochains tests, cette partie-là, c’est une perte.');
  const pp=tr.paper, need=ironNeed();
  if(pp&&pp.avg>=need.rda) t+=' '+L('<b>Food can’t explain this drop:</b> what you logged covers your need, so iron is leaving faster than food replaces it — periods, blood loss you can’t see, or poor absorption. Bring both numbers to your doctor.','<b>La nourriture n’explique pas cette baisse :</b> ce que tu as noté couvre ton besoin, alors le fer sort plus vite que la nourriture le remplace — règles, pertes de sang invisibles ou mauvaise absorption. Apporte les deux chiffres à ton médecin.');
  else if(pp&&pp.avg<need.ear) t+=' '+L('The log fits the drop: less iron going in than most people need.','Le journal concorde avec la baisse : moins de fer qui entre que ce dont la plupart des gens ont besoin.');
  return t; }
function hbText(h,x){ const c=hbCut(); const p=S.tank.p||{}, life=tankLife(); const low=h.hb<c; const other=(p.sex!=='m'&&p.sex!=='f'&&!life.preg)?L(' (130 for men)',' (130 pour les hommes)'):'';
  let t=L(`<b>Hemoglobin ${fmt(h.hb,0)}</b> (${esc(labDate(h.day))}): `,`<b>Hémoglobine ${fmt(h.hb,0)}</b> (${esc(labDate(h.day))}) : `)+(low?L(`anemia — under the WHO cut-off of ${c}${other}.`,`de l’anémie — sous le seuil de l’OMS de ${c}${other}.`):L(`no anemia — the WHO cut-off is ${c}${other}.`,`pas d’anémie — le seuil de l’OMS est ${c}${other}.`));
  if(life.preg) t+=' '+L('(In the second trimester the cut-off is 105.)','(Au deuxième trimestre, le seuil est 105.)');
