<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threshold Log</title>
<meta name="description" content="See what you had eaten before the negative effects you reported. Free and private: everything stays on your phone.">
<meta name="theme-color" content="#c8481f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* The look is the Food Trial Log's: its colours, type, cards, buttons, chips, sheets and bars, copied from its stylesheet. */
:root{--bg:#f7f4ee;--card:#fff;--ink:#1c1b19;--muted:#6b665d;--line:#e6e0d4;--accent:#c8481f;--teal:#0f6b6b;--teal-soft:#e3f0ef;--warn:#b3261e;--warn-soft:#fbe9e7;--chip:#f1ede4;--chip-on:#1c1b19;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px -10px rgba(0,0,0,.15);
  /* the ring's slices: a fixed order, checked for colour-blind separation on this card colour. Grey is "kind not listed". */
  --s-fat:#2a78d6;--s-prot:#eb6834;--s-cplx:#1baf7a;--s-lact:#eda100;--s-sugo:#e87ba4;--s-fib:#008300;--s-alc:#6250d6;--s-unk:#9a968c;
  /* the Effects bar, the Effect button and the dot beside an effect */
  --fx3:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--card:#1e2026;--ink:#ececea;--muted:#a19d95;--line:#2d3038;--accent:#e3633a;--teal:#5fb3b3;--teal-soft:#1c2c2c;--warn:#ff7b6e;--warn-soft:#3a1f1c;--chip:#2a2d35;--chip-on:#ececea;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px -10px rgba(0,0,0,.6);
  --s-fat:#3987e5;--s-prot:#d95926;--s-cplx:#199e70;--s-lact:#c98500;--s-sugo:#d55181;--s-fib:#0ca30c;--s-alc:#9085e9;--s-unk:#7d7a73;
  --fx3:#c8331a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
.wrap{max-width:600px;margin:0 auto;padding:14px 18px 24px}
h1,h2,h3{font-family:ui-serif,Georgia,'Times New Roman',serif;line-height:1.15;margin:0 0 .4em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700;margin-top:0}
p{margin:.35em 0 .8em}
.muted{color:var(--muted)} .small{font-size:.9rem}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:0.875rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
.card.soft{background:var(--teal-soft);border-color:transparent}
.card.gate{border:2px solid var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:.92rem;border-radius:11px;min-height:44px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px}
.topbar .sp{flex:1}
.tb{border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer;padding:8px 10px;border-radius:10px;font-weight:700;min-height:44px;min-width:44px}
.tb:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#menuBtn{font-size:1.25rem;line-height:1}
.tb.ttl{font-family:ui-serif,Georgia,'Times New Roman',serif;font-weight:800;font-size:1.1rem;padding:6px 4px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tb.gls{font-size:0.875rem;border:1px solid var(--line);white-space:nowrap;flex:none}
.menu{display:grid;gap:6px;margin-top:6px}
.menu button,.menu a{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:48px}
.menu .danger{color:var(--warn)}
html.locked,html.locked body{overflow:hidden}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:0.875rem;font-weight:700;padding:6px 14px;cursor:pointer;min-height:44px;min-width:44px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:grid;gap:10px;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;font-size:1.02rem;line-height:1.3;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--bg);border-color:var(--chip-on)}
.chips.two{grid-template-columns:1fr 1fr}
.chips.pickn .chip,.chips.pick1 .chip{display:flex;align-items:flex-start;gap:12px}
.chips.pickn .chip::before,.chips.pick1 .chip::before{content:"";flex:0 0 22px;width:22px;height:22px;margin-top:-1px;box-sizing:border-box;border:2px solid var(--muted);background:var(--card)}
.chips.pickn .chip::before{border-radius:6px}
.chips.pick1 .chip::before{border-radius:50%}
.chips.pickn .chip[aria-pressed="true"]::before{content:"✓";border-color:var(--bg);background:var(--bg);color:var(--chip-on);font-size:15px;font-weight:800;line-height:18px;text-align:center}
.chips.pick1 .chip[aria-pressed="true"]::before{content:"";border-color:var(--bg);background:radial-gradient(circle,var(--bg) 0 5px,transparent 6px)}
.chip:focus-visible,.btn:focus-visible,.lnk:focus-visible,.gtabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"] .muted{color:inherit;opacity:.8}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.bar.hidden{display:none}
#bar .in .btn{white-space:nowrap;flex:none}
#bar .in > span.small{flex:1;min-width:0;text-align:center;line-height:1.2;overflow-wrap:break-word}
ul{padding-left:1.1em;margin:.3em 0 .6em} li{margin:.3em 0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .22s,visibility 0s linear .22s;z-index:50;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .22s,visibility 0s}
.sheet.full{top:0;max-height:none;border-radius:0;padding-top:calc(18px + env(safe-area-inset-top))}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:1.25rem}
.sheet a:not(.btn),.wrap p a{color:var(--teal);text-underline-offset:3px}
textarea.out{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100vw - 24px)}
.toast.show{opacity:1}
.toast.live{pointer-events:auto}.toast .undo{background:none;border:0;color:inherit;font:inherit;font-weight:800;text-decoration:underline;padding:12px 10px;margin:-12px -8px -12px 0;min-width:44px;min-height:44px;cursor:pointer}
[hidden]{display:none!important}
.chip.ack,.chip.ack[aria-pressed="true"]{width:100%;font-size:0.875rem;line-height:1.35;padding:10px 14px;cursor:default;background:transparent;color:var(--muted);border-color:var(--line);box-shadow:none;margin:12px 0 10px}
.tagline{font-size:1.2rem;font-weight:700;line-height:1.3;margin:6px 0 10px}
.st{display:grid;grid-template-columns:1fr 44px auto 44px;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px;background:var(--card)}
.st.on{border-color:var(--teal);background:var(--teal-soft)}
.st .nm{font-size:.9rem;font-weight:600;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.st .nm small{display:block;font-weight:400;color:var(--muted);font-size:0.875rem}
.st .val{min-width:34px;text-align:center;font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums}
.stp{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-size:1.4rem;font-weight:800;line-height:1;cursor:pointer;padding:0}
.stp.plus{background:var(--ink);color:var(--bg)}
.stp[disabled]{opacity:.3;cursor:default}
.stp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.steps{display:grid;gap:8px}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.gtabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:0.875rem;font-weight:600;cursor:pointer;min-height:44px}
.gtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gtabs.seg{margin:6px 0 10px}
.toptabs{margin:0 0 12px;flex-wrap:nowrap}.toptabs button{flex:1 1 auto;white-space:nowrap;padding:6px 10px}
#savebar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--warn);color:#fff;padding:10px 14px;font-size:.88rem}
.fsearch{margin:8px 0 6px} .fsearch input{width:100%;box-sizing:border-box;padding:10px 12px;font-size:1rem;min-height:44px}
.sel{font:inherit;font-size:.9rem;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.sel.wide{width:100%;margin:8px 0;min-height:44px;box-sizing:border-box}
input.sel.tm{width:auto;min-width:112px;min-height:44px;padding:6px 10px}
@supports (-webkit-touch-callout:none){input,select,textarea,.sel{font-size:max(16px,1em)!important}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.on,.sheet-bg,.toast{transition:none}}
.mainbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 8px}
.mb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:88px;padding:10px 6px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:1.05rem;line-height:1.15;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
.mb .mi{font-size:1.5rem;line-height:1}
.mb.meal{border-top:4px solid var(--teal)} .mb.fx{border-top:4px solid var(--fx3)}
.mb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ul.tl{list-style:none;margin:4px 0 6px;padding:0} ul.tl li{border-bottom:1px solid var(--line);margin:0} ul.tl li:last-child{border-bottom:0}
.tlr{display:grid;grid-template-columns:3.4em 1fr;gap:8px;align-items:start;width:100%;min-height:48px;padding:10px 0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.95rem;text-align:left;cursor:pointer;line-height:1.3}
.tlr .tt{font-variant-numeric:tabular-nums;color:var(--muted);padding-top:1px} .tlr .tx small{display:block;color:var(--muted);font-size:.85rem}
.tlr .fxm{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--fx3);margin-right:6px}
ul.evs{list-style:none;padding:0;margin:.4em 0}ul.evs li{padding:7px 0;border-bottom:1px solid var(--line)}ul.evs li:last-child{border-bottom:0}
ul.evs li::after{content:"";display:block;clear:both}
.evc{float:right;display:inline-flex;gap:10px}
.lnk{background:none;border:0;padding:4px 0;font:inherit;font-size:.9rem;font-weight:700;color:var(--teal);cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:44px}
details.note{border-top:1px solid var(--line)}
details.note>summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:700}
details.note>summary::-webkit-details-marker{display:none}
details.note>summary::after{content:'+';margin-left:auto;color:var(--muted);font-weight:700;font-size:1.2rem;padding-left:10px}
details.note[open]>summary::after{content:'–'}
html.noinst .inst,html.noinst #installPill,html.locked #installPill{display:none!important}
@media (prefers-color-scheme:dark){.btn.primary{color:#1a0c06}}
@media (max-width:380px){.tb.ttl{font-size:1rem} .topbar .in{gap:4px;padding:8px 10px} .tb.gls{padding:6px 8px;font-size:.8125rem} .lang button{padding:6px 10px}}
@media (max-width:340px){.topbar .in{gap:2px;padding:8px 6px} .tb.ttl{font-size:.9rem;padding:6px 2px} .tb.ttl .t2{display:none} .tb{padding:8px 6px} .bar{padding-left:10px;padding-right:10px} #bar .in{gap:6px} #bar .in .btn{padding:9px 10px}}

/* ---- Threshold Log's own pieces ---- */
.lnk.none{display:block;margin:0 auto 10px;text-align:center}
.lnk.none[aria-pressed="true"]{color:var(--ink);text-decoration:none}
/* the ring, under Nutrition */
.ring{position:relative;width:148px;height:148px;margin:0 auto}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:20}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px;line-height:1.15;border:0;background:none;color:inherit;font:inherit;cursor:pointer;border-radius:50%}
.ring .mid b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.ring .mid small{font-size:.72rem;color:var(--muted)}
.ring .mid:focus-visible,.keyrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* the key carries the amounts, so the ring never has to be read by colour alone */
.key{display:grid;grid-template-columns:1fr;gap:0 18px;margin:12px 0 0;padding:0;list-style:none}
@media (min-width:560px){.key{grid-template-columns:1fr 1fr}}
.key li{display:flex;align-items:baseline;gap:6px;margin:0;font-size:.9rem;min-width:0}
.key .sw{flex:none;width:10px;height:10px;border-radius:2px;align-self:center}
.key .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key .am{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.keyrow{display:flex;align-items:baseline;gap:6px;width:100%;border:0;background:none;color:inherit;font:inherit;font-size:.9rem;text-align:left;padding:5px 0;cursor:pointer;min-height:32px}
@media (max-width:360px){.ring{width:132px;height:132px}}
/* the two readings of the Threshold tab: their labels may take two lines on a narrow phone or in a wide font */
.modes button{flex:1 1 0;min-width:0;white-space:normal;line-height:1.15}
/* the coverage list: the person's amount beside Health Canada's reference. No colours, no judgement. */
table.cov{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0}
table.cov th,table.cov td{padding:6px 0 6px 10px;border-bottom:1px solid var(--line);text-align:right;font-weight:400;font-variant-numeric:tabular-nums}
table.cov th:first-child{padding-left:0}
table.cov th[scope=row]{text-align:left;font-weight:600}
table.cov thead th{font-size:.8rem;color:var(--muted);font-weight:700}
table.cov tr:last-child th,table.cov tr:last-child td{border-bottom:0}
.rd{margin:10px 0 0;padding:0;list-style:none} .rd li{margin:0;padding:8px 0;border-top:1px solid var(--line)}
.rd .q{font-weight:700} .rd .ln{display:grid;grid-template-columns:5.6em 1fr;gap:6px;font-size:.92rem;margin-top:2px} .rd .ln span:first-child{color:var(--muted)}
.fxt{display:inline;border:0;background:none;color:inherit;font:inherit;padding:6px 0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;min-height:32px}
.mine{font-size:.82rem;color:var(--muted);text-align:center;margin:10px 0 0}
.instbig>button{display:block;width:100%;box-sizing:border-box;min-height:64px;padding:14px 18px;font:inherit;font-size:1.12rem;font-weight:800;letter-spacing:.02em;border:2px solid currentColor;border-radius:14px;background:transparent;color:inherit;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body:has(.bar:not(.hidden)) #installPill,body:has(.instbig) #installPill{display:none}
#installPill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:6px;align-items:center;width:max-content;max-width:calc(100vw - 24px);box-sizing:border-box;background:var(--ink);color:var(--bg);border-radius:22px;padding:6px 6px 6px 16px;box-shadow:0 6px 20px -8px rgba(0,0,0,.45);font-weight:600;font-size:.94rem;line-height:1.25}
#installPill button{border:0;font:inherit;cursor:pointer;min-height:42px;flex:none} #installPill .ipy{background:var(--accent);color:#fff;border-radius:999px;padding:9px 16px} #installPill .ipn{background:transparent;color:inherit;padding:8px 10px}
@media (prefers-color-scheme:dark){#installPill .ipy{color:#1a0c06}}
ol.inst{margin:4px 0 14px;padding-left:1.4em} ol.inst li{margin:0 0 9px} .ico{display:inline-block;vertical-align:-4px}
.fxt[aria-pressed="true"]{font-weight:700;text-decoration-style:solid}
/* a food from its label */
.lbg{display:grid;gap:8px;margin:8px 0} .lbg.two{grid-template-columns:1fr 1fr}
.lbf{display:block;font-size:.85rem;color:var(--muted)} .lbf input{display:block;width:100%;min-height:44px;margin-top:2px}
@media (max-width:420px){.tb.gls .lg{display:none}}
/* the effect sheet: two columns, so the list, the time and Done fit on one screen; Done stays in reach while the list scrolls */
.chips.fx{grid-template-columns:1fr 1fr;gap:8px;margin:8px 0} .chips.fx .chip{padding:10px;font-size:.95rem;gap:8px;min-width:0;overflow-wrap:anywhere} .chips.fx .chip .sub{display:block;font-size:.8rem;color:var(--muted)} .chips.fx .chip[aria-pressed="true"] .sub{color:inherit;opacity:.8}
.stick{position:sticky;bottom:0;z-index:1;background:var(--card);padding:10px 0 4px;margin-top:8px}
/* the data view: plain numbers in two columns, no colour */
/* the slider for the hours after a meal: a full-width row 44px high with a 28px thumb, so it is easy to hold. Its eight stops are numbered under it:
   the row of numbers is inset by half a thumb less half a number, so each number sits under the thumb's centre at that stop. */
.twin{margin:0 0 12px} .twin label{display:block;margin:0 0 2px}
.twin input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:44px;margin:0;padding:0;background:transparent;border-radius:12px;cursor:pointer;touch-action:pan-y}
.twin input[type=range]:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.twin input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--muted)}
.twin input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--muted)}
.twin input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ink)}
.twin input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ink)}
.twin .ends{display:flex;justify-content:space-between;padding:0 6px;margin-top:0;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.twin .ends span{width:16px;text-align:center}
table.rws{margin:10px 0 14px;table-layout:fixed} table.rws td b{display:block;font-variant-numeric:tabular-nums} table.rws td small{display:block;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
/* the Threshold tab's two buttons: what is filtered, and how it is read */
ul.drows{list-style:none;margin:0 0 6px;padding:0} .drow{padding:8px 0 10px;border-bottom:1px solid var(--line)} ul.drows li:last-child{border-bottom:0}
.dgh{font-size:.9rem;font-weight:700;color:var(--muted);margin:16px 0 0;padding-top:12px;border-top:2px solid var(--line)} .dwrap{position:relative;padding-top:1.35rem} .dwrap.ex{padding-top:0}
svg.dots{display:block;width:100%;height:auto;overflow:visible} .dots .l1{fill:var(--chip)} .dots .l2{fill:none;stroke:var(--line)}
.dh{fill:var(--ink);fill-opacity:.82} .dr{fill:none;stroke:var(--muted);stroke-width:1.1} .dots .dm{stroke:var(--ink);stroke-width:1.6}
.dmk{position:absolute;top:0;font-size:.78rem;font-weight:700;white-space:nowrap;line-height:1.3rem} .dax{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dtx{margin:4px 0 0} .dkey{display:flex;flex-wrap:wrap;gap:2px 16px;margin:0 0 6px} .dkey svg{width:.8em;height:.8em;margin-right:5px;vertical-align:-.02em}
.thrbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.tbb{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:56px;min-width:0;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;font:inherit;text-align:left;cursor:pointer}
.tbb small{font-size:.78rem;color:var(--muted)} .tbb b{font-size:.95rem;line-height:1.2;overflow-wrap:anywhere}
.tbb:focus-visible{outline:3px solid var(--accent);outline-offset:2px} table.rws th:first-child{width:42%;overflow-wrap:anywhere}
.rowb{display:inline;border:0;background:none;color:inherit;font:inherit;font-weight:600;text-align:left;padding:6px 0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;min-height:32px}
.rowb[aria-pressed="true"]{text-decoration-style:solid}
.und{text-decoration:underline dotted;text-underline-offset:3px}
.menu .cmore{display:flex;justify-content:space-between;align-items:center;gap:8px} .cmore .muted{font-weight:400}
.fxpick{margin:0 0 10px}
</style>

/* ===================== ENGINE: the reading rules. No screen code in here, so each rule can be tested on its own. =====================
   A reading is a count of what the person reported, set beside an amount. The app reports; it never interprets.
   Entries (S.ev):  {k:'meal', t, items:[{key,q}]}   {k:'fx', t, c}   {k:'none', t, d}   (t = milliseconds, d = a day key) */
const TLE=(function(){
const H=36e5, WIN=4*H, STEPS=8, UNK_MAX=2, ZEPS=0.005;
/* after a meal, the person sets how many hours count: one of these, 4 unless they move it */
const WINS=[1,2,3,4,5,6,7,8];
const p2=n=>(n<10?'0':'')+n;
/* a day starts at the person's own hour (the Food Trial Log's setting), so a 1 a.m. snack belongs to the evening before */
function dayKey(t,roll){ const d=new Date(t); if(d.getHours()<(roll||0)) d.setDate(d.getDate()-1); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function keyAdd(k,n){ const [y,m,d]=k.split('-').map(Number); const t=new Date(y,m-1,d+n); return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate()); }
function dayStart(k,roll){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d,roll||0).getTime(); }
/* poor sleep is reported the morning after, and belongs to the night before */
function fxDay(e,roll){ const k=dayKey(e.t,roll); return e.c==='sleep'?keyAdd(k,-1):k; }

/* ---------- what one food holds, times the portions eaten ----------
   Simple carbs are the sugars; lactose is one of them. Complex carbs are the rest of the carbohydrate, less the fibre.
   A food whose sugars Health Canada doesn't list keeps its carbs as "kind not listed": nothing is guessed. */
/* what a food carries beyond the ring (the table's last column): caffeine, theobromine and nitrate in mg; the rest in portions, where no figure is entered */
const COMPS=['caf','theo','nit','tyr','ox','ga','cap','fru','gos','sorb','mann','fruc','sulph','nitr','swt','flav','glu','pur'];
const ZERO=()=>{ const a={kcal:0,fat:0,prot:0,cplx:0,sug:0,sugo:0,lact:0,fib:0,unk:0,alc:0,hist:0,histN:0,histUnk:0,noNum:0,mic:null,x:null}; for(const k of COMPS) a[k]=0; return a; };
function amounts(f,q){ const a=ZERO(); if(!f||f.none){ a.noNum=q; return a; }
  const avail=Math.max(0,f.carb-f.fib);
  if(f.sug!=null){ const st=Math.min(f.sug,avail), la=Math.min(f.lact||0,st); a.sug=st*q; a.lact=la*q; a.sugo=(st-la)*q; a.cplx=(avail-st)*q; }
  else { const la=Math.min(f.lact||0,avail); a.lact=la*q; a.unk=(avail-la)*q; }
  a.kcal=f.kcal*q; a.fat=f.fat*q; a.prot=f.prot*q; a.fib=f.fib*q; a.alc=(f.alc||0)*q;
  if(f.h){ a.histN=q; if(f.hist!=null) a.hist=f.hist*q; else a.histUnk=q; }
  if(f.m) a.mic=f.m.map(v=>v*q);
  if(f.c) for(const k in f.c) a[k]=f.c[k]*q;
  if(f.x&&f.x.length){ a.x={}; for(const k of f.x) a.x[k]=q; }      /* values the table has no figure for (a pill whose strength varies by brand): portions, by value */
  return a; }
function addInto(a,b){ for(const k in b){ if(k==='mic'){ if(b.mic){ if(!a.mic) a.mic=b.mic.map(()=>0); for(let i=0;i<b.mic.length;i++) a.mic[i]+=b.mic[i]; } }
    else if(k==='x'){ if(b.x){ if(!a.x) a.x={}; for(const j in b.x) a.x[j]=(a.x[j]||0)+b.x[j]; } } else a[k]+=b[k]; } return a; }
function mealAmounts(m,food){ const a=ZERO(); for(const it of m.items) addInto(a,amounts(food(it.key),it.q)); return a; }

/* ---------- the days, read from the entries ---------- */
function index(S,food,now){ const roll=S.roll||0, D={}, day=k=>D[k]||(D[k]={k,meals:[],fx:[],rep:[],none:false,tot:ZERO()});
  const ev=S.ev.slice().sort((a,b)=>a.t-b.t);
  for(const e of ev){
    if(e.k==='meal'){ const d=day(dayKey(e.t,roll)); const am=mealAmounts(e,food); d.meals.push({e,am}); addInto(d.tot,am); }
    else if(e.k==='fx'){ day(fxDay(e,roll)).fx.push(e); day(dayKey(e.t,roll)).rep.push(e); }   /* fx: the day it belongs to; rep: the day it was reported */
    else if(e.k==='none'){ day(e.d).none=true; } }
  /* rule 1: a day counts once it is closed. It needs at least one meal, and either an effect or a tap on "No effects today". */
  for(const d of Object.values(D)) d.closed=d.meals.length>0&&(d.fx.length>0||d.none);
  return {D,keys:Object.keys(D).sort(),roll,now:now||Date.now(),win:(WINS.indexOf(S.twin)>=0?S.twin:4)*H}; }

/* which amounts a bar can be drawn for, and when a meal or a day has to sit out */
const BUCKETS=['fat','cplx','sug','lact','fib','hist'];
function usable(am,b){ if(am.noNum>0) return false;                       /* a food with no numbers at all */
  if((b==='cplx'||b==='sug')&&am.unk>UNK_MAX) return false;                /* carbs of a kind not listed */
  if(b==='hist'&&am.histUnk>0) return false;                               /* a histamine food with no figure */
  if(b==='fib'&&am.x&&am.x.fib>0) return false;                            /* a fibre supplement with no figure */
  if(b==='caf'&&am.x&&am.x.caf>0) return false;                            /* a caffeine pill: brands vary, so no figure */
  return true; }

/* rule 3, after a meal: the amount in that meal, beside the effects reported in the hours after it (I.win: 1 to 8 hours, the person's setting).
   Windows can overlap: an effect 2 hours after lunch and 7 after breakfast counts for both meals at 8 hours. Nothing picks one of them. */

  return `<div class="ring"><svg viewBox="0 0 148 148" role="img" aria-label="${esc(P.slices.map(s=>L(SLN[s.k][0],SLN[s.k][1])+' '+s.pct+' %').join(', ')||L('Nothing reported','Rien de noté'))}"><circle cx="74" cy="74" r="${R}" stroke="var(--chip)"/>${arcs}</svg>
    <span class="mid"><b>${U(P.tot/(div||1),'g',0)}</b><small>${L('eaten','mangés')}</small></span></div>`; }
function keyHTML(am,div,some){ const P=E.pie(am); div=div||1; if(!P.slices.length) return `<p class="small muted" style="margin:12px 0 0;text-align:center">${some?L('What you reported in this period holds no fat, protein, carbs or fibre.','Ce que tu as noté pour cette période ne contient ni gras, ni protéines, ni glucides, ni fibres.'):L('No meal reported in this period.','Aucun repas noté pour cette période.')}</p>`;
  return `<ul class="key">${P.slices.map(s=>{ const inner=`<span class="sw" style="background:var(--s-${s.k})"></span><span class="nm">${L(SLN[s.k][0],SLN[s.k][1])}</span><span class="am">${U(s.g/div,'g')}</span>`;

  else V={v:'meal',mode:'meal',day:T,at:hm(now()),items:{},grp:S.list.length?'mine':recentKeys().length?'recent':'fruit',q:''}; render(); }
function openList(){ const items={}; for(const k of S.list) items[k]=1; V={v:'meal',mode:'list',items,base:S.list.slice(),grp:S.list.length?'mine':'fruit',q:''}; render(); }
function recentKeys(){ const seen=new Set(), out=[]; for(let i=S.ev.length-1;i>=0&&out.length<40;i--){ const e=S.ev[i]; if(e.k!=='meal') continue; for(const it of e.items) if(!seen.has(it.key)){ seen.add(it.key); out.push(it.key); } } return out; }
function recentMeals(){ const seen=new Set(), out=[]; for(let i=S.ev.length-1;i>=0&&out.length<4;i--){ const e=S.ev[i]; if(e.k!=='meal') continue; const sig=e.items.map(it=>it.key+'*'+it.q).sort().join('|'); if(!seen.has(sig)){ seen.add(sig); out.push(e); } } return out; }
function searchFoods(q,max){ q=norm(q.trim()); if(!q) return []; const all=FOODS.map(f=>f.key).concat(S.custom.map(c=>'L'+c.id)), hit=[];
  const rk=s=>{ const i=s.indexOf(q); return i<0?9:i>0?2:(s.length===q.length||s[q.length]===',')?0:1; };
  for(const k of all){ const f=food(k), r=Math.min(rk(norm(f.n[0])),rk(norm(f.n[1]))); if(r<9) hit.push([r,k]); }
  return hit.sort((x,y)=>x[0]-y[0]).slice(0,max||60).map(x=>x[1]); }                       /* the word as the whole name comes first ("Water", "Potato, boiled"), then names that start with it, then the rest */

/* ---------- Nutrition: what is behind the histamine line ---------- */
function histamineSheet(){ const I=IX(), per=S.nper, rows={}; let mg=0;
  for(const m of mealsIn(I,per)) for(const it of m.e.items){ const f=food(it.key); if(!f||f.none||!f.h) continue; const r=rows[it.key]||(rows[it.key]={f,q:0}); r.q+=it.q; if(f.hist!=null) mg+=f.hist*it.q; }
  const list=Object.values(rows).sort((a,b)=>(b.f.hist||0)*b.q-(a.f.hist||0)*a.q);
  showSheet(`<h3 id="sheetTitle">${L('Histamine, estimated','Histamine, estimée')} · ${perName(per)}</h3>
  ${list.length?`<ul class="evs">${list.map(r=>`<li>${qtxt(r.q)}\u00a0×\u00a0${esc(fname(r.f))} · ${r.f.hist!=null?'≈\u00a0'+U(r.f.hist*r.q,'mg',r.f.hist*r.q<1?2:1):L('no figure','sans chiffre')}</li>`).join('')}</ul><p class="small">${L('Total with a figure','Total avec un chiffre')}${COL()}<b>≈\u00a0${U(mg,'mg',mg<1?2:1)}</b></p>`:`<p>${L('No histamine food reported in this period.','Aucun aliment à histamine noté pour cette période.')}</p>`}
  <p class="small muted">${L('How the estimate is made: the weight of a serving, times the average for its food type in a 2011 table from the European Food Safety Authority. The amount in your own piece can be many times more or less. It counts how much histamine food you reported. It is not a measurement.','Comment l’estimation est faite\u00a0: le poids d’une portion, multiplié par la moyenne de son type d’aliment dans un tableau de 2011 de l’Autorité européenne de sécurité des aliments. La quantité dans ton propre morceau peut être plusieurs fois plus grande ou plus petite. Ça compte combien d’aliments à histamine tu as notés. Ce n’est pas une mesure.')}</p><p class="mine">${MINE()}</p>`); }
const NPERS=[['today','Today','Aujourd’hui'],['week','Week','Semaine'],['month','Month','Mois']];
/* the order, names, units and decimals of The Patch's chart */
const TN=[['prot','g','Protein','Protéines',0],['fib','g','Fibre','Fibres',0],['fe','mg','Iron','Fer',1],['mg','mg','Magnesium','Magnésium',0],['k','mg','Potassium','Potassium',0],['b1','mg','Thiamine (B1)','Thiamine (B1)',2],['b2','mg','Riboflavin (B2)','Riboflavine (B2)',1],['b3','mg','Niacin (B3)','Niacine (B3)',0],['b6','mg','Vitamin B6','Vitamine B6',1],['b12','mcg','B12','B12',1],['fol','mcg','Folate','Folate',0],['zn','mg','Zinc','Zinc',1],['se','mcg','Selenium','Sélénium',0],['cu','mg','Copper','Cuivre',1],['ca','mg','Calcium','Calcium',0],['c','mg','Vitamin C','Vitamine C',0],['e','IU','Vitamin E','Vitamine E',0],['d','IU','Vitamin D','Vitamine D',0],['va','mcg','Vitamin A','Vitamine A',0],['mn','mg','Manganese','Manganèse',1],['vk','mcg','Vitamin K','Vitamine K',0]];
const AGES=[['a1','18–30'],['a2','31–50'],['a3','51–70'],['a4','71+']], LIFE=[['veg','Vegetarian','Végétarien'],['preg','Pregnant','Enceinte'],['bf','Breastfeeding','Allaitement']];
const REFLINE=()=>L('Reference amounts come from Health Canada’s Dietary Reference Intakes and are shown for comparison only. The app doesn’t endorse them or advise on them. Health Canada has no connection with this app. This doesn’t replace a dietitian.','Les quantités de référence viennent des Apports nutritionnels de référence de Santé Canada et sont montrées pour comparaison seulement. L’app ne les endosse pas et ne donne pas de conseil à leur sujet. Santé Canada n’a aucun lien avec cette app. Ça ne remplace pas une diététiste.');

/* ---------- Threshold: the data view. Pick an effect; read what was eaten for the meals or days it was reported for, beside all the others.

const isP=b=>BARN[b][2]==='p', pw=x=>x===1?'portion':'portions';
function stepRange(B,s){ const u=isP(B.b)?null:BARN[B.b][2], t=x=>rnum(x,B.w)+' '+(u||pw(x));
  return s.i<0?(u?U(0,u,0):L('none of it','aucune portion')):s.i===0?L('up to ','jusqu’à ')+t(s.hi):rnum(s.lo,B.w)+L(' to ',' à ')+t(s.hi); }

/* ---------- the dots: one row for each line. Every counted meal or day is a dot, placed by its amount: filled if the picked effects were

function jit(i){ let h=Math.imul(i+1,2654435761)>>>0; h^=h>>>15; h=Math.imul(h,2246822519)>>>0; h^=h>>>13; return (h>>>0)/4294967296; }

const markX=r=>r.s.at==null?null:dotX(r,r.s.at)-Math.min(3.6,(dotX(r,r.s.at)-dotX(r,r.s.below||0))/2);

  sulph:['Preservatives in wine, beer, dried fruit and some prepared foods.','Des agents de conservation dans le vin, la bière, les fruits séchés et certains aliments préparés.','Broken down by an enzyme in the liver.','Décomposés par une enzyme du foie.','Health Canada’s list of foods that often contain sulphites.','La liste de Santé Canada des aliments qui contiennent souvent des sulfites.'],
  nitr:['Nitrite added to cured meat: bacon, ham, wieners, salami and jerky.','Du nitrite ajouté aux charcuteries : bacon, jambon, saucisses, salami et charqui.','Changed to nitrate in the body, then passed out by the kidneys.','Changé en nitrate dans le corps, puis éliminé par les reins.','Cured meats, by their ingredient lists. Brands vary.','Les charcuteries, selon leur liste d’ingrédients. Ça varie selon la marque.'],
  flav:['On a label: “natural flavour”, “flavour” or “artificial flavour”. A flavouring is a preparation, not one substance.','Sur une étiquette : « arôme naturel », « arôme » ou « arôme artificiel ». Un arôme est une préparation, pas une seule substance.',
    'What it can hold','Ce qu’il peut contenir','The substances that give the taste, and a liquid that carries them. The carriers Canada permits in a flavour include ethanol, glycerol, propylene glycol, triacetin and benzyl alcohol.','Les substances qui donnent le goût, et un liquide qui les porte. Les liquides porteurs que le Canada permet dans un arôme comprennent l’éthanol, le glycérol, le propylèneglycol, la triacétine et l’alcool benzylique.',
    'What the label leaves out','Ce que l’étiquette ne dit pas','Canada’s rules let a label name the preparation without listing what is in it. Still named when the preparation holds them: salt, glutamate, hydrolyzed plant protein, aspartame, potassium chloride, gluten sources, sulphites at 10 parts per million or more, anything that does a job in the finished food, and the foods a Canadian label always has to name, such as milk, egg, peanut, wheat and soy.','Les règles du Canada permettent à une étiquette de nommer la préparation sans énumérer ce qu’elle contient. Restent nommés quand la préparation en contient : le sel, le glutamate, les protéines végétales hydrolysées, l’aspartame, le chlorure de potassium, les sources de gluten, les sulfites à 10 parties par million ou plus, tout ce qui joue un rôle dans l’aliment fini, et les aliments qu’une étiquette canadienne nomme toujours, comme le lait, les œufs, les arachides, le blé et le soya.',
    'One product and another','D’un produit à l’autre','Two products that both list “natural flavour” can hold different preparations: different substances, different carriers, different amounts. What you report after one says nothing about another. This line counts them all together, because a label gives nothing more to go by. To read one product by itself, add it from its label and look it up on the Threshold tab.','Deux produits qui indiquent tous les deux « arôme naturel » peuvent contenir des préparations différentes : d’autres substances, d’autres liquides porteurs, d’autres quantités. Ce que tu notes après l’un ne dit rien sur l’autre. Cette ligne les compte tous ensemble, parce qu’une étiquette ne donne rien de plus. Pour lire un seul produit, ajoute-le selon son étiquette et cherche-le dans l’onglet Seuil.',
    'Where the count comes from','D’où vient le compte','Portions, with no amount. The table tags drinks by their kind, not from a label: colas, energy drinks, the ready-to-drink protein shake and flavoured sparkling water. Other foods in the table can list a flavour too, depending on the brand. The table has no ingredient lists, so it can’t say which. A food added from its label counts when “A flavour” is ticked. Sources: Food and Drug Regulations, section B.01.009; Health Canada, List of Permitted Solvents; Canadian Food Inspection Agency, labelling rules for ingredient lists.','En portions, sans quantité. Le tableau marque des boissons selon leur sorte, pas selon une étiquette : les colas, les boissons énergisantes, la boisson protéinée prête à boire et l’eau pétillante aromatisée. D’autres aliments du tableau peuvent aussi indiquer un arôme, selon la marque. Le tableau n’a pas de listes d’ingrédients, alors il ne peut pas dire lesquels. Un aliment ajouté selon son étiquette compte quand « Un arôme » est coché. Sources : Règlement sur les aliments et drogues, article B.01.009; Santé Canada, liste des solvants autorisés; Agence canadienne d’inspection des aliments, règles d’étiquetage des listes d’ingrédients.'],
  swt:['Sweeteners with few calories or none, in diet drinks and sugar-free foods.','Des édulcorants avec peu ou pas de calories, dans les boissons diète et les aliments sans sucre.','It depends on the sweetener.','Ça dépend de l’édulcorant.'].concat(FTLTAG),
  glu:['A protein in wheat, barley and rye.','Une protéine du blé, de l’orge et du seigle.','Digested only in part.','Digéré en partie seulement.'].concat(FTLTAG),
  pur:['Counted here: foods at 200 mg of purines per 100 g or more, which are beef liver, chicken liver and sardines.','Comptés ici : les aliments à 200 mg de purines ou plus par 100 g, soit le foie de bœuf, le foie de poulet et les sardines.','Broken down to uric acid, which the kidneys pass out.','Décomposées en acide urique, que les reins éliminent.','Kaneko and others, Biol. Pharm. Bull. 2014;37(5):709.','Kaneko et coll., Biol. Pharm. Bull. 2014;37(5):709.']};

  else P.push(L('complex carbs','glucides complexes')+' '+U(a.cplx,'g'),L('sugars','sucres')+' '+U(a.sug,'g')+(a.lact>=0.05?' ('+L('lactose','lactose')+' '+U(a.lact,'g')+')':''));

/* ---------- History: every entry, newest first. Tap one to change or remove it. ---------- */

function entrySheet(keep){ const e=S.ev.find(x=>x.id===UI.en.id); if(!e){ closeSheet(); return; } const k=e.k==='none'?e.d:E.dayKey(e.t,S.roll), rm=`<button type="button" class="btn ghost sm" data-act="del" data-v="${e.id}">${L('Remove','Retirer')}</button>`;

  else if(e.k==='fx'){ const h=winFor(e.c), W=h*E.H, sleep=e.c==='sleep', dk=E.fxDay(e,S.roll), meals=S.ev.filter(x=>x.k==='meal'&&x.t<=e.t);

/* ---------- Ask AI: the log as text, copied. The app writes no question, and sends nothing. ---------- */
function aiText(scope){ const T=today(), from=scope==='month'?kAdd(T,-29):null, dk=e=>e.k==='none'?e.d:E.dayKey(e.t,S.roll), ev=S.ev.filter(e=>!from||dk(e)>=from);
  const I=E.index({ev,roll:S.roll,twin:winH()},food,now()), O=[], pl=s=>String(s).replace(/[\u00a0\u202f]/g,' '), rd=E.reportedDays(I), withMeal=I.keys.filter(k=>I.D[k].meals.length).length;
  O.push(L('My own log from Threshold Log. Not medical advice.','Mon propre journal du Threshold Log. Pas un avis médical.'));
  O.push(L(`Made ${T} with Threshold Log ${VER}. Entries from ${I.keys[0]||T} to ${I.keys[I.keys.length-1]||T}.`,`Fait le ${T} avec Threshold Log ${VER}. Entrées du ${I.keys[0]||T} au ${I.keys[I.keys.length-1]||T}.`));
  O.push(L(`Days with a meal: ${withMeal}. Complete days: ${rd}. A day is complete when it has a meal and either an effect or a tap on "No effects today". Only complete days are in the tallies.`,`Jours avec un repas\u00a0: ${withMeal}. Journées complètes\u00a0: ${rd}. Une journée est complète quand elle a un repas et soit un effet, soit un appui sur «\u00a0Aucun effet aujourd’hui\u00a0». Seules les journées complètes sont dans les comptes.`));
  O.push(L('Amounts per serving are from Health Canada’s Canadian Nutrient File (2015). Histamine is an estimate: the weight of a serving times the average for its food type in a 2011 table from the European Food Safety Authority. It is not a measurement.','Les quantités par portion viennent du Fichier canadien sur les éléments nutritifs de Santé Canada (2015). L’histamine est une estimation\u00a0: le poids d’une portion multiplié par la moyenne de son type d’aliment dans un tableau de 2011 de l’Autorité européenne de sécurité des aliments. Ce n’est pas une mesure.'));
  if(S.roll) O.push(L(`My day starts at ${S.roll}:00.`,`Ma journée commence à ${S.roll} h.`));
  if(S.list.length) O.push(L('My list (the foods I eat as a rule): ','Ma liste (les aliments que je mange d’habitude)\u00a0: ')+S.list.map(k=>fname(food(k))).join('; ')+'.');
  if(S.imp&&S.imp.out.length) O.push(L('Rejected in my Food Trial Log: ','Rejetés dans mon Food Trial Log\u00a0: ')+S.imp.out.map(r=>`${fname(food(r.key))} (${r.d}, ${pl(whyTxt(r)).replace(/ · /g,', ')})`).join('; ')+'.');
  const cs=Object.entries(S.concl).filter(([k,v])=>v&&v.trim()); if(cs.length) O.push(L('My conclusions, in my own words: ','Mes conclusions, dans mes mots\u00a0: ')+cs.map(([k,v])=>(k.startsWith('food:')?fname(food(k.slice(5))):BARN[k]?L(BARN[k][0],BARN[k][1]):k)+COL()+L('"','«\u00a0')+v.trim()+L('"','\u00a0»')).join('; ')+'.');
  for(const mode of ['meal','day']){ O.push('',mode==='meal'?L(`TALLIES AFTER A MEAL (the amount in one meal; effects reported in ${hrsAfter(winH())}: my own setting, from 1 to 8 hours)`,`COMPTES APRÈS UN REPAS (la quantité dans un repas; effets notés dans ${hrsAfter(winH())} : mon propre réglage, de 1 à 8 heures)`):L('TALLIES OVER A DAY (the total for a day; effects reported that day, that night and the next day)','COMPTES SUR UNE JOURNÉE (le total d’une journée; effets notés ce jour-là, cette nuit-là et le lendemain)'));
    for(const b of E.BUCKETS.concat(['alc','caf'])){ const B=E.bar(I,b,mode); O.push(L(BARN[b][0],BARN[b][1])+', '+BARN[b][2]); if(!B.n){ O.push('  '+L('nothing counted yet','rien de compté pour l’instant')); continue; }
      for(const s of [B.zero].concat(B.steps)){ if(!s.n) continue; const fx=Object.entries(s.fx).sort((a,c)=>c[1]-a[1]).map(([c,n])=>fxLow(c)+' '+n).join(', '); O.push('  '+pl(stepRange(B,s))+COL()+pl(stepCount(B,s))+(fx?' ('+fx+')':'')); }
      if(B.left) O.push('  '+L(`left out: ${B.left} (${leftWhy2(b)})`,`laissés de côté\u00a0: ${B.left} (${leftWhy2(b)})`)); } }
  O.push('',L('ENTRIES','ENTRÉES'));
  for(const k of I.keys.slice().reverse()){ const d=I.D[k], [y,m,da]=k.split('-').map(Number), wd=new Date(y,m-1,da).toLocaleDateString(LOC(),{weekday:'long'});
    O.push(`${k}, ${wd}, ${!d.meals.length?L('no meal','aucun repas'):d.closed?L('complete','complète'):L('not complete','pas complète')}`);
    const rows=d.meals.map(m=>[m.e.t,`  ${hm(m.e.t)} ${L('meal','repas')}${COL()}${m.e.items.map(it=>{ const f=food(it.key); return pl(qtxt(it.q))+' x '+fname(f)+(fserv(f)?' ('+fserv(f)+')':''); }).join('; ')}. ${cap(amountsLine(m.am,true))}`]).concat(d.rep.map(e=>[e.t,`  ${hm(e.t)} ${L('effect','effet')}${COL()}${fxLow(e.c)}`])).sort((a,b)=>a[0]-b[0]);
    for(const r of rows) O.push(r[1]); if(d.none) O.push('  '+L('no effects reported that day','aucun effet noté ce jour-là')); }
  return O.join('\n'); }

function helpSheet(){ const H2=(en,fr,ten,tfr)=>`<p class="small"><b>${L(en,fr)}</b> ${L(ten,tfr)}</p>`;

  +H2('Home.','L’accueil.','Today’s meals and effects, in order. Tap a meal for what it held. Tap an effect for the meals reported in the hours before it: the hours are the ones set on the slider in Threshold. Poor sleep is counted with the day before, so it opens that day’s meals. Earlier days are in Menu → History.','Les repas et les effets d’aujourd’hui, dans l’ordre. Appuie sur un repas pour voir ce qu’il contenait. Appuie sur un effet pour voir les repas notés dans les heures d’avant : ces heures sont celles réglées sur le curseur de l’onglet Seuil. Un mauvais sommeil est compté avec la journée d’avant, alors il ouvre les repas de cette journée-là. Les journées d’avant sont dans Menu → Historique.')
  +H2('The ring.','L’anneau.','Under Nutrition. What you reported eating in the period, by weight, as a day on average: fat, protein, complex carbs, lactose, other sugars and fibre. The key under it has the grams, and the middle has their total. Alcohol, caffeine and the other compounds are in the card below it, as totals for the period. “Carbs, kind not listed” are the carbs of foods whose sugars Health Canada doesn’t list.','Dans l’onglet Nutrition. Ce que tu as noté avoir mangé pendant la période, selon le poids, pour une journée en moyenne\u00a0: gras, protéines, glucides complexes, lactose, autres sucres et fibres. La légende en dessous donne les grammes, et le milieu donne leur total. L’alcool, la caféine et les autres composés sont dans la carte en dessous, en totaux pour la période. Les «\u00a0glucides, sorte non indiquée\u00a0» sont les glucides des aliments dont Santé Canada n’indique pas les sucres.')
  +H2('Histamine, estimated.','Histamine, estimée.','One of the other compounds. It’s the weight of each serving times the average for its food type in a 2011 European table. The amount in your own piece can be many times more or less: one kind of cheese has measured from under 5 to over 1,000 mg per kg. Read it as a count of histamine food.','Un des autres composés. C’est le poids de chaque portion multiplié par la moyenne de son type d’aliment dans un tableau européen de 2011. La quantité dans ton propre morceau peut être plusieurs fois plus grande ou plus petite\u00a0: une même sorte de fromage a déjà mesuré de moins de 5 à plus de 1\u00a0000 mg par kg. Lis-le comme un compte d’aliments à histamine.')
  +H2('Other compounds.','Autres composés.','What your food carried beyond the ring, in five families: amines, plant compounds, fermentable sugars, added, and other. Milligrams where a source gives a figure, marked ≈ when it is an estimate. Portions where it doesn’t. Tap a name for what it is, how the body clears it and where the figure comes from. A food added from its label carries what you tick on its form.','Ce que tes aliments contenaient en plus de l’anneau, en cinq familles : amines, composés végétaux, sucres fermentescibles, ajoutés, et autres. En milligrammes quand une source donne un chiffre, avec ≈ quand c’est une estimation. En portions sinon. Appuie sur un nom pour savoir ce que c’est, comment le corps l’élimine et d’où vient le chiffre. Un aliment ajouté selon son étiquette contient ce que tu coches dans son formulaire.')
  +H2('The Threshold lists.','Les listes de seuil.','Under Filter, pick an effect, or leave it on “Any effect”. Pick several and choose how they combine: all of them together, or any of them. Your picks are kept. Each row is one thing you ate or drank. A thing you never had has no row. Each meal or day is a dot on it: the further right, the more it had. Filled dots are the meals or days the effect was reported for. Empty dots are all the others. A mark stands at the amount that best puts the filled dots to its right and the empty dots to its left, and the sentence under the row counts them. The rows where the mark does that best come first. A row has no mark when no amount does better than none, and those rows come last. The more meals you report, the more accurate it gets. Nothing is averaged. Tap a row’s name for every amount, with how many meals or days sat on each side. A meal joins the lists as soon as an effect is reported after it, or once its hours are over with none. A day joins once the day after it is over, so the next day’s effects are all in. Under Settings, choose the reading. “After a meal” reads one meal and the hours after it: the slider sets how many, from 1 to 8, and it starts at 4. An effect picked alone keeps its own hours. One effect can fall in the hours after two meals, and then it counts for both. “Over a day” reads the total for a day with that day, that night and the next day. Poor sleep counts for the night before the morning you report it.','Dans Filtre, choisis un effet, ou reste sur « Tout effet ». Choisis-en plusieurs et décide comment ils se combinent : tous ensemble, ou n’importe lequel. Tes choix sont gardés. Chaque ligne est une chose que tu as mangée ou bue. Une chose que tu n’as jamais prise n’a pas de ligne. Chaque repas ou journée y est un point : plus il est à droite, plus il en contenait. Les points pleins sont les repas ou les journées pour lesquels l’effet a été noté. Les points vides sont tous les autres. Une marque se place à la quantité qui met le mieux les points pleins à sa droite et les points vides à sa gauche, et la phrase sous la ligne les compte. Les lignes où la marque y arrive le mieux viennent en premier. Une ligne n’a pas de marque quand aucune quantité ne fait mieux que rien, et ces lignes viennent en dernier. Plus tu notes de repas, plus c’est précis. Aucune moyenne n’est faite. Appuie sur le nom d’une ligne pour voir chaque quantité, avec le nombre de repas ou de jours de chaque côté. Un repas entre dans les listes dès qu’un effet est noté après, ou quand ses heures sont terminées sans effet. Une journée y entre quand le lendemain est terminé, pour que les effets du lendemain y soient tous. Dans Réglages, choisis la lecture. « Après un repas » lit un repas et les heures suivantes : le curseur règle combien, de 1 à 8, et il commence à 4. Un effet choisi seul garde ses propres heures. Un même effet peut tomber dans les heures qui suivent deux repas, et il compte alors pour les deux. « Sur une journée » lit le total d’une journée avec ce jour-là, cette nuit-là et le lendemain. Un mauvais sommeil compte pour la nuit qui précède le matin où tu le notes.')
  +H2('Luck.','Le hasard.','The app puts no number on luck. A split between “With” and “Without” can come from luck alone. Luck has more room when there are few entries, when several things are eaten together, and when meals are closer together than the hours set on the slider. It has less room with more entries, with one thing changed at a time, and with meals further apart than the hours set. The same words sit under every opened line.','L’app ne met aucun chiffre sur le hasard. Un écart entre « Avec » et « Sans » peut venir du seul hasard. Le hasard a plus de place quand il y a peu d’entrées, quand plusieurs choses sont mangées ensemble et quand les repas sont plus rapprochés que les heures réglées sur le curseur. Il a moins de place avec plus d’entrées, avec une seule chose changée à la fois et avec des repas plus espacés que les heures réglées. Les mêmes mots se trouvent sous chaque ligne ouverte.')
  +H2('What the lists can’t tell apart.','Ce que les listes ne peuvent pas départager.','Things eaten together. If your high-fat meals were also your aged-cheese meals, both lines show the same split. Histamine and tyramine sit in the same foods, and so do gluten and fructans, so their lines move together. “Eaten together” counts the meals or days with 3 or more portions of aged or fermented foods, those with alcohol beside one, and those that held 5 compounds or more: alcohol, caffeine, histamine food and each of the other compounds count once. And what you expect can shape what you feel and report.','Les choses mangées ensemble. Si tes repas riches en gras étaient aussi tes repas de fromage vieilli, les deux lignes montrent le même écart. L’histamine et la tyramine sont dans les mêmes aliments, le gluten et les fructanes aussi, alors leurs lignes bougent ensemble. « Mangés ensemble » compte les repas ou les jours avec 3 portions ou plus d’aliments vieillis ou fermentés, ceux avec de l’alcool et un de ces aliments, et ceux qui contenaient 5 composés ou plus : l’alcool, la caféine, les aliments à histamine et chacun des autres composés comptent une fois. Et ce à quoi tu t’attends peut influencer ce que tu ressens et ce que tu notes.')
  +H2('One food.','Un aliment.','On the Threshold tab, look up a food to see what you reported on the days you ate it, by the amount eaten that day, and on the days without it. Both are read over the same span: that day, that night and the next day.','Dans l’onglet Seuil, cherche un aliment pour voir ce que tu as noté les jours où tu en as mangé, selon la quantité mangée ce jour-là, et les jours sans cet aliment. Les deux sont lus sur la même durée : ce jour-là, cette nuit-là et le lendemain.')
  +H2('Drinks.','Les boissons.','A drink is entered like a meal, water included. Water, plain sparkling water and flavoured sparkling water are three separate entries.','Une boisson se note comme un repas, l’eau aussi. L’eau, l’eau pétillante nature et l’eau pétillante aromatisée sont trois entrées distinctes.')
  +H2('Foods with no numbers.','Aliments sans chiffres.','A food typed by name in the Food Trial Log has no amounts, so its meals stay out of the Threshold lists. A food added from its label has amounts and no vitamins or minerals.','Un aliment entré par son nom dans le Food Trial Log n’a pas de quantités, alors ses repas restent hors des listes de l’onglet Seuil. Un aliment ajouté selon son étiquette a des quantités, mais pas de vitamines ni de minéraux.')
  +`<p class="mine">${MINE()}</p>`); }

/* ---------- install: the same bar, button and steps as the Food Trial Log ---------- */
const SHARE='<svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M7 11H5v10h14V11h-2"/></svg>';
const pillHTML=()=>`<span>${L('Install Threshold Log on this phone','Installer Threshold Log sur ce téléphone')}</span><button type="button" class="ipy" data-act="install">${L('Install','Installer')}</button><button type="button" class="ipn" data-act="instno" aria-label="${L('No thanks','Non merci')}">✕</button>`;
function installPill(){ if(FRAMED||STANDALONE||document.getElementById('installPill')) return; try{ if(localStorage.getItem(KEY+'.noinst')) return; }catch(e){ return; }
  const b=document.createElement('div'); b.id='installPill'; b.innerHTML=pillHTML(); document.body.appendChild(b); }
function installSheet(){
  const icon=`<li>${L('From now on, open the app from its icon.','À partir de maintenant, ouvre l’app par son icône.')}</li>`,
    iph=`<ol class="inst">${SAFARI?'':`<li>${L('Open this page in <b>Safari</b>.','Ouvre cette page dans <b>Safari</b>.')}</li>`}<li>${L('Tap <b>⋯</b> beside the address bar, then <b>Share</b>. No <b>⋯</b>? Tap the Share button','Appuie sur <b>⋯</b> à côté de la barre d’adresse, puis sur <b>Partager</b>. Pas de <b>⋯</b>? Appuie sur le bouton Partager')} ${SHARE}.</li><li>${L('Scroll down the list and tap <b>Add to Home Screen</b>.','Descends dans la liste et choisis <b>Sur l’écran d’accueil</b>.')}</li><li>${L('Tap <b>Add</b>.','Appuie sur <b>Ajouter</b>.')}</li>${icon}</ol>`,
    and=`<ol class="inst">${CHROME?'':`<li>${L('Open this page in <b>Chrome</b>.','Ouvre cette page dans <b>Chrome</b>.')}</li>`}<li>${L('Tap the <b>⋮</b> menu at the top right.','Appuie sur le menu <b>⋮</b> en haut à droite.')}</li><li>${L('Tap <b>Add to Home screen</b>. On some phones it says <b>Install app</b>.','Appuie sur <b>Ajouter à l’écran d’accueil</b>. Sur certains téléphones, c’est écrit <b>Installer l’application</b>.')}</li><li>${L('Tap <b>Install</b>.','Appuie sur <b>Installer</b>.')}</li>${icon}</ol>`,
    carry=S.ev.length?`<p class="small">${L('You already have entries here. To bring them along, tap <b>Back up my data</b> in the menu. Then tap <b>Restore from a backup</b> in the installed app.','Tu as déjà des entrées ici. Pour les apporter, appuie sur <b>Sauvegarder mes données</b> dans le menu. Ensuite, appuie sur <b>Restaurer à partir d’une sauvegarde</b> dans l’app installée.')}</p>`:'',
    iosNote=`<p class="small">${L('<b>On an iPhone, install before you start.</b> The installed app does not see the entries made in Safari, or the Food Trial Log’s data: that comes in with its backup file, on the Nutrition tab.','<b>Sur un iPhone, installe avant de commencer.</b> L’app installée ne voit pas les entrées faites dans Safari, ni les données du Food Trial Log\u00a0: celles-là arrivent par son fichier de sauvegarde, dans l’onglet Nutrition.')}</p>${carry}<p class="small muted">${L('Why install: in Safari, an iPhone can erase your entries when you have not opened this page for 7 days. The installed app keeps them.','Pourquoi installer\u00a0: dans Safari, un iPhone peut effacer tes entrées quand tu n’as pas ouvert cette page depuis 7 jours. L’app installée les garde.')}</p>`,
    andNote=CHROME||!carry?'':`<p class="small">${L('Chrome does not see the entries made in this browser.','Chrome ne voit pas les entrées faites dans ce navigateur.')}</p>${carry}`;
  showSheet(`<h3 id="sheetTitle">${L('Install on this phone','Installer sur ce téléphone')}</h3><p class="small">${L('The app gets its own icon on your phone and opens without a connection. There is no store and no account.','L’app a sa propre icône sur ton téléphone et s’ouvre sans connexion. Pas de boutique d’applications, pas de compte.')}</p>${IOS?iph+iosNote:ANDROID?and+andNote:`<p><b>iPhone</b></p>${iph}${iosNote}<p><b>Android</b></p>${and}`}`); }
function navBack(){ if(sheet.classList.contains('on')){ closeSheet(); return true; } if(V){ V=V.prev||null; render(); return true; } if(S.tab!=='home'){ S.tab='home'; render(); return true; } return false; }

/* ---------- actions: one delegated handler ---------- */
const LATE=()=>toast(L('That time hasn’t happened yet','Cette heure n’est pas encore arrivée'));
/* the day picked in History: a real date, today or before */
function histDay(){ const k=UI.hday||kAdd(today(),-1), m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(k), d=m&&new Date(+m[1],+m[2]-1,+m[3]);
  if(!d||d.getMonth()!==+m[2]-1||k>today()||+m[1]<2000){ toast(L('Pick a day, today or before','Choisis une journée, aujourd’hui ou avant')); return null; } return k; }
const pnum=v=>{ v=String(v==null?'':v).trim().replace(',','.'); if(v==='') return null; const x=Number(v); return isFinite(x)&&x>=0&&x<10000?Math.round(x*100)/100:NaN; };
function pruneOwn(){ const used=new Set(S.ev.filter(e=>e.k==='fx'&&e.c.startsWith('o:')).map(e=>e.c.slice(2))); for(const g of ['phys','psy']) S.own[g]=S.own[g].filter(w=>used.has(w)); }

  lang:b=>{ S.lang=b.dataset.v; closeSheet(); render(true); },

  tonut:()=>{ closeSheet(); V=null; S.tab='nut'; S.nper='today'; render(); },
  fxthr:b=>{ closeSheet(); V=null; S.tsel=[b.dataset.v]; S.tmode=b.dataset.v==='sleep'?'day':'meal'; S.tab='thr'; render(); },
  nper:b=>{ S.nper=b.dataset.v; render(true); }, tmode:b=>{ S.tmode=b.dataset.v; render(true); if(sheet.classList.contains('on')) thrSetSheet(true); },
  tfilter:()=>thrFilterSheet(), tset:()=>thrSetSheet(),
  thrgot:()=>{ S.seenThr=true; render(); window.scrollTo(0,0); }, thrhow:()=>{ S.seenThr=false; render(); window.scrollTo(0,0); },
  histinfo:()=>histamineSheet(),
  /* a meal */
  meal:()=>{ closeSheet(); openMeal(null); }, list:()=>{ closeSheet(); openList(); },
  mealedit:b=>{ const e=S.ev.find(x=>x.id===b.dataset.v); if(!e) return; const prev=V&&V.v==='hist'?V:null; closeSheet(); openMeal(e); V.prev=prev; },
  mday:b=>{ V.day=b.dataset.v; render(true); }, mgrp:b=>{ V.grp=b.dataset.v; render(true); },
  msame:b=>{ const e=S.ev.find(x=>x.id===b.dataset.v); if(!e) return; for(const it of e.items) V.items[it.key]=it.q; V.grp='sel'; render(true); },
  mq:b=>{ const k=b.dataset.k, d=+b.dataset.v;
    if(V.mode==='list'){ if(d>0) V.items[k]=1; else delete V.items[k]; }
    else { const q=V.items[k]||0, n=q?q+d:d>0?(S.amt[k]||1):0; if(n>=0.5) V.items[k]=Math.min(20,n); else delete V.items[k]; }   /* the first tap gives the usual amount; after that, halves */
    render(true); },
  mealdone:()=>{ if(!V||V.v!=='meal') return;
    if(V.mode==='list'){ S.list=Object.keys(V.items); V=null; S.tab='nut'; render(); toast(L('List saved','Liste enregistrée')); return; }
    const ks=Object.keys(V.items); if(!ks.length) return; const t=atTime(V.day,V.at); if(t>now()+3e5){ LATE(); return; } const items=ks.map(k=>({key:k,q:V.items[k]}));
    if(V.id){ const e=S.ev.find(x=>x.id===V.id); if(e){ e.t=t; e.items=items; S.ev.sort((a,b)=>a.t-b.t); } V=V.prev||null; render(); toast(L('Saved','Enregistré')); return; }
    const prev=V.prev||null; V=prev; if(!prev) S.tab='home'; addEv([{id:uid('m'),k:'meal',t,items}],L('Meal reported','Repas noté')); if(!prev) window.scrollTo(0,0); },
  /* an effect */
  fx:()=>{ closeSheet(); pruneOwn(); UI.fx={tab:'phys',sel:[],day:today(),at:hm(now()),own:''}; fxSheet(); },
  fxtab:b=>{ UI.fx.tab=b.dataset.v; fxSheet(); }, fxday:b=>{ UI.fx.day=b.dataset.v; fxSheet(); },
  fxk:b=>{ const c=b.dataset.v, s=UI.fx.sel; UI.fx.sel=s.includes(c)?s.filter(x=>x!==c):[...s,c]; fxSheet(); },
  fxadd:()=>{ const u=UI.fx, w=(u.own||'').replace(/\s+/g,' ').trim().slice(0,40); if(!w){ toast(L('Type it first','Écris-le d’abord')); return; }
    const std=[...FX.phys,...FX.psy].find(r=>norm(r[1])===norm(w)||norm(r[2])===norm(w)); let code;
    if(std){ code=std[0]; u.tab=FX.phys.includes(std)?'phys':'psy'; }                                      /* the name of a listed effect: that one is ticked */
    else { const ex=S.own.phys.concat(S.own.psy).find(x=>norm(x)===norm(w)); if(ex) code='o:'+ex; else { if(S.own[u.tab].length>=12){ toast(L('12 of your own is the most','12 à toi, c’est le maximum')); return; } S.own[u.tab].push(w); code='o:'+w; } }
    if(!u.sel.includes(code)) u.sel.push(code); u.own=''; save(); fxSheet(); },
  fxdone:()=>{ const u=UI.fx; if(!u||!u.sel.length) return; const t=atTime(u.day,u.at); if(t>now()+3e5){ LATE(); return; }
    const list=u.sel.map((c,i)=>({id:uid('x')+i,k:'fx',t:t+i,c})), days=new Set(list.map(e=>E.fxDay(e,S.roll))), gone=S.ev.filter(e=>e.k==='none'&&days.has(e.d));
    if(gone.length) S.ev=S.ev.filter(e=>!gone.includes(e));                                               /* a day with an effect is no longer a day with none */
    closeSheet(); addEv(list,list.length>1?L(`${list.length} effects reported`,`${list.length} effets notés`):L('Effect reported','Effet noté')); if(gone.length) UNDO.none=gone; },
  none:b=>{ const k=b.dataset.v||today(), ex=S.ev.filter(e=>e.k==='none'&&e.d===k);
    if(ex.length){ UNDO={del:ex}; S.ev=S.ev.filter(e=>!ex.includes(e)); save(); render(true); toast(L('Removed','Retiré'),true); return; }
    const d=IX().D[k]; if(d&&d.fx.length) return;
    addEv([{id:uid('n'),k:'none',d:k,t:k===today()?now():E.dayStart(kAdd(k,1),S.roll)-6e4}],L('No effects','Aucun effet')+' · '+dLabel(k)); },
  /* entries */
  entry:b=>{ const e=S.ev.find(x=>x.id===b.dataset.v); if(!e) return; UI.en={id:e.id,at:hm(e.t)}; entrySheet(); },

  hist:()=>{ closeSheet(); UI.histN=30; V={v:'hist'}; render(); }, histmore:()=>{ UI.histN=(UI.histN||30)+30; render(true); },

  hfx:()=>{ const k=histDay(); if(!k) return; pruneOwn(); UI.fx={tab:'phys',sel:[],day:k,at:k===today()?hm(now()):'12:00',own:''}; fxSheet(); },
  /* the bars and one food */
  rowsheet:b=>{ UI.rs={b:b.dataset.k,i:null}; rowSheet(); }, rstep:b=>{ const i=+b.dataset.v; UI.rs.i=UI.rs.i===i?null:i; rowSheet(true); },
  tall:b=>{ S.tall=b.dataset.v==='1'; render(true); thrFilterSheet(true); },

  /* Nutrition */
  np:b=>{ S.p[b.dataset.k]=b.dataset.v; render(true); }, nlife:b=>{ const v=b.dataset.v, l=S.p.life||[]; S.p.life=l.includes(v)?l.filter(x=>x!==v):[...l,v]; render(true); },
  impread:()=>impRead(), impfile:()=>{ const el=document.getElementById('impFile'); if(el){ el.value=''; el.click(); } },
  impgo:()=>{ const u=UI.imp; if(!u) return; const R=u.R; S.list=R.list.map(x=>x.key); for(const x of R.list) S.amt[x.key]=x.q;
    S.imp={at:new Date().toISOString(),from:u.from,saved:u.saved,out:R.out,aside:R.aside,fine:R.fine};

  aicopy:async()=>{ toast(await copyText(UI.ai.text)?L('Copied','Copié'):L('Couldn’t copy: select the text','Impossible de copier\u00a0: sélectionne le texte')); },
  /* a food from its label */
  label:()=>{ UI.lb={}; labelSheet(); },
  lbedit:b=>{ const c=S.custom.find(x=>x.id===b.dataset.v); if(!c) return; UI.lb={id:c.id,n:c.n,s:c.s,kcal:c.kcal,fat:c.fat,carb:c.carb,fib:c.fib,sug:c.sug==null?'':c.sug,prot:c.prot,lact:c.lact||'',h:!!c.h,t:(c.t||[]).slice()}; labelSheet(); },
  lbh:()=>{ UI.lb.h=!UI.lb.h; labelSheet(true); },
  lbt:b=>{ const k=b.dataset.k, t=UI.lb.t||(UI.lb.t=[]), i=t.indexOf(k); if(LBT.indexOf(k)<0) return; if(i>=0) t.splice(i,1); else t.push(k); labelSheet(true); },
  lbflav:()=>{ UI.cp='flav'; compSheet(true); }, lbback:()=>labelSheet(),
  lbsave:()=>{ const u=UI.lb, n=String(u.n||'').replace(/\s+/g,' ').trim().slice(0,60), fat=pnum(u.fat), carb=pnum(u.carb), prot=pnum(u.prot), fib=pnum(u.fib), sug=pnum(u.sug), lact=pnum(u.lact), kcal=pnum(u.kcal);
    if(!n){ toast(L('It needs a name','Il lui faut un nom')); return; }
    if(fat==null||carb==null||prot==null){ toast(L('It needs fat, carbohydrate and protein','Il lui faut les lipides, les glucides et les protéines')); return; }
    if([fat,carb,prot,fib,sug,lact,kcal].some(x=>x!==null&&isNaN(x))){ toast(L('One of the numbers can’t be read','Un des chiffres ne se lit pas')); return; }
    const c={id:u.id||uid('c'),n,s:String(u.s||'').replace(/\s+/g,' ').trim().slice(0,60),kcal:kcal==null?Math.round(4*carb+4*prot+9*fat):kcal,fat,carb,prot,fib:fib||0,sug,lact:lact||0,h:!!u.h,t:LBT.filter(k=>(u.t||[]).indexOf(k)>=0)};
    const i=S.custom.findIndex(x=>x.id===c.id); if(i>=0) S.custom[i]=c; else S.custom.push(c); closeSheet(); render(true); toast(L('Saved. Find it by its name in a meal.','Enregistré. Cherche-le par son nom dans un repas.')); },
  lbdel:()=>{ const id=UI.lb.id; if(!id||usedIn(id)) return; S.custom=S.custom.filter(x=>x.id!==id); S.list=S.list.filter(k=>k!=='L'+id); closeSheet(); render(true); toast(L('Removed','Retiré')); },
  /* backup */
  backup:()=>backupSheet(), restore:()=>restoreSheet(),
  bkcopy:async()=>{ const ok=await copyText(UI.bk); if(ok){ S.bkAt=new Date().toISOString(); save(); } toast(ok?L('Backup copied: paste it somewhere private','Sauvegarde copiée\u00a0: colle-la dans un endroit privé'):L('Couldn’t copy: select the text','Impossible de copier\u00a0: sélectionne le texte')); },
  bkfile:()=>{ try{ const u=URL.createObjectURL(new Blob([UI.bk],{type:'application/json'})), a=document.createElement('a'); a.href=u; a.download='threshold-log-backup-'+today()+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); },500); S.bkAt=new Date().toISOString(); save(); toast(L('Saved to your downloads','Enregistré dans tes téléchargements')); }catch(e){ toast(L('Download failed: use Copy','Le téléchargement a échoué\u00a0: utilise Copier')); } },
  pickfile:()=>{ const el=document.getElementById('restoreFile'); if(el){ el.value=''; el.click(); } }, usetext:()=>parseBackup(document.getElementById('restoreText').value),
  /* try the backup on every screen first; if anything breaks, keep what's on the phone */
  dorestore:()=>{ const o=UI.restore; if(!o) return; const old=S, oldStore=STORE, oldV=V;
    try{ S=clean(JSON.parse(JSON.stringify(o.state))); S.lang=old.lang; V=null; IXM=null; vHome(); vNut(); vThr(); vHist(); aiText('all'); }
    catch(e){ S=old; STORE=oldStore; V=oldV; IXM=null; closeSheet(); render(); toast(L('That backup couldn’t be read. Nothing was changed.','Cette sauvegarde n’a pas pu être lue. Rien n’a été modifié.')); return; }
    if(STORE==='bad') STORE='ok'; UI={}; UNDO=null; closeSheet(); render(); toast(L('Restored','Restauré')); },
  erase:b=>{ if(b.dataset.sure){ eraseAll(); return; } b.dataset.sure='1'; b.textContent=L('Tap again to erase everything','Appuie encore pour tout effacer'); },
  /* install */
  instno:()=>{ const b=document.getElementById('installPill'); if(b) b.remove(); document.querySelectorAll('.instbig').forEach(x=>x.remove()); try{ localStorage.setItem(KEY+'.noinst','1'); }catch(e){} },
  /* on Android the browser's offer can arrive a moment after the page; wait up to 2.5 seconds for it before showing the steps */
  install:()=>{ const go=()=>{ const e=window.INSTALL; closeSheet(); e.prompt(); e.userChoice.finally(()=>{ window.INSTALL=null; }); };
    if(window.INSTALL){ go(); return; } if(!ANDROID||window.INSTWAIT){ if(!window.INSTWAIT) installSheet(); return; }
    window.INSTWAIT=1; let n=0; const iv=setInterval(()=>{ n++; if(window.INSTALL){ clearInterval(iv); window.INSTWAIT=0; go(); } else if(n>=10){ clearInterval(iv); window.INSTWAIT=0; installSheet(); } },250); }
};
/* the day can turn over while the app sits open on a screen: that screen is drawn again before a tap is taken for the wrong day */
let DAYNOW=today();
function fresh(){ const d=today(); if(d===DAYNOW) return false; DAYNOW=d; if(sheet.classList.contains('on')||V||!S.ack) return false; render(true); return true; }
setInterval(fresh,60000);
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const f=ACT[b.dataset.act]; if(!f) return; e.preventDefault();
  if(fresh()){ toast(L('A new day has started. Tap again.','Une nouvelle journée a commencé. Appuie encore.')); return; } f(b,e); });
document.addEventListener('input',e=>{ const el=e.target, k=el.dataset&&el.dataset.in; if(!k) return; const v=el.value;
  if(k==='mq'){ if(!V||V.v!=='meal') return; V.q=v; document.getElementById('mRows').innerHTML=mealRows(); const hq=!!v.trim(); for(const id of ['mTabs','mSame']){ const x=document.getElementById(id); if(x) x.hidden=hq; } return; }
  if(k==='tq'){ UI.tq=v; document.getElementById('tqRows').innerHTML=tqRows(); return; }
  /* the slider moves: the lists under it are read again at once. The slider itself is left alone, so a drag is never cut short. It is saved when the thumb is let go. */
  if(k==='twin'){ const h=Math.round(+v), sel=selOf(), one=sel.length===1?sel[0]:null; if(E.WINS.indexOf(h)<0||h===thrH()) return; if(one) S.fxw[one]=h; else S.twin=h;
    el.setAttribute('aria-valuetext',hrsWord(h)); const tx=document.getElementById('tWinTxt'); if(tx) tx.textContent=hrsAfter(h); const tmp=document.createElement('div'); tmp.innerHTML=vThr();
    for(const id of ['thrCard','thrBar']){ const a=document.getElementById(id), b=tmp.querySelector('#'+id); if(a&&b) a.innerHTML=b.innerHTML; } return; }
  if(k==='hday'){ UI.hday=v; return; } if(k==='mat'){ if(V) V.at=v; return; } if(k==='fxat'){ UI.fx.at=v; return; } if(k==='fxown'){ UI.fx.own=v; return; } if(k==='enat'){ UI.en.at=v; return; } if(k==='lb'){ UI.lb[el.dataset.k]=v; return; }
  if(k==='concl'){ const key=el.dataset.k, t=v.slice(0,200); if(t.trim()) S.concl[key]=t; else delete S.concl[key]; UI.dirty=true; save(); } });
document.addEventListener('change',e=>{ const el=e.target;
  if(el.id==='impFile'||el.id==='restoreFile'){ const f=el.files&&el.files[0], fn=el.id==='impFile'?impFile:parseBackup; if(!f) return; const r=new FileReader(); r.onload=()=>fn(String(r.result)); r.onerror=()=>toast(L('That file couldn’t be read','Ce fichier n’a pas pu être lu')); r.readAsText(f); return; }
  if(el.dataset&&el.dataset.in==='twin'){ save(); return; }
  if(el.dataset&&el.dataset.in==='roll'){ S.roll=+el.value; render(true); toast(L('Saved','Enregistré')); } });
document.addEventListener('toggle',e=>{ const k=e.target.dataset&&e.target.dataset.tog; if(k) (UI.tog||(UI.tog={}))[k]=e.target.open; },true);
sheetBg.addEventListener('touchmove',e=>e.preventDefault(),{passive:false}); sheetBg.onclick=closeSheet;
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.in==='fxown'){ e.preventDefault(); ACT.fxadd(); return; }
  if(!sheet.classList.contains('on')) return; if(e.key==='Escape'){ e.preventDefault(); closeSheet(); return; }
  if(e.key==='Tab'){ const f=[...sheet.querySelectorAll('a[href],button:not([disabled]),input:not([tabindex="-1"]),select,textarea,summary')].filter(x=>x.offsetParent!==null); if(!f.length) return; const a=f[0], z=f[f.length-1]; if(e.shiftKey&&(document.activeElement===a||document.activeElement===sheet)){ e.preventDefault(); z.focus(); } else if(!e.shiftKey&&document.activeElement===z){ e.preventDefault(); a.focus(); } } });
/* coming back to the app: "today" and the 4-hour windows are read again */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!sheet.classList.contains('on')&&!V){ DAYNOW=today(); render(true); } });

render();
if(IOS||(ANDROID&&!CHROME)) installPill(); else if(ANDROID) setTimeout(installPill,4000);   /* Chrome on Android: the bar comes with Chrome's offer, or after 4 seconds without one */
if(STORE==='bad') toast(L('Couldn’t read your saved data. It hasn’t been overwritten.','Tes données n’ont pas pu être lues. Elles n’ont pas été écrasées.'));
/* home-screen shortcuts (the installed app's icon, long-pressed): ?r=meal or ?r=fx opens that report */
{ let r=null; try{ r=new URLSearchParams(location.search).get('r'); }catch(e){} if((r==='meal'||r==='fx')&&S.ack){ ACT[r](); try{ history.replaceState(null,'',location.pathname); }catch(e){} } }
/* the phone's back gesture, and a sideways swipe, go to the previous screen instead of leaving the app */
try{ history.pushState({tl:1},''); window.addEventListener('popstate',()=>{ if(navBack()){ try{ history.pushState({tl:1},''); }catch(e){} } else history.back(); }); }catch(e){}
{ let sx=0, sy=0, st=0;
  document.addEventListener('touchstart',e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=e.touches.length===1&&!(e.target.closest&&e.target.closest('input,select,textarea,.gtabs,.stepsrow,.sheet'))?Date.now():0; },{passive:true});
  document.addEventListener('touchend',e=>{ if(!st) return; const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy; if(Date.now()-st<600&&Math.abs(dx)>90&&Math.abs(dy)<50) navBack(); st=0; },{passive:true}); }
</script>
<script>
/* installed-app layer */
(function(){
  try{ if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){ navigator.serviceWorker.register('sw.js').catch(function(){}); } }catch(e){ /* a sandboxed preview has no service worker */ }
  /* the install bar appears when the browser offers its prompt (Android, desktop); Install uses that prompt, or shows the steps when there is none */
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); window.INSTALL=e; installPill(); });
  window.addEventListener('appinstalled',function(){ window.INSTALL=null; document.documentElement.classList.add('noinst'); });
})();
