<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threshold Log</title>
<meta name="description" content="See what you had eaten before the negative effects you reported. Free and private: everything stays on your phone.">
<meta name="theme-color" content="#c8481f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* The look is the Food Trial Log's: its colours, type, cards, buttons, chips, sheets and bars, copied from its stylesheet. */
:root{--bg:#f7f4ee;--card:#fff;--ink:#1c1b19;--muted:#6b665d;--line:#e6e0d4;--accent:#c8481f;--teal:#0f6b6b;--teal-soft:#e3f0ef;--warn:#b3261e;--warn-soft:#fbe9e7;--chip:#f1ede4;--chip-on:#1c1b19;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px -10px rgba(0,0,0,.15);
  /* the ring's slices: a fixed order, checked for colour-blind separation on this card colour. Grey is "kind not listed". */
  --s-fat:#2a78d6;--s-prot:#eb6834;--s-cplx:#1baf7a;--s-lact:#eda100;--s-sugo:#e87ba4;--s-fib:#008300;--s-alc:#6250d6;--s-unk:#9a968c;
  /* the Effects bar, the Effect button and the dot beside an effect */
  --fx3:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--card:#1e2026;--ink:#ececea;--muted:#a19d95;--line:#2d3038;--accent:#e3633a;--teal:#5fb3b3;--teal-soft:#1c2c2c;--warn:#ff7b6e;--warn-soft:#3a1f1c;--chip:#2a2d35;--chip-on:#ececea;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px -10px rgba(0,0,0,.6);
  --s-fat:#3987e5;--s-prot:#d95926;--s-cplx:#199e70;--s-lact:#c98500;--s-sugo:#d55181;--s-fib:#0ca30c;--s-alc:#9085e9;--s-unk:#7d7a73;
  --fx3:#c8331a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
.wrap{max-width:600px;margin:0 auto;padding:14px 18px 24px}
h1,h2,h3{font-family:ui-serif,Georgia,'Times New Roman',serif;line-height:1.15;margin:0 0 .4em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700;margin-top:0}
p{margin:.35em 0 .8em}
.muted{color:var(--muted)} .small{font-size:.9rem}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:0.875rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
.card.soft{background:var(--teal-soft);border-color:transparent}
.card.gate{border:2px solid var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:.92rem;border-radius:11px;min-height:44px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px}
.topbar .sp{flex:1}
.tb{border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer;padding:8px 10px;border-radius:10px;font-weight:700;min-height:44px;min-width:44px}
.tb:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#menuBtn{font-size:1.25rem;line-height:1}
.tb.ttl{font-family:ui-serif,Georgia,'Times New Roman',serif;font-weight:800;font-size:1.1rem;padding:6px 4px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tb.gls{font-size:0.875rem;border:1px solid var(--line);white-space:nowrap;flex:none}
.menu{display:grid;gap:6px;margin-top:6px}
.menu button,.menu a{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:48px}
.menu .danger{color:var(--warn)}
html.locked,html.locked body{overflow:hidden}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:0.875rem;font-weight:700;padding:6px 14px;cursor:pointer;min-height:44px;min-width:44px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:grid;gap:10px;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;font-size:1.02rem;line-height:1.3;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--bg);border-color:var(--chip-on)}
.chips.two{grid-template-columns:1fr 1fr}
.chips.pickn .chip,.chips.pick1 .chip{display:flex;align-items:flex-start;gap:12px}
.chips.pickn .chip::before,.chips.pick1 .chip::before{content:"";flex:0 0 22px;width:22px;height:22px;margin-top:-1px;box-sizing:border-box;border:2px solid var(--muted);background:var(--card)}
.chips.pickn .chip::before{border-radius:6px}
.chips.pick1 .chip::before{border-radius:50%}
.chips.pickn .chip[aria-pressed="true"]::before{content:"✓";border-color:var(--bg);background:var(--bg);color:var(--chip-on);font-size:15px;font-weight:800;line-height:18px;text-align:center}
.chips.pick1 .chip[aria-pressed="true"]::before{content:"";border-color:var(--bg);background:radial-gradient(circle,var(--bg) 0 5px,transparent 6px)}
.chip:focus-visible,.btn:focus-visible,.lnk:focus-visible,.gtabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"] .muted{color:inherit;opacity:.8}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.bar.hidden{display:none}
#bar .in .btn{white-space:nowrap;flex:none}
#bar .in > span.small{flex:1;min-width:0;text-align:center;line-height:1.2;overflow-wrap:break-word}
ul{padding-left:1.1em;margin:.3em 0 .6em} li{margin:.3em 0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .22s,visibility 0s linear .22s;z-index:50;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .22s,visibility 0s}
.sheet.full{top:0;max-height:none;border-radius:0;padding-top:calc(18px + env(safe-area-inset-top))}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:1.25rem}
.sheet a:not(.btn),.wrap p a{color:var(--teal);text-underline-offset:3px}
textarea.out{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100vw - 24px)}
.toast.show{opacity:1}
.busy{position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;font-weight:700;z-index:70;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,.28)}
.busy::before{content:"";display:inline-block;width:.75em;height:.75em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-.08em;animation:busyturn .8s linear infinite}
@keyframes busyturn{to{transform:rotate(360deg)}} @media (prefers-reduced-motion:reduce){.busy::before{animation:none}}
.toast.live{pointer-events:auto}.toast .undo{background:none;border:0;color:inherit;font:inherit;font-weight:800;text-decoration:underline;padding:12px 10px;margin:-12px -8px -12px 0;min-width:44px;min-height:44px;cursor:pointer}
[hidden]{display:none!important}
.chip.ack,.chip.ack[aria-pressed="true"]{width:100%;font-size:0.875rem;line-height:1.35;padding:10px 14px;cursor:default;background:transparent;color:var(--muted);border-color:var(--line);box-shadow:none;margin:12px 0 10px}
.tagline{font-size:1.2rem;font-weight:700;line-height:1.3;margin:6px 0 10px}
.st{display:grid;grid-template-columns:1fr 44px auto 44px;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px;background:var(--card)}
.st.on{border-color:var(--teal);background:var(--teal-soft)}
.st .nm{font-size:.9rem;font-weight:600;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.st .nm small{display:block;font-weight:400;color:var(--muted);font-size:0.875rem}
.st .val{min-width:34px;text-align:center;font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums}
.stp{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-size:1.4rem;font-weight:800;line-height:1;cursor:pointer;padding:0}
.stp.plus{background:var(--ink);color:var(--bg)}
.stp[disabled]{opacity:.3;cursor:default}
.stp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.steps{display:grid;gap:8px}
/* ==== shared/nutrition.css: the line above the Nutrition bars, its wrench, and the wrench's sheet. Edit it in shared/, then run node tools/shared.js --write. ==== */
.nprof{display:flex;align-items:center;gap:8px;margin:2px 0 6px}.nprof p{margin:0;flex:1;min-width:0}
.wrench{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}
.wrench svg{width:20px;height:20px}
fieldset.pw{border:0;margin:14px 0 0;padding:0}fieldset.pw legend{padding:0}fieldset.pw .chips{margin:8px 0 0}
/* ==== end of shared/nutrition.css ==== */
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.gtabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:0.875rem;font-weight:600;cursor:pointer;min-height:44px}
.gtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gtabs.seg{margin:6px 0 10px}
.toptabs{margin:0 0 12px;flex-wrap:nowrap}.toptabs button{flex:1 1 auto;white-space:nowrap;padding:6px 10px}
#savebar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--warn);color:#fff;padding:10px 14px;font-size:.88rem}
.fsearch{margin:8px 0 6px} .fsearch input{width:100%;box-sizing:border-box;padding:10px 12px;font-size:1rem;min-height:44px}
.sel{font:inherit;font-size:.9rem;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.sel.wide{width:100%;margin:8px 0;min-height:44px;box-sizing:border-box}
input.sel.tm{width:auto;min-width:112px;min-height:44px;padding:6px 10px}
@supports (-webkit-touch-callout:none){input,select,textarea,.sel{font-size:max(16px,1em)!important}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.on,.sheet-bg,.toast{transition:none}}
.mainbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 8px}
.mb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:88px;padding:10px 6px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:1.05rem;line-height:1.15;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
.mb .mi{font-size:1.5rem;line-height:1}
.mb.meal{border-top:4px solid var(--teal)} .mb.fx{border-top:4px solid var(--fx3)}
.mb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ul.tl{list-style:none;margin:4px 0 6px;padding:0} ul.tl li{border-bottom:1px solid var(--line);margin:0} ul.tl li:last-child{border-bottom:0}
.tlr{display:grid;grid-template-columns:3.4em 1fr;gap:8px;align-items:start;width:100%;min-height:48px;padding:10px 0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.95rem;text-align:left;cursor:pointer;line-height:1.3}
.tlr .tt{font-variant-numeric:tabular-nums;color:var(--muted);padding-top:1px} .tlr .tx small{display:block;color:var(--muted);font-size:.85rem}
.tlr .fxm{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--fx3);margin-right:6px}
ul.evs{list-style:none;padding:0;margin:.4em 0}ul.evs li{padding:7px 0;border-bottom:1px solid var(--line)}ul.evs li:last-child{border-bottom:0}
ul.evs li::after{content:"";display:block;clear:both}
.evc{float:right;display:inline-flex;gap:10px}
.lnk{background:none;border:0;padding:4px 0;font:inherit;font-size:.9rem;font-weight:700;color:var(--teal);cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:44px}
details.note{border-top:1px solid var(--line)}
details.note>summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:700}
details.note>summary::-webkit-details-marker{display:none}
details.note>summary::after{content:'+';margin-left:auto;color:var(--muted);font-weight:700;font-size:1.2rem;padding-left:10px}
details.note[open]>summary::after{content:'–'}
html.noinst .inst,html.noinst #installPill,html.locked #installPill{display:none!important}
@media (prefers-color-scheme:dark){.btn.primary{color:#1a0c06}}
@media (max-width:380px){.tb.ttl{font-size:1rem} .topbar .in{gap:4px;padding:8px 10px} .tb.gls{padding:6px 8px;font-size:.8125rem} .lang button{padding:6px 10px}}
@media (max-width:340px){.topbar .in{gap:2px;padding:8px 6px} .tb.ttl{font-size:.9rem;padding:6px 2px} .tb.ttl .t2{display:none} .tb{padding:8px 6px} .bar{padding-left:10px;padding-right:10px} #bar .in{gap:6px} #bar .in .btn{padding:9px 10px}}

/* ---- Threshold Log's own pieces ---- */
.lnk.none{display:block;margin:0 auto 10px;text-align:center}
.lnk.none[aria-pressed="true"]{color:var(--ink);text-decoration:none}
/* the ring, under Nutrition */
.ring{position:relative;width:148px;height:148px;margin:0 auto}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:20}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px;line-height:1.15;border:0;background:none;color:inherit;font:inherit;cursor:pointer;border-radius:50%}
.ring .mid b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.ring .mid small{font-size:.72rem;color:var(--muted)}
.ring .mid:focus-visible,.keyrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* the key carries the amounts, so the ring never has to be read by colour alone */
.key{display:grid;grid-template-columns:1fr;gap:0 18px;margin:12px 0 0;padding:0;list-style:none}
@media (min-width:560px){.key{grid-template-columns:1fr 1fr}}
.key li{display:flex;align-items:baseline;gap:6px;margin:0;font-size:.9rem;min-width:0}
.key .sw{flex:none;width:10px;height:10px;border-radius:2px;align-self:center}
.key .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key .am{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.keyrow{display:flex;align-items:baseline;gap:6px;width:100%;border:0;background:none;color:inherit;font:inherit;font-size:.9rem;text-align:left;padding:5px 0;cursor:pointer;min-height:32px}
@media (max-width:360px){.ring{width:132px;height:132px}}
/* the two readings of the Threshold tab: their labels may take two lines on a narrow phone or in a wide font */
.modes button{flex:1 1 0;min-width:0;white-space:normal;line-height:1.15}
/* the coverage list: the person's amount beside Health Canada's reference. No colours, no judgement. */
table.cov{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0}
table.cov th,table.cov td{padding:6px 0 6px 10px;border-bottom:1px solid var(--line);text-align:right;font-weight:400;font-variant-numeric:tabular-nums}
table.cov th:first-child{padding-left:0}
table.cov th[scope=row]{text-align:left;font-weight:600}
table.cov thead th{font-size:.8rem;color:var(--muted);font-weight:700}
table.cov tr:last-child th,table.cov tr:last-child td{border-bottom:0}
.rd{margin:10px 0 0;padding:0;list-style:none} .rd li{margin:0;padding:8px 0;border-top:1px solid var(--line)}
.rd .q{font-weight:700} .rd .ln{display:grid;grid-template-columns:5.6em 1fr;gap:6px;font-size:.92rem;margin-top:2px} .rd .ln span:first-child{color:var(--muted)}
.fxt{display:inline;border:0;background:none;color:inherit;font:inherit;padding:6px 0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;min-height:32px}
.mine{font-size:.82rem;color:var(--muted);text-align:center;margin:10px 0 0}
.instbig>button{display:block;width:100%;box-sizing:border-box;min-height:64px;padding:14px 18px;font:inherit;font-size:1.12rem;font-weight:800;letter-spacing:.02em;border:2px solid currentColor;border-radius:14px;background:transparent;color:inherit;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body:has(.bar:not(.hidden)) #installPill,body:has(.instbig) #installPill{display:none}
#installPill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:6px;align-items:center;width:max-content;max-width:calc(100vw - 24px);box-sizing:border-box;background:var(--ink);color:var(--bg);border-radius:22px;padding:6px 6px 6px 16px;box-shadow:0 6px 20px -8px rgba(0,0,0,.45);font-weight:600;font-size:.94rem;line-height:1.25}
#installPill button{border:0;font:inherit;cursor:pointer;min-height:42px;flex:none} #installPill .ipy{background:var(--accent);color:#fff;border-radius:999px;padding:9px 16px} #installPill .ipn{background:transparent;color:inherit;padding:8px 10px}
@media (prefers-color-scheme:dark){#installPill .ipy{color:#1a0c06}}
ol.inst{margin:4px 0 14px;padding-left:1.4em} ol.inst li{margin:0 0 9px} .ico{display:inline-block;vertical-align:-4px}
.fxt[aria-pressed="true"]{font-weight:700;text-decoration-style:solid}
/* a food from its label */
.lbg{display:grid;gap:8px;margin:8px 0} .lbg.two{grid-template-columns:1fr 1fr}
.lbf{display:block;font-size:.85rem;color:var(--muted)} .lbf input{display:block;width:100%;min-height:44px;margin-top:2px}
@media (max-width:420px){.tb.gls .lg{display:none}}
/* the effect sheet: two columns, so the list, the time and Done fit on one screen; Done stays in reach while the list scrolls */
.chips.fx{grid-template-columns:1fr 1fr;gap:8px;margin:8px 0} .chips.fx .chip{padding:10px;font-size:.95rem;gap:8px;min-width:0;overflow-wrap:anywhere} .chips.fx .chip .sub{display:block;font-size:.8rem;color:var(--muted)} .chips.fx .chip[aria-pressed="true"] .sub{color:inherit;opacity:.8}
.stick{position:sticky;bottom:0;z-index:1;background:var(--card);padding:10px 0 4px;margin-top:8px}
/* the data view: plain numbers in two columns, no colour */
/* the slider for the hours after a meal: a full-width row 44px high with a 28px thumb, so it is easy to hold. Its eight stops are numbered under it:
   the row of numbers is inset by half a thumb less half a number, so each number sits under the thumb's centre at that stop. */
.twin{margin:0 0 12px} .twin label{display:block;margin:0 0 2px}
.twin input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:44px;margin:0;padding:0;background:transparent;border-radius:12px;cursor:pointer;touch-action:pan-y}
.twin input[type=range]:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.twin input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--muted)}
.twin input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--muted)}
.twin input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ink)}
.twin input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ink)}
.twin .ends{display:flex;justify-content:space-between;padding:0 6px;margin-top:0;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.twin .ends span{width:16px;text-align:center}
table.rws{margin:10px 0 14px;table-layout:fixed} table.rws td b{display:block;font-variant-numeric:tabular-nums} table.rws td small{display:block;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
/* the Threshold tab's two buttons: what is filtered, and how it is read */
ul.drows{list-style:none;margin:0 0 6px;padding:0} .drow{padding:8px 0 10px;border-bottom:1px solid var(--line)} ul.drows li:last-child{border-bottom:0}
.dgh{font-size:.9rem;font-weight:700;color:var(--muted);margin:16px 0 0;padding-top:12px;border-top:2px solid var(--line)} .dwrap{position:relative;padding-top:1.35rem} .dwrap.ex{padding-top:0}
svg.dots{display:block;width:100%;height:auto;overflow:visible} .dots .l1{fill:var(--chip)} .dots .l2{fill:none;stroke:var(--line)}
.dh{fill:var(--ink);fill-opacity:.82} .dr{fill:none;stroke:var(--muted);stroke-width:1.1} .dots .dm{stroke:var(--ink);stroke-width:1.6}
.dmk{position:absolute;top:0;font-size:.78rem;font-weight:700;white-space:nowrap;line-height:1.3rem} .dax{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dtx{margin:4px 0 0} .dfd{margin:2px 0 0} .drow.kid{padding-left:14px;border-left:2px solid var(--line)} .dkey{display:flex;flex-wrap:wrap;gap:2px 16px;margin:0 0 6px} .dkey svg{width:.8em;height:.8em;margin-right:5px;vertical-align:-.02em}
.thn{display:block;font-weight:400;font-size:.78rem;text-transform:none;letter-spacing:0;white-space:nowrap}
.thrbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.tbb{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:56px;min-width:0;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;font:inherit;text-align:left;cursor:pointer}
.tbb small{font-size:.78rem;color:var(--muted)} .tbb b{font-size:.95rem;line-height:1.2;overflow-wrap:anywhere}
.tbb:focus-visible{outline:3px solid var(--accent);outline-offset:2px} table.rws th:first-child{width:42%;overflow-wrap:anywhere}
.rowb{display:inline;border:0;background:none;color:inherit;font:inherit;font-weight:600;text-align:left;padding:6px 0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;min-height:32px}
.rowb[aria-pressed="true"]{text-decoration-style:solid}
.und{text-decoration:underline dotted;text-underline-offset:3px}
.menu .cmore{display:flex;justify-content:space-between;align-items:center;gap:8px} .cmore .muted{font-weight:400}
.fxpick{margin:0 0 10px}

/* ===================== ENGINE: the reading rules. No screen code in here, so each rule can be tested on its own. =====================
   A reading is a count of what the person reported, set beside an amount. The app reports; it never interprets.
   Entries (S.ev):  {k:'meal', t, items:[{key,q}]}   {k:'fx', t, c}   {k:'none', t, d}   (t = milliseconds, d = a day key) */
const TLE=(function(){
const H=36e5, WIN=4*H, STEPS=8, UNK_MAX=2, ZEPS=0.005;
/* after a meal, the person sets how many hours count: one of these, 4 unless they move it */
const WINS=[1,2,3,4,5,6,7,8];
const p2=n=>(n<10?'0':'')+n;
/* a day starts at the person's own hour (the Food Trial Log's setting), so a 1 a.m. snack belongs to the evening before */
function dayKey(t,roll){ const d=new Date(t); if(d.getHours()<(roll||0)) d.setDate(d.getDate()-1); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function keyAdd(k,n){ const [y,m,d]=k.split('-').map(Number); const t=new Date(y,m-1,d+n); return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate()); }
function dayStart(k,roll){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d,roll||0).getTime(); }
/* poor sleep is reported the morning after, and belongs to the night before */
function fxDay(e,roll){ const k=dayKey(e.t,roll); return e.c==='sleep'?keyAdd(k,-1):k; }

/* ---------- what one food holds, times the portions eaten ----------
   Simple carbs are the sugars; lactose is one of them. Complex carbs are the rest of the carbohydrate, less the fibre.
   A food whose sugars Health Canada doesn't list keeps its carbs as "kind not listed": nothing is guessed. */
/* what a food carries beyond the ring (the table's last column), per serving: caffeine, theobromine, nitrate, tyramine and sodium in mg; selenium in µg;
   the kinds of fat and sugar, sorbitol, mannitol and excess fructose in g; the rest in portions, where no figure is entered */
/* NUTR: the kinds of fat and sugar, and the two minerals. Rows of their own, but not "compounds" in the counts of compounds a meal held. */
const NUTR=['sat','mono','poly','frs','gluc','sucr','malt','gal','na','se'];
const COMPS=['caf','theo','nit','tyr','ox','ga','cap','fru','gos','sorb','mann','fruc','sulph','nitr','swt','flav','glu','pur'].concat(NUTR);
const ZERO=()=>{ const a={kcal:0,fat:0,prot:0,cplx:0,sug:0,sugo:0,lact:0,fib:0,unk:0,alc:0,hist:0,histN:0,histUnk:0,noNum:0,mic:null,x:null}; for(const k of COMPS) a[k]=0; return a; };
function amounts(f,q){ const a=ZERO(); if(!f||f.none){ a.noNum=q; return a; }
  const avail=Math.max(0,f.carb-f.fib);
  if(f.sug!=null){ const st=Math.min(f.sug,avail), la=Math.min(f.lact||0,st); a.sug=st*q; a.lact=la*q; a.sugo=(st-la)*q; a.cplx=(avail-st)*q; }
  else { const la=Math.min(f.lact||0,avail); a.lact=la*q; a.unk=(avail-la)*q; }
  a.kcal=f.kcal*q; a.fat=f.fat*q; a.prot=f.prot*q; a.fib=f.fib*q; a.alc=(f.alc||0)*q;
  if(f.h){ a.histN=q; if(f.hist!=null) a.hist=f.hist*q; else a.histUnk=q; }
  if(f.m) a.mic=f.m.map(v=>v*q);
  if(f.c) for(const k in f.c) a[k]=f.c[k]*q;
  if(f.x&&f.x.length){ a.x={}; for(const k of f.x) a.x[k]=q; }      /* values the table has no figure for (a pill whose strength varies by brand): portions, by value */
  return a; }
function addInto(a,b){ for(const k in b){ if(k==='mic'){ if(b.mic){ if(!a.mic) a.mic=b.mic.map(()=>0); for(let i=0;i<b.mic.length;i++) a.mic[i]+=b.mic[i]; } }
    else if(k==='x'){ if(b.x){ if(!a.x) a.x={}; for(const j in b.x) a.x[j]=(a.x[j]||0)+b.x[j]; } } else a[k]+=b[k]; } return a; }
function mealAmounts(m,food){ const a=ZERO(); for(const it of m.items) addInto(a,amounts(food(it.key),it.q)); return a; }

/* ---------- the days, read from the entries ---------- */
function index(S,food,now){ const roll=S.roll||0, D={}, day=k=>D[k]||(D[k]={k,meals:[],fx:[],rep:[],none:false,tot:ZERO()});
  const ev=S.ev.slice().sort((a,b)=>a.t-b.t);
  for(const e of ev){
    if(e.k==='meal'){ const d=day(dayKey(e.t,roll)); const am=mealAmounts(e,food); d.meals.push({e,am}); addInto(d.tot,am); }
    else if(e.k==='fx'){ day(fxDay(e,roll)).fx.push(e); day(dayKey(e.t,roll)).rep.push(e); }   /* fx: the day it belongs to; rep: the day it was reported */
    else if(e.k==='none'){ day(e.d).none=true; } }
  /* rule 1: a day counts once it is closed. It needs at least one meal, and either an effect or a tap on "No effects today". */
  for(const d of Object.values(D)) d.closed=d.meals.length>0&&(d.fx.length>0||d.none);
  return {D,keys:Object.keys(D).sort(),roll,now:now||Date.now(),win:(WINS.indexOf(S.twin)>=0?S.twin:4)*H}; }

/* which amounts a bar can be drawn for, and when a meal or a day has to sit out */
const BUCKETS=['fat','cplx','sug','lact','fib','hist'];
function usable(am,b){ if(am.noNum>0) return false;                       /* a food with no numbers at all */
  if((b==='cplx'||b==='sug')&&am.unk>UNK_MAX) return false;                /* carbs of a kind not listed */
  if(b==='hist'&&am.histUnk>0) return false;                               /* a histamine food with no figure */
  if(am.x&&am.x[b]>0) return false;      /* a food that holds it with no figure: a fibre supplement, a caffeine pill, sugars whose kinds aren't listed */
  return true; }

/* rule 3, after a meal: the amount in that meal, beside the effects reported in the hours after it (I.win: 1 to 8 hours, the person's setting).
   Windows can overlap: an effect 2 hours after lunch and 7 after breakfast counts for both meals at 8 hours. Nothing picks one of them. */
/* what was reported after a meal does not depend on the row: it is worked out once for an index and its hours, and every row reads it.
   w: its hours are not over. Such a meal counts only once an effect is reported after it, since "no effect yet" is not "no effect" (see bar). */
function mealFx(I){ const W=I.win||WIN; if(I._mf&&I._mf.W===W&&I._mf.now===I.now) return I._mf.list; const list=[];
  for(const k of I.keys){ const d=I.D[k]; if(!d.closed) continue; const nx=I.D[keyAdd(k,1)], fx=d.fx.concat(nx?nx.fx:[]).filter(e=>e.c!=='sleep');
    for(const m of d.meals) list.push({m,fx:fx.filter(e=>e.t>=m.e.t&&e.t<=m.e.t+W).map(e=>e.c),w:m.e.t+W>I.now}); }
  I._mf={W,now:I.now,list}; return list; }
function mealUnits(I,b){ const out=[], left=[];
  for(const q of mealFx(I)){ const m=q.m; if(!usable(m.am,b)){ left.push(m.e.id); continue; } out.push({x:m.am[b],fx:q.fx,id:m.e.id,t:m.e.t,w:q.w}); }
  return {units:out,left}; }
/* rule 3, over a day: the day's total, beside the effects of that day, that night and the next day */
/* a day is read with its own effects, that night's and the next day's. So it can be read only once the day after it is over:
   before that, a day with nothing reported yet would sit on the "without" side and could still move. */
const dayDone=(I,k)=>dayStart(keyAdd(k,2),I.roll)<=I.now;
/* the day after has something reported for it: an effect, or a tap on "No effects today". When it has nothing, a day with no effect of its own
   is not settled, since the next day's effects count for it and nobody said there were none. It waits, as a meal whose hours are not over does. */
const told=(I,k)=>{ const nx=I.D[keyAdd(k,1)]; return !!nx&&(nx.fx.length>0||nx.rep.length>0||nx.none); };
function dayUnits(I,b){ const out=[], left=[];
  for(const k of I.keys){ const d=I.D[k]; if(!d.closed||!dayDone(I,k)) continue;
    if(!usable(d.tot,b)){ left.push(k); continue; }
    const nx=I.D[keyAdd(k,1)];
    out.push({x:d.tot[b],fx:d.fx.map(e=>e.c).concat(nx?nx.fx.filter(e=>e.c!=='sleep').map(e=>e.c):[]),id:k,w:!told(I,k)}); }   /* w: see bar */
  return {units:out,left}; }

/* what is not in the lists yet, and why: a meal whose hours are not over, a day whose next day is not over (soon),
   and the meals or days that sit in a day left open, with no effect and no "No effects" tap (open) */
function waiting(I,mode,sel,all){ let soon=0, open=0, next=0; const pick=c=>!sel||!sel.length||sel.indexOf(c)>=0, W=I.win||WIN;
  for(const k of I.keys){ const d=I.D[k]; if(!d.meals.length) continue;
    if(mode==='day'){ if(!dayDone(I,k)) soon++; else if(!d.closed) open++;
      else if(!told(I,k)){ const f=d.fx.map(e=>e.c).filter(pick); if(!(all&&sel&&sel.length?sel.every(c=>f.indexOf(c)>=0):f.length>0)) next++; } }   /* next: nothing reported for the day after, and no picked effect of its own */
    else { const nx=I.D[keyAdd(k,1)], fx=d.fx.concat(nx?nx.fx:[]).filter(e=>e.c!=='sleep'&&pick(e.c));
      for(const m of d.meals){ if(m.e.t+W>I.now){ const w=fx.filter(e=>e.t>=m.e.t&&e.t<=m.e.t+W); if(!(all&&sel&&sel.length?sel.every(c=>w.some(e=>e.c===c)):w.length>0)) soon++; } else if(!d.closed) open++; } } }
  return {soon,open,next}; }

/* rule 6: amounts are drawn in equal steps from zero to the person's highest. Each step is coloured by its own entries. */
const NICE=[0.1,0.2,0.25,0.5,1,2,2.5,5,10,20,25,50,100,200,250,500,1000];
function stepWidth(max){ for(const w of NICE) if(w*STEPS>=max-1e-9) return w; return Math.ceil(max/STEPS); }
function steps(units){ let max=0; for(const u of units) if(u.x>max) max=u.x;
  /* "none of it" has a cell of its own, before the steps: a meal with no lactose is not a meal with a little */
  const zero={i:-1,lo:0,hi:0,n:0,k:0,fx:{},ids:[]};
  const put=(s,u)=>{ s.n++; s.ids.push(u.id); if(u.fx.length){ s.k++; for(const c of new Set(u.fx)) s.fx[c]=(s.fx[c]||0)+1; } };
  /* rule 8: a step shows from its first entry. Its share is the part of its entries an effect was reported after. */
  const fin=s=>{ s.share=s.n?s.k/s.n:null; };
  if(!(max>ZEPS)){ for(const u of units) put(zero,u); fin(zero); return {w:0,max:0,steps:[],zero,n:units.length}; }
  const w=stepWidth(max), n=Math.max(1,Math.min(STEPS,Math.ceil(max/w-1e-9))), st=[];
  for(let i=0;i<n;i++) st.push({i,lo:i*w,hi:(i+1)*w,n:0,k:0,fx:{},ids:[]});
  for(const u of units) put(u.x>ZEPS?st[Math.min(n-1,Math.floor(u.x/w+1e-9))]:zero,u);
  for(const s of st) fin(s); fin(zero);
  return {w,max:n*w,steps:st,zero,n:units.length}; }
/* amounts are counted to a step of a thousandth of the row's highest or more, a power of ten: 0.1 g when the highest is 22 g, 1 mg when it is 900 mg.
   Two amounts closer than that sit at the same place on the row, so they count as the same amount, and a mark is never drawn between them. */
function snap(units){ let max=0; for(const u of units) if(u.x>max) max=u.x; if(!(max>ZEPS)) return units;
  const q=Math.pow(10,Math.ceil(Math.log10(max/1000))); return units.map(u=>Object.assign({},u,{x:Math.round(u.x/q)*q})); }
/* sel, when given, is a list of effect codes: only those effects count. Empty or absent means any effect. */
function bar(I,b,mode,sel,all){ const r=mode==='day'?dayUnits(I,b):mealUnits(I,b);
  /* all: every picked effect has to be there for a meal or a day to sit on the "with" side. Otherwise any one of them is enough. */
  let u=sel&&sel.length?r.units.map(x=>{ const f=x.fx.filter(c=>sel.indexOf(c)>=0); return Object.assign({},x,{fx:all&&!sel.every(c=>f.indexOf(c)>=0)?[]:f}); }):r.units;
  const s=steps(u=snap(u.filter(x=>!(x.w&&!x.fx.length)))); s.left=r.left.length; s.b=b; s.mode=mode; s.units=u; return s; }

/* ---------- the data view: every counted meal or day, on one side if the picked effects were reported for it, on the other if not ----------
   Nothing is averaged. A line carries how many there were on each side, how many of them held the thing at all, and the lowest and highest amount. */
const FAMS=[['base',['fat','sat','mono','poly','cplx','sug','frs','gluc','sucr','malt','gal','lact','fib']],['ac',['alc','caf']],['amine',['hist','tyr']],['plant',['ox','nit','ga','cap']],['ferm',['fru','gos','sorb','mann','fruc']],['added',['sulph','nitr','swt','flav']],['other',['glu','pur','theo']],['min',['na','se']]];
const TAGS=['ga','cap','fru','gos','sulph','nitr','swt','flav','glu'];     /* counted in portions */
/* the kinds of a thing sit under its row: each has its own mark, and the group stands where its best row would */
const KIDS={fat:['sat','mono','poly'],sug:['frs','gluc','sucr','malt','gal','lact']}, PARENT={};
for(const p in KIDS) for(const c of KIDS[p]) PARENT[c]=p;
function grouped(list){ const out=[], done=new Set(), by={}; for(const r of list) by[r.b]=r;
  for(const r of list){ if(done.has(r.b)) continue; const p=PARENT[r.b]||r.b;
    for(const b of [p].concat(KIDS[p]||[])) if(by[b]&&!done.has(b)){ out.push(by[b]); done.add(b); } }
  return out; }
function line(I,b,mode,sel,all){ const B=bar(I,b,mode,sel,all), side=()=>({n:0,ate:0,lo:null,hi:null}), hit=side(), rest=side();
  for(const u of B.units){ const s=u.fx.length?hit:rest; s.n++; if(u.x>ZEPS) s.ate++; if(s.lo==null||u.x<s.lo) s.lo=u.x; if(s.hi==null||u.x>s.hi) s.hi=u.x; }
  return {b,hit,rest,left:B.left,n:B.n}; }
/* ---------- the mark: the amount that leaves the fewest meals or days on the wrong side of it ----------
   A mark is read one of two ways. Up: the entries with the effect are at the mark or over, the others under it. Down: the reverse, for an
   effect that comes with less of a thing. On the wrong side is an entry that sits where the other kind belongs. The mark is one of the
   amounts the person had, never the lowest of them (something has to sit under it). Every amount is tried both ways; the reading with the
   fewest on the wrong side is kept, the lowest amount first and "up" before "down" when several do as well. A mark at the very top or the
   very bottom separates nothing: it leaves one whole side wrong. So a mark is kept only when it leaves fewer on the wrong side than the
   smaller of the two sides. hitIn and restIn: how many of each kind are on their own side. Nothing is tested and nothing is averaged. */
function split(units){ let nHit=0, nRest=0; const v=u=>u.x>ZEPS?u.x:0; for(const u of units){ if(u.fx.length) nHit++; else nRest++; }
  let best={at:null,below:null,dir:null,wrong:Math.min(nHit,nRest),hitIn:0,restIn:0,nHit,nRest}; if(!nHit||!nRest) return best;
  /* one pass over the entries in the order of their amounts: at each new amount, how many of each kind sit under it is already known */
  const a=units.map(u=>[v(u),u.fx.length>0]).sort((p,q)=>p[0]-q[0]); let hb=0, rb=0, prev=null;
  for(let i=0;i<a.length;){ const c=a[i][0];
    if(prev!==null){ const up=nHit-hb, under=rb, wUp=nHit-up+nRest-under, wDown=up+under;   /* below: the next amount down, so the mark can be drawn between the two */
      if(wUp<best.wrong) best={at:c,below:prev,dir:'up',wrong:wUp,hitIn:up,restIn:under,nHit,nRest};
      if(wDown<best.wrong) best={at:c,below:prev,dir:'down',wrong:wDown,hitIn:nHit-up,restIn:nRest-under,nHit,nRest}; }
    for(;i<a.length&&a[i][0]===c;i++){ if(a[i][1]) hb++; else rb++; } prev=c; }
  return best; }
/* every line with its entries and its mark, in the order the tab shows them: first the lines with a mark, by the share of their entries on the
   wrong side of it; then the lines with none. Ties, and the lines with no mark, keep the fixed order. This holds from the first meal on. */
/* a clear mark: more than half of the entries with the effect are on their side of it, and more than half of those without on theirs */
const clear=s=>s.at!=null&&s.hitIn*2>s.nHit&&s.restIn*2>s.nRest;
function rows(I,mode,sel,all){ const out=[]; let i=0;
  for(const [f,ks] of FAMS) for(const b of ks){ const B=bar(I,b,mode,sel,all); out.push({b,f,i:i++,units:B.units,max:B.max,w:B.w,left:B.left,n:B.n,any:B.units.some(u=>u.x>ZEPS),s:split(B.units)}); }
  for(const r of out) r.clear=clear(r.s);
  return out.sort((p,q)=>{ const a=p.s.at==null, c=q.s.at==null; if(a||c) return a-c||p.i-q.i; return p.s.wrong/p.n-q.s.wrong/q.n||p.i-q.i; }); }
function table(I,mode,sel,all){ return FAMS.map(([f,ks])=>({f,rows:ks.map(b=>line(I,b,mode,sel,all))})); }
/* eaten together: three or more portions of the aged and fermented foods, and alcohol with one of them */
/* how many of the compounds a meal or a day held: alcohol, caffeine, histamine food and each of the other compounds, one each */
const GROUPS=['alc'].concat(COMPS.filter(k=>NUTR.indexOf(k)<0)), MANY=5;
const groups=am=>GROUPS.reduce((t,k)=>t+(am[k]>ZEPS?1:0),0)+(am.histN>0?1:0);
function together(I,mode,sel,all){ const A=bar(I,'histN',mode,sel,all).units, alc={}, cnt={}; for(const u of bar(I,'alc',mode,sel,all).units) alc[u.id]=u.x;
  for(const k of I.keys){ const d=I.D[k]; if(mode==='day') cnt[k]=groups(d.tot); else for(const m of d.meals) cnt[m.e.id]=groups(m.am); }
  const three={hit:0,rest:0}, both={hit:0,rest:0}, many={hit:0,rest:0}; let nHit=0, nRest=0;
  for(const u of A){ const k=u.fx.length?'hit':'rest'; if(k==='hit') nHit++; else nRest++; if(u.x>=3) three[k]++; if(u.x>0&&alc[u.id]>ZEPS) both[k]++; if(cnt[u.id]>=MANY) many[k]++; }
  return {nHit,nRest,three,both,many}; }

/* rule 9: the app puts no number on luck. One amount's exact test misled a person who looks at a hundred amounts, and a test that counted them all
   (whole days dealt again) was unfair to a person who tests one thing at a time and blind to what repeats every day. The lists give counts on both sides. */

/* ---------- rules 2, 4 and 7: one food, by the amount eaten that day ----------
   An effect counts only if it was reported after the food. It lands in one of three rows: same day, that night, next day.
   The days without the food stay on screen. */
function foodReading(I,key,mine){ const rows={}, without={n:0,fx:{}}; let times=0, clean=0, wait=0;
  for(const k of I.keys){ const d=I.D[k]; if(!d.closed) continue;
    let q=0,t0=null,others=true; for(const m of d.meals) for(const it of m.e.items){ if(it.key===key){ q+=it.q; if(t0==null||m.e.t<t0) t0=m.e.t; } else if(mine&&!mine.has(it.key)) others=false; }
    /* wait: a complete day with the food whose next day is not over. It is not read yet, like any day (dayDone). */
    if(!dayDone(I,k)){ if(q) wait++; continue; }
    /* a day without the food is read over the same span as a day with it: that day, that night, and the next day */
    const nx=I.D[keyAdd(k,1)], nxc=nx?nx.fx.filter(e=>e.c!=='sleep').map(e=>e.c):[];
    /* nothing reported for the day after, and no effect here: the day is not settled, with the food or without it */
    if(!told(I,k)&&!d.fx.length){ if(q) wait++; continue; }
    if(!q){ without.n++; for(const c of new Set(d.fx.map(e=>e.c).concat(nxc))) without.fx[c]=(without.fx[c]||0)+1; continue; }
    times++; if(others) clean++;
    const r=rows[q]||(rows[q]={q,n:0,k:0,same:{},night:{},next:{},any:{}}); r.n++;
    const seen=new Set(), put=(o,c)=>{ o[c]=(o[c]||0)+1; seen.add(c); };
    for(const c of new Set(d.fx.filter(e=>e.c!=='sleep'&&e.t>=t0).map(e=>e.c))) put(r.same,c);
    if(d.fx.some(e=>e.c==='sleep')) put(r.night,'sleep');
    for(const c of new Set(nxc)) put(r.next,c);
    if(seen.size) r.k++; for(const c of seen) r.any[c]=(r.any[c]||0)+1; }
  const list=Object.values(rows).sort((a,b)=>a.q-b.q);
  return {key,times,clean,rows:list,without,wait}; }

/* ---------- Home: what went in and what came out, over one period ---------- */
const PERIODS={today:1,week:7,month:30};
function inPeriod(I,per){ const T=dayKey(I.now,I.roll), n=PERIODS[per], ks=[]; for(let i=n-1;i>=0;i--) ks.push(keyAdd(T,-i)); return ks; }
function went(I,per){ const a=ZERO(); let days=0, meals=0; const ks=inPeriod(I,per);
  for(const k of ks){ const d=I.D[k]; if(d&&d.meals.length){ addInto(a,d.tot); days++; meals+=d.meals.length; } }
  return {am:a,days,meals}; }
function reportedDays(I){ let n=0; for(const k of I.keys) if(I.D[k].closed) n++; return n; }

/* ---------- the pie: by grams, so every slice is a share of one whole ---------- */
const SLICES=['fat','prot','cplx','lact','sugo','fib','unk'];      /* grams of food; alcohol has its own line beside caffeine */
function pie(am){ const g=SLICES.map(k=>[k,am[k]||0]).filter(x=>x[1]>=0.05); const tot=g.reduce((s,x)=>s+x[1],0); if(!tot) return {tot:0,slices:[]};
  /* whole percents that add up to exactly 100: round down, then hand the leftover points to the largest remainders */
  const raw=g.map(([k,v])=>({k,g:v,p:v/tot*100})); let used=0; for(const s of raw){ s.pct=Math.floor(s.p); used+=s.pct; }
  const order=raw.slice().sort((a,b)=>(b.p-b.pct)-(a.p-a.pct)); for(let i=0;i<100-used;i++) order[i%order.length].pct++;
  return {tot,slices:raw}; }

/* the vitamins and minerals in the food table, in its order. Their reference amounts come from shared/nutrition.js (0.5.2). */
const MICRO=['ca','fe','mg','k','zn','c','b1','b2','b3','b6','fol','b12','d','vk','va','mn','cu','e','se'];

/* ---------- the import: the Food Trial Log's lists, read from its saved data (same browser) or from its backup file.
   Its own rules are copied here so its file is never changed; a test compares the two on saved examples. ---------- */
function gutBase(o){ const F=o.fast; if(!F) return []; const b=new Set(o.base0||[]), ops=[];
  for(const c of o.cuts||[]) if(c.d>=F.start) ops.push({at:c.at,del:c.key});
  for(const a of o.adds||[]) if(a.d>=F.start) ops.push({at:a.at,add:a.key});
  for(const t of o.tests||[]) if(t.route==='fast'&&t.res==='none'&&t.d1>=F.start) ops.push({at:t.endAt,add:t.key});
  ops.sort((x,y)=>x.at-y.at); for(const x of ops){ if(x.del) b.delete(x.del); else b.add(x.add); } return [...b]; }
function importGut(o){ if(!o||typeof o!=='object'||!Array.isArray(o.ev)) return null;
  const res={list:[],out:[],aside:[],fine:[],p:{sex:(o.p||{}).sex||null,age:(o.p||{}).age||null,life:((o.p||{}).life||[]).slice()},roll:o.roll||0,route:o.route||null};
  const F=o.fast; if(o.route!=='fast'||!F) return res;
  const bn=gutBase(o), amt=o.amt||{}; res.list=bn.map(key=>({key,q:amt[key]||1}));
  /* "rejected" means the food failed a trial. Foods only swapped out or stopped in step 1 are set aside, and not counted. */
  const m=new Map(), hit=(key,d,why)=>{ const r=m.get(key)||{key,d,why,times:0,allergy:false}; r.times++; if(d>=r.d){ r.d=d; r.why=why; } m.set(key,r); };
  const aside=new Map();
  for(const c of (o.cuts||[]).filter(c=>c.d>=F.start)){ if(c.why==='fall') hit(c.key,c.d,'fall'); else if(c.why==='roll') hit(c.key,c.d,'roll'); else aside.set(c.key,{key:c.key,d:c.d,why:c.why==='swap'?'swap':'stop'}); }
  for(const t of (o.tests||[]).filter(t=>t.route==='fast'&&t.d1>=F.start)){ if(t.res==='react') hit(t.key,t.end||t.d1,'react'); if(t.allergy){ const r=m.get(t.key)||{key:t.key,d:t.end||t.d1,why:'react',times:0}; r.allergy=true; m.set(t.key,r); } }
  res.out=[...m.values()].filter(r=>!bn.includes(r.key)).sort((a,b)=>b.d.localeCompare(a.d)||a.key.localeCompare(b.key));
  res.aside=[...aside.values()].filter(r=>!bn.includes(r.key)&&!m.has(r.key));
  const added=(o.adds||[]).filter(a=>a.why==='s2'&&a.d>=F.start&&bn.includes(a.key)).map(a=>a.key);
  res.fine=[...new Set(added.concat((o.tests||[]).filter(t=>t.route==='fast'&&t.res==='none'&&t.d1>=F.start).map(t=>t.key)))].filter(k=>bn.includes(k));
  return res; }
/* what the rejected foods have in common: counts only. The person reads the common denominator. */
function common(outKeys,listKeys,food){ const cnt=(keys)=>{ const c={}; let n=0; for(const k of keys){ const f=food(k); if(!f||f.none) continue; n++; for(const b of f.b||[]) c[b]=(c[b]||0)+1; } return {c,n}; };
  const O=cnt(outKeys), L=cnt(listKeys), rows=[];
  for(const b of Object.keys(O.c)){ const o=O.c[b], l=L.c[b]||0; if(o>=2||(O.n===1&&o===1)) rows.push({b,o,on:O.n,l,ln:L.n,d:o/O.n-(L.n?l/L.n:0)}); }
  rows.sort((a,b)=>b.d-a.d||b.o-a.o);
  const med=(keys,fn)=>{ const v=keys.map(k=>food(k)).filter(f=>f&&!f.none).map(fn).filter(x=>x!=null).sort((a,b)=>a-b); return v.length?v[Math.floor((v.length-1)/2)]:null; };

function searchFoods(q,max){ q=norm(q.trim()); if(!q) return []; const all=FOODS.map(f=>f.key).concat(S.custom.map(c=>'L'+c.id)), hit=[];

function mapGut(R){ const mOf=k=>k[0]==='f'?MERGED[+k.slice(1)]:null, mk=k=>{ const m=mOf(k); return m?'f'+m[0]:k; }, seen=new Set(), list=[];
  for(const x of R.list){ const m=mOf(x.key), key=mk(x.key), q=m?Math.min(8,Math.max(0.5,Math.round(x.q*m[1]*2)/2)):x.q; if(!seen.has(key)){ seen.add(key); list.push({key,q}); } }
  const ded=rows=>{ const s=new Set(); return rows.map(r=>Object.assign({},r,{key:mk(r.key)})).filter(r=>!seen.has(r.key)&&!s.has(r.key)&&s.add(r.key)); };

/* ---------- Threshold: the data view. Pick an effect; read what was eaten for the meals or days it was reported for, beside all the others.
   Nothing is averaged and nothing is coloured: a range is the lowest and the highest amount, and "2 of 9" is how many held any. ---------- */
function rnum(x,w){ const d=w>=1?(Math.abs(w%1)>1e-9?1:0):(Math.round(w*100)%10?2:1); return (+x.toFixed(d)).toLocaleString(LOC(),{maximumFractionDigits:d}); }

const leftWhy=b=>b==='fib'?L('a fibre supplement with no figure, or a food with no numbers','un supplément de fibres sans chiffre, ou un aliment sans chiffres'):b==='hist'?L('a histamine food with no figure, or a food with no numbers','un aliment à histamine sans chiffre, ou un aliment sans chiffres'):b==='cplx'||b==='sug'?L('carbs of a kind not listed, or a food with no numbers','des glucides de sorte non indiquée, ou un aliment sans chiffres'):L('a food with no numbers','un aliment sans chiffres');
function stepCount(B,s){ return B.mode==='day'?L(`${s.n} ${unitWord('day',s.n)}, effects reported for ${s.k}`,`${s.n} ${unitWord('day',s.n)}, effets notés pour ${s.k}`):L(`${s.n} ${unitWord('meal',s.n)}, effects after ${s.k}`,`${s.n} repas, effets après ${s.k}`); }
const leftWhy2=b=>b==='caf'?L('a caffeine pill with no figure, or a food with no numbers','une pilule de caféine sans chiffre, ou un aliment sans chiffres')
  :E.PARENT[b]==='sug'&&b!=='lact'||b==='fruc'?L('sugars of a kind not listed, or a food with no numbers','des sucres de sorte non indiquée, ou un aliment sans chiffres')
  :E.PARENT[b]==='fat'?L('a fat whose kinds aren’t listed, or a food with no numbers','un gras dont les sortes ne sont pas indiquées, ou un aliment sans chiffres')
  :b==='tyr'?L('a tyramine food with no figure, or a food with no numbers','un aliment à tyramine sans chiffre, ou un aliment sans chiffres')
  :b==='sorb'||b==='mann'?L('a food whose polyols aren’t split, or a food with no numbers','un aliment dont les polyols ne sont pas séparés, ou un aliment sans chiffres')
  :b==='na'||b==='se'||b==='ox'||b==='pur'?L('a food with no figure for it, or a food with no numbers','un aliment sans chiffre pour celui-ci, ou un aliment sans chiffres'):leftWhy(b);
const isP=b=>BARN[b][2]==='p', pw=x=>x===1?'portion':'portions';
function stepRange(B,s){ const u=isP(B.b)?null:BARN[B.b][2], t=x=>rnum(x,B.w)+' '+(u||pw(x));
  return s.i<0?(u?U(0,u,0):L('none of it','aucune portion')):s.i===0?L('up to ','jusqu’à ')+t(s.hi):rnum(s.lo,B.w)+L(' to ',' à ')+t(s.hi); }
const selOf=()=>S.tsel||[];
const selName=(sel,all)=>sel.length?sel.map(fxLow).join(all?L(' and ',' et '):L(' or ',' ou ')):L('any effect','tout effet');
function fxSeen(I){ const n={}; for(const k of I.keys) for(const e of I.D[k].fx) n[e.c]=(n[e.c]||0)+1; return Object.keys(n).sort((a,b)=>n[b]-n[a]||a.localeCompare(b)); }
const fnum=x=>{ const d=x<1?2:x<10?1:0; return (+x.toFixed(d)).toLocaleString(LOC(),{maximumFractionDigits:d}); };
const ofTxt=(a,n)=>n?a+' '+L('of','sur')+' '+n:'–';
/* one side of a line: the share of its meals or days that held any of it, and how many that is. Nothing is averaged. */
function presTxt(a,n){ if(!n) return '–'; const p=Math.round(100*a/n); return `<b>${L(p+'%',p+' %')}</b><small>${ofTxt(a,n)}</small>`; }
function foodDays(I){ const n={}; for(const k of I.keys){ const seen=new Set(); for(const m of I.D[k].meals) for(const it of m.e.items) seen.add(it.key); for(const key of seen) n[key]=(n[key]||0)+1; } return n; }

function twinHTML(h){ return `<div class="twin"><label class="small muted" for="tWin">${L('The amount in one meal, and the effects you reported in','La quantité dans un repas, et les effets que tu as notés dans')} <b id="tWinTxt">${hrsAfter(h)}</b>.</label><input type="range" id="tWin" data-in="twin" min="1" max="8" step="1" value="${h}" aria-valuetext="${hrsWord(h)}"><div class="ends" aria-hidden="true">${E.WINS.map(x=>`<span>${x}</span>`).join('')}</div></div>`; }
/* ---------- the dots: one row for each line. Every counted meal or day is a dot, placed by its amount: filled if the picked effects were
   reported for it, empty if not. The mark, when a line has one, stands just left of the dots at its amount. Nothing is coloured. ---------- */
const DW=300, DL=6, DH=18, PILE=8;
/* where a dot sits in the height of its lane: the same place every time for the same entry, so the picture does not move between two looks */
function jit(i){ let h=Math.imul(i+1,2654435761)>>>0; h^=h>>>15; h=Math.imul(h,2246822519)>>>0; h^=h>>>13; return (h>>>0)/4294967296; }
const dotX=(r,x)=>DL+(DW-2*DL)*Math.min(1,(x>E.ZEPS?x:0)/(r.max>0?r.max:1));
/* the mark is drawn left of the dots at its amount and right of the dots at the next amount down: no dot's centre is on the wrong side of the line */
const markX=r=>r.s.at==null?null:dotX(r,r.s.at)-Math.min(3.6,(dotX(r,r.s.at)-dotX(r,r.s.below||0))/2);
function dotSvg(r,label){ const X=x=>dotX(r,x); let a='', b='';

  /* Each lane is one shape, a circle for each entry, so a year of entries is two elements a row and not thousands. A pile is drawn with at
     most PILE circles: past that they cover one another and the column looks the same. data-n holds how many entries the lane has, and
     data-p where they are: each amount's place, with how many sit there when it is more than one. */
  const pa=[], pb=[];
  for(const k of Object.keys(pile)){ const hit=k[0]==='h', y0=hit?0:DH+4, ids=pile[k], cx=k.slice(1), n=ids.length, m=Math.min(n,PILE), r=hit?2.7:2.3; let c='';
    for(let j=0;j<m;j++){ const cy=n===1?y0+4+jit(ids[0])*(DH-8):y0+3+(j+.5)*(DH-6)/m; c+=`M${(+cx-r).toFixed(1)} ${cy.toFixed(1)}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`; }
    if(hit){ a+=c; pa.push(n>1?cx+':'+n:cx); } else { b+=c; pb.push(n>1?cx+':'+n:cx); } }

function conclHTML(k){ return `<label class="small" for="cIn" style="display:block;margin-top:14px"><b>${L('My conclusion','Ma conclusion')}</b></label><input id="cIn" class="sel wide" data-in="concl" data-k="${esc(k)}" value="${esc(S.concl[k]||'')}" maxlength="200" placeholder="${L('In your own words','Dans tes mots')}" autocomplete="off"><p class="mine">${MINE()}</p>`; }
/* the foods a step's amount came from: for each, the meals or days it was in, and how much of the amount it brought */
function stepFoods(B,s){ if(s.i<0) return []; const I=IX(), ids=new Set(s.ids), agg={};
  for(const k of I.keys) for(const m of I.D[k].meals){ const unit=B.mode==='day'?k:m.e.id; if(!ids.has(unit)) continue;
    for(const it of m.e.items){ const x=E.amounts(food(it.key),it.q)[B.b]; if(!(x>0)) continue; const a=agg[it.key]||(agg[it.key]={key:it.key,x:0,u:new Set()}); a.x+=x; a.u.add(unit); } }
  return Object.values(agg).sort((a,b)=>b.x-a.x).slice(0,5); }
/* every food the row came from, over all the counted meals or days that held some of it: the ones it was in most often first */
function lineFoods(B){ const s={i:0,ids:B.units.filter(u=>u.x>E.ZEPS).map(u=>u.id)}, I=IX(), ids=new Set(s.ids), agg={};
  for(const k of I.keys) for(const m of I.D[k].meals){ const unit=B.mode==='day'?k:m.e.id; if(!ids.has(unit)) continue;
    for(const it of m.e.items){ const x=E.amounts(food(it.key),it.q)[B.b]; if(!(x>0)) continue; const a=agg[it.key]||(agg[it.key]={key:it.key,x:0,u:new Set()}); a.x+=x; a.u.add(unit); } }
  return Object.values(agg).sort((a,b)=>b.u.size-a.u.size||b.x-a.x||fname(food(a.key)).localeCompare(fname(food(b.key)))); }
const FOODS_SHOWN=8;
/* one line, opened: every amount, with how many meals or days sat on each side, and the foods it came from. Tap an amount for its share of each side and its own foods. */
function rowSheet(keep){ const u=UI.rs, sel=selOf(), al=sel.length>1&&S.tall!==false, B=E.bar(IX(),u.b,S.tmode,sel,al), all=[B.zero].concat(B.steps).filter(s=>s.n>0), N=B.n, K=all.reduce((t,s)=>t+s.k,0);
  const [en,fr]=BARN[u.b], uw=n=>unitWord(B.mode,n), cur=u.i==null?null:all.find(s=>s.i===u.i)||null; let more='';
  if(cur){ const from=stepFoods(B,cur), kinds=Object.entries(cur.fx).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
    more=`<p class="small" style="margin:10px 0 0" id="stepLine"><b>${cap(stepRange(B,cur))}</b>${COL()}${L(`${cur.k} of the ${K} with, ${cur.n-cur.k} of the ${N-K} without.`,`${cur.k} des ${K} avec, ${cur.n-cur.k} des ${N-K} sans.`)}</p>
    ${kinds.length?`<p class="small muted" style="margin:6px 0 0">${kinds.map(([c,n])=>esc(fxLow(c))+' '+n).join(' · ')}</p>`:''}
    ${from.length?`<p class="small" style="margin:12px 0 0"><b>${L('The foods it came from','Les aliments qui en contenaient')}</b></p><ul class="evs">${from.map(a=>`<li><button type="button" class="lnk" data-act="foodrd" data-v="${esc(a.key)}">${esc(fname(food(a.key)))}</button> · ${a.u.size} ${uw(a.u.size)} · ${amtTxt(u.b,a.x)}</li>`).join('')}</ul>`:''}`; }
  showSheet(`<h3 id="sheetTitle">${L(en,fr)}</h3>
  <p class="small muted" style="margin:0 0 8px">${B.mode==='meal'?L(`After a meal: effects reported in ${hrsAfter(thrH())}.`,'Après un repas : effets notés dans '+hrsAfter(thrH())+'.'):L('Over a day: effects reported that day, that night and the next day.','Sur une journée : effets notés ce jour-là, cette nuit-là et le lendemain.')}</p>
  ${N?`<p style="margin:0"><b>${esc(cap(selName(sel,al)))}${COL()}${K} ${L('of','sur')} ${N} ${uw(N)}</b></p>
  ${(F=>F.length?`<p class="small" style="margin:10px 0 6px"><b>${B.mode==='day'?L('The foods it came from, and on how many days','Les aliments qui en contenaient, et pendant combien de journées'):L('The foods it came from, and in how many meals','Les aliments qui en contenaient, et dans combien de repas')}</b></p><div class="gtabs" id="lineFoods">${(u.allf?F:F.slice(0,FOODS_SHOWN)).map(a=>`<button type="button" data-act="foodrd" data-v="${esc(a.key)}">${esc(fname(food(a.key)))} · ${a.u.size}</button>`).join('')}</div>${F.length>FOODS_SHOWN&&!u.allf?`<p style="margin:2px 0 0"><button type="button" class="lnk" data-act="rsall">${L(`Show all ${F.length}`,`Tout afficher (${F.length})`)}</button></p>`:''}`:'')(lineFoods(B))}
  <table class="cov rws" id="rowSteps"><thead><tr><th scope="col" style="text-align:left">${L('Amount','Quantité')}</th>${sideHead(B.mode,K,N-K)}</tr></thead><tbody>${all.map(s=>`<tr><th scope="row"><button type="button" class="rowb" data-act="rstep" data-v="${s.i}" aria-pressed="${u.i===s.i}">${stepRange(B,s)}</button></th><td>${s.k}</td><td>${s.n-s.k}</td></tr>`).join('')}</tbody></table>
  ${more||`<p class="small muted" style="margin:0">${L('Tap an amount for the foods of that amount alone.','Appuie sur une quantité pour voir les aliments de cette quantité seulement.')}</p>`}${luckNote(B.mode)}`
    :`<p class="small muted">${L('Nothing counted yet.','Rien de compté pour l’instant.')}</p>`}
  ${B.left?`<p class="small muted" style="margin:10px 0 0">${L(`${B.left} ${uw(B.left)} left out`,`${B.left} ${uw(B.left)} laissé${B.mode==='day'?'e':''}${B.left>1?'s':''} de côté`)}${COL()}${leftWhy2(u.b)}.</p>`:''}
  ${INFO[u.b]?`<p style="margin:10px 0 0"><button type="button" class="lnk" data-act="comp" data-v="${u.b}">${L('What it is, and where the figure comes from','Ce que c’est, et d’où vient le chiffre')}</button></p>`:''}
  ${conclHTML(u.b)}`,keep); }

  alc:['The alcohol in beer, wine and spirits, in grams.','L’alcool de la bière, du vin et des spiritueux, en grammes.','Broken down in the liver.','Décomposé dans le foie.'].concat(HC),
  caf:['The stimulant in coffee, tea, colas, energy drinks and chocolate.','Le stimulant du café, du thé, des colas, des boissons énergisantes et du chocolat.','Broken down in the liver.','Décomposée dans le foie.','Health Canada, Canadian Nutrient File, 2015. Branded cans: the figure on the label.','Santé Canada, Fichier canadien sur les éléments nutritifs, 2015. Canettes de marque : le chiffre de l’étiquette.'],
  theo:['A stimulant in cocoa, milder than caffeine.','Un stimulant du cacao, plus doux que la caféine.','Broken down in the liver.','Décomposée dans le foie.'].concat(HC),
  nit:['Nitrate that vegetables take up from the soil. Leafy ones and beets hold the most.','Le nitrate que les légumes tirent du sol. Les légumes-feuilles et les betteraves en contiennent le plus.','Passed out by the kidneys.','Éliminé par les reins.','Estimated: the serving’s weight times the median for the vegetable, EFSA Journal 2008;689.','Estimé : le poids de la portion multiplié par la médiane du légume, EFSA Journal 2008;689.'],
  ox:['A plant acid. Spinach holds the most by far, then beets, potatoes, baked beans and nuts.','Un acide des plantes. L’épinard en contient de loin le plus, puis les betteraves, les pommes de terre, les fèves au lard et les noix.','Passed out by the kidneys.','Éliminés par les reins.','Measured, mg per serving: the Harvard oxalate list, Kidney Stone Diet, version 2.3.1 (its 2023 revision, else its original list), converted to the app’s serving by weight. A food the list doesn’t name has no figure. Water, sugar and oils count as none.','Mesuré, en mg par portion : la liste d’oxalates de Harvard, Kidney Stone Diet, version 2.3.1 (sa révision de 2023, sinon sa liste originale), convertie à la portion de l’app selon le poids. Un aliment que la liste ne nomme pas n’a pas de chiffre. L’eau, le sucre et les huiles comptent pour zéro.'],
  ga:['Solanine and chaconine, which the potato plant makes. Green skin and sprouts hold the most.','La solanine et la chaconine, que fabrique le plant de pomme de terre. La pelure verte et les germes en contiennent le plus.','Leaves the body slowly, over a day or more.','Quittent le corps lentement, en une journée ou plus.','EFSA Journal 2020;18(8):6222. Potato foods only. The amount varies many times over between one potato and the next.','EFSA Journal 2020;18(8):6222. Aliments à base de pomme de terre seulement. La quantité varie énormément d’une pomme de terre à l’autre.'],
  cap:['What makes chili peppers hot.','Ce qui rend les piments forts.','Part of it passes through the gut unchanged.','Une partie traverse l’intestin sans changer.','Counted as portions of spicy foods.','Comptée en portions d’aliments épicés.'],
  fru:['Chains of fructose in wheat, onion and cashews.','Des chaînes de fructose dans le blé, l’oignon et les noix de cajou.'].concat(FERM,MON),

  sorb:['A sugar alcohol in apples and pears.','Un polyol dans les pommes et les poires.'].concat(SLOW,POLY),
  mann:['A sugar alcohol in mushrooms, cauliflower and celery.','Un polyol dans les champignons, le chou-fleur et le céleri.'].concat(SLOW,POLY),
  fruc:['The fructose a food holds beyond its glucose: apple, pear, mango, watermelon, dried fruit and colas.','Le fructose qu’un aliment contient en plus de son glucose : pomme, poire, mangue, melon d’eau, fruits séchés et colas.'].concat(SLOW,['Health Canada, Canadian Nutrient File, 2015: fructose minus glucose.','Santé Canada, Fichier canadien sur les éléments nutritifs, 2015 : le fructose moins le glucose.']),
  na:['Sodium, mostly from salt.','Le sodium, surtout du sel.','Passed out by the kidneys.','Éliminé par les reins.','Health Canada, Canadian Nutrient File, 2015. A label food: the figure on its label.','Santé Canada, Fichier canadien sur les éléments nutritifs, 2015. Un aliment d’étiquette : le chiffre de l’étiquette.'],
  se:['A mineral. Brazil nuts, seafood, organ meats and eggs hold the most.','Un minéral. Les noix du Brésil, les fruits de mer, les abats et les œufs en contiennent le plus.','Passed out mostly by the kidneys.','Éliminé surtout par les reins.','The food table the Nutrition tab uses: Health Canada’s Canadian Nutrient File, 2015, blanks from the USDA.','Le tableau d’aliments de l’onglet Nutrition : Fichier canadien sur les éléments nutritifs de Santé Canada, 2015, les blancs de l’USDA.'],
  sulph:['Preservatives in wine, beer, dried fruit and some prepared foods.','Des agents de conservation dans le vin, la bière, les fruits séchés et certains aliments préparés.','Broken down by an enzyme in the liver.','Décomposés par une enzyme du foie.','Health Canada’s list of foods that often contain sulphites.','La liste de Santé Canada des aliments qui contiennent souvent des sulfites.'],
  nitr:['Nitrite added to cured meat: bacon, ham, wieners, salami and jerky.','Du nitrite ajouté aux charcuteries : bacon, jambon, saucisses, salami et charqui.','Changed to nitrate in the body, then passed out by the kidneys.','Changé en nitrate dans le corps, puis éliminé par les reins.','Cured meats, by their ingredient lists. Brands vary.','Les charcuteries, selon leur liste d’ingrédients. Ça varie selon la marque.'],
  flav:['On a label: “natural flavour”, “flavour” or “artificial flavour”. A flavouring is a preparation, not one substance.','Sur une étiquette : « arôme naturel », « arôme » ou « arôme artificiel ». Un arôme est une préparation, pas une seule substance.',
    'What it can hold','Ce qu’il peut contenir','The substances that give the taste, and a liquid that carries them. The carriers Canada permits in a flavour include ethanol, glycerol, propylene glycol, triacetin and benzyl alcohol.','Les substances qui donnent le goût, et un liquide qui les porte. Les liquides porteurs que le Canada permet dans un arôme comprennent l’éthanol, le glycérol, le propylèneglycol, la triacétine et l’alcool benzylique.',
    'What the label leaves out','Ce que l’étiquette ne dit pas','Canada’s rules let a label name the preparation without listing what is in it. Still named when the preparation holds them: salt, glutamate, hydrolyzed plant protein, aspartame, potassium chloride, gluten sources, sulphites at 10 parts per million or more, anything that does a job in the finished food, and the foods a Canadian label always has to name, such as milk, egg, peanut, wheat and soy.','Les règles du Canada permettent à une étiquette de nommer la préparation sans énumérer ce qu’elle contient. Restent nommés quand la préparation en contient : le sel, le glutamate, les protéines végétales hydrolysées, l’aspartame, le chlorure de potassium, les sources de gluten, les sulfites à 10 parties par million ou plus, tout ce qui joue un rôle dans l’aliment fini, et les aliments qu’une étiquette canadienne nomme toujours, comme le lait, les œufs, les arachides, le blé et le soya.',
    'One product and another','D’un produit à l’autre','Two products that both list “natural flavour” can hold different preparations: different substances, different carriers, different amounts. What you report after one says nothing about another. This row counts them all together, because a label gives nothing more to go by. To read one product by itself, add it from its label and look it up on the Threshold tab.','Deux produits qui indiquent tous les deux « arôme naturel » peuvent contenir des préparations différentes : d’autres substances, d’autres liquides porteurs, d’autres quantités. Ce que tu notes après l’un ne dit rien sur l’autre. Cette ligne les compte tous ensemble, parce qu’une étiquette ne donne rien de plus. Pour lire un seul produit, ajoute-le selon son étiquette et cherche-le dans l’onglet Seuil.',
    'Where the count comes from','D’où vient le compte','Portions, with no amount. The table tags drinks by their kind, not from a label: colas, energy drinks, the ready-to-drink protein shake and flavoured sparkling water. Other foods in the table can list a flavour too, depending on the brand. The table has no ingredient lists, so it can’t say which. A food added from its label counts when “A flavour” is ticked. Sources: Food and Drug Regulations, section B.01.009; Health Canada, List of Permitted Solvents; Canadian Food Inspection Agency, labelling rules for ingredient lists.','En portions, sans quantité. Le tableau marque des boissons selon leur sorte, pas selon une étiquette : les colas, les boissons énergisantes, la boisson protéinée prête à boire et l’eau pétillante aromatisée. D’autres aliments du tableau peuvent aussi indiquer un arôme, selon la marque. Le tableau n’a pas de listes d’ingrédients, alors il ne peut pas dire lesquels. Un aliment ajouté selon son étiquette compte quand « Un arôme » est coché. Sources : Règlement sur les aliments et drogues, article B.01.009; Santé Canada, liste des solvants autorisés; Agence canadienne d’inspection des aliments, règles d’étiquetage des listes d’ingrédients.'],
  swt:['Sweeteners with few calories or none, in diet drinks and sugar-free foods.','Des édulcorants avec peu ou pas de calories, dans les boissons diète et les aliments sans sucre.','It depends on the sweetener.','Ça dépend de l’édulcorant.'].concat(FTLTAG),
  glu:['A protein in wheat, barley and rye.','Une protéine du blé, de l’orge et du seigle.','Digested only in part.','Digéré en partie seulement.'].concat(FTLTAG),
  pur:['Compounds in the cells of meat, fish and plants. Organ meats and some fish hold the most.','Des composés des cellules de la viande, du poisson et des plantes. Les abats et certains poissons en contiennent le plus.','Broken down to uric acid, which the kidneys pass out.','Décomposées en acide urique, que les reins éliminent.','Measured, mg per 100 g, times the serving’s weight: the USDA and NIH Database for the Purine Content of Foods, 2023, the total of its four purine bases, North American samples first. A food it doesn’t name has no figure. Water, sugar and oils count as none.','Mesuré, en mg par 100 g, multiplié par le poids de la portion : la base de données de l’USDA et des NIH sur la teneur en purines des aliments, 2023, le total de ses quatre bases puriques, les échantillons nord-américains d’abord. Un aliment qu’elle ne nomme pas n’a pas de chiffre. L’eau, le sucre et les huiles comptent pour zéro.']};
const carried=(f,k)=>!!f&&!f.none&&(k==='hist'?!!f.h:k==='alc'?f.alc>0:!!(f.c&&f.c[k]));
function compSheet(back){ const k=UI.cp, inf=INFO[k], I=IX(), n=foodDays(I), foods=Object.keys(n).filter(key=>carried(food(key),k)).sort((a,b)=>n[b]-n[a]).slice(0,8), dw=x=>L(x===1?'day':'days',x===1?'journée':'journées');
  showSheet(`<h3 id="sheetTitle">${L(BARN[k][0],BARN[k][1])}</h3><p style="margin:0 0 8px">${L(inf[0],inf[1])}</p>
  ${k==='flav'?[2,6,10,14].map(i=>`<p class="small" style="margin:0 0 6px"><b>${L(inf[i],inf[i+1])}</b>${COL()}${L(inf[i+2],inf[i+3])}</p>`).join(''):`<p class="small" style="margin:0 0 6px"><b>${L('How the body clears it','Comment le corps l’élimine')}</b>${COL()}${L(inf[2],inf[3])}</p>
  <p class="small" style="margin:0 0 6px"><b>${L('Where the figure comes from','D’où vient le chiffre')}</b>${COL()}${L(inf[4],inf[5])}</p>`}
  ${back?`<div class="row" style="margin-top:12px"><button type="button" class="btn sm" data-act="lbback">${L('Back to the label','Retour à l’étiquette')}</button></div>`:foods.length?`<p class="small" style="margin:12px 0 0"><b>${L('In your log','Dans ton journal')}</b></p><ul class="evs">${foods.map(key=>`<li><button type="button" class="lnk" data-act="foodrd" data-v="${esc(key)}">${esc(fname(food(key)))}</button> · ${n[key]} ${dw(n[key])}</li>`).join('')}</ul>`:`<p class="small muted" style="margin:12px 0 0">${L('Not in your log yet.','Pas encore dans ton journal.')}</p>`}
  ${back?'':`<p style="margin:6px 0 0"><button type="button" class="lnk" data-act="rowsheet" data-k="${k}">${L('Every amount, beside what you reported','Chaque quantité, à côté de ce que tu as noté')}</button></p>`}
  ${k==='hist'?`<p style="margin:0"><button type="button" class="lnk" data-act="histinfo">${L('The histamine foods in this period','Les aliments à histamine de cette période')}</button></p>`:''}
  <p class="mine">${MINE()}</p>`); }
function compsSheet(){ const am=E.went(IX(),S.nper).am;
  const fams=E.FAMS.slice(2).map(([f,ks])=>{ const rows=ks.filter(k=>held(am,k)); return rows.length?`<p class="small" style="margin:12px 0 0"><b>${L(FAMN[f][0],FAMN[f][1])}</b></p><ul class="key" style="margin-top:2px">${rows.map(k=>compRow(k,am)).join('')}</ul>`:''; }).join('');
  showSheet(`<h3 id="sheetTitle">${L('Other compounds','Autres composés')}</h3><p class="small muted" style="margin:-4px 0 0">${L('What the food you reported in this period carried. Tap a name for what it is.','Ce que contenaient les aliments que tu as notés pendant cette période. Appuie sur un nom pour savoir ce que c’est.')}</p>
  ${fams||`<p class="small muted" style="margin:12px 0 0">${L('Nothing in this period.','Rien pendant cette période.')}</p>`}
  <p class="small muted" style="margin:12px 0 0">${L('≈ means estimated from published averages. Portions where no figure is entered.','≈ veut dire estimé à partir de moyennes publiées. En portions quand aucun chiffre n’est entré.')}</p><p class="mine">${MINE()}</p>`); }
function carriesTxt(f){ const ks=f&&f.c?E.COMPS.filter(k=>f.c[k]):[];
  return ks.length?`<p class="small" style="margin:6px 0 0">${L('It also carries','Il contient aussi')}${COL()}${ks.map(k=>`<button type="button" class="fxt" data-act="comp" data-v="${k}">${L(BARN[k][0],BARN[k][1]).toLowerCase()}</button>${isP(k)?'':' '+amtTxt(k,f.c[k])}`).join(' · ')}.</p>`:''; }

/* ---------- one food: what was reported on the days it was eaten, by the amount eaten that day ---------- */
function holdsTxt(f){ if(!f||f.none) return L('This food has no numbers. A meal with it stays out of the Threshold rows.','Cet aliment n’a pas de chiffres. Un repas qui en contient reste hors des lignes de Seuil.');

function parseBackup(text){ let o; try{ o=JSON.parse(text); }catch(e){ o=null; }
  if(o&&o.app==='food-trial-log'){ toast(L('That is a Food Trial Log backup. Bring it in from the Nutrition tab.','C’est une sauvegarde du Food Trial Log. Importe-la à partir de l’onglet Nutrition.')); return; }
  if(!o||o.app!=='threshold-log'||!o.state||typeof o.state!=='object'||o.state.v!==1||!Array.isArray(o.state.ev)){ toast(L('That isn’t a Threshold Log backup','Ce n’est pas une sauvegarde du Threshold Log')); return; }
  UI.restore=o; showSheet(`<h3 id="sheetTitle">${L('Restore this backup?','Restaurer cette sauvegarde?')}</h3><p>${L(`It’s from ${esc(dShort(o.saved)||'an unknown date')}. Everything on this phone gets replaced by it.`,`Elle date du ${esc(dShort(o.saved)||'(date inconnue)')}. Tout ce qui est sur ce téléphone sera remplacé par elle.`)}</p><button type="button" class="btn primary sm" data-act="dorestore">${L('Replace everything','Tout remplacer')}</button>`); }
