 patCircleHead:'The circle — an example',patCircleText:'A short night calls for caffeine. Caffeine skips the meal and wants sugar. The wired tired wants something to quiet it. Quiet wants a lift. The lift ends in a crash — and the crash steals the next night. Each one fixes the last. Yours may have other links; your incidents will show them.',
 patLeverHead:'The lever — tap through the day',
 patLeverText:'The pivot doesn’t move. You do: every link slides your reasons toward it, so the same Family, Tomorrow and Love weigh less. Near the pivot, piling on more reasons barely moves the beam. What moves it is getting your reasons back out — sleep, a meal, the first link not taken. That’s why Sollum watches the start of the chain, not the end. (An example, not a limit: where you tip is yours.)',

 howBody:`<ul>
<li><b>Twenty words in ten pairs.</b> Each pair has a steady side and a pull side — Tomorrow · Right now, Enough · More, Family · Being left alone. About two minutes of taps. The first round is always the ten pairs; the rest builds your full order.</li>
<li><b>Your normal.</b> From your ordinary days (about a week of them), Sollum learns how you usually choose and how fast. A heavy day, or a day with an incident, never becomes the normal.</li>
<li><b>Three readings, in the order we expect them (not tested yet):</b> the hand rocks — you take longer than usual on a pair; a pair flips — the pull side wins where it almost never does; the scale tips — two levels fall below your normal at once.</li>
<li><b>The chain.</b> Sleep, caffeine, drinks, the thing you’re watching, food. Each heavy one is a link. The more links lit, the closer you sit to the tip — the same drink weighs more on a short night.</li>
<li><b>When something fires</b> you see your own message from a good day, a button to call the person you chose, and your province’s line.</li>
<li><b>Report an incident</b> afterwards: what, when, what it cost. Sollum lines up the hours before (from The Patch, if connected). From three incidents, it compares those days with the others, in your own counts.</li>
<li>A tap under a quarter second is a reflex, not a choice: it’s asked again later. The words blink between pairs for the same reason.</li>
</ul><p class="small">Best taken before the first coffee. It measures; it doesn’t diagnose, and it never tells you how much.</p>`,
 aboutBody:`<p class="small"><b>Made by Tobie and Claude. Free version at v3ktor.org/sollum.</b> Part of the experiment with The Patch (body) and V3KTOR (feeling). True Color Foundation. © 2026 Tobie David.</p>
<p class="small">Sollum is free software: you can use, share and change it under the <a href="https://github.com/tobiedavid/v3ktor.org/blob/main/LICENSE" target="_blank" rel="noopener">GNU Affero General Public License</a>, version 3 or later. If you share a changed version — even just by putting it online for other people — you have to share your changes under the same license. Source code: <a href="https://github.com/tobiedavid/v3ktor.org" target="_blank" rel="noopener">github.com/tobiedavid/v3ktor.org</a></p>
<p class="small">Not a diagnosis, and not medical advice. It shows you a pattern in your own choices; what you do with it is yours.</p>
<p class="small">Everything stays in this browser’s storage on this phone. Nothing is sent anywhere, except what you type in “Improve the app”, and only when you send it. That storage isn’t encrypted: anyone who can unlock the phone can read it. Erase everything in Settings.</p>
<p class="small">The help lines come from the Canadian Centre on Substance Use and Addiction, the provinces’ own pages and Health Canada. Numbers change — the check date is on every card.</p>
<p class="small"><b>Not a doctor.</b> Thinking about ending your life: call or text 9-8-8. Emergency: 911.</p>`,

 patCircleHead:'Le cercle — un exemple',patCircleText:'Une nuit courte appelle la caféine. La caféine saute le repas et veut du sucre. La fatigue sur les nerfs veut quelque chose pour se calmer. Le calme veut un remontant. Le remontant finit en crash — et le crash vole la nuit suivante. Chacun répare le précédent. Le tien a peut-être d’autres maillons; tes incidents vont les montrer.',

 patLeverText:'Le pivot ne bouge pas. C’est toi qui bouges\u00a0: chaque maillon fait glisser tes raisons vers lui, alors la même famille, le même demain et le même amour pèsent moins. Près du pivot, empiler des raisons fait à peine bouger la poutre. Ce qui la fait bouger, c’est de ramener tes raisons vers l’extérieur — dormir, un repas, le premier maillon pas pris. C’est pour ça que Sollum surveille le début de la chaîne, pas la fin. (Un exemple, pas une limite\u00a0: là où tu bascules t’appartient.)',
 patAdd:'Ajouter une raison',patReset:'Les retirer',
 patTake:'Plus tôt tu brises la chaîne, moins ça coûte.',howTitle:'Comment ça marche',aboutTitle:'À propos et confidentialité',improve:'Améliorer l’app',
 howBody:`<ul>
<li><b>Vingt mots en dix paires.</b> Chaque paire a un côté stable et un côté qui tire — Demain · Tout de suite, Assez · Encore, La famille · Qu’on me laisse tranquille. Environ deux minutes de touches. Le premier tour, c’est toujours les dix paires; le reste bâtit ton ordre au complet.</li>
<li><b>Ta normale.</b> À partir de tes journées ordinaires (environ une semaine), Sollum apprend comment tu choisis d’habitude, et à quelle vitesse. Une grosse journée, ou une journée avec un incident, ne devient jamais la normale.</li>
<li><b>Trois lectures, dans l’ordre où on s’attend à les voir (pas encore testé)${NB}:</b> la main hésite — tu prends plus de temps que d’habitude sur une paire; une paire bascule — le côté qui tire gagne là où il ne gagne presque jamais; la balance bascule — deux niveaux tombent sous ta normale en même temps.</li>
<li><b>La chaîne.</b> Le sommeil, la caféine, l’alcool, ce que tu surveilles, la nourriture. Chaque gros morceau est un maillon. Plus il y a de maillons allumés, plus tu es proche du point de bascule — le même verre pèse plus lourd après une nuit courte.</li>
<li><b>Quand quelque chose s’allume,</b> tu vois ton propre message d’un bon jour, un bouton pour appeler la personne que tu as choisie, et la ligne de ta province.</li>
<li><b>Signale un incident</b> après coup${NB}: quoi, quand, ce que ça a coûté. Sollum aligne les heures d’avant (à partir de La Patch, si elle est croisée). À partir de trois incidents, il compare ces journées avec les autres, dans tes propres chiffres.</li>
<li>Une touche de moins d’un quart de seconde, c’est un réflexe, pas un choix${NB}: elle est redemandée plus tard. Les mots clignotent entre les paires pour la même raison.</li>
</ul><p class="small">À faire de préférence avant le premier café. Ça mesure; ça ne diagnostique pas, et ça ne te dit jamais combien.</p>`,
 aboutBody:`<p class="small"><b>Fait par Tobie et Claude. Version gratuite sur v3ktor.org/sollum.</b> Fait partie de l’expérience avec La Patch (le corps) et V3KTOR (le ressenti). True Color Foundation. © 2026 Tobie David.</p>
<p class="small">Sollum est un logiciel libre : tu peux l’utiliser, le partager et le modifier selon la <a href="https://github.com/tobiedavid/v3ktor.org/blob/main/LICENSE" target="_blank" rel="noopener">licence publique générale GNU Affero</a>, version 3 ou plus récente. Si tu partages une version modifiée, même en la mettant seulement en ligne pour d’autres, tu dois partager tes changements sous la même licence. Code source${NB}: <a href="https://github.com/tobiedavid/v3ktor.org" target="_blank" rel="noopener">github.com/tobiedavid/v3ktor.org</a></p>
<p class="small">Ce n’est pas un diagnostic ni un avis médical. Ça te montre un motif dans tes propres choix; ce que tu en fais t’appartient.</p>
<p class="small">Tout reste dans la mémoire de ce navigateur, sur ce téléphone. Rien n’est envoyé nulle part, sauf ce que tu écris dans «${NB}Améliorer l’app${NB}», et seulement quand tu l’envoies. Cette mémoire n’est pas chiffrée${NB}: quiconque peut déverrouiller le téléphone peut la lire. Tout effacer, c’est dans les Réglages.</p>
<p class="small">Les lignes d’aide viennent du Centre canadien sur les dépendances et l’usage de substances, des pages des provinces et de Santé Canada. Les numéros changent — la date de vérification est sur chaque carte.</p>
<p class="small"><b>Pas un médecin.</b> Tu penses à mettre fin à tes jours${NB}: appelle ou texte le 9-8-8. Urgence${NB}: 911.</p>`,

/* ---------- storage ---------- */
const KEY='sollum.v1', SHARED='v3k.days.v1', PATCH_KEY='thepatch.v1';
function defaults(){return {sollum_version:VER,pool_version:POOL_VERSION,lang:(navigator.language||'').toLowerCase().startsWith('fr')?'fr':'en',province:'other',
 setup:{done:false,goals:[],other:'',watch:null,note:'',contact:null},sessions:[],slips:[],connect:{patch:false,v3k:false},patch_paste:null,connect_asked:false}}
let store=load();
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const o=Object.assign(defaults(),JSON.parse(raw));
 if(!Array.isArray(o.sessions))o.sessions=[];if(!Array.isArray(o.slips))o.slips=[];if(!o.connect||typeof o.connect!=='object')o.connect={patch:false,v3k:false};
 if(!o.setup||typeof o.setup!=='object')o.setup=defaults().setup;if(!Array.isArray(o.setup.goals))o.setup.goals=[];if(!PROVS.some(p=>p[0]===o.province))o.province='other';
 o.sollum_version=VER;return o}}catch(e){}return defaults()}
/* 0.6.4: a failed save shows a warning on every screen until saving works again (code review, 8 Nov) */
let saveFail=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));saveFail=false}catch(e){saveFail=true}}
function t(k,...a){const d=I18N[store.lang]||I18N.en;const s=d[k]!==undefined?d[k]:I18N.en[k];return typeof s==='function'?s(...a):(s===undefined?k:s)}
function L(en,fr){return store.lang==='fr'?fr:en}
function P2(a){return store.lang==='fr'?a[1]:a[0]}
function wordOf(id){if(id===WATCH_ID)return store.setup.watch?{id,en:store.setup.watch.en,fr:store.setup.watch.fr,level:null,side:'p'}:null;return POOL.find(p=>p.id===id)||null}
function wname(id){const w=wordOf(id);return w?(w[store.lang]||w.en):id}
function wmid(id){const n=wname(id);return store.lang==='fr'&&/^[A-ZÀ-Ü]/.test(n)&&!/^[A-Z]{2,}/.test(n)?n[0].toLowerCase()+n.slice(1):n}
function activeWords(){const ids=POOL.map(p=>p.id);if(hasGoals()&&store.setup.watch)ids.push(WATCH_ID);return ids}
function twins(){const seen=new Set(),out=[];for(const w of POOL){if(w.side!=='h')continue;const p=POOL.find(x=>x.id===w.twin);if(!p||seen.has(w.id))continue;seen.add(w.id);seen.add(p.id);out.push({h:w.id,p:p.id,level:w.level,key:w.id+'|'+p.id})}return out}
function hasGoals(){return store.setup.done&&store.setup.goals.length>0}
function goalDuels(){const out=[];for(const g of store.setup.goals){const G=GOALS.find(x=>x.id===g);if(!G)continue;G.duels.forEach((d,i)=>out.push({key:g+':'+i,goal:g,h:{en:d[0],fr:d[1]},p:{en:d[2],fr:d[3]}}))}return out}
function chipLabel(c,v){const o=c.opts.find(x=>x[0]===v);return o?(store.lang==='fr'?o[2]:o[1]):''}
function visibleChips(pre){const goals=store.setup.goals;const gchips=new Set(GOALS.filter(g=>goals.includes(g.id)).map(g=>g.chip));
 return CHIPS.filter(c=>{if(c.patchOnly)return !!(pre&&pre[c.id]!=null);if(c.goalOnly)return hasGoals()&&gchips.has('wt');return true})}

/* ---------- helpers ---------- */
const key=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const avg=v=>v.length?v.reduce((a,b)=>a+b,0)/v.length:0;
function stdev(v){if(v.length<2)return 0;const m=avg(v);return Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/(v.length-1))}
function q90(v){if(!v.length)return 0;const s=v.slice().sort((a,b)=>a-b);return s[Math.min(s.length-1,Math.floor(0.9*(s.length-1)))]}
function median(v){if(!v.length)return 0;const s=v.slice().sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
function fmtDate(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function dayWithRoll(roll,d){d=d?new Date(d.getTime()):new Date();const h=d.getHours();if(roll>0&&h<roll)d.setDate(d.getDate()-1);else if(roll<0&&h>=24+roll)d.setDate(d.getDate()+1);return fmtDate(d)}
function shiftDay(s,n){const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d+n);return fmtDate(dt)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sizeClass(label){const n=label.length;return n<=6?'s1':n<=9?'s2':n<=12?'s3':'s4'}
/* 0.6.4: a session remembers which watched word it ranked, so a changed word isn't compared with the old one */
function watchKey(){const w=store.setup.watch;return w?(w.en||'')+'|'+(w.fr||''):''}
function sameWatch(s,w){return w!==WATCH_ID||(s.watchKey!=null&&s.watchKey===watchKey())}
/* 0.6.4: comparisons across days (contrasts, incidents, history) use each day's latest session, the state closest to
   the evening; the normal still uses each day's first ordinary session */
function dayView(sessions){const by={};sessions.slice().sort((a,b)=>a.t_start-b.t_start).forEach(s=>{by[s.date]=s});return Object.values(by).sort((a,b)=>a.t_start-b.t_start)}
function firstPerDay(sessions){const by={};sessions.slice().sort((a,b)=>a.t_start-b.t_start).forEach(s=>{if(!by[s.date])by[s.date]=s});return Object.values(by).sort((a,b)=>a.t_start-b.t_start)}
function orderOf(rank){return Object.keys(rank).sort((a,b)=>rank[a]-rank[b])}
function slipDays(){return new Set(store.slips.map(s=>s.date))}
function joinList(a){const sep=store.lang==='fr'?' et ':' and ';return a.length<=1?(a[0]||''):a.slice(0,-1).join(', ')+sep+a[a.length-1]}

/* ---------- The Patch, read on this phone or from a pasted backup ---------- */
function fromSummary(p){
 const d={};
 if(typeof p.sleep==='number')d.sl=p.sleep<6?'s':p.sleep<8?'m':'l';
 const c=p.caffeine||{};
 if((c.energyDrinks||0)>=1||(c.servings||0)>=3)d.caf='3';else if((c.servings||0)>=1)d.caf='1';else if(p.meals&&p.meals.complete)d.caf='0';
 const a=p.alcohol||{};const n=a.drinks!=null?a.drinks:(a.level==='0'?0:a.level==='low'?1.5:a.level?4:null);
 if(n!=null)d.al=n===0?'0':n<3?'1':'3';
 if(p.crash===true)d.cr='y';else if(p.crash===false)d.cr='n';
 d.sum=p;return d;
}
function patchExtract(P){
 if(!P||typeof P!=='object')return null;
 const S=P.state&&typeof P.state==='object'?P.state:P;
 if(!S.tank&&!S.crashes&&!S.a&&!S.sum)return null;
 const out={};
 if(S.sum&&typeof S.sum==='object'){for(const k in S.sum){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&S.sum[k]&&typeof S.sum[k]==='object')out[k]=fromSummary(S.sum[k])}}
 if(Object.keys(out).length)return {days:out,roll:(S.tank&&typeof S.tank.roll==='number')?S.tank.roll:0};
 const R=(S.tank&&S.tank.rate)||{};
 for(const k in R){const r=R[k];if(!r||typeof r!=='object'||!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;const d=out[k]||(out[k]={});
  if(r.al!=null)d.al=r.al==='0'?'0':r.al==='low'?'1':'3';if(typeof r.s==='number')d.sl=r.s<6?'s':r.s<8?'m':'l';if(r.ed!=null&&+r.ed>0)d.caf='3';
  if(r.fl&&r.fl.cr)d.cr='y';else if(r.fin&&d.cr==null)d.cr='n'}
 (Array.isArray(S.crashes)?S.crashes:[]).forEach(c=>{if(c&&typeof c.day==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(c.day)){const d=out[c.day]||(out[c.day]={});d.cr='y'}});
 return {days:out,roll:(S.tank&&typeof S.tank.roll==='number')?S.tank.roll:0};
}
function sharedPatchDays(){try{const T=JSON.parse(localStorage.getItem(SHARED)||'{}');const out={};let n=0;for(const k in T){if(T[k]&&T[k].patch&&typeof T[k].patch==='object'&&/^\d{4}-\d{2}-\d{2}$/.test(k)){out[k]=fromSummary(T[k].patch);n++}}return n?out:null}catch(e){return null}}
let patchCache=null;
window.addEventListener('storage',e=>{if(e.key===SHARED||e.key===PATCH_KEY){patchCache=null;if(typeof render==='function'&&view!=='pair')render()}});
function patchData(){
 if(!store.connect.patch)return null;
 if(patchCache)return patchCache;
 try{const sh=sharedPatchDays();if(sh){let roll=0;try{const raw=localStorage.getItem(PATCH_KEY);if(raw){const S=JSON.parse(raw);if(S&&S.tank&&typeof S.tank.roll==='number')roll=S.tank.roll}}catch(e){}patchCache={days:sh,roll,src:'live'};return patchCache}}catch(e){}
 try{const raw=localStorage.getItem(PATCH_KEY);if(raw){const x=patchExtract(JSON.parse(raw));if(x){x.src='live';patchCache=x;return x}}}catch(e){}
 if(store.patch_paste&&store.patch_paste.days){patchCache={days:store.patch_paste.days,roll:store.patch_paste.roll||0,src:'paste'};return patchCache}
 return null;
}
function patchLiveCount(){try{const sh=sharedPatchDays();if(sh)return Object.keys(sh).length;const raw=localStorage.getItem(PATCH_KEY);if(!raw)return null;const x=patchExtract(JSON.parse(raw));return x?Object.keys(x.days).length:null}catch(e){return null}}
function sessDay(){const pd=patchData();return dayWithRoll(pd?pd.roll:0)}
function patchChips(date){const pd=patchData();if(!pd)return null;const d=pd.days[date];if(!d)return null;const o={};['caf','al','sl','cr'].forEach(k=>{if(d[k]!=null)o[k]=d[k]});return Object.keys(o).length?o:null}
function patchSum(date){const pd=patchData();return pd&&pd.days[date]&&pd.days[date].sum||null}

/* ---------- session engine: round 1 = the duels, then Swiss rounds with a running Elo ---------- */
let S=null, view='home', ui={showAll:false,showOrder:false,msg:'',resetArmed:false,exportText:'',chips:null,pre:null,pasteText:'',aiAmounts:false,setupStep:0,setupTmp:null,slip:null,slipSaved:null};
function startSession(){
 const words=activeWords();
 S={id:uid(),date:sessDay(),t_start:Date.now(),choices:[],duelPicks:[],goalPicks:[],taps:[],reflex:0,paused:false,r:{},cmp:{},played:new Set(),repeated:new Set(),round:0,roundsTarget:ROUNDS_DEFAULT,queue:[],current:null,lastWords:[],tShown:0,result:null};
 words.forEach(w=>{S.r[w]=0;S.cmp[w]=0});
 nextRound();
}
function nextRound(){
 S.round++;
 let pairs=[];
 if(S.round===1){
  pairs=twins().map(tw=>({pair:[tw.h,tw.p],isDuel:true,key:tw.key}));
  goalDuels().forEach(g=>pairs.push({pair:[g.key+'|h',g.key+'|p'],isGoal:true,goal:g}));
  pairs=shuffle(pairs);
 }else{
  let words=activeWords().slice();
  // odd count: the word with the MOST comparisons so far sits this round out (shift after a descending sort), so the
  // least-compared words always get a partner and the counts stay even. pop() would bench the word that needs it most.
  if(words.length%2){words.sort((a,b)=>(S.cmp[b]-S.cmp[a])||(Math.random()-0.5));words.shift()}
  const pool=words.slice().sort((a,b)=>(S.r[b]-S.r[a])||(Math.random()-0.5));
  while(pool.length>=2){const a=pool.shift();let idx=pool.findIndex(w=>!S.played.has(key(a,w)));if(idx<0)idx=0;const b=pool.splice(idx,1)[0];pairs.push({pair:[a,b]})}
  const cands=S.choices.filter(c=>!c.isRepeat&&!S.repeated.has(key(c.pair[0],c.pair[1]))).sort((a,b)=>b.gap-a.gap);
  if(cands.length){const top=cands.slice(0,Math.max(1,Math.ceil(cands.length/2)));const c=top[Math.floor(Math.random()*top.length)];S.repeated.add(key(c.pair[0],c.pair[1]));pairs.push({pair:[c.pair[0],c.pair[1]],isRepeat:true,forceLeft:(c.leftId===c.pair[0]?c.pair[1]:c.pair[0])})}
  pairs=shuffle(pairs);
 }
 let prev=S.lastWords;
 for(let i=0;i<pairs.length;i++){if(pairs[i].pair.some(w=>prev.includes(w))){const j=pairs.findIndex((p,k)=>k>i&&!p.pair.some(w=>prev.includes(w)));if(j>0)[pairs[i],pairs[j]]=[pairs[j],pairs[i]]}prev=pairs[i].pair}
 pairs.forEach(p=>{p.leftId=p.forceLeft||(Math.random()<0.5?p.pair[0]:p.pair[1]);p.rightId=p.leftId===p.pair[0]?p.pair[1]:p.pair[0]});
 S.queue=pairs;showPair();
}
function showPair(){S.current=S.queue.shift();S.paused=false;view='pair';render();S.tShown=performance.now()}
/* the blink: only the two words go blank, in place — the top bar, the progress and Undo aren't redrawn, so nothing else flickers */
function nextPair(){if(PAUSE_MS>0&&view==='pair'&&app.querySelector('.pair')){S.current=null;S.paused=true;app.querySelectorAll('.pair .card').forEach(c=>{c.textContent=''});setTimeout(()=>{if(S&&S.paused)showPair()},PAUSE_MS)}else showPair()}
function labelOf(p,id){if(p.isGoal){const side=id.endsWith('|h')?'h':'p';return p.goal[side][store.lang]||p.goal[side].en}return wname(id)}
function perRound(){return Math.floor(activeWords().length/2)+1}
function choose(chosenId){
 const p=S.current;if(!p||S.paused)return;
 const rt=Math.round(performance.now()-S.tShown);
 if(rt<REFLEX_MS){S.reflex++;S.current=null;const at=S.queue.length?1+Math.floor(Math.random()*S.queue.length):0;S.queue.splice(at,0,p);nextPair();return}
 if(p.isGoal){S.goalPicks.push({key:p.goal.key,goal:p.goal.goal,pull:chosenId.endsWith('|p'),rt_ms:rt,leftId:p.leftId});S.taps.push('goal');S.current=null;advance();return}
 const loser=chosenId===p.leftId?p.rightId:p.leftId;
 const gap=Math.abs(S.r[chosenId]-S.r[loser]);
 const pw=1/(1+Math.exp(-(S.r[chosenId]-S.r[loser])));const d=1-pw;
 S.r[chosenId]+=d;S.r[loser]-=d;S.cmp[chosenId]++;S.cmp[loser]++;
 S.played.add(key(p.pair[0],p.pair[1]));

 if(p.isDuel){const tw=twins().find(x=>x.key===p.key);if(tw)S.duelPicks.push({key:p.key,pull:chosenId===tw.p,rt_ms:rt})}

function advance(){

function undo(){

/* ---------- analysis: Bradley-Terry, consistency, timing, duels, levels ---------- */
function analyze(choices,words){
 const n=words.length,idx={};words.forEach((w,i)=>idx[w]=i);
 const W=Array.from({length:n},()=>Array(n).fill(0));
 choices.forEach(c=>{if(idx[c.chosenId]==null)return;const l=c.chosenId===c.pair[0]?c.pair[1]:c.pair[0];if(idx[l]==null)return;W[idx[c.chosenId]][idx[l]]++});
 let s=Array(n).fill(1);
 for(let it=0;it<60;it++){const ns=s.slice();for(let i=0;i<n;i++){let wins=0.5,den=1/(s[i]+1);for(let j=0;j<n;j++){if(i===j)continue;wins+=W[i][j];const nij=W[i][j]+W[j][i];if(nij>0)den+=nij/(s[i]+s[j])}ns[i]=wins/den}const gm=Math.exp(ns.reduce((a,b)=>a+Math.log(b),0)/n);s=ns.map(v=>v/gm)}
 const strength={},se={};
 words.forEach((w,i)=>{strength[w]=Math.log(s[i]);let info=0;for(let j=0;j<n;j++){if(i===j)continue;const nij=W[i][j]+W[j][i];if(nij>0){const p=s[i]/(s[i]+s[j]);info+=nij*p*(1-p)}}se[w]=info>0?1/Math.sqrt(info):9});
 const order=words.slice().sort((a,b)=>strength[b]-strength[a]);const rank={};order.forEach((w,i)=>rank[w]=i+1);
 const first={};let agreed=0,total=0;
 choices.forEach(c=>{if(!c.isRepeat){const k=key(c.pair[0],c.pair[1]);if(!(k in first))first[k]=c.chosenId}});
 choices.forEach(c=>{if(c.isRepeat){const k=key(c.pair[0],c.pair[1]);if(k in first){total++;if(first[k]===c.chosenId)agreed++}}});
 const later=choices.filter(c=>c.round>1).map(c=>c.rt_ms);
 const med=median(later.length?later:choices.map(c=>c.rt_ms))||1;
 return {strength,rank,se,order,repeats:total,agreed,C:total?agreed/total:null,rt_median:med};
}
function levelScores(rank){const out={};for(const lv in LEVELS){const h=POOL.filter(w=>w.level===lv&&w.side==='h'&&rank[w.id]!=null).map(w=>rank[w.id]);const p=POOL.filter(w=>w.level===lv&&w.side==='p'&&rank[w.id]!=null).map(w=>rank[w.id]);if(h.length&&p.length)out[lv]=avg(p)-avg(h)}return out}
function duelMap(sess){const m={};(sess.duels||[]).forEach(d=>{m[d.key]={pull:d.pull,ratio:sess.rt_median?d.rt_ms/sess.rt_median:null}});return m}

/* ---------- the normal: the person's ordinary days — no slip, chain light (under 3 links), and not a day that itself read as
   tipped or flipped twice, sleep noted (here or in The Patch), steady hand. Like The Patch's set-aside days: one heavy evening
   can't become the baseline. There is no fallback: until 3 such days exist, there is no normal, and the result says so. ---------- */
function sleepKnown(s){const c=Object.assign({},patchChips(s.date)||{},s.chips||{});return c.sl!=null}
function ordinaryDay(s,slips){return sleepKnown(s)&&!s.fog&&!(slips.has(s.date)||(s.chips&&s.chips.cr==='y')||(s.links||[]).length>=LINKS_FIRE||(s.tipped&&s.tipped.length)||(s.flips&&s.flips.length>=2))}
function normalOf(prior,words){
 const slips=slipDays();
 const same=prior.filter(s=>s.pool===POOL_VERSION);
 let B=firstPerDay(same.filter(s=>ordinaryDay(s,slips))).slice(-BASE_WINDOW);
 const N={n:B.length,days:B.map(s=>s.date)};
 // hesitation two sessions running: the session just before, heavy day or not
 const last=same.slice().sort((a,b)=>a.t_start-b.t_start).pop();N.prevHes=last&&last.hes?last.hes:[];
 if(B.length<NORMAL_MIN)return N;
 const common=words.filter(w=>B.every(s=>s.rank&&s.rank[w]!=null&&s.strength&&s.strength[w]!=null&&sameWatch(s,w)));
 if(common.length<6)return N;
 N.common=common;N.mean={};N.sd={};N.meanS={};N.sdS={};
 common.forEach(w=>{const v=B.map(s=>s.rank[w]);N.mean[w]=avg(v);N.sd[w]=stdev(v);const u=B.map(s=>s.strength[w]);N.meanS[w]=avg(u);N.sdS[w]=stdev(u)});
 N.upsetBar=UPSETS_MIN;let worst=0;B.forEach(s=>{const u=upsetsOf(s,N);for(const w in u.won)worst=Math.max(worst,u.won[w].length);for(const w in u.lost)worst=Math.max(worst,u.lost[w].length)});N.upsetBar=Math.max(UPSETS_MIN,worst+1);
 N.duel={};twins().forEach(tw=>{const rows=B.map(duelMap).filter(m=>m[tw.key]);N.duel[tw.key]={n:rows.length,pull:rows.filter(m=>m[tw.key].pull).length,ratios:rows.map(m=>m[tw.key].ratio).filter(r=>r!=null)}});
 N.lv={};const L=B.map(s=>levelScores(s.rank));for(const lv in LEVELS){const v=L.map(x=>x[lv]).filter(x=>x!=null);if(v.length)N.lv[lv]={mean:avg(v),sd:Math.max(LV_SD_FLOOR,stdev(v))}}

}
function upsetsOf(sess,N){
 const pN=(w,x)=>1/(1+Math.exp(N.meanS[x]-N.meanS[w]));const won={},lost={},sw={},sl={};
 (Array.isArray(sess.choices)?sess.choices:[]).forEach(c=>{const w=c.chosenId,l=c.chosenId===c.pair[0]?c.pair[1]:c.pair[0];if(N.meanS[w]==null||N.meanS[l]==null)return;const p=pN(w,l);if(p>=UPSET_P)return;const k=w+'|'+l;if(!sw[k]){sw[k]=1;(won[w]=won[w]||[]).push({x:l,p})}if(!sl[k]){sl[k]=1;(lost[l]=lost[l]||[]).push({x:w,p})}});
 for(const w in won)won[w].sort((a,b)=>a.p-b.p);for(const w in lost)lost[w].sort((a,b)=>a.p-b.p);return {won,lost};
}
function warnOf(sess,N){
 if(!N.common)return [];
 const U=upsetsOf(sess,N),bar=N.upsetBar||UPSETS_MIN;
 const cand=N.common.filter(w=>sess.rank[w]!=null&&sess.strength&&sess.strength[w]!=null).map(w=>{const se=sess.se&&sess.se[w]!=null?sess.se[w]:1;const z=(sess.strength[w]-N.meanS[w])/Math.sqrt(se*se+Math.max(SD_FLOOR,N.sdS[w])**2);return {w,delta:N.mean[w]-sess.rank[w],z,uw:U.won[w]||[],ul:U.lost[w]||[]}});
 const up=cand.filter(m=>m.delta>=MOVE_MIN&&(m.uw.length>=bar||m.z>=Z_MIN)).sort((a,b)=>(b.uw.length-a.uw.length)||(b.z-a.z))[0];
 const dn=cand.filter(m=>m.delta<=-MOVE_MIN&&(m.ul.length>=bar||m.z<=-Z_MIN)).sort((a,b)=>(b.ul.length-a.ul.length)||(a.z-b.z))[0];
 const lines=[];
 if(up){let over=up.uw.map(o=>o.x).slice(0,2);if(!over.length)over=N.common.filter(x=>x!==up.w&&N.mean[x]<=N.mean[up.w]-2&&sess.rank[x]!=null&&sess.rank[x]>sess.rank[up.w]).sort((a,b)=>N.mean[a]-N.mean[b]).slice(0,2);lines.push({w:up.w,dir:'up',over,n:Math.round(up.delta)})}
 if(dn&&(!up||dn.w!==up.w)){let over=dn.ul.map(o=>o.x).slice(0,2);if(!over.length)over=N.common.filter(x=>x!==dn.w&&N.mean[x]>=N.mean[dn.w]+2&&sess.rank[x]!=null&&sess.rank[x]<sess.rank[dn.w]).sort((a,b)=>N.mean[b]-N.mean[a]).slice(0,2);lines.push({w:dn.w,dir:'down',over,n:Math.round(-dn.delta)})}

}
function warnText(l){const w=wname(l.w),o=l.over.map(wmid);if(l.dir==='up')return o.length>=2?t('upBoth',w,o[0],o[1]):o.length===1?t('upOne',w,o[0]):t('upN',w,l.n);return o.length>=2?t('dnBoth',w,o[0],o[1]):o.length===1?t('dnOne',w,o[0]):t('dnN',w,l.n)}

/* ---------- the three readings, in the order they arrive: the hand rocks, the duel flips, the scale tips — and the fog ----------
   hesitation: a duel's tap time over the session's median tap, against the 90th percentile of the person's own ordinary ratios for
   that pair (one slow day in the normal doesn't raise the bar for good); two duels at once, or the same duel two sessions running */
function readingsOf(sess,N){
 const R={fog:null,hes:[],flips:[],tipped:null,words:[],levels:levelScores(sess.rank)};
 if(sess.repeats>=FOG_REPEATS&&sess.C!=null&&sess.C<=FOG_C&&(N.meanC==null||sess.C<=N.meanC-0.25))R.fog={k:sess.repeats-sess.agreed,n:sess.repeats};
 if(!N.common)return R;
 const D=duelMap(sess);
 twins().forEach(tw=>{const d=D[tw.key],nd=N.duel&&N.duel[tw.key];if(!d||!nd||nd.n<NORMAL_MIN)return;
  // a flip: the pull side won a duel it loses on the person's ordinary days — never, or at most 1 in 10 once there are 5 days —
  // and a duel that is clear for them (the healthy twin's usual strength well above the pull's), not a near-tie that flips by itself
  const clear=N.meanS[tw.h]!=null&&N.meanS[tw.p]!=null&&(N.meanS[tw.h]-N.meanS[tw.p])>=FLIP_GAP;
  if(d.pull&&clear&&(nd.pull===0||(nd.n>=FLIP_N&&nd.pull/nd.n<=FLIP_MAX)))R.flips.push({key:tw.key,h:tw.h,p:tw.p,k:nd.n-nd.pull,n:nd.n});
  if(!d.pull&&!R.fog&&d.ratio!=null&&nd.ratios.length>=NORMAL_MIN){const bar=q90(nd.ratios);if(d.ratio>=HES_FLOOR&&d.ratio>bar)R.hes.push({key:tw.key,h:tw.h,p:tw.p,ratio:Math.round(d.ratio*100)/100})}});

 if(low.length>=LV_MIN){const movers=low.map(lv=>{const ws=POOL.filter(w=>w.level===lv);const p=ws.filter(w=>w.side==='p').map(w=>({id:w.id,d:(N.mean[w.id]||0)-sess.rank[w.id]})).sort((a,b)=>b.d-a.d)[0];const h=ws.filter(w=>w.side==='h').map(w=>({id:w.id,d:sess.rank[w.id]-(N.mean[w.id]||0)})).sort((a,b)=>b.d-a.d)[0];return {lv,p:p?p.id:null,h:h?h.id:null}});R.tipped={levels:low,movers}}

}
/* 0.6.4: a crash is an outcome, not a link — it's shown, but never counts toward the three */
function linksOf(chips){if(!chips)return [];return CHIPS.filter(c=>c.id!=='cr'&&chips[c.id]!=null&&chips[c.id]===c.heavy).map(c=>c.id)}
/* the message and the call appear on: two flips, or one on a universal duel (Tomorrow·Right now, Enough·More); the scale tipping;
   hesitation (already two duels or two sessions); or three links lit */
/* 0.6.5: with a shaky hand (repeats that don't agree), flips can be noise, so they don't bring up the card; tipping and links still do */
function fires(R,links){const flip=!R.fog&&(R.flips.length>=2||R.flips.some(f=>UNIVERSAL.includes(f.key)));return !!(hasGoals()&&(flip||R.tipped||R.hes.length||links.length>=LINKS_FIRE))}

/* ---------- contrasts: heavy days vs the others; slip days vs the others ---------- */
function contrastOf(sessions,words){
 const D=dayView(sessions.filter(s=>s.pool===POOL_VERSION));let best=null;
 CHIPS.forEach(c=>{const have=D.filter(s=>s.chips&&s.chips[c.id]!=null&&s.rank);const A=have.filter(s=>s.chips[c.id]===c.heavy),B=have.filter(s=>s.chips[c.id]!==c.heavy);if(A.length<SIDE_MIN||B.length<SIDE_MIN)return;

  const moves=common.map(w=>{const a=A.map(s=>s.rank[w]),b=B.map(s=>s.rank[w]);const va=Math.max(2.5,stdev(a))**2,vb=Math.max(2.5,stdev(b))**2;const d=avg(b)-avg(a);return {w,d,z:d/Math.sqrt(va/a.length+vb/b.length)}}).filter(m=>Math.abs(m.d)>=MOVE_MIN&&Math.abs(m.z)>=2.2).sort((a,b)=>Math.abs(b.z)-Math.abs(a.z));

 (goalIds.length?goalIds:['other']).forEach(g=>{const G=GOALS.find(x=>x.id===g);const k=G?G.help:'general';if(k==='none')return;const h=prov[k]||prov.general;if(!h||seen.has(h.tel+h.n[0]))return;seen.add(h.tel+h.n[0]);out.push(h)});
 if(goalIds.includes('pills'))out.push(NORS);
 return out;
}

function exportJSON(){return JSON.stringify(store,null,1)}
function tryDownload(text,name){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){}}
function copyText(text,okKey,failKey){const done=ok=>{ui.msg=t(ok?okKey:failKey);render()};try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>done(true),()=>done(false));return}}catch(e){}try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();done(ok)}catch(e){done(false)}}
function cleanBackup(o){if(!o||typeof o!=='object'||!o.sollum_version||!Array.isArray(o.sessions))return null;
 const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
 const okS=x=>isObj(x)&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.t_start==='number'&&isObj(x.rank)&&isObj(x.strength);
 const okL=x=>isObj(x)&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date);
 const out=Object.assign({},o);out.sessions=o.sessions.filter(okS);out.slips=Array.isArray(o.slips)?o.slips.filter(okL):[];
 if(!isObj(o.setup))delete out.setup;if(!isObj(o.connect))delete out.connect;
 out._dropped=(o.sessions.length-out.sessions.length)+((Array.isArray(o.slips)?o.slips.length:0)-out.slips.length);return out}
function handleRestore(file){const rd=new FileReader();rd.onload=()=>{try{const o=cleanBackup(JSON.parse(rd.result));if(o&&!(o.sessions.length===0&&o._dropped>0)){const dropped=o._dropped;delete o._dropped;if(o.setup)o.setup=Object.assign(defaults().setup,o.setup);localStorage.setItem(KEY,JSON.stringify(o));store=load();patchCache=null;ui.msg=t('restored')+(dropped?' '+t('restoredSkip',dropped):'');render();return}ui.msg=t('importBad');render()}catch(e){ui.msg=t('importBad');render()}};rd.readAsText(file)}
function usePaste(text){try{const x=patchExtract(JSON.parse(text));if(!x||!Object.keys(x.days).length){ui.msg=t('pasteBad');render();return}store.patch_paste={days:x.days,roll:x.roll,saved:Date.now()};store.connect.patch=true;patchCache=null;save();ui.pasteText='';ui.msg=t('pasteOk',Object.keys(x.days).length);render()}catch(e){ui.msg=t('pasteBad');render()}}
function aiText(){
 const r=S.result,sess=r.sess,R=r.R,Lx=[];
 Lx.push(L('I just did a Sollum session (forced choices between twenty words in ten twin pairs, to see whether a short night, drinks, caffeine or junk food move my priorities). Here is my data. Help me read it; don’t diagnose me.','Je viens de faire une session Sollum (des choix forcés entre vingt mots en dix paires jumelles, pour voir si une nuit courte, l’alcool, la caféine ou la malbouffe font bouger mes priorités). Voici mes données. Aide-moi à les lire; ne me diagnostique pas.'));
 const ch=sess.chips?CHIPS.filter(c=>sess.chips[c.id]!=null).map(c=>`${c.en}: ${c.opts.find(o=>o[0]===sess.chips[c.id])[1]}`).join(', '):'not answered';
 Lx.push(`Session ${sess.date} ${sess.hour}h: ${sess.rounds} rounds, ${sess.choices.length} choices. Day: ${ch}. Links lit: ${(sess.links||[]).length}.`);
 Lx.push('Ranking: '+r.order.map((w,i)=>`${i+1}. ${wname(w)}`).join(', '));
 Lx.push('Duels (pull side won?): '+(sess.duels||[]).map(d=>{const tw=twins().find(x=>x.key===d.key);return tw?`${wname(tw.h)}/${wname(tw.p)}=${d.pull?'pull':'healthy'} (${d.rt_ms} ms)`:''}).filter(Boolean).join('; ')+`; median tap ${sess.rt_median} ms`);
 if(sess.goals&&sess.goals.length)Lx.push('Goal duels: '+sess.goals.map(g=>`${g.key}=${g.pull?'pull':'healthy'}`).join(', '));
 Lx.push(`Levels (pull − healthy mean place): ${Object.entries(R.levels).map(([k,v])=>`${k} ${v.toFixed(1)}`).join(', ')}. Repeats kept ${sess.agreed} of ${sess.repeats}.`);
 if(r.N.common)Lx.push(`Normal (${r.N.n} ordinary days). Readings: hesitation ${R.hes.map(h=>wname(h.h)+'/'+wname(h.p)+' ×'+h.ratio).join(', ')||'none'}; flips ${R.flips.map(f=>wname(f.p)+' over '+wname(f.h)).join(', ')||'none'}; tipped ${R.tipped?R.tipped.levels.join('+'):'no'}; fog ${R.fog?'yes':'no'}.`);
 else Lx.push(`Normal: ${r.N.n} of ${NORMAL_MIN} days — no comparison yet.`);
 if(store.slips.length)Lx.push(`Slips noted: ${store.slips.length}${ui.aiAmounts?' — '+store.slips.map(s=>`${s.date} ${s.goal} ${s.start||'?'}–${s.end||'?'} ${s.cost&&s.cost.n!=null?s.cost.n+' '+s.cost.unit:''}`).join('; '):' (amounts left out)'}.`);
 const recent=dayView(store.sessions.filter(s=>s.pool===POOL_VERSION)).slice(-10).map(s=>`${s.date} top3=${orderOf(s.rank).slice(0,3).map(wname).join('/')}${s.chips?' '+Object.entries(s.chips).map(([k,v])=>k+'='+v).join(','):''}${s.tipped?' tipped':''}${slipDays().has(s.date)?' slip':''}`);
 Lx.push('Last days: '+recent.join(' | '));
 return Lx.join('\n');
}

/* 0.6.4: The Patch gives day totals with a few times. Anything whose time is after the incident's start is marked,
   and crashes after the start are left out (code review, 8 Nov) */
function clockMin(h){if(typeof h!=='string')return null;const m=/^(\d{1,2}):(\d{2})/.exec(h);if(!m)return null;let v=+m[1]*60+ +m[2];if(v<5*60)v+=1440;return v}
function chainLine(slip){
 const p=patchSum(slip.date);const parts=[];const st=clockMin(slip.start);const after=h=>st!=null&&clockMin(h)!=null&&clockMin(h)>st;const aft=L(' (last one after it started)',' (le dernier après le début)');
 if(p){if(typeof p.sleep==='number')parts.push(L(`${p.sleep} h sleep`,`${p.sleep} h de sommeil`));
  const c=p.caffeine||{};if((c.servings||0)>0||(c.energyDrinks||0)>0)parts.push(L(`${c.servings||0} caffeine${c.energyDrinks?` (+${c.energyDrinks} energy)`:''}${c.last?' by '+c.last:''}${after(c.last)?aft:''}`,`${c.servings||0} caféine${c.energyDrinks?` (+${c.energyDrinks} boisson${c.energyDrinks>1?'s':''} énergisante${c.energyDrinks>1?'s':''})`:''}${c.last?' jusqu’à '+c.last:''}${after(c.last)?aft:''}`));
  if(p.sugar&&p.sugar.servings>0)parts.push(L(`${p.sugar.servings} sweet${p.sugar.servings>1?'s':''}`,`${p.sugar.servings} sucrerie${p.sugar.servings>1?'s':''}`));
  if(p.meals)parts.push(p.meals.count?L(`${p.meals.count} meal${p.meals.count>1?'s':''}${p.meals.last?', last '+p.meals.last:''}${p.meals.low?' (thin)':''}${after(p.meals.last)?aft:''}`,`${p.meals.count} repas${p.meals.last?', dernier '+p.meals.last:''}${p.meals.low?' (léger)':''}${after(p.meals.last)?aft:''}`):L('no meal logged','aucun repas noté'));
  const a=p.alcohol||{};if(a.drinks)parts.push(L(`${a.drinks} drink${a.drinks>1?'s':''}${a.late?' late':''}`,`${a.drinks} verre${a.drinks>1?'s':''}${a.late?' tard':''}`));
  const ca=Array.isArray(p.crashAt)?p.crashAt.filter(h=>!after(h)):null;
  if(p.crash&&(!ca||ca.length||!p.crashAt.length))parts.push(L(`crash${ca&&ca.length?' at '+ca.join(', '):''}`,`crash${ca&&ca.length?' à '+ca.join(', '):''}`));
 }else{const ch=dayView(store.sessions).find(s=>s.date===slip.date);const cc=ch&&ch.chips;if(cc)CHIPS.forEach(c=>{if(cc[c.id]!=null)parts.push(`${c.ic} ${chipLabel(c,cc[c.id])}`)})}
 const G=GOALS.find(x=>x.id===slip.goal);const what=slip.goal==='other'&&store.setup.other?store.setup.other:(G?(store.lang==='fr'?G.fr:G.en):slip.goal);
 parts.push(`<b>${esc(what)}${slip.start?' '+esc(slip.start):''}${slip.end?'–'+esc(slip.end):''}</b>`);
 return parts.length>1?parts.join(' → '):(p?parts.join(''):t('chainNone')+' '+parts.join(''));
}

/* ---------- your pattern: the vicious circle and the lever ---------- */
const PAT_STEPS=[
 {id:'rest',  en:'Rested',               fr:'Reposé'},
 {id:'sleep', en:'4 h of sleep',         fr:'4 h de sommeil'},
 {id:'caf',   en:'+ 4 energy drinks',    fr:'+ 4 boissons énergisantes'},
 {id:'sugar', en:'+ sugar, no meal',     fr:'+ du sucre, pas de repas'},
 {id:'al',    en:'+ 3 beers',            fr:'+ 3 bières'},
 {id:'bet',   en:'+ “just one bet”',      fr:'+ « juste une mise »'}
];
/* the physics, kept simple: reasons weigh 3 units and sit at a distance from the pivot that shrinks with every link; the pull weighs
   more with every link and stays far out. torque = weight x distance. The beam leans toward the bigger torque. */
const PAT_D=[1.0,0.82,0.68,0.6,0.55,0.24], PAT_P=[0.9,1.0,1.15,1.3,1.6,2.2], PAT_PD=0.95, PAT_W=3;
let pat={step:0,extra:0};
function patTorque(){const dh=PAT_D[pat.step],h=(PAT_W+pat.extra)*dh,p=PAT_P[pat.step]*PAT_PD;return {h,p,dh}}
function patAngle(){const {h,p}=patTorque();const d=p-h;return Math.max(-14,Math.min(14,d*9))}
function patCaption(){
 const {h,p,dh}=patTorque();const tipped=p>h, close=!tipped&&p>h*0.82;
 const add=pat.extra?(store.lang==='fr'?` Tu as ajouté ${pat.extra} raison${pat.extra>1?'s':''} — chacune pèse ${Math.round(dh*100)}\u00a0% de ce qu’elle pèse un jour reposé.`:` You added ${pat.extra} reason${pat.extra>1?'s':''} — each weighs ${Math.round(dh*100)}% of what it weighs on a rested day.`):'';
 const C={
  rest:L('Rested, your reasons sit far out on the beam. Family, Tomorrow and Love outweigh the pull easily.','Reposé, tes raisons sont loin sur la poutre. La famille, demain et l’amour l’emportent facilement.'),
  sleep:L('A short night. Nothing has happened yet — but your reasons have slid a little toward the pivot.','Une nuit courte. Rien n’est encore arrivé — mais tes raisons ont glissé un peu vers le pivot.'),
  caf:L('Caffeine to fix the tired. It works for a while; the pull gets a little heavier, your reasons slide closer.','De la caféine pour régler la fatigue. Ça marche un temps; ce qui tire devient un peu plus lourd, tes raisons glissent plus près.'),
  sugar:L('Sugar instead of a meal. The crash is booked for later. Still holding.','Du sucre au lieu d’un repas. Le crash est réservé pour plus tard. Ça tient encore.'),
  al:L('Three beers to quiet the storm. Right now starts to make more sense than Tomorrow; Fun feels better than Work. Not tipped yet — but close.','Trois bières pour calmer la tempête. Tout de suite commence à avoir plus de sens que Demain; le plaisir a l’air mieux que le travail. Pas encore basculé — mais proche.'),
  bet:L('“Just one bet” for the lift. Your reasons are right next to the pivot now: they’re all still there, they just don’t weigh anything from where they sit.','« Juste une mise » pour le remontant. Tes raisons sont collées sur le pivot maintenant\u00a0: elles sont toutes encore là, elles ne pèsent juste plus rien d’où elles sont.')
 }[PAT_STEPS[pat.step].id];
 const state=tipped?L(' → The scale tips.',' → La balance bascule.'):close?L(' → On the edge.',' → Sur le bord.'):'';
 return C+state+add;
}
function leverSVG(){
 const cx=200,by=118,half=150,ang=patAngle(),{dh}=patTorque();
 const xh=cx-half*dh, xp=cx+half*PAT_PD;
 const hw=Math.min(3+pat.extra,9);
 const names=[L('Family','Famille'),L('Tomorrow','Demain'),L('Love','Amour'),L('Future','Avenir'),L('Kids','Enfants'),L('Health','Santé'),L('Work','Travail'),L('Home','Maison'),L('Friends','Amis')];
 const blocks=[];
 for(let i=0;i<hw;i++){const col=i%3,row=Math.floor(i/3);const x=xh-57+col*38,y=by-25-row*24;blocks.push(`<rect x="${x}" y="${y}" width="36" height="22" rx="5" fill="var(--teal)"/><text x="${x+18}" y="${y+14.5}" font-size="7.5" font-weight="700" text-anchor="middle" style="fill:#fff">${esc(names[i])}</text>`)}
 const ps=Math.round(40+PAT_P[pat.step]*8);
 return `<svg viewBox="-24 0 448 180" role="img" aria-label="${esc(L('A lever: your reasons on the left, the pull on the right, the pivot in the middle.','Un levier : tes raisons à gauche, ce qui tire à droite, le pivot au milieu.'))}">
  <g class="beam" style="transform-origin:${cx}px ${by}px;transform:rotate(${ang}deg)">
   <rect x="${cx-half-12}" y="${by-3}" width="${2*half+24}" height="6" rx="3" fill="var(--ink)"/>
   ${blocks.join('')}
   <rect x="${xp-ps/2}" y="${by-3-ps}" width="${ps}" height="${ps}" rx="6" fill="var(--acc)"/>
   <text x="${xp}" y="${by-3-ps/2+4}" font-size="9" font-weight="700" text-anchor="middle" style="fill:#fff">${esc(L('The pull','Ça tire'))}</text>
  </g>
  <polygon points="${cx-16},${by+42} ${cx+16},${by+42} ${cx},${by+4}" fill="var(--mute)"/>
  <text x="${cx}" y="${by+58}" font-size="11" text-anchor="middle" style="fill:var(--mute)">${esc(L('the pivot','le pivot'))}</text>
 </svg><div class="small" style="display:flex;gap:14px;justify-content:center;margin-top:2px"><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--teal);margin-right:5px"></span>${esc(L('your reasons','tes raisons'))}</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--acc);margin-right:5px"></span>${esc(L('the pull','ce qui tire'))}</span></div>`;
}
function circleSVG(){
 const nodes=[[L('4 h of sleep','4 h de sommeil'),'🌙'],[L('Caffeine','Caféine'),'☕'],[L('Sugar, no meal','Sucre, pas de repas'),'🍫'],[L('Alcohol','Alcool'),'🍺'],[L('Gambling','Le jeu'),'🎲'],[L('Crash','Crash'),'⚡']];
 const cx=200,cy=185,R=108,n=nodes.length,ang=i=>-Math.PI/2+i*2*Math.PI/n;
 const arcs=nodes.map((_,i)=>{const a1=ang(i)+0.3,a2=ang(i+1)-0.3;const x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);return `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)}" fill="none" stroke="var(--acc)" stroke-width="2.5" marker-end="url(#ah)"/>`}).join('');
 const dots=nodes.map((nd,i)=>{const a=ang(i),x=cx+R*Math.cos(a),y=cy+R*Math.sin(a),lx=cx+(R+50)*Math.cos(a),ly=cy+(R+44)*Math.sin(a)+4;
  return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="26" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/><text x="${x.toFixed(1)}" y="${(y+7).toFixed(1)}" font-size="20" text-anchor="middle">${nd[1]}</text><text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="12" font-weight="700" text-anchor="middle">${esc(nd[0])}</text>`}).join('');
 return `<svg viewBox="0 0 400 370" role="img" aria-label="${esc(L('The circle: a short night, caffeine, sugar, alcohol, gambling, a crash — and back to a short night.','Le cercle : une nuit courte, la caféine, le sucre, l’alcool, le jeu, un crash — et retour à une nuit courte.'))}"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--acc)"/></marker></defs>${arcs}${dots}<text x="${cx}" y="${cy-4}" font-size="12" text-anchor="middle" style="fill:var(--mute)">${esc(L('each one','chacun'))}</text><text x="${cx}" y="${cy+12}" font-size="12" text-anchor="middle" style="fill:var(--mute)">${esc(L('fixes the last','répare le précédent'))}</text></svg>`;
}

const FEEDBACK_TO='tobiedavid@hotmail.com';let fbDraft='';
function fbMsg(){return (fbDraft||'').trim()+'\n\n— Sollum v'+VER+' ('+String(store.lang||'en').toUpperCase()+')'}
function openFeedback(){showSheet(`<div class="handle"></div><h3 id="sheetTitle">${t('improve')}</h3><p class="small">${t('fbLead',FEEDBACK_TO)}</p><textarea id="fbText" style="min-height:120px" aria-label="${esc(t('fbLabel'))}">${esc(fbDraft)}</textarea><div class="row" style="margin-top:10px;flex-wrap:wrap"><button type="button" class="btn sm" data-act="feedbackSend">${t('fbSend')}</button>${navigator.share?`<button type="button" class="btn sm sec" data-act="feedbackShare">${t('fbShare')}</button>`:''}<button type="button" class="btn sm sec" data-act="feedbackCopy">${t('copy')}</button><button type="button" class="btn sm sec" id="closeSheet">${t('close')}</button></div><div class="small" id="fbNote"></div>`)}
function fbNote(x){const n=document.getElementById('fbNote');if(n)n.textContent=x}

/* ---------- events ---------- */
function asButton(el){if(/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(el.tagName))return;if(!el.hasAttribute('role'))el.setAttribute('role','button');if(!el.hasAttribute('tabindex'))el.tabIndex=0;
 if(el.classList.contains('chip'))el.setAttribute('aria-pressed',String(el.classList.contains('on')));
 el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();el.click()}})}
function bind(){
 document.documentElement.lang=store.lang==='fr'?'fr-CA':'en-CA';
 app.querySelectorAll('[data-act]').forEach(el=>{asButton(el);el.addEventListener('click',ev=>{if(el.tagName==='A'&&!el.dataset.act)return;ev.preventDefault();act(el.dataset.act,el.dataset.arg)})});
 const ps=document.getElementById('provSel');if(ps)ps.addEventListener('change',e=>{store.province=e.target.value;save();if(view!=='setup')render()});
 const fr=document.getElementById('fRestore');if(fr)fr.addEventListener('change',e=>{if(e.target.files[0])handleRestore(e.target.files[0])});
 const pb=document.getElementById('pasteBox');if(pb)pb.addEventListener('input',e=>{ui.pasteText=e.target.value});
 const ai=document.getElementById('aiAmounts');if(ai)ai.addEventListener('change',e=>{ui.aiAmounts=e.target.checked});
 const ow=document.getElementById('otherWord');if(ow)ow.addEventListener('input',e=>{ui.setupTmp.other=e.target.value});
 const ww=document.getElementById('watchWord');if(ww)ww.addEventListener('input',e=>{ui.setupTmp.watchLabel=e.target.value});
 const nb=document.getElementById('noteBox');if(nb)nb.addEventListener('input',e=>{ui.setupTmp.note=e.target.value});
 const cn=document.getElementById('cName');if(cn)cn.addEventListener('input',e=>{ui.setupTmp.cName=e.target.value});
 const cp=document.getElementById('cPhone');if(cp)cp.addEventListener('input',e=>{ui.setupTmp.cPhone=e.target.value});
 ['slipStart','slipEnd','slipN','slipUnit'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',e=>{if(id==='slipStart')ui.slip.start=e.target.value;if(id==='slipEnd')ui.slip.end=e.target.value;if(id==='slipN')ui.slip.n=e.target.value===''?null:Number(e.target.value);if(id==='slipUnit')ui.slip.unit=e.target.value})});
}
function newSetupTmp(){const su=store.setup;return {goals:su.goals.slice(),curious:su.done&&!su.goals.length,other:su.other||'',watchLabel:'',note:su.note||'',cName:su.contact?su.contact.name:'',cPhone:su.contact?su.contact.phone:''}}
function defaultWatch(goals){const g=GOALS.find(x=>goals.includes(x.id)&&x.id!=='other')||GOALS.find(x=>goals.includes(x.id));return g?g.watch:['It','Ça']}
function act(a,arg){
 if(a!=='reset')ui.resetArmed=false;
 switch(a){
  case 'go':ui.msg='';ui.exportText='';if(arg==='home')S=null;if(arg==='result'&&!(S&&S.result)){view='home';render();break}if(arg==='slip'){ui.slip={goal:store.setup.goals.length===1?store.setup.goals[0]:null,date:sessDay(),start:'',end:'',n:null,unit:'money'}}view=arg;render();break;
  case 'lang':store.lang=store.lang==='fr'?'en':'fr';save();render();break;
  case 'menu':openMenu();break;
  case 'patStep':pat.step=Math.max(0,Math.min(PAT_STEPS.length-1,+arg));render();break;
  case 'patAdd':pat.extra=Math.min(6,pat.extra+1);render();break;
  case 'patReset':pat.extra=0;render();break;
  case 'how':openHow();break;
  case 'about':openAbout();break;
  case 'feedback':openFeedback();break;
  case 'feedbackSend':{if(!(fbDraft||'').trim()){fbNote(t('fbEmpty'));break}location.href='mailto:'+FEEDBACK_TO+'?subject='+encodeURIComponent('Sollum v'+VER+' — '+L('a recommendation','une recommandation'))+'&body='+encodeURIComponent(fbMsg());break}
  case 'feedbackShare':{if(!(fbDraft||'').trim()){fbNote(t('fbEmpty'));break}try{navigator.share({text:fbMsg()}).catch(()=>{})}catch(e){}break}
  case 'feedbackCopy':{if(!(fbDraft||'').trim()){fbNote(t('fbEmpty'));break}const m=fbMsg();try{navigator.clipboard.writeText(m).then(()=>fbNote(t('fbCopied',FEEDBACK_TO)),()=>fbNote(t('copyFail')))}catch(e){fbNote(t('copyFail'))}break}
  case 'setLang':store.lang=arg;save();render();break;
  case 'setProv':store.province=arg;save();render();break;
  case 'start':ui.msg='';if(!store.setup.done){ui.setupStep=0;ui.setupTmp=newSetupTmp();view='setup';render();break}startSession();break;
  case 'setupStart':ui.setupStep=0;ui.setupTmp=newSetupTmp();view='setup';render();break;
  case 'goalCurious':ui.setupTmp.goals=[];ui.setupTmp.curious=true;render();break;
  case 'goalTog':{const g=ui.setupTmp.goals;const i=g.indexOf(arg);if(i>=0)g.splice(i,1);else g.push(arg);ui.setupTmp.curious=false;render();break}
  case 'setupNext':{const tmp=ui.setupTmp;if(tmp.curious||!tmp.goals.length){const old=store.setup||{};store.setup={done:true,goals:[],other:'',watch:old.watch||null,note:old.note||'',contact:old.contact||null};save();view='home';render();break}
   if(!tmp.watchLabel){const d=defaultWatch(tmp.goals);tmp.watchLabel=tmp.goals.includes('other')&&tmp.other?tmp.other:(store.lang==='fr'?d[1]:d[0])}ui.setupStep=1;render();break}
  case 'setupBack':ui.setupStep=Math.max(0,ui.setupStep-1);render();break;
  case 'watchUse':{const lab=(ui.setupTmp.watchLabel||'').trim();ui.setupTmp.watch=lab?{en:lab,fr:lab}:null;ui.setupStep=2;render();break}
  case 'watchSkip':ui.setupTmp.watch=null;ui.setupStep=2;render();break;
  case 'noteNext':case 'noteSkip':if(a==='noteSkip')ui.setupTmp.note='';ui.setupStep=3;render();break;
  case 'contactDone':case 'contactSkip':{const tmp=ui.setupTmp;const name=(tmp.cName||'').trim(),phone=(tmp.cPhone||'').trim();
   store.setup={done:true,goals:tmp.goals.slice(),other:(tmp.other||'').trim(),watch:tmp.watch||null,note:(tmp.note||'').trim(),contact:(a==='contactDone'&&phone)?{name:name||phone,phone}:null};save();ui.msg=t('setupDone');view='home';render();break}
  case 'saveNote':{const n=document.getElementById('noteEdit'),cn=document.getElementById('cNameEdit'),cp=document.getElementById('cPhoneEdit');store.setup.note=n?n.value.trim():store.setup.note;const phone=cp?cp.value.trim():'';store.setup.contact=phone?{name:(cn&&cn.value.trim())||phone,phone}:null;save();ui.msg=L('Saved.','Enregistré.');render();break}
  case 'choose':choose(arg);break;
  case 'undo':undo();break;
  case 'abandon':S=null;view='home';render();break;
  case 'chip':{const [id,v]=arg.split(':');if(ui.chips[id]===v)delete ui.chips[id];else ui.chips[id]=v;render();break}
  case 'finish':finalize(Object.assign({},ui.chips));break;
  case 'finishSkip':finalize(ui.pre?Object.assign({},ui.pre):{});break;
  case 'keep':keepGoing();break;
  case 'toggleAll':ui.showAll=!ui.showAll;render();break;
  case 'toggleOrder':ui.showOrder=!ui.showOrder;render();break;
  case 'copyAI':copyText(aiText(),'copied','copyFail');break;
  case 'togPatch':store.connect.patch=!store.connect.patch;store.connect_asked=true;patchCache=null;save();render();break;
  case 'connectDone':store.connect_asked=true;save();view=(S&&S.result)?'result':'home';ui.msg='';render();break;
  case 'usePaste':usePaste(ui.pasteText||'');break;
  case 'slipGoal':ui.slip.goal=arg;render();break;
  case 'slipDay':ui.slip.date=arg;render();break;
  case 'slipSave':{const s=ui.slip;if(!s.goal)break;const rec={id:uid(),date:s.date,goal:s.goal,start:s.start||null,end:s.end||null,cost:(s.n!=null&&!isNaN(s.n))?{n:s.n,unit:s.unit||'other'}:null,t:Date.now()};store.slips.push(rec);save();
   // the day's session, if any, now carries the slip flag in the shared table
   const ds=store.sessions.filter(x=>x.date===rec.date);ds.forEach(writeShared);ui.slipSaved=rec;view='slipdone';render();break}
  case 'export':ui.exportText=exportJSON();ui.msg='';render();break;
  case 'copyExport':copyText(ui.exportText,'copied','copyFail');break;
  case 'download':tryDownload(ui.exportText,`sollum-${fmtDate(new Date())}.json`);break;
  case 'reset':if(!ui.resetArmed){ui.resetArmed=true;render()}else{clearShared();store=defaults();save();patchCache=null;ui.resetArmed=false;ui.exportText='';ui.pasteText='';ui.chips=null;ui.pre=null;fbDraft='';pat={step:0,extra:0};ui.msg=t('resetDone');render()}break;
 }
}

/* ---------- words.json, when the site serves one (same origin only) ---------- */
(function loadWords(){
 if(!/^https?:$/.test(location.protocol))return;
 fetch('words.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{
  if(!j||!Array.isArray(j.words)||j.words.length<10)return;
  const ids=new Set(j.words.map(w=>w&&w.id));
  const ok=j.words.every(w=>w&&typeof w.id==='string'&&typeof w.en==='string'&&typeof w.fr==='string'&&LEVELS[w.level]&&(w.side==='h'||w.side==='p')&&ids.has(w.twin));
  if(!ok)return;
  POOL=j.words.map(w=>({id:w.id,en:w.en,fr:w.fr,level:w.level,side:w.side,twin:w.twin}));POOL_VERSION=String(j.version||POOL_VERSION);
  store.pool_version=POOL_VERSION;save();if(view==='home'||view==='settings')render();
 }).catch(()=>{});
})();
render();
</script>
<script>/* offline: only on https (v3ktor.org) or localhost — a file opened from the phone just runs */
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(function(){})}
/* install: keep the browser's offer for the big Install button on Home; without an offer (iPhone, some browsers) the button opens the steps on the site page */
(function(){var ev=null;
 window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e});
 window.addEventListener('appinstalled',function(){ev=null;window.__installed=true;document.querySelectorAll('.instbig').forEach(function(x){x.remove()})});
 document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('[data-install-big]'):null;if(!b)return;e.preventDefault();
  function go(){var p=ev;p.prompt();p.userChoice.finally(function(){ev=null})}
  function steps(){try{sessionStorage.setItem('v3k.inst.tried','1')}catch(x){}location.href='../#install'}
  if(ev){go();return}if(!/Android/i.test(navigator.userAgent)){steps();return}if(b.disabled)return;
  /* on Android the browser's offer can arrive a moment after the page: wait up to 2.5 seconds before going to the steps */
  b.disabled=true;var n=0,iv=setInterval(function(){n++;if(ev){clearInterval(iv);b.disabled=false;go()}else if(n>=10){clearInterval(iv);steps()}},250)});
})();
</script>
