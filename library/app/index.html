   [['Alcohol over the night','L’alcool sur la nuit'],['At every dose studied, alcohol made people fall asleep faster and steadied the first half of the night, then broke up the second half. The first darting-eye period came later at every dose, and moderate and high doses cut that stage over the whole night.','À chaque dose étudiée, l’alcool faisait s’endormir plus vite et stabilisait la première moitié de la nuit, puis brisait la deuxième moitié. La première période où les yeux bougent arrivait plus tard à chaque dose, et les doses moyennes et fortes réduisaient ce stade sur toute la nuit.'],'solid',w=>NIGHT(w,9)],
   [['How much','Combien'],['Canada’s 24-hour guidelines recommend 7 to 9 hours of good-quality sleep for adults aged 18 to 64, and 7 to 8 hours from age 65, with steady bed and wake times. In a 2020 survey, about 3 in 4 adults under 65 met the hours.','Les directives canadiennes en matière de mouvement sur 24 heures recommandent 7 à 9 heures de sommeil de bonne qualité pour les adultes de 18 à 64 ans, et 7 à 8 heures à partir de 65 ans, avec des heures de coucher et de lever régulières. Dans une enquête de 2020, environ 3 adultes sur 4 de moins de 65 ans atteignaient ces heures.'],'solid',w=>NIGHT(w,10)],
   [['When tired is a sign','Quand la fatigue est un signe'],['Breathing that stops and starts during sleep, loud frequent snoring and gasping for air can be signs of a breathing problem at night {sleep apnea}, a leading cause of daytime sleepiness. NHLBI lists these as reasons to talk to a healthcare provider; a sleep study can tell.','Une respiration qui s’arrête et repart pendant le sommeil, un ronflement fort et fréquent et des halètements peuvent être des signes d’un problème de respiration la nuit {apnée du sommeil}, une cause majeure de somnolence le jour. Le NHLBI nomme ces signes comme raisons d’en parler à un professionnel de la santé; une étude du sommeil peut le dire.'],'solid',w=>NIGHT(w,11)]
  ]},
{ id:'stress', sec:'signals', t:['The stress response','La réponse au stress'], d:['Two alarms, their brakes, and what happens when the alarm stays on.','Deux alarmes, leurs freins, et ce qui arrive quand l’alarme reste allumée.'],
  src:['harvardStress','statpearlsCortisol','tache07','stengel09','monnikes01','mayoPanic','mayoPanicHeart'],
  more:[['Harvard Health describes the sequence: the amygdala perceives danger and sends a distress signal to the hypothalamus, which activates the sympathetic nervous system; the adrenal glands release epinephrine into the blood. Then the hypothalamus releases corticotropin-releasing hormone, the pituitary releases adrenocorticotropic hormone, and the adrenal glands release cortisol. When the threat passes, cortisol levels fall.','Harvard Health décrit la suite\u00a0: l’amygdale perçoit un danger et envoie un signal de détresse à l’hypothalamus, qui active le système nerveux sympathique; les glandes surrénales libèrent l’épinéphrine dans le sang. Ensuite, l’hypothalamus libère l’hormone de libération de la corticotropine, l’hypophyse libère l’hormone corticotrope, et les glandes surrénales libèrent le cortisol. Quand la menace passe, le cortisol baisse.'],
        ['StatPearls: adults make about 8 to 30 mg of cortisol a day. Cortisol raises blood sugar mainly by increasing the liver’s production of new glucose, and reduces glucose uptake in other tissues; it also damps inflammatory signals. It acts back on the hypothalamus and the pituitary to lower its own release.','StatPearls\u00a0: les adultes fabriquent environ 8 à 30 mg de cortisol par jour. Le cortisol augmente le sucre du sang surtout en poussant le foie à fabriquer du nouveau glucose, et réduit l’entrée du glucose dans les autres tissus; il calme aussi les signaux d’inflammation. Il agit en retour sur l’hypothalamus et l’hypophyse pour baisser sa propre libération.'],
        ['In reviews of stress and the gut, delayed stomach emptying is the most common response to sudden stress in animals and in people without gut problems; faster movement of the large intestine is well shown in animals. Much of the detail of how it works comes from animal studies.','Dans les revues sur le stress et l’intestin, une vidange plus lente de l’estomac est la réponse la plus fréquente à un stress soudain chez les animaux et chez les personnes sans problème digestif; le mouvement plus rapide du gros intestin est bien montré chez les animaux. Une grande partie des détails sur le fonctionnement vient d’études chez les animaux.'],
        ['Harvard Health on long-lasting stress: persistent epinephrine surges can damage blood vessels and arteries, raising blood pressure and the risk of heart attack or stroke; elevated cortisol increases appetite and the storage of unused nutrients as fat. These are summaries of research, much of it observational.','Harvard Health sur le stress qui dure\u00a0: des poussées d’épinéphrine répétées peuvent abîmer les vaisseaux sanguins et les artères, ce qui augmente la pression et le risque de crise cardiaque ou d’AVC; un cortisol élevé augmente l’appétit et le stockage en gras des nutriments non utilisés. Ce sont des résumés de recherches, en bonne partie observationnelles.'],
        ['Mayo Clinic lists among panic attack symptoms a rapid, pounding heart, sweating, trembling, shortness of breath, chest pain, nausea and dizziness, and says that during one a person may think they are having a heart attack. It describes panic attacks as not dangerous but hard to manage alone.','Mayo Clinic nomme parmi les symptômes d’une crise de panique un cœur rapide qui bat fort, la sueur, les tremblements, l’essoufflement, une douleur à la poitrine, des nausées et des étourdissements, et dit que pendant une crise, une personne peut croire qu’elle fait une crise cardiaque. Mayo Clinic décrit les crises de panique comme non dangereuses, mais difficiles à gérer sans aide.']],
  f:[
   [['Two alarms','Deux alarmes'],['When the brain spots a threat, a small part of it {amygdala} sends a distress signal to a control centre at its base {hypothalamus}. That centre starts two alarms: a fast one through the nerves, and a slower one through messengers in the blood.','Quand le cerveau repère une menace, une petite partie de lui {amygdale} envoie un signal de détresse à un centre de contrôle à sa base {hypothalamus}. Ce centre lance deux alarmes\u00a0: une rapide par les nerfs, et une plus lente par des messagers dans le sang.'],'solid',w=>STRESS(w,0)],
   [['The fast alarm','L’alarme rapide'],['The fast alarm runs down the nerves {sympathetic nervous system} to the glands on top of the kidneys {adrenal glands}, which pour a messenger into the blood {adrenaline, epinephrine}. The heart beats faster, breathing speeds up, the airways open wide and the senses sharpen, so fast that a person isn’t aware of it.','L’alarme rapide descend par les nerfs {système nerveux sympathique} jusqu’aux glandes sur le dessus des reins {glandes surrénales}, qui versent un messager dans le sang {adrénaline, épinéphrine}. Le cœur bat plus vite, la respiration accélère, les voies d’air s’ouvrent grand et les sens s’aiguisent, si vite qu’une personne ne s’en rend pas compte.'],'solid',w=>STRESS(w,1)],
   [['Fuel on demand','Du carburant sur demande'],['Adrenaline also releases sugar and fat from storage into the blood, as fuel for the whole body.','L’adrénaline libère aussi du sucre et du gras des réserves dans le sang, comme carburant pour tout le corps.'],'solid',w=>STRESS(w,2)],
   [['The slow alarm','L’alarme lente'],['If the threat lasts, a slower chain starts: the control centre signals a gland under the brain {pituitary}, which signals the adrenal glands to release a second messenger {cortisol}. Cortisol keeps the body on alert.','Si la menace dure, une chaîne plus lente démarre\u00a0: le centre de contrôle fait signe à une glande sous le cerveau {hypophyse}, qui fait signe aux glandes surrénales de libérer un deuxième messager {cortisol}. Le cortisol garde le corps en alerte.'],'solid',w=>STRESS(w,3)],
   [['What cortisol does','Ce que fait le cortisol'],['Cortisol raises blood sugar by having the liver make new sugar, and lets less sugar into other tissues. It also calms inflammation.','Le cortisol fait monter le sucre du sang en poussant le foie à fabriquer du nouveau sucre, et laisse entrer moins de sucre dans les autres tissus. Il calme aussi l’inflammation.'],'solid',w=>STRESS(w,4)],
   [['The brakes','Les freins'],['Cortisol turns its own alarm down: it tells the control centre and the gland under the brain to send less {negative feedback}. When the threat passes, cortisol falls, and another branch of the nerves acts like a brake on the fast alarm: rest and digest {parasympathetic nervous system}.','Le cortisol baisse sa propre alarme\u00a0: il dit au centre de contrôle et à la glande sous le cerveau d’en envoyer moins {rétroaction négative}. Quand la menace passe, le cortisol baisse, et une autre branche des nerfs agit comme un frein sur l’alarme rapide\u00a0: repos et digestion {système nerveux parasympathique}.'],'solid',w=>STRESS(w,5)],
   [['Digestion on hold','La digestion en pause'],['During a sudden stress, the stomach empties more slowly, and the large intestine tends to push harder. The slower stomach has been measured in animals and in people; the push in the large intestine is shown mostly in animals.','Pendant un stress soudain, l’estomac se vide plus lentement, et le gros intestin a tendance à pousser plus fort. L’estomac plus lent a été mesuré chez les animaux et chez les humains; la poussée du gros intestin est montrée surtout chez les animaux.'],'likely',w=>STRESS(w,6)],
   [['The daily rhythm','Le rythme de la journée'],['Even without stress, cortisol follows the body clock: it starts rising in the last hours of sleep, peaks around waking and falls through the day, lowest at night.','Même sans stress, le cortisol suit l’horloge du corps\u00a0: il commence à monter dans les dernières heures du sommeil, atteint son maximum vers le réveil et baisse pendant la journée, au plus bas la nuit.'],'solid',w=>STRESS(w,7)],
   [['When the alarm stays on','Quand l’alarme reste allumée'],['Repeated adrenaline surges can damage blood vessels and raise blood pressure, adding to the chance of a heart attack or stroke. Cortisol that stays high raises appetite and stores unused fuel as fat.','Des poussées d’adrénaline répétées peuvent abîmer les vaisseaux sanguins et faire monter la pression, ce qui augmente le risque de crise cardiaque ou d’AVC. Un cortisol qui reste élevé augmente l’appétit et stocke en gras le carburant non utilisé.'],'likely',w=>STRESS(w,8)],
   [['An alarm with no danger','Une alarme sans danger'],['In a panic attack, the alarm goes off with no real danger: a pounding heart, sweating, shaking, short breath, chest pain. During one, a person may think it’s a heart attack. Mayo Clinic says panic attacks are not dangerous and, since the symptoms can look like a heart attack, recommends medical help when the cause isn’t clear (see The burn after a meal).','Dans une crise de panique, l’alarme sonne sans vrai danger\u00a0: un cœur qui bat fort, la sueur, les tremblements, le souffle court, une douleur à la poitrine. Pendant une crise, une personne peut croire que c’est une crise cardiaque. Mayo Clinic dit que les crises de panique ne sont pas dangereuses et, comme les symptômes peuvent ressembler à une crise cardiaque, recommande de l’aide médicale quand la cause n’est pas claire (voir La brûlure après le repas).'],'solid',w=>STRESS(w,9)]
  ]},
{ id:'reward', sec:'signals', drug:true, t:['Reward and habit','La récompense et l’habitude'], d:['Dopamine, the cue that pulls, tolerance, withdrawal, and how long a habit takes.','La dopamine, le signal qui attire, la tolérance, le sevrage et le temps que prend une habitude.'],
  src:['nidaBrain','schultz97','berridge16','volkow16','juliano04','lally10','medlineAW','fdaBenzo'],
  more:[['NIDA: the basal ganglia form a key node of the brain’s reward circuit. Scientists now think dopamine has more to do with getting people to repeat pleasurable activities (reinforcement) than with producing pleasure directly. Drugs can cause surges much greater than the smaller bursts produced naturally, and large surges teach the brain to seek the drug at the expense of other goals. NIDA describes cues linked to drug use as a learned reflex that can last a long time, even in people who haven’t used drugs in many years.','NIDA\u00a0: les noyaux gris centraux forment un nœud clé du circuit de la récompense. Les scientifiques pensent maintenant que la dopamine sert davantage à faire répéter les activités agréables (renforcement) qu’à produire le plaisir directement. Les drogues peuvent causer des poussées beaucoup plus fortes que les petites rafales naturelles, et les grosses poussées apprennent au cerveau à chercher la drogue aux dépens d’autres buts. NIDA décrit les signaux liés à la consommation comme un réflexe appris qui peut durer longtemps, même chez des personnes qui n’ont pas consommé depuis des années.'],
        ['Schultz, Dayan & Montague 1997 describe recordings of single dopamine cells in two areas deep in the brain (the ventral tegmental area and the substantia nigra) of alert monkeys. An unpredicted drop of juice activated them. After learning, the cue that predicted the juice activated them and the predicted juice did not. When a predicted reward was left out, their activity dropped exactly when it would have come. Pictures 2 and 3 are graded likely because the recordings are in monkeys.','Schultz, Dayan et Montague 1997 décrivent des enregistrements de cellules à dopamine, une à la fois, dans deux zones au fond du cerveau (l’aire tegmentale ventrale et la substance noire) de singes éveillés. Une goutte de jus imprévue les activait. Après l’apprentissage, le signal qui annonçait le jus les activait, et le jus attendu, non. Quand une récompense attendue était retirée, leur activité baissait au moment exact où elle aurait dû arriver. Les images 2 et 3 sont notées probables parce que les enregistrements sont faits chez des singes.'],
        ['Berridge & Robinson 2016: rats’ liking reactions to a sugar taste stayed normal after nearly all brain dopamine was removed. They propose that dopamine systems drive wanting (incentive salience), not liking, and that addiction amplifies wanting, especially when cues are present, without necessarily amplifying liking. It is a theory built largely on animal studies, so picture 4 is graded likely.','Berridge et Robinson 2016\u00a0: les réactions de plaisir des rats à un goût sucré restaient normales après le retrait de presque toute la dopamine du cerveau. Ils proposent que les systèmes de la dopamine poussent l’envie (saillance incitative), pas le plaisir, et que la dépendance amplifie l’envie, surtout en présence de signaux, sans forcément amplifier le plaisir. C’est une théorie bâtie surtout sur des études animales; l’image 4 est donc notée probable.'],
        ['Volkow, Koob & McLellan 2016: with a natural reward like food, dopamine cells stop firing after repeated consumption (satiation); addictive drugs get around that and keep raising dopamine. With repeated use, the dopamine cells fire to the cues that predict the drug. In addiction, the drug raises dopamine much less than in people who have never used it, and the reward system becomes less sensitive to drug and non-drug rewards alike. A stress system (corticotropin-releasing factor, dynorphin) drives the low phase when the drug wears off. These changes become deeply ingrained and are not reversed right away by stopping the drug. NIDA adds that the brain may make less dopamine or remove receptors.','Volkow, Koob et McLellan 2016\u00a0: avec une récompense naturelle comme la nourriture, les cellules à dopamine arrêtent de décharger après une consommation répétée (satiété); les drogues contournent ça et continuent de faire monter la dopamine. Avec l’usage répété, les cellules à dopamine déchargent aux signaux qui annoncent la drogue. Dans la dépendance, la drogue fait monter la dopamine beaucoup moins que chez les personnes qui n’en ont jamais pris, et le système de la récompense devient moins sensible aux récompenses, drogue ou non. Un système du stress (le facteur de libération de la corticotropine, la dynorphine) entraîne la phase basse quand l’effet passe. Ces changements s’enracinent et ne se renversent pas tout de suite à l’arrêt de la drogue. NIDA ajoute que le cerveau peut fabriquer moins de dopamine ou retirer des récepteurs.'],
        ['Juliano & Griffiths 2004 reviewed 57 experimental and 9 survey studies. The symptoms they validated: headache, fatigue, less energy, less alertness, drowsiness, less contentment, depressed mood, difficulty concentrating, irritability and foggy thinking. Headache appeared in 50% of people in the experiments; distress or trouble functioning that mattered clinically, in 13%. Onset at 12 to 24 hours, peak at 20 to 51 hours, duration 2 to 9 days; symptoms appeared after stopping as little as 100 mg a day.','Juliano et Griffiths 2004 ont revu 57 études expérimentales et 9 enquêtes. Les symptômes validés\u00a0: mal de tête, fatigue, moins d’énergie, moins de vigilance, somnolence, moins de contentement, humeur dépressive, difficulté à se concentrer, irritabilité et esprit embrumé. Le mal de tête touchait 50\u00a0% des personnes dans les expériences; une détresse ou une difficulté à fonctionner importante sur le plan clinique, 13\u00a0%. Début à 12 à 24 heures, maximum à 20 à 51 heures, durée de 2 à 9 jours; des symptômes apparaissaient à l’arrêt d’aussi peu que 100\u00a0mg par jour.'],
        ['Lally et al. 2010: 96 volunteers each picked an eating, drinking or activity behaviour, did it daily in the same situation for 12 weeks, and rated how automatic it felt each day. 82 gave enough data; the curve fit 39 of them well. For those 39, the median time to reach 95% of their plateau was 66 days, from 18 to 254; times past 84 days are estimates from the curve. One missed day lowered automaticity briefly, with no longer-term cost. Exercise took longer (median 91 days) than eating (65) or drinking (59), but the difference wasn’t statistically significant. It is one study, so picture 9 is graded likely.','Lally et coll. 2010\u00a0: 96 volontaires ont chacun choisi un comportement lié au manger, au boire ou à l’activité physique, l’ont répété chaque jour dans la même situation pendant 12 semaines, et ont noté chaque jour à quel point il était automatique. 82 ont fourni assez de données; la courbe convenait bien à 39 d’entre eux. Pour ces 39, le temps médian pour atteindre 95\u00a0% de leur plafond était de 66 jours, de 18 à 254; les durées au-delà de 84 jours sont estimées à partir de la courbe. Une journée manquée baissait l’automatisme brièvement, sans coût à plus long terme. L’exercice prenait plus de temps (médiane de 91 jours) que le manger (65) ou le boire (59), mais la différence n’était pas statistiquement significative. C’est une seule étude; l’image 9 est donc notée probable.'],
        ['MedlinePlus (reviewed 2025): alcohol withdrawal symptoms tend to start within 8 hours of the last drink, peak by 24 to 72 hours and may go on for weeks; they include anxiety, depression, fatigue, irritability, shakiness, mood swings, nightmares and unclear thinking. Delirium tremens is a severe form. MedlinePlus calls alcohol withdrawal a serious condition that may quickly become life-threatening, and lists seizures, fever, severe confusion, hallucinations or an irregular heartbeat as reasons to go to the emergency room. FDA (2020): physical dependence can occur when benzodiazepines are taken steadily for several days to weeks, even as prescribed; stopping them abruptly or lowering the dose too quickly can cause withdrawal reactions, including seizures, which can be life-threatening.','MedlinePlus (révisé en 2025)\u00a0: les symptômes du sevrage de l’alcool commencent souvent dans les 8 heures après le dernier verre, culminent vers 24 à 72 heures et peuvent durer des semaines; ils comprennent l’anxiété, la dépression, la fatigue, l’irritabilité, les tremblements, les sautes d’humeur, les cauchemars et une pensée confuse. Le délirium tremens en est une forme grave. MedlinePlus décrit le sevrage de l’alcool comme un état grave qui peut vite mettre la vie en danger, et nomme les convulsions, la fièvre, une grande confusion, des hallucinations ou un cœur irrégulier comme des raisons d’aller à l’urgence. FDA (2020)\u00a0: une dépendance physique peut apparaître quand des benzodiazépines sont prises régulièrement pendant quelques jours à quelques semaines, même comme prescrit; les arrêter d’un coup ou baisser la dose trop vite peut causer des réactions de sevrage, dont des convulsions, qui peuvent mettre la vie en danger.']],
  f:[
   [['Do it again','Recommencer'],['When something good happens, like food when hungry, cells deep in the brain release a messenger {dopamine} into a reward area {basal ganglia}. Dopamine does less to make the moment feel good than to teach the brain to do it again {reinforcement}.','Quand quelque chose de bon arrive, comme manger quand une personne a faim, des cellules au fond du cerveau libèrent un messager {dopamine} dans une zone de la récompense {noyaux gris centraux}. La dopamine sert moins à rendre le moment agréable qu’à apprendre au cerveau à recommencer {renforcement}.'],'solid',w=>REWARD(w,0)],
   [['Surprise','La surprise'],['In monkeys, dopamine cells were recorded one at a time. A drop of juice that came with no warning made them fire in a burst.','Chez des singes, des cellules à dopamine ont été enregistrées une à la fois. Une goutte de jus arrivée sans avertissement les faisait décharger en rafale.'],'likely',w=>REWARD(w,1)],
   [['The cue takes over','Le signal prend le relais'],['When a light comes on before each drop, again and again, the burst moves to the light, and the juice itself no longer sets one off. When the light comes on and no juice follows, the cells go quiet at the exact moment it was due. NIDA describes the same learning in people: a place or a person linked to a drug can bring on a strong craving, even years later.','Quand une lumière s’allume avant chaque goutte, encore et encore, la rafale se déplace vers la lumière, et le jus lui-même n’en provoque plus. Quand la lumière s’allume et qu’aucun jus ne suit, les cellules se taisent au moment exact où il était attendu. NIDA décrit le même apprentissage chez les humains\u00a0: un lieu ou une personne liés à une drogue peuvent amener une forte envie, même des années plus tard.'],'likely',w=>REWARD(w,2)],
   [['Wanting isn’t liking','L’envie n’est pas le plaisir'],['Rats with nearly all their brain dopamine removed still showed normal pleasure reactions to a sugar taste {liking}. From this, two researchers proposed that dopamine drives the wanting {incentive salience}, not the liking; in addiction, the wanting can grow while the liking doesn’t.','Des rats à qui il ne restait presque plus de dopamine dans le cerveau montraient encore, devant un goût sucré, des réactions de plaisir normales {réactions hédoniques}. De là, deux chercheurs ont proposé que la dopamine pousse l’envie {saillance incitative}, pas le plaisir; dans la dépendance, l’envie peut grandir sans que le plaisir grandisse.'],'likely',w=>REWARD(w,3)],
   [['A shortcut','Un raccourci'],['Drugs act on the same reward area directly, with dopamine surges much greater than the smaller bursts from food or company; NIDA compares a shout into a microphone with a whisper. After a meal, the bursts stop once hunger is met {satiation}; drugs get around that stop.','Les drogues agissent directement sur la même zone, avec des poussées de dopamine beaucoup plus fortes que les petites rafales de la nourriture ou de la compagnie; NIDA compare un cri dans un micro à un chuchotement. Après un repas, les rafales s’arrêtent une fois la faim comblée {satiété}; les drogues contournent cet arrêt.'],'solid',w=>REWARD(w,4)],
   [['Tolerance','La tolérance'],['With repeated surges, the brain adjusts: it makes less dopamine or removes some of the cups that receive it {receptors}. The same amount then does less, and more is needed for the same effect {tolerance}. Everyday rewards pull less too.','Avec des poussées répétées, le cerveau s’ajuste\u00a0: il fabrique moins de dopamine ou retire une partie des bols qui la reçoivent {récepteurs}. La même quantité fait alors moins d’effet, et il en faut plus pour le même effet {tolérance}. Les récompenses de tous les jours attirent moins, elles aussi.'],'solid',w=>REWARD(w,5)],
   [['When it wears off','Quand l’effet passe'],['A circuit tied to stress {extended amygdala} grows more sensitive with use. When the drug wears off, a person can feel anxious, irritable and uneasy, below where they started {withdrawal}. Over time, the drug can become a way to get relief from that feeling more than a way to get high.','Un circuit lié au stress {amygdale étendue} devient plus sensible avec l’usage. Quand l’effet passe, une personne peut se sentir anxieuse, irritable et mal à l’aise, plus bas qu’au départ {sevrage}. Avec le temps, la drogue peut servir à soulager ce malaise plus qu’à planer.'],'solid',w=>REWARD(w,6)],
   [['Caffeine withdrawal','Le sevrage de la caféine'],['Caffeine shows withdrawal on a small scale. In a review of 57 experiments, stopping as little as 100 mg a day brought symptoms 12 to 24 hours later: headache in 1 person in 2, tiredness, drowsiness, low mood, trouble concentrating. They peaked at 20 to 51 hours and lasted 2 to 9 days.','La caféine montre le sevrage à petite échelle. Dans une revue de 57 expériences, arrêter aussi peu que 100\u00a0mg par jour amenait des symptômes 12 à 24 heures plus tard\u00a0: mal de tête chez 1 personne sur 2, fatigue, somnolence, humeur basse, difficulté à se concentrer. Ils culminaient entre 20 et 51 heures et duraient de 2 à 9 jours.'],'solid',w=>REWARD(w,7)],
   [['How long a habit takes','Le temps que prend une habitude'],['Habits also form around a cue. In one study, 96 volunteers repeated a chosen eating, drinking or exercise habit every day in the same situation. How automatic it felt rose fast at first, then levelled off. For the 39 whose data fit the curve, it took a median of 66 days, from 18 to 254; the longest are estimates past the 12 weeks measured. One missed day left no lasting dent.','Une habitude se forme aussi autour d’un signal. Dans une étude, 96 volontaires ont répété chaque jour, dans la même situation, une habitude choisie de manger, de boire ou de bouger. Le sentiment d’automatisme montait vite au début, puis plafonnait. Pour les 39 dont les données suivaient la courbe, il a fallu en médiane 66 jours, de 18 à 254; les plus longs sont des estimations au-delà des 12 semaines mesurées. Une journée manquée ne laissait pas de trace durable.'],'likely',w=>REWARD(w,8)],
   [['When stopping is a medical matter','Quand arrêter devient une affaire médicale'],['For some substances, the body’s adjustment makes stopping a medical matter. MedlinePlus says alcohol withdrawal tends to start within 8 hours of the last drink, peaks by 24 to 72 hours, and may quickly become life-threatening. The FDA says the body can come to depend on calming pills {benzodiazepines} within days to weeks, even taken as prescribed, and that stopping them suddenly can bring seizures; it tells people to talk to their health care professional, who can plan a slow lowering of the dose.','Pour certaines substances, l’ajustement du corps fait de l’arrêt une affaire médicale. Selon MedlinePlus, le sevrage de l’alcool commence souvent dans les 8 heures après le dernier verre, culmine vers 24 à 72 heures et peut vite mettre la vie en danger. Selon la FDA, le corps peut devenir dépendant des calmants {benzodiazépines} en quelques jours à quelques semaines, même pris comme prescrit, et un arrêt soudain peut amener des convulsions; elle dit d’en parler au professionnel de la santé, qui peut planifier une baisse lente de la dose.'],'solid',w=>REWARD(w,9)]
  ]},
{ id:'gut-brain', sec:'signals', drug:true, t:['The gut-brain link','Le lien intestin-cerveau'], d:['A nerve, gut messengers, bacteria, and how much of it has been shown in people.','Un nerf, des messagers de l’intestin, des bactéries, et ce qui a été montré chez les humains.'],
  src:['bonaz18','breit18','shah21','terry17','sender16','sudo04','kelly16','valles19','koloski12','niddkIBS','asad25'],
  more:[['Breit et al. 2018: efferent fibres (brain to organs) make up 10 to 20% of the vagus nerve, and afferent fibres (organs to brain) 80 to 90%; Bonaz et al. 2018 give 80% and 20%. The gut’s own nervous system makes more than 30 messengers and has more neurons than the spine. Some gut hormones released into the blood cross into the brain (ghrelin, for example) and act together with the vagus nerve on appetite; cholecystokinin acts on the vagus nerve’s endings.','Breit et coll. 2018\u00a0: les fibres qui descendent (du cerveau aux organes) forment 10 à 20\u00a0% du nerf vague, et les fibres qui montent (des organes au cerveau), 80 à 90\u00a0%; Bonaz et coll. 2018 donnent 80\u00a0% et 20\u00a0%. Le système nerveux de l’intestin fabrique plus de 30 messagers et compte plus de neurones que la moelle épinière. Certaines hormones de l’intestin libérées dans le sang passent dans le cerveau (la ghréline, par exemple) et agissent avec le nerf vague sur l’appétit; la cholécystokinine agit sur les terminaisons du nerf vague.'],
        ['Shah et al. 2021: cells of the gut lining (enterochromaffin cells) make 90% of the body’s serotonin, and serotonin can’t cross the blood-brain barrier, so gut and brain serotonin are made and used separately. Terry & Margolis 2017 give 95%. In the gut, serotonin acts on movement and inflammation.','Shah et coll. 2021\u00a0: des cellules de la paroi de l’intestin (cellules entérochromaffines) fabriquent 90\u00a0% de la sérotonine du corps, et la sérotonine ne traverse pas la barrière hémato-encéphalique; la sérotonine de l’intestin et celle du cerveau sont donc fabriquées et utilisées séparément. Terry et Margolis 2017 donnent 95\u00a0%. Dans l’intestin, la sérotonine agit sur le mouvement et l’inflammation.'],
        ['Sender, Fuchs & Milo 2016: a reference man (70 kg, 20 to 30 years old) carries about 30 trillion human cells and about 38 trillion bacteria, the vast majority in the colon; earlier figures of about 100 trillion bacteria, 10 for each human cell, were far too high. The picture draws 38 and 30 squares, one per trillion.','Sender, Fuchs et Milo 2016\u00a0: un homme de référence (70 kg, de 20 à 30 ans) porte environ 30 billions de cellules humaines et environ 38 billions de bactéries, la grande majorité dans le côlon; les anciens chiffres d’environ 100 billions de bactéries, 10 pour chaque cellule humaine, étaient beaucoup trop élevés. L’image dessine 38 et 30 carrés, un par billion.'],
        ['Sudo et al. 2004: in germ-free mice, the rise of stress hormones (ACTH, corticosterone) during restraint was substantially higher than in mice with usual bacteria. Giving them one bacterium (Bifidobacterium infantis) reversed it; bacteria from other mice given early partly corrected it, and given later did not. The authors conclude that exposure to microbes early in life is needed for the stress system to be fully held in check. The bars in picture 5 show only which is higher.','Sudo et coll. 2004\u00a0: chez les souris sans germes, la hausse des hormones du stress (ACTH, corticostérone) pendant l’immobilisation était nettement plus forte que chez les souris avec leurs bactéries habituelles. Leur donner une bactérie (Bifidobacterium infantis) renversait l’effet; des bactéries d’autres souris données tôt le corrigeaient en partie, et données plus tard, non. Les auteurs concluent qu’une exposition aux microbes tôt dans la vie est nécessaire pour que le système du stress soit bien retenu. Les barres de l’image 5 montrent seulement laquelle est la plus haute.'],
        ['Kelly et al. 2016 compared 34 people with major depression and 33 matched people without it: depression went with less rich and less varied gut bacteria. Stool bacteria from the people with depression, given to rats whose own gut bacteria had been depleted, brought behaviour and body features typical of depression in rats, including anhedonia and anxiety-like behaviour.','Kelly et coll. 2016 ont comparé 34 personnes avec une dépression majeure et 33 personnes semblables sans dépression\u00a0: la dépression allait avec des bactéries intestinales moins riches et moins variées. Les bactéries des selles des personnes avec dépression, données à des rats dont les bactéries intestinales avaient été réduites, ont amené des comportements et des traits corporels typiques de la dépression chez le rat, dont l’anhédonie et des comportements de type anxieux.'],
        ['Valles-Colomer et al. 2019 surveyed 1,054 people in the Flemish Gut Flora Project and checked results in other groups (1,070 people in all). Coprococcus and Dialister were lower in depression, even after correcting for antidepressants. The authors note that gut-brain communication has mostly been explored in animal models, with human research lagging behind, and stress how much other factors matter.','Valles-Colomer et coll. 2019 ont étudié 1\u00a0054 personnes du Flemish Gut Flora Project et vérifié les résultats dans d’autres groupes (1\u00a0070 personnes en tout). Coprococcus et Dialister étaient plus bas dans la dépression, même après correction pour les antidépresseurs. Les auteurs notent que la communication intestin-cerveau a surtout été explorée chez les animaux, la recherche chez l’humain étant en retard, et soulignent le poids des autres facteurs.'],
        ['Koloski et al. 2012 followed a random sample of 1,775 Australians from 1997 for 12 years. Among people with no gut disorder at the start, higher anxiety predicted a new irritable bowel syndrome or functional dyspepsia 12 years later. Among people without high anxiety or depression at the start, those with a gut disorder had more anxiety and depression 12 years later. NIDDK: functional gut disorders, now called disorders of gut-brain interaction, are related to problems with how the brain and gut work together.','Koloski et coll. 2012 ont suivi pendant 12 ans un échantillon au hasard de 1\u00a0775 Australiens, à partir de 1997. Chez les personnes sans trouble digestif au départ, une anxiété plus élevée prédisait un nouveau syndrome de l’intestin irritable ou une dyspepsie fonctionnelle 12 ans plus tard. Chez les personnes sans anxiété ni dépression élevée au départ, celles avec un trouble digestif avaient plus d’anxiété et de dépression 12 ans plus tard. NIDDK\u00a0: les troubles digestifs fonctionnels, appelés maintenant troubles de l’interaction intestin-cerveau, sont liés à la façon dont le cerveau et l’intestin travaillent ensemble.'],
        ['Asad et al. 2025 (Nutrition Reviews): in 18 trials with 969 people with depression, probiotics lowered depression scores on average; in 9 trials with 510 people with anxiety, they lowered anxiety scores. The review rated the depression evidence low certainty and the anxiety evidence moderate. Results varied widely between trials, most studies were underpowered and had risk-of-bias concerns, there were signs of publication bias, and shorter trials showed larger effects. In 3 trials, prebiotics (fibres that feed gut bacteria) did not change depression scores significantly.','Asad et coll. 2025 (Nutrition Reviews)\u00a0: dans 18 essais avec 969 personnes avec dépression, les probiotiques baissaient en moyenne les scores de dépression; dans 9 essais avec 510 personnes avec anxiété, ils baissaient les scores d’anxiété. La revue a jugé les données sur la dépression de faible certitude et celles sur l’anxiété de certitude moyenne. Les résultats variaient beaucoup d’un essai à l’autre, la plupart des études manquaient de puissance et présentaient des risques de biais, il y avait des signes de biais de publication, et les essais plus courts montraient des effets plus grands. Dans 3 essais, les prébiotiques (des fibres qui nourrissent les bactéries) ne changeaient pas les scores de dépression de façon significative.']],
  f:[
   [['A line both ways','Une ligne dans les deux sens'],['Stress slows the stomach (see The stress response); the line also runs the other way. The main line is a long nerve between the brain and the gut {vagus nerve}, part of the rest-and-digest branch. About 80 to 90% of its fibres carry messages up, from the gut and other organs to the brain.','Le stress ralentit l’estomac (voir La réponse au stress); la ligne va aussi dans l’autre sens. La ligne principale est un long nerf entre le cerveau et l’intestin {nerf vague}, qui fait partie de la branche repos et digestion. Environ 80 à 90\u00a0% de ses fibres transportent des messages vers le haut, de l’intestin et des autres organes vers le cerveau.'],'solid',w=>GUTBRAIN(w,0)],
   [['The gut’s own nerves','Les nerfs de l’intestin'],['The gut wall has its own network of nerve cells {enteric nervous system}, with more nerve cells than the spinal cord. Messengers made in the gut reach the brain through the long nerve or through the blood; the fullness messenger from The brakes on eating acts on the long nerve.','La paroi de l’intestin a son propre réseau de cellules nerveuses {système nerveux entérique}, avec plus de cellules nerveuses que la moelle épinière. Des messagers fabriqués dans l’intestin rejoignent le cerveau par le long nerf ou par le sang; le messager de la satiété de Les freins de l’appétit agit sur le long nerf.'],'solid',w=>GUTBRAIN(w,1)],
   [['Serotonin stays in the gut','La sérotonine reste dans l’intestin'],['About 90 to 95% of the body’s serotonin is made by cells of the gut lining {enterochromaffin cells}, where it acts on gut movement and inflammation. It can’t cross into the brain {blood-brain barrier}: the brain makes its own, separately.','Environ 90 à 95\u00a0% de la sérotonine du corps est fabriquée par des cellules de la paroi de l’intestin {cellules entérochromaffines}, où elle agit sur le mouvement et l’inflammation. Elle ne peut pas passer dans le cerveau {barrière hémato-encéphalique}\u00a0: le cerveau fabrique la sienne, séparément.'],'solid',w=>GUTBRAIN(w,2)],
   [['38 trillion bacteria','38 billions de bactéries'],['Most of the body’s bacteria live in the large intestine {gut microbiota}: about 38 trillion in a typical adult man, close to his 30 trillion human cells. That is about 1.3 bacteria per human cell, not the 10 often quoted.','La plupart des bactéries du corps vivent dans le gros intestin {microbiote intestinal}\u00a0: environ 38 billions chez un homme adulte typique, près de ses 30 billions de cellules humaines. Ça fait environ 1,3 bactérie par cellule humaine, pas les 10 souvent cités.'],'solid',w=>GUTBRAIN(w,3)],
   [['Mice with no bacteria','Des souris sans bactéries'],['Mice raised with no gut bacteria at all {germ-free} had a bigger rise in stress hormones when held still. One kind of gut bacterium given to them reversed it. Bacteria from other mice given early in life partly corrected it; given later, they didn’t.','Des souris élevées sans aucune bactérie intestinale {sans germes} avaient une plus forte hausse des hormones du stress quand elles étaient immobilisées. Une sorte de bactérie intestinale qui leur était donnée renversait l’effet. Des bactéries d’autres souris données tôt dans la vie le corrigeaient en partie; données plus tard, non.'],'likely',w=>GUTBRAIN(w,4)],
   [['Bacteria moved, behaviour moved','Les bactéries changent, le comportement aussi'],['Gut bacteria from 34 people with depression were given to rats whose own gut bacteria had been cleared out. The rats then showed behaviour read as depression and anxiety in rats, like losing interest in rewards {anhedonia}.','Des bactéries intestinales de 34 personnes avec dépression ont été données à des rats dont les bactéries intestinales avaient été retirées. Les rats ont ensuite montré des comportements associés à la dépression et à l’anxiété chez le rat, comme la perte d’intérêt pour les récompenses {anhédonie}.'],'likely',w=>GUTBRAIN(w,5)],
   [['In people: a link','Chez les humains\u00a0: un lien'],['In 1,054 people in Belgium, two groups of gut bacteria {Coprococcus, Dialister} were lower in those with depression, and the result was checked in other groups of people. A study like this shows a link, not which one causes the other.','Chez 1\u00a0054 personnes en Belgique, deux groupes de bactéries intestinales {Coprococcus, Dialister} étaient plus bas chez celles avec une dépression, et le résultat a été vérifié dans d’autres groupes. Une étude comme celle-là montre un lien, pas lequel cause l’autre.'],'likely',w=>GUTBRAIN(w,6)],
   [['Both directions in people','Dans les deux sens chez les humains'],['A random sample of Australians was followed for 12 years. Among those with no gut disorder at the start, more anxiety predicted a new gut disorder {irritable bowel syndrome, functional dyspepsia}. Among those without much anxiety or depression at the start, the ones with a gut disorder had more of both 12 years later. NIDDK now calls these disorders of gut-brain interaction.','Un échantillon d’Australiens pris au hasard a été suivi pendant 12 ans. Chez ceux sans trouble digestif au départ, plus d’anxiété prédisait un nouveau trouble digestif {syndrome de l’intestin irritable, dyspepsie fonctionnelle}. Chez ceux sans beaucoup d’anxiété ni de dépression au départ, ceux avec un trouble digestif en avaient plus 12 ans plus tard. NIDDK les appelle maintenant des troubles de l’interaction intestin-cerveau.'],'likely',w=>GUTBRAIN(w,7)],
   [['Probiotics and mood','Les probiotiques et l’humeur'],['In a 2025 review of 18 trials in people with depression, live bacteria taken by mouth {probiotics} lowered depression scores on average. The review rated that evidence low certainty: most trials were small or had bias concerns, results varied widely, and there were signs that some results went unpublished.','Dans une revue de 2025 portant sur 18 essais chez des personnes avec dépression, des bactéries vivantes prises par la bouche {probiotiques} baissaient en moyenne les scores de dépression. La revue a jugé ces données de faible certitude\u00a0: la plupart des essais étaient petits ou présentaient des risques de biais, les résultats variaient beaucoup, et il y avait des signes que des résultats n’ont pas été publiés.'],'likely',w=>GUTBRAIN(w,8)],
   [['Mostly mapped in animals','Surtout étudié chez les animaux'],['Researchers in the field write that gut-brain communication has mostly been explored in animals, with human research lagging behind. Shown in people: the nerve line, where serotonin is made, the bacteria count, and links between the gut and mood. Shown mostly in animals: bacteria changing stress and behaviour. Not settled: whether changing gut bacteria changes mood in people.','Des chercheurs du domaine écrivent que la communication intestin-cerveau a surtout été explorée chez les animaux, la recherche chez l’humain étant en retard. Montré chez les humains\u00a0: la ligne nerveuse, l’endroit où la sérotonine est fabriquée, le nombre de bactéries et des liens entre l’intestin et l’humeur. Montré surtout chez les animaux\u00a0: des bactéries qui changent le stress et le comportement. Pas réglé\u00a0: si changer les bactéries de l’intestin change l’humeur chez les humains.'],'solid',w=>GUTBRAIN(w,9)]
  ]},
{ id:'sleep-cut', sec:'sleep', t:['What cuts sleep short','Ce qui écourte le sommeil'], d:['Light at night, screens, night shifts, noise, heat, and when it becomes insomnia.','La lumière le soir, les écrans, le travail de nuit, le bruit, la chaleur, et quand ça devient de l’insomnie.'],
  src:['nigmsClock','gooley11','chang15','zeitzer15','statpearlsShift','iarc124','whoNoise','minor22','statpearlsInsomnia','acpInsomnia'],
  more:[['NIGMS: the master clock is a large group of nerve cells in the brain (the suprachiasmatic nucleus). It controls the making of melatonin based on the amount of light the eyes receive; in the evening it tells the brain to make more melatonin, causing sleepiness. Light and dark have the biggest influence on the body’s daily rhythms; food, stress, physical activity, social surroundings and temperature also affect them. NIGMS notes that light from electronic devices at night can confuse the body’s clocks.','NIGMS\u00a0: l’horloge principale est un grand groupe de cellules nerveuses du cerveau (le noyau suprachiasmatique). Elle contrôle la fabrication de la mélatonine selon la quantité de lumière que reçoivent les yeux; le soir, elle dit au cerveau de fabriquer plus de mélatonine, ce qui amène la somnolence. La lumière et le noir ont la plus grande influence sur les rythmes du corps; la nourriture, le stress, l’activité physique, l’entourage et la température les touchent aussi. NIGMS note que la lumière des appareils électroniques le soir peut dérégler les horloges du corps.'],
        ['Gooley et al. 2011 compared, in a look back at two lab studies, 116 people aged 18 to 30 kept in room light (under 200 lux) or dim light (under 3 lux) for the 8 hours before bedtime. Room light delayed the start of melatonin in 99% of them and shortened the melatonin night by about 90 minutes. The authors conclude that room light shortens the body’s own sense of how long the night is. Picture 2 draws the 90 minutes at 40 px per hour; the rest of the bars is a sketch.','Gooley et coll. 2011 ont comparé, en revenant sur deux études en laboratoire, 116 personnes de 18 à 30 ans gardées dans la lumière d’une pièce (moins de 200 lux) ou une lumière faible (moins de 3 lux) pendant les 8 heures avant le coucher. La lumière de la pièce retardait le début de la mélatonine chez 99\u00a0% d’entre elles et raccourcissait la nuit de la mélatonine d’environ 90 minutes. Les auteurs concluent que la lumière de la pièce raccourcit la durée de la nuit telle que le corps la perçoit. L’image 2 dessine les 90 minutes à 40 px par heure; le reste des barres est un croquis.'],
        ['Chang et al. 2015: 12 adults read on a light-emitting tablet before bed on some evenings and from a printed book on others. With the tablet, they took longer to fall asleep (nearly 10 minutes), were less sleepy in the evening, made less melatonin, had less REM sleep, had a later body clock, and were less alert the next morning. Zeitzer 2015, writing about the study, pointed out that the tablet’s light would likely have had a much smaller effect if the people had been exposed to a normal day of light. Picture 3 is graded likely: 12 people, in a lab.','Chang et coll. 2015\u00a0: 12 adultes ont lu sur une tablette lumineuse avant le coucher certains soirs, et dans un livre imprimé d’autres soirs. Avec la tablette, ils mettaient plus de temps à s’endormir (près de 10 minutes), avaient moins sommeil le soir, fabriquaient moins de mélatonine, avaient moins de sommeil paradoxal, une horloge plus tardive, et étaient moins alertes le lendemain matin. Zeitzer 2015, en commentant l’étude, a souligné que la lumière de la tablette aurait sans doute eu un effet beaucoup plus petit si les personnes avaient eu une journée de lumière normale. L’image 3 est notée probable\u00a0: 12 personnes, en laboratoire.'],
        ['StatPearls (2024): shift work is often in opposition to workers’ daily rhythm. Insomnia is reported by 29 to 38% of shift workers, compared with about 6% of the general population, and shift workers report more sleepiness and too little sleep more often than day workers. IARC (2019): night shift work is probably carcinogenic to humans (Group 2A), based on limited evidence in humans, sufficient evidence in experimental animals and strong evidence on how it could act; positive associations were seen for some cancers, but results were inconsistent among cohort studies.','StatPearls (2024)\u00a0: le travail par quarts va souvent contre le rythme quotidien des travailleurs. L’insomnie touche de 29 à 38\u00a0% des travailleurs de quarts, contre environ 6\u00a0% de la population générale, et les travailleurs de quarts rapportent plus souvent de la somnolence et un sommeil trop court que ceux de jour. CIRC (2019)\u00a0: le travail de nuit est probablement cancérogène pour l’humain (groupe 2A), sur la base de données limitées chez l’humain, suffisantes chez l’animal et solides sur la façon dont il pourrait agir; des liens positifs ont été vus pour certains cancers, mais les résultats n’étaient pas constants d’une étude de cohorte à l’autre.'],
        ['WHO (2018) strongly recommends reducing night-time noise below 45 dB from road traffic, 44 dB from railways and 40 dB from aircraft, because noise above these levels is associated with adverse effects on sleep. The value (Lnight) is the outdoor noise at the most exposed wall of a home, averaged over a year, for the 8 night hours, usually 23:00 to 07:00.','L’OMS (2018) recommande fortement de baisser le bruit de nuit sous 45 dB pour la circulation routière, 44 dB pour les trains et 40 dB pour les avions, parce qu’un bruit plus fort est associé à des effets sur le sommeil. La valeur (Lnight) est le bruit extérieur au mur le plus exposé d’un logement, en moyenne sur une année, pour les 8 heures de nuit, habituellement de 23 h à 7 h.'],
        ['Minor et al. 2022 used about 7 million nights of sleep-tracking wristband records from more than 47,000 adults in 68 countries (2015 to 2017). On nights warmer than 30 °C outdoors, sleep was about 14 minutes shorter on average, and the chance of sleeping under 7 hours rose with temperature. The loss came mostly from falling asleep later and waking earlier. Per degree of warming, the loss was about twice as large in older adults, three times as large in lower-income countries, and larger in women. It is one large observational study, so picture 7 is graded likely; it measures outdoor, not bedroom, temperature.','Minor et coll. 2022 ont utilisé environ 7 millions de nuits enregistrées par des bracelets de suivi du sommeil chez plus de 47\u00a0000 adultes de 68 pays (2015 à 2017). Les nuits à plus de 30\u00a0°C dehors, le sommeil était plus court d’environ 14 minutes en moyenne, et la probabilité de dormir moins de 7 heures montait avec la température. La perte venait surtout d’un endormissement plus tardif et d’un réveil plus tôt. Par degré de réchauffement, la perte était environ deux fois plus grande chez les personnes âgées, trois fois plus grande dans les pays à plus faible revenu, et plus grande chez les femmes. C’est une seule grande étude d’observation; l’image 7 est donc notée probable. Elle mesure la température dehors, pas celle de la chambre.'],
        ['StatPearls: chronic insomnia is trouble falling or staying asleep at least 3 nights a week for 3 months or more, despite enough opportunity to sleep, with effects during the day. It is the most common sleep disorder, more common in women, and often comes with depression, anxiety, post-traumatic stress, high blood pressure or chronic pain. American College of Physicians (2016): about 6 to 10% of adults have insomnia that meets this definition. Its first recommendation (strong, moderate-quality evidence) is cognitive behavioural therapy for insomnia (CBT-I) as the initial treatment for all adults with chronic insomnia. CBT-I combines work on thoughts about sleep, behaviour changes (sleep restriction, stimulus control) and sleep education; it can be given in person, in groups, by phone, online or through self-help books.','StatPearls\u00a0: l’insomnie chronique, c’est de la difficulté à s’endormir ou à rester endormi au moins 3 nuits par semaine pendant 3 mois ou plus, malgré assez d’occasions de dormir, avec des effets pendant la journée. C’est le trouble du sommeil le plus fréquent, plus fréquent chez les femmes, et il vient souvent avec la dépression, l’anxiété, le stress post-traumatique, la haute pression ou la douleur chronique. American College of Physicians (2016)\u00a0: environ 6 à 10\u00a0% des adultes ont une insomnie qui répond à cette définition. Sa première recommandation (forte, données de qualité moyenne) est la thérapie cognitivo-comportementale de l’insomnie (TCC-I) comme premier traitement pour tous les adultes avec une insomnie chronique. La TCC-I combine un travail sur les pensées liées au sommeil, des changements de comportement (restriction du sommeil, contrôle du stimulus) et de l’information sur le sommeil; elle peut se faire en personne, en groupe, par téléphone, en ligne ou avec des livres d’autoassistance.']],
  f:[
   [['The clock reads light','L’horloge lit la lumière'],['A master clock in the brain {suprachiasmatic nucleus} keeps the body’s daily rhythm {circadian rhythm}. Light reaching the eyes sets it more than anything else; food, stress, activity and temperature also nudge it. In the evening, the clock tells the brain to make more of a messenger that brings sleepiness {melatonin}.','Une horloge principale dans le cerveau {noyau suprachiasmatique} règle le rythme quotidien du corps {rythme circadien}. La lumière qui atteint les yeux la règle plus que tout le reste; la nourriture, le stress, l’activité et la température la poussent aussi un peu. Le soir, l’horloge dit au cerveau de fabriquer plus d’un messager qui amène la somnolence {mélatonine}.'],'solid',w=>SLEEPCUT(w,0)],
   [['Room light in the evening','La lumière de la pièce le soir'],['In 116 young adults, ordinary room light in the 8 hours before bed, compared with dim light, delayed the start of melatonin in 99% of them and shortened its night by about 90 minutes.','Chez 116 jeunes adultes, la lumière ordinaire d’une pièce pendant les 8 heures avant le coucher, comparée à une lumière faible, retardait le début de la mélatonine chez 99\u00a0% d’entre eux et raccourcissait sa nuit d’environ 90 minutes.'],'likely',w=>SLEEPCUT(w,1)],
   [['A screen before bed','Un écran avant le coucher'],['12 adults read on a light-emitting tablet some evenings and from a printed book on others. With the tablet, they took nearly 10 minutes longer to fall asleep, made less melatonin, had less of the sleep with darting eyes {REM}, their clock ran later, and they were less alert the next morning. A scientist commenting on the study wrote that after a normal day of light, the effect would likely be much smaller.','12 adultes ont lu sur une tablette lumineuse certains soirs, et dans un livre imprimé d’autres soirs. Avec la tablette, ils mettaient près de 10 minutes de plus à s’endormir, fabriquaient moins de mélatonine, avaient moins du sommeil où les yeux bougent vite {sommeil paradoxal}, leur horloge était plus tardive, et ils étaient moins alertes le lendemain matin. Un scientifique qui a commenté l’étude a écrit qu’après une journée de lumière normale, l’effet serait sans doute beaucoup plus petit.'],'likely',w=>SLEEPCUT(w,2)],
   [['Night shifts','Le travail de nuit'],['Working nights means sleeping when the clock calls for being awake, and working when it calls for sleep. Insomnia is reported by 29 to 38% of shift workers, compared with about 6% of people in general.','Travailler de nuit, c’est dormir quand l’horloge appelle l’éveil, et travailler quand elle appelle le sommeil. L’insomnie touche de 29 à 38\u00a0% des travailleurs de quarts, contre environ 6\u00a0% de la population en général.'],'solid',w=>SLEEPCUT(w,3)],
   [['Night work and cancer','Le travail de nuit et le cancer'],['In 2019, the World Health Organization’s cancer agency {IARC} placed night shift work in its group “probably causes cancer in humans”. Its reasons: limited evidence in people, sufficient evidence in animals, and strong evidence on how it could act.','En 2019, le centre de recherche sur le cancer de l’Organisation mondiale de la santé {CIRC} a classé le travail de nuit dans son groupe «\u00a0probablement cancérogène pour l’humain\u00a0». Ses raisons\u00a0: des données limitées chez l’humain, suffisantes chez l’animal, et solides sur la façon dont il pourrait agir.'],'likely',w=>SLEEPCUT(w,4)],
   [['Noise at night','Le bruit la nuit'],['World Health Organization guidelines for Europe strongly recommend keeping night noise from road traffic below 45 decibels, from trains below 44 and from aircraft below 40, because noise above those levels is linked to effects on sleep. The values are yearly averages, measured outdoors at the most exposed wall of a home.','Les lignes directrices de l’Organisation mondiale de la santé pour l’Europe recommandent fortement de garder le bruit de nuit de la circulation sous 45 décibels, celui des trains sous 44 et celui des avions sous 40, parce qu’un bruit plus fort est lié à des effets sur le sommeil. Ce sont des moyennes annuelles, mesurées dehors, au mur le plus exposé d’un logement.'],'solid',w=>SLEEPCUT(w,5)],
   [['Warm nights','Les nuits chaudes'],['In about 7 million nights tracked by wristbands on 47,000 adults in 68 countries, nights warmer than 30 °C outdoors cut sleep by about 14 minutes on average, mostly by falling asleep later and waking earlier. Older adults, women and people in lower-income countries lost more.','Dans environ 7 millions de nuits suivies par des bracelets chez 47\u00a0000 adultes de 68 pays, les nuits à plus de 30\u00a0°C dehors raccourcissaient le sommeil d’environ 14 minutes en moyenne, surtout par un endormissement plus tardif et un réveil plus tôt. Les personnes âgées, les femmes et les gens des pays à plus faible revenu en perdaient plus.'],'likely',w=>SLEEPCUT(w,6)],
   [['When it becomes insomnia','Quand ça devient de l’insomnie'],['Trouble falling or staying asleep at least 3 nights a week for 3 months, despite enough time to sleep and with effects during the day, is called chronic insomnia {chronic insomnia disorder}; it affects about 6 to 10% of adults. The American College of Physicians recommends a therapy for the thoughts and habits around sleep {cognitive behavioural therapy for insomnia, CBT-I} as the first treatment.','De la difficulté à s’endormir ou à rester endormi au moins 3 nuits par semaine pendant 3 mois, malgré assez de temps pour dormir et avec des effets pendant la journée, s’appelle l’insomnie chronique {trouble d’insomnie chronique}; elle touche environ 6 à 10\u00a0% des adultes. L’American College of Physicians recommande une thérapie des pensées et des habitudes liées au sommeil {thérapie cognitivo-comportementale de l’insomnie, TCC-I} comme premier traitement.'],'solid',w=>SLEEPCUT(w,7)]
  ]},
{ id:'sleep-hunger', sec:'sleep', t:['Short sleep, hunger and blood sugar','Le sommeil court, la faim et le sucre du sang'], d:['Two hunger messengers, a brain that wants more, blood sugar after short nights, and what large studies can and can’t say.','Deux messagers de la faim, un cerveau qui en veut plus, le sucre du sang après des nuits courtes, et ce que les grandes études peuvent dire ou non.'],
  src:['statpearlsAppetite','statpearlsLeptin','spiegel04','greer13','alkhatib17','spiegel99','buxton12','tasali22','cappuccio10'],
  more:[['StatPearls: ghrelin, called the hunger hormone, rises before meals and falls after; leptin is made mainly by fat tissue, and the amount in the blood is in proportion to the amount of fat. A control centre at the base of the brain (the hypothalamus) weighs both to regulate hunger and fullness.','StatPearls\u00a0: la ghréline, appelée l’hormone de la faim, monte avant les repas et baisse après; la leptine est fabriquée surtout par le tissu gras, et sa quantité dans le sang suit la quantité de gras. Un centre de contrôle à la base du cerveau (l’hypothalamus) pèse les deux pour régler la faim et la satiété.'],
        ['Spiegel et al. 2004: a randomized crossover study of 12 men (average age 22, body mass index 23.6), with 2 nights of 4 hours and 2 nights of 10 hours in bed. After the short nights, leptin was 18% lower, ghrelin 28% higher, hunger 24% higher, appetite 23% higher, and appetite for calorie-dense foods high in carbohydrate 33 to 45% higher. The authors list as limits: only 12 young men, and energy spent was not measured.','Spiegel et coll. 2004\u00a0: une étude croisée au hasard chez 12 hommes (22 ans en moyenne, indice de masse corporelle de 23,6), avec 2 nuits de 4 heures et 2 nuits de 10 heures au lit. Après les nuits courtes, la leptine était 18\u00a0% plus basse, la ghréline 28\u00a0% plus haute, la faim 24\u00a0% plus haute, l’appétit 23\u00a0% plus haut, et l’appétit pour les aliments riches en calories et en glucides de 33 à 45\u00a0% plus haut. Les auteurs nomment comme limites\u00a0: seulement 12 jeunes hommes, et l’énergie dépensée n’a pas été mesurée.'],
        ['Greer, Goldstein & Walker 2013: 23 young adults were scanned (functional MRI) after a normal night and after a night without sleep, while rating how much they wanted each of 80 foods. Without sleep, activity fell in areas of the frontal and insular cortex that weigh food choices and rose in the amygdala; the desire for high-calorie foods rose, more so in those who felt the sleep loss more.','Greer, Goldstein et Walker 2013\u00a0: 23 jeunes adultes ont passé un examen du cerveau (IRM fonctionnelle) après une nuit normale et après une nuit sans sommeil, en notant à quel point ils voulaient chacun de 80 aliments. Sans sommeil, l’activité baissait dans des zones du cortex frontal et de l’insula qui pèsent les choix de nourriture, et montait dans l’amygdale; l’envie d’aliments riches en calories augmentait, plus encore chez ceux qui ressentaient plus le manque de sommeil.'],
        ['Al Khatib et al. 2017 reviewed 17 studies (496 people); 11 (172 people) had data for pooling. After partial sleep loss, people ate 385 kcal more over the next 24 hours (range 252 to 517), with no significant change in energy spent, and slightly more fat and less protein. The authors note that it is unknown whether short sleep causes weight gain over the long term. The studies were short, so picture 4 is graded likely.','Al Khatib et coll. 2017 ont revu 17 études (496 personnes); 11 (172 personnes) avaient des données à regrouper. Après un manque de sommeil partiel, les personnes mangeaient 385 kcal de plus dans les 24 heures suivantes (de 252 à 517), sans changement significatif de l’énergie dépensée, et un peu plus de gras et moins de protéines. Les auteurs notent qu’il reste inconnu si le sommeil court cause une prise de poids à long terme. Les études étaient courtes; l’image 4 est donc notée probable.'],
        ['Spiegel, Leproult & Van Cauter 1999: 11 young men spent 6 nights with 4 hours in bed, then 6 nights with 12 hours. Glucose tolerance was lower after the short nights; thyrotropin was lower, evening cortisol higher, and the sympathetic nervous system more active. The authors wrote that the young men’s response to a glucose test after the short nights was consistent with the criteria for impaired glucose tolerance.','Spiegel, Leproult et Van Cauter 1999\u00a0: 11 jeunes hommes ont passé 6 nuits avec 4 heures au lit, puis 6 nuits avec 12 heures. La tolérance au glucose était plus basse après les nuits courtes; la thyrotropine était plus basse, le cortisol du soir plus haut, et le système nerveux sympathique plus actif. Les auteurs ont écrit que la réponse des jeunes hommes à un test de glucose après les nuits courtes répondait aux critères d’une intolérance au glucose.'],
        ['Buxton et al. 2012: 21 adults spent more than 5 weeks in a lab: first optimal sleep, then 3 weeks of 5.6 hours of sleep per 24 hours on recurring 28-hour days, then 9 days of recovery sleep at the usual time. Resting metabolic rate fell (about 8%, as the authors reported) and blood sugar after a meal rose, because the pancreas released too little insulin. The lead author reported that these returned to usual after the recovery nights. The schedule was built to resemble rotating shift work.','Buxton et coll. 2012\u00a0: 21 adultes ont passé plus de 5 semaines en laboratoire\u00a0: d’abord un sommeil optimal, puis 3 semaines de 5,6 heures de sommeil par 24 heures sur des journées de 28 heures, puis 9 jours de sommeil de récupération à l’heure habituelle. La dépense d’énergie au repos baissait (d’environ 8\u00a0%, selon les auteurs) et le sucre du sang après un repas montait, parce que le pancréas libérait trop peu d’insuline. L’auteur principal a rapporté un retour à la normale après les nuits de récupération. L’horaire imitait le travail par quarts rotatifs.'],
        ['Tasali et al. 2022: a randomized trial of 80 adults aged 21 to 40 with overweight who usually slept under 6.5 hours. After 2 weeks of usual life, half got one personalized sleep counselling session. Over the next 2 weeks at home, with no instructions on diet or exercise, they slept 1.2 hours more per night than the comparison group (range 1.0 to 1.4) and ate 270 kcal a day less (range 147 to 393), measured with a method based on doubly labelled water; total energy spent did not change significantly. The authors say it was not a weight-loss study. One trial, 2 weeks: picture 7 is graded likely.','Tasali et coll. 2022\u00a0: un essai au hasard chez 80 adultes de 21 à 40 ans avec un surpoids, qui dormaient d’habitude moins de 6,5 heures. Après 2 semaines de vie habituelle, la moitié a reçu une séance personnalisée de conseils sur le sommeil. Pendant les 2 semaines suivantes à la maison, sans consignes sur l’alimentation ou l’exercice, ils dormaient 1,2 heure de plus par nuit que le groupe de comparaison (de 1,0 à 1,4) et mangeaient 270 kcal de moins par jour (de 147 à 393), mesurées avec une méthode basée sur l’eau doublement marquée; la dépense totale d’énergie ne changeait pas de façon significative. Les auteurs disent que ce n’était pas une étude de perte de poids. Un seul essai, 2 semaines\u00a0: l’image 7 est notée probable.'],
        ['Cappuccio et al. 2010 pooled prospective studies that followed people for more than 3 years. Compared with usual sleep, short sleep (5 to 6 hours or less a night) went with a relative risk of new type 2 diabetes of 1.28 (1.03 to 1.60), and long sleep (more than 8 to 9 hours) with 1.48 (1.13 to 1.96); trouble falling asleep went with 1.57 and trouble staying asleep with 1.84. The authors write that the mechanisms may differ between short and long sleepers. These studies show links, not causes.','Cappuccio et coll. 2010 ont regroupé des études qui suivaient des personnes pendant plus de 3 ans. Comparé au sommeil habituel, le sommeil court (5 à 6 heures ou moins par nuit) allait avec un risque relatif de nouveau diabète de type 2 de 1,28 (1,03 à 1,60), et le sommeil long (plus de 8 à 9 heures) avec 1,48 (1,13 à 1,96); la difficulté à s’endormir allait avec 1,57 et la difficulté à rester endormi avec 1,84. Les auteurs écrivent que les mécanismes peuvent être différents chez ceux qui dorment peu et ceux qui dorment beaucoup. Ces études montrent des liens, pas des causes.']],
  f:[
   [['Two hunger messengers','Deux messagers de la faim'],['After a short night, many people feel hungrier. Hunger has a messenger from the stomach {ghrelin}; fat tissue sends the opposite signal, in proportion to how much fat is stored {leptin}. A control centre at the base of the brain {hypothalamus} weighs both (see The brakes on eating).','Après une nuit courte, beaucoup de gens ont plus faim. La faim a un messager qui vient de l’estomac {ghréline}; le tissu gras envoie le signal contraire, selon la quantité de gras en réserve {leptine}. Un centre de contrôle à la base du cerveau {hypothalamus} pèse les deux (voir Les freins de l’appétit).'],'solid',w=>SLEEPHUNGER(w,0)],
   [['Two short nights','Deux nuits courtes'],['12 young men spent 2 nights with 4 hours in bed, and 2 nights with 10. After the short nights, the fullness messenger was 18% lower and the hunger messenger 28% higher; hunger rose 24%, and the appetite for calorie-dense, starchy and sweet foods rose 33 to 45%.','12 jeunes hommes ont passé 2 nuits avec 4 heures au lit, et 2 nuits avec 10. Après les nuits courtes, le messager de la satiété était 18\u00a0% plus bas et celui de la faim 28\u00a0% plus haut; la faim montait de 24\u00a0%, et l’appétit pour les aliments riches en calories, en féculents et en sucre, de 33 à 45\u00a0%.'],'likely',w=>SLEEPHUNGER(w,1)],
   [['A brain that wants more','Un cerveau qui en veut plus'],['After a night without sleep, 23 young adults looked at pictures of food in a brain scanner. Areas at the front of the brain that weigh choices were less active, a deep area tied to wanting {amygdala} was more active, and high-calorie foods were wanted more.','Après une nuit sans sommeil, 23 jeunes adultes ont regardé des images de nourriture pendant un examen du cerveau. Des zones à l’avant du cerveau qui pèsent les choix étaient moins actives, une zone profonde liée à l’envie {amygdale} était plus active, et les aliments riches en calories étaient plus désirés.'],'likely',w=>SLEEPHUNGER(w,2)],
   [['Eating more','Manger plus'],['Across 11 studies with 172 people, after a short night people ate about 385 more calories {kcal} the next day, and spent no more energy.','Dans 11 études avec 172 personnes, après une nuit courte, les gens mangeaient environ 385 calories {kcal} de plus le lendemain, et ne dépensaient pas plus d’énergie.'],'likely',w=>SLEEPHUNGER(w,3)],
   [['Blood sugar after a short week','Le sucre du sang après une semaine courte'],['11 young men spent 6 nights with 4 hours in bed, then 6 nights with 12. After the short nights, their bodies cleared sugar from the blood less well {glucose tolerance}; the authors wrote that the response matched what is called impaired glucose tolerance (see The door that sticks). It was better after the long nights.','11 jeunes hommes ont passé 6 nuits avec 4 heures au lit, puis 6 nuits avec 12. Après les nuits courtes, leur corps retirait moins bien le sucre du sang {tolérance au glucose}; les auteurs ont écrit que la réponse correspondait à ce qui s’appelle une intolérance au glucose (voir La porte qui colle). C’était mieux après les nuits longues.'],'likely',w=>SLEEPHUNGER(w,4)],
   [['Short sleep at the wrong time','Peu de sommeil au mauvais moment'],['21 adults lived in a lab for more than 5 weeks. For 3 weeks they slept 5.6 hours per 24 hours on 28-hour “days”, like a rotating shift. Their resting energy use fell about 8%, and blood sugar after meals rose because the pancreas released too little insulin. Both came back after 9 nights of recovery sleep.','21 adultes ont vécu plus de 5 semaines en laboratoire. Pendant 3 semaines, ils dormaient 5,6 heures par 24 heures sur des «\u00a0journées\u00a0» de 28 heures, comme un horaire de quarts rotatifs. Leur dépense d’énergie au repos baissait d’environ 8\u00a0%, et le sucre du sang après les repas montait parce que le pancréas libérait trop peu d’insuline. Les deux revenaient après 9 nuits de sommeil de récupération.'],'likely',w=>SLEEPHUNGER(w,5)],
   [['More sleep, less eaten','Plus de sommeil, moins mangé'],['80 adults with overweight who usually slept under 6.5 hours were split in two; half got one session of sleep counselling. Over 2 weeks at home, with no diet instructions, they slept about 1.2 hours more per night and ate about 270 calories a day less than the other half.','80 adultes avec un surpoids, qui dormaient d’habitude moins de 6,5 heures, ont été séparés en deux groupes; la moitié a reçu une séance de conseils sur le sommeil. Pendant 2 semaines à la maison, sans consignes sur l’alimentation, ils dormaient environ 1,2 heure de plus par nuit et mangeaient environ 270 calories de moins par jour que l’autre moitié.'],'likely',w=>SLEEPHUNGER(w,6)],
   [['Too short, too long: links','Trop court, trop long\u00a0: des liens'],['In studies that followed many thousands of people for years, short sleep (5 to 6 hours or less) went with about 28% more new type 2 diabetes, and long sleep (more than 8 to 9 hours) with about 48% more. These are links, not causes; the authors write that the reasons may differ between short and long sleepers.','Dans des études qui ont suivi des milliers de personnes pendant des années, le sommeil court (5 à 6 heures ou moins) allait avec environ 28\u00a0% plus de nouveaux diabètes de type 2, et le sommeil long (plus de 8 à 9 heures) avec environ 48\u00a0% plus. Ce sont des liens, pas des causes; les auteurs écrivent que les raisons peuvent être différentes chez ceux qui dorment peu et ceux qui dorment beaucoup.'],'likely',w=>SLEEPHUNGER(w,7)]
  ]},
{ id:'gas', sec:'gut', t:['Gas and bloating','Les gaz et les ballonnements'], d:['Where gas comes from, what is usual, the sugars that ferment, a sensitive gut, and intolerance versus allergy.','D’où viennent les gaz, ce qui est habituel, les sucres qui fermentent, un intestin sensible, et l’intolérance comparée à l’allergie.'],
  src:['niddkGas','msdGas','niddkIBS','niddkLactose','monashFodmap','acgIBS','facIntol'],
  more:[['NIDDK (reviewed June 2021): gas normally enters the digestive tract when air is swallowed and when bacteria in the large intestine break down carbohydrates that the stomach and small intestine don’t fully digest. More air is swallowed when chewing gum or sucking hard candy, drinking fizzy drinks, eating or drinking too fast, smoking, or wearing loose dentures. People typically belch up to 30 times a day; studies suggest people pass gas 8 to 14 times a day on average, and experts consider up to 25 times a day normal. MSD (2026) gives about 10 to 20 times a day, ½ to 1½ litres, with great variation between people.','NIDDK (révisé en juin 2021)\u00a0: les gaz entrent normalement dans le tube digestif quand de l’air est avalé, et quand des bactéries du gros intestin défont des glucides que l’estomac et l’intestin grêle ne digèrent pas au complet. Plus d’air est avalé en mâchant de la gomme ou en suçant des bonbons durs, en buvant des boissons gazeuses, en mangeant ou en buvant trop vite, en fumant, ou avec un dentier mal ajusté. Les gens rotent d’habitude jusqu’à 30 fois par jour; selon des études, ils évacuent des gaz de 8 à 14 fois par jour en moyenne, et les experts considèrent jusqu’à 25 fois par jour comme normal. MSD (2026) donne environ 10 à 20 fois par jour, de ½ à 1½ litre, avec de grandes différences d’une personne à l’autre.'],
        ['Foods and drinks NIDDK names: certain fruits (apples, peaches, pears) and fruit juices, vegetables (especially cruciferous ones), dairy products, whole grains, drinks with high-fructose corn syrup, and products with sweeteners ending in “-ol”. MSD adds poorly digestible fibre, such as in baked beans and cabbage. NIDDK names lactose intolerance and dietary fructose intolerance among conditions that bring more gas symptoms. MSD: flatus comes from hydrogen, methane and carbon dioxide made by bacteria; NIDDK: its odour may be due to sulfur.','Aliments et boissons nommés par NIDDK\u00a0: certains fruits (pommes, pêches, poires) et jus de fruits, des légumes (surtout les crucifères), les produits laitiers, les grains entiers, les boissons au sirop de maïs riche en fructose, et les produits avec des édulcorants qui finissent en «\u00a0-ol\u00a0». MSD ajoute les fibres peu digestibles, comme dans les fèves au lard et le chou. NIDDK nomme l’intolérance au lactose et l’intolérance au fructose parmi les états qui amènent plus de gaz. MSD\u00a0: les gaz viennent de l’hydrogène, du méthane et du gaz carbonique fabriqués par les bactéries; NIDDK\u00a0: l’odeur peut venir du soufre.'],
        ['NIDDK: bloating is a feeling of fullness or swelling in the belly; distention is when the belly actually becomes larger than usual. People may have problems with gas because they have excess gas, or because they feel more severe symptoms even when a normal amount of gas is in the digestive tract. MSD: doctors are not sure what role gas plays in the feeling of bloating, and most people who feel bloated do not actually have excess gas; people with irritable bowel syndrome are particularly sensitive to normal amounts of gas. NIDDK on IBS: some people feel pain when a normal amount of gas or stool is in the gut.','NIDDK\u00a0: le ballonnement est une sensation de plénitude ou d’enflure dans le ventre; la distension, c’est quand le ventre devient vraiment plus gros que d’habitude. Les gaz peuvent poser problème parce qu’il y en a trop, ou parce que les symptômes se font sentir plus fort même avec une quantité normale de gaz. MSD\u00a0: les médecins ne savent pas quel rôle jouent les gaz dans la sensation de ballonnement, et la plupart des personnes qui se sentent ballonnées n’ont pas vraiment trop de gaz; les personnes avec le syndrome de l’intestin irritable sont particulièrement sensibles aux quantités normales de gaz. NIDDK sur le SII\u00a0: certaines personnes ont mal avec une quantité normale de gaz ou de selles dans l’intestin.'],
        ['FODMAP stands for fermentable oligosaccharides, disaccharides, monosaccharides and polyols. Monash University’s 3-step diet: step 1, swap high-FODMAP foods for low-FODMAP ones for 2 to 6 weeks; step 2, food challenges with foods high in only one FODMAP group, to find which are tolerated; step 3, a personalised diet for the long term that is as little restrictive as possible. The American College of Gastroenterology (2021) recommends a limited trial of a low-FODMAP diet in people with irritable bowel syndrome to improve overall symptoms — a conditional recommendation, with very low quality of evidence — and says it requires a properly trained gut dietitian, or good teaching materials when one isn’t available. Picture 7 is graded likely because of that rating.','FODMAP veut dire, en anglais, oligosaccharides, disaccharides, monosaccharides et polyols fermentescibles. La diète en 3 étapes de l’Université Monash\u00a0: étape 1, remplacer les aliments riches en FODMAP par des aliments faibles en FODMAP pendant 2 à 6 semaines; étape 2, des tests avec des aliments riches en un seul groupe de FODMAP, pour trouver ceux qui sont tolérés; étape 3, une diète personnalisée à long terme, la moins restrictive possible. L’American College of Gastroenterology (2021) recommande un essai limité d’une diète faible en FODMAP chez les personnes avec le syndrome de l’intestin irritable pour améliorer l’ensemble des symptômes — une recommandation conditionnelle, avec des données de très faible qualité — et dit qu’elle demande une diététiste en santé digestive bien formée, ou du bon matériel d’enseignement quand il n’y en a pas. L’image 7 est notée probable à cause de cette évaluation.'],
