/* what slows the power plant: k = 0 on demand, 1 what it runs on, 2 less oxygen, 3 carbon monoxide, 4 fuel stuck, 5 a helper short,
   6 the thermostat, 7 fewer power plants, 8 raising the top speed, 9 tired isn't empty. The bar at the bottom is the top speed. */
function SLOW(w,k){ const co=(x,y)=>`<circle cx="${x}" cy="${y}" r="11" fill="#444441"/><text x="${x}" y="${y}" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif">CO</text>`;
  const gauge=(f,c,old)=>{ c=c||290; return `<rect x="110" y="192" width="${c-110}" height="10" rx="5" fill="${C.cell}" opacity="0.5"/><rect x="110" y="192" width="${Math.max(4,(c-110)*f)}" height="10" rx="5" fill="${C.machine}"/><line x1="${c}" y1="186" x2="${c}" y2="208" stroke="${C.ink2}" stroke-width="2"/>`+(old?`<line x1="290" y1="186" x2="290" y2="208" stroke="${C.ink2}" stroke-width="1.5" stroke-dasharray="3 3"/>`:'')+tx(102,197,w('top speed','vitesse max'),'end'); };
  const plant=()=>`<rect x="140" y="70" width="110" height="80" rx="22" fill="${C.machine}" fill-opacity="0.18" stroke="${C.machine}" stroke-width="2"/>`+tx(195,88,w('power plant','centrale'),'middle','lbi');
  const line=(full)=>battery(26,82,0,1.2)+battery(26,104,0,1.2)+battery(26,126,0,1.2)+arr(70,112,136,112)+arr(254,112,282,112)+battery(288,102,full==null?1:full,1.4)+tx(46,160,w('spent','vidées'))+tx(312,136,w('recharged','rechargées'));
  const oxyIn=(n,fade)=>`<g opacity="${fade?0.25:1}">`+oxy(152,30)+oxy(172,20)+`</g>`+arr(170,40,180,66,C.oxy)+tx(138,22,n,'end');
  const fuelIn=(lab)=>fuelDot(208,22)+fuelDot(224,32)+fuelDot(240,22)+arr(222,42,212,66,C.fuel)+tx(254,26,lab||w('fuel','carburant'),'start');
  const helpers=(faded)=>helper(165,124,'Mg')+helper(195,124,'B')+helper(225,124,'Fe',faded);
  const cellPlants=(n,ghost)=>{ let s=cellBox(20,40,340,124,30); const P=[[70,72],[150,72],[230,72],[70,122],[150,122],[230,122]]; for(let i=0;i<6;i++){ const [x,y]=P[i]; if(i<n) s+=`<rect x="${x}" y="${y}" width="56" height="30" rx="10" fill="${C.machine}" fill-opacity="0.22" stroke="${C.machine}" stroke-width="2"/>`; else if(i<ghost) s+=`<rect x="${x}" y="${y}" width="56" height="30" rx="10" fill="none" stroke="${C.grey}" stroke-width="1.5" stroke-dasharray="4 4"/>`; } return s+tx(326,62,w('Muscle cell','Cellule du muscle'),'end'); };
  switch(k){
   case 0: return plant()+line()+gauge(0.55);
   case 1: return plant()+line()+oxyIn(w('oxygen','oxygène'))+fuelIn()+helpers()+tx(195,170,w('helpers','aides'))+gauge(0.9);
   case 2: return plant()+line(0.4)+oxyIn(w('less oxygen','moins d’oxygène'),true)+fuelIn()+helpers()+gauge(0.45);
   case 3: return plant()+line(0.25)+co(152,30)+co(172,18)+arr(170,40,180,66,'#444441')+tx(138,22,w('carbon monoxide','monoxyde de carbone'),'end')+co(250,98)+fuelIn()+helpers()+gauge(0.3);
   case 4: return plant()+line(0.4)+oxyIn(w('oxygen','oxygène'))+fuelDot(208,22)+fuelDot(224,32)+fuelDot(240,22)+fuelDot(216,46)+fuelDot(232,48)+`<rect x="196" y="58" width="48" height="10" rx="3" fill="${C.machine}"/>`+tx(254,26,w('fuel stuck outside','carburant bloqué'),'start')+tx(254,64,w('insulin door','porte de l’insuline'),'start')+helpers()+gauge(0.45);
   case 5: return plant()+line(0.45)+oxyIn(w('oxygen','oxygène'))+fuelIn()+helper(150,124,'Mg')+helper(178,124,'B')+helper(206,124,'Cu')+helper(234,124,'Fe',true)+tx(195,170,w('one helper short','une aide manque'))+gauge(0.5);
   case 6: return plant()+line(0.45)+oxyIn(w('oxygen','oxygène'))+fuelIn()+helpers()+`<circle cx="330" cy="44" r="20" fill="none" stroke="${C.ink2}" stroke-width="2"/><line x1="330" y1="44" x2="316" y2="54" stroke="${C.drug}" stroke-width="3" stroke-linecap="round"/>`+tx(330,80,w('thyroid: low','thyroïde : basse'),'middle')+gauge(0.45);
   case 7: return cellPlants(2,6)+tx(190,182,w('fewer power plants','moins de centrales'),'middle','lbi')+gauge(0.45);
   case 8: return cellPlants(6,6)+arr(352,150,352,104,C.machine,2.5)+tx(190,182,w('more power plants','plus de centrales'),'middle','lbi')+gauge(0.95,330,true);
   default: return battery(40,70,1,2.6)+tx(78,132,w('batteries still full','piles encore pleines'))+cellBox(196,140,170,58)+cupAt(280,140)+ball(280,133)+ball(240,96)+arr(240,68,240,86,C.msg)+tx(281,182,w('tired signal','signal de fatigue'))+tx(254,96,w('messenger','messager'),'start');
  } }
/* the brain fed by the blood: n = sugar dots coming up, k = 0 sugar, 1 + fat beside it, 2 ketones from the liver, 3 low sugar */
function BRAIN(w,n,k){ let s=brainIn(200,62,44)+tx(270,40,w('Brain','Cerveau'),'start')+lead(266,42,240,52)
    +`<path d="M200 214 V108" stroke="${C.heart}" stroke-width="10" stroke-opacity="0.35" stroke-linecap="round"/>`+tx(214,204,w('blood','sang'),'start');
  const ys=[184,156,128].slice(0,n); for(const y of ys) s+=fuelDot(200,y); if(n) s+=arr(220,170,220,120,C.fuel)+tx(228,146,k===3?w('little sugar','peu de sucre'):w('sugar','sucre'),'start');
  if(k===1) s+=`<ellipse cx="74" cy="150" rx="40" ry="28" fill="${C.fat}"/>`+tx(74,150,w('fat','gras'),'middle','lbi')+`<path d="M116 136 Q140 118 156 104" fill="none" stroke="${C.grey}" stroke-width="1.5" stroke-dasharray="3 4"/>`+tx(74,196,w('barely used','très peu utilisé'));
  if(k===2) s+=`<ellipse cx="62" cy="186" rx="34" ry="20" fill="${C.fat}"/>`+tx(62,186,w('fat','gras'),'middle','lbi')+`<rect x="40" y="96" width="70" height="46" rx="20" fill="${C.cell}" opacity="0.6"/>`+tx(75,119,w('liver','foie'),'middle','lbi')+arr(62,164,66,146)+ketone(130,110)+ketone(152,98)+arr(114,118,170,90,C.fuel)+tx(130,76,w('ketones','cétones'),'middle');
  if(k===3) s+=`<path d="M146 24 l6 6 -6 6 6 6 M254 24 l-6 6 6 6 -6 6" fill="none" stroke="${C.grey}" stroke-width="2" stroke-linecap="round"/>`+tx(92,92,w('shaky, foggy,','tremblements, brouillard,'),'middle')+tx(92,110,w('hard to think','difficile de penser'),'middle');
  return s; }
/* the sleepy messenger and caffeine, in a brain cell: k = 0 normal, 1 caffeine in the cups, 2 piling up, 3 the crash */
function CAF(w,k){ let s=cellBox(20,140,270,58)+tx(70,182,w('Brain cell','Cellule du cerveau'))+cupAt(120,140)+cupAt(180,140)+cupAt(240,140);
  if(k===0) s+=ball(180,133)+ball(110,90)+arr(110,62,110,80,C.msg)+ball(250,104)+arr(250,76,250,94,C.msg)+arr(180,158,180,174)+tx(214,184,w('sleepy','sommeil'),'start')+tx(30,118,w('messengers','messagers'),'start')+tx(268,152,w('cups','bols'),'start');
  if(k>=1&&k<=2) s+=plug(120,138)+plug(180,138)+plug(240,138)+tx(268,152,w('caffeine','caféine'),'start')+ball(100,96)+ball(150,104)+ball(212,92)+tx(140,182,w('no sleepy message','aucun message de sommeil'),'start');
  if(k===2) s+=ball(66,80)+ball(124,70)+ball(176,82)+ball(240,72)+ball(270,100)+ball(84,116)+ball(232,112)+tx(30,40,w('still piling up','ils s’accumulent encore'),'start');
  if(k===3) s+=ball(120,133)+ball(180,133)+ball(240,133)+[[96,92],[146,78],[204,96],[262,84],[124,112],[230,112]].map(([x,y])=>ball(x,y)+arr(x,y+10,x+((x<180)?10:-10),y+24,C.msg)).join('')+arr(180,158,180,176,C.grey,3)+tx(214,184,w('the crash','la chute'),'start');
  return s; }
/* caffeine's clock: k = 0 the halving, 1 bedtime */
function CLOCK(w,k){ const X=[70,150,230,310], N=[8,4,2,1], T=[w('8 a.m.','8 h'),w('1 p.m.','13 h'),w('6 p.m.','18 h'),w('11 p.m.','23 h')], F=['100\u00a0%','½','¼','⅛'];
  let s=`<path class="axis" d="M30 172 H350"/>`+tx(190,18,w('caffeine still in the body','caféine encore dans le corps'));
  X.forEach((x,i)=>{ for(let j=0;j<N[i];j++) s+=`<rect x="${x-9}" y="${158-j*16}" width="18" height="12" rx="3" fill="${C.drug}"/>`; s+=tx(x,188,T[i])+tx(x,206,F[i],'middle','lbi'); });
  if(k===0) s+=`<path d="M86 110 Q110 92 134 118" fill="none" stroke="${C.grey}" stroke-dasharray="3 3"/>`+tx(110,86,w('5 h','5 h'));
  if(k===1){ s=`<path class="axis" d="M30 172 H350"/>`+tx(190,18,w('a coffee at 1 p.m.','un café à 13 h'));
    [[150,4],[230,2],[310,1]].forEach(([x,n],i)=>{ for(let j=0;j<n;j++) s+=`<rect x="${x-9}" y="${158-j*16}" width="18" height="12" rx="3" fill="${C.drug}"/>`; s+=tx(x,188,[w('1 p.m.','13 h'),w('6 p.m.','18 h'),w('11 p.m.','23 h')][i])+tx(x,206,['100\u00a0%','½','¼'][i],'middle','lbi'); });
    s+=moon(310,112,16)+tx(310,84,w('bedtime','coucher')); }
  return s; }
/* norepinephrine and the heart: k = 0 … 7 */
function NE(w,k){ const top=()=>cellBox(20,16,270,58)+tx(80,45,w('Nerve end','Bout du nerf'));
  const bot=()=>cellBox(20,140,270,58)+tx(150,182,w('Heart','Cœur'));
  const vac=()=>`<polygon points="222,74 268,74 258,58 232,58" fill="${C.machine}"/>`;
  const cups=()=>cupAt(90,140)+cupAt(150,140)+cupAt(210,140);
  const dn=(x,y)=>arr(x,y-28,x,y-12,C.msg), up=x=>arr(x,128,x,104,C.machine);
  const hs=(n,c,lab)=>{ let p=heartP(330,165,16,c||C.heart); for(let i=0;i<n;i++){ const x=352+6*i; p+=`<path d="M${x} 157 Q${x+5} 165 ${x} 173" fill="none" stroke="${C.heart}" stroke-width="1.5"/>`; } return p+tx(335,200,lab||w('heartbeat','battements')); };

  app.innerHTML=(STORE==='ok'?'':`<div class="card" style="border-color:var(--warn)"><p class="small" style="margin:0">${L('<b>Not saved.</b> This browser is blocking storage (private mode?). The cards still work.','<b>Pas enregistré.</b> Ce navigateur bloque la mémoire (mode privé?). Les cartes fonctionnent quand même.')}</p></div>`)
    +(door?vDoor():V.v==='card'?vCard():V.v==='sec'?vSec():vHome());
  renderBar(door?null:V); { const pill=document.getElementById('installPill'); if(pill) pill.innerHTML=pillHTML(); } window.scrollTo(0,0); }

/* ---------- the door ---------- */
const AGREE=()=>[L('I am 18 or older.','J’ai 18 ans ou plus.'),
  L('This is education about how bodies work. It isn’t medical, dietitian or pharmacist advice.','C’est de l’éducation sur le fonctionnement du corps. Ce n’est pas un avis médical, de diététiste ou de pharmacien.'),
  L('It describes bodies in general, not mine. If something worries me, I get care.','Elle décrit les corps en général, pas le mien. Si quelque chose m’inquiète, je vais chercher des soins.'),
  L('I won’t change a medicine, a dose or a diet that a doctor or dietitian gave me because of something I read here.','Je ne changerai pas un médicament, une dose ou un régime donné par un médecin ou une diététiste à cause de quelque chose que j’ai lu ici.'),
  L('I don’t have an eating disorder and I’m not recovering from one.','Je n’ai pas de trouble alimentaire et je ne suis pas en rétablissement d’un trouble alimentaire.')];
function instBig(){ if(FRAMED||STANDALONE) return ''; try{ if(localStorage.getItem(KEY+'.noinst')) return ''; }catch(e){ return ''; }
  return `<div class="instbig inst" style="margin:14px 0"><button type="button" data-act="install">↓ ${L('Install the Library','Installer la Bibliothèque')}</button><p style="margin:6px 0 0;text-align:center;font-size:.85rem;opacity:.72">${L('Home-screen icon · full screen · works offline','Icône d’accueil · plein écran · fonctionne hors ligne')}</p><p style="margin:0;text-align:center"><button type="button" class="lnk" data-act="instno">${L('Not now','Pas maintenant')}</button></p></div>`; }
function vDoor(){ return `<p class="tagline">${L('How the body works, one picture at a time.','Comment le corps fonctionne, une image à la fois.')}</p>
  <p>${L('Each card follows one idea in pictures and plain words, with the specialist’s term beside it. Every picture says how sure the science is, and every card where it comes from.','Chaque carte suit une idée en images et en mots simples, avec le terme du spécialiste à côté. Chaque image dit à quel point la science est sûre, et chaque carte d’où elle vient.')}</p>
  <p class="small muted">${L('The cards describe how bodies work in general. They don’t say what is happening in yours. The other V3KTOR apps measure that: <a href="https://v3ktor.org/">v3ktor.org</a>.','Les cartes décrivent comment les corps fonctionnent en général. Elles ne disent pas ce qui se passe dans le tien. Les autres apps V3KTOR mesurent ça\u00a0: <a href="https://v3ktor.org/">v3ktor.org</a>.')}</p>
  <div class="card gate"><p class="small" style="margin:0 0 6px"><b>${L('Tapping “Enter” means I agree:','Appuyer sur «\u00a0Entrer\u00a0» signifie que j’accepte\u00a0:')}</b></p><ol class="small" style="margin:0;padding-left:1.3em">${AGREE().map(l=>`<li>${l}</li>`).join('')}</ol>
  <button type="button" class="btn primary" style="width:100%;margin-top:12px" data-act="enter">${L('Enter','Entrer')}</button></div>
  ${instBig()}<p class="small muted" style="margin-top:16px">${L('Everything stays on this phone. No account, no tracking.','Tout reste sur ce téléphone. Pas de compte, pas de suivi.')} v${VER} · <button type="button" class="lnk" data-act="about">${L('About and privacy','À propos et confidentialité')}</button></p>`; }

/* ---------- home: a meal's path through the body, six stops ---------- */
const STOPS=[[70,46],[300,78],[80,126],[300,164],[80,206],[300,246]];
function homePic(){ const d='M70 46 C190 40 290 50 300 78 S80 100 80 126 S300 140 300 164 S80 180 80 206 S300 220 300 246';
  let s=`<path class="road" d="${d}"/>`;
  SECTIONS.forEach((sec,i)=>{ const [x,y]=STOPS[i], open=CARDS.some(c=>c.sec===sec.id), right=x<190;
    s+=`<g class="stop" role="button" tabindex="0" data-act="sec" data-v="${sec.id}" aria-label="${esc(sec.n+'. '+P(sec.t))}"><circle cx="${x}" cy="${y}" r="17" style="fill:${open?'var(--accent)':'var(--card)'};stroke:${open?'var(--accent)':'var(--muted)'}" stroke-width="2"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-weight="800" font-size="15" style="fill:${open?'#fff':'var(--muted)'}" font-family="system-ui,sans-serif">${sec.n}</text>${tx(right?x+26:x-26,y,P(sec.t),right?'start':'end',open?'lbi':'lb')}</g>`; });
  return `<svg class="pic" viewBox="0 0 380 266" role="img" aria-label="${esc(L('A meal’s path through the body, six stops','Le chemin d’un repas dans le corps, six arrêts'))}">${s}</svg>`; }
function vHome(){ const done=CARDS.filter(c=>S.seen[c.id]).length;
  return `<p class="tagline">${L('Follow a meal through the body: six stops.','Suis un repas dans le corps\u00a0: six arrêts.')}</p>
  ${homePic()}
  <div style="margin-top:10px">${SECTIONS.map(sec=>{ const n=CARDS.filter(c=>c.sec===sec.id).length;
    return `<button type="button" class="cardrow${n?'':' soon'}" data-act="sec" data-v="${sec.id}"><b>${sec.n}. ${esc(P(sec.t))}</b><span class="n">${n?(n===1?L('1 card','1 carte'):L(`${n} cards`,`${n} cartes`)):L('soon','bientôt')}</span><small>${esc(P(sec.d))}</small></button>`; }).join('')}</div>
  <p class="mine">${done?L(`${done} of ${CARDS.length} cards read to the end.`,`${done} carte${done>1?'s':''} sur ${CARDS.length} lue${done>1?'s':''} jusqu’au bout.`):L('One picture at a time. Tap Next when it’s clear.','Une image à la fois. Appuie sur Suivant quand c’est clair.')}</p>`; }

/* ---------- a section: its cards ---------- */
function vSec(){ const sec=secById(V.id), list=CARDS.filter(c=>c.sec===sec.id);
  return `<div class="eyebrow">${L('Stop','Arrêt')} ${sec.n}</div><h2>${esc(P(sec.t))}</h2><p class="muted">${esc(P(sec.d))}</p>
  ${list.length?list.map(c=>`<button type="button" class="cardrow" data-act="card" data-v="${c.id}"><b>${esc(P(c.t))}</b><span class="n">${S.seen[c.id]?'✓ ':''}${L(`${c.f.length} pictures`,`${c.f.length} images`)}</span><small>${esc(P(c.d))}</small></button>`).join('')
    :`<div class="card soft"><p class="small" style="margin:0">${L('Being written. Energy comes first, because the energy app will link to it.','En cours d’écriture. L’énergie vient en premier, parce que l’app sur l’énergie va y renvoyer.')}</p></div>`}
  <p style="margin-top:14px"><button type="button" class="lnk" data-act="home">← ${L('All six stops','Les six arrêts')}</button></p>`; }

/* ---------- a card: one picture at a time ---------- */
function vCard(){ const c=cardById(V.id), sec=secById(c.sec), n=c.f.length, i=Math.min(V.i,n-1), [ft,fc,g,draw]=c.f[i];
  return `<div class="eyebrow"><button type="button" class="lnk" style="font-size:inherit;text-transform:inherit;letter-spacing:inherit;color:var(--muted);min-height:0;padding:0" data-act="sec" data-v="${sec.id}">${esc(P(sec.t))}</button></div>
  <h2>${esc(P(c.t))}</h2>
  <div class="ftitle"><h3 id="ftitle">${esc(P(ft))}</h3><span class="small muted">${i+1}\u00a0/\u00a0${n}</span></div>
  <div id="pic">${svg(draw((en,fr)=>S.lang==='fr'?fr:en),P(ft)+'. '+plain(P(fc)))}</div>
  <p class="cap" aria-live="polite">${rich(P(fc))}</p>
  <p class="grade">${L('How sure:','Degré de certitude\u00a0:')} ${P(GRADE[g])}</p>
  <div class="dots" aria-hidden="true">${c.f.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join('')}</div>
  <p style="text-align:center;margin:8px 0 0"><button type="button" class="lnk" data-act="more">${L('The precise version and the sources','La version précise et les sources')}</button></p>
  ${c.drug?`<p class="mine">${P(RX)}</p>`:''}`; }
function renderBar(v){ if(!v||v.v!=='card'){ bar.innerHTML=''; bar.classList.add('hidden'); return; }
  const c=cardById(v.id), n=c.f.length, last=v.i>=n-1; bar.classList.remove('hidden');
  bar.innerHTML=`<div class="in"><button type="button" class="btn ghost sm${v.i?'':' hide'}" data-act="prev" ${v.i?'':'tabindex="-1" aria-hidden="true"'}>← ${L('Back','Retour')}</button><span class="small muted">${L('Picture','Image')} ${v.i+1}\u00a0/\u00a0${n}</span><button type="button" class="btn primary sm" data-act="next">${last?L('Done','Terminé')+' ✓':L('Next','Suivant')+' →'}</button></div>`; }
function step(d){ if(V.v!=='card') return; const c=cardById(V.id), n=c.f.length;
  if(d>0&&V.i>=n-1){ S.seen[c.id]=true; go({v:'sec',id:c.sec}); toast(L('Read to the end','Lue jusqu’au bout')); return; }
  V.i=Math.max(0,Math.min(n-1,V.i+d)); render(); }

/* ---------- sheets ---------- */
const sheet=document.getElementById('sheet'), sheetBg=document.getElementById('sheetBg'); let sheetOpener=null;
function showSheet(html){ if(!sheet.classList.contains('on')) sheetOpener=document.activeElement;
  sheet.innerHTML='<div class="handle"></div>'+html+`<div class="row" style="margin-top:12px"><button type="button" class="btn ghost sm" data-act="close">${L('Close','Fermer')}</button></div>`;
  sheet.classList.add('on'); sheetBg.classList.add('on'); sheet.setAttribute('aria-hidden','false'); document.documentElement.classList.add('locked'); sheet.scrollTop=0; try{ sheet.focus({preventScroll:true}); }catch(e){} }
function closeSheet(){ if(!sheet.classList.contains('on')) return; sheet.classList.remove('on'); sheetBg.classList.remove('on'); sheet.setAttribute('aria-hidden','true'); document.documentElement.classList.remove('locked'); const o=sheetOpener; sheetOpener=null; if(o&&document.body.contains(o)){ try{ o.focus({preventScroll:true}); }catch(e){} } }
const A=(href,txt)=>`<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;
function moreSheet(){ const c=cardById(V.id);
  showSheet(`<h3 id="sheetTitle">${esc(P(c.t))}\u00a0: ${L('the precise version','la version précise')}</h3>${c.more.map(p=>`<p class="small">${rich(P(p))}</p>`).join('')}
  <p class="small"><b>${L('How sure, picture by picture','Degré de certitude, image par image')}</b></p><ul class="small">${c.f.map((f,k)=>`<li>${k+1}. ${esc(P(f[0]))}\u00a0: ${P(GRADE[f[2]])}</li>`).join('')}</ul>
  <p class="small"><b>${L('Sources','Sources')}</b></p><ol class="srcs">${c.src.map(k=>`<li>${A(SRC[k].u,esc(P(SRC[k].l)))}</li>`).join('')}</ol>
  ${c.drug?`<p class="small"><b>${P(RX)}</b></p>`:''}<p class="mine">${L('Bodies in general, not yours. Not advice.','Les corps en général, pas le tien. Pas un conseil.')}</p>`); }
function menuSheet(){ const b=(act,l,cls)=>`<button type="button" data-act="${act}"${cls?` class="${cls}"`:''}>${l}</button>`;
  showSheet(`<h3 id="sheetTitle">Menu</h3><div class="menu">${b('home',L('The six stops','Les six arrêts'))}${b('help',L('How to read a card','Comment lire une carte'))}${b('colours',L('What the colours mean','Ce que veulent dire les couleurs'))}${b('install',L('Install on this phone','Installer sur ce téléphone'),'inst')}${b('about',L('About and privacy','À propos et confidentialité'))}</div><p class="small muted" style="margin:12px 0 0">v${VER}</p>`); }
function helpSheet(){ const H2=(a,b)=>`<p class="small"><b>${a}</b> ${b}</p>`;
  showSheet(`<h3 id="sheetTitle">${L('How to read a card','Comment lire une carte')}</h3>`
  +H2(L('One idea per picture.','Une idée par image.'),L('Each picture changes one thing from the one before. Tap Next when it’s clear, Back to see it again. A swipe works too.','Chaque image change une seule chose par rapport à la précédente. Appuie sur Suivant quand c’est clair, sur Retour pour la revoir. Glisser le doigt marche aussi.'))
  +H2(L('Plain words first.','Les mots simples d’abord.'),L('The specialist’s term follows in grey brackets, the first time a word comes up, so it’s familiar if a specialist ever uses it.','Le terme du spécialiste suit entre parenthèses grises, la première fois qu’un mot apparaît, pour le reconnaître si un spécialiste l’utilise un jour.'))
  +H2(L('How sure.','Degré de certitude.'),P(GRADEL.solid)+' '+P(GRADEL.likely))
  +H2(L('The precise version.','La version précise.'),L('Under each card: what the pictures simplify, and every source, to open and check.','Sous chaque carte\u00a0: ce que les images simplifient, et chaque source, à ouvrir et à vérifier.'))
  +H2(L('Bodies in general.','Les corps en général.'),L('The cards describe how bodies work. They don’t say what is happening in yours.','Les cartes décrivent comment les corps fonctionnent. Elles ne disent pas ce qui se passe dans le tien.'))); }
function coloursSheet(){ showSheet(`<h3 id="sheetTitle">${L('What the colours mean','Ce que veulent dire les couleurs')}</h3><p class="small">${L('The same colour means the same thing on every card.','La même couleur veut dire la même chose sur chaque carte.')}</p><ul class="cols">${COLOURS.map(([k,p])=>`<li><span class="sw" style="background:${C[k]}"></span>${rich(P(p))}</li>`).join('')}</ul>`); }
function aboutSheet(){ showSheet(`<h3 id="sheetTitle">${L('About and privacy','À propos et confidentialité')}</h3>
  <p class="small">${L('<b>Made by Tobie and Claude.</b> Free version at ','<b>Créé par Tobie et Claude.</b> Version gratuite à ')}${A('https://v3ktor.org/library/app/','v3ktor.org/library/app')}. © 2026 Tobie David.</p>
  <p class="small">${L('Part of the V3KTOR Project. It teaches how bodies work in general, in pictures. It isn’t medical, dietitian or pharmacist advice, and no clinician has reviewed it. Every card lists its sources and says how sure each picture is.','Fait partie du V3KTOR Project. Elle explique en images comment les corps fonctionnent en général. Ce n’est pas un avis médical, diététique ou de pharmacien, et aucun clinicien ne l’a examinée. Chaque carte donne ses sources et dit à quel point chaque image est sûre.')}</p>
  <p class="small">${L('Provided as-is, without warranty of any kind. The app keeps three things in this browser’s storage on this phone: your language, that you agreed, and which cards you read to the end. Nothing is sent anywhere.','Fourni tel quel, sans garantie d’aucune sorte. L’app garde trois choses dans le stockage de ce navigateur sur ce téléphone\u00a0: ta langue, ton accord, et les cartes lues jusqu’au bout. Rien n’est envoyé nulle part.')}</p>
  <p class="small">${L('Free software under the ','Logiciel libre sous la ')}${A('https://github.com/tobiedavid/v3ktor.org/blob/main/LICENSE',L('GNU Affero General Public License','licence publique générale GNU Affero'))}${L(', version 3 or later. Source code: ',', version 3 ou ultérieure. Code source\u00a0: ')}${A('https://github.com/tobiedavid/v3ktor.org','github.com/tobiedavid/v3ktor.org')}</p>
  <p class="small">${L('Look copied from the Threshold Log and the Food Trial Log.','Apparence tirée du Threshold Log et du Food Trial Log.')}</p><p class="small muted">v${VER}</p>`); }

/* ---------- install: the same pill, button and steps as the other apps ---------- */
const SHARE='<svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M7 11H5v10h14V11h-2"/></svg>';
const pillHTML=()=>`<span>${L('Install the Library on this phone','Installer la Bibliothèque sur ce téléphone')}</span><button type="button" class="ipy" data-act="install">${L('Install','Installer')}</button><button type="button" class="ipn" data-act="instno" aria-label="${L('No thanks','Non merci')}">✕</button>`;
function installPill(){ if(FRAMED||STANDALONE||document.getElementById('installPill')) return; try{ if(localStorage.getItem(KEY+'.noinst')) return; }catch(e){ return; }
  const b=document.createElement('div'); b.id='installPill'; b.innerHTML=pillHTML(); document.body.appendChild(b); }
function installSheet(){ const icon=`<li>${L('From now on, open the app from its icon.','À partir de maintenant, ouvre l’app par son icône.')}</li>`;
  const iph=`<ol class="inst">${SAFARI?'':`<li>${L('Open this page in <b>Safari</b>.','Ouvre cette page dans <b>Safari</b>.')}</li>`}<li>${L('Tap <b>⋯</b> beside the address bar, then <b>Share</b>. No <b>⋯</b>? Tap the Share button','Appuie sur <b>⋯</b> à côté de la barre d’adresse, puis sur <b>Partager</b>. Pas de <b>⋯</b>? Appuie sur le bouton Partager')} ${SHARE}.</li><li>${L('Scroll down the list and tap <b>Add to Home Screen</b>.','Descends dans la liste et choisis <b>Sur l’écran d’accueil</b>.')}</li><li>${L('Tap <b>Add</b>.','Appuie sur <b>Ajouter</b>.')}</li>${icon}</ol>`;
  const and=`<ol class="inst">${CHROME?'':`<li>${L('Open this page in <b>Chrome</b>.','Ouvre cette page dans <b>Chrome</b>.')}</li>`}<li>${L('Tap the <b>⋮</b> menu at the top right.','Appuie sur le menu <b>⋮</b> en haut à droite.')}</li><li>${L('Tap <b>Add to Home screen</b>. On some phones it says <b>Install app</b>.','Appuie sur <b>Ajouter à l’écran d’accueil</b>. Sur certains téléphones, c’est écrit <b>Installer l’application</b>.')}</li><li>${L('Tap <b>Install</b>.','Appuie sur <b>Installer</b>.')}</li>${icon}</ol>`;
  showSheet(`<h3 id="sheetTitle">${L('Install on this phone','Installer sur ce téléphone')}</h3><p class="small">${L('The app gets its own icon on your phone and opens without a connection. There is no store and no account.','L’app a sa propre icône sur ton téléphone et s’ouvre sans connexion. Pas de boutique d’applications, pas de compte.')}</p>${IOS?iph:ANDROID?and:`<p><b>iPhone</b></p>${iph}<p><b>Android</b></p>${and}`}`); }

/* ---------- actions: one delegated handler ---------- */
const ACT={
  close:()=>closeSheet(), menu:()=>menuSheet(), about:()=>aboutSheet(), help:()=>helpSheet(), colours:()=>coloursSheet(), more:()=>moreSheet(),
  home:()=>{ closeSheet(); go({v:'home'}); },
  lang:b=>{ S.lang=b.dataset.v; const was=sheet.classList.contains('on'); closeSheet(); render(); if(was) toast(L('Language changed','Langue changée')); },
  enter:()=>{ S.ack=true; S.ackAt=new Date().toISOString(); S.cv=CONSENT; render(); },
  sec:b=>{ closeSheet(); go({v:'sec',id:b.dataset.v}); },
  card:b=>{ closeSheet(); go({v:'card',id:b.dataset.v,i:0}); },
  next:()=>step(1), prev:()=>step(-1),
  install:()=>{ closeSheet(); const p=window.INSTALL; if(p){ p.prompt(); p.userChoice.then(()=>{ window.INSTALL=null; }).catch(()=>{}); } else installSheet(); },
  instno:()=>{ try{ localStorage.setItem(KEY+'.noinst','1'); }catch(e){} const pill=document.getElementById('installPill'); if(pill) pill.remove(); render(); }
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const f=ACT[b.dataset.act]; if(!f) return; e.preventDefault(); f(b,e); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); return; }
  const st=e.target.closest&&e.target.closest('.stop'); if(st&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); ACT.sec(st); return; }
  if(sheet.classList.contains('on')||!S.ack||V.v!=='card') return; if(e.target.closest('input,textarea,select')) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); step(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); step(-1); } });
sheetBg.addEventListener('click',closeSheet);
/* a swipe on the picture moves one picture */
let sx=null, sy=null;
app.addEventListener('touchstart',e=>{ if(!e.target.closest('.pic')) return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
app.addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5) step(dx<0?1:-1); });
/* the browser's Back button follows the screens: a card's address is #its-name, so the other apps can link straight to one */
window.addEventListener('popstate',()=>{ closeSheet(); V=fromHash(); render(); });
V=fromHash(); render(); installPill();
</script>
<script>
/* installed-app layer */
(function(){
  try{ if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){ navigator.serviceWorker.register('sw.js').catch(function(){}); } }catch(e){ /* a sandboxed preview has no service worker */ }
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); window.INSTALL=e; installPill(); });
  window.addEventListener('appinstalled',function(){ window.INSTALL=null; document.documentElement.classList.add('noinst'); });
})();
</script>
</body>
