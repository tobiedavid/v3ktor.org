   [['What helps, what holds back','Ce qui aide, ce qui retient'],['In the same meal, vitamin C and meat help plant iron get in. Tea, coffee, calcium, and whole grains and beans {phytate} hold it back. In one study, a cup of coffee with a burger meal cut the iron absorbed by 39\u00a0%, and a cup of tea by 64\u00a0%.','Dans le même repas, la vitamine C et la viande aident le fer des plantes à entrer. Le thé, le café, le calcium, et les grains entiers et les légumineuses {phytate} le retiennent. Dans une étude, une tasse de café avec un repas de hamburger a réduit de 39\u00a0% le fer absorbé, et une tasse de thé, de 64\u00a0%.'],'solid',w=>IRON(w,4)],
   [['Timing','Le moment'],['In that study, coffee one hour before the meal didn’t lower the iron absorbed. One hour after, it lowered it as much as coffee with the meal, likely because the meal is still in the stomach.','Dans cette étude, le café pris une heure avant le repas n’a pas réduit le fer absorbé. Une heure après, il l’a réduit autant que le café pris pendant le repas, sans doute parce que le repas est encore dans l’estomac.'],'likely',w=>IRON(w,5)],
   [['The gate adjusts','La porte s’ajuste'],['The gut lets more iron in when the store is low, and less when it is full. A messenger from the liver runs this gate {hepcidin}.','L’intestin laisse entrer plus de fer quand la réserve est basse, et moins quand elle est pleine. Un messager du foie règle cette porte {hepcidine}.'],'solid',w=>IRON(w,6)],
   [['Where it gets lost','Où il se perd'],['Iron leaves with blood: periods, pregnancy (the baby and the extra blood), blood donation, bleeding in the gut. That’s why the amount set per day is 8\u00a0mg for men, 18\u00a0mg for women aged 19 to 50, and 27\u00a0mg in pregnancy.','Le fer part avec le sang\u00a0: les règles, la grossesse (le bébé et le sang en plus), le don de sang, un saignement dans l’intestin. C’est pourquoi l’apport recommandé par jour est de 8\u00a0mg pour les hommes, 18\u00a0mg pour les femmes de 19 à 50 ans et 27\u00a0mg pendant la grossesse.'],'solid',w=>IRON(w,7)],
   [['The store empties first','La réserve se vide en premier'],['When more iron leaves than comes in, the store empties first {low ferritin}. Next, new red blood cells get less iron. Only at the end does hemoglobin drop {anemia}. So iron can run low while hemoglobin is still normal.','Quand plus de fer sort qu’il n’en entre, la réserve se vide en premier {ferritine basse}. Ensuite, les nouveaux globules rouges reçoivent moins de fer. C’est seulement à la fin que l’hémoglobine baisse {anémie}. Le fer peut donc être bas pendant que l’hémoglobine est encore normale.'],'solid',w=>IRON(w,8)],
   [['What a blood test reads','Ce que lit une prise de sang'],['Ferritin reads the store; hemoglobin reads the blood. The WHO counts a ferritin under 15 as low in adults; for women, newer studies put the line nearer 25. Inflammation pushes ferritin up, so a ferritin that looks normal can hide a low store.','La ferritine lit la réserve; l’hémoglobine lit le sang. L’OMS compte une ferritine sous 15 comme basse chez l’adulte; chez les femmes, des études plus récentes placent la limite plus près de 25. L’inflammation fait monter la ferritine, alors une ferritine qui a l’air normale peut cacher une réserve basse.'],'solid',w=>IRON(w,9)],
   [['Too much iron','Trop de fer'],['The body has no way to get rid of extra iron, so it can build up. Some people absorb too much because of a gene they’re born with {hereditary hemochromatosis}. And swallowing iron pills by accident is a leading cause of fatal poisoning in children under 6.','Le corps n’a aucun moyen de se débarrasser du fer en trop, alors il peut s’accumuler. Certaines personnes en absorbent trop à cause d’un gène avec lequel elles sont nées {hémochromatose héréditaire}. Et avaler des comprimés de fer par accident est une cause majeure d’empoisonnement mortel chez les enfants de moins de 6 ans.'],'solid',w=>IRON(w,10)]
  ]},
{ id:'transit', sec:'gut', t:['How long food takes','Le temps que prend la nourriture'], d:['The trip from the mouth to the end, and what speeds it up or slows it down.','Le trajet de la bouche jusqu’au bout, et ce qui l’accélère ou le ralentit.'],
  src:['niddkDigest','lee14','wang15','clevelandGE','statpearlsCCK','konturek94','niddkLactose','asnicar21','statpearlsGC','brown90','lewis97','degen96','mullerlissner88','devries15','niddkConst','niddkDiarrhea'],
  more:[['The times on the first picture come from a swallowed capsule that reports where it is {wireless motility capsule}: normal ranges of 2 to 5 hours for the stomach, 2 to 6 for the small intestine, 10 to 59 for the large intestine and 10 to 73 for the whole trip. How the test is done moves the numbers: in 215 volunteers, taking the capsule right after the meal instead of right before changed the stomach time by about 52 minutes.','Les temps de la première image viennent d’une capsule avalée qui signale où elle se trouve {capsule de motilité sans fil}\u00a0: des plages normales de 2 à 5 heures pour l’estomac, 2 à 6 pour l’intestin grêle, 10 à 59 pour le gros intestin et 10 à 73 pour le trajet complet. La façon de faire le test change les chiffres\u00a0: chez 215 volontaires, avaler la capsule juste après le repas plutôt que juste avant changeait le temps de l’estomac d’environ 52 minutes.'],
        ['In the stomach test, a standard meal of egg whites and toast carries a tracer, and a scanner follows it. Normal results: at least 40\u00a0% of the meal gone at 2 hours, at least 90\u00a0% at 4 hours. In 10 people, adding oil to a liquid meal made it take about 50\u00a0% longer to empty, and blocking cholecystokinin reduced that slowing.','Dans le test de l’estomac, un repas standard de blancs d’œufs et de pain grillé porte un traceur, et un appareil le suit. Résultats normaux\u00a0: au moins 40\u00a0% du repas sorti à 2 heures, au moins 90\u00a0% à 4 heures. Chez 10 personnes, ajouter de l’huile à un repas liquide le faisait sortir environ 50\u00a0% plus lentement, et bloquer la cholécystokinine diminuait ce ralentissement.'],
        ['NIDDK: the small intestine absorbs most of the nutrients in food, and its wall takes water and nutrients into the blood; the large intestine absorbs water and changes the waste from liquid into stool, and its bacteria help break down what is left and make vitamin K. With lactose intolerance, symptoms can start within a few hours of milk or milk products.','NIDDK\u00a0: l’intestin grêle absorbe la plupart des nutriments de la nourriture, et sa paroi fait passer l’eau et les nutriments dans le sang; le gros intestin absorbe l’eau et change les déchets liquides en selles, et ses bactéries aident à défaire ce qui reste et fabriquent de la vitamine K. Avec l’intolérance au lactose, les symptômes peuvent commencer quelques heures après le lait ou les produits laitiers.'],
        ['In the blue-muffin study (863 adults), under 14 hours counted as fast, 14 to 58 as normal, and 59 or more as slow; the trip time matched the makeup of the gut bacteria better than stool form or how often a person went. In 66 volunteers, stool form followed the whole trip better than how often a person went or how much stool came out. In 32 volunteers, the large intestine moved faster in men than in women, and one person’s two tests sometimes differed a lot.','Dans l’étude des muffins bleus (863 adultes), moins de 14 heures comptait comme rapide, 14 à 58 comme normal, et 59 ou plus comme lent; le temps du trajet allait mieux avec la composition des bactéries de l’intestin que la forme des selles ou leur fréquence. Chez 66 volontaires, la forme des selles suivait le trajet complet mieux que la fréquence ou la quantité de selles. Chez 32 volontaires, le gros intestin avançait plus vite chez les hommes que chez les femmes, et les deux tests d’une même personne différaient parfois beaucoup.'],
        ['The large intestine’s response to a meal shows up as electrical activity within minutes of eating; people with irritable bowel can have a stronger response. In the coffee study, 14 people had the end of the colon measured with a pressure probe; 8 of them had said coffee gave them the urge, and in those 8 the response lasted at least 30 minutes.','La réponse du gros intestin à un repas se voit comme une activité électrique quelques minutes après avoir mangé; les personnes qui ont le côlon irritable peuvent avoir une réponse plus forte. Dans l’étude sur le café, 14 personnes ont eu le bout du côlon mesuré avec une sonde de pression; 8 d’entre elles avaient dit que le café leur donnait l’envie, et chez ces 8, la réponse durait au moins 30 minutes.'],
        ['In a meta-analysis of 20 papers, bran made stools heavier and the trip shorter in every study, but people with long-standing constipation responded less. The 45-minute figure comes from a review of 65 studies of intact wheat fibre, paid for by a cereal company.','Dans une méta-analyse de 20 articles, le son rendait les selles plus lourdes et le trajet plus court dans chaque étude, mais les personnes constipées depuis longtemps répondaient moins. Le chiffre de 45 minutes vient d’une revue de 65 études sur les fibres de blé intactes, payée par une compagnie de céréales.'],
        ['NIDDK also lists, with constipation, being unable to pass gas and lower back pain; with diarrhea, a change in mental state, frequent vomiting, severe belly or rectal pain, and black, tarry or bloody stools.','Le NIDDK nomme aussi, avec la constipation, ne plus pouvoir passer de gaz et une douleur au bas du dos; avec la diarrhée, un changement de l’état mental, des vomissements fréquents, une forte douleur au ventre ou au rectum, et des selles noires, goudronneuses ou sanglantes.']],
  f:[
   [['Three stations','Trois stations'],['A meal crosses three stations. The stomach holds it for about 2 to 5 hours, the small intestine for 2 to 6, and the large intestine for 10 to 59. In people with no gut trouble, the whole trip takes from about 10 to 73 hours {whole-gut transit time}.','Un repas traverse trois stations. L’estomac le garde environ 2 à 5 heures, l’intestin grêle 2 à 6, et le gros intestin 10 à 59. Chez les personnes sans problème digestif, le trajet complet prend d’environ 10 à 73 heures {temps de transit total}.'],'solid',w=>TRANSIT(w,0)],
   [['The stomach lets it out slowly','L’estomac le laisse sortir lentement'],['The stomach mixes food with its juices and lets the paste out a little at a time. In the standard test meal, at least 40\u00a0% has left after 2 hours, and at least 90\u00a0% after 4. Fat holds the meal back: the small intestine sends a messenger that slows the stomach {cholecystokinin}.','L’estomac mélange la nourriture avec ses sucs et laisse sortir la pâte un peu à la fois. Avec le repas du test standard, au moins 40\u00a0% est sorti après 2 heures, et au moins 90\u00a0% après 4. Le gras retient le repas\u00a0: l’intestin grêle envoie un messager qui ralentit l’estomac {cholécystokinine}.'],'solid',w=>TRANSIT(w,1)],
   [['The small intestine: hours','L’intestin grêle\u00a0: des heures'],['In the small intestine, waves of muscle push the paste along {peristalsis}, and the wall takes most of the food into the blood. The front of a meal can reach the large intestine within a few hours.','Dans l’intestin grêle, des vagues de muscle poussent la pâte {péristaltisme}, et la paroi fait passer la plus grande partie de la nourriture dans le sang. Le début d’un repas peut arriver au gros intestin en quelques heures.'],'solid',w=>TRANSIT(w,2)],
   [['What it leaves behind','Ce qu’il laisse passer'],['Whatever the small intestine doesn’t take in goes on to the large intestine, where bacteria ferment it. In a person short of the enzyme that splits milk sugar {lactase}, that sugar gets through, and gas, bloating, cramps or loose stool can start within a few hours.','Ce que l’intestin grêle n’absorbe pas continue vers le gros intestin, où des bactéries le font fermenter. Chez une personne qui manque de l’enzyme qui coupe le sucre du lait {lactase}, ce sucre passe, et des gaz, des ballonnements, des crampes ou des selles molles peuvent commencer en quelques heures.'],'solid',w=>TRANSIT(w,3)],
   [['The long wait','La longue attente'],['The large intestine is the slow station: most of the trip is spent there. It takes water back out of what is left, turning it from liquid into stool, and its bacteria feed on the leftovers.','Le gros intestin est la station lente\u00a0: la plus grande partie du trajet se passe là. Il reprend l’eau de ce qui reste, ce qui change le liquide en selles, et ses bactéries se nourrissent des restes.'],'solid',w=>TRANSIT(w,4)],
   [['Today’s stool, older meals','Les selles d’aujourd’hui, des repas d’avant'],['In 863 adults who ate blue-dyed muffins, the middle time until blue showed up in the stool was about 29 hours. So a stool passed after lunch mostly holds food from earlier meals, often from the day before.','Chez 863 adultes qui ont mangé des muffins teints en bleu, le temps du milieu avant que le bleu apparaisse dans les selles était d’environ 29 heures. Alors les selles qui sortent après le dîner contiennent surtout de la nourriture de repas d’avant, souvent de la veille.'],'solid',w=>TRANSIT(w,5)],
   [['Eating wakes the large intestine','Manger réveille le gros intestin'],['When food stretches the stomach, the large intestine starts pushing within minutes {gastrocolic reflex}. It moves what is already there, older food, to make room. That is the urge after a meal; the meal itself is still in the stomach.','Quand la nourriture étire l’estomac, le gros intestin commence à pousser en quelques minutes {réflexe gastrocolique}. Il fait avancer ce qui est déjà là, de la nourriture plus vieille, pour faire de la place. C’est l’envie après un repas; le repas lui-même est encore dans l’estomac.'],'solid',w=>TRANSIT(w,6)],
   [['Coffee’s push','La poussée du café'],['In a 1990 study, 29 in 100 people said coffee brought on the urge. In those who felt it, the end of the large intestine got busier within 4 minutes of a cup, with decaf too; hot water did nothing.','Dans une étude de 1990, 29 personnes sur 100 disaient que le café leur donnait l’envie. Chez celles qui la sentaient, le bout du gros intestin devenait plus actif moins de 4 minutes après une tasse, même avec du décaféiné; l’eau chaude ne faisait rien.'],'likely',w=>TRANSIT(w,7)],
   [['Speed shows in the stool','La vitesse se voit dans les selles'],['The longer stool stays in the large intestine, the more water comes out. So a slow trip tends to give hard stool, and a fast one mushy or watery stool. In the blue-muffin study, the hardest stools went with trips of over 5 days, and mushy pieces with about 1 day.','Plus les selles restent longtemps dans le gros intestin, plus l’eau en sort. Alors un trajet lent donne souvent des selles dures, et un trajet rapide des selles pâteuses ou aqueuses. Dans l’étude des muffins bleus, les selles les plus dures allaient avec des trajets de plus de 5 jours, et les morceaux pâteux avec environ 1 jour.'],'solid',w=>TRANSIT(w,8)],
   [['Fibre and the trip','Les fibres et le trajet'],['In trials, wheat bran made stools heavier and the trip shorter in every study. In people whose trip took over 48 hours, each extra gram of wheat fibre a day shortened it by about 45 minutes.','Dans les essais, le son de blé rendait les selles plus lourdes et le trajet plus court dans chaque étude. Chez les personnes dont le trajet dépassait 48 heures, chaque gramme de plus de fibres de blé par jour le raccourcissait d’environ 45 minutes.'],'solid',w=>TRANSIT(w,9)],
   [['Measuring the trip','Mesurer le trajet'],['The trip differs a lot from one person to the next, and in the same person from one test to the next. The blue-muffin study measured it simply: the time from eating a blue-dyed food to the first blue stool.','Le trajet varie beaucoup d’une personne à l’autre, et chez la même personne d’un test à l’autre. L’étude des muffins bleus le mesurait simplement\u00a0: le temps entre manger un aliment teint en bleu et les premières selles bleues.'],'solid',w=>TRANSIT(w,10)],
   [['When a change matters','Quand un changement compte'],['NIDDK lists these as reasons to see a doctor right away. With constipation: blood, constant belly pain, vomiting, fever, or losing weight without trying. With diarrhea: lasting more than 2 days, a high fever, six or more loose stools a day, or signs of losing too much water {dehydration}.','Le NIDDK nomme ces signes comme raisons de voir un médecin tout de suite. Avec la constipation\u00a0: du sang, une douleur constante au ventre, des vomissements, de la fièvre, ou une perte de poids sans essayer. Avec la diarrhée\u00a0: plus de 2 jours, une forte fièvre, six selles molles ou plus par jour, ou des signes de manque d’eau {déshydratation}.'],'solid',w=>TRANSIT(w,11)]
  ]},
{ id:'the-burn', sec:'gut', drug:true, t:['The burn after a meal','La brûlure après le repas'], d:['What burns, and why it happens.','Ce qui brûle, et pourquoi ça arrive.'],
  src:['niddkGERD','openstaxStomach','harvardGERD','iwakiri17','fujiwara05','kaltenbach06','acg22','nihNewsReflux','mayoGERD'],
  more:[['The lower esophageal sphincter and the diaphragm around it normally keep stomach contents from coming back up; many people have reflux once in a while {GER}. Stomach acid comes from cells in the stomach’s glands {parietal cells}; it keeps the stomach at a pH of about 1.5 to 3.5, and a layer of mucus protects the stomach’s own wall. When acid reaches the food pipe, it irritates the lining there.','Le sphincter inférieur de l’œsophage et le diaphragme autour de lui empêchent normalement le contenu de l’estomac de remonter; beaucoup de personnes ont un reflux de temps en temps {reflux gastro-œsophagien}. L’acide de l’estomac vient de cellules de ses glandes {cellules pariétales}; il garde l’estomac à un pH d’environ 1,5 à 3,5, et une couche de mucus protège la paroi de l’estomac lui-même. Quand l’acide arrive dans l’œsophage, il irrite la paroi à cet endroit.'],
        ['Most reflux happens during transient relaxations of the sphincter: relaxations that don’t come from swallowing, which are also how the stomach vents gas. Stretching the stomach makes them more frequent. In a hiatal hernia, the upper stomach moves up through the opening in the diaphragm, which lowers the pressure at the sphincter and makes reflux easier.','La plupart des reflux arrivent pendant des relâchements transitoires du sphincter\u00a0: des relâchements qui ne viennent pas de la déglutition, et qui servent aussi à l’estomac pour laisser sortir du gaz. Étirer l’estomac les rend plus fréquents. Dans une hernie hiatale, le haut de l’estomac remonte par l’ouverture du diaphragme, ce qui baisse la pression au sphincter et rend le reflux plus facile.'],
        ['In a review of studies from 1975 to 2004, tobacco, alcohol, chocolate and high-fat meals lowered sphincter pressure in lab measurements, but no published study showed that cutting foods improved reflux disease; weight loss and raising the head of the bed had evidence of benefit. The 2022 American College of Gastroenterology guideline recommends weight loss for people with overweight or obesity (moderate-quality evidence), and suggests no meals in the 2 to 3 hours before bed, raising the head of the bed for night symptoms, and leaving out the foods a person finds bring on symptoms (low-quality evidence).','Dans une revue des études de 1975 à 2004, le tabac, l’alcool, le chocolat et les repas riches en gras baissaient la pression du sphincter dans les mesures en laboratoire, mais aucune étude publiée ne montrait qu’enlever des aliments améliorait la maladie du reflux; perdre du poids et surélever la tête du lit avaient des preuves de bienfait. La ligne directrice 2022 de l’American College of Gastroenterology recommande la perte de poids aux personnes en surpoids ou obèses (preuves de qualité moyenne), et suggère de ne pas manger dans les 2 à 3 heures avant le coucher, de surélever la tête du lit pour les symptômes de nuit, et d’enlever les aliments qui, pour une personne, amènent des symptômes (preuves de faible qualité).'],
        ['In the dinner-to-bed study (147 people with reflux disease, 294 without), going to bed within 3 hours of dinner went with about 7.5 times the odds of reflux disease, after accounting for smoking, drinking and body weight. A study like this shows a link, not a cause.','Dans l’étude sur le temps entre le souper et le coucher (147 personnes avec la maladie du reflux, 294 sans), se coucher moins de 3 heures après le souper allait avec environ 7,5 fois plus de risque de maladie du reflux, en tenant compte du tabac, de l’alcool et du poids. Une étude comme celle-là montre un lien, pas une cause.'],
        ['Antacids neutralize acid for quick, short relief. H2 blockers and proton pump inhibitors lower how much acid the stomach makes; proton pump inhibitors are the most effective. Reflux two or more times a week for a few weeks may be reflux disease. NIDDK lists chest pain, problems or pain swallowing, persistent vomiting and loss of appetite as reasons to see a doctor.','Les antiacides neutralisent l’acide pour un soulagement rapide et court. Les anti-H2 et les inhibiteurs de la pompe à protons diminuent la quantité d’acide que fait l’estomac; les inhibiteurs de la pompe à protons sont les plus efficaces. Un reflux deux fois ou plus par semaine pendant quelques semaines peut être une maladie du reflux. Le NIDDK nomme la douleur à la poitrine, la difficulté ou la douleur en avalant, les vomissements qui durent et la perte d’appétit comme raisons de consulter un médecin.']],
  f:[
   [['The way down','Le chemin vers l’estomac'],['Food goes down a tube from the throat to the stomach {esophagus}. Where the tube meets the stomach, a ring of muscle closes it like a valve {lower esophageal sphincter}.','La nourriture descend par un tube, de la gorge jusqu’à l’estomac {œsophage}. Là où le tube rejoint l’estomac, un anneau de muscle le ferme comme une valve {sphincter inférieur de l’œsophage}.'],'solid',w=>BURN(w,0)],
   [['Acid in the stomach','L’acide dans l’estomac'],['The stomach makes a strong acid {hydrochloric acid} that helps break down food and kills germs. Its own wall is covered with a coat of mucus, so the acid doesn’t burn it.','L’estomac fabrique un acide fort {acide chlorhydrique} qui aide à défaire la nourriture et tue les microbes. Sa propre paroi est couverte d’une couche de mucus, alors l’acide ne la brûle pas.'],'solid',w=>BURN(w,1)],
   [['The valve','La valve'],['The valve opens to let food in, then closes so the acid stays down. A sheet of muscle under the lungs {diaphragm} helps hold it shut.','La valve s’ouvre pour laisser entrer la nourriture, puis se referme pour que l’acide reste en bas. Une grande feuille de muscle sous les poumons {diaphragme} l’aide à rester fermée.'],'solid',w=>BURN(w,2)],
   [['What burns','Ce qui brûle'],['When the valve opens at the wrong time, acid splashes up into the tube {reflux}. The tube has no mucus coat, so the acid irritates its lining: a burning feeling behind the breastbone {heartburn}.','Quand la valve s’ouvre au mauvais moment, de l’acide remonte dans le tube {reflux}. Le tube n’a pas de couche de mucus, alors l’acide irrite sa paroi\u00a0: une sensation de brûlure derrière le sternum {brûlures d’estomac}.'],'solid',w=>BURN(w,3)],
   [['The valve lets go on its own','La valve lâche toute seule'],['Many times a day, the valve relaxes for a few seconds by itself, to let gas out: a burp {transient relaxation}. Most reflux happens in those moments, in everyone. A full, stretched stomach makes them come more often.','Plusieurs fois par jour, la valve se relâche toute seule pendant quelques secondes, pour laisser sortir du gaz\u00a0: un rot {relâchement transitoire}. La plupart des reflux arrivent à ces moments-là, chez tout le monde. Un estomac plein et étiré les rend plus fréquents.'],'solid',w=>BURN(w,4)],
   [['Lying down after a meal','Se coucher après un repas'],['Standing, acid has to climb to get up the tube. Lying down, it doesn’t. In one study, people who went to bed within 3 hours of dinner were about 7 times more likely to have reflux disease than those who waited 4 hours or more.','Debout, l’acide doit grimper pour remonter le tube. Couché, il n’a pas à grimper. Dans une étude, les personnes qui se couchaient moins de 3 heures après le souper avaient environ 7 fois plus de risque d’avoir la maladie du reflux que celles qui attendaient 4 heures ou plus.'],'likely',w=>BURN(w,5)],
   [['Pressure from below','La pression d’en dessous'],['Weight around the belly and pregnancy press on the stomach and make reflux more likely. Sometimes the top of the stomach slides up through the diaphragm {hiatal hernia}, and the diaphragm can no longer help close the valve.','Le poids autour du ventre et la grossesse pressent sur l’estomac et rendent le reflux plus probable. Parfois, le haut de l’estomac glisse à travers le diaphragme {hernie hiatale}, et le diaphragme ne peut plus aider à fermer la valve.'],'solid',w=>BURN(w,6)],
   [['What people notice','Ce que les gens remarquent'],['In lab tests, fatty meals, chocolate, alcohol and smoking loosen the valve, and some people notice coffee, spicy or acidic foods. But in a review of 100 studies, cutting foods hadn’t been shown to help on average. It differs from one person to the next.','En laboratoire, les repas gras, le chocolat, l’alcool et le tabac relâchent la valve, et certaines personnes remarquent le café, les aliments épicés ou acides. Mais dans une revue de 100 études, enlever des aliments n’avait pas été démontré utile en moyenne. Ça change d’une personne à l’autre.'],'likely',w=>BURN(w,7)],
   [['What helped in studies','Ce qui a aidé dans les études'],['Two changes had the best evidence of helping: losing weight, in people with extra weight, and raising the head of the bed, for burning at night.','Deux changements avaient les meilleures preuves d’aider\u00a0: perdre du poids, chez les personnes qui ont du poids en trop, et surélever la tête du lit, pour la brûlure la nuit.'],'likely',w=>BURN(w,8)],
   [['Medicines','Les médicaments'],['Some medicines neutralize the acid already in the stomach {antacids}. Others make the stomach produce less acid {H2 blockers, proton pump inhibitors}.','Certains médicaments neutralisent l’acide déjà dans l’estomac {antiacides}. D’autres font que l’estomac produit moins d’acide {anti-H2, inhibiteurs de la pompe à protons}.'],'solid',w=>BURN(w,9)],
   [['More than a burn','Plus qu’une brûlure'],['Reflux two or more times a week, for weeks, may be reflux disease {GERD}, and over years the acid can damage the tube. And chest pain can also come from the heart: with shortness of breath, or pain in the jaw or arm, it may be a heart attack.','Un reflux deux fois ou plus par semaine, pendant des semaines, peut être une maladie du reflux {RGO}, et avec les années, l’acide peut abîmer le tube. Et une douleur à la poitrine peut aussi venir du cœur\u00a0: avec un essoufflement, ou une douleur à la mâchoire ou au bras, ce peut être une crise cardiaque.'],'solid',w=>BURN(w,10)]
  ]},
{ id:'ulcers', sec:'gut', drug:true, t:['Ulcers: a sore in the wall','Les ulcères\u00a0: une plaie dans la paroi'], d:['How a burn differs from a wound, and where ulcers form.','En quoi une brûlure diffère d’une plaie, et où se forment les ulcères.'],
  src:['niddkPU','statpearlsPUD','mayoPU','statpearlsEU','carlePUD'],
  more:[['A peptic ulcer is a sore on the lining of the stomach or the duodenum that goes deeper than the surface layer. NIDDK estimates that about 1 to 6\u00a0% of people in the United States have one. People are more likely to get one if they carry H. pylori, take NSAIDs, are older, have had one before, or smoke.','Un ulcère peptique est une plaie sur la paroi de l’estomac ou du duodénum qui va plus loin que la couche de surface. Le NIDDK estime qu’environ 1 à 6\u00a0% des personnes aux États-Unis en ont un. Le risque est plus grand chez les personnes qui portent H. pylori, qui prennent des AINS, qui sont plus âgées, qui en ont déjà eu un, ou qui fument.'],
        ['Prostaglandins made in the stomach wall help keep its protection in place; NSAIDs lower them. Some NSAIDs are more likely than others to cause ulcers, and the chance rises the longer they are taken. H. pylori sticks to the stomach lining and inflames it, though it often causes no problem at all.','Les prostaglandines fabriquées dans la paroi de l’estomac aident à garder sa protection en place; les AINS les diminuent. Certains AINS causent des ulcères plus souvent que d’autres, et le risque augmente plus ils sont pris longtemps. H. pylori s’accroche à la paroi de l’estomac et l’enflamme, même s’il ne cause souvent aucun problème.'],
        ['Ulcers of the food pipe can form anywhere along it. The most common cause is reflux disease; the second is damage from pills that stay in contact with the lining, such as some antibiotics, NSAIDs and bisphosphonates. Duodenal ulcers are about four times more common than stomach ulcers.','Les ulcères de l’œsophage peuvent se former à n’importe quel endroit le long de celui-ci. La cause la plus fréquente est la maladie du reflux; la deuxième, ce sont des comprimés qui restent en contact avec la paroi, comme certains antibiotiques, les AINS et les bisphosphonates. Les ulcères du duodénum sont environ quatre fois plus fréquents que ceux de l’estomac.'],
        ['The timing of pain is a classic pattern, and it varies: about 15 to 30 minutes after a meal for stomach ulcers, 2 to 3 hours for duodenal ulcers, which often hurt at night. Other common symptoms are feeling full too soon, bloating, nausea and belching. Many people have no symptoms until a complication.','Le moment de la douleur suit un modèle classique, qui varie\u00a0: environ 15 à 30 minutes après un repas pour les ulcères de l’estomac, 2 à 3 heures pour ceux du duodénum, qui font souvent mal la nuit. D’autres symptômes fréquents\u00a0: se sentir plein trop vite, des ballonnements, des nausées et des rots. Beaucoup de personnes n’ont aucun symptôme avant une complication.'],
        ['Complications are bleeding, a hole through the wall {perforation} that can lead to an infection of the lining of the belly, an ulcer reaching into a nearby organ, and blockage. Treatment depends on the cause: antibiotics with acid-lowering medicine when H. pylori is present, and a change of medicines when NSAIDs are the cause.','Les complications sont un saignement, un trou dans la paroi {perforation} qui peut mener à une infection de l’enveloppe du ventre, un ulcère qui atteint un organe voisin, et un blocage. Le traitement dépend de la cause\u00a0: des antibiotiques avec un médicament qui baisse l’acide quand H. pylori est présent, et un changement de médicaments quand les AINS en sont la cause.']],
  f:[
   [['Splash or wound','Éclaboussure ou plaie'],['The burn after a meal is acid touching a lining for a moment, and it passes. An ulcer is different: the lining itself has worn away, leaving an open sore {peptic ulcer}.','La brûlure après le repas, c’est de l’acide qui touche une paroi un moment, et ça passe. Un ulcère, c’est autre chose\u00a0: la paroi elle-même s’est usée, et il reste une plaie ouverte {ulcère peptique}.'],'solid',w=>ULCER(w,0)],
   [['The wall’s shield','Le bouclier de la paroi'],['The stomach wall shields itself with a coat of mucus. Messengers made in the wall keep that shield working {prostaglandins}. As long as the shield holds, the acid stays on top.','La paroi de l’estomac se protège avec une couche de mucus. Des messagers fabriqués dans la paroi gardent ce bouclier en marche {prostaglandines}. Tant que le bouclier tient, l’acide reste par-dessus.'],'solid',w=>ULCER(w,1)],
   [['A germ in the coat','Un microbe dans la couche'],['A bacterium can settle in the stomach {Helicobacter pylori}. It inflames the wall and weakens the shield, so acid gets through. Many people carry it without ever getting an ulcer.','Une bactérie peut s’installer dans l’estomac {Helicobacter pylori}. Elle enflamme la paroi et affaiblit le bouclier, alors l’acide passe. Beaucoup de personnes la portent sans jamais avoir d’ulcère.'],'solid',w=>ULCER(w,2)],
   [['Pain pills','Les comprimés contre la douleur'],['Pills like aspirin, ibuprofen and naproxen {NSAIDs} lower the messengers that keep the shield working. Taken for a long time, they can open an ulcer. With the germ, they are the two most common causes.','Des comprimés comme l’aspirine, l’ibuprofène et le naproxène {AINS} diminuent les messagers qui gardent le bouclier en marche. Pris longtemps, ils peuvent ouvrir un ulcère. Avec le microbe, ce sont les deux causes les plus fréquentes.'],'solid',w=>ULCER(w,3)],
   [['The sore','La plaie'],['Where the shield fails, acid and digestive juices eat past the surface, into the wall: an open sore.','Là où le bouclier lâche, l’acide et les sucs digestifs creusent plus loin que la surface, dans la paroi\u00a0: une plaie ouverte.'],'solid',w=>ULCER(w,4)],
   [['What doesn’t cause them','Ce qui ne les cause pas'],['Spicy food and stress don’t cause ulcers, though they can make the pain worse. Alcohol can wear on the mucus coat, and smoking may raise the chance of an ulcer in people who carry the germ.','Les aliments épicés et le stress ne causent pas d’ulcères, mais ils peuvent rendre la douleur pire. L’alcool peut user la couche de mucus, et le tabac peut augmenter le risque d’ulcère chez les personnes qui portent le microbe.'],'solid',w=>ULCER(w,5)],
   [['Where they form','Où ils se forment'],['Most ulcers form in the stomach or in the first part of the small intestine {duodenum}, where they are about four times more common. Years of reflux, or a pill that stays stuck on the way down, can also open one in the food pipe.','La plupart des ulcères se forment dans l’estomac ou dans la première partie de l’intestin grêle {duodénum}, où ils sont environ quatre fois plus fréquents. Des années de reflux, ou un comprimé qui reste pris en descendant, peuvent aussi en ouvrir un dans le tube des aliments.'],'solid',w=>ULCER(w,6)],
   [['When it hurts','Quand ça fait mal'],['The timing hints at where the sore is. Stomach ulcer pain usually starts 15 to 30 minutes after a meal. Pain from an ulcer in the small intestine comes 2 to 3 hours after, and often at night.','Le moment donne un indice sur l’endroit de la plaie. La douleur d’un ulcère de l’estomac commence d’habitude 15 à 30 minutes après un repas. Celle d’un ulcère de l’intestin grêle vient 2 à 3 heures après, et souvent la nuit.'],'likely',w=>ULCER(w,7)],
   [['Healing','La guérison'],['Medicines that cut stomach acid {proton pump inhibitors} let most ulcers heal. When the germ is the cause, antibiotics clear it. When pain pills are the cause, the doctor may change them.','Des médicaments qui coupent l’acide de l’estomac {inhibiteurs de la pompe à protons} laissent guérir la plupart des ulcères. Quand le microbe en est la cause, des antibiotiques l’éliminent. Quand les comprimés contre la douleur en sont la cause, le médecin peut les changer.'],'solid',w=>ULCER(w,8)],
   [['When an ulcer bleeds','Quand un ulcère saigne'],['Many ulcers give no pain until something goes wrong. An ulcer can bleed, or go right through the wall {perforation}. NIDDK lists black, tarry stool, vomit that looks like coffee grounds, and sudden, severe belly pain as reasons to call a doctor right away.','Beaucoup d’ulcères ne font pas mal jusqu’à ce que quelque chose tourne mal. Un ulcère peut saigner, ou traverser la paroi {perforation}. Le NIDDK nomme les selles noires et collantes, un vomi qui ressemble à du marc de café, et une douleur au ventre soudaine et forte comme raisons d’appeler un médecin tout de suite.'],'solid',w=>ULCER(w,9)]
  ]},
{ id:'blood-color', sec:'gut', drug:true, t:['What the color of blood says','Ce que dit la couleur du sang'], d:['Where blood in the gut comes from, and what can look like it.','D’où vient le sang dans le tube digestif, et ce qui peut lui ressembler.'],
  src:['niddkGIB','medlineStool','medlineRB','merckGIB','statpearlsRB'],
  more:[['NIDDK groups bleeding in the digestive tract by place: upper (the esophagus, the stomach and the start of the duodenum), small bowel (the middle and lower small intestine) and lower (the large intestine and the anus). Upper bleeding is the most common, then lower; small-bowel bleeding is the rarest. At the top, NIDDK lists ulcers, inflammation of the stomach or esophagus, swollen veins {varices}, tears from vomiting and growths as causes; at the bottom, pouches in the colon wall {diverticular disease}, hemorrhoids, small tears at the anus {anal fissures}, growths, and inflammation of the colon {colitis}.','Le NIDDK classe les saignements du tube digestif selon l’endroit\u00a0: le haut (l’œsophage, l’estomac et le début du duodénum), l’intestin grêle (sa partie du milieu et du bas) et le bas (le gros intestin et l’anus). Le saignement du haut est le plus fréquent, puis celui du bas; celui de l’intestin grêle est le plus rare. En haut, le NIDDK nomme comme causes les ulcères, l’inflammation de l’estomac ou de l’œsophage, des veines gonflées {varices}, des déchirures causées par les vomissements et des tumeurs; en bas, des poches dans la paroi du côlon {diverticulose}, les hémorroïdes, de petites déchirures à l’anus {fissures anales}, des tumeurs et l’inflammation du côlon {colite}.'],
        ['Black, tarry stool {melena} usually comes from the top, but a source in the small intestine or the right side of the colon can also cause it. It takes about 100 to 200\u00a0mL of blood in the upper tract, and it can last several days after the bleeding has stopped. Vomiting red blood {hematemesis} points to the top; vomit like coffee grounds comes from upper bleeding that has slowed or stopped. Red blood from the anus {hematochezia} usually comes from the lower tract, but a vigorous upper bleed that moves through fast can cause it.','Les selles noires et goudronneuses {méléna} viennent d’habitude du haut, mais une source dans l’intestin grêle ou dans le côté droit du côlon peut aussi les causer. Il faut environ 100 à 200\u00a0mL de sang dans le haut du tube, et elles peuvent durer plusieurs jours après la fin du saignement. Vomir du sang rouge {hématémèse} pointe vers le haut; un vomi qui ressemble à du marc de café vient d’un saignement du haut qui a ralenti ou arrêté. Du sang rouge par l’anus {rectorragie} vient d’habitude du bas, mais un saignement du haut abondant qui passe vite peut le causer.'],
        ['Bleeding near the anus can show as red blood separate from the stool, streaks on the stool, or blood on the paper; bleeding from higher in the lower tract shows as bright red or maroon blood mixed into the stool.','Un saignement près de l’anus peut se voir comme du sang rouge à part des selles, des traînées sur les selles, ou du sang sur le papier; un saignement venant de plus haut dans le bas du tube se voit comme du sang rouge vif ou bordeaux mêlé aux selles.'],
        ['MedlinePlus lists black licorice, blueberries, blood sausage, iron pills, activated charcoal and bismuth medicines as causes of black stool, and beets and red food coloring as causes of reddish stool; a chemical test of the stool checks for blood. A slow bleed can come from anywhere in the gut and be too small to see; chemical testing of the stool detects it, and it can show up as anemia: weakness, tiring easily, dizziness.','MedlinePlus nomme la réglisse noire, les bleuets, le boudin, les comprimés de fer, le charbon activé et les médicaments au bismuth comme causes de selles noires, et les betteraves et le colorant alimentaire rouge comme causes de selles rougeâtres; un test chimique des selles vérifie la présence de sang. Un saignement lent peut venir de n’importe où dans le tube et être trop petit pour être vu; un test chimique des selles le détecte, et il peut se montrer par une anémie\u00a0: faiblesse, fatigue rapide, étourdissements.'],
        ['NIDDK lists among the signs of sudden bleeding cramps or pain in the belly, feeling lightheaded or fainting, tiredness and shortness of breath; among the signs of shock, which is life-threatening, confusion, a fast heart rate, pale skin, cold hands and feet, and sweating. MedlinePlus recommends an exam even when a person thinks hemorrhoids are the cause.','Le NIDDK nomme parmi les signes d’un saignement soudain des crampes ou de la douleur au ventre, un étourdissement ou un évanouissement, la fatigue et l’essoufflement; parmi les signes d’un choc, qui met la vie en danger, la confusion, un cœur rapide, une peau pâle, des mains et des pieds froids, et la sueur. MedlinePlus recommande un examen même quand une personne croit que les hémorroïdes en sont la cause.']],
  f:[
   [['One long tube','Un long tube'],['Food travels one long tube, from the mouth to the end. Doctors split it in three: the top (the food pipe, the stomach, the start of the small intestine), the middle (the rest of the small intestine) and the bottom (the large intestine {colon} and the end {rectum, anus}). Bleeding most often comes from the top.','La nourriture voyage dans un seul long tube, de la bouche jusqu’au bout. Les médecins le divisent en trois\u00a0: le haut (le tube des aliments, l’estomac, le début de l’intestin grêle), le milieu (le reste de l’intestin grêle) et le bas (le gros intestin {côlon} et le bout {rectum, anus}). Le saignement vient le plus souvent du haut.'],'solid',w=>BLOOD(w,0)],
   [['The trip changes the color','Le trajet change la couleur'],['Fresh blood is bright red. On its way down the tube, blood gets digested and turns darker. The higher it starts, the longer the trip, and the darker it comes out.','Le sang frais est rouge vif. En descendant le tube, le sang est digéré et devient plus foncé. Plus il part de haut, plus le trajet est long, et plus il sort foncé.'],'solid',w=>BLOOD(w,1)],
   [['Black and sticky','Noir et collant'],['Blood from the top comes out black, sticky and foul-smelling, like tar {melena}. It takes about 100 to 200\u00a0mL of blood up there, less than a cup, and the black can last for days after the bleeding stops.','Le sang qui vient du haut sort noir, collant et malodorant, comme du goudron {méléna}. Il en faut environ 100 à 200\u00a0mL là-haut, moins d’une tasse, et le noir peut durer des jours après la fin du saignement.'],'solid',w=>BLOOD(w,2)],
   [['Coming back up','Ce qui remonte'],['Blood at the top can also come back up. Bright red in vomit is fresh blood {hematemesis}. Dark brown grains, like coffee grounds, are blood that sat in the stomach’s acid, often from a bleed that slowed or stopped.','Le sang du haut peut aussi remonter. Du rouge vif dans le vomi, c’est du sang frais {hématémèse}. Des grains brun foncé, comme du marc de café, c’est du sang resté dans l’acide de l’estomac, souvent d’un saignement qui a ralenti ou arrêté.'],'solid',w=>BLOOD(w,3)],
   [['Red at the end','Rouge au bout'],['Blood from the end of the tube has almost no trip, so it stays bright red: on the stool, or on the paper. From higher in the large intestine, it can come out dark red, mixed into the stool.','Le sang qui vient du bout du tube n’a presque pas de trajet, alors il reste rouge vif\u00a0: sur les selles, ou sur le papier. De plus haut dans le gros intestin, il peut sortir rouge foncé, mêlé aux selles.'],'solid',w=>BLOOD(w,4)],
   [['A fast bleed','Un saignement rapide'],['Less often, a big, fast bleed at the top rushes through before it can darken, and comes out red. So red alone doesn’t show that a bleed is low, or that it is small.','Plus rarement, un gros saignement rapide dans le haut passe si vite qu’il n’a pas le temps de devenir foncé, et sort rouge. Alors le rouge, à lui seul, ne montre pas que le saignement est bas, ni qu’il est petit.'],'solid',w=>BLOOD(w,5)],
   [['Look-alikes','Ce qui y ressemble'],['Some things color the stool with no blood at all. Iron pills, stomach medicines with bismuth {bismuth subsalicylate}, black licorice and blueberries can turn it black; beets and red food coloring, reddish. A chemical test of the stool tells blood from a look-alike.','Certaines choses colorent les selles sans aucun sang. Les comprimés de fer, les médicaments pour l’estomac au bismuth {sous-salicylate de bismuth}, la réglisse noire et les bleuets peuvent les rendre noires; les betteraves et le colorant alimentaire rouge, rougeâtres. Un test chimique des selles distingue le sang de ce qui lui ressemble.'],'solid',w=>BLOOD(w,6)],
   [['Blood no one sees','Du sang que personne ne voit'],['A slow bleed can be too small to see {occult bleeding}. A chemical test of the stool finds it. Over months, small losses can empty the iron store (see Iron, in and out) and bring tiredness and weakness {anemia}.','Un saignement lent peut être trop petit pour être vu {saignement occulte}. Un test chimique des selles le trouve. Avec les mois, de petites pertes peuvent vider la réserve de fer (voir Le fer, ce qui entre et ce qui sort) et amener fatigue et faiblesse {anémie}.'],'solid',w=>BLOOD(w,7)],
   [['What NIDDK calls urgent','Ce que le NIDDK dit urgent'],['NIDDK lists these as reasons to get medical help right away: black or tarry stool, red blood mixed with the stool, and bright red blood or coffee grounds in vomit. Feeling dizzy or fainting can mean a lot of blood has been lost.','Le NIDDK nomme ces signes comme raisons d’obtenir de l’aide médicale tout de suite\u00a0: des selles noires et collantes, du sang rouge mêlé aux selles, et du sang rouge vif ou du marc de café dans le vomi. Un étourdissement ou un évanouissement peut vouloir dire que beaucoup de sang a été perdu.'],'solid',w=>BLOOD(w,8)]
  ]},
{ id:'belly-pain', sec:'gut', t:['Where a belly pain sits','Où se trouve une douleur au ventre'], d:['What lies under each spot, and why some pains move.','Ce qui se trouve sous chaque endroit, et pourquoi certaines douleurs se déplacent.'],
  src:['sherman90','niddkApp','statpearlsApp','niddkGS','merckGS','niddkPanc','merckPanc','mayoHA'],
  more:[['Pain from the organs themselves {visceral pain} is poorly localized, spreads over several body segments, and is felt along the middle of the belly; a steady, dull ache usually comes from a stretched or swollen hollow organ. Pain from irritation of the lining {parietal peritoneum} is sharp and well localized. In appendicitis, the textbook describes the pain low on the right as a new, separate pain carried by different nerves, rather than the first pain moving.','La douleur qui vient des organes eux-mêmes {douleur viscérale} est mal localisée, s’étend sur plusieurs segments du corps, et se sent le long du milieu du ventre; une douleur sourde et constante vient d’habitude d’un organe creux étiré ou enflé. La douleur qui vient d’une irritation de l’enveloppe {péritoine pariétal} est vive et bien localisée. Dans l’appendicite, le manuel décrit la douleur en bas à droite comme une nouvelle douleur, distincte, portée par d’autres nerfs, plutôt que la première douleur qui se déplace.'],
        ['NIDDK estimates that 5 to 9 of every 100 people get appendicitis at some point. Other symptoms can include loss of appetite, nausea or vomiting, fever and a swollen belly; some people, especially children, don’t have the typical pattern. Untreated, the appendix can burst and cause a serious infection of the lining {peritonitis}. In StatPearls, about 75 in 100 people with appendicitis come in within 24 hours of the first symptoms.','Le NIDDK estime que 5 à 9 personnes sur 100 ont une appendicite à un moment de leur vie. D’autres symptômes possibles\u00a0: la perte d’appétit, des nausées ou des vomissements, de la fièvre et un ventre enflé; certaines personnes, surtout les enfants, n’ont pas le modèle typique. Sans traitement, l’appendice peut éclater et causer une infection grave de l’enveloppe {péritonite}. Dans StatPearls, environ 75 personnes sur 100 avec une appendicite consultent moins de 24 heures après les premiers symptômes.'],
        ['NIDDK estimates that 10 to 15 in 100 people in the United States have gallstones. In the Merck Manual, an attack begins suddenly, peaks within 15 minutes to an hour, stays steady usually for less than 6 hours (sometimes up to 12), then fades over 30 to 90 minutes, leaving a dull ache. The pain can spread to the back or down the arm, and is often hard to place in older people and in people with diabetes. A heavy meal can bring it on, but fatty food is not the only cause. Fever and chills point to an inflamed gallbladder {cholecystitis}; pain lasting over 12 hours with vomiting or fever makes an inflamed gallbladder or pancreatitis likely.','Le NIDDK estime que 10 à 15 personnes sur 100 aux États-Unis ont des calculs biliaires. Dans le Manuel Merck, une crise commence soudainement, atteint son maximum en 15 minutes à une heure, reste constante d’habitude moins de 6 heures (parfois jusqu’à 12), puis s’efface en 30 à 90 minutes, en laissant une douleur sourde. La douleur peut aller vers le dos ou descendre dans le bras, et elle est souvent difficile à situer chez les personnes âgées et chez celles qui ont le diabète. Un gros repas peut l’amener, mais le gras n’est pas la seule cause. La fièvre et les frissons pointent vers une vésicule enflammée {cholécystite}; une douleur de plus de 12 heures avec des vomissements ou de la fièvre rend probable une vésicule enflammée ou une pancréatite.'],
        ['The Merck Manual describes the pain of acute pancreatitis as steady and boring, in the upper middle or upper left belly, sometimes going through to the back; sitting up and leaning forward may ease it. NIDDK lists fever, nausea and vomiting, a racing heartbeat and a swollen, tender belly as other symptoms, and names gallstones as the most common cause of acute pancreatitis.','Le Manuel Merck décrit la douleur de la pancréatite aiguë comme constante et perçante, au milieu ou à gauche du haut du ventre, qui traverse parfois jusque dans le dos; s’asseoir et se pencher vers l’avant peut la soulager. Le NIDDK nomme la fièvre, les nausées et les vomissements, un cœur qui s’emballe et un ventre enflé et sensible comme autres symptômes, et nomme les calculs biliaires comme la cause la plus fréquente de la pancréatite aiguë.'],
        ['Mayo Clinic lists among the symptoms of a heart attack chest pressure or pain; pain that spreads to the shoulder, arm, back, neck, jaw, teeth or upper belly; a cold sweat, tiredness, heartburn or indigestion, lightheadedness, nausea and shortness of breath. In women, older adults and people with diabetes, the signs can seem unrelated to the heart.','Mayo Clinic nomme parmi les symptômes d’une crise cardiaque une pression ou une douleur à la poitrine; une douleur qui s’étend à l’épaule, au bras, au dos, au cou, à la mâchoire, aux dents ou au haut du ventre; une sueur froide, la fatigue, des brûlures d’estomac ou une indigestion, un étourdissement, des nausées et l’essoufflement. Chez les femmes, les personnes âgées et les personnes qui ont le diabète, les signes peuvent sembler sans lien avec le cœur.']],
  f:[
   [['A map of the belly','Une carte du ventre'],['Inside the belly sit the organs: the liver high on the right, the stomach high in the middle and to the left, the intestines below. Seen from the front, the person’s right is on the left of the picture. Where a pain sits often points to what is under it, but not always.','Dans le ventre se trouvent les organes\u00a0: le foie en haut à droite, l’estomac en haut au milieu et vers la gauche, les intestins en dessous. De face, la droite de la personne est à gauche de l’image. L’endroit d’une douleur indique souvent ce qui est dessous, mais pas toujours.'],'likely',w=>PAIN(w,0)],
   [['Two kinds of pain','Deux sortes de douleur'],['An organ’s own nerves {visceral nerves} give a dull ache that is hard to place, usually felt in the middle of the belly. The inner lining of the belly wall {peritoneum} has nerves that pinpoint: when an inflamed organ touches it, the pain turns sharp and sits right over the spot.','Les nerfs des organes eux-mêmes {nerfs viscéraux} donnent une douleur sourde, difficile à situer, sentie d’habitude au milieu du ventre. L’enveloppe intérieure du ventre {péritoine} a des nerfs précis\u00a0: quand un organe enflammé la touche, la douleur devient vive et se place juste au-dessus.'],'solid',w=>PAIN(w,1)],
   [['A pain that moves','Une douleur qui se déplace'],['A small pouch hangs off the large intestine, low on the right {appendix}. When it swells {appendicitis}, the pain often starts as a dull ache near the belly button. Within hours, once the swelling reaches the lining, it settles low on the right, and gets worse with moving, coughing or a deep breath.','Une petite poche pend du gros intestin, en bas à droite {appendice}. Quand elle enfle {appendicite}, la douleur commence souvent comme une douleur sourde près du nombril. En quelques heures, quand l’enflure atteint l’enveloppe, elle se place en bas à droite, et augmente en bougeant, en toussant ou en respirant fort.'],'likely',w=>PAIN(w,2)],
   [['After a heavy meal','Après un gros repas'],['Under the liver, a small sac stores bile, a digestive juice, and squeezes it out when a person eats {gallbladder}. If a stone blocks the way out {gallstone}, pain builds high on the right, often after a heavy meal, in the evening or at night. It can last hours, and reach the back.','Sous le foie, un petit sac garde la bile, un suc digestif, et la fait sortir quand une personne mange {vésicule biliaire}. Si une pierre bloque la sortie {calcul biliaire}, une douleur monte en haut à droite, souvent après un gros repas, le soir ou la nuit. Elle peut durer des heures, et aller jusque dans le dos.'],'likely',w=>PAIN(w,3)],
   [['Through to the back','Jusque dans le dos'],['Behind the stomach lies the pancreas, which makes digestive juices and insulin. When it is inflamed {pancreatitis}, a steady pain sits high in the belly and can go right through to the back. Most cases come from gallstones (40 to 70 in 100) or alcohol (25 to 35 in 100).','Derrière l’estomac se trouve le pancréas, qui fait des sucs digestifs et l’insuline. Quand il est enflammé {pancréatite}, une douleur constante se place en haut du ventre et peut traverser jusque dans le dos. La plupart des cas viennent de calculs biliaires (40 à 70 sur 100) ou de l’alcool (25 à 35 sur 100).'],'solid',w=>PAIN(w,4)],
   [['What NIDDK calls urgent','Ce que le NIDDK dit urgent'],['NIDDK calls appendicitis an emergency that needs care right away. For gallstones and the pancreas, it lists belly pain that lasts hours or keeps getting worse, fever or chills, and yellow skin or eyes {jaundice}. A heart attack can also be felt in the upper belly, or like indigestion; chest pain and shortness of breath are other signs.','Le NIDDK dit que l’appendicite est une urgence qui demande des soins tout de suite. Pour les calculs biliaires et le pancréas, il nomme une douleur au ventre qui dure des heures ou qui empire, de la fièvre ou des frissons, et une peau ou des yeux jaunes {jaunisse}. Une crise cardiaque peut aussi se sentir dans le haut du ventre, ou comme une indigestion; la douleur à la poitrine et l’essoufflement sont d’autres signes.'],'solid',w=>PAIN(w,5)]
  ]},
{ id:'bucket', sec:'gut', drug:true, t:['The bucket','Le seau'], d:['Why the amount matters more than the food, and why the line differs from one person to the next.','Pourquoi la quantité compte plus que l’aliment, et pourquoi la limite change d’une personne à l’autre.'],
  src:['comasbaste20','efsa11','fsanzHist','hrubisko21','niddkLactose','efsa','niddkStones','nkfCaOx','uchicagoOx','knight20','statpearlsHU','statpearlsGout','hourihane17','patel21','facAna'],
  more:[['Histamine is broken down by two enzymes: diamine oxidase in the gut, the main defence against histamine that is eaten, and another one inside cells {histamine N-methyltransferase}. The body stores its own histamine mainly in two kinds of immune cells {mast cells, basophils}. Foods high in histamine include spoiled or poorly handled fish and meat and fermented products; in one table, canned fish, dry-fermented sausages and raw-milk cheese had high average levels. A low diamine oxidase can come from genes, illness or medicines. Some authors put histamine intolerance at 1 to 3 in 100 people, on limited data; symptoms are not specific and no diagnostic test is validated.','L’histamine est défaite par deux enzymes\u00a0: la diamine oxydase dans l’intestin, la principale défense contre l’histamine mangée, et une autre à l’intérieur des cellules {histamine N-méthyltransférase}. Le corps garde sa propre histamine surtout dans deux sortes de cellules de défense {mastocytes, basophiles}. Les aliments riches en histamine comprennent le poisson et la viande mal conservés ou abîmés et les produits fermentés; dans un tableau, le poisson en conserve, les saucissons secs fermentés et les fromages au lait cru avaient des niveaux moyens élevés. Une diamine oxydase basse peut venir des gènes, d’une maladie ou de médicaments. Certains auteurs estiment l’intolérance à l’histamine à 1 à 3 personnes sur 100, avec peu de données; les symptômes ne sont pas spécifiques et aucun test diagnostique n’est validé.'],
        ['The 50 mg figure comes from the European Food Safety Authority, based on limited published information. Food Standards Australia New Zealand puts it this way: since the body makes histamine itself, low doses are unlikely to be toxic; problems come at doses above a person’s own tolerance. A food intolerance is a reaction that does not involve the immune system, to an amount most people handle.','Le chiffre de 50 mg vient de l’Autorité européenne de sécurité des aliments, à partir de peu de données publiées. Food Standards Australia New Zealand le dit ainsi\u00a0: comme le corps fabrique lui-même de l’histamine, les petites doses ne sont probablement pas toxiques; les problèmes viennent à des doses au-delà de la tolérance propre à une personne. Une intolérance alimentaire est une réaction qui ne passe pas par le système immunitaire, à une quantité que la plupart des gens prennent sans problème.'],
        ['Most oxalate the body makes comes from the liver, and vitamin C is the main food source of the body’s own oxalate. In studies with controlled diets, about 10 to 15 in 100 of the oxalate eaten was absorbed, and food made up about 25 to 40 in 100 of the oxalate in urine. NIDDK names nuts, peanuts, rhubarb, spinach and wheat bran as high in oxalate. The National Kidney Foundation calls calcium oxalate stones the most common kind; they form when oxalate sticks to calcium as urine is made, and too little liquid adds to it.','La plus grande partie de l’oxalate que fabrique le corps vient du foie, et la vitamine C est la principale source alimentaire de l’oxalate que le corps produit. Dans des études à diète contrôlée, environ 10 à 15 sur 100 de l’oxalate mangé était absorbé, et la nourriture faisait environ 25 à 40 sur 100 de l’oxalate de l’urine. Le NIDDK nomme les noix, les arachides, la rhubarbe, les épinards et le son de blé comme riches en oxalate. La National Kidney Foundation dit que les pierres d’oxalate de calcium sont le type le plus fréquent; elles se forment quand l’oxalate colle au calcium pendant que l’urine se fait, et trop peu de liquide y contribue.'],
        ['StatPearls defines a high uric acid {hyperuricemia} as usually above 6 mg/dL in women and 7 mg/dL in men; 85 to 90 in 100 people with it have no symptoms. Diet supplies about a third of the uric acid made each day. The share cleared by the kidneys and the gut can change with medicines or with kidney or gut problems. Gout is defined by urate above about 6.8 mg/dL (about 400 µmol/L), the level where it saturates body fluids.','StatPearls définit un acide urique élevé {hyperuricémie} comme d’habitude au-dessus de 6 mg/dL chez les femmes et de 7 mg/dL chez les hommes; 85 à 90 personnes sur 100 qui en ont n’ont aucun symptôme. L’alimentation fournit environ le tiers de l’acide urique fabriqué chaque jour. La part éliminée par les reins et par l’intestin peut changer avec des médicaments ou des problèmes aux reins ou à l’intestin. La goutte se définit par un urate au-dessus d’environ 6,8 mg/dL (environ 400 µmol/L), le niveau où il sature les liquides du corps.'],
        ['An eliciting dose is the amount expected to bring objective symptoms in a given share of people with an allergy: 5 in 100 for the ED05. The Peanut Allergen Threshold Study gave 1.5 mg of peanut protein, the estimated ED05, in a single dose. In food challenges, one person’s threshold varied by up to 1,000 times between tests, though most stayed within about 3 times. About 4 or 5 in 100 people who reacted to 5 mg of peanut protein or less had anaphylaxis.','Une dose de réaction est la quantité qui amènerait, selon les calculs, des symptômes objectifs chez une part donnée des personnes allergiques\u00a0: 5 sur 100 pour la DE05. L’étude du seuil d’allergie aux arachides a donné 1,5 mg de protéine d’arachide, la DE05 estimée, en une seule dose. Dans les tests de provocation, le seuil d’une même personne a varié jusqu’à 1\u00a0000 fois d’un test à l’autre, même si la plupart restaient à environ 3 fois. Environ 4 ou 5 personnes sur 100 qui réagissaient à 5 mg de protéine d’arachide ou moins faisaient une anaphylaxie.']],
  f:[
   [['Compound, not food','Le composé, pas l’aliment'],['Foods that look unrelated can carry the same compound. Raw-milk cheese, dry-cured sausage and canned fish all bring histamine. The body doesn’t count a cheese or a fish: it deals with how much histamine came in, from all of them together.','Des aliments qui n’ont rien en commun peuvent porter le même composé. Le fromage au lait cru, le saucisson sec et le poisson en conserve apportent tous de l’histamine. Le corps ne compte pas un fromage ou un poisson\u00a0: il doit gérer la quantité d’histamine entrée, de tous ensemble.'],'solid',w=>BUCKET(w,0)],
   [['In, made, out','Entré, fabriqué, sorti'],['Each compound can be pictured as a bucket. Food pours some in, the body makes some of its own, and a drain clears it: an enzyme in the gut, the liver or the kidneys. When more comes in than drains out, the level rises; past the rim, it spills over.','Chaque composé peut se voir comme un seau. La nourriture en verse, le corps en fabrique lui-même, et un drain l’élimine\u00a0: une enzyme dans l’intestin, le foie ou les reins. Quand il en entre plus qu’il en sort, le niveau monte; au-delà du bord, il déborde.'],'solid',w=>BUCKET(w,1)],
   [['A second cup lands on the first','La deuxième tasse s’ajoute à la première'],['The drain works at its own pace. The body clears about half its caffeine every 5 hours (see Caffeine’s clock). A second coffee 5 hours after the first lands on the half still there: the level reaches one and a half cups.','Le drain travaille à son propre rythme. Le corps élimine environ la moitié de sa caféine toutes les 5 heures (voir L’horloge de la caféine). Un deuxième café 5 heures après le premier s’ajoute à la moitié encore là\u00a0: le niveau monte à une tasse et demie.'],'solid',w=>BUCKET(w,2)],
   [['A drain with a limit','Un drain qui a sa limite'],['Some drains can only take so much at once. The enzyme that splits milk sugar {lactase} can run short. NIDDK says many people with lactose intolerance can have 12 grams of lactose, about 1 cup of milk, without symptoms. Past what the drain takes, the rest goes on to the bacteria.','Certains drains ne prennent qu’une certaine quantité à la fois. L’enzyme qui coupe le sucre du lait {lactase} peut manquer. Le NIDDK dit que bien des personnes intolérantes au lactose peuvent prendre 12 grammes de lactose, environ 1 tasse de lait, sans symptômes. Au-delà de ce que le drain prend, le reste continue vers les bactéries.'],'solid',w=>BUCKET(w,3)],
   [['The histamine bucket','Le seau de l’histamine'],['Histamine comes in with food, and the body also makes it in its own immune cells. In the gut, an enzyme clears what was eaten {diamine oxidase, DAO}. Alcohol and other amines in food can add to its effect, and some common medicines slow the enzyme: about 20 in 100 Europeans take one regularly.','L’histamine entre avec la nourriture, et le corps en fabrique aussi dans ses propres cellules de défense. Dans l’intestin, une enzyme élimine celle qui a été mangée {diamine oxydase, DAO}. L’alcool et d’autres amines des aliments peuvent ajouter à son effet, et des médicaments courants ralentissent l’enzyme\u00a0: environ 20 Européens sur 100 en prennent un régulièrement.'],'likely',w=>BUCKET(w,4)],
   [['Same amount, different lines','Même quantité, limites différentes'],['The same amount lands differently. In a European review, 50 mg of histamine in a meal showed no effects in people without histamine intolerance; for people with it, the level with no effects was too low to measure. Diagnosis is still hard: no test for it is validated yet.','La même quantité ne tombe pas pareil. Selon une revue européenne, 50 mg d’histamine dans un repas n’ont montré aucun effet chez les personnes sans intolérance à l’histamine; chez celles qui en ont une, le niveau sans effet était trop bas pour être mesuré. Le diagnostic reste difficile\u00a0: aucun test n’est encore validé.'],'likely',w=>BUCKET(w,5)],
   [['The oxalate bucket','Le seau de l’oxalate'],['Oxalate comes from plants like spinach, rhubarb, nuts and peanuts, and the liver makes some too: in studies, food made up about 25 to 40 in 100 of the oxalate in urine. Calcium in the gut can block some of it. The kidneys clear the rest, and in urine, too much can stick to calcium and form the most common kind of kidney stone.','L’oxalate vient de plantes comme les épinards, la rhubarbe, les noix et les arachides, et le foie en fabrique aussi\u00a0: dans les études, la nourriture faisait environ 25 à 40 sur 100 de l’oxalate de l’urine. Le calcium dans l’intestin peut en bloquer une partie. Les reins éliminent le reste, et dans l’urine, trop d’oxalate peut coller au calcium et former le type de pierre au rein le plus fréquent.'],'solid',w=>BUCKET(w,6)],
   [['The uric acid bucket','Le seau de l’acide urique'],['Purines come from food, mostly organ meats, some seafood and beer, and from the body breaking down its own cells, which gives about two thirds of the total. Their end product is uric acid. The kidneys clear about two thirds of it, the gut one third.','Les purines viennent de la nourriture, surtout les abats, certains fruits de mer et la bière, et du corps qui défait ses propres cellules, ce qui donne environ les deux tiers du total. Leur produit final est l’acide urique. Les reins en éliminent environ les deux tiers, l’intestin un tiers.'],'solid',w=>BUCKET(w,7)],
   [['When uric acid overflows','Quand l’acide urique déborde'],['Above about 6.8 mg per decilitre of blood (about 400 µmol/L), uric acid can come out of the blood as crystals in a joint {gout}. Most people with a high level never get symptoms: 85 to 90 in 100.','Au-dessus d’environ 6,8 mg par décilitre de sang (environ 400 µmol/L), l’acide urique peut sortir du sang en cristaux dans une articulation {goutte}. La plupart des personnes qui ont un niveau élevé n’ont jamais de symptômes\u00a0: 85 à 90 sur 100.'],'solid',w=>BUCKET(w,8)],
   [['From milligrams to grams','Des milligrammes aux grammes'],['Lines span a huge range. About 1.5 mg of peanut protein is estimated to be enough for 5 in 100 people with a peanut allergy to react. 50 mg of histamine in a meal showed no effects in people without histamine intolerance. Many people with lactose intolerance handle 12 grams of lactose. From the first to the last is about 8,000 times.','Les limites couvrent un écart énorme. Environ 1,5 mg de protéine d’arachide suffirait pour faire réagir 5 personnes sur 100 allergiques aux arachides. 50 mg d’histamine dans un repas n’ont montré aucun effet chez les personnes sans intolérance à l’histamine. Bien des personnes intolérantes au lactose prennent 12 grammes de lactose. Du premier au dernier, c’est environ 8\u00a0000 fois.'],'solid',w=>BUCKET(w,9)],
   [['Why the line moves','Pourquoi la limite bouge'],['Each person’s line sits in a different place, and it moves: the drain changes with genes, illness and medicines, and the level depends on what is already in the bucket. The bucket is only a picture: in the body, the compound is spread through blood and tissues, and its level can’t be seen without a test.','La limite de chaque personne est à un endroit différent, et elle bouge\u00a0: le drain change avec les gènes, la maladie et les médicaments, et le niveau dépend de ce qui est déjà dans le seau. Le seau n’est qu’une image\u00a0: dans le corps, le composé est réparti dans le sang et les tissus, et son niveau ne se voit pas sans test.'],'solid',w=>BUCKET(w,10)],
   [['An allergy is another story','Une allergie, c’est autre chose'],['An allergy is the immune system raising an alarm, not a bucket filling up. Even a tiny amount can bring a serious reaction: in food challenges, about 4 or 5 in 100 people who reacted to 5 mg of peanut protein or less had the most serious kind {anaphylaxis}. Food Allergy Canada calls it a medical emergency: epinephrine at the first signs, then 911.','Une allergie, c’est le système immunitaire qui sonne l’alarme, pas un seau qui se remplit. Même une quantité minime peut amener une réaction grave\u00a0: dans les tests de provocation, environ 4 ou 5 personnes sur 100 qui réagissaient à 5 mg de protéine d’arachide ou moins ont eu la forme la plus grave {anaphylaxie}. Allergies Alimentaires Canada dit que c’est une urgence médicale\u00a0: l’épinéphrine aux premiers signes, puis le 911.'],'solid',w=>BUCKET(w,11)]
  ]},
{ id:'night', sec:'sleep', t:['The night’s stages','Les étapes de la nuit'], d:['What brings sleep on, what happens in each part of the night, and what caffeine and alcohol change.','Ce qui amène le sommeil, ce qui se passe dans chaque partie de la nuit, et ce que la caféine et l’alcool changent.'],
  src:['ninds','statpearlsSleep','leproult10','vancauter00','xie13','gardiner23','ebrahim13','csepSleep','statcanSleep','nhlbiApnea'],
  more:[['StatPearls gives stage 1 about 5\u00a0% of total sleep, stage 2 about 45\u00a0% and REM about 25\u00a0%. It counts 4 to 6 cycles a night of about 90 minutes in one place, and 4 to 5 cycles of 90 to 110 minutes in another. In REM, the skeletal muscles go slack and still, except the eyes and the breathing muscle. NINDS: memory consolidation most likely needs both non-REM and REM sleep.','StatPearls donne au stade 1 environ 5\u00a0% du sommeil total, au stade 2 environ 45\u00a0% et au sommeil paradoxal environ 25\u00a0%. Il compte 4 à 6 cycles par nuit d’environ 90 minutes à un endroit, et 4 à 5 cycles de 90 à 110 minutes à un autre. Pendant le sommeil paradoxal, les muscles du squelette sont relâchés et immobiles, sauf les yeux et le muscle de la respiration. NINDS\u00a0: la consolidation de la mémoire demande très probablement le sommeil non paradoxal et le sommeil paradoxal.'],
        ['Growth hormone: in men, the most reliable pulse comes shortly after falling asleep, during slow-wave sleep. When sleep is moved, the main pulse moves too; during a night without sleep, the release is minimal or absent. The link is clearest in men but can also be seen in women. In men, the pulse after falling asleep is generally the main, or even the only, burst of the day.','L’hormone de croissance\u00a0: chez les hommes, la poussée la plus régulière vient peu après l’endormissement, pendant le sommeil lent profond. Quand le sommeil est déplacé, la poussée principale se déplace aussi; pendant une nuit sans sommeil, la libération est minime ou absente. Le lien est le plus clair chez les hommes, mais se voit aussi chez les femmes. Chez les hommes, la poussée après l’endormissement est en général la principale, ou même la seule, de la journée.'],
        ['In live mice, natural sleep or anesthesia went with about 60\u00a0% more space between brain cells and a faster exchange of fluid, which cleared beta-amyloid faster.','Chez des souris vivantes, le sommeil naturel ou l’anesthésie allaient avec environ 60\u00a0% plus d’espace entre les cellules du cerveau et un échange plus rapide de liquide, qui éliminait la bêta-amyloïde plus vite.'],
        ['In the caffeine review, total sleep fell by 45 minutes and sleep efficiency by 7\u00a0%; falling asleep took 9 minutes longer, time awake after falling asleep rose by 12 minutes, light sleep rose by 6 minutes and deep sleep fell by 11. The authors put the cutoff at 8.8 hours before bed for a coffee of about 107 mg, and 13.2 hours for a typical pre-workout drink of about 218 mg.','Dans la revue sur la caféine, le sommeil total baissait de 45 minutes et l’efficacité du sommeil de 7\u00a0%; s’endormir prenait 9 minutes de plus, le temps éveillé après l’endormissement montait de 12 minutes, le sommeil léger de 6 minutes, et le sommeil profond baissait de 11. Les auteurs plaçaient la limite à 8,8 heures avant le coucher pour un café d’environ 107 mg, et à 13,2 heures pour une boisson pré-entraînement typique d’environ 218 mg.'],
        ['In the alcohol review, most studies found more deep sleep in the first half of the night; at high doses, deep sleep rose over the whole night, and REM fell in the first half. The review covered people without sleep problems.','Dans la revue sur l’alcool, la plupart des études trouvaient plus de sommeil profond dans la première moitié de la nuit; aux fortes doses, le sommeil profond montait sur toute la nuit, et le sommeil paradoxal baissait dans la première moitié. La revue portait sur des personnes sans problème de sommeil.'],
        ['Statistics Canada (2020 data): 3 in 4 adults aged 18 to 64 and 1 in 2 aged 65 and over met the hours in the guideline; on average they slept 7.9 and 8.1 hours. NINDS: most adults need 7 to 9 hours. NHLBI: in sleep apnea, breathing pauses can last from a few seconds to minutes and can happen 30 times or more an hour.','Statistique Canada (données de 2020)\u00a0: 3 adultes sur 4 de 18 à 64 ans et 1 sur 2 de 65 ans et plus atteignaient les heures des directives; en moyenne, ils dormaient 7,9 et 8,1 heures. NINDS\u00a0: la plupart des adultes ont besoin de 7 à 9 heures. NHLBI\u00a0: dans l’apnée du sommeil, les pauses de respiration peuvent durer de quelques secondes à quelques minutes et arriver 30 fois ou plus par heure.']],
  f:[
   [['What brings sleep on','Ce qui amène le sommeil'],['Two forces decide when sleep comes. The pull to sleep builds with every hour awake, carried by a messenger {adenosine} (see Caffeine’s clock). And the body’s 24-hour clock rises and falls on its own, set mostly by light {circadian rhythm}.','Deux forces décident quand le sommeil arrive. Le besoin de dormir grandit à chaque heure d’éveil, porté par un messager {adénosine} (voir L’horloge de la caféine). Et l’horloge de 24 heures du corps monte et descend d’elle-même, réglée surtout par la lumière {rythme circadien}.'],'solid',w=>NIGHT(w,0)],
   [['A night in rounds','Une nuit en tours'],['Sleep is not one even state. Through the night, the brain goes around a loop of stages, about 4 to 6 times, about 90 minutes a round {sleep cycle}.','Le sommeil n’est pas un seul état égal. Pendant la nuit, le cerveau fait le tour d’une boucle d’étapes, environ 4 à 6 fois, à environ 90 minutes par tour {cycle du sommeil}.'],'solid',w=>NIGHT(w,1)],
   [['Light sleep','Le sommeil léger'],['The first stages are light {stages 1 and 2}. Breathing and heartbeat slow, muscles relax, the eyes stop moving, and body temperature drops. Stage 1 lasts a few minutes; stage 2 makes up about 45\u00a0% of the night.','Les premières étapes sont légères {stades 1 et 2}. La respiration et le cœur ralentissent, les muscles se relâchent, les yeux arrêtent de bouger et la température du corps baisse. Le stade 1 dure quelques minutes; le stade 2 fait environ 45\u00a0% de la nuit.'],'solid',w=>NIGHT(w,2)],
   [['Deep sleep','Le sommeil profond'],['In deep sleep {stage 3}, heartbeat and breathing reach their slowest, brain waves grow slower still, and a person is hard to wake. Deep sleep comes in longer stretches in the first half of the night.','Dans le sommeil profond {stade 3}, le cœur et la respiration atteignent leur plus lent, les ondes du cerveau ralentissent encore, et une personne est difficile à réveiller. Le sommeil profond vient en plus longues périodes dans la première moitié de la nuit.'],'solid',w=>NIGHT(w,3)],
   [['Darting eyes','Les yeux qui bougent'],['About 90 minutes in, the eyes start darting behind closed lids {REM sleep}. The brain grows nearly as active as when awake, breathing and heartbeat speed up, and the arm and leg muscles go limp. This stage makes up about a quarter of the night.','Après environ 90 minutes, les yeux se mettent à bouger vite sous les paupières fermées {sommeil paradoxal}. Le cerveau devient presque aussi actif qu’à l’éveil, la respiration et le cœur accélèrent, et les muscles des bras et des jambes se relâchent complètement. Ce stade fait environ le quart de la nuit.'],'solid',w=>NIGHT(w,4)],
   [['The shape of a night','La forme d’une nuit'],['Lined up, the rounds give the night its shape: deep sleep is packed into the first half, and the darting-eye periods grow longer toward morning. So the last hours of a night hold much of that stage.','Mis bout à bout, les tours donnent sa forme à la nuit\u00a0: le sommeil profond se concentre dans la première moitié, et les périodes où les yeux bougent s’allongent vers le matin. Alors les dernières heures de la nuit contiennent une bonne part de ce stade.'],'solid',w=>NIGHT(w,5)],
   [['A burst of growth hormone','Une poussée d’hormone de croissance'],['Shortly after falling asleep, in the first deep sleep, the body sends out a burst of a messenger for growth {growth hormone}. In men it is often the biggest of the day. When sleep moves, the burst moves with it; on a night without sleep, it is small or missing.','Peu après l’endormissement, dans le premier sommeil profond, le corps libère une poussée d’un messager de la croissance {hormone de croissance}. Chez les hommes, c’est souvent la plus grosse de la journée. Quand le sommeil se déplace, la poussée se déplace avec lui; après une nuit sans sommeil, elle est petite ou absente.'],'solid',w=>NIGHT(w,6)],
   [['Rinsing between brain cells','Un rinçage entre les cellules du cerveau'],['In sleeping mice, the space between brain cells grew by about 60\u00a0%, and fluid flowed through faster, carrying out a waste protein {beta-amyloid} faster than when awake. This was measured in mice.','Chez des souris endormies, l’espace entre les cellules du cerveau augmentait d’environ 60\u00a0%, et le liquide circulait plus vite, emportant une protéine de déchet {bêta-amyloïde} plus vite qu’à l’éveil. Ça a été mesuré chez des souris.'],'likely',w=>NIGHT(w,7)],
   [['Caffeine over the night','La caféine sur la nuit'],['In a review of 24 studies, caffeine cut total sleep by about 45 minutes, added 9 minutes to falling asleep and 12 minutes awake in the night, and cut deep sleep by about 11 minutes. The review put the cutoff for a coffee at 8.8 hours before bed.','Dans une revue de 24 études, la caféine enlevait environ 45 minutes de sommeil total, ajoutait 9 minutes pour s’endormir et 12 minutes d’éveil pendant la nuit, et enlevait environ 11 minutes de sommeil profond. La revue plaçait la limite pour un café à 8,8 heures avant le coucher.'],'solid',w=>NIGHT(w,8)],
