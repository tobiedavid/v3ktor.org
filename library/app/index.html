        ['Food Allergy Canada: food intolerances involve the digestive system, with symptoms such as gas, painful cramping or diarrhea; food allergies involve the immune system — an IgE-mediated immune response to a protein in a food — and even a very small amount can bring a potentially life-threatening reaction. NIDDK (gas) lists as reasons to talk with a doctor: gas symptoms that bother a person, change suddenly, or come with abdominal pain, constipation, diarrhea or weight loss. MSD lists as warning signs unintentional weight loss, blood in stool, and chest pain or a bloating feeling in the chest.','Allergies Alimentaires Canada\u00a0: les intolérances alimentaires touchent le système digestif, avec des symptômes comme des gaz, des crampes douloureuses ou de la diarrhée; les allergies alimentaires touchent le système immunitaire — une réponse immunitaire par les IgE à une protéine d’un aliment — et même une très petite quantité peut amener une réaction qui peut mettre la vie en danger. NIDDK (gaz)\u00a0: en parler à un médecin si les gaz dérangent, changent tout d’un coup, ou viennent avec une douleur au ventre, de la constipation, de la diarrhée ou une perte de poids. MSD nomme comme signes d’alerte une perte de poids non voulue, du sang dans les selles, et une douleur ou une sensation de ballonnement dans la poitrine.']],
  f:[
   [['Two ways in','Deux façons d’entrer'],['Gas gets into the gut two ways: air that is swallowed, and gas made by bacteria in the large intestine as they break down carbohydrates the stomach and small intestine didn’t fully digest. More air goes down with gum, fizzy drinks, or eating fast. Gas leaves by burping or by passing gas.','Les gaz entrent dans l’intestin de deux façons\u00a0: l’air avalé, et les gaz fabriqués par les bactéries du gros intestin quand elles défont des glucides que l’estomac et l’intestin grêle n’ont pas digérés au complet. Plus d’air descend avec la gomme, les boissons gazeuses, ou en mangeant vite. Les gaz sortent par les rots ou par l’anus.'],'solid',w=>GAS(w,0)],
   [['What is usual','Ce qui est habituel'],['People typically burp up to 30 times a day. Studies suggest people pass gas 8 to 14 times a day on average, and experts consider up to 25 times a day usual.','Les gens rotent d’habitude jusqu’à 30 fois par jour. Selon des études, ils évacuent des gaz de 8 à 14 fois par jour en moyenne, et les experts considèrent jusqu’à 25 fois par jour comme habituel.'],'solid',w=>GAS(w,1)],
   [['What the bacteria get','Ce que reçoivent les bactéries'],['What the small intestine doesn’t take in reaches the bacteria: fibre such as in beans and cabbage, milk sugar when the enzyme that splits it runs short (see The bucket), fruit sugar {fructose} in some people, and sweeteners ending in “-ol”.','Ce que l’intestin grêle n’absorbe pas arrive aux bactéries\u00a0: des fibres comme dans les fèves et le chou, le sucre du lait quand l’enzyme qui le coupe manque (voir Le seau), le sucre des fruits {fructose} chez certaines personnes, et les édulcorants qui finissent en «\u00a0-ol\u00a0».'],'solid',w=>GAS(w,2)],
   [['What gas is made of','De quoi sont faits les gaz'],['Gas is swallowed air plus gases the bacteria make: hydrogen, carbon dioxide and methane. Its smell, when there is one, may come from sulfur. A day’s worth is about half a litre to a litre and a half, and it varies a lot between people.','Les gaz, c’est de l’air avalé et des gaz que fabriquent les bactéries\u00a0: de l’hydrogène, du gaz carbonique et du méthane. Leur odeur, quand il y en a une, peut venir du soufre. Une journée en compte environ un demi-litre à un litre et demi, et ça varie beaucoup d’une personne à l’autre.'],'solid',w=>GAS(w,3)],
   [['Same gas, different feeling','Mêmes gaz, autre sensation'],['Most people who feel bloated do not actually have extra gas. Some guts are more sensitive: people with irritable bowel syndrome are particularly sensitive to normal amounts of gas, and some feel pain when a normal amount of gas or stool is in the gut.','La plupart des personnes qui se sentent ballonnées n’ont pas vraiment plus de gaz. Certains intestins sont plus sensibles\u00a0: les personnes avec le syndrome de l’intestin irritable sont particulièrement sensibles aux quantités normales de gaz, et certaines ont mal avec une quantité normale de gaz ou de selles dans l’intestin.'],'solid',w=>GAS(w,4)],
   [['A family of sugars that ferment','Une famille de sucres qui fermentent'],['Some short carbohydrates that reach the bacteria and ferment are grouped under one name {FODMAP}: onion and garlic, milk sugar, the extra fruit sugar in honey, and sugar-free sweets are examples.','Certains glucides courts qui arrivent aux bactéries et fermentent sont regroupés sous un même nom {FODMAP}\u00a0: l’oignon et l’ail, le sucre du lait, le surplus de sucre de fruits dans le miel, et les bonbons sans sucre en sont des exemples.'],'solid',w=>GAS(w,5)],
   [['A test in three steps','Un test en trois étapes'],['For irritable bowel syndrome, the American College of Gastroenterology recommends a limited trial of a low-FODMAP diet, with a trained dietitian, and rates its evidence very low. Monash University’s version has three steps: swap high-FODMAP foods for 2 to 6 weeks, bring groups back one at a time, then keep what is tolerated.','Pour le syndrome de l’intestin irritable, l’American College of Gastroenterology recommande un essai limité d’une diète faible en FODMAP, avec une diététiste formée, et juge ses données de très faible qualité. La version de l’Université Monash a trois étapes\u00a0: remplacer les aliments riches en FODMAP pendant 2 à 6 semaines, réintroduire les groupes un à la fois, puis garder ce qui est toléré.'],'likely',w=>GAS(w,6)],
   [['Intolerance or allergy','Intolérance ou allergie'],['An intolerance involves the digestive system: gas, cramps, diarrhea. An allergy involves the immune system, which reacts to a protein in a food {IgE}; Food Allergy Canada says even a very small amount can bring a potentially life-threatening reaction (see The bucket).','Une intolérance touche le système digestif\u00a0: gaz, crampes, diarrhée. Une allergie touche le système immunitaire, qui réagit à une protéine d’un aliment {IgE}; Allergies Alimentaires Canada dit que même une très petite quantité peut amener une réaction qui peut mettre la vie en danger (voir Le seau).'],'solid',w=>GAS(w,7)],
   [['When gas isn’t just gas','Quand ce n’est pas que des gaz'],['NIDDK lists reasons to talk with a doctor: gas that bothers a person, changes suddenly, or comes with belly pain, constipation, diarrhea or weight loss. The MSD Manual lists as warning signs weight loss without trying, blood in the stool, and chest pain or a bloated feeling in the chest.','NIDDK nomme des raisons d’en parler à un médecin\u00a0: des gaz qui dérangent, qui changent tout d’un coup, ou qui viennent avec une douleur au ventre, de la constipation, de la diarrhée ou une perte de poids. Le Manuel MSD nomme comme signes d’alerte une perte de poids sans la chercher, du sang dans les selles, et une douleur ou une sensation de ballonnement dans la poitrine.'],'solid',w=>GAS(w,8)]
  ]},
{ id:'water-salt', sec:'energy', t:['Water and salt','L’eau et le sel'], d:['Where the body keeps its water, how salt moves it, and what tips the balance.','Où le corps garde son eau, comment le sel la déplace, et ce qui fait pencher la balance.'],
  src:['spBodyFluids','spWaterBal','spNaK','alberts02','bionumNaK','hawaiiWater','iomWater','nasemWater','spVaso','spOsmo','noap16','killer14','polhuis17','taivainen95','armstrong12','ganio11','hcSodium17','he13','cnsSodium19','almond05','medlineHypoNa'],
  more:[['StatPearls (Body Fluids): people are about 75 % water by mass as infants and 50 to 60 % as adults. StatPearls (Water Balance) works through a 70 kg man: 60 % of body weight is water, 42 L; two thirds (28 L) is inside cells; one third (14 L) is outside them, of which 75 % (10.5 L) sits between cells and 25 % (3.5 L) is blood plasma. Fluid outside cells is high in sodium, chloride and bicarbonate; fluid inside cells is high in potassium, magnesium and phosphate. These minerals carry an electric charge and are called electrolytes. When the fluid outside a cell becomes more concentrated, water flows out of the cell and the cell shrinks.','StatPearls (liquides du corps)\u00a0: les humains sont faits d’environ 75\u00a0% d’eau en masse chez le bébé et de 50 à 60\u00a0% chez l’adulte. StatPearls (équilibre de l’eau) prend l’exemple d’un homme de 70\u00a0kg\u00a0: 60\u00a0% du poids du corps est de l’eau, soit 42\u00a0L; les deux tiers (28\u00a0L) sont dans les cellules; le tiers (14\u00a0L) est à l’extérieur, dont 75\u00a0% (10,5\u00a0L) entre les cellules et 25\u00a0% (3,5\u00a0L) dans le plasma du sang. Le liquide hors des cellules est riche en sodium, en chlorure et en bicarbonate; le liquide dans les cellules est riche en potassium, en magnésium et en phosphate. Ces minéraux portent une charge électrique et s’appellent des électrolytes. Quand le liquide autour d’une cellule devient plus concentré, l’eau sort de la cellule et elle rapetisse.'],
        ['StatPearls (Sodium Potassium Pump): the pump moves 3 sodium out of the cell and 2 potassium in for each ATP it spends. Alberts’ Molecular Biology of the Cell (2002): almost one third of the energy a typical animal cell needs goes to fuelling this pump, and in nerve cells, which keep gaining a little sodium and losing a little potassium as they fire, close to two thirds. BioNumbers lists 20 to 45 % for resting tissues, and StatPearls says up to three quarters of the energy used in the brain’s grey matter. The share is hard to measure, so picture 3 is graded likely. Picture 2 shows only which side holds more of each mineral; it is not to scale.','StatPearls (pompe sodium-potassium)\u00a0: la pompe fait sortir 3 sodiums de la cellule et entrer 2 potassiums pour chaque ATP qu’elle dépense. Molecular Biology of the Cell d’Alberts (2002)\u00a0: presque le tiers de l’énergie dont une cellule animale typique a besoin sert à alimenter cette pompe, et près des deux tiers dans les cellules nerveuses, qui gagnent un peu de sodium et perdent un peu de potassium chaque fois qu’elles transmettent un signal. BioNumbers donne 20 à 45\u00a0% pour les tissus au repos, et StatPearls dit jusqu’aux trois quarts de l’énergie utilisée dans la matière grise du cerveau. Cette part est difficile à mesurer, donc l’image 3 est notée probable. L’image 2 montre seulement de quel côté il y a le plus de chaque minéral; elle n’est pas à l’échelle.'],
        ['The University of Hawaiʻi’s Human Nutrition textbook gives a typical day: in, 1.5 L from fluids, 0.7 L from solid food and 0.3 L made by the body’s own chemistry; out, 1.5 L of urine, 0.5 L through the skin, 0.4 L in breath and 0.1 L in stool. The Institute of Medicine (2005), whose reference intakes are used in both the United States and Canada, set adequate intakes of total water, drinks and food together, at 3.7 L a day for men and 2.7 L for women; about 80 % came from drinks, those with caffeine included, and 20 % from food. Its panel said that, day to day, thirst and drinking with meals cover the average person, and that very active people and people in hot climates may need more. StatPearls (Vasopressin): the water-holding messenger is made in the hypothalamus and released from the back of the pituitary when blood volume is low or blood sodium is high; in the kidney, it lets water be taken back, which makes urine more concentrated. StatPearls (Osmoreceptors): sensors in the front of the hypothalamus read how concentrated the blood is, and its volume and pressure, to control thirst.','Le manuel Human Nutrition de l’Université d’Hawaï donne une journée typique\u00a0: entrée, 1,5\u00a0L de liquides, 0,7\u00a0L d’aliments solides et 0,3\u00a0L fabriqués par la chimie du corps; sortie, 1,5\u00a0L d’urine, 0,5\u00a0L par la peau, 0,4\u00a0L dans le souffle et 0,1\u00a0L dans les selles. L’Institute of Medicine (2005), dont les apports de référence servent aux États-Unis et au Canada, a fixé l’apport suffisant en eau totale, boissons et aliments ensemble, à 3,7\u00a0L par jour pour les hommes et 2,7\u00a0L pour les femmes; environ 80\u00a0% venaient des boissons, y compris celles qui contiennent de la caféine, et 20\u00a0% des aliments. Son comité a dit qu’au jour le jour, la soif et les boissons prises aux repas suffisent pour la personne moyenne, et que les personnes très actives et celles qui vivent dans un climat chaud peuvent avoir besoin de plus. StatPearls (vasopressine)\u00a0: le messager qui retient l’eau est fabriqué dans l’hypothalamus et libéré par l’arrière de l’hypophyse quand le volume de sang est bas ou que le sodium du sang est élevé; dans le rein, il permet de reprendre l’eau, ce qui rend l’urine plus concentrée. StatPearls (osmorécepteurs)\u00a0: des capteurs à l’avant de l’hypothalamus lisent la concentration du sang, son volume et sa pression pour régler la soif.'],
        ['Dietitians of Canada, the Academy of Nutrition and Dietetics and the American College of Sports Medicine (2016): sweat rates during exercise vary from 0.3 to 2.4 L an hour, with intensity, duration, fitness, heat acclimatization, altitude and weather; sodium in sweat is highly variable and averages about 50 mmol/L (about 1 g/L). A fluid loss of more than 2 % of body weight can compromise thinking and endurance exercise, particularly in hot weather. Killer 2014: 50 men who drank 3 to 6 cups of coffee a day had 4 × 200 mL of coffee (4 mg of caffeine per kg) or the same amount of water, for 3 days each; total body water, urine and blood markers did not differ. It was funded by the Institute for Scientific Information on Coffee, an industry group. Polhuis 2017: 19 Dutch men aged 60 to 75 had 30 g of alcohol as beer, wine or spirits, or the same volume without alcohol; in the first 4 hours, wine gave 536 mL of urine against 504, spirits 471 against 450 for water, and beer 829 against 836; none differed at 24 hours. Three authors worked for the Dutch Beer Institute, which helped fund it. The usual explanation is that alcohol holds back the water-holding messenger, but studies that measured the messenger during the extra urine found no difference (Taivainen 1995; Polhuis 2017), so the reason is still open.','Les diététistes du Canada, l’Academy of Nutrition and Dietetics et l’American College of Sports Medicine (2016)\u00a0: pendant l’effort, la sueur varie de 0,3 à 2,4\u00a0L à l’heure, selon l’intensité, la durée, la forme physique, l’acclimatation à la chaleur, l’altitude et la météo; le sodium dans la sueur varie beaucoup et tourne autour de 50\u00a0mmol/L en moyenne (environ 1\u00a0g/L). Une perte de liquide de plus de 2\u00a0% du poids du corps peut nuire à la réflexion et à l’effort d’endurance, surtout par temps chaud. Killer 2014\u00a0: 50 hommes qui buvaient de 3 à 6 tasses de café par jour ont pris 4 × 200\u00a0mL de café (4\u00a0mg de caféine par kg) ou la même quantité d’eau, pendant 3 jours chaque fois; l’eau totale du corps, l’urine et les marqueurs sanguins n’ont pas différé. L’étude a été financée par l’Institut d’information scientifique sur le café (ISIC), un groupe de l’industrie. Polhuis 2017\u00a0: 19 hommes néerlandais de 60 à 75 ans ont pris 30\u00a0g d’alcool en bière, en vin ou en spiritueux, ou le même volume sans alcool; dans les 4 premières heures, le vin a donné 536\u00a0mL d’urine contre 504, les spiritueux 471 contre 450 pour l’eau, et la bière 829 contre 836; aucun n’a différé à 24 heures. Trois auteurs travaillaient pour le Dutch Beer Institute, qui a aidé à la financer. L’explication habituelle est que l’alcool freine le messager qui retient l’eau, mais les études qui ont mesuré ce messager pendant l’urine en plus n’ont pas trouvé de différence (Taivainen 1995; Polhuis 2017)\u00a0: la raison reste ouverte.'],
        ['Armstrong 2012: 25 women, average age 23, lost 1.36 % of body weight in the lab through exercise; mood was worse, tasks felt harder, concentration was lower and headaches were more frequent, while most measures of thinking did not change. Ganio 2011: 26 men, average age 20, lost 1.59 %; errors rose on a vigilance task, working memory slowed, and fatigue and tension rose. Both were supported by Danone Research and Danone Waters. Health Canada (Sodium intake of Canadians in 2017, published 2018) recommends that most Canadians consume 1,500 mg of sodium a day and not exceed 2,300 mg, just over a teaspoon of salt; the average is 2,760 mg; 77 % comes from commercially processed and prepared foods, led by bakery products (about 20 %), mixed dishes (19 %) and processed meats (11 %). He 2013 (34 trials, 3,230 people, 4 weeks or longer): cutting salt by 4.4 g a day (75 mmol of sodium, about 1,700 mg) lowered the top blood pressure number by 4.18 mmHg on average, 5.39 in people with high blood pressure and 2.42 in people without, and a 6 g cut went with 5.8 mmHg. These trials measured blood pressure, not heart attacks or strokes. How to read the evidence on sodium and disease is still debated among Canadian researchers (Canadian Nutrition Society, 2019).','Armstrong 2012\u00a0: 25 femmes, 23 ans en moyenne, ont perdu 1,36\u00a0% de leur poids en laboratoire par l’effort; l’humeur était plus basse, les tâches semblaient plus difficiles, la concentration était plus faible et les maux de tête plus fréquents, alors que la plupart des mesures de réflexion n’ont pas changé. Ganio 2011\u00a0: 26 hommes, 20 ans en moyenne, ont perdu 1,59\u00a0%; les erreurs ont augmenté à une tâche de vigilance, la mémoire de travail a ralenti, et la fatigue et la tension ont augmenté. Les deux études ont été soutenues par Danone Research et Danone Waters. Santé Canada (L’apport en sodium des Canadiens en 2017, publié en 2018) recommande à la plupart des Canadiens de consommer 1\u00a0500\u00a0mg de sodium par jour et de ne pas dépasser 2\u00a0300\u00a0mg, un peu plus d’une cuillère à thé de sel; la moyenne est de 2\u00a0760\u00a0mg; 77\u00a0% vient d’aliments transformés et préparés commercialement, en tête les produits de boulangerie (environ 20\u00a0%), les plats composés (19\u00a0%) et les viandes transformées (11\u00a0%). He 2013 (34 essais, 3\u00a0230 personnes, 4 semaines ou plus)\u00a0: couper le sel de 4,4\u00a0g par jour (75\u00a0mmol de sodium, environ 1\u00a0700\u00a0mg) a baissé le chiffre du haut de la pression de 4,18\u00a0mmHg en moyenne, de 5,39 chez les personnes qui font de l’hypertension et de 2,42 chez les autres, et une coupe de 6\u00a0g allait avec 5,8\u00a0mmHg. Ces essais ont mesuré la pression, pas les crises cardiaques ni les AVC. La façon de lire les données sur le sodium et les maladies est encore débattue par des chercheurs canadiens (Société canadienne de nutrition, 2019).'],
        ['Almond 2005: of 488 runners of the 2002 Boston Marathon who gave a blood sample at the finish, 13 % had low blood sodium (135 mmol/L or less) and 0.6 % had a critical level (120 or less). Weight gained during the race, a time over 4 hours and a very low or very high body-mass index were linked to it; sex and the kind of fluid, water or sports drink, were not. The 2016 sports nutrition paper names drinking beyond sweat and urine losses as the main cause in sport. MedlinePlus (reviewed May 2025): normal blood sodium is 136 to 144 mmol/L; when sodium in the fluid outside cells drops below normal, water moves into the cells, and brain cells are especially sensitive to swelling. It lists symptoms such as confusion, headache, nausea, fatigue, muscle cramps and seizures, says a drop in less than 48 hours is more dangerous than a slow one, and names other causes, among them heavy sweating, vomiting, diarrhea, and heart, kidney and liver disease. It says that when the sodium level drops too much, it can be a life-threatening emergency.','Almond 2005\u00a0: sur 488 coureurs du marathon de Boston 2002 qui ont donné un échantillon de sang à l’arrivée, 13\u00a0% avaient un sodium sanguin bas (135\u00a0mmol/L ou moins) et 0,6\u00a0% un niveau critique (120 ou moins). Le poids pris pendant la course, un temps de plus de 4 heures et un indice de masse corporelle très bas ou très élevé y étaient liés; le sexe et le type de liquide, eau ou boisson pour sportifs, non. L’article de 2016 sur la nutrition sportive nomme le fait de boire plus que les pertes par la sueur et l’urine comme la cause principale dans le sport. MedlinePlus (révisé en mai 2025)\u00a0: le sodium normal dans le sang est de 136 à 144\u00a0mmol/L; quand le sodium du liquide hors des cellules baisse sous la normale, l’eau entre dans les cellules, et les cellules du cerveau sont particulièrement sensibles à l’enflure. Il nomme des symptômes comme la confusion, les maux de tête, les nausées, la fatigue, les crampes musculaires et les convulsions, dit qu’une baisse en moins de 48 heures est plus dangereuse qu’une baisse lente, et nomme d’autres causes, dont la forte transpiration, les vomissements, la diarrhée, et les maladies du cœur, des reins et du foie. Il dit que quand le sodium baisse trop, ça peut être une urgence qui met la vie en danger.']],
  f:[
   [['Mostly water','Surtout de l’eau'],['A body feels solid, yet an adult is 50 to 60 % water by weight. In a 70 kg man, that is about 42 litres: 28 inside the cells {intracellular fluid}, about 10½ in the spaces between cells {interstitial fluid}, and about 3½ in the blood {plasma}.','Un corps paraît solide, et pourtant un adulte est fait de 50 à 60\u00a0% d’eau, en poids. Chez un homme de 70\u00a0kg, ça fait environ 42 litres\u00a0: 28 dans les cellules {liquide intracellulaire}, environ 10,5 dans les espaces entre les cellules {liquide interstitiel} et environ 3,5 dans le sang {plasma}.'],'solid',w=>WATER(w,0)],
   [['Sodium outside, potassium inside','Le sodium dehors, le potassium dedans'],['Outside the cells, the water carries mostly sodium {Na}, the sodium in table salt. Inside, it carries mostly potassium {K}. A machine in the cell wall {sodium-potassium pump} keeps them apart: each turn spends one battery {ATP}, pushes 3 sodium out and brings 2 potassium in.','Hors des cellules, l’eau transporte surtout du sodium {Na}, celui du sel de table. Dedans, elle transporte surtout du potassium {K}. Une machine dans la paroi de la cellule {pompe sodium-potassium} les garde séparés\u00a0: chaque tour dépense une pile {ATP}, pousse 3 sodiums dehors et fait entrer 2 potassiums.'],'solid',w=>WATER(w,1)],
   [['The pump’s bill','La facture de la pompe'],['Running that pump is one of a cell’s biggest costs. A standard cell biology textbook puts it at almost a third of a typical cell’s energy, and close to two thirds in nerve cells. Measurements vary, from about 20 to 45 % in resting tissues.','Faire tourner cette pompe est une des plus grosses dépenses d’une cellule. Un manuel de biologie cellulaire de référence l’estime à presque le tiers de l’énergie d’une cellule typique, et près des deux tiers dans les cellules nerveuses. Les mesures varient, d’environ 20 à 45\u00a0% dans les tissus au repos.'],'likely',w=>WATER(w,2)],
   [['Water follows salt','L’eau suit le sel'],['Water crosses the cell wall toward the side with more dissolved in it {osmosis}. When the fluid around a cell gets saltier, water leaves the cell and it shrinks. When the fluid gets more watery, water moves in and the cell swells.','L’eau traverse la paroi de la cellule vers le côté où il y a plus de choses dissoutes {osmose}. Quand le liquide autour d’une cellule devient plus salé, l’eau sort et la cellule rapetisse. Quand le liquide devient plus dilué, l’eau entre et la cellule gonfle.'],'solid',w=>WATER(w,3)],
   [['A day’s water','L’eau d’une journée'],['On a typical day, about 2.5 litres go in and 2.5 come out. In: about 1.5 from drinks, 0.7 from food, and 0.3 that the body makes as it burns fuel {metabolic water}. Out: about 1.5 as urine, 0.9 through skin and breath, and 0.1 in stool.','Dans une journée typique, environ 2,5 litres entrent et 2,5 sortent. Entrée\u00a0: environ 1,5 des boissons, 0,7 des aliments et 0,3 que le corps fabrique en brûlant son carburant {eau métabolique}. Sortie\u00a0: environ 1,5 en urine, 0,9 par la peau et le souffle, et 0,1 dans les selles.'],'solid',w=>WATER(w,4)],
   [['Thirst and the kidneys’ tap','La soif et le robinet des reins'],['When the blood gets a little saltier, or there is less of it, sensors in the brain’s control centre {hypothalamus} notice. They bring on thirst, and a water-holding messenger {vasopressin} goes from the gland under the brain {pituitary} to the kidneys, which keep more water and make less urine, more concentrated.','Quand le sang devient un peu plus salé, ou qu’il y en a moins, des capteurs du centre de contrôle du cerveau {hypothalamus} le remarquent. Ils amènent la soif, et un messager qui retient l’eau {vasopressine} part de la glande sous le cerveau {hypophyse} vers les reins, qui gardent plus d’eau et font moins d’urine, plus concentrée.'],'solid',w=>WATER(w,5)],
   [['Sweat','La sueur'],['Sweat takes water and salt out of the body. During exercise, it runs from 0.3 to 2.4 litres an hour, depending on effort, heat, fitness and the person. A litre of sweat holds about 1 g of sodium on average, and that varies a lot between people.','La sueur fait sortir de l’eau et du sel du corps. Pendant l’effort, elle va de 0,3 à 2,4 litres à l’heure, selon l’intensité, la chaleur, la forme physique et la personne. Un litre de sueur contient environ 1\u00a0g de sodium en moyenne, et ça varie beaucoup d’une personne à l’autre.'],'solid',w=>WATER(w,6)],
   [['Coffee and alcohol','Le café et l’alcool'],['In 50 men used to coffee, 4 cups a day for 3 days kept as much water in the body as the same amount of plain water. In 19 older men, wine and spirits made a little more urine over 4 hours than the same drinks without alcohol; beer did not, and after 24 hours none differed.','Chez 50 hommes habitués au café, 4 tasses par jour pendant 3 jours ont gardé autant d’eau dans le corps que la même quantité d’eau. Chez 19 hommes plus âgés, le vin et les spiritueux ont fait un peu plus d’urine sur 4 heures que les mêmes boissons sans alcool; la bière, non, et après 24 heures, aucune différence.'],'likely',w=>WATER(w,7)],
   [['A little dry','Un peu à sec'],['In two lab studies, losing about 1.5 % of body weight as water {mild dehydration} changed how people felt. Young women had a lower mood, more headaches and less concentration, and found tasks harder; young men had more fatigue and tension, and more errors on some tasks. Most thinking tests did not change.','Dans deux études en laboratoire, perdre environ 1,5\u00a0% du poids du corps en eau {déshydratation légère} a changé comment les gens se sentaient. Des jeunes femmes avaient l’humeur plus basse, plus de maux de tête et moins de concentration, et trouvaient les tâches plus difficiles; des jeunes hommes avaient plus de fatigue et de tension, et plus d’erreurs à certaines tâches. La plupart des tests de réflexion n’ont pas changé.'],'likely',w=>WATER(w,8)],
   [['Salt and blood pressure','Le sel et la pression'],['Health Canada recommends 1,500 mg of sodium a day and no more than 2,300; Canadians average 2,760. In trials that cut salt by about 4.4 g a day for 4 weeks or more, the top blood pressure number {systolic} fell by about 4 points on average: 5 in people with high blood pressure, 2 in people without.','Santé Canada recommande 1\u00a0500\u00a0mg de sodium par jour et pas plus de 2\u00a0300; les Canadiens en prennent 2\u00a0760 en moyenne. Dans les essais qui ont coupé le sel d’environ 4,4\u00a0g par jour pendant 4 semaines ou plus, le chiffre du haut de la pression {systolique} a baissé d’environ 4 points en moyenne\u00a0: 5 chez les personnes qui font de l’hypertension, 2 chez les autres.'],'solid',w=>WATER(w,9)],

   no figure) and picture 7's curve is a sketch. Picture 8 is to scale at 30 px per day (Juliano & Griffiths 2004); picture 9 at

  document.getElementById('topbar').innerHTML=`<div class="in"><button type="button" class="tb" id="menuBtn" data-act="menu" aria-haspopup="dialog" aria-label="Menu"><span aria-hidden="true">☰</span></button><button type="button" class="tb ttl" data-act="home">${L('The Library','La Bibliothèque')}</button><span class="sp"></span><span class="lang"><button type="button" data-act="lang" data-v="fr" aria-pressed="${S.lang==='fr'}">FR</button><button type="button" data-act="lang" data-v="en" aria-pressed="${S.lang==='en'}">EN</button></span></div>`; }
function render(){ save(); renderTop(); const door=!S.ack;
  app.innerHTML=(STORE==='ok'?'':`<div class="card" style="border-color:var(--warn)"><p class="small" style="margin:0">${L('<b>Not saved.</b> This browser is blocking storage (private mode?). The cards still work.','<b>Pas enregistré.</b> Ce navigateur bloque la mémoire (mode privé?). Les cartes fonctionnent quand même.')}</p></div>`)
    +(door?vDoor():V.v==='card'?vCard():V.v==='sec'?vSec():vHome());
  renderBar(door?null:V); { const pill=document.getElementById('installPill'); if(pill) pill.innerHTML=pillHTML(); } window.scrollTo(0,0); }

/* ---------- the door ---------- */
const AGREE=()=>[L('I am 18 or older.','J’ai 18 ans ou plus.'),
  L('This is education about how bodies work. It isn’t medical, dietitian or pharmacist advice.','C’est de l’éducation sur le fonctionnement du corps. Ce n’est pas un avis médical, de diététiste ou de pharmacien.'),
  L('It describes bodies in general, not mine. If something worries me, I get care.','Elle décrit les corps en général, pas le mien. Si quelque chose m’inquiète, je vais chercher des soins.'),
  L('I won’t change a medicine, a dose or a diet that a doctor or dietitian gave me because of something I read here.','Je ne changerai pas un médicament, une dose ou un régime donné par un médecin ou une diététiste à cause de quelque chose que j’ai lu ici.'),
  L('I don’t have an eating disorder and I’m not recovering from one.','Je n’ai pas de trouble alimentaire et je ne suis pas en rétablissement d’un trouble alimentaire.')];
function instBig(){ if(FRAMED||STANDALONE) return ''; try{ if(localStorage.getItem(KEY+'.noinst')) return ''; }catch(e){ return ''; }
  return `<div class="instbig inst" style="margin:14px 0"><button type="button" data-act="install">↓ ${L('Install the Library','Installer la Bibliothèque')}</button><p style="margin:6px 0 0;text-align:center;font-size:.85rem;opacity:.72">${L('Home-screen icon · full screen · works offline','Icône d’accueil · plein écran · fonctionne hors ligne')}</p><p style="margin:0;text-align:center"><button type="button" class="lnk" data-act="instno">${L('Not now','Pas maintenant')}</button></p></div>`; }
function vDoor(){ return `<p class="tagline">${L('How the body works, one picture at a time.','Comment le corps fonctionne, une image à la fois.')}</p>
  <p>${L('Each card follows one idea in pictures and plain words, with the specialist’s term beside it. Every picture says how sure the science is, and every card where it comes from.','Chaque carte suit une idée en images et en mots simples, avec le terme du spécialiste à côté. Chaque image dit à quel point la science est sûre, et chaque carte d’où elle vient.')}</p>
  <p class="small muted">${L('The cards describe how bodies work in general. They don’t say what is happening in yours. The other V3KTOR apps measure that: <a href="https://v3ktor.org/">v3ktor.org</a>.','Les cartes décrivent comment les corps fonctionnent en général. Elles ne disent pas ce qui se passe dans le tien. Les autres apps V3KTOR mesurent ça\u00a0: <a href="https://v3ktor.org/">v3ktor.org</a>.')}</p>
  <div class="card gate"><p class="small" style="margin:0 0 6px"><b>${L('Tapping “Enter” means I agree:','Appuyer sur «\u00a0Entrer\u00a0» signifie que j’accepte\u00a0:')}</b></p><ol class="small" style="margin:0;padding-left:1.3em">${AGREE().map(l=>`<li>${l}</li>`).join('')}</ol>
  <button type="button" class="btn primary" style="width:100%;margin-top:12px" data-act="enter">${L('Enter','Entrer')}</button></div>
  ${instBig()}<p class="small muted" style="margin-top:16px">${L('Everything stays on this phone. No account, no tracking.','Tout reste sur ce téléphone. Pas de compte, pas de suivi.')} v${VER} · <button type="button" class="lnk" data-act="about">${L('About and privacy','À propos et confidentialité')}</button></p>`; }

/* ---------- home: a meal's path through the body, six stops ---------- */
const STOPS=[[70,46],[300,78],[80,126],[300,164],[80,206],[300,246]];
function homePic(){ const d='M70 46 C190 40 290 50 300 78 S80 100 80 126 S300 140 300 164 S80 180 80 206 S300 220 300 246';
  let s=`<path class="road" d="${d}"/>`;
  SECTIONS.forEach((sec,i)=>{ const [x,y]=STOPS[i], open=CARDS.some(c=>c.sec===sec.id), right=x<190;
    s+=`<g class="stop" role="button" tabindex="0" data-act="sec" data-v="${sec.id}" aria-label="${esc(sec.n+'. '+P(sec.t))}"><rect x="${right?x-20:x-116}" y="${y-16}" width="136" height="32" fill="transparent"/><circle cx="${x}" cy="${y}" r="17" style="fill:${open?'var(--accent)':'var(--card)'};stroke:${open?'var(--accent)':'var(--muted)'}" stroke-width="2"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-weight="800" font-size="15" style="fill:${open?'#fff':'var(--muted)'}" font-family="system-ui,sans-serif">${sec.n}</text>${tx(right?x+26:x-26,y,P(sec.t),right?'start':'end',open?'lbi':'lb')}</g>`; });
  return `<svg class="pic" viewBox="0 0 380 266" role="img" aria-label="${esc(L('A meal’s path through the body, six stops','Le chemin d’un repas dans le corps, six arrêts'))}">${s}</svg>`; }
function vHome(){ const done=CARDS.filter(c=>S.seen[c.id]).length;
  return `<p class="tagline">${L('Follow a meal through the body: six stops.','Suis un repas dans le corps\u00a0: six arrêts.')}</p>
  ${homePic()}
  <div style="margin-top:10px">${SECTIONS.map(sec=>{ const n=CARDS.filter(c=>c.sec===sec.id).length;
    return `<button type="button" class="cardrow${n?'':' soon'}" data-act="sec" data-v="${sec.id}"><b>${sec.n}. ${esc(P(sec.t))}</b><span class="n">${n?(n===1?L('1 card','1 carte'):L(`${n} cards`,`${n} cartes`)):L('soon','bientôt')}</span><small>${esc(P(sec.d))}</small></button>`; }).join('')}</div>
  <p class="mine">${done?L(`${done} of ${CARDS.length} cards read to the end.`,`${done} carte${done>1?'s':''} sur ${CARDS.length} lue${done>1?'s':''} jusqu’au bout.`):L('One picture at a time. Tap Next when it’s clear.','Une image à la fois. Appuie sur Suivant quand c’est clair.')}</p>`; }

/* ---------- a section: its cards ---------- */
function vSec(){ const sec=secById(V.id), list=CARDS.filter(c=>c.sec===sec.id);
  return `<div class="eyebrow">${L('Stop','Arrêt')} ${sec.n}</div><h2>${esc(P(sec.t))}</h2><p class="muted">${esc(P(sec.d))}</p>
  ${list.length?list.map(c=>`<button type="button" class="cardrow" data-act="card" data-v="${c.id}"><b>${esc(P(c.t))}</b><span class="n">${S.seen[c.id]?'✓ ':''}${L(`${c.f.length} pictures`,`${c.f.length} images`)}</span><small>${esc(P(c.d))}</small></button>`).join('')
    :`<div class="card soft"><p class="small" style="margin:0">${L('Being written. Energy comes first, because the energy app will link to it.','En cours d’écriture. L’énergie vient en premier, parce que l’app sur l’énergie va y renvoyer.')}</p></div>`}
  <p style="margin-top:14px"><button type="button" class="lnk" data-act="home">← ${L('All six stops','Les six arrêts')}</button></p>`; }

/* ---------- a card: one picture at a time ---------- */
function vCard(){ const c=cardById(V.id), sec=secById(c.sec), n=c.f.length, i=Math.min(V.i,n-1), [ft,fc,g,draw]=c.f[i];
  return `<div class="eyebrow"><button type="button" class="lnk" style="font-size:inherit;text-transform:inherit;letter-spacing:inherit;color:var(--muted);min-height:0;padding:0" data-act="sec" data-v="${sec.id}">${esc(P(sec.t))}</button></div>
  <h2>${esc(P(c.t))}</h2>
  <div class="ftitle"><h3 id="ftitle">${esc(P(ft))}</h3><span class="small muted">${i+1}\u00a0/\u00a0${n}</span></div>
  <div id="pic">${svg(draw((en,fr)=>S.lang==='fr'?fr:en),P(ft)+'. '+plain(P(fc)))}</div>
  <p class="cap" aria-live="polite">${rich(P(fc))}</p>
  <p class="grade">${L('How sure:','Degré de certitude\u00a0:')} ${P(GRADE[g])}</p>
  <div class="dots" aria-hidden="true">${c.f.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join('')}</div>
  <p style="text-align:center;margin:8px 0 0"><button type="button" class="lnk" data-act="more">${L('The precise version and the sources','La version précise et les sources')}</button></p>
  ${c.drug?`<p class="mine">${P(RX)}</p>`:''}`; }
function renderBar(v){ if(!v||v.v!=='card'){ bar.innerHTML=''; bar.classList.add('hidden'); return; }
  const c=cardById(v.id), n=c.f.length, last=v.i>=n-1; bar.classList.remove('hidden');
  bar.innerHTML=`<div class="in"><button type="button" class="btn ghost sm${v.i?'':' hide'}" data-act="prev" ${v.i?'':'tabindex="-1" aria-hidden="true"'}>← ${L('Back','Retour')}</button><span class="small muted">${L('Picture','Image')} ${v.i+1}\u00a0/\u00a0${n}</span><button type="button" class="btn primary sm" data-act="next">${last?L('Done','Terminé')+' ✓':L('Next','Suivant')+' →'}</button></div>`; }
function step(d){ if(V.v!=='card') return; const c=cardById(V.id), n=c.f.length;
  if(d>0&&V.i>=n-1){ S.seen[c.id]=true; go({v:'sec',id:c.sec}); toast(L('Read to the end','Lue jusqu’au bout')); return; }
  V.i=Math.max(0,Math.min(n-1,V.i+d)); render(); }

/* ---------- sheets ---------- */
const sheet=document.getElementById('sheet'), sheetBg=document.getElementById('sheetBg'); let sheetOpener=null;
function showSheet(html){ if(!sheet.classList.contains('on')) sheetOpener=document.activeElement;
  sheet.innerHTML='<div class="handle"></div>'+html+`<div class="row" style="margin-top:12px"><button type="button" class="btn ghost sm" data-act="close">${L('Close','Fermer')}</button></div>`;
  sheet.classList.add('on'); sheetBg.classList.add('on'); sheet.setAttribute('aria-hidden','false'); document.documentElement.classList.add('locked'); sheet.scrollTop=0; try{ sheet.focus({preventScroll:true}); }catch(e){} }
function closeSheet(){ if(!sheet.classList.contains('on')) return; sheet.classList.remove('on'); sheetBg.classList.remove('on'); sheet.setAttribute('aria-hidden','true'); document.documentElement.classList.remove('locked'); const o=sheetOpener; sheetOpener=null; if(o&&document.body.contains(o)){ try{ o.focus({preventScroll:true}); }catch(e){} } }
const A=(href,txt)=>`<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;
function moreSheet(){ const c=cardById(V.id);
  showSheet(`<h3 id="sheetTitle">${esc(P(c.t))}\u00a0: ${L('the precise version','la version précise')}</h3>${c.more.map(p=>`<p class="small">${rich(P(p))}</p>`).join('')}
  <p class="small"><b>${L('How sure, picture by picture','Degré de certitude, image par image')}</b></p><ul class="small">${c.f.map((f,k)=>`<li>${k+1}. ${esc(P(f[0]))}\u00a0: ${P(GRADE[f[2]])}</li>`).join('')}</ul>
  <p class="small"><b>${L('Sources','Sources')}</b></p><ol class="srcs">${c.src.map(k=>`<li>${A(SRC[k].u,esc(P(SRC[k].l)))}</li>`).join('')}</ol>
  ${c.drug?`<p class="small"><b>${P(RX)}</b></p>`:''}<p class="mine">${L('Bodies in general, not yours. Not advice.','Les corps en général, pas le tien. Pas un conseil.')}</p>`); }
function menuSheet(){ const b=(act,l,cls)=>`<button type="button" data-act="${act}"${cls?` class="${cls}"`:''}>${l}</button>`;
  showSheet(`<h3 id="sheetTitle">Menu</h3><div class="menu">${b('home',L('The six stops','Les six arrêts'))}${b('help',L('How to read a card','Comment lire une carte'))}${b('colours',L('What the colours mean','Ce que veulent dire les couleurs'))}${b('install',L('Install on this phone','Installer sur ce téléphone'),'inst')}${b('about',L('About and privacy','À propos et confidentialité'))}</div><p class="small muted" style="margin:12px 0 0">v${VER}</p>`); }
function helpSheet(){ const H2=(a,b)=>`<p class="small"><b>${a}</b> ${b}</p>`;
  showSheet(`<h3 id="sheetTitle">${L('How to read a card','Comment lire une carte')}</h3>`
  +H2(L('One idea per picture.','Une idée par image.'),L('Each picture changes one thing from the one before. Tap Next when it’s clear, Back to see it again. A swipe works too.','Chaque image change une seule chose par rapport à la précédente. Appuie sur Suivant quand c’est clair, sur Retour pour la revoir. Glisser le doigt marche aussi.'))
  +H2(L('Plain words first.','Les mots simples d’abord.'),L('The specialist’s term follows in grey brackets, the first time a word comes up, so it’s familiar if a specialist ever uses it.','Le terme du spécialiste suit entre parenthèses grises, la première fois qu’un mot apparaît, pour le reconnaître si un spécialiste l’utilise un jour.'))
  +H2(L('How sure.','Degré de certitude.'),P(GRADEL.solid)+' '+P(GRADEL.likely))
  +H2(L('The precise version.','La version précise.'),L('Under each card: what the pictures simplify, and every source, to open and check.','Sous chaque carte\u00a0: ce que les images simplifient, et chaque source, à ouvrir et à vérifier.'))
  +H2(L('Bodies in general.','Les corps en général.'),L('The cards describe how bodies work. They don’t say what is happening in yours.','Les cartes décrivent comment les corps fonctionnent. Elles ne disent pas ce qui se passe dans le tien.'))); }
function coloursSheet(){ showSheet(`<h3 id="sheetTitle">${L('What the colours mean','Ce que veulent dire les couleurs')}</h3><p class="small">${L('The same colour means the same thing on every card.','La même couleur veut dire la même chose sur chaque carte.')}</p><ul class="cols">${COLOURS.map(([k,p])=>`<li><span class="sw" style="background:${C[k]}"></span>${rich(P(p))}</li>`).join('')}</ul>`); }
function aboutSheet(){ showSheet(`<h3 id="sheetTitle">${L('About and privacy','À propos et confidentialité')}</h3>
  <p class="small">${L('<b>Made by Tobie and Claude.</b> Free version at ','<b>Créé par Tobie et Claude.</b> Version gratuite à ')}${A('https://v3ktor.org/library/app/','v3ktor.org/library/app')}. © 2026 Tobie David.</p>
  <p class="small">${L('Part of the V3KTOR Project. It teaches how bodies work in general, in pictures. It isn’t medical, dietitian or pharmacist advice, and no clinician has reviewed it. Every card lists its sources and says how sure each picture is.','Fait partie du V3KTOR Project. Elle explique en images comment les corps fonctionnent en général. Ce n’est pas un avis médical, diététique ou de pharmacien, et aucun clinicien ne l’a examinée. Chaque carte donne ses sources et dit à quel point chaque image est sûre.')}</p>
  <p class="small">${L('Provided as-is, without warranty of any kind. The app keeps three things in this browser’s storage on this phone: your language, that you agreed, and which cards you read to the end. Nothing is sent anywhere.','Fourni tel quel, sans garantie d’aucune sorte. L’app garde trois choses dans le stockage de ce navigateur sur ce téléphone\u00a0: ta langue, ton accord, et les cartes lues jusqu’au bout. Rien n’est envoyé nulle part.')}</p>
  <p class="small">${L('Free software under the ','Logiciel libre sous la ')}${A('https://github.com/tobiedavid/v3ktor.org/blob/main/LICENSE',L('GNU Affero General Public License','licence publique générale GNU Affero'))}${L(', version 3 or later. Source code: ',', version 3 ou ultérieure. Code source\u00a0: ')}${A('https://github.com/tobiedavid/v3ktor.org','github.com/tobiedavid/v3ktor.org')}</p>
  <p class="small">${L('Look copied from the Threshold Log and the Food Trial Log.','Apparence tirée du Threshold Log et du Food Trial Log.')}</p><p class="small muted">v${VER}</p>`); }

/* ---------- install: the same pill, button and steps as the other apps ---------- */
const SHARE='<svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M7 11H5v10h14V11h-2"/></svg>';
const pillHTML=()=>`<span>${L('Install the Library on this phone','Installer la Bibliothèque sur ce téléphone')}</span><button type="button" class="ipy" data-act="install">${L('Install','Installer')}</button><button type="button" class="ipn" data-act="instno" aria-label="${L('No thanks','Non merci')}">✕</button>`;
function installPill(){ if(FRAMED||STANDALONE||document.getElementById('installPill')) return; try{ if(localStorage.getItem(KEY+'.noinst')) return; }catch(e){ return; }
  const b=document.createElement('div'); b.id='installPill'; b.innerHTML=pillHTML(); document.body.appendChild(b); }
function installSheet(){ const icon=`<li>${L('From now on, open the app from its icon.','À partir de maintenant, ouvre l’app par son icône.')}</li>`;
  const iph=`<ol class="inst">${SAFARI?'':`<li>${L('Open this page in <b>Safari</b>.','Ouvre cette page dans <b>Safari</b>.')}</li>`}<li>${L('Tap <b>⋯</b> beside the address bar, then <b>Share</b>. No <b>⋯</b>? Tap the Share button','Appuie sur <b>⋯</b> à côté de la barre d’adresse, puis sur <b>Partager</b>. Pas de <b>⋯</b>? Appuie sur le bouton Partager')} ${SHARE}.</li><li>${L('Scroll down the list and tap <b>Add to Home Screen</b>.','Descends dans la liste et choisis <b>Sur l’écran d’accueil</b>.')}</li><li>${L('Tap <b>Add</b>.','Appuie sur <b>Ajouter</b>.')}</li>${icon}</ol>`;
  const and=`<ol class="inst">${CHROME?'':`<li>${L('Open this page in <b>Chrome</b>.','Ouvre cette page dans <b>Chrome</b>.')}</li>`}<li>${L('Tap the <b>⋮</b> menu at the top right.','Appuie sur le menu <b>⋮</b> en haut à droite.')}</li><li>${L('Tap <b>Add to Home screen</b>. On some phones it says <b>Install app</b>.','Appuie sur <b>Ajouter à l’écran d’accueil</b>. Sur certains téléphones, c’est écrit <b>Installer l’application</b>.')}</li><li>${L('Tap <b>Install</b>.','Appuie sur <b>Installer</b>.')}</li>${icon}</ol>`;
  showSheet(`<h3 id="sheetTitle">${L('Install on this phone','Installer sur ce téléphone')}</h3><p class="small">${L('The app gets its own icon on your phone and opens without a connection. There is no store and no account.','L’app a sa propre icône sur ton téléphone et s’ouvre sans connexion. Pas de boutique d’applications, pas de compte.')}</p>${IOS?iph:ANDROID?and:`<p><b>iPhone</b></p>${iph}<p><b>Android</b></p>${and}`}`); }

/* ---------- actions: one delegated handler ---------- */
const ACT={
  close:()=>closeSheet(), menu:()=>menuSheet(), about:()=>aboutSheet(), help:()=>helpSheet(), colours:()=>coloursSheet(), more:()=>moreSheet(),
  home:()=>{ closeSheet(); go({v:'home'}); },
  lang:b=>{ S.lang=b.dataset.v; const was=sheet.classList.contains('on'); closeSheet(); render(); if(was) toast(L('Language changed','Langue changée')); },
  enter:()=>{ S.ack=true; S.ackAt=new Date().toISOString(); S.cv=CONSENT; render(); },
  sec:b=>{ closeSheet(); go({v:'sec',id:b.dataset.v}); },
  card:b=>{ closeSheet(); go({v:'card',id:b.dataset.v,i:0}); },
  next:()=>step(1), prev:()=>step(-1),
  install:()=>{ closeSheet(); const p=window.INSTALL; if(p){ p.prompt(); p.userChoice.then(()=>{ window.INSTALL=null; }).catch(()=>{}); } else installSheet(); },
  instno:()=>{ try{ localStorage.setItem(KEY+'.noinst','1'); }catch(e){} const pill=document.getElementById('installPill'); if(pill) pill.remove(); render(); }
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const f=ACT[b.dataset.act]; if(!f) return; e.preventDefault(); f(b,e); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); return; }
  const st=e.target.closest&&e.target.closest('.stop'); if(st&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); ACT.sec(st); return; }
  if(sheet.classList.contains('on')||!S.ack||V.v!=='card') return; if(e.target.closest('input,textarea,select')) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); step(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); step(-1); } });
sheetBg.addEventListener('click',closeSheet);
/* a swipe on the picture moves one picture */
let sx=null, sy=null;
app.addEventListener('touchstart',e=>{ if(!e.target.closest('.pic')) return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
app.addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5) step(dx<0?1:-1); });
/* the browser's Back button follows the screens: a card's address is #its-name, so the other apps can link straight to one */
window.addEventListener('popstate',()=>{ closeSheet(); V=fromHash(); render(); });
V=fromHash(); render(); installPill();
</script>
<script>
/* installed-app layer */
(function(){
  try{ if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){ navigator.serviceWorker.register('sw.js').catch(function(){}); } }catch(e){ /* a sandboxed preview has no service worker */ }
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); window.INSTALL=e; installPill(); });
  window.addEventListener('appinstalled',function(){ window.INSTALL=null; document.documentElement.classList.add('noinst'); });
})();
</script>
